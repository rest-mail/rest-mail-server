server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (applied to every response) ─────────────────────
    # The frontend is a same-origin SPA that loads only its own bundle and
    # talks only to the same-origin API/SSE. #257 moved auth to same-origin
    # httpOnly cookies, so connect-src 'self' covers every fetch/XHR/
    # EventSource. Scripts stay strict ('self', no unsafe-inline/unsafe-eval);
    # 'unsafe-inline' is granted for styles only, which React inline style
    # attributes and runtime component-injected <style> genuinely require and
    # which cannot be nonced. Fonts are self-hosted (font-src 'self'). Untrusted
    # email HTML is rendered in a sandboxed srcdoc iframe with its own stricter
    # CSP (see HtmlMessageBody), so the app shell only needs frame-src 'self'.
    # These are inherited by the location blocks below (none set add_header).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Serve the SPA under the configured base path.
    # __BASE_PATH__ is replaced at container start by docker-entrypoint.sh.
    # ^~ prevents regex locations from overriding this prefix match.
    # alias strips the location prefix when resolving files, so
    # /webmail/assets/x.js resolves to /usr/share/nginx/html/assets/x.js.
    location ^~ __BASE_PATH__ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ __BASE_PATH__index.html;
    }

    # Redirect base path without trailing slash to add it
    location = __BASE_PATH_NOSLASH__ {
        return 301 __BASE_PATH__;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
