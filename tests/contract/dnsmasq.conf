# The contract run's own DNS, a testbed dnsmasq fragment (#1385).
#
# chore contract:dns:register copies it into the testbed's fragments volume, as
# every consumer of the testbed registers what it needs. The own-data hooks in
# hooks.py use these names, so their mail depends on nothing outside the
# testbed: test_hooks_suppression_dmarc_clean_start checks the two agree.

# A sender of DMARC aggregate reports (getDmarcReport's 200). Mail from it
# passes SPF only from 192.0.2.25 (RFC 5737 documentation space; no host
# connects, deliverMessage is told the client), aligned with the From domain,
# and its DMARC record rejects anything else.
txt-record=dmarc-sender.test,"v=spf1 ip4:192.0.2.25 -all"
txt-record=_dmarc.dmarc-sender.test,"v=DMARC1; p=reject"

# .invalid never exists (RFC 6761 §6.4): answered NXDOMAIN here, never
# forwarded, so mail to it bounces with no mail host (clearSuppression's 204).
local=/invalid/
