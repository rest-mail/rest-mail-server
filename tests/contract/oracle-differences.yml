- operation: retryQueueEntry
  difference: "response 400: generated only"
  reason: Retry still refuses entries outside pending or deferred with 400 bad_request and the original message; this state-based refusal is not a binding error.
- operation: getQueueStats
  difference: 'response 200 application/json.properties.data.properties.*.format: openapi.yaml absent, generated "int64"'
  reason: Counts are int64 in Go; their JSON representation remains an integer.
- operation: getQueueStats
  difference: 'response 200 application/json.properties.data.properties.delivering: openapi.yaml absent, generated {"format":"int64","type":"integer"}'
  reason: The existing handler includes delivering when entries have that status; the oracle omits this optional counter.
- operation: getQueueStats
  difference: 'response 200 application/json.properties.data.properties.expired: openapi.yaml absent, generated {"format":"int64","type":"integer"}'
  reason: The existing handler includes expired when entries have that status; the oracle omits this optional counter.
