- operation: createCertificate
  difference: "response 201 application/json.properties.data.properties.domain: openapi.yaml absent, generated {\"additionalProperties\":false,\"properties\":{\"active\":{\"type\":\"boolean\"},\"created_at\":{\"format\":\"date-time\",\"type\":\"string\"},\"default_quota_bytes\":{\"format\":\"int64\",\"type\":\"integer\"},\"dkim_selector\":{\"type\":\"string\"},\"id\":{\"type\":\"integer\"},\"name\":{\"type\":\"string\"},\"sending_policy\":{\"enum\":[\"\",\"bulk\",\"transactional\"],\"type\":\"string\"},\"server_type\":{\"enum\":[\"restmail\",\"traditional\"],\"type\":\"string\"},\"updated_at\":{\"format\":\"date-time\",\"type\":\"string\"}},\"required\":[\"active\",\"created_at\",\"default_quota_bytes\",\"dkim_selector\",\"id\",\"name\",\"sending_policy\",\"server_type\",\"updated_at\"],\"type\":\"object\"}"
  reason: Certificate list and upload already return their preloaded public domain association. The API now owns this type, with no certificate or domain private keys; the oracle omits the association.
- operation: createCertificate
  difference: "response 404: generated only"
  reason: Uploading for a domain that does not exist returns 404 not_found, as the handler already did.
- operation: getCertificate
  difference: "response 200 application/json.properties.data.allOf: openapi.yaml [{\"properties\":{\"auto_renew\":{\"type\":\"boolean\"},\"created_at\":{\"format\":\"date-time\",\"type\":\"string\"},\"domain_id\":{\"type\":\"integer\"},\"id\":{\"type\":\"integer\"},\"issuer\":{\"type\":\"string\"},\"not_after\":{\"format\":\"date-time\",\"type\":\"string\"},\"not_before\":{\"format\":\"date-time\",\"type\":\"string\"},\"updated_at\":{\"format\":\"date-time\",\"type\":\"string\"}},\"required\":[\"auto_renew\",\"created_at\",\"domain_id\",\"id\",\"issuer\",\"not_after\",\"not_before\",\"updated_at\"],\"type\":\"object\"},{\"properties\":{\"cert_pem\":{\"type\":\"string\"}},\"required\":[\"cert_pem\"],\"type\":\"object\"}], generated absent"
  reason: The API details type describes the existing flat certificate response, including its public PEM and preloaded public domain association. The oracle uses allOf and omits the domain; timestamps retain their existing RFC3339 second precision.
- operation: getCertificate
  difference: "response 200 application/json.properties.data.properties: openapi.yaml absent, generated {\"auto_renew\":{\"type\":\"boolean\"},\"cert_pem\":{\"type\":\"string\"},\"created_at\":{\"format\":\"date-time\",\"type\":\"string\"},\"domain\":{\"additionalProperties\":false,\"properties\":{\"active\":{\"type\":\"boolean\"},\"created_at\":{\"format\":\"date-time\",\"type\":\"string\"},\"default_quota_bytes\":{\"format\":\"int64\",\"type\":\"integer\"},\"dkim_selector\":{\"type\":\"string\"},\"id\":{\"type\":\"integer\"},\"name\":{\"type\":\"string\"},\"sending_policy\":{\"enum\":[\"\",\"bulk\",\"transactional\"],\"type\":\"string\"},\"server_type\":{\"enum\":[\"restmail\",\"traditional\"],\"type\":\"string\"},\"updated_at\":{\"format\":\"date-time\",\"type\":\"string\"}},\"required\":[\"active\",\"created_at\",\"default_quota_bytes\",\"dkim_selector\",\"id\",\"name\",\"sending_policy\",\"server_type\",\"updated_at\"],\"type\":\"object\"},\"domain_id\":{\"type\":\"integer\"},\"id\":{\"type\":\"integer\"},\"issuer\":{\"type\":\"string\"},\"not_after\":{\"format\":\"date-time\",\"type\":\"string\"},\"not_before\":{\"format\":\"date-time\",\"type\":\"string\"},\"updated_at\":{\"format\":\"date-time\",\"type\":\"string\"}}"
  reason: The API details type describes the existing flat certificate response, including its public PEM and preloaded public domain association. The oracle uses allOf and omits the domain; timestamps retain their existing RFC3339 second precision.
- operation: getCertificate
