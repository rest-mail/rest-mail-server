- operation: createCertificate
  difference: "request body application/json.properties.cert_pem.minLength: openapi.yaml absent, generated 1"
  reason: Binding enforces the existing required positive domain ID and nonempty PEM fields; broken field rules now answer 422 before lookup.
- operation: createCertificate
