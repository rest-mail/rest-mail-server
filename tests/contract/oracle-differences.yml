- operation: listAuditEntries
  difference: "response 200 application/json.required: openapi.yaml [\"data\",\"pagination\"], generated [\"data\"]"
  reason: >-
    The shared endpoint.List envelope has an optional pointer to pagination and therefore describes it as nullable and optional. This handler always supplies its pagination object, preserving the existing response.
- operation: listBans
  difference: "parameter query active schema.enum: openapi.yaml absent, generated [\"false\",\"true\"]"
  reason: >-
    The query accepts exactly the strings true and false, refusing other spellings and empty values. A string enum preserves that existing rule instead of Go boolean parsing, which also accepts 1, TRUE and other forms.
- operation: listBans
  difference: "parameter query active schema.type: openapi.yaml \"boolean\", generated \"string\""
  reason: >-
    The query accepts exactly the strings true and false, refusing other spellings and empty values. A string enum preserves that existing rule instead of Go boolean parsing, which also accepts 1, TRUE and other forms.
- operation: listBans
  difference: "parameter query limit schema.default: openapi.yaml 50, generated absent"
  reason: >-
    go-oapifly does not describe defaults yet. The handler retains its existing default of 50 entries.
- operation: listBans
  difference: "parameter query offset schema.default: openapi.yaml 0, generated absent"
  reason: >-
    go-oapifly does not describe defaults yet. The handler retains its existing default of 0 for offset.
- operation: listBans
  difference: "response 200 application/json.properties.pagination.required: openapi.yaml absent, generated [\"has_more\"]"
  reason: >-
    Pagination always writes has_more, including false; cursor and total retain their existing omitempty behavior.
- operation: listBans
  difference: "response 200 application/json.properties.pagination.type: openapi.yaml \"object\", generated [\"null\",\"object\"]"
  reason: >-
    The shared endpoint.List envelope has an optional pointer to pagination and therefore describes it as nullable and optional. This handler always supplies its pagination object, preserving the existing response.
- operation: unbanIP
  difference: "parameter path ip schema.minLength: openapi.yaml absent, generated 1"
  reason: >-
    The IP path segment must be nonempty. Binding now states and enforces the existing required-address rule with a field-specific 422.
- operation: verifyAuditLog
  difference: "parameter query anchor schema.pattern: openapi.yaml \"^[1-9][0-9]{0,17}:[0-9a-fA-F]{64}$\", generated \"^$|^[1-9][0-9]{0,17}:[0-9a-fA-F]{64}$\""
  reason: >-
    An empty anchor has always meant an unanchored chain check. The type explicitly permits empty, while preserving the positive sequence and 64 hexadecimal digit constraint for a supplied anchor.
- operation: verifyAuditLog
  difference: "response 200 application/json.properties.data.properties.anchor.type: openapi.yaml \"object\", generated [\"null\",\"object\"]"
  reason: >-
    The audit verification result uses optional pointer fields. go-oapifly describes their nullable Go types; the existing omitempty tags omit them when unset.
- operation: verifyAuditLog
  difference: "response 200 application/json.properties.data.properties.broken_at_seq.type: openapi.yaml \"integer\", generated [\"integer\",\"null\"]"
  reason: >-
    The audit verification result uses optional pointer fields. go-oapifly describes their nullable Go types; the existing omitempty tags omit them when unset.
- operation: getDashboardStats
  difference: 'response 200 application/json.properties.data.properties.recentActivity.type: openapi.yaml "array", generated ["array","null"]'
  reason: >-
    With no recent activity the dashboard has always written null. A pointer to the
    slice preserves that response through endpoint registration; populated activity
    remains an array and all camelCase names remain unchanged.

