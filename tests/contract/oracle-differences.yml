- operation: listAuditEntries
  difference: "parameter query outcome schema.enum: openapi.yaml [\"denied\",\"error\",\"failed\",\"success\"], generated [\"\",\"denied\",\"error\",\"failed\",\"success\"]"
  reason: >-
