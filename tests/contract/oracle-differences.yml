- operation: "*"
  difference: "request body application/json.properties.expires_at.type: openapi.yaml \"string\", generated [\"null\",\"string\"]"
  reason: An expires_at of null means no expiry (an app password) or the default (an API key), as it always did.
- operation: "*"
  difference: "request body application/json.properties.name.maxLength: openapi.yaml 100, generated absent"
  reason: >-
    The handler trims the name before counting its characters, so a name of 100 characters
    with surrounding blanks is accepted; it answers the documented 422 on name.
- operation: createAppPassword
