  difference: "request body application/json.properties.cert_pem.minLength: openapi.yaml absent, generated 1"
  reason: Binding enforces the existing required positive domain ID and nonempty PEM fields; broken field rules now answer 422 before lookup.
- operation: createCertificate
  difference: "request body application/json.properties.domain_id.minimum: openapi.yaml absent, generated 1"
  reason: Binding enforces the existing required positive domain ID and nonempty PEM fields; broken field rules now answer 422 before lookup.
- operation: createCertificate
  difference: "request body application/json.properties.key_pem.minLength: openapi.yaml absent, generated 1"
  reason: Binding enforces the existing required positive domain ID and nonempty PEM fields; broken field rules now answer 422 before lookup.
- operation: createCertificate
  difference: "response 201 application/json.properties.data.properties.domain: openapi.yaml absent, generated {\"additionalProperties\":false,\"properties\":{\"active\":{\"type\":\"boolean\"},\"created_at\":{\"format\":\"date-time\",\"type\":\"string\"},\"default_quota_bytes\":{\"format\":\"int64\",\"type\":\"integer\"},\"dkim_selector\":{\"type\":\"string\"},\"id\":{\"type\":\"integer\"},\"name\":{\"type\":\"string\"},\"sending_policy\":{\"enum\":[\"\",\"bulk\",\"transactional\"],\"type\":\"string\"},\"server_type\":{\"enum\":[\"restmail\",\"traditional\"],\"type\":\"string\"},\"updated_at\":{\"format\":\"date-time\",\"type\":\"string\"}},\"required\":[\"active\",\"created_at\",\"default_quota_bytes\",\"dkim_selector\",\"id\",\"name\",\"sending_policy\",\"server_type\",\"updated_at\"],\"type\":\"object\"}"
