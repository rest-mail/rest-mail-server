- operation: setMtaStsPolicy
  difference: "response 20* application/json.properties.data.required: openapi.yaml [\"active\",\"domain_id\",\"id\",\"max_age\",\"mode\"], generated [\"active\",\"created_at\",\"domain_id\",\"id\",\"max_age\",\"mode\",\"mx_hosts\",\"updated_at\"]"
  reason: >-
    Policy JSON always includes mx_hosts, created_at and updated_at, including their zero values;
    the oracle incorrectly marks them optional.
- operation: setMtaStsPolicy
  difference: "response 400: generated only"
  reason: >-
