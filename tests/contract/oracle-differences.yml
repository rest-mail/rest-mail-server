- operation: getQueueEntry
  difference: "response 200 application/json.properties.data.properties.body_type: openapi.yaml absent, generated {\"type\":\"string\"}"
  reason: The API has always returned body_type from the outbound queue row. The oracle omitted this field.
- operation: getQueueEntry
  difference: "response 200 application/json.properties.data.required: openapi.yaml [\"attempts\",\"created_at\",\"domain\",\"expires_at\",\"id\",\"max_retries\",\"next_attempt\",\"recipient\",\"sender\",\"status\"], generated [\"attempts\",\"body_type\",\"created_at\",\"domain\",\"expires_at\",\"failure_category\",\"id\",\"last_attempt\",\"last_error\",\"last_error_code\",\"max_retries\",\"message_id\",\"next_attempt\",\"recipient\",\"sender\",\"status\"]"
  reason: Every queue entry always serializes these fields, including nullable message_id and last_attempt and empty error fields. The oracle marks some of them optional.
- operation: listQueue
  difference: "parameter query limit schema.default: openapi.yaml 50, generated absent"
  reason: go-oapifly does not emit defaults. The handler preserves limit 50 and offset 0 when omitted, and the existing fallback for numeric values outside the pagination range.
- operation: listQueue
  difference: "parameter query offset schema.default: openapi.yaml 0, generated absent"
  reason: go-oapifly does not emit defaults. The handler preserves limit 50 and offset 0 when omitted, and the existing fallback for numeric values outside the pagination range.
- operation: listQueue
  difference: "response 200 application/json.properties.data.properties.items.items.properties.body_type: openapi.yaml absent, generated {\"type\":\"string\"}"
  reason: The API has always returned body_type from the outbound queue row. The oracle omitted this field.
- operation: listQueue
