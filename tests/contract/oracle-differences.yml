# Accounts, app passwords and API keys (#635, #618)

- operation: "*"
  difference: "response 2* application/json.properties.data*address.format: openapi.yaml \"email\", generated absent"
  reason: >-
    An account's address is the stored mailbox address, which may be internationalised
    (EAI). The API's account type does not claim the email format for it.
- operation: createAccount
  difference: "request body application/json.properties.address.format: openapi.yaml \"email\", generated absent"
  reason: >-
    The handler checks the address with REST Mail's own mailbox-address rule (EAI local parts
    included) and answers the documented 422 on address; binding's email format would refuse
    addresses the server accepts.
- operation: createAccount
  difference: "request body application/json.properties.password.minLength: openapi.yaml 12, generated absent"
  reason: >-
    An empty password means the account has none (#341), so the handler checks the length of
    a password that is given and answers 422 on password.
- operation: linkAccount
  difference: "request body application/json.properties.address.format: openapi.yaml \"email\", generated absent"
  reason: >-
    A wrong address is refused like a wrong password (403 invalid_credentials) so that linking
    says nothing about which addresses exist.
- operation: "*"
  difference: "request body application/json.properties.password.format: openapi.yaml \"password\", generated absent"
  reason: >-
    The password fields are plain strings to the code; the password format is a hint for
    documentation and clients only.
- operation: "*"
  difference: "request body application/json.properties.password.writeOnly: openapi.yaml true, generated absent"
  reason: The current password is a request field only; no response type has one to mark.
- operation: createAccount
  difference: "response 400: generated only"
  reason: Binding answers 400 bad_request for a body that is not JSON or not an object, as the handler did.
- operation: linkAccount
  difference: "response 400: generated only"
  reason: Binding answers 400 bad_request for a body that is not JSON or not an object, as the handler did.
- operation: createAppPassword
  difference: "response 400: generated only"
  reason: Binding answers 400 bad_request for a body that is not JSON or not an object, as the handler did.
- operation: "*"
  difference: "response 4* application/json: generated only"
  reason: >-
    Every refusal carries the error envelope; openapi.yaml describes some of these responses
    by their code without the body.
- operation: "*"
  difference: "response 429 header Retry-After: generated only"
  reason: >-
    Login's throttle, and the mail routes' throttle on refused HTTP Basic credentials, write
    Retry-After on every 429. openapi.yaml does not state it for these operations.
- operation: getAccount
  difference: "response 429: generated only"
  reason: The mail routes throttle refused HTTP Basic credentials at login's rate (429 rate_limited).
- operation: listAccounts
  difference: "response 429: generated only"
  reason: The mail routes throttle refused HTTP Basic credentials at login's rate (429 rate_limited).
- operation: listAccounts
  difference: "response 404: generated only"
