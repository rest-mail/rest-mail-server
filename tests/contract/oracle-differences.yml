# Accepted differences between the description generated from the code and openapi.yaml
# (#671), each with its reason. TestGeneratedDescriptionMatchesOracle (internal/api) fails on
# any other difference, and on an entry here that no longer occurs. operation is an
# operationId, or * for every operation; * in a difference matches any run of characters.

# Every operation registered with endpoint.Register

- operation: "*"
  difference: "*additionalProperties: openapi.yaml absent, generated false"
  reason: >-
    Every struct is closed (go-oapifly#30, #658): a response cannot carry a field it does not
    declare, and binding refuses a request with an unknown one. openapi.yaml leaves its
    objects open.
- operation: "*"
  difference: "response 401: generated only"
  reason: >-
    The admin group's authentication answers 401 unauthorized for no token, a bad one, or a
    session that has ended (go-oapifly#25). openapi.yaml documents few middleware answers.
- operation: "*"
  difference: "response 403: generated only"
  reason: >-
    The setup check, the CSRF check and the capability check answer 403 setup_required,
    csrf_failed and forbidden before the handler runs.
- operation: "*"
  difference: "response 413: generated only"
  reason: >-
    The admin group's body cap answers 413 request_too_large, on any method, for a declared
    body over the cap.
- operation: "*"
  difference: "response 503: generated only"
  reason: The session and grants checks answer 503 unavailable when they cannot be made.
- operation: "*"
  difference: "response 500: generated only"
  reason: >-
    Every operation can fail inside, answering 500 internal_error. Not part of the contract:
    Vertrag reports any 5xx as a finding.
- operation: "*"
  difference: "response 422: generated only"
  reason: >-
    Binding refuses a path id that is 0 or not a number, or a limit or offset that is not one,
    with the 422 validation failure (#690). openapi.yaml documents no answer for them.
- operation: "*"
  difference: "response 422 application/json.properties.error.required: openapi.yaml [\"code\",\"message\"], generated [\"code\",\"details\",\"message\"]"
  reason: The validation failure always names its fields, so its details are always there.
- operation: "*"
  difference: "response 422 application/json.properties.error.properties.details.required: openapi.yaml absent, generated [\"fields\"]"
  reason: The validation failure always names its fields, so its details are always there.

# Domains (#645)

- operation: "*"
  difference: "response 2* application/json.properties.data*required: openapi.yaml [\"active\",\"created_at\",\"default_quota_bytes\",\"id\",\"name\",\"sending_policy\",\"server_type\",\"updated_at\"], generated [\"active\",\"created_at\",\"default_quota_bytes\",\"dkim_selector\",\"id\",\"name\",\"sending_policy\",\"server_type\",\"updated_at\"]"
  reason: >-
    A domain always carries dkim_selector, empty while it has no key, so it is required.
    openapi.yaml marks it optional.
- operation: listDomains
  difference: "parameter query limit: generated only"
  reason: >-
    The list reads limit (default 50, at most the list cap) and offset, as every admin list
    does. openapi.yaml does not document them for this one.
- operation: listDomains
  difference: "parameter query offset: generated only"
  reason: The list reads limit and offset, as every admin list does.
- operation: listDomains
  difference: "response 200 application/json.properties.pagination: openapi.yaml absent, generated *"
  reason: >-
    The list answers its pagination, as every list does (respond.List). openapi.yaml leaves it
    out of this one.
- operation: createDomain
  difference: "request body application/json.properties.default_quota_bytes.type: openapi.yaml \"integer\", generated [\"integer\",\"null\"]"
  reason: Null is accepted and means the default quota, as the handler always did.
- operation: createDomain
  difference: "request body application/json.properties.server_type.default: openapi.yaml \"traditional\", generated absent"
  reason: >-
    go-oapifly does not describe defaults yet. The handler's default for a server_type left
    out, empty or null is traditional.
- operation: updateDomain
  difference: "request body application/json.properties.*.type: openapi.yaml *, generated [*\"null\"*]"
  reason: Null leaves the field unchanged, as the handler always did.
- operation: updateDomain
  difference: "request body application/json.properties.sending_policy.enum: openapi.yaml [\"\",\"bulk\",\"transactional\"], generated [\"\",\"bulk\",\"transactional\",null]"
  reason: Null leaves the sending policy unchanged; an empty string clears it.
- operation: updateDomain
  difference: "response 400: generated only"
  reason: >-
    A body that is not JSON, or not an object, is the 400 bad_request. openapi.yaml documents
    the 422 only.

# Admin bans, delivery log, audit log and dashboard (#651)

- operation: createBan
  difference: "request body application/json.properties.duration.type: openapi.yaml \"string\", generated [\"null\",\"string\"]"
  reason: >-
    An omitted or null duration means a permanent ban, as the handler has always accepted. A non-null duration must satisfy the Go duration pattern and parse within its range.
- operation: createBan
  difference: "response 200: generated only"
  reason: >-
    Creating a ban for an already banned IP replaces its reason, protocol, creator and expiry and returns 200; a newly inserted ban returns 201. Both existing statuses are preserved.
- operation: createBan
  difference: "response 400: generated only"
  reason: >-
    A body that is not JSON or is not an object is refused as 400 bad_request before binding its fields. The oracle only documents validation failures.
- operation: deleteBan
  difference: "response 404: openapi.yaml only"
  reason: >-
    Deleting a nonexistent ban ID is idempotent and returns 204. The handler does not check RowsAffected and has no reachable 404.
- operation: getDashboardStats
  difference: "response 200 application/json.properties.data.properties.inboundTransportSecurity.properties.plaintextPercent.format: openapi.yaml absent, generated \"double\""
  reason: >-
    The percentages are float64 values, described as double. Their JSON remains a number with the existing camelCase field names.
- operation: getDashboardStats
  difference: "response 200 application/json.properties.data.properties.inboundTransportSecurity.properties.tlsPercent.format: openapi.yaml absent, generated \"double\""
  reason: >-
    The percentages are float64 values, described as double. Their JSON remains a number with the existing camelCase field names.
- operation: getDashboardStats
  difference: "response 200 application/json.properties.data.properties.inboundTransportSecurity.required: openapi.yaml absent, generated [\"overTLS\",\"plaintext\",\"plaintextAuthFail\",\"plaintextAuthPass\",\"plaintextPercent\",\"tlsPercent\",\"totalInboundMX\"]"
  reason: >-
    The dashboard always serializes every field of this object, including zero counts and empty strings. The oracle leaves these nested fields optional.
- operation: getDashboardStats
  difference: "response 200 application/json.properties.data.properties.messageVolume.items.required: openapi.yaml absent, generated [\"count\",\"date\"]"
  reason: >-
    The dashboard always serializes every field of this object, including zero counts and empty strings. The oracle leaves these nested fields optional.
- operation: getDashboardStats
  difference: "response 200 application/json.properties.data.properties.recentActivity.items.required: openapi.yaml absent, generated [\"description\",\"id\",\"timestamp\",\"type\"]"
  reason: >-
    The dashboard always serializes every field of this object, including zero counts and empty strings. The oracle leaves these nested fields optional.
- operation: getDeliveryLogs
  difference: "parameter query limit schema.default: openapi.yaml 50, generated absent"
  reason: >-
    go-oapifly does not describe defaults yet. The handler retains its existing default of 50 entries.
- operation: getDeliveryLogs
  difference: "parameter query offset schema.default: openapi.yaml 0, generated absent"
  reason: >-
    go-oapifly does not describe defaults yet. The handler retains its existing default of 0 for offset.
- operation: getDeliveryLogs
  difference: "response 200 application/json.properties.data.items.properties.body_type: openapi.yaml absent, generated {\"type\":\"string\"}"
  reason: >-
    The delivery log already writes body_type, the SMTP BODY parameter persisted on each queue entry. The oracle omits this existing field; raw_message remains private.
- operation: getDeliveryLogs
  difference: "response 200 application/json.properties.data.items.required: openapi.yaml [\"attempts\",\"created_at\",\"domain\",\"expires_at\",\"id\",\"max_retries\",\"next_attempt\",\"recipient\",\"sender\",\"status\"], generated [\"attempts\",\"body_type\",\"created_at\",\"domain\",\"expires_at\",\"failure_category\",\"id\",\"last_attempt\",\"last_error\",\"last_error_code\",\"max_retries\",\"message_id\",\"next_attempt\",\"recipient\",\"sender\",\"status\"]"
  reason: >-
    The delivery log already emits body_type, failure_category, last_attempt, last_error, last_error_code and message_id on every item; nullable ids and times are explicit null. The API type retains the original JSON tags.
- operation: getDeliveryLogs
  difference: "response 200 application/json.properties.pagination.required: openapi.yaml absent, generated [\"has_more\"]"
  reason: >-
    Pagination always writes has_more, including false; cursor and total retain their existing omitempty behavior.
- operation: getDeliveryLogs
  difference: "response 200 application/json.properties.pagination.type: openapi.yaml \"object\", generated [\"null\",\"object\"]"
  reason: >-
    The shared endpoint.List envelope has an optional pointer to pagination and therefore describes it as nullable and optional. This handler always supplies its pagination object, preserving the existing response.
- operation: listAuditEntries
  difference: "parameter query actor_kind schema.enum: openapi.yaml [\"account\",\"anonymous\",\"system\"], generated [\"\",\"account\",\"anonymous\",\"system\"]"
  reason: >-
    An empty actor_kind or outcome has always meant no filter. The request type explicitly permits it alongside the documented nonempty values.
- operation: listAuditEntries
  difference: "parameter query limit schema.default: openapi.yaml 50, generated absent"
