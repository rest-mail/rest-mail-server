# Faults the contract run must catch (#654). Each entry breaks the API in one
# known way, and the nightly `Contract faults` workflow
# (.github/workflows/contract-faults.yml, `chore contract:faults`) builds the API
# with it, runs the phase named here narrowed to the operation, and fails unless
# that phase turns red there. Adding a fault: tests/contract/README.md, "Fault
# catalogue".
#
#   name        the fault; its switch is internal/faultinject/fault_<name>.go
#   build_tags  how it is applied: the API is built with these Go build tags
#               (GOFLAGS=-tags=...). A normal build has neither tag, so it holds
#               no fault code.
#   operation   the operationId whose answer it breaks
#   path        that operation's path, which Vertrag's report names it by
#   phase       the witness phase (examples, body_cap, auth_throttle, secret_scan)
#   breaks      what a client would see
#   expected_failure  optional: text Vertrag's failure must hold, so the run
#               counts as catching the fault only when it fails for this reason
#   known_gap   optional: the issue saying why the run cannot catch it yet. It
#               then passes uncaught, and fails once caught.
faults:
  - name: discover_endpoint_renamed
    build_tags: faultinject,fault_discover_endpoint_renamed
    operation: restmailDiscover
    path: /.well-known/restmail
    phase: examples
    breaks: GET /.well-known/restmail answers without its required endpoint field (sent as url)

  - name: discover_wrong_media_type
    build_tags: faultinject,fault_discover_wrong_media_type
    operation: restmailDiscover
    path: /.well-known/restmail
    phase: examples
    breaks: GET /.well-known/restmail answers its JSON as text/plain

  - name: health_data_as_list
    build_tags: faultinject,fault_health_data_as_list
    operation: getHealth
    path: /api/health
    phase: examples
    breaks: GET /api/health answers its data object as an empty list

  - name: health_storage_ref_leaked
    build_tags: faultinject,fault_health_storage_ref_leaked
    operation: getHealth
    path: /api/health
    phase: examples
    breaks: GET /api/health answers with a storage_ref its data type does not declare
    expected_failure: "body: /data: additional properties 'storage_ref' not allowed"

  - name: accounts_list_null
    build_tags: faultinject,fault_accounts_list_null
    operation: listAccounts
    path: /api/v1/accounts
    phase: examples
    breaks: GET /api/v1/accounts answers its data list as null
    expected_failure: "body: /data: got null, want array"

  - name: health_status_created
    build_tags: faultinject,fault_health_status_created
    operation: getHealth
    path: /api/health
    phase: examples
    breaks: GET /api/health answers 201 instead of 200 without changing its JSON

  - name: discover_missing_status_ok
    build_tags: faultinject,fault_discover_missing_status_ok
    operation: restmailDiscover
    path: /.well-known/restmail
    phase: examples
    breaks: GET /.well-known/restmail answers an unhosted domain's 404 refusal with 200
    expected_failure: "statusCode: Expected status code '404', but got '200'."

  - name: login_validation_removed
    build_tags: faultinject,fault_login_validation_removed
    operation: login
    path: /api/v1/auth/login
    phase: examples
    breaks: POST /api/v1/auth/login answers a validation refusal with 200 instead of 422

  - name: login_body_cap_removed
    build_tags: faultinject,fault_login_body_cap_removed
    operation: login
    path: /api/v1/auth/login
    phase: body_cap
    breaks: The API body cap is disabled; oversized login bodies reach validation instead of receiving 413

  - name: login_rate_limit_disabled
    build_tags: faultinject,fault_login_rate_limit_disabled
    operation: login
    path: /api/v1/auth/login
    phase: auth_throttle
    breaks: The shared authentication throttle is disabled; repeated refused logins no longer receive 429

  - name: change_password_refusal_echoes_password
    build_tags: faultinject,fault_change_password_refusal_echoes_password
    operation: changeOwnPassword
    path: /api/v1/auth/password
    phase: secret_scan
    breaks: POST /api/v1/auth/password answers a wrong current password's 403 refusal with that password in its error message, which still fits the schema
    expected_failure: "answers the current_password sent in"
