  /api/v1/admin/mailboxes/{id}/invitation:
    post:
      summary: Invite an account to choose its first password
      description: For an active account created without credentials. The invitation
        lasts 15 minutes; issuing another invalidates the previous one. Only a hash
        is stored. Authenticator enrollment and server encryption must be enabled before
        invitations can be issued.
      operationId: inviteAccount
      tags:
      - 'Admin: Mailboxes'
      parameters:
      # Named, as are the responses they produce. The created id is a
      # placeholder: a hook invites a fresh account made without a password.
      # The fixture admin (1) has a password, so it cannot be invited.
      # Like the other path IDs, its 422 is not sent (#386).
      - name: id
        in: path
        required: true
        schema:
          minimum: 1
          type: integer
        examples:
