  # ═══════════════════════════════════════════════════════════════
  # Drafts
  # ═══════════════════════════════════════════════════════════════
  /api/v1/messages/draft:
    post:
      operationId: saveDraft
      tags: [Drafts]
      security:
        - CookieAuth: [mail:write]
        - BearerAuth: [mail:write]
        - BasicAuth: [mail:write]
      summary: Save a new draft
      description: >
        All draft fields are optional. Without `from`, the draft is saved in
        the signed-in account's mailbox with an empty sender. When `from` is
        supplied, the caller needs mail:write on that mailbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftRequest"
            examples:
              with_sender:
                value:
                  from: admin@restmail.test
                  to: [admin@restmail.test]
                  subject: Draft
                  body_text: Not sent yet.
              empty:
                summary: Start an empty draft in the signed-in account
                value: {}
      responses:
        "201":
          description: Draft saved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Message"
          links:
            updateDraft:
              operationId: updateDraft
              parameters:
                id: '$response.body#/data/id'

  /api/v1/messages/draft/{id}:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    put:
      operationId: updateDraft
      tags: [Drafts]
      security:
        - CookieAuth: [mail:write]
        - BearerAuth: [mail:write]
        - BasicAuth: [mail:write]
      summary: Update an existing draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDraftRequest"
            example:
              from: admin@restmail.test
              to: [admin@restmail.test]
              subject: Draft, edited
              body_text: Ready to send.
      responses:
        "200":
          description: Draft updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Message"
          links:
            sendDraft:
              operationId: sendDraft
              parameters:
                id: '$response.body#/data/id'
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/messages/draft/{id}/send:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    post:
      operationId: sendDraft
      tags: [Drafts]
      security:
        - CookieAuth: [mail:write, mail:send]
        - BearerAuth: [mail:write, mail:send]
        - BasicAuth: [mail:write, mail:send]
      summary: Send a saved draft
      responses:
        "201":
          description: Draft sent
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Message"
        "404":
          $ref: "#/components/responses/NotFound"

