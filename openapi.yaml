  /api/v1/auth/invitation:
    post:
      summary: Choose your first password with an invitation
      description: 'Redeems an invitation once, chooses a password of 12–72 bytes and
        signs in. The session can only finish authenticator enrollment until it is confirmed.
        Owner reset tokens cannot be used here. Native clients send client: native;
        browsers receive httpOnly session cookies.'
      operationId: acceptInvitation
      tags:
      - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/resetRequest'
            # Named, as are the responses they produce. A hook swaps the
            # accepted token for a fresh invitation; invalid_token's is unknown.
            examples:
              accepted:
                value:
                  token: supplied-by-contract-hook
                  password: the recipient chooses this password
                  client: native
              body_array:
                value: []
              invalid_token:
                value:
                  token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                  password: the recipient chooses this password
                  client: native
              invalid_field:
                value:
                  token: 3
                  password: the recipient chooses this password
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Data-loginResponse'
