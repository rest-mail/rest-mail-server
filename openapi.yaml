  # ═══════════════════════════════════════════════════════════════
  # Admin: Roles & Grants
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/roles:
    get:
      operationId: listRoles
      tags: ["Admin: Roles & Grants"]
      x-required-capability: users:read
      summary: List roles
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"

  /api/v1/admin/capabilities:
    get:
      operationId: listCapabilities
      tags: ["Admin: Roles & Grants"]
      x-required-capability: users:read
      summary: List capabilities
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Capability"

  /api/v1/admin/grants:
    get:
      operationId: listGrants
      tags: ["Admin: Roles & Grants"]
      x-required-capability: users:read
      summary: List grants, oldest first
      description: >-
        Every grant, active and eligible, or only one holder's, or only those
        at one scope (`scope=mailbox:chris@example.com`: who owns chris@). A
        holder is an account (`holder_kind` `account`, `holder_id` its id).
      parameters:
        - name: holder_kind
          in: query
          schema:
            type: string
            example: account
        - name: holder_id
          in: query
          schema:
            type: integer
        - name: scope
          in: query
          description: Only the grants at this scope, e.g. `mailbox:chris@example.com`
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Grant"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createGrant
      tags: ["Admin: Roles & Grants"]
      x-required-capability: users:write
      summary: Grant a role at a scope
      description: >-
        Needs a session that signed in with two-factor authentication (`403
        two_factor_required` otherwise), and the caller must hold every
        capability of the role at a scope covering the grant's (`403
        grant_exceeds_held` otherwise); superadmin at `*` may grant anything.
        An eligible grant does nothing until it is switched on. The change and
        its audit entry (`grants.create`) commit together.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGrantRequest"
      responses:
        "201":
          description: Granted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Grant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Not an admin holding users:write at `*`; a session without 2FA
            (two_factor_required); or a role beyond what the caller holds
            (grant_exceeds_held)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/grants/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    delete:
      operationId: deleteGrant
      tags: ["Admin: Roles & Grants"]
      x-required-capability: users:write
      summary: Remove a grant
      description: >-
        The same rules as granting: a 2FA session, and the caller must hold
        everything the grant gives, where it gives it. The last grant of `*`
        at `*` held by an active admin who can use it (active, or eligible with
        an authenticator to switch it on) cannot be removed (`409
        last_superadmin`). An activation of the grant still running ends
        with it (`grants.deactivate`). The change and its audit entries
        (`grants.delete`) commit together.
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not allowed (see createGrant)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The last superadmin grant (last_superadmin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/grants/mine:
    get:
      operationId: listMyGrants
      tags: ["Admin: Roles & Grants"]
      summary: The caller's own grants
      description: >-
        Every grant the signed-in admin holds, active and eligible, each with
        any activation running now and its time left: what a client needs to
        offer an "Escalate" button. Any admin may read its own; no capability
        is needed. Activations that ran out are recorded as expired
        (`grants.expire`) when this is read.
      responses:
        "200":
          description: The caller's grants, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Grant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not an admin, or an account still in setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/grants/{id}/activate:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: activateGrant
      tags: ["Admin: Roles & Grants"]
      summary: Switch one of your eligible grants on for a while
      description: >-
        Escalation (#346). The grant must be the caller's own (`404`
        otherwise) and eligible (`409 not_eligible` for an active one). It
        needs a fresh second factor in the body, a current `totp_code` or an
        unused `recovery_code`: a session that signed in with 2FA is not
        enough. No authenticator enrolled is `403 two_factor_required`; no
        code `403 totp_required`; a wrong one `403 totp_invalid` (403, not
        401: the session is still good). While switched on, the grant gives
        what an active one would, until `expires_at` (never past the grant's
        own expiry) or until switched off; a grant is switched on at most once
        at a time (`409 already_active`). The activation and its audit entry
        (`grants.activate`: who, which grant, the reason, start and end)
        commit together; a refused activation leaves a recovery code it was
        given unused. Throttled like sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateGrantRequest"
      responses:
        "201":
          description: Switched on
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/GrantEscalation"
        "400":
          description: Not a grant id (invalid_id), or a body that is not JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Not an admin; no authenticator (two_factor_required); no code
            (totp_required); or a wrong one (totp_invalid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Active, not eligible (not_eligible); already switched on (already_active); or the grant itself expired (grant_expired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Too many tries from this address; the same limit as sign-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/grants/{id}/deactivate:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: deactivateGrant
      tags: ["Admin: Roles & Grants"]
      summary: Switch one of your grants off before it runs out
      description: >-
        Ends the caller's own activation of the grant now (`404` for anyone
        else's grant, `409 not_active` when it is not switched on). Needs no
        second factor: it only takes access away. The end and its audit entry
        (`grants.deactivate`) commit together.
      responses:
        "200":
          description: Switched off
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/GrantEscalation"
        "400":
          description: Not a grant id (invalid_id), or a body that is not JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not an admin, or an account still in setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not switched on (not_active)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/grants/{id}/make-eligible:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: makeGrantEligible
      tags: ["Admin: Roles & Grants"]
      summary: Hold one of your active grants only when you switch it on
      description: >-
        Turns the caller's own active grant eligible: from then on it gives
        nothing until switched on. This is how the owner of a server set up
        before escalation, who holds `superadmin` always, chooses to hold it
        only when needed. Like activating, it needs a fresh `totp_code` or
        `recovery_code` (the same 403 codes), so nobody makes a grant eligible
        without being able to switch it on again. There is no way back to
        active for your own grant: that would be escalating for good. The
        change and its audit entry (`grants.make_eligible`) commit together.
        Throttled like sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreshSecondFactor"
      responses:
        "200":
          description: Now eligible
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/GrantEscalation"
        "400":
          description: Not a grant id (invalid_id), or a body that is not JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not an admin, or the second factor is missing or wrong (see activateGrant)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Eligible already (already_eligible)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many tries from this address; the same limit as sign-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Domains — DNS check
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/domains/{id}/dns:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: domainDNSCheck
      tags: ["Admin: Domains"]
      x-required-capability: domains:read
      summary: Live DNS record check (MX, SPF, DMARC, DKIM, MTA-STS) for a domain
      responses:
        "200":
          description: DNS check result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DNSCheckResult"
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════════
  # Admin: MTA-STS
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/domains/{id}/mta-sts:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getMtaStsPolicy
      tags: ["Admin: MTA-STS"]
      x-required-capability: domains:read
      summary: Get the MTA-STS policy for a domain
      responses:
        "200":
          description: MTA-STS policy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MTASTSPolicy"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: setMtaStsPolicy
      tags: ["Admin: MTA-STS"]
      x-required-capability: domains:write
      summary: Create or update the MTA-STS policy for a domain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMTASTSPolicyRequest"
      responses:
        "200":
          description: Policy updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MTASTSPolicy"
        "201":
          description: Policy created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MTASTSPolicy"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteMtaStsPolicy
      tags: ["Admin: MTA-STS"]
      x-required-capability: domains:write
      summary: Delete the MTA-STS policy for a domain
      responses:
        "204":
          description: Policy deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════════
  # Admin: TLS Reports
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/tls-reports:
    get:
      operationId: listTlsReports
      tags: ["Admin: TLS Reports"]
      x-required-capability: domains:read
      summary: List received TLS-RPT reports
      parameters:
        - name: domain_id
          in: query
          schema:
            type: integer
        - name: policy_type
          in: query
          schema:
            type: string
            enum: [sts, tlsa, no-policy]
        - name: reporting_org
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: TLS-RPT reports
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TLSReport"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Observability (PR5)
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/pipelines/analytics:
    get:
      operationId: getPipelineAnalytics
      tags: ["Admin: Observability"]
      x-required-capability: observability:read
      summary: Windowed message-lifecycle funnel from pipeline_rollups
      parameters:
        - name: window
          in: query
          description: Look-back as a Go duration (e.g. 24h). Ignored when `since` is given.
          schema:
            type: string
            default: 24h
        - name: since
          in: query
          description: RFC3339 lower bound; takes precedence over `window`.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Pipeline analytics funnel
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PipelineAnalyticsResponse"

  /api/v1/admin/messages/{id}/trace:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    get:
      operationId: getMessageTrace
      tags: ["Admin: Observability"]
      x-required-capability: observability:read
      summary: Get the pipeline trace for a delivered message
      description: >-
        Returns the trace joined on message_id, which is set only on the
        delivered/queued path. Non-delivered or unknown ids yield 404 (correlate
        those via rfc_message_id on the pipeline logs endpoint instead).
      responses:
        "200":
          description: Message trace
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MessageTrace"
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Testing (non-production only; admin role, no capability)
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/test/send:
    post:
      operationId: sendTestEmail
      x-required-capability: "*"
      tags: ["Admin: Testing"]
      summary: Inject a test email directly into a recipient mailbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from:
                  type: string
                  format: email
                to:
                  type: string
                  format: email
                subject:
                  type: string
                body:
                  type: string
      responses:
        "201":
          description: Test message created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      message_id:
                        type: integer
                      msg_id:
                        type: string
                      from:
                        type: string
                      to:
                        type: string
                      subject:
                        type: string
        "403":
          description: Disabled in production
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/test/verify:
    get:
      operationId: verifyDelivery
      x-required-capability: "*"
      tags: ["Admin: Testing"]
      summary: Poll for a delivered message matching the given criteria
      parameters:
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: email
        - name: subject
          in: query
          schema:
            type: string
        - name: message_id
          in: query
          schema:
            type: string
        - name: timeout
          in: query
          description: Go duration, capped at 30s
          schema:
            type: string
            default: 5s
      responses:
        "200":
          description: Verification result (found true/false)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: true
                    properties:
                      found:
                        type: boolean
        "403":
          description: Disabled in production
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/test/probe:
    post:
      operationId: probeServices
      x-required-capability: "*"
      tags: ["Admin: Testing"]
      summary: Probe connectivity to SMTP/IMAP/POP3/DNS/DB
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                services:
                  type: array
                  items:
                    type: string
                    enum: [smtp, smtp_submission, imap, pop3, dns, db]
                host:
                  type: string
                timeout:
                  type: string
      responses:
        "200":
          description: Per-service probe results
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties: true
        "403":
          description: Disabled in production

  /api/v1/admin/test/reset:
    post:
      operationId: resetTestData
      x-required-capability: "*"
      tags: ["Admin: Testing"]
      summary: Wipe all data and re-seed default test data
      responses:
        "200":
          description: Reset complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "403":
          description: Disabled in production

  /api/v1/admin/test/seed:
    post:
      operationId: seedTestData
      x-required-capability: "*"
      tags: ["Admin: Testing"]
      summary: Seed default test domains, mailboxes, aliases and accounts
      responses:
        "200":
          description: Seed complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "403":
          description: Disabled in production

  /api/v1/admin/test/snapshot:
    post:
      operationId: snapshotTestData
      x-required-capability: "*"
      tags: ["Admin: Testing"]
      summary: Capture the current database state as JSON
      responses:
        "200":
          description: Snapshot payload (restore via /snapshot/restore)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "403":
          description: Disabled in production

  /api/v1/admin/test/snapshot/restore:
    post:
      operationId: restoreTestSnapshot
      x-required-capability: "*"
      tags: ["Admin: Testing"]
      summary: Restore database state from a previously captured snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: A snapshot payload previously returned by /snapshot
      responses:
        "200":
          description: Restore complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          description: Malformed snapshot data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Disabled in production

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: restmail_access
      description: >
        httpOnly session cookie set by POST /api/v1/auth/login and
        /api/v1/auth/refresh. The browser attaches it automatically; JavaScript
        cannot read it. This is the transport used by the web frontends. State-
        changing requests (POST/PUT/PATCH/DELETE) additionally require the
        double-submit CSRF header (see the CSRFToken parameter).
    BasicAuth:
      type: http
      scheme: basic
      description: >
        A mailbox's address and one of its app passwords, as HTTP Basic
        (`curl -u 'address:rm_…'`). Checked on every request. Accepted only by
        the operations that list it; see "App password" above. Answers never
        carry WWW-Authenticate.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT access token as an Authorization: Bearer header — the transport for
        programmatic (non-browser) clients. The token is no longer returned in
        the login/refresh JSON body; obtain it from the restmail_access cookie in
        the login response's Set-Cookie header. Bearer requests carry no cookie
        and are exempt from the CSRF check.

  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
      description: >
        Double-submit CSRF token. Required on state-changing requests
        (POST/PUT/PATCH/DELETE) that authenticate via the restmail_access cookie:
        echo the value of the readable restmail_csrf cookie (set at
        login/refresh). Rejected with 403 when missing or mismatched. Not
        required for Bearer-authenticated (cookie-less) requests.
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Account ID
    MessageId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Message ID
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Resource ID
    FolderName:
      name: folder
      in: path
      required: true
      schema:
        type: string
      description: Folder name (e.g. INBOX, Sent, Drafts, Trash)

  responses:
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

  schemas:
    # ─────────────────────────────────────────────────────────────
    # Common / Wrapper schemas
    # ─────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: not_found
            message:
              type: string
              example: Resource not found
            details:
              type: object

    ValidationErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: validation_failed
            message:
              type: string
              example: Request body failed validation
            details:
              type: object
              properties:
                fields:
                  type: object
                  additionalProperties:
                    type: string

    Pagination:
      type: object
      properties:
        cursor:
          type: string
          description: Opaque cursor for the next page
        has_more:
          type: boolean
        total:
          type: integer
          format: int64

    # ─────────────────────────────────────────────────────────────
    # Health
    # ─────────────────────────────────────────────────────────────
    HealthStatus:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          example: healthy
        db:
          type: string
          example: connected

    # ─────────────────────────────────────────────────────────────
    # Auth
    # ─────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: The account's address. There is no username.
        password:
          type: string
          format: password
        totp_code:
          type: string
          description: A current code from one of the account's authenticators, when it has one.
        recovery_code:
          type: string
          description: Instead of totp_code, one of the account's unused recovery codes.
        client:
          type: string
          enum: [native]
          description: >
            "native" for a client that is not a browser: the tokens come back
            in the body rather than as cookies. Omit for a browser.

    RefreshRequest:
      type: object
      description: Sent by native clients only; browsers send no body.
      properties:
        refresh_token:
          type: string

    LoginResponse:
      type: object
      required: [expires_in, user]
      description: >
        Login/refresh success body. For a browser it carries NO tokens: the
        access token is delivered only as the httpOnly restmail_access cookie
        (Set-Cookie), so JavaScript cannot read it, and a readable restmail_csrf
        cookie is set alongside for the double-submit CSRF defence. The token
        fields are present only for a native client.
      properties:
        expires_in:
          type: integer
          description: Access-token lifetime in seconds (lets the client schedule a refresh)
        user:
          type: object
          required: [id, email, display_name]
          properties:
            id:
              type: integer
            email:
              type: string
              format: email
            display_name:
              type: string
        capabilities:
          type: array
          description: >-
            The capabilities the account's grants in force
            (active ones, and eligible ones while switched on) give at `*`,
            sorted, or `["*"]` alone for a superadmin; for showing what the
            session can do (absent for an account holding no admin role). They
            authorise nothing: the API reads the grants on every request, and
            the token carries none. Capabilities
            held only on a domain or mailbox are not listed. Empty while
            setup_required is not.
          items:
            type: string
        setup_required:
          type: array
          description: >
            Absent once the account is set up. What the account must still do
            before its sessions reach anything else, which until then answers
            403 with code setup_required — and so does every session refreshed
            from this one. "password": POST
            /api/v1/auth/password. "two_factor": POST /api/v1/auth/2fa/enroll,
            then /api/v1/auth/2fa/confirm. A fresh install's bootstrap account,
            admin@<mail domain>, starts with both.
          items:
            type: string
            enum: [password, two_factor]
        access_token:
          type: string
          description: Native clients only. Send as Authorization Bearer.
        refresh_token:
          type: string
          description: Native clients only. Single use; each refresh returns a new one.
        refresh_expires_in:
          type: integer
          description: Native clients only. Refresh-token lifetime in seconds.

    RefreshResponse:
      type: object
      required: [expires_in, user]
      description: >
        Same shape and delivery as LoginResponse: cookies for a cookie
        refresh, body tokens for a native (body-token) refresh.
      properties:
        expires_in:
          type: integer
        user:
          type: object
          required: [id, email, display_name]
          properties:
            id:
              type: integer
            email:
              type: string
              format: email
            display_name:
              type: string
        capabilities:
          type: array
          items:
            type: string
        access_token:
          type: string
          description: Native clients only. Send as Authorization Bearer.
        refresh_token:
          type: string
          description: Native clients only. Single use; each refresh returns a new one.
        refresh_expires_in:
          type: integer
          description: Native clients only. Refresh-token lifetime in seconds.

    # ─────────────────────────────────────────────────────────────
    # Account
    # ─────────────────────────────────────────────────────────────
    Account:
      type: object
      description: >
        An account, which is a mailbox: what GET and POST /api/v1/accounts
        answer with. `id` is the mailbox's id, the `{id}` of every
        /api/v1/accounts/{id}/… route.
      required: [id, address, display_name, is_primary]
      properties:
        id:
          type: integer
        address:
          type: string
          format: email
        display_name:
          type: string
        is_primary:
          type: boolean
          description: The session's own account.

    CreateAccountRequest:
      type: object
      required: [address]
      properties:
        address:
          type: string
          format: email
          description: On a domain this server hosts.
        display_name:
          type: string
        password:
          type: string
          minLength: 12
          description: >
            Optional. With one, the account can be signed in to; without one
            it has no credentials, and is reached only through its owners.

    Credential:
      type: object
      description: An app password, as its owner sees it. Never its secret or hash.
      required: [id, name, kind, public_id, created_at, last_used_at, expires_at]
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
          enum: [app_password]
        public_id:
          type: string
          description: The part of the app password after `rm_` and before the secret
          example: 7Kq2xT9bLm4P
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: When it was last used, to within a minute
        expires_at:
          type: [string, "null"]
          format: date-time

    CreatedAppPassword:
      allOf:
        - $ref: "#/components/schemas/Credential"
        - type: object
          required: [password]
          properties:
            password:
              type: string
              pattern: "^rm_[A-Za-z0-9]{12}_[A-Za-z0-9]{43}$"
              description: >
                The app password, shown this once. Use it with the mailbox's
                address as the password of a mail client, or with HTTP Basic.

    PushDevices:
      type: object
      required: [platforms, devices]
      properties:
        platforms:
          type: array
          description: The push services this session can register a device with
          items:
            type: string
            enum: [apns]
        devices:
          type: array
          items:
            $ref: "#/components/schemas/PushDevice"

    PushDevice:
      type: object
      description: A phone registered for push by a session. Never its token.
      required: [id, platform, environment, created_at]
      properties:
        id:
          type: string
          description: Opaque; the `device` of the pushes it gets
          example: "12"
        platform:
          type: string
          enum: [apns]
        environment:
          type: string
          enum: [production, sandbox]
        created_at:
          type: string
          format: date-time

    RegisterPushDeviceRequest:
      type: object
      required: [platform, token]
      properties:
        platform:
          type: string
          enum: [apns]
        token:
          type: string
          description: The APNs device token, lowercase hex
          pattern: "^[0-9a-f]{64,200}$"
        environment:
          type: string
          enum: [production, sandbox]
          default: production
          description: >
            production for App Store and TestFlight builds, sandbox for builds
            run from Xcode: which APNs host the pushes go to.
        app_id:
          type: string
          description: The app's bundle id; must be the server's APNs topic when given
          example: com.antimatterstudios.restmail

    LinkAccountRequest:
      type: object
      required: [address, password]
      properties:
        address:
          type: string
          format: email
        password:
          type: string
          format: password
        display_name:
          type: string

    # ─────────────────────────────────────────────────────────────
    # Folder
    # ─────────────────────────────────────────────────────────────
    Folder:
      type: object
      required: [name, total, unread]
      properties:
        name:
          type: string
        total:
          type: integer
        unread:
          type: integer

    FolderName:
      type: object
      required: [name]
      properties:
        name:
          type: string

    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    RenameFolderRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    # ─────────────────────────────────────────────────────────────
    # Message
    # ─────────────────────────────────────────────────────────────
    Message:
      type: object
      required: [id, mailbox_id, folder, sender, subject, is_read, is_flagged, is_starred, is_draft, is_deleted, received_at, created_at, updated_at]
      properties:
        id:
          type: integer
        mailbox_id:
          type: integer
        folder:
          type: string
        message_id:
          type: string
          description: RFC 2822 Message-ID header
        in_reply_to:
          type: string
        references:
          type: string
        thread_id:
          type: string
        sender:
          type: string
        sender_name:
          type: string
        recipients_to:
          description: JSON array of recipient objects
          oneOf:
            - type: array
              items:
                type: object
                properties:
                  address:
                    type: string
                  name:
                    type: string
            - type: "null"
        recipients_cc:
          description: JSON array of CC recipient objects
          oneOf:
            - type: array
              items:
                type: object
                properties:
                  address:
                    type: string
                  name:
                    type: string
            - type: "null"
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
        headers:
          description: Raw email headers as JSON
          oneOf:
            - type: object
            - type: "null"
        size_bytes:
          type: integer
        raw_size:
          type: integer
          description: >-
            Exact octet count of the stored raw RFC 2822 message (the size a
            protocol client receives when the raw form is served verbatim,
            e.g. IMAP RFC822.SIZE / POP3 LIST). 0 when the server holds no
            stored raw form; consumers should fall back to size_bytes.
        has_attachments:
          type: boolean
        is_read:
          type: boolean
        is_flagged:
          type: boolean
        is_starred:
          type: boolean
        is_draft:
          type: boolean
        is_deleted:
          type: boolean
        received_at:
          type: string
          format: date-time
        date_header:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateMessageRequest:
      type: object
      properties:
        is_read:
          type: boolean
        is_flagged:
          type: boolean
        is_starred:
          type: boolean
        folder:
          type: string

    SendMessageRequest:
      type: object
      required: [from, to, subject]
      properties:
        from:
          type: string
          format: email
        to:
          type: array
          items:
            type: string
            format: email
        cc:
          type: array
          items:
            type: string
            format: email
        bcc:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
        in_reply_to:
          type: string

    ForwardMessageRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: email
        to:
          type: array
          items:
            type: string
            format: email
        body_text:
          type: string

    # ─────────────────────────────────────────────────────────────
    # Draft
    # ─────────────────────────────────────────────────────────────
    DraftRequest:
      type: object
      required: [from]
      properties:
        from:
          type: string
          format: email
        to:
          type: array
          items:
            type: string
            format: email
        cc:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
        in_reply_to:
          type: string
        references:
          type: string

    UpdateDraftRequest:
      type: object
      properties:
        from:
          type: string
          format: email
        to:
          type: array
          items:
            type: string
            format: email
        cc:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string

    # ─────────────────────────────────────────────────────────────
    # Quota
    # ─────────────────────────────────────────────────────────────
    QuotaInfo:
      type: object
      required: [quota_bytes, quota_used_bytes, message_count, percent_used]
      properties:
        quota_bytes:
          type: integer
          format: int64
        quota_used_bytes:
          type: integer
          format: int64
        message_count:
          type: integer
        percent_used:
          type: number
          format: float

    # ─────────────────────────────────────────────────────────────
    # Attachment
    # ─────────────────────────────────────────────────────────────
    Attachment:
      type: object
      required: [id, message_id, filename, content_type, size_bytes, storage_type, storage_ref, checksum, created_at]
      properties:
        id:
          type: integer
        message_id:
          type: integer
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        storage_type:
          type: string
          enum: [filesystem, s3]
        storage_ref:
          type: string
        checksum:
          type: string
          description: SHA-256 hex digest
        created_at:
          type: string
          format: date-time

    # ─────────────────────────────────────────────────────────────
    # Contact
    # ─────────────────────────────────────────────────────────────
    Contact:
      type: object
      required: [id, mailbox_id, email, name, trust_level, source, created_at, updated_at]
      properties:
        id:
          type: integer
        mailbox_id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        trust_level:
          type: string
          enum: [auto, trusted, blocked]
        source:
          type: string
          enum: [sent, manual, import]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateContactRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        trust_level:
          type: string
          enum: [auto, trusted, blocked]

    UpdateContactRequest:
      type: object
      properties:
        name:
          type: string
        trust_level:
          type: string
          enum: [auto, trusted, blocked]

    ImportContactsRequest:
      type: object
      required: [contacts]
      properties:
        contacts:
          type: array
          items:
            type: object
            required: [email]
            properties:
              email:
                type: string
                format: email
              name:
                type: string

    # ─────────────────────────────────────────────────────────────
    # Vacation
    # ─────────────────────────────────────────────────────────────
    VacationConfig:
      type: object
      required: [enabled, subject, body]
      properties:
        enabled:
          type: boolean
        subject:
          type: string
        body:
          type: string
        start_date:
          type: [string, "null"]
          format: date-time
        end_date:
          type: [string, "null"]
          format: date-time

    # ─────────────────────────────────────────────────────────────
    # Sieve
    # ─────────────────────────────────────────────────────────────
    SieveScript:
      type: object
      required: [id, mailbox_id, script, active, created_at, updated_at]
      properties:
        id:
          type: integer
        mailbox_id:
          type: integer
        script:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PutSieveRequest:
      type: object
      required: [script]
      properties:
        script:
          type: string
        active:
          type: boolean

    # ─────────────────────────────────────────────────────────────
    # Quarantine
    # ─────────────────────────────────────────────────────────────
    Quarantine:
      type: object
      required: [id, mailbox_id, sender, subject, body_preview, quarantine_reason, received_at, expires_at, released]
      properties:
        id:
          type: integer
        mailbox_id:
          type: integer
        sender:
          type: string
        subject:
          type: string
        body_preview:
          type: string
        spam_score:
          type: [number, "null"]
          format: float
        quarantine_reason:
          type: string
        received_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        released:
          type: boolean

    # ─────────────────────────────────────────────────────────────
    # Inbound / Gateway
    # ─────────────────────────────────────────────────────────────
    MailboxCheck:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
        mailbox_id:
          type: integer
        address:
          type: string
          format: email

    DeliverMessageRequest:
      type: object
      required: [address, sender]
      properties:
        address:
          type: string
          format: email
          description: Recipient address
        sender:
          type: string
          format: email
        sender_name:
          type: string
        recipients_to:
          type: array
          items:
            type: string
            format: email
        recipients_cc:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
        message_id:
          type: string
        in_reply_to:
          type: string
        references:
          type: string
        raw_message:
          type: string
          format: byte
          description: >-
            Full RFC 2822 raw message, base64-encoded. Encoding it as base64
            (rather than a plain JSON string) lets arbitrary non-UTF-8 octets
            (8bit/binary bodies, undeclared-charset high bytes) round-trip
            byte-for-byte, preserving DKIM body hashes and BODY[] fidelity.
        client_ip:
          type: string
        helo_name:
          type: string

    # ─────────────────────────────────────────────────────────────
    # RESTMAIL Protocol
    # ─────────────────────────────────────────────────────────────
    RestmailCapabilities:
      type: object
      required: [protocol, version, features]
      properties:
        protocol:
          type: string
          example: RESTMAIL
        version:
          type: string
          example: "1.0"
        features:
          type: array
          items:
            type: string

    RestmailMailboxCheck:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
        address:
          type: string
          format: email

    RestmailDeliverRequest:
      type: object
      required: [to]
      properties:
        from:
          type: string
          format: email
        to:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
        message_id:
          type: string
        in_reply_to:
          type: string
        references:
          type: string
        headers:
          type: object
          description: Raw headers as JSON
        raw_message:
          type: string
          description: Full RFC 2822 raw message
        sender:
          type: string
          format: email
          description: Alias for 'from'
        recipients:
          type: array
          items:
            type: string
            format: email
          description: Alias for 'to'

    RestmailDeliverResponse:
      type: object
      required: [delivered, failed]
      properties:
        delivered:
          type: array
          items:
            type: string
            format: email
        failed:
          type: array
          items:
            type: string
            format: email

    # ─────────────────────────────────────────────────────────────
    # Domain
    # ─────────────────────────────────────────────────────────────
    Domain:
      type: object
      required: [id, name, server_type, active, default_quota_bytes, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        server_type:
          type: string
          enum: [traditional, restmail]
        active:
          type: boolean
        default_quota_bytes:
          type: integer
          format: int64
        dkim_selector:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateDomainRequest:
      type: object
      required: [name, server_type]
      properties:
        name:
          type: string
        server_type:
          type: string
          enum: [traditional, restmail]
        default_quota_bytes:
          type: integer
          format: int64

    UpdateDomainRequest:
      type: object
      properties:
        active:
          type: boolean
        default_quota_bytes:
          type: integer
          format: int64

    # ─────────────────────────────────────────────────────────────
    # Mailbox
    # ─────────────────────────────────────────────────────────────
    Mailbox:
      type: object
      description: >
        An account, as the admin API shows it: a mailbox is the account. Its
        passwords, authenticators and app passwords are its credentials,
        never shown here; what it may do is its grants (/api/v1/admin/grants).
      required: [id, domain_id, local_part, address, display_name, quota_bytes, quota_used_bytes, active, password_change_required, two_factor_required, created_at, updated_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        local_part:
          type: string
        address:
          type: string
          format: email
        display_name:
          type: string
        quota_bytes:
          type: integer
          format: int64
        quota_used_bytes:
          type: integer
          format: int64
        active:
          type: boolean
        last_login_at:
          type: [string, "null"]
          format: date-time
        password_change_required:
          type: boolean
          description: In setup until it chooses its own password (the bootstrap account)
        two_factor_required:
          type: boolean
          description: In setup until it enrolls an authenticator, which it may never disable
        last_password_change:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateMailboxRequest:
      type: object
      properties:
        password:
          type: string
          format: password
        display_name:
          type: string
        quota_bytes:
          type: integer
          format: int64
        active:
          type: boolean

    # ─────────────────────────────────────────────────────────────
    # Alias
    # ─────────────────────────────────────────────────────────────
    Alias:
      type: object
      required: [id, domain_id, source_address, destination_address, active, created_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        source_address:
          type: string
          format: email
        destination_address:
          type: string
          format: email
        active:
          type: boolean
        created_at:
          type: string
          format: date-time

    CreateAliasRequest:
      type: object
      required: [source_address, destination_address]
      properties:
        source_address:
          type: string
          format: email
        destination_address:
          type: string
          format: email

    UpdateAliasRequest:
      type: object
      properties:
        destination_address:
          type: string
          format: email
        active:
          type: boolean

    # ─────────────────────────────────────────────────────────────
    # Pipeline
    # ─────────────────────────────────────────────────────────────
    Pipeline:
      type: object
      required: [id, domain_id, direction, filters, active, created_at, updated_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        direction:
          type: string
          enum: [inbound, outbound]
        filters:
          description: Ordered array of filter configurations
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              config:
                type: object
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreatePipelineRequest:
      type: object
      required: [domain_id, direction, filters]
      properties:
        domain_id:
          type: integer
        direction:
          type: string
          enum: [inbound, outbound]
        filters:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              config:
                type: object
        active:
          type: boolean
          default: true

    UpdatePipelineRequest:
      type: object
      properties:
        filters:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              config:
                type: object
        active:
          type: boolean

    TestPipelineRequest:
      type: object
      required: [pipeline_id, email]
      properties:
        pipeline_id:
          type: integer
        email:
          type: object
          description: Sample email JSON for testing

    TestFilterRequest:
      type: object
      required: [filter_name, config, email]
      properties:
        filter_name:
          type: string
        config:
          type: object
        email:
          type: object
          description: Sample email JSON for testing

    ExecutionResult:
      type: object
      required: [final_action, steps, duration_ms]
      properties:
        final_action:
          type: string
          enum: [continue, reject, quarantine, discard]
        steps:
          type: array
          items:
            type: object
        duration_ms:
          type: integer
          format: int64
        final_email:
          type: object
          description: The email after all transformations

    FilterResult:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [continue, reject, quarantine, discard]
        email:
          type: object
          description: The email after filter transformation
        metadata:
          type: object

    # ─────────────────────────────────────────────────────────────
    # Custom Filter
    # ─────────────────────────────────────────────────────────────
    CustomFilter:
      type: object
      required: [id, domain_id, name, filter_type, direction, config, enabled, created_at, updated_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        name:
          type: string
        description:
          type: string
        filter_type:
          type: string
          enum: [action, transform]
        direction:
          type: string
          enum: [inbound, outbound, both]
        config:
          type: object
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateCustomFilterRequest:
      type: object
      required: [domain_id, name, filter_type, direction, config]
      properties:
        domain_id:
          type: integer
        name:
          type: string
        description:
          type: string
        filter_type:
          type: string
          enum: [action, transform]
        direction:
          type: string
          enum: [inbound, outbound, both]
        config:
          type: object
        enabled:
          type: boolean
          default: true

    # ─────────────────────────────────────────────────────────────
    # Outbound Queue
    # ─────────────────────────────────────────────────────────────
    OutboundQueue:
      type: object
      required: [id, sender, recipient, domain, status, attempts, next_attempt, max_retries, created_at, expires_at]
      properties:
        id:
          type: integer
        message_id:
          type: [integer, "null"]
        sender:
          type: string
        recipient:
          type: string
        domain:
          type: string
        status:
          type: string
          enum: [pending, delivering, deferred, delivered, bounced, expired]
        attempts:
          type: integer
        last_attempt:
          type: [string, "null"]
          format: date-time
        next_attempt:
          type: string
          format: date-time
        last_error:
          type: string
        last_error_code:
          type: integer
        max_retries:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    QueueStats:
      type: object
      required: [pending, deferred, delivered, bounced, total]
      properties:
        pending:
          type: integer
        deferred:
          type: integer
        delivered:
          type: integer
        bounced:
          type: integer
        total:
          type: integer

    BulkQueueRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
        filter:
          type: object
          description: Filter criteria to select entries (alternative to ids)
          properties:
            status:
              type: string
            domain:
              type: string
            sender:
              type: string
            recipient:
              type: string

    BulkQueueResponse:
      type: object
      required: [affected]
      properties:
        affected:
          type: integer

    # ─────────────────────────────────────────────────────────────
    # Sender Rules
    # ─────────────────────────────────────────────────────────────
    DomainSenderRule:
      type: object
      required: [id, domain_id, pattern, list_type, created_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        pattern:
          type: string
          description: Email address or @domain pattern
        list_type:
          type: string
          enum: [allow, block]
        reason:
          type: string
        created_by:
          type: [integer, "null"]
        created_at:
          type: string
          format: date-time

    CreateSenderRuleRequest:
      type: object
      required: [pattern]
      properties:
        pattern:
          type: string
          description: "Email address (spam@evil.com) or domain pattern (@evil.com)"
        reason:
          type: string

    # ─────────────────────────────────────────────────────────────
    # DKIM
    # ─────────────────────────────────────────────────────────────
    DKIMEntry:
      type: object
      required: [domain_id, domain, selector, has_key]
      properties:
        domain_id:
          type: integer
        domain:
          type: string
        selector:
          type: string
        has_key:
          type: boolean

    SetDKIMKeyRequest:
      type: object
      required: [selector, private_key]
      properties:
        selector:
          type: string
        private_key:
          type: string
          description: PEM-encoded RSA private key

    # ─────────────────────────────────────────────────────────────
    # Certificate
    # ─────────────────────────────────────────────────────────────
    Certificate:
      type: object
      required: [id, domain_id, issuer, not_before, not_after, auto_renew, created_at, updated_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        issuer:
          type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        auto_renew:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CertificateDetail:
      allOf:
        - $ref: "#/components/schemas/Certificate"
        - type: object
          required: [cert_pem]
          properties:
            cert_pem:
              type: string
              description: PEM-encoded certificate

    CreateCertificateRequest:
      type: object
      required: [domain_id, cert_pem, key_pem]
      properties:
        domain_id:
          type: integer
        cert_pem:
          type: string
          description: PEM-encoded certificate
        key_pem:
          type: string
          description: PEM-encoded private key
        auto_renew:
          type: boolean

    # ─────────────────────────────────────────────────────────────
    # Ban
    # ─────────────────────────────────────────────────────────────
    Ban:
      type: object
      required: [id, ip, reason, protocol, created_by, created_at]
      properties:
        id:
          type: integer
        ip:
          type: string
        reason:
          type: string
        protocol:
          type: string
          enum: [smtp, imap, pop3, all]
        created_by:
          type: string
        expires_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateBanRequest:
      type: object
      required: [ip, protocol, created_by]
      properties:
        ip:
          type: string
        reason:
          type: string
        protocol:
          type: string
          enum: [smtp, imap, pop3, all]
        duration:
          type: string
          description: Duration string (e.g. "24h", "7d"), omit for permanent
        created_by:
          type: string

    # ─────────────────────────────────────────────────────────────
    # Activity Log
    # ─────────────────────────────────────────────────────────────
    AuditEntry:
      type: object
      description: >-
        One entry of the audit log. `hash` is hex SHA-256 over the JSON array
        `["restmail-audit-v1", seq, occurred_at (RFC 3339, nanoseconds, UTC),
        actor_kind, actor_id, actor_name, credential_id, session_id, action,
        outcome, error_code, method, route, status, target, ip, user_agent,
        request_id, prev_hash]`, as Go's encoding/json writes it with HTML
        escaping off and no trailing newline (target's keys sorted).
      required: [seq, occurred_at, actor_kind, actor_id, actor_name, credential_id, session_id,
        action, outcome, error_code, method, route, status, target, ip, user_agent, request_id,
        prev_hash, hash]
      properties:
        seq:
          type: integer
          format: int64
          description: 1, 2, 3, … with no gaps
        occurred_at:
          type: string
          format: date-time
        actor_kind:
          type: string
          enum: [account, system, anonymous]
          description: >-
            A sign-in names the account it was for even when it fails;
            actor_id is set only once the account is proven.
        actor_id:
          type: [integer, "null"]
          description: The account (mailbox) id
        actor_name:
          type: string
          description: The account's address at the time
        credential_id:
          type: [integer, "null"]
          description: >
            The credential a request was made with over HTTP Basic (an app
            password, or the account's password through a gateway), or the one
            refused when its secret matched; null for a session
        session_id:
          type: string
          description: The jti of the token the request carried
        action:
          type: string
          example: admin.change
        outcome:
          type: string
          enum: [success, denied, failed, error]
          description: 2xx success; 401, 403 and 429 denied; other 4xx failed; 5xx error
        error_code:
          type: string
          description: The error response's `error.code`, if any
        method:
          type: string
        route:
          type: string
          example: /api/v1/admin/domains/{id}
        status:
          type: integer
        target:
          type: object
          additionalProperties:
            type: string
          description: The route's URL parameters, and for account linking the address
        ip:
          type: string
        user_agent:
          type: string
        request_id:
          type: string
        prev_hash:
          type: string
          description: The previous entry's hash; 64 zeros for the first
        hash:
          type: string

    AuditVerifyResult:
      type: object
      required: [ok, checked, first_seq, last_seq, last_hash]
      properties:
        ok:
          type: boolean
        checked:
          type: integer
          format: int64
          description: How many entries held
        first_seq:
          type: integer
          format: int64
        last_seq:
          type: integer
          format: int64
          description: The last entry that held
        last_hash:
          type: string
          description: Its hash; 64 zeros when the log is empty
        broken_at_seq:
          type: integer
          format: int64
          description: The first entry that does not hold
        reason:
          type: string
          description: Why it does not hold
        note:
          type: string
          description: Set when the log does not start at seq 1

    # ─────────────────────────────────────────────────────────────
    # Generic helpers
    # ─────────────────────────────────────────────────────────────
    StatusResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              example: reset_complete

    # ─────────────────────────────────────────────────────────────
    # Calendar
    # ─────────────────────────────────────────────────────────────
    CalendarEventSummary:
      type: object
      required: [uid, method, status, summary, sequence, is_cancelled, versions]
      properties:
        uid:
          type: string
        method:
          type: string
          description: iCalendar METHOD (REQUEST, REPLY, CANCEL, ...)
        status:
          type: string
        summary:
          type: string
        sequence:
          type: integer
        is_cancelled:
          type: boolean
        message_id:
          type: [integer, "null"]
        versions:
          type: integer
          description: Number of stored versions for this UID

    # ─────────────────────────────────────────────────────────────
    # Admin: Dashboard stats
    # ─────────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [domainCount, mailboxCount, queueStats, messageVolume, recentActivity, inboundTransportSecurity]
      properties:
        domainCount:
          type: integer
        mailboxCount:
          type: integer
        queueStats:
          type: object
          required: [pending, processing, failed]
          properties:
            pending:
              type: integer
            processing:
              type: integer
            failed:
              type: integer
        messageVolume:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                example: Jul 23
              count:
                type: integer
        recentActivity:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
              description:
                type: string
              timestamp:
                type: string
                format: date-time
        inboundTransportSecurity:
          type: object
          properties:
            totalInboundMX:
              type: integer
            overTLS:
              type: integer
            plaintext:
              type: integer
            tlsPercent:
              type: number
            plaintextPercent:
              type: number
            plaintextAuthPass:
              type: integer
            plaintextAuthFail:
              type: integer

    # ─────────────────────────────────────────────────────────────
    # Admin: Roles, capabilities, grants
    # ─────────────────────────────────────────────────────────────
    Grant:
      type: object
      required: [id, holder, role, role_id, scope, mode, granted_by, granted_at]
      properties:
        id:
          type: integer
        holder:
          type: object
          required: [kind, id]
          properties:
            kind:
              type: string
              description: "`admin` for now; other kinds of holder come later"
              example: admin
            id:
              type: integer
        role:
          type: string
          example: admin
        role_id:
          type: integer
        scope:
          type: string
          description: "`*`, `domain:<name>` or `mailbox:<address>`; covers everything beneath it"
          example: domain:example.com
        mode:
          type: string
          enum: [active, eligible]
        granted_by:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [admin, system]
            id:
              type: [integer, "null"]
        granted_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        activation:
          description: The activation running now, of an eligible grant switched on; null otherwise.
          oneOf:
            - $ref: "#/components/schemas/GrantActivation"
            - type: "null"

    GrantActivation:
      type: object
      required: [id, activated_at, expires_at, reason, seconds_left]
      properties:
        id:
          type: integer
        activated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        reason:
          type: string
        seconds_left:
          type: integer

    GrantEscalation:
      type: object
      required: [grant, capabilities]
      properties:
        grant:
          $ref: "#/components/schemas/Grant"
        capabilities:
          type: array
          description: What the caller now holds at `*`, as sign-in lists it.
          items:
            type: string

    FreshSecondFactor:
      type: object
      description: One of the two, given just now.
      properties:
        totp_code:
          type: string
          description: A current code from the caller's authenticator
          example: "123456"
        recovery_code:
          type: string
          description: An unused recovery code, used up if it works

    ActivateGrantRequest:
      allOf:
        - $ref: "#/components/schemas/FreshSecondFactor"
        - type: object
          required: [reason]
          properties:
            reason:
              type: string
              maxLength: 500
              description: Why you are switching it on; recorded in the audit log
              example: Add an admin for the new office
            minutes:
              type: integer
              minimum: 1
              maximum: 240
              default: 60

    CreateGrantRequest:
      type: object
      required: [holder, role, scope]
      properties:
        holder:
          type: object
          required: [kind, id]
          properties:
            kind:
              type: string
              enum: [account]
            id:
              type: integer
        role:
          type: string
          description: A role name, e.g. `admin` or `readonly`
        scope:
          type: string
          example: domain:example.com
        mode:
          type: string
          enum: [active, eligible]
          default: active
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Optional; must be in the future

    Role:
      type: object
      required: [id, name, capabilities]
      properties:
        id:
          type: integer
        name:
          type: string
          description: superadmin, admin, readonly, owner, or one made later
        description:
          type: string
        system_role:
          type: boolean
        capabilities:
          type: array
          items:
            type: string

    Capability:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
          example: domains:read
        description:
          type: string
        resource:
          type: string
          example: domains
        action:
          type: string
          example: read

    # ─────────────────────────────────────────────────────────────
    # Admin: DNS check
    # ─────────────────────────────────────────────────────────────
    DNSCheckResult:
      type: object
      required: [domain, records, summary]
      properties:
        domain:
          type: string
        summary:
          type: string
          example: 4/5 records verified
        records:
          type: array
          items:
            type: object
            required: [type, name, status]
            properties:
              type:
                type: string
                example: MX
              name:
                type: string
              status:
                type: string
                enum: [ok, missing, error]
              value:
                type: string
              message:
                type: string

    # ─────────────────────────────────────────────────────────────
    # Admin: MTA-STS
    # ─────────────────────────────────────────────────────────────
    MTASTSPolicy:
      type: object
      required: [id, domain_id, mode, max_age, active]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        mode:
          type: string
          enum: [none, testing, enforce]
        mx_hosts:
          type: string
          description: Comma-separated MX host patterns
        max_age:
          type: integer
          description: Policy lifetime in seconds
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SetMTASTSPolicyRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [none, testing, enforce]
        mx_hosts:
          type: string
          description: Comma-separated MX host patterns
        max_age:
          type: integer
          minimum: 0
        active:
          type: boolean

    # ─────────────────────────────────────────────────────────────
    # Admin: TLS-RPT
    # ─────────────────────────────────────────────────────────────
    TLSReport:
      type: object
      required: [id, domain_id, reporting_org, start_date, end_date, policy_type, policy_domain, received_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        reporting_org:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        policy_type:
          type: string
          enum: [sts, tlsa, no-policy]
        policy_domain:
          type: string
        total_successful:
          type: integer
          format: int64
        total_failure:
          type: integer
          format: int64
        failure_details:
          description: Raw failure-details JSON from the report
          oneOf:
            - type: object
            - type: array
            - type: "null"
        raw_report:
          type: string
        received_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    TLSRPTReport:
      type: object
      description: Inbound TLS-RPT report (RFC 8460 §4)
      required: [organization-name, date-range, policies]
      properties:
        organization-name:
          type: string
        contact-info:
          type: string
        report-id:
          type: string
        date-range:
          type: object
          required: [start-datetime, end-datetime]
          properties:
            start-datetime:
              type: string
              format: date-time
            end-datetime:
              type: string
              format: date-time
        policies:
          type: array
          items:
            type: object
            properties:
              policy:
                type: object
                properties:
                  policy-type:
                    type: string
                  policy-string:
                    type: array
                    items:
                      type: string
                  policy-domain:
                    type: string
                  mx-host:
                    type: array
                    items:
                      type: string
              summary:
                type: object
                properties:
                  total-successful-session-count:
                    type: integer
                    format: int64
                  total-failure-session-count:
                    type: integer
                    format: int64
              failure-details:
                type: array
                items:
                  type: object
                  additionalProperties: true

    # ─────────────────────────────────────────────────────────────
    # Admin: Observability (traces + analytics)
    # ─────────────────────────────────────────────────────────────
    MessageTrace:
      type: object
      required: [id, direction, transport, pipeline_id, final_action, outcome, duration_ms, sampled, created_at]
      properties:
        id:
          type: integer
        message_id:
          type: [integer, "null"]
          description: Set only on the delivered/queued path; null otherwise
        rfc_message_id:
          type: string
          description: RFC 5322 Message-ID correlation key
        direction:
          type: string
          enum: [inbound, outbound]
        transport:
          type: string
          enum: ["", tls, plaintext]
          description: Empty when transport is not applicable
        mail_from:
          type: string
        rcpt_to:
          type: string
          description: First envelope recipient
        client_ip:
          type: string
        pipeline_id:
          type: integer
        final_action:
          type: string
          enum: [continue, reject, quarantine, discard, defer]
        outcome:
          type: string
          enum: [delivered, queued, rejected, quarantined, discarded, deferred]
        reason_code:
          type: string
          description: Bounded reason for a non-continue terminal; empty otherwise
        spam_score:
          type: [number, "null"]
        duration_ms:
          type: integer
          format: int64
        stages:
          description: Serialized []StepResult timeline
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: "null"
        sampled:
          type: boolean
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time

    PipelineFunnel:
      type: object
      properties:
        received:
          type: array
          items:
            type: object
            properties:
              transport:
                type: string
              count:
                type: number
        auth_verdicts:
          type: array
          items:
            type: object
            properties:
              mechanism:
                type: string
              result:
                type: string
              count:
                type: number
        stage_decisions:
          type: array
          items:
            type: object
            properties:
              filter:
                type: string
              action:
                type: string
              count:
                type: number
        terminal_outcomes:
          type: array
          items:
            type: object
            properties:
              direction:
                type: string
              outcome:
                type: string
              count:
                type: number
        top_reject_reasons:
          type: array
          items:
            type: object
            properties:
              reason_code:
                type: string
              count:
                type: number

    PipelineAnalyticsResponse:
      type: object
      required: [window, funnel]
      properties:
        window:
          type: object
          required: [since, until]
          properties:
            since:
              type: string
              format: date-time
            until:
              type: string
              format: date-time
            label:
              type: string
              description: Echoes the ?window value; empty when ?since was used
        funnel:
          $ref: "#/components/schemas/PipelineFunnel"
        live_totals:
          allOf:
            - $ref: "#/components/schemas/PipelineFunnel"
          description: >-
            Cumulative-since-process-start snapshot from the in-process registry
            (NOT windowed); absent if the registry could not be gathered.

    # ─────────────────────────────────────────────────────────────
    # Admin: Custom filters (update)
    # ─────────────────────────────────────────────────────────────
    UpdateCustomFilterRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        filter_type:
          type: string
        direction:
          type: string
          enum: [inbound, outbound]
        config:
          type: object
          description: Filter configuration (opaque JSON)
        enabled:
          type: boolean
