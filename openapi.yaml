  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/domains:
    get:
      x-restmail-scope: filtered-list
      operationId: listDomains
      tags: ["Admin: Domains"]
      security:
        - CookieAuth: [domains:read]
        - BearerAuth: [domains:read]
        - APIKeyAuth: [domains:read]
      summary: List all domains
      parameters:
        - name: limit
          in: query
          description: Page size. Omitted or non-positive values use 50; values above 200 are capped at 200.
          schema:
            type: integer
        - name: offset
          in: query
          description: Number of domains to skip in name order. Omitted or negative values use 0.
          schema:
            type: integer
      responses:
        "200":
          description: Domain list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Domain"
    post:
      operationId: createDomain
      tags: ["Admin: Domains"]
      security:
        - CookieAuth: [domains:write]
        - BearerAuth: [domains:write]
        - APIKeyAuth: [domains:write]
      summary: Create a new domain
      description: >-
        The domain is created but not live: `active` is false. Mail for a domain
        is only ever carried over TLS, so it goes live only once it has a
        certificate of its own, by a separate PATCH setting `active` to true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDomainRequest"
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              created:
                value:
                  name: example.org
                  server_type: restmail
              # JSON, but an array where the request is an object: refused
              # when it is read, before any field is looked at.
              body_array:
                value: []
              # No name: refused before anything is stored.
              name_missing:
                value: {}
              # The created request with a server type that is neither
              # traditional nor restmail: refused before anything is stored.
              server_type_invalid:
                value:
                  name: example.org
                  server_type: external
              # A sending policy that is not one: refused the same way.
              sending_policy_invalid:
                value:
                  name: example.org
                  server_type: restmail
                  sending_policy: newsletter
              # A DMARC policy that is not none, quarantine or reject: refused the same way.
              dmarc_policy_invalid:
                value:
                  name: example.org
                  server_type: restmail
                  dmarc_policy: strict
      responses:
        "201":
          description: Domain created, not yet live
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Domain"
              examples:
                created:
                  value:
                    data:
                      id: 1
                      name: example.org
                      server_type: restmail
                      active: false
                      default_quota_bytes: 1073741824
                      sending_policy: ""
                      dmarc_policy: none
                      created_at: "2026-01-01T00:00:00Z"
                      updated_at: "2026-01-01T00:00:00Z"
          links:
            getDomain:
              operationId: getDomain
              parameters:
                id: '$response.body#/data/id'
            updateDomain:
              operationId: updateDomain
              parameters:
                id: '$response.body#/data/id'
            listAllowlist:
              operationId: listAllowlist
              parameters:
                id: '$response.body#/data/id'
            addToAllowlist:
              operationId: addToAllowlist
              parameters:
                id: '$response.body#/data/id'
            listBlocklist:
              operationId: listBlocklist
              parameters:
                id: '$response.body#/data/id'
            listSuppressions:
              operationId: listSuppressions
              parameters:
                id: '$response.body#/data/id'
            addToBlocklist:
              operationId: addToBlocklist
              parameters:
                id: '$response.body#/data/id'
            setDKIMKey:
              operationId: setDKIMKey
              parameters:
                id: '$response.body#/data/id'
            getDKIMRotation:
              operationId: getDKIMRotation
              parameters:
                id: '$response.body#/data/id'
            setDKIMRotation:
              operationId: setDKIMRotation
              parameters:
                id: '$response.body#/data/id'
            domainDNSCheck:
              operationId: domainDNSCheck
              parameters:
                id: '$response.body#/data/id'
            setDomainRelay:
              operationId: setDomainRelay
              parameters:
                id: '$response.body#/data/id'
            getDomainRelay:
              operationId: getDomainRelay
              parameters:
                id: '$response.body#/data/id'
            setMtaStsPolicy:
              operationId: setMtaStsPolicy
              parameters:
                id: '$response.body#/data/id'
            deleteDomain:
              operationId: deleteDomain
              parameters:
                id: '$response.body#/data/id'
            stopDomainOutbound:
              operationId: stopDomainOutbound
              parameters:
                id: '$response.body#/data/id'
        '400':
          description: The body is not valid JSON or not the declared media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: {}
        "409":
          $ref: "#/components/responses/Conflict"
        '422':
          description: Request failed validation (validation_failed), with details.fields naming each failing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                name_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          name: required
                server_type_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          server_type: must be 'traditional' or 'restmail'
                sending_policy_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          sending_policy: must be 'transactional', 'bulk' or empty
                dmarc_policy_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          dmarc_policy: must be 'none', 'quarantine' or 'reject'
                body_array:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          body: the body is not a JSON object
        "429":
          description: Authentication refusals exceeded the configured rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/domains/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getDomain
      tags: ["Admin: Domains"]
      security:
        - CookieAuth: [domains:read]
        - BearerAuth: [domains:read]
        - APIKeyAuth: [domains:read]
      summary: Get a domain by ID
      # Links supply the created ID; the hook selects missing for the 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          examples:
            found:
              value: 1
            missing:
              value: 2147483647
      responses:
        "200":
          description: Domain details
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Domain"
        "404":
          description: No domain has this ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing:
                  value:
                    error:
                      code: domain_not_found
                      message: Domain not found
    patch:
      operationId: updateDomain
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        examples:
          found:
            value: 1
          missing:
            value: 2147483647
      tags: ["Admin: Domains"]
      security:
        - CookieAuth: [domains:write]
        - BearerAuth: [domains:write]
        - APIKeyAuth: [domains:write]
      summary: Update a domain
      description: >-
        Setting `active` to true makes the domain live, and is refused with 409
        `certificate_required` unless the domain has a currently valid
        certificate: mail for it is only ever carried over TLS. Setting `active`
        to false takes it out of service and is always allowed. Setting
        `sending_policy` to `""` clears it; any value other than
        `transactional`, `bulk` or `""` is refused with 422 `validation_failed`.
        Setting `dmarc_policy` changes the p= the domain's DMARC record asks
        for, as `restmail-api dns` prints it (DomainDMARCPolicy); any value other
        than `none`, `quarantine` or `reject` is refused the same way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDomainRequest"
            examples:
              updated:
                value:
                  sending_policy: transactional
              sending_policy_invalid:
                value:
                  sending_policy: newsletter
              dmarc_policy_invalid:
                value:
                  dmarc_policy: strict
              missing:
                value:
                  sending_policy: transactional
      responses:
        "200":
          description: Domain updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Domain"
              examples:
                updated:
                  value:
                    data:
                      id: 1
                      name: example.org
                      server_type: restmail
                      active: false
                      default_quota_bytes: 0
                      sending_policy: transactional
                      dmarc_policy: none
                      created_at: "2026-01-01T00:00:00Z"
                      updated_at: "2026-01-01T00:00:00Z"
        "404":
          description: No domain has this ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing:
                  value:
                    error:
                      code: domain_not_found
                      message: Domain not found
        "409":
          description: The domain has no currently valid certificate, so it cannot go live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                sending_policy_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          sending_policy: must be 'transactional', 'bulk' or empty
                dmarc_policy_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          dmarc_policy: must be 'none', 'quarantine' or 'reject'
        "429":
          description: Authentication refusals exceeded the configured rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '403':
          description: Requires a human 2FA sign-in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                two_factor_required:
                  value:
                    error:
                      code: two_factor_required
                      message: 'This action needs a session signed in with two-factor
                        authentication: sign in again with your code'
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          examples:
            found:
              value: 1
            missing:
              value: 2147483647
      operationId: deleteDomain
      tags: ["Admin: Domains"]
      security:
        - CookieAuth: [domains:delete]
        - BearerAuth: [domains:delete]
        - APIKeyAuth: [domains:delete]
      summary: Delete a domain
      description: "A domain containing accounts or aliases is refused with 409 domain_not_empty. An empty domain and its live pipelines, custom filters, sender rules, certificates, rotation keys, MTA-STS policy, relay credentials and suppressions are removed atomically. Grants on the domain and its mailbox scopes, including eligible activations, are removed through the audited grant-change mechanism; cached permissions are invalidated only after commit. Historical TLS reports, message traces, aggregate reports and audit entries are retained under their original identities and existing retention rules. A cleanup, audit or cancellation failure rolls the deletion back."
      description: >
        Only a domain with no accounts and no aliases can be deleted: delete
        those first.
      responses:
        "204":
          description: Domain deleted
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing:
                  value:
                    error:
                      code: domain_not_found
                      message: Domain not found
        "409":
          description: The domain still has accounts or aliases (`domain_not_empty`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

