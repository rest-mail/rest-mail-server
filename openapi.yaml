        schema:
          minimum: 0
          type: integer
      - name: reporter
        in: query
        description: Case-insensitive substring of the authenticated reporter domain;
          SQL wildcard characters are literal.
        required: false
        schema:
          maxLength: 255
          type: string
      - name: limit
        in: query
        required: false
        schema:
          maximum: 200
          type: integer
      - name: offset
        in: query
        required: false
        schema:
