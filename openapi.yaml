          application/json:
            schema:
              $ref: "#/components/schemas/CreateBanRequest"
      responses:
        "201":
          description: Ban created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Ban"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/bans/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    delete:
      operationId: deleteBan
      tags: ["Admin: Bans"]
      x-required-capability: bans:delete
      summary: Delete a ban by ID
      responses:
        "204":
          description: Ban deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/bans/ip/{ip}:
    parameters:
      - name: ip
        in: path
        required: true
        schema:
          type: string
        description: IP address to unban
    delete:
      operationId: unbanIP
      tags: ["Admin: Bans"]
      x-required-capability: bans:delete
      summary: Remove all bans for a specific IP
      responses:
        "204":
          description: IP unbanned
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Logs
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/logs/delivery:
    get:
      operationId: getDeliveryLogs
      tags: ["Admin: Logs"]
      x-required-capability: messages:read
      summary: Query delivery log (outbound queue history)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, delivering, deferred, delivered, bounced, expired]
        - name: sender
          in: query
          schema:
            type: string
        - name: recipient
          in: query
          schema:
            type: string
        - name: domain
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Delivery log entries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OutboundQueue"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

  /api/v1/admin/audit:
    get:
      operationId: listAuditEntries
      tags: ["Admin: Audit"]
      x-required-capability: audit:read
      summary: Read the audit log, newest first
      description: >-
        Entries newest first. To read the next page, pass the returned
        `pagination.cursor` as `before_seq`. A filter that does not parse is
        refused with 422, never ignored. This read is itself recorded
        (`audit.read`).
      parameters:
        - name: actor_kind
          in: query
          schema:
            type: string
            enum: [account, system, anonymous]
        - name: actor_id
          in: query
          description: The account (mailbox) id
          schema:
            type: integer
        - name: actor
          in: query
          description: Actor name (an address) contains this, in any case
          schema:
            type: string
        - name: action
          in: query
          description: Exact action, e.g. `auth.sign_in` or `admin.change`
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
            enum: [success, denied, failed, error]
        - name: since
          in: query
          description: Entries at or after this time (RFC 3339)
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: Entries at or before this time (RFC 3339)
          schema:
            type: string
            format: date-time
        - name: before_seq
          in: query
          description: Entries with a lower seq than this (the previous page's cursor)
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not an admin, or the session lacks audit:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/audit/verify:
    get:
      operationId: verifyAuditLog
      tags: ["Admin: Audit"]
      x-required-capability: audit:read
      summary: Check the audit log's hash chain
      description: >-
        Walks the whole log from its lowest seq and checks that every entry
        follows the one before (seq one higher, `prev_hash` its hash) and hashes
        to its own `hash`. Stops at the first entry that does not hold. If the
        log does not start at seq 1, the walk starts from the first entry's own
        `prev_hash` and says so in `note`. This read is itself recorded
        (`audit.read`).
      responses:
        "200":
          description: What the check found
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AuditVerifyResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not an admin, or the session lacks audit:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

