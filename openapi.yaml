      - CookieAuth:
        - mail:read
        - mail:send_as
      - CookieAuth:
        - mail:read
        - mail:send_on_behalf
      - BearerAuth:
        - mail:read
        - mail:send
      - BearerAuth:
        - mail:read
        - mail:send_as
      - BearerAuth:
        - mail:read
        - mail:send_on_behalf
      - APIKeyAuth:
        - mail:read
        - mail:send
      - APIKeyAuth:
        - mail:read
        - mail:send_as
      - APIKeyAuth:
        - mail:read
        - mail:send_on_behalf
      - BasicAuth:
        - mail:read
        - mail:send
      - BasicAuth:
        - mail:read
        - mail:send_as
      - BasicAuth:
        - mail:read
