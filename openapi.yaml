                      message: Request body failed validation
                      details:
                        fields:
                          source_address: required
                source_wrong_type:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          source_address: must be a string
                source_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          source_address: must be a valid email address
                body_array:
                  value:
                    error:
                      code: validation_failed
