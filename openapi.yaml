  # ═══════════════════════════════════════════════════════════════
  # Admin: DKIM
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/dkim:
    get:
      operationId: listDKIMKeys
      tags: ["Admin: DKIM"]
      security:
        - CookieAuth: [domains:read]
        - BearerAuth: [domains:read]
        - APIKeyAuth: [domains:read]
      summary: List DKIM key entries for all domains
      responses:
        "200":
          description: DKIM key list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DKIMEntry"

  /api/v1/admin/dkim/{id}/rotation:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getDKIMRotation
      tags: ["Admin: DKIM"]
      security:
        - CookieAuth: [domains:read]
        - BearerAuth: [domains:read]
        - APIKeyAuth: [domains:read]
      summary: Read a domain's DKIM rotation interval and state
      description: >
        Available even before a domain has a signing key. The capability must
        cover this domain. Besides the interval, it reports where the rotation
        worker has the domain: the staged key's TXT record to publish, when it
        was seen resolving and when signing moves to it, and the previous key
        retained through its retirement deadline, then published with an empty
        p= until that record resolves and for one more TTL before removal.
        revoked_at records the request; revocation_published_at records its
        first observation and removes_after is one TTL later. The state remains retiring.
      # Links fill the successful lookup; this named ID stays absent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          examples:
            found:
              value: 1
            missing:
              value: 2147483647
            revoked:
              value: 10
      responses:
        "200":
          description: DKIM rotation settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DKIMRotationSettings"
              examples:
                revoked:
                  summary: The previous selector is revoked for one more TTL
                  x-requires:
                    state: dkim_revocation
                  value:
                    data:
                      domain_id: 10
                      rotation_interval_days: 90
                      state: retiring
                      staged: null
                      previous:
                        selector: restmail-previous
                        record_name: restmail-previous._domainkey.example.com
                        record_value: "v=DKIM1; p="
                        published_at: "2026-10-20T00:00:00Z"
                        retire_after: "2026-10-21T00:00:00Z"
                        revoked_at: "2026-10-21T00:00:00Z"
                        revocation_published_at: "2026-10-21T00:00:00Z"
                        removes_after: "2026-10-21T01:00:00Z"
        "404":
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing:
                  value:
                    error:
                      code: not_found
                      message: Domain not found
    put:
      operationId: setDKIMRotation
      tags: ["Admin: DKIM"]
      security:
        - CookieAuth: [domains:write]
        - BearerAuth: [domains:write]
        - APIKeyAuth: [domains:write]
      summary: Set a domain's DKIM rotation interval
      description: >
        Stores the requested interval without changing signing material or key
        age. Zero disables rotation; 1 through 3650 specifies the key lifetime
        in days of 24 hours. The capability must cover this domain. The rotation
        worker reads the interval on its next tick; the response carries the
        rotation state as the read does. Unknown fields and trailing JSON are
        rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rotation_interval_days]
              properties:
                rotation_interval_days:
                  type: integer
                  minimum: 0
                  maximum: 3650
                  example: 90
            examples:
              configured:
                value: {rotation_interval_days: 90}
              body_array:
                value: []
              interval_wrong_type:
                value: {rotation_interval_days: "90"}
              field_unknown:
                value: {rotation_interval_days: 90, private_key: injected}
              interval_missing:
                value: {}
              interval_null:
                value: {rotation_interval_days: null}
              interval_negative:
                value: {rotation_interval_days: -1}
              interval_too_large:
                value: {rotation_interval_days: 3651}
      responses:
        "429":
          description: Too many authentication attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: DKIM rotation settings saved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DKIMRotationSettings"
              examples:
                configured:
                  value:
                    data: {domain_id: 1, rotation_interval_days: 90, state: stable, staged: null, previous: null}
        '400':
          description: The body is not valid JSON or not the declared media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: {}
        "404":
          $ref: "#/components/responses/NotFound"
        '422':
          description: Request failed validation (validation_failed), with details.fields naming each failing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                interval_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          rotation_interval_days: required
                interval_null:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          rotation_interval_days: must not be null
                interval_negative:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          rotation_interval_days: Must be an integer between 0 and 3650 days; 0 disables rotation
                interval_too_large:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          rotation_interval_days: Must be an integer between 0 and 3650 days; 0 disables rotation
                interval_wrong_type:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          rotation_interval_days: must be an integer
                field_unknown:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          private_key: not allowed
                body_array:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          body: the body is not a JSON object
  /api/v1/admin/dkim/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    put:
      operationId: setDKIMKey
      tags: ["Admin: DKIM"]
      security:
        - CookieAuth: [domains:write]
        - BearerAuth: [domains:write]
        - APIKeyAuth: [domains:write]
      summary: Set or replace DKIM key for a domain
      description: >
        The key and selector are checked before they are stored, so a domain is
        never left with a key its outbound mail cannot be signed with (signing
        fails closed and defers the mail). The selector must be a DNS name: up
        to 63 characters, labels of letters, digits and hyphens joined by dots,
        none starting or ending with a hyphen. The key must be an RSA key of at
        least 2048 bits (PKCS#1 or PKCS#8 PEM) or an Ed25519 key (PKCS#8 PEM),
        and must sign a test message whose signature verifies against the
        key's own DNS record. Ed25519 is import-only: the server's own key
        generation makes RSA keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDKIMKeyRequest"
            examples:
              installed:
                value: {selector: contract, private_key: fixture-signing-key}
              body_array:
                value: []
              selector_missing:
                value: {private_key: fixture-signing-key}
              selector_empty:
                value: {selector: "", private_key: fixture-signing-key}
              selector_wrong_type:
                value: {selector: 42, private_key: fixture-signing-key}
              private_key_missing:
                value: {selector: contract}
              private_key_empty:
                value: {selector: contract, private_key: ""}
              private_key_wrong_type:
                value: {selector: contract, private_key: 42}
              selector_invalid:
                value: {selector: invalid_selector, private_key: fixture-signing-key}
              private_key_invalid:
                value: {selector: contract, private_key: not a key}
      responses:
        "429":
          description: Too many authentication attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: DKIM key set
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DKIMEntry"
              examples:
                installed:
                  value:
                    data:
                      domain_id: 1
                      domain: example.com
                      selector: contract
                      has_key: true
                      created_at: "2026-10-01T12:00:00Z"
                      age_seconds: 0
          links:
            deleteDKIMKey:
              operationId: deleteDKIMKey
              parameters:
                id: '$request.path.id'
        '400':
          description: The body is not valid JSON or not the declared media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: {}
        "404":
          $ref: "#/components/responses/NotFound"
        '422':
          description: Request failed validation (validation_failed), with details.fields naming each failing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                selector_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          selector: Must be a DNS label (letters, digits, hyphens), at most 63 characters
                private_key_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          private_key: is not a PEM-encoded private key
                selector_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          selector: required
                selector_empty:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          selector: Must be a DNS label (letters, digits, hyphens), at most 63 characters
                selector_wrong_type:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          selector: must be a string
                private_key_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          private_key: required
                private_key_empty:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          private_key: required
                private_key_wrong_type:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          private_key: must be a string
                body_array:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          body: the body is not a JSON object
    delete:
      operationId: deleteDKIMKey
      tags: ["Admin: DKIM"]
      security:
        - CookieAuth: [domains:write]
        - BearerAuth: [domains:write]
        - APIKeyAuth: [domains:write]
      summary: Delete DKIM key for a domain
      responses:
        "204":
          description: DKIM key deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Certificates
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/certificates:
    get:
      operationId: listCertificates
      tags: ["Admin: Certificates"]
      security:
        - CookieAuth: [domains:read]
        - BearerAuth: [domains:read]
        - APIKeyAuth: [domains:read]
      summary: List TLS certificates
      responses:
        "200":
          description: Certificate list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Certificate"
    post:
      operationId: createCertificate
      tags: ["Admin: Certificates"]
      security:
        - CookieAuth: [domains:write]
        - BearerAuth: [domains:write]
        - APIKeyAuth: [domains:write]
      summary: Upload a new TLS certificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificateRequest"
            examples:
              valid:
                summary: The hook supplies a fresh certificate and the created domain
                value: {domain_id: 1, cert_pem: certificate, key_pem: key, auto_renew: false}
              invalid_body:
                summary: An array cannot decode as a certificate request
                value: []
              fields_missing:
                summary: Required certificate fields are missing
                value: {}
      responses:
        "201":
          description: Certificate created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Certificate"
              examples:
                valid:
                  value:
                    data:
                      id: 1
                      domain_id: 1
                      issuer: CN=contract.example.org
                      not_before: "2026-01-01T00:00:00Z"
                      not_after: "2026-01-31T00:00:00Z"
                      auto_renew: false
                      created_at: "2026-01-01T00:00:00Z"
                      updated_at: "2026-01-01T00:00:00Z"
                      domain:
                        id: 1
                        name: contract.example.org
                        server_type: traditional
                        active: false
                        default_quota_bytes: 1073741824
                        dkim_selector: ""
                        sending_policy: ""
                        dmarc_policy: none
                        created_at: "2026-01-01T00:00:00Z"
                        updated_at: "2026-01-01T00:00:00Z"
          links:
            getCertificate:
              operationId: getCertificate
              parameters:
                id: '$response.body#/data/id'
            deleteCertificate:
              operationId: deleteCertificate
              parameters:
                id: '$response.body#/data/id'
        '400':
          description: The body is not valid JSON or not the declared media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: {}
        '422':
          description: Request failed validation (validation_failed), with details.fields naming each failing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                fields_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          domain_id: required
                          cert_pem: required
                          key_pem: required
                invalid_body:
                  summary: Not JSON or not an object
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          body: the body is not a JSON object
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/certificates/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getCertificate
      tags: ["Admin: Certificates"]
      security:
        - CookieAuth: [domains:read]
        - BearerAuth: [domains:read]
        - APIKeyAuth: [domains:read]
      summary: Get certificate details (includes cert_pem)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          examples:
            found:
              value: 1
            missing:
              value: 2147483647
      responses:
        "200":
          description: Certificate details with PEM data
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CertificateDetail"
          links:
            deleteCertificate:
              operationId: deleteCertificate
              parameters:
                id: '$request.path.id'
        "404":
          description: Certificate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing:
                  value:
                    error:
                      code: not_found
                      message: Certificate not found
    delete:
      operationId: deleteCertificate
      tags: ["Admin: Certificates"]
      security:
        - CookieAuth: [domains:write]
        - BearerAuth: [domains:write]
        - APIKeyAuth: [domains:write]
      summary: Delete a certificate
      responses:
        "204":
          description: Certificate deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Bans
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/bans:
    get:
      operationId: listBans
      tags: ["Admin: Bans"]
      security:
        - CookieAuth: [bans:read]
        - BearerAuth: [bans:read]
        - APIKeyAuth: [bans:read]
      summary: List IP bans
      parameters:
        - name: protocol
          in: query
          schema:
            type: string
            enum: [smtp, imap, pop3, all]
        - name: ip
          in: query
          schema:
            type: string
        - name: active
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "422":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Ban list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Ban"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
    post:
      operationId: createBan
      tags: ["Admin: Bans"]
      security:
        - CookieAuth: [bans:write]
        - BearerAuth: [bans:write]
        - APIKeyAuth: [bans:write]
      summary: Create an IP ban
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBanRequest"
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              created:
                value:
                  ip: 192.0.2.10
                  reason: Repeated failed sign-ins
                  protocol: all
                  duration: 1h
                  created_by: admin@restmail.test
              # No IP: refused before anything is looked up or stored.
              ip_missing:
                value:
                  reason: Repeated failed sign-ins
                  protocol: all
                  duration: 1h
                  created_by: admin@restmail.test
              # A duration Go cannot parse: refused before anything is looked
              # up or stored.
              duration_invalid:
                value:
                  ip: 192.0.2.10
                  reason: Repeated failed sign-ins
                  protocol: all
                  duration: not-a-duration
                  created_by: admin@restmail.test
      responses:
        "201":
          description: Ban created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Ban"
              examples:
                created:
                  value:
                    data:
                      id: 1
                      ip: 192.0.2.10
                      reason: Repeated failed sign-ins
                      protocol: all
                      created_by: admin@restmail.test
                      expires_at: "2026-01-01T01:00:00Z"
                      created_at: "2026-01-01T00:00:00Z"
          links:
            deleteBan:
              operationId: deleteBan
              parameters:
                id: '$response.body#/data/id'
        "422":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                ip_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          ip: IP address is required
                duration_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          duration: invalid duration format (e.g. 24h, 168h)

        "429":
          description: Authentication refusals exceeded the configured rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/bans/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    delete:
      operationId: deleteBan
      tags: ["Admin: Bans"]
      security:
        - CookieAuth: [bans:delete]
        - BearerAuth: [bans:delete]
        - APIKeyAuth: [bans:delete]
      summary: Delete a ban by ID
      responses:
        "204":
          description: Ban deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/bans/ip/{ip}:
    parameters:
      - name: ip
        in: path
        required: true
        schema:
          type: string
        description: IP address to unban
        example: 192.0.2.10
    delete:
      operationId: unbanIP
      tags: ["Admin: Bans"]
      security:
        - CookieAuth: [bans:delete]
        - BearerAuth: [bans:delete]
        - APIKeyAuth: [bans:delete]
      summary: Remove all bans for a specific IP
      responses:
        "204":
          description: IP unbanned
        "404":
          $ref: "#/components/responses/NotFound"

