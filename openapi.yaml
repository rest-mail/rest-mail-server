  /api/v1/accounts/{id}/credentials:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: listCredentials
      tags: [Credentials]
      security:
        - CookieAuth: [mailbox:manage]
        - BearerAuth: [mailbox:manage]
      summary: List an account's app passwords
      description: >
        The app passwords of the account that are not revoked, newest first;
        expired ones are included. Never a secret or its hash. `{id}` is the
        session's own account, or one it holds `mailbox:manage` on (an account
        it owns, such as an automation's with no password of its own); any
        other is answered 404.
      responses:
        "200":
          description: The app passwords
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Credential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createAppPassword
      tags: [Credentials]
      security:
        - CookieAuth: [mailbox:manage]
        - BearerAuth: [mailbox:manage]
      summary: Make an app password
      description: >
        Makes an app password for a mail client or an automation and answers
        with it, the only time it is ever shown; the server keeps only a SHA-256
        of its secret. Its scope is the account's mailbox, with mail:read,
        mail:write and mail:send. `{id}` is the session's own account or one it
        holds `mailbox:manage` on. Needs a session from signing in with a
        password and a second factor (`403 two_factor_required` otherwise).
        That sign-in must be within the configured sudo window, at most 15
        minutes (`403 recent_two_factor_required` otherwise). It also needs the session's own
        current password, entered again in `password`, as Gmail and GitHub ask
        for it:
        a session from before a change of password works until its access
        token expires, and must not make an app password that outlives the
        change. Throttled like login, with the same budget. Recorded in the
        audit log as `credentials.create`, with the name, id and public id; a
        refused attempt is recorded as denied, with its error code. The
        password is never stored, recorded or answered with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: iPhone Mail
                expires_at:
                  type: string
                  format: date-time
                  description: When it stops working; in the future. Omit for never.
                password:
                  type: string
                  format: password
                  writeOnly: true
                  description: The session's own current password, entered again.
            examples:
              created:
                value: {name: iPhone Mail}
              name_missing:
                value: {}
              name_empty:
                value: {name: ""}
              name_too_long:
                value: {name: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"}
              name_control:
                value: {name: "Mail\nClient"}
      responses:
        "201":
          description: Made; `password` is shown this once
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CreatedAppPassword"
              examples:
                created:
                  value:
                    data:
                      id: 1
                      name: iPhone Mail
                      kind: app_password
                      public_id: 7Kq2xT9bLm4P
                      created_at: "2026-01-01T00:00:00Z"
                      last_used_at: null
                      expires_at: null
                      password: "rm_7Kq2xT9bLm4P_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          links:
            revokeCredential:
              operationId: revokeCredential
              parameters:
                id: '$request.path.id'
                credential_id: '$response.body#/data/id'
        "401":
          $ref: "#/components/responses/Unauthorized"
        '403':
          description: Requires a human 2FA sign-in (two_factor_required); sensitive changes require recent proof (recent_two_factor_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                two_factor_required:
                  value:
                    error:
                      code: two_factor_required
                      message: 'This action needs a session signed in with two-factor authentication: sign in again
                        with your code'
                recent_two_factor_required:
                  value:
                    error:
                      code: recent_two_factor_required
                      message: 'Sign in again with two-factor authentication: a recent second factor is required'
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: name missing, empty, longer than 100 characters or containing control characters, or expires_at not in the future
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                name_missing:
                  value: {error: {code: validation_failed, message: Request body failed validation, details: {fields: {name: required}}}}
                name_empty:
                  value: {error: {code: validation_failed, message: Request body failed validation, details: {fields: {name: required}}}}
                name_too_long:
                  value: {error: {code: validation_failed, message: Request body failed validation, details: {fields: {name: must be at most 100 characters}}}}
                name_control:
                  value: {error: {code: validation_failed, message: Request body failed validation, details: {fields: {name: must not contain control characters}}}}
        "429":
          description: Too many attempts from this client; shares login's budget

