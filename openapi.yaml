  /api/v1/messages/send:
    post:
      operationId: sendMessage
      tags: [Messages]
      security:
        - CookieAuth: [mail:send]
        - CookieAuth: [mail:send_as]
        - CookieAuth: [mail:send_on_behalf]
        - BearerAuth: [mail:send]
        - BearerAuth: [mail:send_as]
        - BearerAuth: [mail:send_on_behalf]
        - APIKeyAuth: [mail:send]
        - APIKeyAuth: [mail:send_as]
        - APIKeyAuth: [mail:send_on_behalf]
        - BasicAuth: [mail:send]
        - BasicAuth: [mail:send_as]
        - BasicAuth: [mail:send_on_behalf]
      summary: Compose and send a new message
      description: >-
        Sending from your own mailbox requires mail:send. Another mailbox in
        From requires mail:send_as on that mailbox. Set on_behalf to true to
        require mail:send_on_behalf instead: From stays the represented mailbox
        and RFC 5322 Sender is the authenticated account’s stored address.
        Read access grants neither mode. Both modes audit the actual account,
        credential, represented mailbox and sending mode.
        The sender domain's `sending_policy` decides whether the message
        carries `list_unsubscribe`: a `bulk` domain's message without it is
        refused with 422 `validation_failed` on `list_unsubscribe`, and a
        `transactional` domain's message with it is refused the same way.
        With no policy, either is sent. A one-click HTTPS target without a
        signing key is 422 `validation_failed` on `list_unsubscribe.https`;
        scheduling refusals name `scheduled_at` in `details.fields`.
        An unknown sender and a sender with no link to the caller return
        identical 404 `not_found` answers. A visible sender without the
        selected sending capability returns 403 `forbidden`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              # imap.restmail.test resolves in the testbed but takes no mail
              # on port 25: the delivery is refused for now and the queue
              # entry is deferred, so the queue operations' links have one to
              # retry. A domain that does not resolve bounces at once.
              valid:
                value:
                  from: admin@restmail.test
                  to: [admin@restmail.test, someone@imap.restmail.test]
                  subject: Hello
                  body_text: Sent through the REST API.
              # No from: refused before the sender is looked up.
              from_missing:
                value:
                  to: [admin@restmail.test, someone@imap.restmail.test]
                  subject: Hello
                  body_text: Sent through the REST API.
              # A List-Unsubscribe target from a transactional domain. The
              # contract run makes restmail.test transactional for this
              # request alone (tests/contract/hooks.py).
              unsubscribe_not_allowed:
                value:
                  from: admin@restmail.test
                  to: [admin@restmail.test, someone@imap.restmail.test]
                  subject: Hello
                  body_text: Sent through the REST API.
                  list_unsubscribe:
                    mailto: unsubscribe@restmail.test
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Message"
              examples:
                # The sender's copy, filed in its Sent folder.
                valid:
                  value:
                    data:
                      id: 1
                      mailbox_id: 1
                      folder: Sent
                      sender: admin@restmail.test
                      subject: Hello
                      body_text: Sent through the REST API.
                      is_read: true
                      is_flagged: false
                      is_starred: false
                      is_draft: false
                      is_deleted: false
                      received_at: "2026-10-21T12:00:00Z"
                      created_at: "2026-10-21T12:00:00Z"
                      updated_at: "2026-10-21T12:00:00Z"
          links:
            getMessage:
              operationId: getMessage
              parameters:
                id: '$response.body#/data/id'
            updateMessage:
              operationId: updateMessage
              parameters:
                id: '$response.body#/data/id'
            getRawMessage:
              operationId: getRawMessage
              parameters:
                id: '$response.body#/data/id'
            forwardMessage:
              operationId: forwardMessage
              parameters:
                id: '$response.body#/data/id'
            listAttachments:
              operationId: listAttachments
              parameters:
                id: '$response.body#/data/id'
            getMessageTrace:
              operationId: getMessageTrace
              parameters:
                id: '$response.body#/data/id'
            deleteMessage:
              operationId: deleteMessage
              parameters:
                id: '$response.body#/data/id'
            # A message sent with a calendar_event keeps the invitation in
            # its Sent copy (#1163).
            respondToCalendar:
              operationId: respondToCalendar
              parameters:
                id: '$response.body#/data/id'
        "202":
          description: Accepted and scheduled for the time in `scheduled_at`
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ScheduledSend"
          links:
            cancelScheduledMessage:
              operationId: cancelScheduledMessage
              parameters:
                id: '$response.body#/data/id'
        '400':
          description: The body is not valid JSON or not the declared media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: {}
        '404':
          description: The sender is missing or the caller has no link to it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request failed validation (validation_failed), with details.fields naming each failing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                unsubscribe_not_allowed:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          list_unsubscribe: 'The sender domain sends transactional mail, which carries no List-Unsubscribe field: omit list_unsubscribe'
                from_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          from: from is required
