        - mail:write
      - APIKeyAuth:
        - mail:write
      - BasicAuth:
        - mail:write
  /api/v1/accounts/{id}/threads/{threadID}/snooze:
    post:
      summary: Snooze a thread or cancel its snooze
      description: Hides every message in this account's thread from folder listings without changing
        messages or search results. A future snoozed_until sets or replaces the durable deadline;
        null cancels it. The existing background worker returns due threads at startup and within
        30 seconds of their deadline, publishing folder_update to the account's event streams.
      operationId: snoozeThread
      tags:
      - Messages
      parameters:
      - name: id
        in: path
        required: true
        schema:
          minimum: 1
          type: integer
        examples:
          cancelled:
            value: 1
          invalid_id:
            description: Real transport and path binding are exercised. The JSON body is valid;
              invalid-body flags do not describe path validation. The test cap is512 bytes; oversize
              hook sends513 bytes.
            value: 0
          key_read:
            value: 1
            x-requires:
              principal: without_capability
          malformed_json:
            description: The wire body is the raw truncated JSON byte {, with application/json
              content type. The route and Vertrag transport hook send those exact bytes rather
              than JSON-quoting them.
            value: 1
            x-requires:
              body: malformed
          malformed_time:
            value: 1
          snoozed_until_missing:
            value: 1
          snoozed_until_wrong_type:
            value: 1
          no_grants:
            value: 1
            x-requires:
              principal: without_capability
          past:
            value: 1
          rate_limited:
            value: 1
            x-requires:
              limit: rate
          request_too_large:
            description: Real transport and path binding are exercised. The JSON body is valid;
              invalid-body flags do not describe path validation. The test cap is512 bytes; oversize
              hook sends513 bytes.
            value: 1
            x-requires:
              body: over_cap
          session_unavailable:
            value: 1
            x-requires:
              fault: session_store
          snoozed:
            value: 1
          thread_missing:
            value: 1
          unauthenticated:
            value: 1
            x-requires:
              principal: anonymous
          write_unavailable:
            value: 1
            x-requires:
              fault: database
      - name: threadID
