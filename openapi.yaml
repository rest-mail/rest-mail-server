        - APIKeyAuth: [accounts:write]
      summary: Create a new alias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAliasRequest"
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              created:
                value:
                  source_address: sales@restmail.test
                  destination_address: admin@restmail.test
              # No source address: refused before anything is looked up or
              # stored.
              source_missing:
                value:
                  destination_address: admin@restmail.test
              # A source that is not one mail address: refused after the
              # required fields, before its domain is looked up or anything
              # is stored.
              source_invalid:
