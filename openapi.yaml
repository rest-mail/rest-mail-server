  # ═══════════════════════════════════════════════════════════════
  # SSE
  # ═══════════════════════════════════════════════════════════════
  /api/v1/accounts/{id}/events:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: accountEvents
      tags: [SSE]
      security:
        - CookieAuth: [mail:read]
        - BearerAuth: [mail:read]
      summary: Server-Sent Events stream for real-time updates
      description: >
        Authenticated by the restmail_access cookie, which a native browser
        EventSource attaches automatically — no token in the URL and none in
        JavaScript. Programmatic clients may instead send an Authorization:
        Bearer header. GET, so no CSRF token is required. The session is
        checked when the stream opens, and again before every event and
        keepalive: once the account's sessions end, the stream ends without
        sending anything more, and opening it again with the same token
        answers 401. Access lookup failures return 500 before any stream opens;
        a missing account, or one the caller may not know of, answers 404.
        An account the caller can see without mail:read answers 403.
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE formatted event stream
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ═══════════════════════════════════════════════════════════════
  # Inbound (Internal / Gateway)
  # ═══════════════════════════════════════════════════════════════
  /api/mailboxes:
    get:
      operationId: checkMailboxAddress
      tags: [Inbound]
      summary: Check if a mailbox address exists (used by SMTP gateway)
      description: >-
        Machine-to-machine recipient check. When internal mTLS is enabled this route
        is served ONLY on the dedicated internal listener (verified gateway client
        certificate required) and is absent from the public listener; when disabled
        it is unauthenticated on the public listener. Never accepts a user JWT.
        It applies the rule delivery applies: an address that is not a mailbox here, or is one
        that may not receive, or is on a domain that is not live, is 200 with exists false, so
        the gateway refuses it at RCPT (or, on authenticated submission, routes it outbound).
        A failed mailbox lookup is 500, never a missing recipient.
        A reserved alias that cannot route is 403 rejected, never an outbound recipient;
        the gateway answers its SMTP peer 550.
      security: []
      x-internal-mtls: true
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            format: email
          examples:
            address_empty:
              value: ""
            address_missing:
              summary: No address is sent
            address_unavailable:
              value: unavailable@example.com
            found:
              value: user@example.com
      responses:
        "200":
          description: Mailbox lookup result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MailboxCheck"

        '403':
          description: A reserved alias that cannot route (rejected)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request failed validation (validation_failed), with details.fields naming each failing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                address_empty:
                  value: {"error": {"code": "validation_failed", "message": "Request body failed validation", "details": {"fields": {"address": "address query parameter required"}}}}
                address_missing:
                  value: {"error": {"code": "validation_failed", "message": "Query parameters failed validation", "details": {"fields": {"address": "required"}}}}
  /api/v1/messages/deliver:
    post:
      operationId: deliverMessage
      tags: [Inbound]
      summary: Deliver a message from the SMTP gateway
      description: >-
        Machine-to-machine inbound delivery. When internal mTLS is enabled this route
        is served ONLY on the dedicated internal listener (verified gateway client
        certificate required) and is absent from the public listener; when disabled
        it is unauthenticated on the public listener. Never accepts a user JWT.
        Stored text, recipient JSON strings and keys, and decoded raw_message octets
        must not contain NUL (U+0000); invalid input is 422 validation_failed naming
        the field before any write. raw_message is standard padded base64 (format: byte).
        Empty or omitted folder means INBOX; a nonempty name is at most 255 UTF-8 bytes,
        has no surrounding whitespace, control characters or "..".
      security: []
      x-internal-mtls: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliverMessageRequest"
            examples:
              address_empty:
                value: {"address": ""}
              body_array:
                value: []
              deferred:
                value: {"address": "admin@restmail.test", "sender": "sender@example.net", "subject": "Hello", "body_text": "Hello"}
              delivered:
                value: {"address": "admin@restmail.test", "sender": "sender@example.net", "subject": "Subject", "body_text": "Hello"}
              folder_invalid:
                value: {"address": "admin@restmail.test", "sender": "sender@example.net", "subject": "Hello", "body_text": "Hello", "folder": " Archive"}
              internal_error:
                value: {"address": "admin@restmail.test", "sender": "sender@example.net", "subject": "Subject", "body_text": "Hello"}
              mailbox_id_zero:
                value: {"mailbox_id": 0}
              no_mailbox:
                value: {"address": "nobody@restmail.test", "sender": "sender@example.net", "subject": "Hello", "body_text": "Hello"}
              no_mailbox_by_id:
                value: {"mailbox_id": 2147483647}
              processed:
                value: {"address": "admin@restmail.test", "sender": "sender@example.net", "subject": "Hello", "body_text": "Hello"}
              recipient_missing:
                value: {"subject": "Hello", "body_text": "Hello"}
              rejected:
                value: {"address": "admin@restmail.test", "sender": "sender@example.net", "subject": "Hello", "body_text": "Hello"}
      responses:
        "201":
          description: Message delivered
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Message"
        "422":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                address_empty:
                  value: {"error": {"code": "validation_failed", "message": "Request body failed validation", "details": {"fields": {"address": "mailbox_id or address required"}}}}
                body_array:
                  value: {"error": {"code": "validation_failed", "message": "Request body failed validation", "details": {"fields": {"body": "the body is not a JSON object"}}}}
                folder_invalid:
                  value: {"error": {"code": "validation_failed", "message": "Request body failed validation", "details": {"fields": {"folder": "must not begin or end with a space"}}}}
                mailbox_id_zero:
                  value: {"error": {"code": "validation_failed", "message": "Request body failed validation", "details": {"fields": {"address": "mailbox_id or address required"}}}}
                recipient_missing:
                  value: {"error": {"code": "validation_failed", "message": "Request body failed validation", "details": {"fields": {"address": "mailbox_id or address required"}}}}

  # ═══════════════════════════════════════════════════════════════
  # RESTMAIL Protocol
  # ═══════════════════════════════════════════════════════════════
  /.well-known/restmail:
    get:
      operationId: restmailDiscover
      tags: [RESTMAIL]
      summary: Discover RESTMAIL delivery for a hosted domain
      description: |
        Fetch from the recipient domain's MX host over HTTPS, verifying the
        certificate against that MX host. The response names the HTTPS base URL
        for RESTMAIL; append /messages to deliver. The endpoint uses the configured
        GATEWAY_HOSTNAME, never request Host or forwarding headers. This is a
        per-domain lookup and reveals no mailbox information. Active hosted
        domains are supported regardless of their server_type.

        The response is a protocol document without a data envelope. Responses
        use Cache-Control: no-store. A verified 404 means the domain is not hosted
        here; configuration or database failures return 503 or 500, never 404.
        Sender discovery and peer memory are implemented separately.
      security: []
      parameters:
        - name: domain
          in: query
          required: true
          description: Exactly one fully-qualified recipient domain, never a single label or a mailbox address. Case, a trailing dot and internationalized names are normalized as for domain creation; a name IDNA refuses is 422 validation_failed even when it matches this pattern.
          schema:
            type: string
            pattern: '[a-z]\.[a-z]|\.\S|[。．｡]'
          example: restmail.test
      responses:
        "200":
          description: Delivery base URL for this domain
          content:
            application/json:
              schema:
                type: object
                required: [endpoint]
                additionalProperties: false
                properties:
                  endpoint:
                    type: string
                    format: uri
                    pattern: '^https://'
              example:
                endpoint: https://restmail.test/restmail
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: Domain lookup failed; retry discovery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: GATEWAY_HOSTNAME must be configured as a fully qualified hostname
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        '422':
          description: Request failed validation (validation_failed), with details.fields naming each failing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /restmail/capabilities:
    get:
      operationId: restmailCapabilities
      tags: [RESTMAIL]
      summary: Get RESTMAIL server capabilities
      security: []
      responses:
        "200":
          description: Server capabilities
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RestmailCapabilities"

  /restmail/mailboxes:
    get:
      operationId: restmailCheckMailbox
      tags: [RESTMAIL]
      summary: Check if a recipient mailbox exists
      description: >-
        It applies the rule delivery applies: an address that is not a mailbox here, or is one
        that may not receive, or is on a domain that is not live, is 200 with exists false.
      security: []
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            format: email
          example: admin@restmail.test
      responses:
        "200":
          description: Mailbox check result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RestmailMailboxCheck"

  /restmail/messages:
    post:
      operationId: restmailDeliver
      tags: [RESTMAIL]
      summary: Deliver a message via RESTMAIL protocol
      description: >-
        Server-to-server delivery. Unauthenticated at the HTTP layer; a delivery must
        come from a trusted peer network or carry a DKIM signature aligned with its
        From domain, unless it is external mail accepted by non-strict mode. A failed
        sender-domain lookup cannot establish an external sender. Failed sender,
        recipient or inbound-policy lookups and corrupt stored policy defer with 503.
        Recipient lookups finish before delivery side effects. A genuine absent
        recipient remains a permanent failure.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestmailDeliverRequest"
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              # A sender domain that publishes no DMARC record: example.com's
              # p=reject would have the inbound pipeline reject the message.
              delivered:
                value:
                  from: someone@ext-contract.test
                  to: [eve@restmail.test]
                  subject: Delivered over RESTMAIL
                  body_text: Hello, Eve.
                  message_id: <restmail-delivery@ext-contract.test>
                  date: "Sat, 17 Oct 2026 12:00:00 +0000"
              # No recipients: refused before the sender is looked up or
              # anything is verified or stored.
              recipients_missing:
                value:
                  from: someone@ext-contract.test
                  subject: Delivered over RESTMAIL
                  body_text: Hello, Eve.
