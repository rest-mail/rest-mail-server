          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Data-UnsubscribedOneClick'
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'request_too_large: the body is over the API''s size cap'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: Unprocessable Entity
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'rate_limited: refused API keys or HTTP Basic credentials, throttled at login''s rate'
          headers:
            Retry-After:
              description: Seconds until a request may be made again
              required: true
              schema:
                type: integer
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Gateway
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'unavailable: the credential or session check could not be made'
      security:
      - CookieAuth:
        - mail:write
      - BearerAuth:
        - mail:write
      - APIKeyAuth:
        - mail:write
      - BasicAuth:
        - mail:write
      summary: Unsubscribe with RFC 8058 one-click
      tags:
      - Messages
  /api/v1/messages/{id}/unsubscribe/mailto:
