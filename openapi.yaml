        failure category, the attempts made and when the last one was. A remote recipient is read from its
        outbound queue row; a local one from the copy the send put in that mailbox. The remote server''s
        own reply is never returned, only the category''s reason. A message this account did not send has
        no recipients. Uses the same mail:read authorization as reading the message; another account''s
        message is 404.'
      operationId: listMessageRecipients
      tags:
      - Messages
      parameters:
      - name: id
        in: path
        required: true
        schema:
          minimum: 1
          type: integer
        examples:
          invalid_id:
            value: 0
          missing:
            value: 2147483647
          partly_failed:
            description: One recipient's server refused the message and another accepted it. The reason
              comes from the failure category; the remote server's own reply is never returned.
            value: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
