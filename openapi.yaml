                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/FilterResult"
              examples:
                # header_validate's answer for an email with its From and Date.
                valid:
                  value:
                    data:
                      type: action
                      action: continue
                      log:
                        filter: header_validate
                        result: pass
                        detail: all headers valid
        '422':
          description: Request failed validation (validation_failed), with details.fields naming each failing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                filter_name_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          filter_name: required
                filter_name_wrong_type:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          filter_name: must be a string
                invalid_body:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          body: the body is not a JSON object
        '400':
          description: The body is not valid JSON or not the declared media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: {}
        "429":
          description: Too many pipeline preview requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal lookup, stored configuration or filter execution failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/pipelines/logs:
    get:
      operationId: listPipelineLogs
      tags: ["Admin: Pipelines"]
      security:
        - CookieAuth: [pipelines:read]
        - BearerAuth: [pipelines:read]
        - APIKeyAuth: [pipelines:read]
      summary: List recent per-message pipeline traces
      description: >-
        Newest-first list of per-message pipeline traces. Each row is a
        MessageTrace (outcome, reason_code, transport, envelope, stage timeline,
        duration). The `action` filter matches the trace's final_action.
      parameters:
        - name: pipeline_id
          in: query
          schema:
            type: integer
        - name: direction
          in: query
          schema:
            type: string
            enum: [inbound, outbound]
        - name: action
          in: query
          description: Matches MessageTrace.final_action
          schema:
            type: string
            enum: [continue, reject, quarantine, discard, defer]
        - name: rfc_message_id
          in: query
          description: RFC 5322 Message-ID correlation key
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
            enum: [delivered, queued, rejected, quarantined, discarded, deferred]
        - name: reason_code
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "422":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Pipeline message traces
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MessageTrace"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Custom Filters
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/custom-filters:
    get:
      operationId: listCustomFilters
      tags: ["Admin: Custom Filters"]
      security:
        - CookieAuth: [pipelines:read]
        - BearerAuth: [pipelines:read]
        - APIKeyAuth: [pipelines:read]
      summary: List custom filters, optionally filtered by domain
      parameters:
        - name: domain_id
          in: query
          schema:
            type: integer
      responses:
        "422":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Custom filter list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomFilter"
    post:
      operationId: createCustomFilter
      tags: ["Admin: Custom Filters"]
      security:
        - CookieAuth: [pipelines:write]
        - BearerAuth: [pipelines:write]
        - APIKeyAuth: [pipelines:write]
      summary: Create a custom filter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomFilterRequest"
            # Pair each request only with the response bearing its name (#386).
            examples:
              created:
                value:
                  name: tag-invoices
                  description: Tags mail about invoices
                  filter_type: action
                  direction: inbound
                  config:
                    script: |
                      function filter(email) {
                        return { action: "continue" };
                      }
                  enabled: false
              filter_type_invalid:
                value:
                  name: tag-invoices
                  description: Tags mail about invoices
                  filter_type: invalid
                  direction: inbound
                  config:
                    script: |
                      function filter(email) {
                        return { action: "continue" };
                      }
                  enabled: false
              enabled_wrong_type:
                value: {domain_id: 1, name: test, filter_type: action, direction: inbound, config: {}, enabled: "false"}

      responses:
        "201":
          description: Custom filter created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CustomFilter"
              examples:
                created:
                  value:
                    data:
                      id: 1
                      domain_id: 1
                      name: tag-invoices
                      description: Tags mail about invoices
                      filter_type: action
                      direction: inbound
                      config:
                        script: |
                          function filter(email) {
                            return { action: "continue" };
                          }
                      enabled: false
                      created_at: "2026-01-01T00:00:00Z"
                      updated_at: "2026-01-01T00:00:00Z"
          links:
            getCustomFilter:
              operationId: getCustomFilter
              parameters:
                id: '$response.body#/data/id'
            updateCustomFilter:
              operationId: updateCustomFilter
              parameters:
                id: '$response.body#/data/id'
            testCustomFilter:
              operationId: testCustomFilter
              parameters:
                id: '$response.body#/data/id'
            deleteCustomFilter:
              operationId: deleteCustomFilter
              parameters:
                id: '$response.body#/data/id'
        "422":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                filter_type_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          filter_type: must be action or transform

                enabled_wrong_type:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          enabled: must be a boolean

        "429":
          description: Authentication refusals exceeded the configured rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/custom-filters/validate:
    post:
      operationId: validateCustomFilter
      tags: ["Admin: Custom Filters"]
      security:
        - CookieAuth: [pipelines:write]
        - BearerAuth: [pipelines:write]
        - APIKeyAuth: [pipelines:write]
      summary: Syntax-check a JavaScript filter script via the sidecar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [script]
              properties:
                script:
                  type: string
                  minLength: 1
                  description: JavaScript filter source to validate
                email:
                  type: object
                  description: Optional sample email passed through to the sidecar
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              valid:
                value:
                  script: |
                    function filter(email) {
                      return { action: "continue" };
                    }
              # No script: refused before the sidecar is asked.
              script_missing:
                value: {}
              # Not an object at all: refused before the body is read for a
              # script.
              body_array:
                value: []
      responses:
        "200":
          description: >-
            Raw validation result proxied verbatim from the JS filter sidecar
            (shape determined by the sidecar).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
                # The sidecar's answer for a script that compiles, sent with no
                # sample email to dry-run it on.
                valid:
                  value:
                    valid: true
        '400':
          description: The body is not valid JSON or not the declared media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: {}
        '422':
          description: Request failed validation (validation_failed), with details.fields naming each failing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                script_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          script: required
                body_array:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          body: the body is not a JSON object
        "503":
          description: >-
            JS filter sidecar unavailable, or it refused the API's token
            (JS_FILTER_TOKEN differs between the API and the sidecar)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "429":
          description: Authentication refusals exceeded the configured rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/custom-filters/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getCustomFilter
      tags: ["Admin: Custom Filters"]
      security:
        - CookieAuth: [pipelines:read]
        - BearerAuth: [pipelines:read]
        - APIKeyAuth: [pipelines:read]
      summary: Get a custom filter by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: Resource ID
          examples:
            found:
              value: 1
            missing:
              value: 2147483647
      responses:
        "200":
          description: Custom filter details
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CustomFilter"
        "404":
          description: Custom filter not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing:
                  value:
                    error:
                      code: not_found
                      message: Custom filter not found
    patch:
      operationId: updateCustomFilter
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Resource ID
        examples:
          found:
            value: 1
          missing:
            value: 2147483647
      tags: ["Admin: Custom Filters"]
      security:
        - CookieAuth: [pipelines:write]
        - BearerAuth: [pipelines:write]
        - APIKeyAuth: [pipelines:write]
      summary: Update a custom filter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomFilterRequest"
            # The createCustomFilter link supplies the stored filter's ID.
            examples:
              updated:
                value:
                  description: Tags mail about invoices and receipts
                  config: {script: 'function filter(email) { return { action: "continue" }; }'}
                  enabled: true
              name_empty:
                value: {name: "", enabled: true}
              filter_type_invalid:
                value: {filter_type: invalid, enabled: true}
              direction_invalid:
                value: {direction: sideways, enabled: true}
              config_array:
                value: {config: [], enabled: true}
              config_null:
                value: {config: null, enabled: true}
              missing:
                value:
                  description: Tags mail about invoices and receipts
                  config:
                    script: 'function filter(email) { return { action: "continue" }; }'
                  enabled: true
      responses:
        "200":
          description: Custom filter updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CustomFilter"
              examples:
                updated:
                  value:
                    data:
                      id: 1
                      domain_id: 1
                      name: tag-invoices
                      description: Tags mail about invoices and receipts
                      filter_type: action
                      direction: inbound
                      config: {script: 'function filter(email) { return { action: "continue" }; }'}
                      enabled: true
                      created_at: "2026-01-01T00:00:00Z"
                      updated_at: "2026-01-01T00:00:00Z"
        "404":
          description: Custom filter not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing:
                  value:
                    error:
                      code: not_found
                      message: Custom filter not found
        "422":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                name_empty:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields: {name: required}
                filter_type_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields: {filter_type: must be action or transform}
                direction_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields: {direction: 'must be inbound, outbound or both'}
                config_array:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields: {config: must be an object}
                config_null:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields: {config: must be an object}
        "429":
          description: Authentication refusals exceeded the configured rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: Resource ID
          examples:
            found:
              value: 1
            missing:
              value: 2147483647
      operationId: deleteCustomFilter
      tags: ["Admin: Custom Filters"]
      security:
        - CookieAuth: [pipelines:delete]
        - BearerAuth: [pipelines:delete]
        - APIKeyAuth: [pipelines:delete]
      summary: Delete a custom filter
      responses:
        "200":
          description: Custom filter deleted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        example: deleted
        "404":
          description: Custom filter not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing:
                  value:
                    error:
                      code: not_found
                      message: Custom filter not found

  /api/v1/admin/custom-filters/{id}/test:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: testCustomFilter
      tags: ["Admin: Custom Filters"]
      security:
        - CookieAuth: [pipelines:write]
        - BearerAuth: [pipelines:write]
        - APIKeyAuth: [pipelines:write]
      summary: Run a stored custom filter's script against a sample email via the sidecar
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: ["null", "object"]
              properties:
                email:
                  description: >-
                    Optional sample email. When omitted a minimal built-in sample
                    is used.
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              # No email: the built-in sample is used.
              valid:
                value: {}
              # JSON but not a request object: refused before the filter is
              # looked up.
              invalid_body:
                value: []
              unknown_field:
                value: {surprise: true}
      responses:
        "200":
          description: >-
            Raw execution result proxied verbatim from the JS filter sidecar
            (status and shape determined by the sidecar).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [result, logs]
                properties:
                  result: {}
                  logs:
                    type: array
                    items:
                      type: string
              examples:
                # The contract run's filter, which lets every email through.
                valid:
                  value:
                    result:
                      action: continue
                    logs: []
          links:
            deleteCustomFilter:
              operationId: deleteCustomFilter
              parameters:
                id: '$request.path.id'
        '400':
          description: The body is not JSON (`bad_request`), or the filter's config contains no script
          content:
            application/json:
              schema: {}
              examples: {}
        "404":
          $ref: "#/components/responses/NotFound"
        "408":
          description: The sidecar's execution timeout
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error:
                    type: string
        "413":
          description: API body limit or the sidecar's bare limit error
          content:
            application/json:
              schema: {}
        '422':
          description: Request failed validation (validation_failed), with details.fields naming each failing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                unknown_field:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          surprise: not allowed
                invalid_body:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          body: the body is not a JSON object
        "429":
          description: Pipeline preview rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: API internal error or the sidecar's bare worker failure
          content:
            application/json:
              schema: {}
        "503":
          description: >-
            JS filter sidecar unavailable, or it refused the API's token
            (JS_FILTER_TOKEN differs between the API and the sidecar)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

