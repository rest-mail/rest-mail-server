        - CookieAuth: [pipelines:write]
        - BearerAuth: [pipelines:write]
        - APIKeyAuth: [pipelines:write]
      summary: Test a single filter against a sample email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestFilterRequest"
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              valid:
                value:
                  filter_name: header_validate
                  config: {}
                  email:
                    envelope:
                      mail_from: someone@example.com
                      rcpt_to: [eve@restmail.test]
                    headers:
                      from: [{name: Someone, address: someone@example.com}]
                      to: [{address: eve@restmail.test}]
                      subject: A filter test
                      message-id: <filter-test@example.com>
                      date: "Sat, 17 Oct 2026 12:00:00 +0000"
                    body:
                      content_type: text/plain
                      content: Hello.
              # No filter name: refused before any filter is made.
              filter_name_missing:
                value:
                  config: {}
                  email:
                    envelope:
                      mail_from: someone@example.com
                      rcpt_to: [eve@restmail.test]
                    headers:
                      from: [{name: Someone, address: someone@example.com}]
                      to: [{address: eve@restmail.test}]
                      subject: A filter test
                      message-id: <filter-test@example.com>
                      date: "Sat, 17 Oct 2026 12:00:00 +0000"
                    body:
                      content_type: text/plain
                      content: Hello.
              # JSON but not a request object: refused before any filter is made.
              invalid_body:
                value: []
              filter_name_wrong_type:
                value: {filter_name: 1, config: {}, email: {}}

      responses:
