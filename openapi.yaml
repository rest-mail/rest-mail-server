  # ═══════════════════════════════════════════════════════════════
  # Admin: DKIM
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/dkim:
    get:
      operationId: listDKIMKeys
      tags: ["Admin: DKIM"]
      security:
        - CookieAuth: [domains:read]
        - BearerAuth: [domains:read]
      summary: List DKIM key entries for all domains
      responses:
        "200":
          description: DKIM key list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DKIMEntry"

  /api/v1/admin/dkim/{id}/rotation:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getDKIMRotation
      tags: ["Admin: DKIM"]
      security:
        - CookieAuth: [domains:read]
        - BearerAuth: [domains:read]
      summary: Read a domain's DKIM rotation interval
      description: >
        Available even before a domain has a signing key. The capability must
        cover this domain. This records policy for the planned rotation worker;
        scheduled key rotation is not implemented yet.
      responses:
        "200":
          description: DKIM rotation settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DKIMRotationSettings"
        "400":
          description: Invalid domain ID (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: setDKIMRotation
      tags: ["Admin: DKIM"]
      security:
        - CookieAuth: [domains:write]
        - BearerAuth: [domains:write]
      summary: Set a domain's DKIM rotation interval
      description: >
        Stores the requested interval without changing signing material or key
        age. Zero disables rotation; 1 through 3650 specifies the key lifetime
        in days of 24 hours. The capability must cover this domain. This records
        policy for the planned rotation worker; scheduled key rotation is not
        implemented yet. Unknown fields and trailing JSON are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rotation_interval_days]
              properties:
                rotation_interval_days:
                  type: integer
                  minimum: 0
                  maximum: 3650
                  example: 90
            examples:
              configured:
                value: {rotation_interval_days: 90}
              body_array:
                value: []
              interval_wrong_type:
                value: {rotation_interval_days: "90"}
              field_unknown:
                value: {rotation_interval_days: 90, private_key: injected}
              interval_missing:
                value: {}
              interval_null:
                value: {rotation_interval_days: null}
              interval_negative:
                value: {rotation_interval_days: -1}
              interval_too_large:
                value: {rotation_interval_days: 3651}
      responses:
        "200":
          description: DKIM rotation settings saved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DKIMRotationSettings"
              examples:
                configured:
                  value:
                    data: {domain_id: 1, rotation_interval_days: 90}
        "400":
          description: Invalid JSON, noninteger interval, unknown field, or multiple JSON values (`bad_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                body_array:
                  value:
                    error: {code: bad_request, message: Invalid request body}
                interval_wrong_type:
                  value:
                    error: {code: bad_request, message: Invalid request body}
                field_unknown:
                  value:
                    error: {code: bad_request, message: Invalid request body}
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Missing, null, or out-of-range interval (`validation_failed`); details.fields.rotation_interval_days describes the requirement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                interval_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Invalid DKIM rotation interval
                      details:
                        fields:
                          rotation_interval_days: Must be an integer between 0 and 3650 days; 0 disables rotation
                interval_null:
                  value:
                    error:
                      code: validation_failed
                      message: Invalid DKIM rotation interval
                      details:
                        fields:
                          rotation_interval_days: Must be an integer between 0 and 3650 days; 0 disables rotation
                interval_negative:
                  value:
                    error:
                      code: validation_failed
                      message: Invalid DKIM rotation interval
                      details:
                        fields:
                          rotation_interval_days: Must be an integer between 0 and 3650 days; 0 disables rotation
                interval_too_large:
                  value:
                    error:
                      code: validation_failed
                      message: Invalid DKIM rotation interval
                      details:
                        fields:
                          rotation_interval_days: Must be an integer between 0 and 3650 days; 0 disables rotation

  /api/v1/admin/dkim/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    put:
      operationId: setDKIMKey
      tags: ["Admin: DKIM"]
      security:
        - CookieAuth: [domains:write]
        - BearerAuth: [domains:write]
      summary: Set or replace DKIM key for a domain
      description: >
        The key and selector are checked before they are stored, so a domain is
        never left with a key its outbound mail cannot be signed with (signing
        fails closed and defers the mail). The selector must be a DNS name: up
        to 63 characters, labels of letters, digits and hyphens joined by dots,
        none starting or ending with a hyphen. The key must be an RSA key of at
        least 2048 bits (PKCS#1 or PKCS#8 PEM) or an Ed25519 key (PKCS#8 PEM),
        and must sign a test message whose signature verifies against the
        key's own DNS record. Ed25519 is import-only: the server's own key
        generation makes RSA keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDKIMKeyRequest"
      responses:
        "200":
          description: DKIM key set
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DKIMEntry"
          links:
            deleteDKIMKey:
              operationId: deleteDKIMKey
              parameters:
                id: '$request.path.id'
        "400":
          description: The body is not JSON, or lacks `selector` or `private_key` (`bad_request`)
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            `validation_failed`: the domain could not sign with this key and
            selector. `details.fields.selector` when the selector is not a DNS
            name; `details.fields.private_key` when the key is not a PEM
            private key, is neither RSA nor Ed25519, is an RSA key under 2048
            bits, or does not make a signature that verifies. `message` says
            which check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
    delete:
      operationId: deleteDKIMKey
      tags: ["Admin: DKIM"]
      security:
        - CookieAuth: [domains:write]
        - BearerAuth: [domains:write]
      summary: Delete DKIM key for a domain
      responses:
        "204":
          description: DKIM key deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Certificates
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/certificates:
    get:
      operationId: listCertificates
      tags: ["Admin: Certificates"]
      security:
        - CookieAuth: [domains:read]
        - BearerAuth: [domains:read]
      summary: List TLS certificates
      responses:
        "200":
          description: Certificate list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Certificate"
    post:
      operationId: createCertificate
      tags: ["Admin: Certificates"]
      security:
        - CookieAuth: [domains:write]
        - BearerAuth: [domains:write]
      summary: Upload a new TLS certificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificateRequest"
            examples:
              valid:
                summary: The hook supplies a fresh certificate and the created domain
                value: {domain_id: 1, cert_pem: certificate, key_pem: key, auto_renew: false}
              invalid_body:
                summary: An array cannot decode as a certificate request
                value: []
              fields_missing:
                summary: Required certificate fields are missing
                value: {}
      responses:
        "201":
          description: Certificate created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Certificate"
              examples:
                valid:
                  value:
                    data:
                      id: 1
                      domain_id: 1
                      issuer: CN=contract.example.org
                      not_before: "2026-01-01T00:00:00Z"
                      not_after: "2026-01-31T00:00:00Z"
                      auto_renew: false
                      created_at: "2026-01-01T00:00:00Z"
                      updated_at: "2026-01-01T00:00:00Z"
          links:
            getCertificate:
              operationId: getCertificate
              parameters:
                id: '$response.body#/data/id'
        "400":
          description: >
            `bad_request`, before the domain is looked up: "Invalid request
            body" when the body is not JSON, is not an object (an array, a
            string, a number or a boolean), or holds a field of the wrong type;
            "domain_id, cert_pem, and key_pem are required" when the body
            (or a `null` one) leaves domain_id missing or 0, or cert_pem or
            key_pem missing or empty. A cert_pem that is not a PEM certificate
            is refused with `bad_request` too, after the domain is found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_body:
                  summary: Not JSON, not an object, or a field of the wrong type
                  value:
                    error:
                      code: bad_request
                      message: Invalid request body
                fields_missing:
                  summary: domain_id, cert_pem or key_pem missing or empty
                  value:
                    error:
                      code: bad_request
                      message: domain_id, cert_pem, and key_pem are required

  /api/v1/admin/certificates/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getCertificate
      tags: ["Admin: Certificates"]
      security:
        - CookieAuth: [domains:read]
        - BearerAuth: [domains:read]
      summary: Get certificate details (includes cert_pem)
      responses:
        "200":
          description: Certificate details with PEM data
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CertificateDetail"
          links:
            deleteCertificate:
              operationId: deleteCertificate
              parameters:
                id: '$request.path.id'
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCertificate
      tags: ["Admin: Certificates"]
      security:
        - CookieAuth: [domains:write]
        - BearerAuth: [domains:write]
      summary: Delete a certificate
      responses:
        "204":
          description: Certificate deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Bans
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/bans:
    get:
      operationId: listBans
      tags: ["Admin: Bans"]
      security:
        - CookieAuth: [bans:read]
        - BearerAuth: [bans:read]
      summary: List IP bans
      parameters:
        - name: protocol
          in: query
          schema:
            type: string
            enum: [smtp, imap, pop3, all]
        - name: ip
          in: query
          schema:
            type: string
        - name: active
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "422":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Ban list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Ban"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
    post:
      operationId: createBan
      tags: ["Admin: Bans"]
      security:
        - CookieAuth: [bans:write]
        - BearerAuth: [bans:write]
      summary: Create an IP ban
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBanRequest"
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              created:
                value:
                  ip: 192.0.2.10
                  reason: Repeated failed sign-ins
                  protocol: all
                  duration: 1h
                  created_by: admin@restmail.test
              # No IP: refused before anything is looked up or stored.
              ip_missing:
                value:
                  reason: Repeated failed sign-ins
                  protocol: all
                  duration: 1h
                  created_by: admin@restmail.test
              # A duration Go cannot parse: refused before anything is looked
              # up or stored.
              duration_invalid:
                value:
                  ip: 192.0.2.10
                  reason: Repeated failed sign-ins
                  protocol: all
                  duration: not-a-duration
                  created_by: admin@restmail.test
      responses:
        "201":
          description: Ban created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Ban"
              examples:
                created:
                  value:
                    data:
                      id: 1
                      ip: 192.0.2.10
                      reason: Repeated failed sign-ins
                      protocol: all
                      created_by: admin@restmail.test
                      expires_at: "2026-01-01T01:00:00Z"
                      created_at: "2026-01-01T00:00:00Z"
          links:
            deleteBan:
              operationId: deleteBan
              parameters:
                id: '$response.body#/data/id'
        "422":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                ip_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          ip: IP address is required
                duration_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          duration: invalid duration format (e.g. 24h, 168h)

  /api/v1/admin/bans/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    delete:
      operationId: deleteBan
      tags: ["Admin: Bans"]
      security:
        - CookieAuth: [bans:delete]
        - BearerAuth: [bans:delete]
      summary: Delete a ban by ID
      responses:
        "204":
