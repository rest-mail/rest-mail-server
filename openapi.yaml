        "200":
          description: HTML Swagger UI page
          content:
            text/html:
              schema:
                type: string

  /api/docs/openapi.yaml:
    get:
      operationId: openapiSpec
      tags: [System]
      summary: This OpenAPI specification document
      security: []
      responses:
        "200":
          description: The raw OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string

  /api/docs/openapi.json:
    get:
      operationId: openapiDocument
      tags: [System]
      summary: This API's description, generated from its routes
      description: >
        The OpenAPI 3.1 description go-oapifly generates from the routes this
        server registers, the description itself among them. It replaces
        openapi.yaml once the two agree (#670).
      security: []
      responses:
        "200":
          description: The generated OpenAPI 3.1 document
          content:
            application/json:
              schema:
                type: object
                required: [openapi, info, paths]
                properties:
                  openapi:
                    type: string
                  info:
                    type: object
                    additionalProperties: {}
                  paths:
                    type: object
                    additionalProperties: {}

  /metrics:
    get:
      operationId: prometheusMetrics
      tags: [System]
      summary: Prometheus metrics exposition
      description: >-
        No credentials are required, but METRICS_ALLOWED_CIDRS restricts the source network.
        Unset or empty, it allows loopback, RFC1918 and IPv6 unique-local networks.
        The TCP peer is used unless it is in PROXY_PROTOCOL_TRUSTED_CIDRS; only then is X-Forwarded-For honored.
        An allowed caller receives 200 on a successful scrape, or a sanitized JSON 500 if collection fails.
        A disallowed or undeterminable source receives plain-text 404 before any metrics are collected.
        The API route is always registered: there is no API metrics-off setting.
        Setting SMTP_METRICS_PORT, IMAP_METRICS_PORT or POP3_METRICS_PORT to 0 disables only that gateway's metrics listener, not this route.
      security: []
      responses:
        "200":
          description: Metrics in Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Source is outside the metrics allowlist or cannot be determined
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Metrics collection failed without disclosing dependency details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

