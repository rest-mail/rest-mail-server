  # ═══════════════════════════════════════════════════════════════
  # Admin: Roles & Grants
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/roles:
    get:
      operationId: listRoles
      tags: ["Admin: Roles & Grants"]
      security:
        - CookieAuth: [users:read]
        - BearerAuth: [users:read]
        - APIKeyAuth: [users:read]
      summary: List roles
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"

  /api/v1/admin/capabilities:
    get:
      operationId: listCapabilities
      tags: ["Admin: Roles & Grants"]
      security:
        - CookieAuth: [users:read]
        - BearerAuth: [users:read]
        - APIKeyAuth: [users:read]
      summary: List capabilities
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Capability"

  /api/v1/admin/grants:
    get:
      operationId: listGrants
      tags: ["Admin: Roles & Grants"]
      security:
        - CookieAuth: [users:read]
        - BearerAuth: [users:read]
        - APIKeyAuth: [users:read]
      summary: List grants, oldest first
      description: >-
        Every grant, active and eligible, or only one holder's, or only those
        at one scope (`scope=mailbox:chris@example.com`: who owns chris@). A
        holder is an account (`holder_kind` `account`, `holder_id` its id).
      parameters:
        - name: holder_kind
          in: query
          schema:
            type: string
            example: account
        - name: holder_id
          in: query
          schema:
            type: integer
            minimum: 0
        - name: scope
          in: query
          description: Only the grants at this scope, e.g. `mailbox:chris@example.com`
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "422":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Grants
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Grant"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createGrant
      tags: ["Admin: Roles & Grants"]
      security:
        - CookieAuth: [users:write]
        - BearerAuth: [users:write]
      summary: Grant a role at a scope
      description: >-
        Needs a session that signed in with two-factor authentication (`403
        two_factor_required` otherwise), and the caller must hold every
        capability of the role at a scope covering the grant's (`403
        grant_exceeds_held` otherwise); superadmin at `*` may grant anything.
        An eligible grant does nothing until it is switched on. The change and
        its audit entry (`grants.create`) commit together.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGrantRequest"
      responses:
        "201":
          description: Granted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Grant"
          links:
            deleteGrant:
              operationId: deleteGrant
              parameters:
                id: '$response.body#/data/id'
        "401":
          $ref: "#/components/responses/Unauthorized"
        '403':
          description: Requires a human 2FA sign-in (two_factor_required); sensitive changes require recent proof (recent_two_factor_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                two_factor_required:
                  value:
                    error:
                      code: two_factor_required
                      message: 'This action needs a session signed in with two-factor authentication: sign in again
                        with your code'
                recent_two_factor_required:
                  value:
                    error:
                      code: recent_two_factor_required
                      message: 'Sign in again with two-factor authentication: a recent second factor is required'
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/grants/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    delete:
      operationId: deleteGrant
      tags: ["Admin: Roles & Grants"]
      security:
        - CookieAuth: [users:write]
        - BearerAuth: [users:write]
      summary: Remove a grant
      description: >-
        The same rules as granting: a 2FA session, and the caller must hold
        everything the grant gives, where it gives it. The last grant of `*`
        at `*` held by an active admin who can use it (active, or eligible with
        an authenticator to switch it on) cannot be removed (`409
        last_superadmin`). An activation of the grant still running ends
        with it (`grants.deactivate`). The change and its audit entries
        (`grants.delete`) commit together.
      responses:
        "204":
          description: Removed
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        '403':
          description: Requires a human 2FA sign-in (two_factor_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                two_factor_required:
                  value:
                    error:
                      code: two_factor_required
                      message: 'This action needs a session signed in with two-factor authentication: sign in again
                        with your code'
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The last superadmin grant (last_superadmin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/server-limits:
    get:
      operationId: getServerLimits
      tags: ["Admin: Roles & Grants"]
      security:
        - CookieAuth: [users:read]
        - BearerAuth: [users:read]
      summary: The server's limits
      description: >-
        What an administrator can set for the whole server. Today that is
        `contact_import_max_bytes`, the largest contact import file, 10 MiB
        until it is changed. Superadmin only (`403 superadmin_required`).
      responses:
        "200":
          description: The limits in force
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ServerLimits"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a superadmin (superadmin_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Refused API keys are throttled at login's rate (rate_limited)
    put:
      operationId: updateServerLimits
      tags: ["Admin: Roles & Grants"]
      security:
        - CookieAuth: [users:write]
        - BearerAuth: [users:write]
      summary: Change the server's limits
      description: >-
        Sets `contact_import_max_bytes`, which can be any size of at least one
        byte, above the API's general body limit too. The upload goes to disk
        as it arrives, so its size never sits in memory. Superadmin only, in a
        session signed in with two-factor authentication (`403
        superadmin_required` or `two_factor_required` otherwise). The change
        and its audit entry (`server_limits.update`, with the value before and
        after) commit together.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerLimits"
      responses:
        "200":
          description: The new limits
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ServerLimits"
        "400":
          description: The body is not valid JSON (bad_request)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a superadmin (superadmin_required), or a session without a second factor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Refused API keys are throttled at login's rate (rate_limited)

  /api/v1/admin/server-capabilities:
    get:
      operationId: getServerCapabilities
      tags: ["Admin: Roles & Grants"]
      security:
        - CookieAuth: [users:read]
        - BearerAuth: [users:read]
      summary: The server capability ceiling
      description: >-
        The capabilities the installation permits. Every account other than
        superadmin holds only what both its own grants and this set allow.
        `source` is `environment` while `RESTMAIL_SERVER_CAPABILITIES` sets
        the ceiling, otherwise `database`. Superadmin only (`403
        superadmin_required` otherwise).
      responses:
        "200":
          description: The ceiling in force
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ServerCapabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a superadmin (superadmin_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateServerCapabilities
      tags: ["Admin: Roles & Grants"]
      security:
        - CookieAuth: [users:write]
        - BearerAuth: [users:write]
      summary: Replace the server capability ceiling
      description: >-
        Replaces the stored ceiling with the listed capabilities; `[]` permits
        none. Names must be in the capability vocabulary; unknown names, empty
        names and the wildcard are refused (`422`). Superadmin only, in a
        session signed in with two-factor authentication (`403
        superadmin_required` or `two_factor_required` otherwise). Refused
        while `RESTMAIL_SERVER_CAPABILITIES` sets the ceiling (`409
        server_capabilities_from_environment`). The change and its audit
        entry (`server_capabilities.update`, with the set before and after)
        commit together.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServerCapabilitiesRequest"
      responses:
        "200":
          description: The new ceiling
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ServerCapabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a superadmin (superadmin_required), or a session without 2FA (two_factor_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The environment sets the ceiling (server_capabilities_from_environment)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/grants/mine:
    get:
      operationId: listMyGrants
      tags: ["Admin: Roles & Grants"]
      summary: The caller's own grants
      description: >-
        Every grant the signed-in admin holds, active and eligible, each with
        any activation running now and its time left: what a client needs to
        offer an "Escalate" button. Any admin may read its own; no capability
        is needed. Activations that ran out are recorded as expired
        (`grants.expire`) when this is read.
      responses:
        "200":
          description: The caller's grants, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Grant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not an admin, or an account still in setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/grants/{id}/activate:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: activateGrant
      tags: ["Admin: Roles & Grants"]
      summary: Switch one of your eligible grants on for a while
      description: >-
        Escalation (#346). The grant must be the caller's own (`404`
        otherwise) and eligible (`409 not_eligible` for an active one). It
        needs a fresh second factor in the body, a current `totp_code` or an
        unused `recovery_code`: a session that signed in with 2FA is not
        enough. No authenticator enrolled is `403 two_factor_required`; no
        code `403 totp_required`; a wrong one `403 invalid_totp` (403, not
        401: the session is still good). While switched on, the grant gives
        what an active one would, until `expires_at` (never past the grant's
        own expiry) or until switched off; a grant is switched on at most once
        at a time (`409 already_active`). The activation and its audit entry
        (`grants.activate`: who, which grant, the reason, start and end)
        commit together; a refused activation leaves a recovery code it was
        given unused. Throttled like sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateGrantRequest"
      responses:
        "201":
          description: Switched on
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/GrantEscalation"
        '400':
          description: The body is not valid JSON or not the declared media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Not an admin; no authenticator (two_factor_required); no code
            (totp_required); or a wrong one (invalid_totp)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Active, not eligible (not_eligible); already switched on (already_active); or the grant itself expired (grant_expired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Too many tries from this address; the same limit as sign-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/grants/{id}/deactivate:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: deactivateGrant
      tags: ["Admin: Roles & Grants"]
      summary: Switch one of your grants off before it runs out
      description: >-
        Ends the caller's own activation of the grant now (`404` for anyone
        else's grant, `409 not_active` when it is not switched on). Needs no
        second factor: it only takes access away. The end and its audit entry
        (`grants.deactivate`) commit together.
      responses:
        "200":
          description: Switched off
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/GrantEscalation"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        '403':
          description: Requires a human 2FA sign-in (two_factor_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                two_factor_required:
                  value:
                    error:
                      code: two_factor_required
                      message: 'This action needs a session signed in with two-factor authentication: sign in again
                        with your code'
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not switched on (not_active)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/grants/{id}/make-eligible:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: makeGrantEligible
      tags: ["Admin: Roles & Grants"]
      summary: Hold one of your active grants only when you switch it on
      description: >-
        Turns the caller's own active grant eligible: from then on it gives
        nothing until switched on. This is how the owner of a server set up
        before escalation, who holds `superadmin` always, chooses to hold it
        only when needed. Like activating, it needs a fresh `totp_code` or
        `recovery_code` (the same 403 codes), so nobody makes a grant eligible
        without being able to switch it on again. There is no way back to
        active for your own grant: that would be escalating for good. The
        change and its audit entry (`grants.make_eligible`) commit together.
        Throttled like sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreshSecondFactor"
      responses:
        "200":
          description: Now eligible
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/GrantEscalation"
        '400':
          description: The body is not valid JSON or not the declared media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not an admin, or the second factor is missing or wrong (see activateGrant)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Eligible already (already_eligible)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many tries from this address; the same limit as sign-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Domains — DNS check
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/domains/{id}/outbound-stop:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    put:
      operationId: stopDomainOutbound
      description: "Stops the domain's outbound mail, with the reason the operator gives. Mail its mailboxes send is still accepted and queued, but held, as is the mail it already has queued: none of it is delivered, bounced or lost until the stop is lifted. Mail to the domain is delivered as before. Stopping a stopped domain replaces the reason. The stop, who made it, when and why, is written to the audit log, and the domain answers with it in outbound_stop."
      tags: ["Admin: Domains"]
      security:
        - CookieAuth: [queue:manage]
        - BearerAuth: [queue:manage]
        - APIKeyAuth: [queue:manage]
      summary: Stop a domain's outbound mail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  pattern: '\S'
      responses:
        "200":
          description: The domain, with its outbound stop
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Domain"
          links:
            restartDomainOutbound:
              operationId: restartDomainOutbound
              parameters:
                id: '$request.path.id'
        "400":
          description: The body is not JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Authentication refusals exceeded the configured rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: restartDomainOutbound
      description: "Lifts the domain's outbound stop: the mail held while it was stopped is released for normal delivery, its queue lifetime extended by the time it was held. The restart, who made it and when, is written to the audit log. Restarting a domain that is not stopped changes nothing and writes nothing."
      tags: ["Admin: Domains"]
      security:
        - CookieAuth: [queue:manage]
        - BearerAuth: [queue:manage]
        - APIKeyAuth: [queue:manage]
      summary: Restart a domain's outbound mail
      responses:
        "200":
          description: The domain, without an outbound stop
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Domain"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Authentication refusals exceeded the configured rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/domains/{id}/dns:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: domainDNSCheck
      tags: ["Admin: Domains"]
      security:
        - CookieAuth: [domains:read]
        - BearerAuth: [domains:read]
        - APIKeyAuth: [domains:read]
      summary: The DNS records a domain must publish, compared with a live lookup of each
      # Links fill the successful lookup; this named ID stays absent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          examples:
            found:
              value: 1
            missing:
              value: 2147483647
      responses:
        "200":
          description: DNS check result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DNSCheckResult"
        "404":
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing:
                  value:
                    error:
                      code: domain_not_found
                      message: Domain not found
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Session lacks domains:read for this domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request exceeds the configured body cap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Path parameters failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "500":
          description: Domain lookup failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Session, grants or domain scope cannot be verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Suppressions
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/domains/{id}/suppressions:
    parameters:
      - $ref: "#/components/parameters/DomainId"
    get:
      operationId: listSuppressions
      tags: ["Admin: Suppressions"]
      security:
        - CookieAuth: [domains:read]
        - BearerAuth: [domains:read]
        - APIKeyAuth: [domains:read]
      summary: List a domain's suppressed recipients
      description: |
        Recipients the domain's mail is no longer sent to, because mail from
        the domain to them bounced as undeliverable: the mailbox, or its
        domain, does not exist. A message to one is bounced at once, with a
        DSN to its sender, until the suppression expires (SUPPRESSION_TTL,
        90 days by default). Expired suppressions are not listed.
      # Links fill the successful lookup; this named ID stays absent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          examples:
            available:
              value: 1
            missing:
              value: 2147483647
      responses:
        "200":
          description: Suppressions, most recently updated first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Suppression"
        "404":
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing:
                  value:
                    error:
                      code: not_found
                      message: Domain not found

  /api/v1/admin/domains/{id}/suppressions/{sid}:
    parameters:
      - $ref: "#/components/parameters/DomainId"
      - name: sid
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Suppression ID
        example: 1
    delete:
      operationId: clearSuppression
      tags: ["Admin: Suppressions"]
      security:
        - CookieAuth: [domains:write]
        - BearerAuth: [domains:write]
        - APIKeyAuth: [domains:write]
      summary: Clear a suppression
      description: The domain's mail to the address is tried again.
      responses:
        "204":
          description: Suppression cleared
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════════
  # Admin: MTA-STS
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/domains/{id}/mta-sts:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getMtaStsPolicy
      tags: ["Admin: MTA-STS"]
      security:
        - CookieAuth: [domains:read]
        - BearerAuth: [domains:read]
        - APIKeyAuth: [domains:read]
      summary: Get the MTA-STS policy for a domain
      # Links fill the successful lookup; named refusals keep their own IDs.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          examples:
            found:
              value: 1
            missing:
              value: 2147483647
            policy_absent:
              summary: An existing domain without an MTA-STS policy
              value: 2147483646
      responses:
        "200":
          description: MTA-STS policy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MTASTSPolicy"
          links:
            deleteMtaStsPolicy:
              operationId: deleteMtaStsPolicy
              parameters:
                id: '$request.path.id'
        "404":
          description: Domain or MTA-STS policy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing:
                  value:
                    error:
                      code: not_found
                      message: Domain not found
                policy_absent:
                  value:
                    error:
                      code: not_found
                      message: No MTA-STS policy found for this domain
    put:
      operationId: setMtaStsPolicy
      tags: ["Admin: MTA-STS"]
      security:
        - CookieAuth: [domains:write]
        - BearerAuth: [domains:write]
        - APIKeyAuth: [domains:write]
      summary: Create or update the MTA-STS policy for a domain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMTASTSPolicyRequest"
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              policy:
                value:
                  mode: testing
                  mx_hosts: mail.example.org
                  max_age: 86400
                  active: true
              # The policy request with a mode MTA-STS does not have: refused
              # before the domain is looked up.
              mode_invalid:
                value:
                  mode: strict
                  mx_hosts: mail.example.org
                  max_age: 86400
                  active: true
              # The policy request with a negative lifetime.
              max_age_negative:
                value:
                  mode: testing
                  mx_hosts: mail.example.org
                  max_age: -1
                  active: true
      responses:
        "201":
          description: Policy created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MTASTSPolicy"
              examples:
                policy:
                  value:
                    data:
                      id: 1
                      domain_id: 1
                      mode: testing
                      mx_hosts: mail.example.org
                      max_age: 86400
                      active: true
                      created_at: "2026-01-01T00:00:00Z"
                      updated_at: "2026-01-01T00:00:00Z"
          links:
            getMtaStsPolicy:
              operationId: getMtaStsPolicy
              parameters:
                id: '$request.path.id'
            # Order only: the policy file is served once a policy exists. The
            # domain arrives in the Host header (tests/contract/hooks.py).
            mtaStsPolicyFile:
              operationId: mtaStsPolicyFile
            deleteMtaStsPolicy:
              operationId: deleteMtaStsPolicy
              parameters:
                id: '$request.path.id'
        "200":
          description: Policy updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MTASTSPolicy"
              examples:
                policy:
                  value:
                    data:
                      id: 1
                      domain_id: 1
                      mode: testing
                      mx_hosts: mail.example.org
                      max_age: 86400
                      active: true
                      created_at: "2026-01-01T00:00:00Z"
                      updated_at: "2026-01-01T00:00:00Z"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                mode_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          mode: "Must be one of: none, testing, enforce"
                max_age_negative:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          max_age: Must be a non-negative integer (seconds)
    delete:
      operationId: deleteMtaStsPolicy
      tags: ["Admin: MTA-STS"]
      security:
        - CookieAuth: [domains:write]
        - BearerAuth: [domains:write]
        - APIKeyAuth: [domains:write]
      summary: Delete the MTA-STS policy for a domain
      responses:
        "204":
          description: Policy deleted
          links:
            deleteDomain:
              operationId: deleteDomain
              parameters:
                id: '$request.path.id'
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/domains/{id}/relay:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getDomainRelay
      tags: ["Admin: Domains"]
      security:
        - CookieAuth: [domains:read]
        - BearerAuth: [domains:read]
        - APIKeyAuth: [domains:read]
      summary: Get the domain's outbound transport
      description: |
        How mail sent from this domain leaves the server: `direct` resolves
        each recipient's MX, `relay` hands every message to the configured
        SMTP relay. A domain with nothing configured is `direct`. The relay
        password is never returned, only whether one is set.
      # Links fill the successful lookup; this named ID stays absent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          examples:
            found:
              value: 1
            missing:
              value: 2147483647
      responses:
        "200":
          description: Outbound transport
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DomainRelay"
              examples:
                found:
                  value:
                    data:
                      domain_id: 1
                      transport: relay
                      host: smtp.example.net
                      port: 587
                      tls_mode: starttls
                      username: apikey
                      password_set: true
        "404":
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing:
                  value:
                    error:
                      code: not_found
                      message: Domain not found
    put:
      operationId: setDomainRelay
      tags: ["Admin: Domains"]
      security:
        - CookieAuth: [domains:write]
        - BearerAuth: [domains:write]
        - APIKeyAuth: [domains:write]
      summary: Set the domain's outbound transport
      description: |
        Replaces the domain's outbound transport. Takes `domains:write` held
        at `*`: the relay is dialled from inside the installation, so only the
        operator chooses it. TLS is mandatory (`starttls` or `implicit`), and
        credentials are only ever sent after a verified handshake. Leaving
        `password` out keeps the stored one; an empty string clears it. The
        password is encrypted at rest and refused (409) when the server has no
        MASTER_KEY. `direct` drops any relay settings, credentials included.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDomainRelayRequest"
            examples:
              relay:
                summary: Send through an authenticated relay
                value:
                  transport: relay
                  host: smtp.example.net
                  port: 587
                  tls_mode: starttls
                  username: apikey
                  password: relay-password
              direct:
                summary: Deliver straight to each recipient's MX
                value:
                  transport: direct
              body_array:
                value: []
              port_wrong_type:
                value:
                  transport: relay
                  host: smtp.example.net
                  port: '587'
                  tls_mode: starttls
                  username: apikey
                  password: relay-password
              transport_missing:
                value: {}
              transport_invalid:
                value:
                  transport: smtp
              host_invalid:
                value:
                  transport: relay
                  host: smtp://smtp.example.net
                  port: 587
                  tls_mode: starttls
                  username: apikey
                  password: relay-password
              port_invalid:
                value:
                  transport: relay
                  host: smtp.example.net
                  port: 65536
                  tls_mode: starttls
                  username: apikey
                  password: relay-password
              tls_mode_invalid:
                value:
                  transport: relay
                  host: smtp.example.net
                  port: 587
                  tls_mode: none
                  username: apikey
                  password: relay-password
              credentials_mismatch:
                value:
                  transport: relay
                  host: smtp.example.net
                  port: 587
                  tls_mode: starttls
                  username: apikey
                  password: ''
      responses:
        "200":
          description: Outbound transport saved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DomainRelay"
              examples:
                relay:
                  value:
                    data:
                      domain_id: 1
                      transport: relay
                      host: smtp.example.net
                      port: 587
                      tls_mode: starttls
                      username: apikey
                      password_set: true
                direct:
                  value:
                    data:
                      domain_id: 1
                      transport: direct
                      password_set: false
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        '400':
          description: The body is not valid JSON or not the declared media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: {}
        '422':
          description: Request failed validation (validation_failed), with details.fields naming each failing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                port_wrong_type:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          port: must be an integer
                transport_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          transport: 'Must be one of: direct, relay'
                transport_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          transport: 'Must be one of: direct, relay'
                host_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          host: Must be a bare host name or IP address, with no scheme, port or path
                port_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          port: Must be between 1 and 65535
                tls_mode_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          tls_mode: 'Must be one of: starttls, implicit'
                credentials_mismatch:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          password: A username and a password are set together, or neither
                body_array:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          body: the body is not a JSON object
