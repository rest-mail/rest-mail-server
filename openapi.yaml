    get:
      operationId: searchMessages
      tags: [Search]
      security:
        - CookieAuth: [mail:read]
        - BearerAuth: [mail:read]
        - BasicAuth: [mail:read]
      summary: Search messages with filters
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Free text search query
        - name: folder
          in: query
          schema:
            type: string
          description: Restrict to a specific folder
        - name: from
          in: query
          schema:
            type: string
          description: Filter by sender address
        - name: after
          in: query
          schema:
            type: string
            format: date-time
          description: Messages after this date
        - name: before
          in: query
          schema:
            type: string
            format: date-time
          description: Messages before this date
        - name: has_attachment
          in: query
          schema:
            type: boolean
          description: Only messages with attachments
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "422":
          $ref: "#/components/responses/ValidationError"
