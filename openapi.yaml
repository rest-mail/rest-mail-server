        - CookieAuth: [pipelines:read]
        - BearerAuth: [pipelines:read]
        - APIKeyAuth: [pipelines:read]
      summary: List pipelines, optionally filtered by domain
      parameters:
        - name: domain_id
          in: query
          schema:
            type: integer
      responses:
        "422":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Pipeline list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Pipeline"
    post:
      operationId: createPipeline
      tags: ["Admin: Pipelines"]
      security:
        - CookieAuth: [pipelines:write]
        - BearerAuth: [pipelines:write]
        - APIKeyAuth: [pipelines:write]
      summary: Create a new pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePipelineRequest"
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              created:
                value:
                  domain_id: 1
                  direction: inbound
                  filters:
                    - name: header_validate
                      config: {}
              # No direction: refused before anything is stored.
              direction_missing:
                value:
                  domain_id: 1
                  filters:
                    - name: header_validate
                      config: {}
              # No filters: refused before anything is stored.
              filters_missing:
                value:
                  domain_id: 1
                  direction: inbound
              # An array, not an object: refused while the body is decoded,
              # before any field is read (#388).
              body_array:
                value: []
              active_wrong_type:
                value: {domain_id: 1, direction: inbound, filters: [], active: "yes"}

              null_body:
                value: null

      responses:
        "201":
          description: Pipeline created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Pipeline"
              examples:
                created:
                  value:
                    data:
                      id: 1
                      domain_id: 1
                      direction: inbound
                      filters:
                        - name: header_validate
                          config: {}
                      active: true
                      created_at: "2026-01-01T00:00:00Z"
                      updated_at: "2026-01-01T00:00:00Z"
                      domain:
                        id: 0
                        name: ""
                        server_type: ""
                        active: false
                        default_quota_bytes: 0
                        dkim_selector: ""
                        sending_policy: ""
                        dmarc_policy: ""
                        created_at: "0001-01-01T00:00:00Z"
                        updated_at: "0001-01-01T00:00:00Z"
          links:
            updatePipeline:
              operationId: updatePipeline
              parameters:
                id: '$response.body#/data/id'
            deletePipeline:
              operationId: deletePipeline
              parameters:
                id: '$response.body#/data/id'
        '400':
          description: The body is not valid JSON or not the declared media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: {}
        '422':
          description: Request failed validation (validation_failed), with details.fields naming each failing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                direction_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          direction: must be 'inbound' or 'outbound'
                filters_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          filters: must be an array of filter objects
                active_wrong_type:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          active: must be a boolean
                body_array:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          body: the body is not a JSON object
                null_body:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          body: the body is null
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

