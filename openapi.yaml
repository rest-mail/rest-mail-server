openapi: 3.1.0
info:
  title: RestMail API
  version: 1.0.0
  description: >
    RestMail is a modern email platform with REST API access, supporting traditional
    SMTP/IMAP/POP3 gateways and the RESTMAIL server-to-server protocol. This spec
    covers all user-facing, admin, internal gateway, and RESTMAIL endpoints.


    ## Authentication & authorization


    The API uses seven distinct auth modes; each operation's `security` block
    states which apply, and the capability it needs as the requirement's roles
    (OpenAPI 3.1), for example `security: [{BearerAuth: [domains:read]}]`.


    * **Session cookie** (`CookieAuth`) — the default for browser clients. Login
      sets the access token as the httpOnly `restmail_access` cookie (JavaScript
      cannot read it) plus a readable `restmail_csrf` cookie. The browser sends
      the cookie automatically; state-changing requests must also echo the CSRF
      value in the `X-CSRF-Token` header (double-submit), or they get `403`.

    * **JWT bearer** (`BearerAuth`) — the transport for programmatic (non-browser)
      clients. Send the access token as `Authorization: Bearer`; obtain it from
      the `restmail_access` cookie in the login response's `Set-Cookie` header, or
      sign in with `"client": "native"` to get it in the body. Bearer requests send
      no cookie and are exempt from the CSRF check.

      Every session of an account ends at once, wherever its tokens are
      presented (any operation, the event stream, refresh), when its
      password changes (its own change, or an admin setting one), it is
      reset, it turns 2FA off, an admin ends its sessions (`DELETE
      /api/v1/admin/mailboxes/{id}/sessions`) or disables it. Each token
      carries the account's credential epoch (`cep`), which each of these
      moves on, and a token from an older epoch answers `401`: sign in again.
      App passwords are credentials, not sessions: only a new password or a
      reset revokes them.

    Human sessions that prove a second factor carry `auth_time`, the original
    sign-in time, preserved across refresh. Refresh changes `iat` but never
    reopens the sudo window. Machine credentials never carry this proof.
    Sensitive actions require a human 2FA session; administrative/read/sending
    grants, credential creation, password/2FA changes and audit access also
    require proof within 15 minutes. `FRESH_TWO_FACTOR_WINDOW` may shorten it;
    invalid, non-positive or longer values refuse startup. Missing or stale
    proof returns `403 recent_two_factor_required`: prompt another sign-in.
    Initial enrollment and forced password setup before any factor exists
    remain available. Once enrolled, prove the factor at sign-in before
    changing the password. Escalation still verifies a new code per action.

    * **HTTP Basic** (`BasicAuth`) — an account's address as the user name, and
      as the password one of its app passwords (`rm_<public id>_<secret>`) or
      one of its own passwords. It is how the IMAP, POP3 and SMTP gateways sign
      mail clients in and act for them: one path for both kinds. Accepted only
      by the operations whose `security` lists it, the mail routes (folders,
      messages, drafts, attachments, contacts, vacation, Sieve, search,
      quarantine, calendar). An app password reaches its own account's mailbox
      alone; the account's password reaches what the account's grants reach.
      The account's password is refused with Basic when the account has
      two-factor authentication (`401 app_password_required`: a mail client
      cannot send a code) or is still in setup (`401 setup_required`). Every
      credential is checked on every request, so one that is revoked or
      expires, or a password that changes, stops working at the next. Never
      accepted by `POST /api/v1/auth/login`, nor by password, 2FA, account,
      credential or admin operations: those need a session. A refused
      credential gets `401`; repeated refusals from one client get `429`.

    * **RBAC capability** — there is one kind of account, a mailbox, and one
      kind of session. What an account may do beyond its own mailbox is its
      **grants**: each a role at a scope (`*`, `domain:<name>` or
      `mailbox:<address>`), read on every request — the token carries none, so
      a change takes effect at once. An account holds the owner role's
      capabilities (`mail:read`, `mail:write`, `mail:send`, `mailbox:manage`)
      on its own mailbox without a grant, and on every account it created or
      linked through an `owner` grant. Every operation that needs a
      capability names it as the roles of its `security` requirements (e.g.
      `domains:read`, `queue:manage`, `mail:read`); the superadmin wildcard
      `*` satisfies every one. A caller missing it gets `403`.

      An operation on the domain or mailbox named by its `{id}`
      (`/api/v1/admin/domains/{id}` and everything under it,
      `/api/v1/admin/dkim/{id}`, `/api/v1/admin/mailboxes/{id}`) accepts the
      capability held at a scope covering that domain or mailbox; every other
      operation needs it at `*`. A session still in setup (a deploy-time
      password, an authenticator owed) gets `403 setup_required` everywhere but
      `/api/v1/auth/password` and `/api/v1/auth/2fa/*`. See
      `/api/v1/admin/grants`.

      A grant is **active** (always in force) or **eligible**: it gives nothing
      until its holder switches it on for a while, with a fresh code from their
      authenticator and a reason (`POST /api/v1/admin/grants/{id}/activate`). A
      new server's first admin holds `admin` active and `superadmin` eligible.

    * **Internal mTLS** — the machine-to-machine gateway routes (`GET /api/mailboxes`,
      `POST /api/v1/messages/deliver`), marked `x-internal-mtls`. When internal mTLS
      is enabled (server `InternalMTLSEnabled`) these are withheld from the public
      listener and served ONLY on a dedicated internal listener that requires a
      verified gateway client certificate. When it is disabled they are served
      unauthenticated on the public listener (network-trust deployments). Either
      way they never accept a user JWT.

    * **DKIM/SPF-verified** — the RESTMAIL server-to-server routes under `/restmail`.
      Unauthenticated at the HTTP layer; authenticity is established out-of-band from
      the DKIM signature and SPF result of the submitted message.

    * **Unauthenticated by design** — health, Prometheus metrics, API discovery,
      Swagger UI, client autoconfiguration, the MTA-STS policy file, TLS-RPT report
      ingestion, and ACME HTTP-01 challenges. The SSE stream is a special case: it
      is outside the JWT middleware and instead authenticates the access token
      supplied as the `token` query parameter.


    ## Audit log


    Sign-ins (successful or not), sign-outs, failed refreshes, resets, owner
    requests, password and 2FA changes, linking and unlinking accounts, creating
    and revoking app passwords, every refused app password, sign-ins with one
    over IMAP, POP3 or SMTP, and every
    request other than GET to the admin API are each recorded as one entry in an
    append-only, hash-chained audit log: who acted (and with which session), the
    route and its parameters, and how it ended. Passwords and tokens are never
    recorded. Admins holding `audit:read` read it at `GET /api/v1/admin/audit` and
    check the chain at `GET /api/v1/admin/audit/verify`; both reads are themselves
    recorded. Each grant change is also recorded as its own entry
    (`grants.create`, `grants.delete`, `grants.make_eligible`), and so is each
    step of an escalation (`grants.activate`, `grants.deactivate`,
    `grants.expire`), written in the same transaction as the change.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: /
    description: Default server

tags:
  - name: Health
    description: Health check (no auth)
  - name: Auth
    description: Authentication (no auth)
  - name: Accounts
    description: The accounts a session reaches, its own and those it holds mail grants on; creating and linking them (JWT)
  - name: Credentials
    description: An account's app passwords (JWT from a password sign-in; never an app password)
  - name: Push devices
    description: >
      Phones a session registers for push notifications (JWT from a password
      sign-in). Only when the server has APNs credentials; otherwise every
      route here answers 404.
  - name: Folders
    description: Mailbox folders (JWT)
  - name: Messages
    description: Email messages (JWT)
  - name: Drafts
    description: Draft messages (JWT)
  - name: Threads
    description: Message threads (JWT)
  - name: Quota
    description: Mailbox quota (JWT)
  - name: Search
    description: Message search (JWT)
  - name: Attachments
    description: Message attachments (JWT)
  - name: Contacts
    description: Contact management (JWT)
  - name: Vacation
    description: Vacation auto-reply (JWT)
  - name: Sieve
    description: Sieve filter scripts (JWT)
  - name: Quarantine
    description: Quarantined messages (JWT)
  - name: Calendar
    description: Calendar events and invitation replies (JWT)
  - name: SSE
    description: Server-Sent Events (access token via query param)
  - name: System
    description: Discovery, docs, metrics, autoconfig and well-known endpoints (no auth)
  - name: Inbound
    description: >-
      Internal gateway delivery (machine-to-machine). Internal mTLS when enabled,
      otherwise tokenless on the public listener.
  - name: RESTMAIL
    description: RESTMAIL server-to-server protocol (HTTP-unauthenticated; DKIM/SPF verified)
  - name: "Admin: Domains"
    description: Domain management (JWT + admin)
  - name: "Admin: Mailboxes"
    description: Account (mailbox) management (JWT + admin)
  - name: "Admin: Aliases"
    description: Alias management (JWT + admin)
  - name: "Admin: Pipelines"
    description: Pipeline management (JWT + admin)
  - name: "Admin: Custom Filters"
    description: Custom filter management (JWT + admin)
  - name: "Admin: Queue"
    description: Outbound queue management (JWT + admin)
  - name: "Admin: Sender Rules"
    description: Domain allow/block lists (JWT + admin)
  - name: "Admin: Suppressions"
    description: Recipients a domain's mail is no longer sent to after a hard bounce (JWT + admin)
  - name: "Admin: DKIM"
    description: DKIM key management (JWT + admin)
  - name: "Admin: Certificates"
    description: TLS certificate management (JWT + admin)
  - name: "Admin: Bans"
    description: IP ban management (JWT + admin)
  - name: "Admin: Logs"
    description: Delivery log (JWT + admin)
  - name: "Admin: Stats"
    description: Dashboard statistics (JWT + admin; admin role only, no capability)
  - name: "Admin: Roles & Grants"
    description: Roles, capabilities and the grants accounts hold (JWT + admin; users:* capabilities)
  - name: "Admin: Observability"
    description: Pipeline analytics funnel and per-message traces (JWT + admin; observability:read)
  - name: "Admin: Audit"
    description: The hash-chained audit log and a check of its chain (JWT + admin; audit:read)
  - name: "Admin: MTA-STS"
    description: Per-domain MTA-STS policy management (JWT + admin; domains:* capabilities)
  - name: "Admin: TLS Reports"
    description: Received TLS-RPT reports (JWT + admin; domains:read)
  - name: "Admin: Testing"
    description: Non-production test/debug helpers (JWT + admin; admin role only, disabled in production)

# Default: either the httpOnly restmail_access cookie (browser SPAs) OR a JWT
# Authorization: Bearer header (programmatic clients). Each entry is an
# alternative, so presenting either satisfies auth. Cookie-authenticated,
# state-changing requests additionally require the X-CSRF-Token header (see the
# CSRFToken parameter). Operations override with `security: []` (no auth), or
# with requirements whose roles name the capability they need.
security:
  - CookieAuth: []
  - BearerAuth: []

paths:
  "/api/v1/auth/recover/email":
    "post":
      "description": "Supply the account address. The response is identical for unknown, disabled and unverified accounts. Every request uses the same per-address budget (five, then one per 15 minutes), in addition to the shared per-IP authentication throttle. Links expire after 15 minutes; requesting another invalidates the previous link."
      "operationId": "requestRecoveryEmail"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/requestRecoveryEmailRequest"
        "required": true
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Data-passwordChanged"
          "description": "OK"
        "400":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Bad Request"
        "413":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Request Entity Too Large"
        "422":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ValidationErrorResponse"
          "description": "Unprocessable Entity"
        "429":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Too Many Requests"
          "headers":
            "Retry-After":
              "description": "Seconds until another request is allowed"
              "required": true
              "schema":
                "type": "integer"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Internal Server Error"
        "503":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Service Unavailable"
      "security": []
      "summary": "Request a password recovery link"
      "tags":
        - "Auth"
  "/api/v1/auth/recover/email/redeem":
    "post":
      "description": "Redeems a verified recovery email token once. Changes the password and ends every session and app password atomically. The authenticator and recovery codes remain; sign in normally with the new password and any required second factor. Does not sign in or enroll new authentication methods."
      "operationId": "redeemRecoveryEmail"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/redeemRecoveryEmailRequest"
        "required": true
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Data-passwordChanged"
          "description": "OK"
        "400":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Bad Request"
        "401":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Unauthorized"
        "413":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Request Entity Too Large"
        "422":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ValidationErrorResponse"
          "description": "Unprocessable Entity"
        "429":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "rate_limited: too many requests to the shared authentication throttle"
          "headers":
            "Retry-After":
              "description": "Seconds until a request may be made again"
              "required": true
              "schema":
                "type": "integer"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Internal Server Error"
      "security": []
      "summary": "Choose a new password with a recovery email link"
      "tags":
        - "Auth"
  "/api/v1/auth/recovery-email":
    "get":
      "operationId": "getRecoveryEmail"
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Data-recoveryEmailStatus"
          "description": "OK"
        "401":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "unauthorized: no token, a bad one, or a session that has ended"
        "403":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Refused before the handler runs: setup_required (the account has not finished setup), csrf_failed (a cookie session's unsafe request without the CSRF header) or forbidden (the session lacks the capability)"
        "413":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "request_too_large: the body is over the API's size cap"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Internal Server Error"
        "503":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "unavailable: the session check could not be made"
      "security":
        -
          "CookieAuth": []
        -
          "BearerAuth": []
      "summary": "Read your registered recovery email"
      "tags":
        - "Auth"
    "post":
      "description": "Requires a signed-in session and the current password. Replacing the address clears verification and invalidates previous email tokens. Verification lasts 15 minutes. Recovery address changes freeze for three days after email recovery."
      "operationId": "registerRecoveryEmail"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/registerRecoveryEmailRequest"
        "required": true
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Data-passwordChanged"
          "description": "OK"
          "links":
            "getRecoveryEmail":
              "operationId": "getRecoveryEmail"
        "400":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Bad Request"
        "401":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "unauthorized: no token, a bad one, or a session that has ended"
        "403":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Forbidden"
        "413":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Request Entity Too Large"
        "422":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ValidationErrorResponse"
          "description": "Unprocessable Entity"
        "429":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "rate_limited: too many requests to the shared authentication throttle"
          "headers":
            "Retry-After":
              "description": "Seconds until a request may be made again"
              "required": true
              "schema":
                "type": "integer"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Internal Server Error"
        "503":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Service Unavailable"
      "security":
        -
          "CookieAuth": []
        -
          "BearerAuth": []
      "summary": "Register an external recovery email before lockout"
      "tags":
        - "Auth"
  "/api/v1/auth/recovery-email/link":
    "get":
      "operationId": "recoveryEmailLink"
      "responses":
        "200":
          "content":
            "text/html":
              "schema":
                "type": "string"
          "description": "OK"
        "413":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "request_too_large: the body is over the API's size cap"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Internal Server Error"
      "security": []
      "summary": "Open a private recovery email link"
      "tags":
        - "Auth"
  "/api/v1/auth/recovery-email/verify":
    "post":
      "operationId": "verifyRecoveryEmail"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/recoveryEmailTokenRequest"
        "required": true
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Data-passwordChanged"
          "description": "OK"
        "400":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Bad Request"
        "401":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Unauthorized"
        "413":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Request Entity Too Large"
        "422":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ValidationErrorResponse"
          "description": "Unprocessable Entity"
        "429":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "rate_limited: too many requests to the shared authentication throttle"
          "headers":
            "Retry-After":
              "description": "Seconds until a request may be made again"
              "required": true
              "schema":
                "type": "integer"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorResponse"
          "description": "Internal Server Error"
      "security": []
      "summary": "Verify a recovery email with its single-use link"
      "tags":
        - "Auth"
  # ═══════════════════════════════════════════════════════════════
  # Health
  # ═══════════════════════════════════════════════════════════════
  /api/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/HealthStatus"

  # ═══════════════════════════════════════════════════════════════
  # Auth
  # ═══════════════════════════════════════════════════════════════
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Sign an account in with its address and password
      description: >
        Takes the account's address (`email`), a password matching one of its
        password credentials, and a code from one of its authenticators when it
        has one (`totp_code`, or a `recovery_code`); without the code the
        answer is `401 totp_required`. An account with no password (one reached
        only through its owners) cannot be signed in to, and is answered as a
        wrong password. There is no other kind of sign-in: no username.

        On success a browser gets three cookies: restmail_access (httpOnly, the
        session token), restmail_refresh (httpOnly, scoped to /api/v1/auth), and
        restmail_csrf (readable, for the double-submit CSRF header), and no
        tokens in the body. A native client sends "client": "native" and gets
        access_token, refresh_token and refresh_expires_in in the body instead,
        with no cookies; it sends the access token as Authorization: Bearer.

        The bootstrap account's deploy-time password works for 72 hours, until
        the account chooses its own. After that, the right password answers
        401 bootstrap_expired — only the right one, so a guesser learns
        nothing — and the cure is to deploy again with a new password. Signing
        in with it spends nothing: the session is in setup (setup_required)
        and the password keeps working, so an install can be verified by
        signing in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              signed_in:
                value: {email: admin@restmail.test, password: fixture-password, client: native}
              wrong_password:
                value: {email: admin@restmail.test, password: contract-wrong-password, client: native}
              email_missing:
                value: {password: fixture-password, client: native}
              password_missing:
                value: {email: admin@restmail.test, client: native}
              client_invalid:
                value: {email: admin@restmail.test, password: fixture-password, client: desktop}
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/LoginResponse"
              examples:
                signed_in:
                  value:
                    data:
                      expires_in: 900
                      user: {id: 1, email: admin@restmail.test, display_name: Admin}
                      access_token: example-access-token
                      refresh_token: example-refresh-token
                      refresh_expires_in: 604800
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                wrong_password:
                  value:
                    error: {code: unauthorized, message: Invalid email or password}
        "403":
          description: >
            `access_restricted`: the password and second factor are right, but
            the server's capabilities leave the account neither a session on
            its own mailbox (`mailbox:session`) nor an administrative one
            (`admin:session`). A superadmin is never refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples: {}
        "422":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                email_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields: {email: "required: the account's address"}
                password_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields: {password: required}
                client_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields: {client: 'must be "native" or omitted'}

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Log out — revoke the session and clear the auth cookies
      description: >
        Revokes the refresh token server-side and expires the restmail_access,
        restmail_refresh and restmail_csrf cookies. The refresh token is the
        restmail_refresh cookie, or for a native client the request body. When
        that ends the session, the phones it registered for push
        (`/api/v1/devices`) are removed with it.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Logged out
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: Refresh the session (cookie, or body token for native clients)
      description: >
        Takes the refresh token from the restmail_refresh cookie, or when there
        is no cookie from the request body. The replacement pair goes back on
        the same channel: cookies for a cookie request, body fields for a body
        request. A request carrying the cookie is always answered with cookies,
        whatever its body says. The new tokens have a new `jti` but stay in the
        same session: the `sid` claim minted at sign-in. A refresh token
        without a `sid` is refused with 401, and the client signs in again.
        So is one from before the account's sessions last ended (its `cep`
        is older than the account's), even if it was never revoked.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
            examples:
              refreshed:
                value: {refresh_token: fixture-refresh-token}
              invalid_token:
                value: {refresh_token: contract-invalid-token}
              token_missing:
                value: {}
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RefreshResponse"
              examples:
                refreshed:
                  value:
                    data:
                      expires_in: 900
                      user: {id: 1, email: admin@restmail.test, display_name: Admin}
                      access_token: example-access-token
                      refresh_token: example-refresh-token
                      refresh_expires_in: 604800
        "401":
          description: Missing, invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_token:
                  value:
                    error: {code: unauthorized, message: Invalid or expired refresh token}
                token_missing:
                  value:
                    error: {code: unauthorized, message: No refresh token}

  /api/v1/auth/reset:
    post:
      operationId: resetAdmin
      tags: [Auth]
      summary: Let an account back in with a reset token; also hands a server over
      description: >
        Redeems a single-use reset_admin token (`restmail reset-admin`). The
        account it names gets the password the redeemer chose, loses its
        authenticator and must enroll a new one, its app passwords are revoked,
        and every token it was issued is dead at once — refresh tokens are
        revoked, and access tokens carry a credential epoch the reset bumps.
        Whoever held the old credentials, a person or an agent that set the
        server up, is locked out.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string, minLength: 12}
                client: {type: string, enum: [native]}
      responses:
        "200":
          description: Reset; the session owes an authenticator
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/LoginResponse"
        "401":
          description: invalid_token
        "422":
          description: Password under 12 characters (the token is not spent)

  /api/v1/auth/recover:
    post:
      operationId: recoverAccount
      tags: [Auth]
      summary: Reset a forgotten password with the authenticator and a recovery code
      description: >
        Self-service password reset for an account that set up two-factor
        authentication in advance: a current code from its authenticator and
        one of its recovery codes, both. The authenticator is checked first,
        so a wrong code never spends a recovery code. The account gets the new
        password and keeps its authenticator; its app passwords are revoked and
        every token it was issued is dead at once, as for a password change.
        Answers with a fresh session. An account without two-factor
        authentication has no self-service path: an admin resets it. Every
        refusal is the same 401, whether the address exists or not. Each
        address may be refused 5 times, then once per 15 minutes, from any
        client; past that it is answered 429 without a check.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, totp_code, recovery_code, new_password]
              properties:
                email: {type: string}
                totp_code: {type: string}
                recovery_code: {type: string}
                new_password: {type: string, minLength: 12}
                client: {type: string, enum: [native]}
      responses:
        "200":
          description: Password reset; a new session
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/LoginResponse"
        "401":
          description: recovery_failed
        "422":
          description: A field missing, or a password under 12 characters (no code is spent)
        "429":
          description: Too many attempts from this client, or too many refusals for this address

  /api/v1/server:
    get:
      operationId: describeServer
      tags: [Auth]
      summary: What this server is
      description: >
        For anyone who can reach the server. A client knows a server only by
        its address, so the server describes itself; the version is the one
        deliberate disclosure, so what runs can be confirmed from outside.
        `restmail status` prints this. Throttled with the owner endpoints, not
        with sign-in. (Before 0.7 it also said whether the server was claimed,
        and how to claim it; a server is no longer claimed — its first admin
        is the bootstrap one.)
      security: []
      responses:
        "200":
          description: The description
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [product, version]
                    properties:
                      product: {type: string, enum: [rest-mail]}
                      version: {type: string, description: "e.g. 0.7.0; dev for a build with none stamped in"}

  /api/v1/auth/owner/challenge:
    post:
      operationId: ownerChallenge
      tags: [Auth]
      summary: A challenge for an owner key to sign
      description: >
        The first half of proving ownership of the server with a public key registered in
        PostgreSQL (what `restmail reset-admin` does), or of reading
        its status with a key listed in RESTMAIL_STATUS_KEYS (what
        `restmail status --key` does). The challenge is stateless, valid two minutes, and answered once.
        Throttled like login.
      security: []
      responses:
        "200":
          description: A challenge
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [challenge, expires_at]
                    properties:
                      challenge: {type: string}
                      expires_at: {type: string, format: date-time}
        "409":
          description: no_owner_keys — the server lists neither owner keys nor status keys

  /api/v1/auth/owner/token:
    post:
      operationId: ownerToken
      tags: [Auth]
      summary: Trade a signed challenge for a reset-admin token
      description: >
        `signature` is the SSH wire-format signature (base64) by the private
        half of `public_key` over the bytes
        `"restmail-owner-v1\n" + purpose + "\n" + address + "\n" + challenge`,
        so a signature for one request cannot be presented for another. `public_key` must be listed in
        the PostgreSQL owner-key registry; a status key (RESTMAIL_STATUS_KEYS) is refused.
        Ed25519, ECDSA, and RSA with rsa-sha2-256/512 are
        accepted; ssh-rsa (SHA-1) signatures are not. The token is redeemed at
        `/api/v1/auth/reset`; the app's link is `rest-mail://reset?server=…&token=…`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, public_key, signature, purpose, address]
              properties:
                challenge: {type: string}
                public_key: {type: string, description: authorized_keys format}
                signature: {type: string, format: byte}
                purpose: {type: string, enum: [reset-admin], description: "the only one; part of what is signed"}
                address: {type: string, format: email, description: "the account to let back in, as signed"}
                lifetime_seconds: {type: integer, minimum: 0, maximum: 86400, description: "0: 15 minutes"}
      responses:
        "200":
          description: A single-use token
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [purpose, token, expires_at]
                    properties:
                      purpose: {type: string}
                      token: {type: string}
                      expires_at: {type: string, format: date-time}
        "401":
          description: invalid_challenge — forged, expired, or already answered
        "403":
          description: not_owner — the key is not listed, or the signature does not verify
        "404":
          description: no_such_account
        "409":
          description: no_owner_keys — the server lists none
        "422":
          description: Purpose, address, lifetime or signature malformed

  /api/v1/auth/owner/status:
    post:
      operationId: ownerStatus
      tags: [Auth]
      summary: Trade a signed challenge for what the server runs
      description: >
        How a deploy is confirmed from outside (`restmail status --key`).
        `signature` is the SSH wire-format signature (base64) by the private
        half of `public_key` over the bytes
        `"restmail-owner-v1\n" + "status" + "\n" + "" + "\n" + challenge`:
        the owner scheme with the purpose `status` and no address, so a
        signature made to reset an admin does not read the status, nor the
        other way round. `public_key` must be listed in RESTMAIL_STATUS_KEYS or
        the PostgreSQL owner-key registry. A status key reads this and can do nothing else.
        The challenge is spent, so an answer works once. Keys and signatures as
        for `/api/v1/auth/owner/token`. Throttled with the owner endpoints.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, public_key, signature]
              properties:
                challenge: {type: string}
                public_key: {type: string, description: authorized_keys format}
                signature: {type: string, format: byte}
      responses:
        "200":
          description: What runs, and since when. No secrets, no configuration.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [version, commit, built_at, started_at]
                    properties:
                      version: {type: string, description: "e.g. 0.8.0; dev for a build with none stamped in"}
                      commit: {type: string, description: "the commit built; unknown when none was stamped in"}
                      built_at: {type: string, description: "RFC 3339; unknown when none was stamped in"}
                      started_at: {type: string, format: date-time, description: when this API process started}
        "401":
          description: invalid_challenge — forged, expired, or already answered
        "403":
          description: not_status_key — the key is on neither list, or the signature does not verify
        "409":
          description: no_status_keys — the server lists neither status keys nor owner keys
        "422":
          description: Signature malformed

  /api/v1/auth/2fa:
    get:
      operationId: getTwoFactorStatus
      tags: [Auth]
      summary: Read your authenticator status
      description: >
        Reports only the signed-in account's own state, including while it is
        finishing setup. No account id is accepted. Enabled means a confirmed
        enrollment gates sign-in; pending means an unconfirmed enrollment
        exists and does not yet gate sign-in. Both are false without an
        enrollment and they are never both true. This read returns no setup
        secret or recovery codes and is not subject to the authentication
        throttle. Requires a password-authenticated session, not an app
        password, gateway password or API key.
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: The caller's own enrollment state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/TwoFactorStatus"
              example:
                data: {enabled: false, pending: false}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: internal_error — the enrollment could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/2fa/enroll:
    post:
      operationId: enrollTwoFactor
      tags: [Auth]
      summary: Start an authenticator enrollment
      description: >
        Generates a setup secret, provisioning URI and one-time recovery codes
        for the signed-in account itself. No request body or account id is
        needed. It may replace a pending enrollment but never a confirmed one.
        Save the returned recovery codes and confirm with a current code at
        POST /api/v1/auth/2fa/confirm; until confirmation the pending enrollment
        does not gate sign-in. The response is the only disclosure of these
        secrets: store the recovery codes safely and do not log them.
        Requires a password-authenticated session, including a session still
        finishing setup; app passwords, gateway passwords and API keys cannot
        enroll. Throttled with login. Refuses new enrollment when the feature
        is disabled or server encryption is not configured.
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Pending enrollment, including secrets returned this once
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/TwoFactorEnrollment"
              example:
                data:
                  secret: JBSWY3DPEHPK3PXP
                  otpauth_url: otpauth://totp/REST%20Mail:user%40restmail.test?secret=JBSWY3DPEHPK3PXP&issuer=REST%20Mail
                  recovery_codes: [0123456789abcdef]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden — two-factor enrollment is disabled on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: conflict — two-factor authentication is already enabled; disable it before enrolling again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests to the shared authentication throttle
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: internal_error — the enrollment could not be read, generated, encrypted or saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: unavailable — server encryption is not configured; no secret is stored in plaintext
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/2fa/confirm:
    post:
      operationId: confirmTwoFactor
      tags: [Auth]
      security:
        - CookieAuth: []
        - BearerAuth: []
      summary: Switch on a pending authenticator with its first code
      description: >
        Completes enrollment (`POST /api/v1/auth/2fa/enroll`) with a current
        code from the new authenticator, in `totp_code` as sign-in takes it.
        Until this succeeds, 2FA does not gate sign-in. A wrong code is
        `403 invalid_totp`, never `401`: the session that sent it is still
        good, so a client must not renew it or send the code again. Throttled
        like login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totp_code]
              properties:
                totp_code:
                  type: string
                  description: A current code from the new authenticator
      responses:
        "204":
          description: Two-factor authentication is on
        "400":
          description: No pending enrollment to confirm
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            The code is wrong (`invalid_totp`), or two-factor authentication
            is turned off on this server (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Two-factor authentication is already on
        "422":
          description: totp_code missing

  /api/v1/auth/2fa/disable:
    post:
      operationId: disableTwoFactor
      tags: [Auth]
      security:
        - CookieAuth: []
        - BearerAuth: []
      summary: Turn two-factor authentication off
      description: >
        Takes the second factor the way sign-in does: a current code from the
        authenticator in `totp_code`, or an unused recovery code in
        `recovery_code`, which it spends. A wrong one is `403`, never `401`
        (`invalid_totp`, or `invalid_recovery_code` when only a recovery code
        was sent): the session that sent it is still good. Turning it off
        ends every session of the account, this one included; app passwords
        stay. An account that must have it (the bootstrap admin) cannot
        (`403 two_factor_required`). Throttled like login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                totp_code:
                  type: string
                  description: A current code from the authenticator
                recovery_code:
                  type: string
                  description: One of the account's recovery codes, instead of totp_code; it is spent
      responses:
        "204":
          description: Two-factor authentication is off; every session of the account is revoked
        "400":
          description: Two-factor authentication is not on
        "401":
          $ref: "#/components/responses/Unauthorized"
        '403':
          description: Requires a human 2FA sign-in (two_factor_required); sensitive changes require recent proof (recent_two_factor_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                two_factor_required:
                  value:
                    error:
                      code: two_factor_required
                      message: 'This action needs a session signed in with two-factor authentication: sign in again
                        with your code'
                recent_two_factor_required:
                  value:
                    error:
                      code: recent_two_factor_required
                      message: 'Sign in again with two-factor authentication: a recent second factor is required'
        "422":
          description: Neither totp_code nor recovery_code sent

  /api/v1/auth/password:
    post:
      operationId: changeOwnPassword
      tags: [Auth]
      summary: Replace your own password
      description: >
        The signed-in account sets a new password, proving the current one even
        from a fresh session so a stolen access token alone cannot take the
        account. The new password replaces every password credential it had.
        Clears the "password" setup step, revokes every app password (whoever
        knew the old password could have made one, each recorded as
        `credentials.revoke` with reason `password_changed`), and revokes every
        session of the account, this one included: sign in again with the new
        password.
        One of the only calls a session in setup (setup_required non-empty)
        may make. A wrong current password is `403 invalid_password`, never
        `401`: the session is still good. Throttled like login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 12
                  description: Must differ from the current password.
      responses:
        "200":
          description: Password changed; every session of the account is revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        '403':
          description: Requires a human 2FA sign-in (two_factor_required); sensitive changes require recent proof (recent_two_factor_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                two_factor_required:
                  value:
                    error:
                      code: two_factor_required
                      message: 'This action needs a session signed in with two-factor authentication: sign in again
                        with your code'
                recent_two_factor_required:
                  value:
                    error:
                      code: recent_two_factor_required
                      message: 'Sign in again with two-factor authentication: a recent second factor is required'
        "422":
          description: New password missing, shorter than 12 characters, or unchanged

  /api/v1/auth/protocol-sign-in:
    post:
      operationId: protocolSignIn
      tags: [Auth]
      summary: Sign a mail client in (protocol gateways)
      description: >
        The one way the IMAP, POP3 and SMTP gateways sign a mail client in,
        whatever it gave as its password: the request carries the address and
        that password with HTTP Basic, checked against the account's
        credentials — an app password, or one of the account's passwords — and
        the audit log records the sign-in (`auth.protocol_sign_in`) with the
        credential and the protocol. It answers with the account, so the
        gateway knows which account the requests it then makes, each with the
        same Basic credentials, are for. No session is made. A session cannot
        use it. A refused credential is recorded as `auth.basic`. Throttled
        like login.
      security:
        - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [protocol]
              properties:
                protocol:
                  type: string
                  enum: [imap, pop3, smtp]
            examples:
              signed_in:
                value: {protocol: imap}
              invalid_body:
                value: []
              protocol_missing:
                value: {}
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [user, credential_id, credential_kind]
                    properties:
                      user:
                        type: object
                        required: [id, email, display_name]
                        properties:
                          id:
                            type: integer
                            description: The account id, as in /api/v1/accounts/{id}
                          email:
                            type: string
                            format: email
                          display_name:
                            type: string
                      credential_id:
                        type: integer
                      credential_kind:
                        type: string
                        enum: [password, app_password]
                        description: >
                          An app password reaches only its own account's
                          mailbox; the account's password reaches what its
                          grants reach (sending as an account it owns, say).
              examples:
                signed_in:
                  value:
                    data:
                      user: {id: 1, email: contract-ordinary@restmail.test, display_name: Contract Ordinary}
                      credential_id: 1
                      credential_kind: app_password
        '400':
          description: Not HTTP Basic (`basic_required`), or an invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: {}
        "401":
          description: >
            `unauthorized` for a wrong address or password;
            `app_password_required` for the right password of an account with
            two-factor authentication; `setup_required` for one still in setup.
        "403":
          description: >
            `access_restricted`: the server's capabilities leave the account no
            session on its own mailbox (`mailbox:session`). Being an
            administrator does not stand in for it; a superadmin is never
            refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples: {}
        '422':
          description: Request failed validation (validation_failed), with details.fields naming each failing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                protocol_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          protocol: must be "imap", "pop3" or "smtp"
                invalid_body:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          body: the body is not a JSON object
        "429":
          description: Too many refused credentials from this client, or too many sign-ins

  # ═══════════════════════════════════════════════════════════════
  # Accounts
  # ═══════════════════════════════════════════════════════════════
  /api/v1/accounts:
    get:
      operationId: listAccounts
      security:
        - CookieAuth: []
        - BearerAuth: []
        - APIKeyAuth: []
        - BasicAuth: []
      tags: [Accounts]
      summary: List the accounts this one reaches
      description: >
        The session's own account first (`is_primary`), then every account it
        holds an active mail grant on at that account's own scope
        (`mailbox:<address>`): the ones it created or linked, by address.
        Domain and server-wide admin grants reach mailboxes too, but are
        administration, and list none. With an app password, only its own.
      responses:
        "200":
          description: The accounts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
          links:
            getAccount:
              operationId: getAccount
              parameters:
                id: '$response.body#/data/0/id'
            listCredentials:
              operationId: listCredentials
              parameters:
                id: '$response.body#/data/0/id'
            createAppPassword:
              operationId: createAppPassword
              parameters:
