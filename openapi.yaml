  /api/v1/admin/mailboxes/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getMailbox
      tags: ["Admin: Mailboxes"]
      security:
        - CookieAuth: [accounts:read]
        - BearerAuth: [accounts:read]
        - APIKeyAuth: [accounts:read]
      summary: Get an account by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: Resource ID
          examples:
            found:
              value: 1
            missing:
              value: 2147483647
      responses:
        "200":
          description: Mailbox details
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Mailbox"
        "404":
          description: Mailbox not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing:
                  value:
                    error:
                      code: mailbox_not_found
                      message: Mailbox not found
    patch:
      operationId: updateMailbox
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Resource ID
        examples:
          found:
            value: 1
          missing:
            value: 2147483647
      tags: ["Admin: Mailboxes"]
      security:
        - CookieAuth: [accounts:write]
        - BearerAuth: [accounts:write]
        - APIKeyAuth: [accounts:write]
      summary: Update an account
      description: |
        A new `password` (12 characters or more) replaces every password the
        account had and ends every session of it. It also revokes all the
        account's app passwords, in the transaction that sets it, recording
        each in the audit log as `credentials.revoke` with `reason`
        `password_changed`. `"active": false` ends every session of it too,
        so enabling it again brings none of them back; its app passwords
        stay, and work again once it is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMailboxRequest"
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              updated:
                value:
                  display_name: Contract Test
                  quota_bytes: 1073741824
                  active: true
              # A password under 12 characters: refused before anything is
              # hashed or stored, so the account keeps its passwords and
              # sessions.
              password_short:
                value:
                  display_name: Contract Test
                  password: short
              missing:
                value:
                  display_name: Contract Test
                  quota_bytes: 1073741824
                  active: true
      responses:
        "200":
          description: Mailbox updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Mailbox"
              examples:
                updated:
                  value:
                    data:
                      id: 2
                      domain_id: 1
                      local_part: new-account
                      address: new-account@restmail.test
                      display_name: Contract Test
                      quota_bytes: 1073741824
                      quota_used_bytes: 0
                      active: true
                      last_login_at: null
                      password_change_required: false
                      two_factor_required: false
                      last_password_change: null
                      created_at: "2026-10-21T12:00:00Z"
                      updated_at: "2026-10-21T12:00:00Z"
        "404":
          description: Mailbox not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing:
                  value:
                    error:
                      code: mailbox_not_found
                      message: Mailbox not found
        "422":
          description: The new password is shorter than 12 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                password_short:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          password: must be at least 12 characters
        '403':
          description: Requires a human 2FA sign-in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                two_factor_required:
                  value:
                    error:
                      code: two_factor_required
                      message: 'This action needs a session signed in with two-factor
                        authentication: sign in again with your code'
                recent_two_factor_required:
                  value:
                    error:
                      code: recent_two_factor_required
                      message: 'Sign in again with two-factor authentication: a recent second
                        factor is required'
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: Resource ID
          examples:
            found:
              value: 1
            missing:
              value: 2147483647
      operationId: deleteMailbox
      tags: ["Admin: Mailboxes"]
      security:
        - CookieAuth: [accounts:delete]
        - BearerAuth: [accounts:delete]
        - APIKeyAuth: [accounts:delete]
      summary: Delete an account
      description: >
        Its credentials are revoked (kept, for the audit trail) and its
        sessions end. Every grant it held is removed under the grants rules
        (a session with 2FA, holding what it removes; the last superadmin
        cannot go), and every grant others held on it, so a new account at
        the same address inherits no owner. Each removal is recorded.
      responses:
        "204":
          description: Deleted
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '403':
          description: Requires a human 2FA sign-in (two_factor_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                two_factor_required:
                  value:
                    error:
                      code: two_factor_required
                      message: 'This action needs a session signed in with two-factor authentication: sign in again
                        with your code'
        "404":
          description: Mailbox not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing:
                  value:
                    error:
                      code: mailbox_not_found
                      message: Mailbox not found
        "409":
          description: It holds the last superadmin (`last_superadmin`)

  /api/v1/admin/mailboxes/{id}/sessions:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    delete:
      operationId: endMailboxSessions
      tags: ["Admin: Mailboxes"]
      security:
        - CookieAuth: [accounts:write]
        - BearerAuth: [accounts:write]
        - APIKeyAuth: [accounts:write]
      summary: Sign an account out everywhere
      description: >
        Ends every session of the account: its refresh tokens are revoked and
        its credential epoch moves on, so every access token it was issued is
        refused at its next request, on the event stream and at refresh. Its
        passwords and app passwords stay: a mail client signed in with an app
        password keeps working, and is revoked on its own
        (`DELETE /api/v1/accounts/{id}/credentials/{credential_id}`).
      responses:
        "204":
          description: Every session of the account has ended
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Authentication refusals exceeded the configured rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

