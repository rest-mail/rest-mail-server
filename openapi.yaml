        removes itself (its session ended, or APNs said it is gone) is
        recorded the same way, by the system, with the reason.
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not one of this session's devices, or push is not configured

