  /api/v1/admin/audit:
    get:
      operationId: listAuditEntries
      tags: ["Admin: Audit"]
      security:
        - CookieAuth: [audit:read]
        - BearerAuth: [audit:read]
      summary: Read the audit log, newest first
      description: >-
        Entries newest first. To read the next page, pass the returned
        `pagination.cursor` as `before_seq`. A filter that does not parse is
        refused with 422, never ignored. This read is itself recorded
        (`audit.read`).
      parameters:
        - name: actor_kind
          in: query
          schema:
            type: string
            enum: [account, system, anonymous]
        - name: actor_id
          in: query
          description: The account (mailbox) id
          schema:
            type: integer
            minimum: 0
        - name: actor
          in: query
          description: Actor name (an address) contains this, in any case
          schema:
            type: string
        - name: action
          in: query
          description: Exact action, e.g. `auth.sign_in` or `admin.change`
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
            enum: [success, denied, failed, error]
        - name: since
          in: query
          description: Entries at or after this time (RFC 3339)
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: Entries at or before this time (RFC 3339)
          schema:
            type: string
            format: date-time
        - name: before_seq
          in: query
          description: Entries with a lower seq than this (the previous page's cursor)
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not an admin, or the session lacks audit:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/audit/verify:
    get:
      operationId: verifyAuditLog
      tags: ["Admin: Audit"]
      security:
        - CookieAuth: [audit:read]
        - BearerAuth: [audit:read]
      summary: Check the audit log's hash chain
      description: >-
        Walks the whole log from its lowest seq and checks that every entry
        follows the one before (seq one higher, `prev_hash` its hash) and hashes
        to its own `hash`. Stops at the first entry that does not hold. If the
        log does not start at seq 1, the walk starts from the first entry's own
        `prev_hash` and says so in `note`. Given an `anchor` (one entry's seq
        and hash, a copy kept outside the server), the log must also still
        hold that entry with that hash; a log rewritten and rehashed from some
        entry on holds as a chain, but not to an anchor taken before the
        rewrite. This read is itself recorded (`audit.read`).
      parameters:
        - name: anchor
          in: query
          description: The anchored entry as `<seq>:<hash>`, its seq and its hash in 64 hex digits
          schema:
            type: string
            pattern: "^[1-9][0-9]{0,17}:[0-9a-fA-F]{64}$"
      responses:
        "200":
          description: What the check found
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AuditVerifyResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not an admin, or the session lacks audit:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

