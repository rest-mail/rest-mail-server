      description: >-
        The pending and in-flight scheduled sends for this account, soonest
        first. A message that has been sent or cancelled is no longer listed.
      responses:
        "200":
          description: Scheduled messages, soonest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScheduledSend"

