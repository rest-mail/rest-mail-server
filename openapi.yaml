  /api/v1/admin/pipelines/logs:
    get:
      operationId: listPipelineLogs
      tags: ["Admin: Pipelines"]
      x-required-capability: pipelines:read
      summary: List recent per-message pipeline traces
      description: >-
        Newest-first list of per-message pipeline traces. Each row is a
        MessageTrace (outcome, reason_code, transport, envelope, stage timeline,
        duration). The `action` filter matches the trace's final_action.
      parameters:
        - name: pipeline_id
          in: query
          schema:
            type: integer
        - name: direction
          in: query
          schema:
            type: string
            enum: [inbound, outbound]
        - name: action
          in: query
          description: Matches MessageTrace.final_action
          schema:
            type: string
            enum: [continue, reject, quarantine, discard, defer]
        - name: rfc_message_id
          in: query
          description: RFC 5322 Message-ID correlation key
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
            enum: [delivered, queued, rejected, quarantined, discarded, deferred]
        - name: reason_code
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Pipeline message traces
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MessageTrace"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Custom Filters
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/custom-filters:
    get:
      operationId: listCustomFilters
      tags: ["Admin: Custom Filters"]
      x-required-capability: pipelines:read
      summary: List custom filters, optionally filtered by domain
      parameters:
        - name: domain_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Custom filter list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomFilter"
    post:
      operationId: createCustomFilter
      tags: ["Admin: Custom Filters"]
      x-required-capability: pipelines:write
      summary: Create a custom filter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomFilterRequest"
      responses:
        "201":
          description: Custom filter created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CustomFilter"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/custom-filters/validate:
    post:
      operationId: validateCustomFilter
      tags: ["Admin: Custom Filters"]
      x-required-capability: pipelines:write
      summary: Syntax-check a JavaScript filter script via the sidecar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [script]
              properties:
                script:
                  type: string
                  description: JavaScript filter source to validate
                email:
                  type: object
                  description: Optional sample email passed through to the sidecar
      responses:
        "200":
          description: >-
            Raw validation result proxied verbatim from the JS filter sidecar
            (shape determined by the sidecar).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: >-
            JS filter sidecar unavailable, or it refused the API's token
            (JS_FILTER_TOKEN differs between the API and the sidecar)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/custom-filters/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getCustomFilter
      tags: ["Admin: Custom Filters"]
      x-required-capability: pipelines:read
      summary: Get a custom filter by ID
      responses:
        "200":
          description: Custom filter details
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CustomFilter"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCustomFilter
      tags: ["Admin: Custom Filters"]
      x-required-capability: pipelines:write
      summary: Update a custom filter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomFilterRequest"
      responses:
        "200":
          description: Custom filter updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CustomFilter"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCustomFilter
      tags: ["Admin: Custom Filters"]
      x-required-capability: pipelines:delete
      summary: Delete a custom filter
      responses:
        "200":
          description: Custom filter deleted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        example: deleted

  /api/v1/admin/custom-filters/{id}/test:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: testCustomFilter
      tags: ["Admin: Custom Filters"]
      x-required-capability: pipelines:write
      summary: Run a stored custom filter's script against a sample email via the sidecar
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: object
                  description: >-
                    Optional sample email. When omitted a minimal built-in sample
                    is used.
      responses:
        "200":
          description: >-
            Raw execution result proxied verbatim from the JS filter sidecar
            (status and shape determined by the sidecar).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Filter config contains no script, or invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: >-
            JS filter sidecar unavailable, or it refused the API's token
            (JS_FILTER_TOKEN differs between the API and the sidecar)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

