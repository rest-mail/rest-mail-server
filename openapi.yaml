    # ─────────────────────────────────────────────────────────────
    # Health
    # ─────────────────────────────────────────────────────────────
    HealthStatus:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          example: healthy
        db:
          type: string
          example: connected

    # ─────────────────────────────────────────────────────────────
    # Auth
    # ─────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          pattern: '\S'
          description: The account's address. There is no username.
        password:
          type: string
          format: password
          minLength: 1
        totp_code:
          type: string
          description: A current code from one of the account's authenticators, when it has one.
        recovery_code:
          type: string
          description: Instead of totp_code, one of the account's unused recovery codes.
        client:
          type: string
          enum: [native]
          description: >
            "native" for a client that is not a browser: the tokens come back
            in the body rather than as cookies. Omit for a browser.

    RefreshRequest:
      type: object
      description: Sent by native clients only; browsers send no body.
      properties:
        refresh_token:
          type: string

    TwoFactorStatus:
      type: object
      additionalProperties: false
      required: [enabled, pending]
      properties:
        enabled:
          type: boolean
          description: A confirmed enrollment gates sign-in
        pending:
          type: boolean
          description: An enrollment exists but has not been confirmed

    TwoFactorEnrollment:
      type: object
      additionalProperties: false
      required: [secret, otpauth_url, recovery_codes]
      properties:
        secret:
          type: string
          minLength: 1
          description: Base32 setup secret, returned only by this enrollment
        otpauth_url:
          type: string
          format: uri
          pattern: '^otpauth://'
          description: Provisioning URI for an authenticator app
        recovery_codes:
          type: array
          minItems: 1
          description: One-time codes returned only by this enrollment
          items:
            type: string
            minLength: 1

    LoginResponse:
      type: object
      required: [expires_in, user]
      description: >
        Login/refresh success body. For a browser it carries NO tokens: the
        access token is delivered only as the httpOnly restmail_access cookie
        (Set-Cookie), so JavaScript cannot read it, and a readable restmail_csrf
        cookie is set alongside for the double-submit CSRF defence. The token
        fields are present only for a native client.
      properties:
        expires_in:
          type: integer
          description: Access-token lifetime in seconds (lets the client schedule a refresh)
        user:
          type: object
          required: [id, email, display_name]
          properties:
            id:
              type: integer
            email:
              type: string
              format: email
            display_name:
              type: string
        scoped_capabilities:
          type: array
          description: >
            Active domain/mailbox capabilities, separate from the legacy global
            capabilities array. UI snapshot only; the API checks live grants on
            every request. Empty while account setup is unfinished.
          items:
            $ref: "#/components/schemas/ScopedCapability"
        capabilities:
          type: array
          description: >-
            The capabilities the account's grants in force
            (active ones, and eligible ones while switched on) give at `*`,
            sorted, or `["*"]` alone for a superadmin; for showing what the
            session can do (absent for an account holding no admin role). They
            authorise nothing: the API reads the grants on every request, and
            the token carries none. Capabilities
            held only on a domain or mailbox are not listed. Empty while
            setup_required is not.
          items:
            type: string
        setup_required:
          type: array
          description: >
            Absent once the account is set up. What the account must still do
            before its sessions reach anything else, which until then answers
            403 with code setup_required — and so does every session refreshed
            from this one. "password": POST
            /api/v1/auth/password. "two_factor": POST /api/v1/auth/2fa/enroll,
            then /api/v1/auth/2fa/confirm. A fresh install's bootstrap account,
            admin@<mail domain>, starts with both.
          items:
            type: string
            enum: [password, two_factor]
        access_token:
          type: string
          description: Native clients only. Send as Authorization Bearer.
        refresh_token:
          type: string
          description: Native clients only. Single use; each refresh returns a new one.
        refresh_expires_in:
          type: integer
          description: Native clients only. Refresh-token lifetime in seconds.

    RefreshResponse:
      type: object
      required: [expires_in, user]
      description: >
        Same shape and delivery as LoginResponse: cookies for a cookie
        refresh, body tokens for a native (body-token) refresh.
      properties:
        expires_in:
          type: integer
        user:
          type: object
          required: [id, email, display_name]
          properties:
            id:
              type: integer
            email:
              type: string
              format: email
            display_name:
              type: string
        scoped_capabilities:
          type: array
          description: >
            Active domain/mailbox capabilities, separate from the legacy global
            capabilities array. UI snapshot only; the API checks live grants on
            every request. Empty while account setup is unfinished.
          items:
            $ref: "#/components/schemas/ScopedCapability"
        capabilities:
          type: array
          items:
            type: string
        access_token:
          type: string
          description: Native clients only. Send as Authorization Bearer.
        refresh_token:
          type: string
          description: Native clients only. Single use; each refresh returns a new one.
        refresh_expires_in:
          type: integer
          description: Native clients only. Refresh-token lifetime in seconds.

    # ─────────────────────────────────────────────────────────────
    # Account
    # ─────────────────────────────────────────────────────────────
    Account:
      type: object
      description: >
        An account, which is a mailbox: what GET and POST /api/v1/accounts
        answer with. `id` is the mailbox's id, the `{id}` of every
        /api/v1/accounts/{id}/… route.
      required: [id, address, display_name, is_primary]
      properties:
        id:
          type: integer
        address:
          type: string
          format: email
        display_name:
          type: string
        is_primary:
          type: boolean
          description: The session's own account.
        owner_id:
          type: [integer, "null"]
          description: >
            The owning account of an owned account (an agent's, or a sub
            account), which never holds more than its owner; absent otherwise.

    AccountAddresses:
      type: object
      additionalProperties: false
      description: >
        What listAccountAddresses answers: the addresses that deliver to the
        account and the addresses it may send from.
      required: [account_id, address, receives, sends_as]
      properties:
        account_id:
          type: integer
          description: The account (mailbox) these addresses belong to.
        address:
          type: string
          format: idn-email
          description: The account's own address, its primary address.
        receives:
          type: array
          description: >
            The account's own address first, then every active alias on an
            active domain whose destination is this account, by address.
          items:
            $ref: "#/components/schemas/ReceivingAddress"
        sends_as:
          type: array
          description: >
            Every mailbox address this account may put in From, its own first
            and then by address. The check sendMessage makes decides each one,
            so a From listed here is accepted and one missing is refused.
          items:
            $ref: "#/components/schemas/SendingAddress"

    ReceivingAddress:
      type: object
      additionalProperties: false
      required: [address, primary]
      properties:
        address:
          type: string
          format: idn-email
          description: An address that delivers to this account.
        primary:
          type: boolean
          description: True for the account's own address; false for an alias.

    SendingAddress:
      type: object
      additionalProperties: false
      required: [address, primary, from, on_behalf]
      properties:
        address:
          type: string
          format: idn-email
          description: A mailbox address this account may send from.
        primary:
          type: boolean
          description: True for the account's own address.
        from:
          type: boolean
          description: >
            Sending with this From and `on_behalf` false is allowed:
            `mail:send` on the account's own mailbox, `mail:send_as` on
            another.
        on_behalf:
          type: boolean
          description: >
            Sending with this From and `on_behalf` true is allowed:
            `mail:send_on_behalf` on that mailbox, with the account's own
            address as RFC 5322 Sender.

    CreateAccountRequest:
      type: object
      required: [address]
      properties:
        address:
          type: string
          format: email
          description: On a domain this server hosts.
        display_name:
          type: string
        quota_bytes:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: Storage cap in bytes. An owned account inherits live when omitted or zero; a positive cap cannot exceed its owner's ceiling. Usage by all owned accounts shares the owner's budget.
        password:
          type: string
          minLength: 12
          description: >
            Optional. With one, the account can be signed in to; without one
            it has no credentials, and is reached only through its owners.
        owned:
          type: boolean
          description: >
            Make an owned account (an agent's, or a sub account), owned by the
            creator and never holding more than it does, checked live. Needs
            agents:create on the domain and a session that signed in with a
            second factor; otherwise 403.
        receive:
          type: [boolean, "null"]
          description: >
            Accept inbound mail through a mail:receive grant; defaults to true.
            False creates the account without that grant. Later changes use
            the audited grants API and require a 2FA session.
        password_hash:
          type: string
          maxLength: 256
          pattern: '^((\{BLF-CRYPT\})?\$2[aby]\$(0[4-9]|1[0-4])\$[./A-Za-z0-9]{53}|(\{SHA256-CRYPT\})?\$5\$(rounds=([1-9][0-9]{3,5}|1000000)\$)?[./A-Za-z0-9]{1,16}\$[./A-Za-z0-9]{43}|(\{SHA512-CRYPT\})?\$6\$(rounds=([1-9][0-9]{3,5}|1000000)\$)?[./A-Za-z0-9]{1,16}\$[./A-Za-z0-9]{86}|(\{ARGON2ID\})?\$argon2id\$v=19\$m=([89]|[1-9][0-9]{1,4}|1[0-9]{5}|2[0-5][0-9]{4}|26[01][0-9]{3}|2620[0-9]{2}|2621[0-3][0-9]|26214[0-4]),t=([1-9]|10),p=[1-8]\$[A-Za-z0-9+/]{11,86}\$[A-Za-z0-9+/]{22,86}|(\{ARGON2I\})?\$argon2i\$v=19\$m=([89]|[1-9][0-9]{1,4}|1[0-9]{5}|2[0-5][0-9]{4}|26[01][0-9]{3}|2620[0-9]{2}|2621[0-3][0-9]|26214[0-4]),t=([1-9]|10),p=[1-8]\$[A-Za-z0-9+/]{11,86}\$[A-Za-z0-9+/]{22,86}|)$'
          description: >
            Import an existing ARGON2ID, ARGON2I, BLF-CRYPT, SHA256-CRYPT or
            SHA512-CRYPT hash, with its Dovecot scheme prefix or as raw
            crypt(3) or PHC string. Mutually exclusive with password. bcrypt
            costs 4–14, SHA-crypt rounds 1000–1000000 and Argon2 v=19 with at
            most 256 MiB, 10 passes and 8 lanes are accepted. SHA-crypt and
            Argon2 are upgraded to bcrypt after a matching password proof,
            unless the password exceeds bcrypt's 72-byte limit. Weak schemes
            are refused. Never returned.

    Credential:
      type: object
      description: An app password, as its owner sees it. Never its secret or hash.
      required: [id, name, kind, public_id, created_at, last_used_at, expires_at]
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
          enum: [app_password]
        public_id:
          type: string
          description: The part of the app password after `rm_` and before the secret
          example: 7Kq2xT9bLm4P
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: When it was last used, to within a minute
        expires_at:
          type: [string, "null"]
          format: date-time

    CreatedAppPassword:
      allOf:
        - $ref: "#/components/schemas/Credential"
        - type: object
          required: [password]
          properties:
            password:
              type: string
              pattern: "^rm_[A-Za-z0-9]{12}_[A-Za-z0-9]{43}$"
              description: >
                The app password, shown this once. Use it with the mailbox's
                address as the password of a mail client, or with HTTP Basic.

    ScopedCapability:
      type: object
      description: A live session capability at a narrower domain or mailbox scope.
      required: [capability, scope]
      properties:
        capability:
          type: string
          description: A capability name, or `*` for all capabilities at this scope.
        scope:
          type: string
          description: "domain:<name> or mailbox:<address>; never widens to the installation"

    ScopedPermission:
      type: object
      description: One capability an API key may use, at a scope.
      required: [capability, scope]
      properties:
        capability:
          type: string
          description: A named capability, such as `mail:read`; never `*`
          example: "mail:read"
        scope:
          type: string
          description: "`*`, `domain:<name>` or `mailbox:<address>`; covers everything beneath it"
          example: "mailbox:robot@example.com"

    ServerLimits:
      type: object
      required: [contact_import_max_bytes]
      properties:
        contact_import_max_bytes:
          type: integer
          format: int64
          minimum: 1
          description: The largest contact import file, in bytes
          example: 10485760

    APIKey:
      type: object
      description: An API key, as its owner sees it. Never its secret or hash.
      required: [id, name, kind, public_id, created_at, last_used_at, expires_at, permissions]
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
          enum: [api_key]
        public_id:
          type: string
          description: The part of the key after `rmk_` and before the secret
          example: 9Hm3yU1cNp5Q
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: When it was last used, to within a minute
        expires_at:
          type: [string, "null"]
          format: date-time
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/ScopedPermission"

    CreatedAPIKey:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              pattern: "^rmk_[A-Za-z0-9]{12}_[A-Za-z0-9]{43}$"
              description: >
                The API key, shown this once. Send it as `Authorization:
                Bearer rmk_…`.

    PushDevices:
      type: object
      required: [platforms, devices]
      properties:
        platforms:
          type: array
          description: The push services this session can register a device with
          items:
            type: string
            enum: [apns, webpush]
        web_push_key:
          type: string
          description: >
            The VAPID public key (RFC 8292), base64url of its uncompressed
            P-256 point: the `applicationServerKey` a browser subscribes with.
            Present when `webpush` is among the platforms.
        devices:
          type: array
          items:
            $ref: "#/components/schemas/PushDevice"

    PushDevice:
      type: object
      description: >
        A phone or browser registered for push by a session. Never its token
        or keys.
      required: [id, platform, environment, created_at]
      properties:
        id:
          type: string
          description: Opaque; the `device` of the pushes it gets
          example: "12"
        platform:
          type: string
          enum: [apns, webpush]
        environment:
          type: string
          description: The APNs environment; empty for Web Push
          enum: [production, sandbox, ""]
        created_at:
          type: string
          format: date-time

    RegisterPushDeviceRequest:
      type: object
      required: [platform, token]
      properties:
        platform:
          type: string
          enum: [apns, webpush]
        token:
          type: string
          description: >
            For apns, the APNs device token, lowercase hex (64 to 200 digits).
            For webpush, the subscription's endpoint: an https URL of at most
            1024 characters.
          maxLength: 1024
        environment:
          type: string
          enum: [production, sandbox]
          default: production
          description: >
            APNs only. production for App Store and TestFlight builds, sandbox
            for builds run from Xcode: which APNs host the pushes go to.
        app_id:
          type: string
          description: APNs only. The app's bundle id; must be the server's APNs topic when given
          example: com.antimatterstudios.restmail
        keys:
          type: object
          description: >
            Web Push only, and required for it: the subscription's keys as
            `PushSubscription.toJSON()` gives them, base64url. Every push is
            encrypted to them (RFC 8291).
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
              description: The browser's P-256 public key, uncompressed (65 bytes)
            auth:
              type: string
              description: The 16-byte authentication secret

    LinkAccountRequest:
      type: object
      required: [address, password]
      properties:
        address:
          type: string
          format: email
          minLength: 1
          pattern: '\S'
        password:
          type: string
          format: password
          minLength: 1
        display_name:
          type: string
        totp_code:
          type: string
          description: A code from the account's authenticator, when it has two-factor authentication
        recovery_code:
          type: string
          description: One of the account's recovery codes, instead of totp_code; it is spent

    # ─────────────────────────────────────────────────────────────
    # Folder
    # ─────────────────────────────────────────────────────────────
    Folder:
      type: object
      required: [name, total, unread, role]
      properties:
        name:
          type: string
        total:
          type: integer
        unread:
          type: integer
        role:
          type: [string, "null"]
          enum: [inbox, sent, drafts, trash, junk, archive, null]
          description: >-
            What a standard folder is for: inbox (INBOX), sent (Sent), drafts (Drafts), trash (Trash),
            junk (Spam) or archive (Archive), the roles IMAP LIST gives as RFC 6154 special-use
            attributes (INBOX needs none); null for any other folder

    FolderName:
      type: object
      required: [name]
      properties:
        name:
          type: string

    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    RenameFolderRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    # ─────────────────────────────────────────────────────────────
    # Message
    # ─────────────────────────────────────────────────────────────
    Data-MessageSeal:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/MessageSeal'
      required:
      - data
      type: object
    Data-MessageRecipients:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/MessageRecipients'
      required:
      - data
      type: object
    Data-ThreadSnooze:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/ThreadSnooze'
      required:
      - data
      type: object

    MessageSeal:
      additionalProperties: false
      properties:
        algorithm:
          enum:
          - restmail-seal-v1
          type: string
        computed_hash:
          type: string
        sealed_hash:
          type: string
        state:
          enum:
          - intact
          - mismatch
          - not_sealed
          type: string
      required:
      - state
      - algorithm
      type: object
      description: A receipt integrity check, not sender authentication or a safety verdict. Historical
        messages without a seal are not mismatches.

    MessageRecipients:
      additionalProperties: false
      properties:
        message_id:
          type: integer
        recipients:
          items:
            $ref: '#/components/schemas/RecipientStatus'
          type: array
      required:
      - message_id
      - recipients
      type: object

    RecipientStatus:
      additionalProperties: false
      properties:
        address:
          examples:
          - bob@example.com
          type: string
        attempts:
          type: integer
        category:
          enum:
          - bad_mailbox
          - bad_domain
          - policy
          - other_permanent
          - mailbox_full
          - greylisted
          - rate_limited
          - connection
          - tls
          - dns
          - other_transient
          type: string
        delivery:
          enum:
          - remote
          - local
          type: string
        last_attempt_at:
          format: date-time
          type:
          - string
          - 'null'
        reason:
          type: string
        state:
          enum:
          - queued
          - retrying
          - delivered
          - failed
          - unknown
          type: string
      required:
      - address
      - delivery
      - state
      - attempts
      type: object
      description: 'One recipient''s copy of a sent message. The remote server''s own reply (the queue''s
        last_error and last_error_code) is withheld: it can carry details meant for the sending server, such
        as internal host names and addresses, so only the reason derived from its failure category is given.'

    ThreadSnooze:
      type: object
      additionalProperties: false
      required: [thread_id, snoozed_until]
      properties:
        thread_id:
          type: string
        snoozed_until:
          oneOf:
            - type: string
              format: date-time
            - type: "null"

    Message:
      type: object
      description: >-
        Public message metadata and bodies; raw source is served separately.
        An unloaded mailbox association is omitted rather than serialized as
        an empty mailbox.
      required: [class, id, mailbox_id, folder, sender, subject, is_read, is_flagged, is_starred, is_draft, is_deleted, received_at, created_at, updated_at]
      properties:
        class:
          type: string
          enum: [newsletter, receipt, notification, person]
          description: >-
            Derived on read from the stored headers or, when none are
            stored, the stored source's header section, and from the
            class a Sieve rule recorded at delivery, in this order.
            receipt: a Sieve rule added the imap4flags keyword $receipt;
            no header says a message is a receipt, so nothing else
            assigns this class. newsletter: otherwise valid List-Id or
            HTTP(S)/mailto List-Unsubscribe (list-shaped); notification:
            otherwise Auto-Submitted auto-generated/auto-replied or
            Precedence bulk/list/junk; person: otherwise, including
            malformed signals. Only newsletter may collapse; person must
            never be hidden. Mail delivered before Sieve rules could
            assign receipt has no recorded rule class and is not
            backfilled. Not an authenticity or safety verdict.
        is_answered:
          type: boolean
        id:
          type: integer
        mailbox_id:
          type: integer
        folder:
          type: string
        message_id:
          type: string
          description: RFC 2822 Message-ID header
        in_reply_to:
          type: string
        references:
          type: string
        thread_id:
          type: string
        due:
          format: date-time
          type:
          - string
          - 'null'
        due_source:
          enum:
          - user
          - rule
          - parsed
          - null
          type:
          - string
          - 'null'
        snoozed_until:
          format: date-time
          type:
          - string
          - 'null'
        awaiting_since:
          type: [string, "null"]
          format: date-time
          description: When the thread's last message came from this account. Absent when someone else wrote last. Derived on read
        sender:
          type: string
        sender_name:
          type: string
        recipients_to:
          description: The recipients' addresses.
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
        recipients_cc:
          description: The CC recipients' addresses.
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
        sealed_hash:
          type: string
          description: >-
            SHA-256 receipt seal using restmail-seal-v1 (docs/message-seals.md).
            Covers the exact stored source and displayed headers and bodies.
            Absent on historical unsealed messages. Does not authenticate the
            author or establish safety.
        headers:
          description: >-
            The message's header fields as it arrived, each name with its
            values; an empty array when none were recorded (mail sent from
            here, drafts).
          oneOf:
            - type: object
              additionalProperties:
                type: array
                items:
                  type: string
            - type: array
              maxItems: 0
            - type: "null"
        size_bytes:
          type: integer
        raw_size:
          type: integer
          description: >-
            Exact octet count of the stored raw RFC 2822 message (the size a
            protocol client receives when the raw form is served verbatim,
            e.g. IMAP RFC822.SIZE / POP3 LIST). 0 when the server holds no
            stored raw form; consumers should fall back to size_bytes.
        downgraded_size:
          type: integer
          description: >-
            Octet count of the stored raw message with its headers downgraded
            to ASCII (RFC 6857), as sent to a POP3 or IMAP client that has not
            enabled UTF-8. Equals raw_size when the headers are already ASCII.
            0 when not measured; consumers should fall back to raw_size.
        auth_results:
          type: array
          items:
            $ref: '#/components/schemas/AuthResult'
          description: >-
            The SPF, DKIM, ARC and DMARC verdicts this server reached at
            delivery. Omitted when it reached none, as on a sent message or a
            draft.
        auth_verdict:
          type: string
          enum: [signed, unsigned, mismatch]
          description: >-
            One state for the reader, derived from auth_results: signed,
            unsigned or mismatch. mismatch means DMARC failed; unsigned means
            nothing verified, which is not a failure. None of these says a
            message is safe.
        has_attachments:
          type: boolean
        is_read:
          type: boolean
        is_flagged:
          type: boolean
        is_starred:
          type: boolean
        is_draft:
          type: boolean
        is_deleted:
          type: boolean
        imap_deleted:
          type: boolean
        keywords:
          type: array
          items:
            type: string
        received_at:
          type: string
          format: date-time
        date_header:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateMessageRequest:
      type: object
      properties:
        imap_deleted:
          type: [boolean, "null"]
        keywords:
          type: [array, "null"]
          items:
            type: string
        is_answered:
          type:
          - boolean
          - 'null'
        is_read:
          type: boolean
        is_flagged:
          type: boolean
        is_starred:
          type: boolean
        folder:
          # The folder rule createFolder applies: a move makes the folder if there is none.
          type: string
          minLength: 1

    SendMessageRequest:
      type: object
      # No subject is a message with an empty Subject, as the handler sends it.
      required: [from, to]
      properties:
        on_behalf:
          type: boolean
          description: >-
            True selects mail:send_on_behalf on From's mailbox, with the actor's
            own address in RFC 5322 Sender. False or omitted selects mail:send_as
            for another mailbox, or mail:send for your own. Read access grants neither.
        from:
          type: string
          format: email
          minLength: 1
        to:
          type: array
          minItems: 1
          items:
            type: string
            format: email
        cc:
          type: array
          items:
            type: string
            format: email
        bcc:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
        in_reply_to:
          type: string
        scheduled_at:
          type: string
          format: date-time
          description: >-
            Send the message at this time instead of now (at least one
            minute ahead, and within a year). The response is 202 with the
            stored scheduled message, and the message is not sent until then.
            Omit it to send immediately.
        require_tls:
          type: boolean
          description: >-
            Require TLS on every hop, as SMTP's REQUIRETLS does (RFC 8689): the
            message goes only to a recipient host named by MTA-STS, over TLS
            with a verified certificate, that offers REQUIRETLS, and comes back
            to the sender as a failure otherwise. Omit it or send false for
            ordinary delivery.
        # Inline rather than a $ref: vertrag 0.29 validates each boundary probe
        # against the body schema without resolving a nested $ref, and drops
        # every probe of a body that has one (#388).
        list_unsubscribe:
          type: object
          description: >
            Where a recipient unsubscribes from this mail (RFC 2369, RFC 8058),
            published as the message's List-Unsubscribe field. You run the
            endpoint; the server never fetches or posts to it. With `https`, the
            message also carries `List-Unsubscribe-Post: List-Unsubscribe=One-Click`
            and both fields are DKIM signed; a sender domain with no DKIM key is
            refused with 422 `dkim_required` rather than sent with an unsigned
            one-click claim. With only `mailto`, there is no one-click field. Omit
            the object and the message carries neither field. A value with a line
            break, a space, a comma, an angle bracket or quote, or any other scheme
            is refused with 400, as is any key other than `mailto` and `https`.
          minProperties: 1
          additionalProperties: false
          properties:
            mailto:
              type: string
              format: email
              description: >
                A bare ASCII address (no display name, no `mailto:`, no query),
                published as `<mailto:address>`.
              example: unsubscribe@example.com
            https:
              type: string
              format: uri
              maxLength: 2048
              pattern: "^https://"
              description: >
                One absolute https URL with a host and no credentials, which
                unsubscribes the recipient when it receives the RFC 8058 one-click
                POST (body `List-Unsubscribe=One-Click`). It should identify the
                recipient and the list, as RFC 8058 §3.1 asks.
              example: https://example.com/unsubscribe?t=opaque-token

    ScheduledSend:
      type: object
      required: [id, account_id, from, to, subject, scheduled_at, status, created_at, updated_at]
      properties:
        id:
          type: integer
        account_id:
          type: integer
        from:
          type: string
          format: email
        to:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
        scheduled_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, sending, sent, failed, cancelled, held]
        attempts:
          type: integer
        sent_message_id:
          type: integer
          nullable: true
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ForwardMessageRequest:
      type: object
      required: [from, to]
      properties:
        on_behalf:
          type: boolean
          description: >-
            True selects mail:send_on_behalf on From's mailbox, with the actor's
            own address in RFC 5322 Sender. False or omitted selects mail:send_as
            for another mailbox, or mail:send for your own. Read access grants neither.
        from:
          type: string
          format: email
        to:
          type: array
          items:
            type: string
            format: email
        body_text:
          type: string

    # ─────────────────────────────────────────────────────────────
    # Draft
    # ─────────────────────────────────────────────────────────────
    DraftRequest:
      type: object
      properties:
        from:
          type: string
          format: email
        to:
          type: array
          items:
            type: string
            format: email
        cc:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
        in_reply_to:
          type: string
        references:
          type: string

    UpdateDraftRequest:
      type: object
      properties:
        from:
          type: string
          format: email
        to:
          type: array
          items:
            type: string
            format: email
        cc:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string

    # ─────────────────────────────────────────────────────────────
    # Quota
    # ─────────────────────────────────────────────────────────────
    QuotaInfo:
      type: object
      required: [quota_bytes, quota_used_bytes, message_count, percent_used]
      properties:
        quota_bytes:
          type: integer
          format: int64
        quota_used_bytes:
          type: integer
          format: int64
        message_count:
          type: integer
        percent_used:
          type: number
          format: float

    # ─────────────────────────────────────────────────────────────
    # Attachment
    # ─────────────────────────────────────────────────────────────
    Attachment:
      type: object
      required: [id, message_id, filename, content_type, size_bytes, checksum, created_at]
      properties:
        id:
          type: integer
        message_id:
          type: integer
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        checksum:
          type: string
          description: SHA-256 hex digest
        created_at:
          type: string
          format: date-time

    # ─────────────────────────────────────────────────────────────
    # Contact
    # ─────────────────────────────────────────────────────────────
    QuietHoursSetting:
      type: object
      required: [enabled, start, end, time_zone]
      properties:
        enabled:
          type: boolean
        start:
          type: string
          pattern: '^$|^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '22:00'
        end:
          type: string
          pattern: '^$|^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '08:00'
        time_zone:
          type: string
          format: iana-time-zone
          example: Europe/Berlin

    SetQuietHoursSetting:
      type: object
      required: [enabled, start, end, time_zone]
      anyOf:
        - properties:
            enabled:
              enum: [false]
        - required: [start, end, time_zone]
          properties:
            enabled:
              enum: [true]
            start:
              minLength: 5
            end:
              minLength: 5
            time_zone:
              minLength: 1
      properties:
        enabled:
          type: boolean
        start:
          type: string
          pattern: '^$|^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '22:00'
        end:
          type: string
          pattern: '^$|^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '08:00'
        time_zone:
          type: string
          format: iana-time-zone
          example: Europe/Berlin

    ContactReplyTimeSetting:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    Contact:
      type: object
      required: [id, mailbox_id, email, name, trust_level, source, created_at, updated_at]
      properties:
        usual_reply_seconds:
          type: [integer, "null"]
          format: int64
          minimum: 1
          example: 7200
          description: Median first-reply delay in seconds from this account's own history. Omitted when disabled or fewer than three matched replies exist. Not a signal from the contact.
        id:
          type: integer
        mailbox_id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        trust_level:
          type: string
          enum: [auto, trusted, blocked]
        source:
          type: string
          enum: [sent, manual, import]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateContactRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        name:
          type: string
          maxLength: 255
        trust_level:
          type: string
          enum: [auto, trusted, blocked]

    UpdateContactRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        trust_level:
          type: string
          enum: [auto, trusted, blocked]

    ImportContactsRequest:
      type: object
      required: [contacts]
      properties:
        contacts:
          type: array
          minItems: 1
          items:
            type: object
            required: [email]
            properties:
              email:
                type: string
                format: email
                maxLength: 255
              name:
                type: string
                maxLength: 255

    # ─────────────────────────────────────────────────────────────
    # Vacation
    # ─────────────────────────────────────────────────────────────
    VacationConfig:
      type: object
      required: [enabled, subject, body]
      # An enabled auto-reply needs something to send: setVacation refuses an
      # empty subject or body while enabled is true. Stated as anyOf with an
      # enum rather than if/then and const, so every JSON Schema draft reads
      # it the same: the contract tests' boundary probes judged an empty
      # subject valid under the if/then form (#388).
      anyOf:
        - properties:
            enabled:
              enum: [false]
        - properties:
            subject:
              minLength: 1
            body:
              minLength: 1
      properties:
        enabled:
          type: boolean
        subject:
          type: string
        body:
          type: string
        start_date:
          type: [string, "null"]
          format: date-time
        end_date:
          type: [string, "null"]
          format: date-time

    # ─────────────────────────────────────────────────────────────
    # Sieve
    # ─────────────────────────────────────────────────────────────
    SieveScript:
      type: object
      required: [id, mailbox_id, script, active, created_at, updated_at]
      properties:
        id:
          type: integer
        mailbox_id:
          type: integer
        script:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PutSieveRequest:
      type: object
      required: [script]
      properties:
        script:
          type: string
        active:
          type: boolean

    # ─────────────────────────────────────────────────────────────
    # Quarantine
    # ─────────────────────────────────────────────────────────────
    Quarantine:
      type: object
      required: [id, mailbox_id, sender, subject, body_preview, quarantine_reason, received_at, expires_at, released]
      properties:
        id:
          type: integer
        mailbox_id:
          type: integer
        sender:
          type: string
        subject:
          type: string
        body_preview:
          type: string
        spam_score:
          type: [number, "null"]
          format: float
        quarantine_reason:
          type: string
          description: >-
            Why the message was held: the reason code of the pipeline step
            that quarantined it, the same code its message trace records
            (dmarc_quarantine, spf_fail, dkim_fail, spam_threshold,
            virus_detected, header_invalid, custom_reject, other), or
            pipeline when no step is known.
          example: dmarc_quarantine
        received_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        released:
          type: boolean

    # ─────────────────────────────────────────────────────────────
    # Inbound / Gateway
    # ─────────────────────────────────────────────────────────────
    MailboxCheck:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
        mailbox_id:
          type: integer
        address:
          type: string
          format: email

    DeliverMessageRequest:
      type: object
      required: [address, sender]
      # A delivery names its mailbox by a nonzero mailbox_id or a nonempty
      # address; the binder refuses one naming neither.
      anyOf:
        - required: [mailbox_id]
          properties:
            mailbox_id:
              minimum: 1
        - required: [address]
          properties:
            address:
              minLength: 1
      properties:
        is_answered:
          type:
          - boolean
          - 'null'
        address:
          type: string
          pattern: '^[^\x00]*$'
          format: email
          description: Recipient address
        sender:
          type: string
          pattern: '^[^\x00]*$'
          format: email
        sender_name:
          type: string
          pattern: '^[^\x00]*$'
        recipients_to:
          type: array
          items:
            type: string
            format: email
        recipients_cc:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
          pattern: '^[^\x00]*$'
        body_text:
          type: string
          pattern: '^[^\x00]*$'
        body_html:
          type: string
          pattern: '^[^\x00]*$'
        message_id:
          type: string
          pattern: '^[^\x00]*$'
        in_reply_to:
          type: string
          pattern: '^[^\x00]*$'
        references:
          type: string
          pattern: '^[^\x00]*$'
        raw_message:
          type: string
          format: byte
          description: >-
            Full RFC 2822 raw message, base64-encoded. Encoding it as base64
            (rather than a plain JSON string) lets arbitrary non-UTF-8 octets
            (8bit/binary bodies, undeclared-charset high bytes) round-trip
            byte-for-byte, preserving DKIM body hashes and BODY[] fidelity.
        client_ip:
          type: string
          pattern: '^[^\x00]*$'
        helo_name:
          type: string
          pattern: '^[^\x00]*$'
        require_tls:
          type: boolean
          description: >-
            The message arrived with REQUIRETLS (RFC 8689 §4.1): a copy REST Mail
            sends on, such as a Sieve redirect, goes with TLS required too.

    # ─────────────────────────────────────────────────────────────
    # RESTMAIL Protocol
    # ─────────────────────────────────────────────────────────────
    RestmailCapabilities:
      type: object
      required: [protocol, version, features]
      properties:
        protocol:
          type: string
          example: RESTMAIL
        version:
          type: string
          example: "1.0"
        features:
          type: array
          items:
            type: string

    RestmailMailboxCheck:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
        address:
          type: string
          format: email

    RestmailDeliverRequest:
      type: object
      description: >-
        Recipients come from a non-empty to list, otherwise a non-empty
        recipients list, otherwise the To header parsed from raw_message.
        A raw message must contain a parseable To header when neither list
        supplies recipients; an empty or missing recipient set is refused.
      anyOf:
        - required: [to]
          properties:
            to:
              minItems: 1
        - required: [recipients]
          properties:
            recipients:
              minItems: 1
        - required: [raw_message]
          properties:
            raw_message:
              minLength: 1
      properties:
        from:
          type: string
          format: email
        to:
          type: [array, "null"]
          items:
            type: string
            format: email
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
        message_id:
          type: string
        date:
          type: string
          description: The Date header (RFC 5322); the inbound pipeline rejects a message without one
        in_reply_to:
          type: string
        references:
          type: string
        headers:
          type: object
          description: Raw headers as JSON
        raw_message:
          type: string
          description: Full RFC 2822 raw message
        sender:
          type: string
          format: email
          description: Alias for 'from'
        recipients:
          type: [array, "null"]
          items:
            type: string
            format: email
          description: Alias for 'to'

    RestmailDeliverResponse:
      type: object
      required: [delivered, failed]
      properties:
        delivered:
          type: array
          items:
            type: string
            format: email
        failed:
          type: array
          items:
            type: string
            format: email

    # ─────────────────────────────────────────────────────────────
    # Domain
    # ─────────────────────────────────────────────────────────────
    Domain:
      type: object
      required: [id, name, server_type, active, default_quota_bytes, sending_policy, dmarc_policy, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        server_type:
          type: string
          enum: [traditional, restmail]
        active:
          type: boolean
        default_quota_bytes:
          type: integer
          format: int64
        dkim_selector:
          type: string
        sending_policy:
          $ref: "#/components/schemas/DomainSendingPolicy"
        dmarc_policy:
          $ref: "#/components/schemas/DomainDMARCPolicy"
        outbound_stop:
          description: Present only while the domain's outbound mail is stopped
          oneOf:
            - $ref: "#/components/schemas/DomainOutboundStop"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DomainOutboundStop:
      description: An operator's stop on a domain's outbound mail (#1590). The domain's mail is queued and held while it stands.
      type: object
      additionalProperties: false
      required: [stopped_at, stopped_by, reason]
      properties:
        stopped_at:
          type: string
          format: date-time
        stopped_by:
          type: string
          description: The address of the account that made the stop
        reason:
          type: string

    CreateDomainRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          format: idn-hostname
          pattern: '\.'
        server_type:
          type: [string, "null"]
          enum: [traditional, restmail, "", null]
          default: traditional
          description: Omitted, empty or null selects traditional.
        default_quota_bytes:
          type: integer
          format: int64
          minimum: 0
        sending_policy:
          # vertrag 0.29 drops body probes when a property contains a $ref.
          # Keep this enum in step with DomainSendingPolicy.
          type: string
          enum: ["", transactional, bulk]
          description: Sending policy for this domain; empty means no rule.
        dmarc_policy:
          # Inline, as sending_policy is; keep it in step with DomainDMARCPolicy.
          type: [string, "null"]
          enum: [none, quarantine, reject, null]
          default: none
          description: The domain's DMARC policy (DomainDMARCPolicy); omitted or null is none.

    UpdateDomainRequest:
      type: object
      properties:
        active:
          type: boolean
        default_quota_bytes:
          type: integer
          format: int64
          minimum: 0
        # Inline rather than a $ref to DomainSendingPolicy: vertrag 0.29
        # validates each boundary probe against the body schema without
        # resolving a nested $ref, and drops every probe of a body that has
        # one (#388).
        sending_policy:
          type: string
          enum: ["", transactional, bulk]
          description: The domain's sending policy (DomainSendingPolicy); `""` clears it.
        dmarc_policy:
          type: [string, "null"]
          enum: [none, quarantine, reject, null]
          description: The domain's DMARC policy (DomainDMARCPolicy); omitted or null leaves it.

    DomainDMARCPolicy:
      type: string
      enum: [none, quarantine, reject]
      description: >
        The p= of the domain's DMARC record (RFC 9989 §4.7), as `restmail-api
        dns` prints it: what receivers are asked to do with mail from the
        domain that fails DMARC. A domain starts at `none`, which changes no
        one's delivery and brings the aggregate reports in. RFC 9989 §7.4 asks
        a domain whose users write ordinary mail to read a month of reports at
        `none`, then a month at `quarantine`, before moving to `reject`, and
        not to publish `reject` at all when its users post to mailing lists.

    DomainSendingPolicy:
      type: string
      enum: ["", transactional, bulk]
      description: >
        What the send API expects of the domain's mail (RFC 2369, RFC 8058).
        `transactional`: mail one person asked for, such as receipts and
        password resets; it carries no List-Unsubscribe field, so a send with
        `list_unsubscribe` is refused with 422 `list_unsubscribe_not_allowed`.
        `bulk`: mail sent to a list, which receivers such as Gmail and Yahoo
        expect to say how to unsubscribe; a send without `list_unsubscribe` is
        refused with 422 `list_unsubscribe_required`. Empty: no rule, either is
        sent. The policy applies to the send API; SMTP submission, draft send
        and forward are not checked.

    # ─────────────────────────────────────────────────────────────
    # Mailbox
    # ─────────────────────────────────────────────────────────────
    Mailbox:
      type: object
      description: >
        An account, as the admin API shows it: a mailbox is the account. Its
        passwords, authenticators and app passwords are its credentials,
        never shown here; what it may do is its grants (/api/v1/admin/grants).
        The optional domain association is included only when loaded and readable
        by the session. Optional quota_usage includes persisted usage; its mailbox
        back-reference is omitted when not loaded. Unloaded associations are absent.
      required: [id, domain_id, local_part, address, display_name, quota_bytes, quota_used_bytes, active, password_change_required, two_factor_required, created_at, updated_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        local_part:
          type: string
        address:
          type: string
          format: email
        display_name:
          type: string
        quota_bytes:
          type: integer
          format: int64
        quota_used_bytes:
          type: integer
          format: int64
        active:
          type: boolean
        last_login_at:
          type: [string, "null"]
          format: date-time
        password_change_required:
          type: boolean
          description: In setup until it chooses its own password (the bootstrap account)
        two_factor_required:
          type: boolean
          description: In setup until it enrolls an authenticator, which it may never disable
        last_password_change:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateMailboxRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          minLength: 12
        display_name:
          type: string
        quota_bytes:
          type: integer
          format: int64
          description: Storage cap in bytes. Non-positive values inherit for an owned account, otherwise unlimited. A positive cap above the owner's live ceiling is refused with 422.
        active:
          type: boolean

    # ─────────────────────────────────────────────────────────────
    # Alias
    # ─────────────────────────────────────────────────────────────
    Alias:
      type: object
      description: >-
        The optional domain association is included only when loaded and readable
        with domains:read. Redacted or unloaded domains are omitted, and private
        DKIM keys have no public field.
      required: [id, domain_id, source_address, destination_address, active, created_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        source_address:
          type: string
          format: idn-email
        destination_address:
          type: string
          description: Remote address retaining its submitted display name, quoting and internationalized spelling
        active:
          type: boolean
        created_at:
          type: string
          format: date-time

    CreateAliasRequest:
      type: object
      required: [source_address, destination_address]
      properties:
        source_address:
          type: string
          format: email
        destination_address:
          type: string
          format: email

    UpdateAliasRequest:
      type: object
      properties:
        destination_address:
          type: string
          format: email
        active:
          type: boolean

    # ─────────────────────────────────────────────────────────────
    # Pipeline
    # ─────────────────────────────────────────────────────────────
    Pipeline:
      type: object
      required: [id, domain_id, direction, filters, active, created_at, updated_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        direction:
          type: string
          enum: [inbound, outbound]
        filters:
          description: Ordered array of filter configurations
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              config:
                type: object
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreatePipelineRequest:
      type: object
      required: [domain_id, direction, filters]
      properties:
        domain_id:
          type: integer
        direction:
          type: string
          enum: [inbound, outbound]
        filters:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              config:
                type: object
        active:
          type: boolean
          default: true

    UpdatePipelineRequest:
      type: object
      properties:
        filters:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              config:
                type: object
        active:
          type: boolean

    TestPipelineRequest:
      type: object
      required: [pipeline_id, email]
      properties:
        pipeline_id:
          type: integer
          minimum: 1
        email:
          type: object
          description: Sample email JSON for testing

    TestFilterRequest:
      type: object
      required: [filter_name, config, email]
      properties:
        filter_name:
          type: string
          minLength: 1
        config:
          type: object
        email:
          type: object
          description: Sample email JSON for testing

    ExecutionResult:
      type: object
      required: [final_action, steps, duration_ms]
      properties:
        final_action:
          type: string
          enum: [continue, reject, quarantine, discard]
        steps:
          type: array
          items:
            type: object
        duration_ms:
          type: integer
          format: int64
        final_email:
          type: object
          description: The email after all transformations
        auth_results:
          type: array
          description: >-
            The verdicts the authentication filters (spf_check, dkim_verify,
            arc_verify, dmarc_check) recorded, in order. A delivered message's
            Authentication-Results header is written from these.
          items:
            $ref: "#/components/schemas/AuthResult"

    AuthResult:
      type: object
      required: [method, result]
      properties:
        method:
          type: string
          enum: [spf, dkim, arc, dmarc]
        result:
          type: string
          description: The RFC 8601 result, such as pass, fail, softfail, neutral, none, temperror or permerror
        property:
          type: string
          enum: [smtp.mailfrom, smtp.helo, header.d, header.from]
          description: The identity checked. Absent for arc.
        domain:
          type: string
          description: >-
            The domain checked. For dkim, the signature's d=; for arc, the most
            recent ARC-Seal's d=.

    FilterResult:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [continue, reject, quarantine, discard]
        email:
          type: object
          description: The email after filter transformation
        metadata:
          type: object

    # ─────────────────────────────────────────────────────────────
    # Custom Filter
    # ─────────────────────────────────────────────────────────────
    CustomFilter:
      type: object
      required: [id, domain_id, name, filter_type, direction, config, enabled, created_at, updated_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        name:
          type: string
        description:
          type: string
        filter_type:
          type: string
          enum: [action, transform]
        direction:
          type: string
          enum: [inbound, outbound, both]
        config:
          type: object
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateCustomFilterRequest:
      type: object
      required: [domain_id, name, filter_type, direction, config]
      properties:
        domain_id:
          type: integer
        name:
          type: string
        description:
          type: string
        filter_type:
          type: string
          enum: [action, transform]
        direction:
          type: string
          enum: [inbound, outbound, both]
        config:
          type: object
        enabled:
          type: boolean
          default: true

    # ─────────────────────────────────────────────────────────────
    # Outbound Queue
    # ─────────────────────────────────────────────────────────────
    OutboundQueue:
      type: object
      required: [id, sender, recipient, domain, status, attempts, next_attempt, max_retries, created_at, expires_at]
      properties:
        id:
          type: integer
        message_id:
          type: [integer, "null"]
        sender:
          type: string
        recipient:
          type: string
        domain:
          type: string
        status:
          type: string
          enum: [pending, delivering, deferred, delivered, bounced, expired]
        attempts:
          type: integer
        last_attempt:
          type: [string, "null"]
          format: date-time
        next_attempt:
          type: string
          format: date-time
        last_error:
          type: string
        last_error_code:
          type: integer
        failure_category:
          type: string
          enum: ["", bad_mailbox, bad_domain, policy, other_permanent, mailbox_full, greylisted, rate_limited, connection, tls, dns, other_transient]
          description: >-
            What kind of failure the last attempt was, classified from the
            remote's reply; empty until an attempt fails. bad_mailbox,
            bad_domain, policy and other_permanent bounce the message at once.
            The others are transient: each is retried on a schedule of its own
            until a maximum age, then the message bounces.
        max_retries:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    QueueStats:
      type: object
      required: [pending, deferred, delivered, bounced, total]
      properties:
        pending:
          type: integer
        deferred:
          type: integer
        delivered:
          type: integer
        bounced:
          type: integer
        total:
          type: integer

    BulkQueueRequest:
      type: object
      description: >-
        Select entries by IDs (which take precedence) or by a filter. Nonempty
        filter fields are combined with AND. At least one ID or a filter object
        is required; an explicit empty filter object selects all entries (subject
        to the action's status eligibility). A supplied filter must be an object,
        never null, even when IDs are also supplied; null is refused with 422
        before queue access. At most 1000 IDs may be supplied, including when a
        filter is also present.
      anyOf:
        - required: [ids]
          properties:
            ids:
              minItems: 1
        - required: [filter]
      properties:
        ids:
          type: array
          maxItems: 1000
          items:
            type: integer
            minimum: 0
        filter:
          type: object
          description: Filter criteria to select entries (alternative to ids)
          properties:
            status:
              type: string
            domain:
              type: string
            sender:
              type: string
              description: Case-insensitive literal substring of the sender address, as in the queue list
            recipient:
              type: string
              description: Case-insensitive literal substring of the recipient address, as in the queue list

    BulkQueueResponse:
      type: object
      required: [affected]
      properties:
        affected:
          type: integer

    # ─────────────────────────────────────────────────────────────
    # Sender Rules
    # ─────────────────────────────────────────────────────────────
    DomainSenderRule:
      type: object
      required: [id, domain_id, pattern, list_type, created_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        pattern:
          type: string
          description: Email address or @domain pattern
        list_type:
          type: string
          enum: [allow, block]
        reason:
          type: string
        created_by:
          type: [integer, "null"]
        created_at:
          type: string
          format: date-time

    Suppression:
      type: object
      required: [id, domain_id, address, reason, failure_category, created_at, updated_at, expires_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
          description: The sending domain
        address:
          type: string
          description: The suppressed recipient, lower-cased
        reason:
          type: string
          enum: [hard_bounce]
        failure_category:
          type: string
          enum: [bad_mailbox, bad_domain]
          description: How the bounce that suppressed the address was classified
        last_error:
          type: string
          description: The failure that suppressed the address, with the remote's reply
        message_id:
          type: [integer, "null"]
          description: The sent message whose bounce suppressed the address
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: When the address last bounced
        expires_at:
          type: string
          format: date-time
          description: When the address stops being suppressed

    CreateSenderRuleRequest:
      type: object
      required: [pattern]
      properties:
        pattern:
          type: string
          minLength: 1
          description: "Email address (spam@evil.com) or domain pattern (@evil.com)"
        reason:
          type: string

    InstallationSenderRule:
      type: object
      required: [id, pattern, list_type, created_at]
      properties:
        id:
          type: integer
        pattern:
          type: string
          description: Email address or @domain pattern
        list_type:
          type: string
          enum: [allow, block]
        reason:
          type: string
        created_by:
          type: [integer, "null"]
        created_at:
          type: string
          format: date-time

    CreateInstallationSenderRuleRequest:
      type: object
      required: [pattern, list_type]
      properties:
        pattern:
          type: string
          minLength: 1
          description: "Email address (spam@evil.com) or domain pattern (@evil.com)"
        list_type:
          type: string
          enum: [allow, block]
        reason:
          type: string

    # ─────────────────────────────────────────────────────────────
    # DKIM
    # ─────────────────────────────────────────────────────────────
    DKIMEntry:
      type: object
      description: >
        Current configured signing key for a domain, including domains not yet
        serving mail. No private key material is returned. Algorithm and size
        are not stored. Legacy key installation times are unknown, not inferred
        from domain timestamps.
      required: [domain_id, domain, selector, has_key, created_at, age_seconds]
      properties:
        domain_id:
          type: integer
          example: 1
        domain:
          type: string
          example: example.com
        selector:
          type: string
          example: mail
        has_key:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          nullable: true
          description: When the current key was installed; null for legacy keys with unknown age. Re-saving the same PEM preserves this value.
          example: "2026-10-01T12:00:00Z"
        age_seconds:
          type: number
          format: double
          nullable: true
          minimum: 0
          description: Seconds since installation at response time, clamped to zero for future timestamps; null when created_at is unknown.
          example: 86400
      examples:
        - domain_id: 1
          domain: example.com
          selector: mail
          has_key: true
          created_at: "2026-10-01T12:00:00Z"
          age_seconds: 86400
        - domain_id: 2
          domain: legacy.example.com
          selector: old
          has_key: true
          created_at: null
          age_seconds: null

    DKIMRotationSettings:
      type: object
      required: [domain_id, rotation_interval_days, state, staged, previous]
      properties:
        domain_id:
          type: integer
          example: 1
        rotation_interval_days:
          type: integer
          minimum: 0
          maximum: 3650
          description: Requested key lifetime in 24-hour days; zero disables rotation. Defaults to zero for new and existing domains. The rotation worker stages a new key when it is due, waits for its record to resolve, moves signing to it one TTL later, and retires the previous key.
          example: 90
        state:
          type: string
          enum: [awaiting_publication, retiring, stable, waiting_ttl]
          description: >-
            stable: no rotation under way. awaiting_publication: a staged key whose
            record has not resolved yet. waiting_ttl: published, and waiting one TTL
            before signing moves to it. retiring: signing has moved, and the previous
            key's record stays until it retires, then carries an empty p= for one
            more TTL after the revocation resolves before removal. revoked_at,
            revocation_published_at and removes_after appear as those steps
            complete; the state stays retiring.
        staged:
          description: The key signing moves to next; null when there is none.
          type: ["null", "object"]
          additionalProperties: false
          required: [selector, record_name, record_value, published_at]
          properties:
            selector:
              type: string
            record_name:
              type: string
              description: The TXT record's name, `<selector>._domainkey.<domain>` in A-label form.
            record_value:
              type: string
              description: The TXT record's value; an empty p= revokes a previous key. Empty when an unrevoked stored key cannot be read.
            published_at:
              type: ["null", "string"]
              format: date-time
              description: When the record was first seen to resolve; null until then.
            activates_at:
              type: ["null", "string"]
              format: date-time
              description: For a published staged key, when signing moves to it.
            retire_after:
              type: ["null", "string"]
              format: date-time
              description: For the previous key, when its public key is replaced by an empty p=.
            revoked_at:
              type: ["null", "string"]
              format: date-time
              description: When the previous record changed to an empty p= revocation; absent before revocation.
            removes_after:
              type: ["null", "string"]
              format: date-time
              description: When the revoked record can be removed, one TTL after revocation_published_at; absent until the revocation resolves.
            revocation_published_at:
              type: ["null", "string"]
              format: date-time
              description: When the empty p= record was first seen to resolve; absent until then.
        previous:
          description: The key signing moved from; null when there is none.
          type: ["null", "object"]
          additionalProperties: false
          required: [selector, record_name, record_value, published_at]
          properties:
            selector:
              type: string
            record_name:
              type: string
              description: The TXT record's name, `<selector>._domainkey.<domain>` in A-label form.
            record_value:
              type: string
              description: The TXT record's value; an empty p= revokes a previous key. Empty when an unrevoked stored key cannot be read.
            published_at:
              type: ["null", "string"]
              format: date-time
              description: When the record was first seen to resolve; null until then.
            activates_at:
              type: ["null", "string"]
              format: date-time
              description: For a published staged key, when signing moves to it.
            retire_after:
              type: ["null", "string"]
              format: date-time
              description: For the previous key, when its public key is replaced by an empty p=.
            revoked_at:
              type: ["null", "string"]
              format: date-time
              description: When the previous record changed to an empty p= revocation; absent before revocation.
            removes_after:
              type: ["null", "string"]
              format: date-time
              description: When the revoked record can be removed, one TTL after revocation_published_at; absent until the revocation resolves.
            revocation_published_at:
              type: ["null", "string"]
              format: date-time
              description: When the empty p= record was first seen to resolve; absent until then.

    SetDKIMKeyRequest:
      type: object
      required: [selector, private_key]
      properties:
        selector:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*$'
          description: A DNS name; the key's record is `<selector>._domainkey.<domain>`
        private_key:
          type: string
          minLength: 1
          description: >
            PEM-encoded private key: RSA of at least 2048 bits (PKCS#1 or
            PKCS#8), or Ed25519 (PKCS#8)

    # ─────────────────────────────────────────────────────────────
    # Certificate
    # ─────────────────────────────────────────────────────────────
    Certificate:
      type: object
      required: [id, domain_id, issuer, not_before, not_after, auto_renew, created_at, updated_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        issuer:
          type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        auto_renew:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CertificateDetail:
      allOf:
        - $ref: "#/components/schemas/Certificate"
        - type: object
          required: [cert_pem]
          properties:
            cert_pem:
              type: string
              description: PEM-encoded certificate

    CreateCertificateRequest:
      type: object
      required: [domain_id, cert_pem, key_pem]
      properties:
        domain_id:
          type: integer
        cert_pem:
          type: string
          description: PEM-encoded certificate
        key_pem:
          type: string
          description: PEM-encoded private key
        auto_renew:
          type: boolean

    # ─────────────────────────────────────────────────────────────
    # Ban
    # ─────────────────────────────────────────────────────────────
    Ban:
      type: object
      required: [id, ip, reason, protocol, created_by, created_at]
      properties:
        id:
          type: integer
        ip:
          type: string
        reason:
          type: string
        protocol:
          type: string
          enum: [smtp, imap, pop3, all]
        created_by:
          type: string
        expires_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateBanRequest:
      type: object
      required: [ip, protocol, created_by]
      properties:
        ip:
          type: string
          minLength: 1
        reason:
          type: string
        protocol:
          type: string
          enum: [smtp, imap, pop3, all]
        duration:
          type: string
          pattern: '^[+-]?(0|(([0-9]+(\.[0-9]*)?|\.[0-9]+)(ns|us|µs|μs|ms|s|m|h))+)$'
          description: Go duration string (e.g. "24h", "168h"), omit for permanent
        created_by:
          type: string

    # ─────────────────────────────────────────────────────────────
    # Activity Log
    # ─────────────────────────────────────────────────────────────
    AuditEntry:
      type: object
      description: >-
        One entry of the audit log. `hash` is hex SHA-256 over the JSON array
        `["restmail-audit-v1", seq, occurred_at (RFC 3339, nanoseconds, UTC),
        actor_kind, actor_id, actor_name, credential_id, session_id, action,
        outcome, error_code, method, route, status, target, ip, user_agent,
        request_id, prev_hash]`, as Go's encoding/json writes it with HTML
        escaping off and no trailing newline (target's keys sorted).
      required: [seq, occurred_at, actor_kind, actor_id, actor_name, credential_id, session_id,
        action, outcome, error_code, method, route, status, target, ip, user_agent, request_id,
        prev_hash, hash]
      properties:
        seq:
          type: integer
          format: int64
          description: 1, 2, 3, … with no gaps
        occurred_at:
          type: string
          format: date-time
        actor_kind:
          type: string
          enum: [account, system, anonymous]
          description: >-
            A sign-in names the account it was for even when it fails;
            actor_id is set only once the account is proven.
        actor_id:
          type: [integer, "null"]
          description: The account (mailbox) id
        actor_name:
          type: string
          description: The account's address at the time
        credential_id:
          type: [integer, "null"]
          description: >
            The credential a request was made with over HTTP Basic (an app
            password, or the account's password through a gateway), or the one
            refused when its secret matched; null for a session
        session_id:
          type: string
          description: The jti of the token the request carried
        action:
          type: string
          example: admin.change
        outcome:
          type: string
          enum: [success, denied, failed, error]
          description: 2xx success; 401, 403 and 429 denied; other 4xx failed; 5xx error
        error_code:
          type: string
          description: The error response's `error.code`, if any
        method:
          type: string
        route:
          type: string
          example: /api/v1/admin/domains/{id}
        status:
          type: integer
        target:
          type: object
          additionalProperties:
            type: string
          description: The route's URL parameters, and for account linking the address
        ip:
          type: string
        user_agent:
          type: string
        request_id:
          type: string
        prev_hash:
          type: string
          description: The previous entry's hash; 64 zeros for the first
        hash:
          type: string

    AuditVerifyResult:
      type: object
      required: [ok, checked, first_seq, last_seq, last_hash]
      properties:
        ok:
          type: boolean
        checked:
          type: integer
          format: int64
          description: How many entries held
        first_seq:
          type: integer
          format: int64
        last_seq:
          type: integer
          format: int64
          description: The last entry that held
        last_hash:
          type: string
          description: Its hash; 64 zeros when the log is empty
        broken_at_seq:
          type: integer
          format: int64
          description: The first entry that does not hold
        reason:
          type: string
          description: Why it does not hold
        note:
          type: string
          description: Set when the log does not start at seq 1
        anchor:
          type: object
          description: The anchor the log was checked against, when one was given
          required: [seq, hash]
          properties:
            seq:
              type: integer
              format: int64
            hash:
              type: string

    # ─────────────────────────────────────────────────────────────
    # Generic helpers
    # ─────────────────────────────────────────────────────────────
    StatusResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              example: reset_complete

    # ─────────────────────────────────────────────────────────────
    # Calendar
    # ─────────────────────────────────────────────────────────────
    CalendarEventSummary:
      type: object
      required: [uid, method, status, summary, sequence, is_cancelled, versions]
      properties:
        uid:
          type: string
        method:
          type: string
          description: iCalendar METHOD (REQUEST, REPLY, CANCEL, ...)
        status:
          type: string
        summary:
          type: string
        sequence:
          type: integer
        is_cancelled:
          type: boolean
        message_id:
          type: [integer, "null"]
        versions:
          type: integer
          description: Number of stored versions for this UID

    # ─────────────────────────────────────────────────────────────
    # Admin: Dashboard stats
    # ─────────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [domainCount, mailboxCount, queueStats, messageVolume, recentActivity, inboundTransportSecurity]
      properties:
        domainCount:
          type: integer
        mailboxCount:
          type: integer
        queueStats:
          type: object
          required: [pending, processing, failed]
          properties:
            pending:
              type: integer
            processing:
              type: integer
            failed:
              type: integer
        messageVolume:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                example: Jul 23
              count:
                type: integer
        recentActivity:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
              description:
                type: string
              timestamp:
                type: string
                format: date-time
        inboundTransportSecurity:
          type: object
          properties:
            totalInboundMX:
              type: integer
            overTLS:
              type: integer
            plaintext:
              type: integer
            tlsPercent:
              type: number
            plaintextPercent:
              type: number
            plaintextAuthPass:
              type: integer
            plaintextAuthFail:
              type: integer

    # ─────────────────────────────────────────────────────────────
    # Admin: Roles, capabilities, grants
    # ─────────────────────────────────────────────────────────────
    Grant:
      type: object
      required: [id, holder, role, role_id, scope, mode, granted_by, granted_at]
      properties:
        id:
          type: integer
        holder:
          type: object
          required: [kind, id]
          properties:
            kind:
              type: string
              description: "`admin` for now; other kinds of holder come later"
              example: admin
            id:
              type: integer
        role:
          type: string
          example: admin
        role_id:
          type: integer
        scope:
          type: string
          description: "`*`, `domain:<name>` or `mailbox:<address>`; covers everything beneath it"
          example: domain:example.com
        mode:
          type: string
          enum: [active, eligible]
        granted_by:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [account, system]
              description: An account's grant names the account that made it; the bootstrap admin's is the system's.
            id:
              type: [integer, "null"]
        granted_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        activation:
          description: The activation running now, of an eligible grant switched on; null otherwise.
          oneOf:
            - $ref: "#/components/schemas/GrantActivation"
            - type: "null"

    GrantActivation:
      type: object
      required: [id, activated_at, expires_at, reason, seconds_left]
      properties:
        id:
          type: integer
        activated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        reason:
          type: string
        seconds_left:
          type: integer

    GrantEscalation:
      type: object
      required: [grant, capabilities]
      properties:
        grant:
          $ref: "#/components/schemas/Grant"
        scoped_capabilities:
          type: array
          description: >
            Active domain/mailbox capabilities, separate from the legacy global
            capabilities array. UI snapshot only; the API checks live grants on
            every request. Empty while account setup is unfinished.
          items:
            $ref: "#/components/schemas/ScopedCapability"
        capabilities:
          type: array
          description: What the caller now holds at `*`, as sign-in lists it.
          items:
            type: string

    FreshSecondFactor:
      type: object
      description: One of the two, given just now.
      properties:
        totp_code:
          type: string
          description: A current code from the caller's authenticator
          example: "123456"
        recovery_code:
          type: string
          description: An unused recovery code, used up if it works

    ActivateGrantRequest:
      allOf:
        - $ref: "#/components/schemas/FreshSecondFactor"
        - type: object
          required: [reason]
          properties:
            reason:
              type: string
              maxLength: 500
              description: Why you are switching it on; recorded in the audit log
              example: Add an admin for the new office
            minutes:
              type: integer
              minimum: 1
              maximum: 240
              default: 60

    CreateGrantRequest:
      type: object
      required: [holder, role, scope]
      properties:
        holder:
          type: object
          required: [kind, id]
          properties:
            kind:
              type: string
              enum: [account]
            id:
              type: integer
        role:
          type: string
          description: A role name, e.g. `admin` or `readonly`
        scope:
          type: string
          example: domain:example.com
        mode:
          type: string
          enum: [active, eligible]
          default: active
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Optional; must be in the future

    ServerCapabilities:
      type: object
      required: [capabilities, source]
      properties:
        capabilities:
          type: array
          items:
            type: string
          example: [mail:read, mail:send]
        source:
          type: string
          enum: [database, environment]
          description: environment while RESTMAIL_SERVER_CAPABILITIES sets the ceiling

    UpdateServerCapabilitiesRequest:
      type: object
      required: [capabilities]
      properties:
        capabilities:
          type: array
          items:
            type: string
          description: Every capability the installation permits; [] for none
          example: [mail:read, mail:send]

    Role:
      type: object
      required: [id, name, capabilities]
      properties:
        id:
          type: integer
        name:
          type: string
          description: superadmin, admin, readonly, owner, or one made later
        description:
          type: string
        system_role:
          type: boolean
        capabilities:
          type: array
          items:
            type: string

    Capability:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
          example: domains:read
        description:
          type: string
        resource:
          type: string
          example: domains
        action:
          type: string
          example: read

    # ─────────────────────────────────────────────────────────────
    # Admin: DNS check
    # ─────────────────────────────────────────────────────────────
    DNSCheckResult:
      type: object
      required: [domain, records, summary]
      properties:
        domain:
          type: string
        summary:
          type: string
          example: 4/5 records verified
        records:
          type: array
          items:
            type: object
            required: [type, name, status]
            properties:
              type:
                type: string
                example: MX
              name:
                type: string
              status:
                type: string
                enum: [ok, missing, different, error]
              value:
                type: string
              expected:
                type: string
                description: >-
                  The value to publish at name. On a DKIM record, the public half of
                  the key the domain signs with, "v=DKIM1; k=<rsa|ed25519>;
                  p=<base64 public key>". Absent when the domain has nothing to publish
                  here or the server cannot say what it should be. No private key
                  material is ever answered with.
                example: "v=DKIM1; k=ed25519; p=11qYAYKxCrfVS/7TyWQHOg7hcvPapiMlrwIaaPcHURo="
              message:
                type: string
              problem:
                type: string
                description: On a DKIM record that is not ok, what differs from expected.
                enum: [missing, malformed, different_key_type, different_key, more_than_one, key_unreadable]

    # ─────────────────────────────────────────────────────────────
    # Admin: MTA-STS
    # ─────────────────────────────────────────────────────────────
    DomainRelay:
      type: object
      required: [domain_id, transport, password_set]
      properties:
        domain_id:
          type: integer
        transport:
          type: string
          enum: [direct, relay]
        host:
          type: string
          description: Relay host name or IP address (relay only)
        port:
          type: integer
          minimum: 1
          maximum: 65535
        tls_mode:
          type: string
          enum: [starttls, implicit]
        username:
          type: string
          description: SMTP AUTH username; absent when the relay takes no AUTH
        password_set:
          type: boolean
          description: Whether a relay password is stored. The password itself is never returned.

    SetDomainRelayRequest:
      type: object
      required: [transport]
      # A relay needs somewhere to dial: setDomainRelay refuses one without
      # its host, port and TLS mode. Stated as anyOf with an enum, which
      # draft-04 and 2020-12 validators read alike (if/then is 2019-09+).
      anyOf:
        - properties:
            transport:
              enum: [direct]
        - required: [host, port, tls_mode]
          properties:
            # models.RelayHostPattern: a DNS name, or an IPv6 address as
            # net.ParseIP reads one (an IPv4 address is a DNS name to it).
            host:
              maxLength: 253
              pattern: '^([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*|([0-9A-Fa-f]{1,4}:){6}([0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3})|::([0-9A-Fa-f]{1,4}:){5}([0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3})|([0-9A-Fa-f]{1,4})?::([0-9A-Fa-f]{1,4}:){4}([0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3})|(([0-9A-Fa-f]{1,4}:){0,1}[0-9A-Fa-f]{1,4})?::([0-9A-Fa-f]{1,4}:){3}([0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3})|(([0-9A-Fa-f]{1,4}:){0,2}[0-9A-Fa-f]{1,4})?::([0-9A-Fa-f]{1,4}:){2}([0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3})|(([0-9A-Fa-f]{1,4}:){0,3}[0-9A-Fa-f]{1,4})?::[0-9A-Fa-f]{1,4}:([0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3})|(([0-9A-Fa-f]{1,4}:){0,4}[0-9A-Fa-f]{1,4})?::([0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3})|(([0-9A-Fa-f]{1,4}:){0,5}[0-9A-Fa-f]{1,4})?::[0-9A-Fa-f]{1,4}|(([0-9A-Fa-f]{1,4}:){0,6}[0-9A-Fa-f]{1,4})?::)$'
            transport:
              enum: [relay]
      properties:
        transport:
          type: string
          enum: [direct, relay]
        host:
          type: string
          description: Bare host name or IP address, no scheme, port or path. Required for relay.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Required for relay.
        tls_mode:
          type: string
          enum: [starttls, implicit]
          description: Required for relay.
        username:
          type: string
          maxLength: 255
          description: Set together with a password, or neither.
        password:
          type: string
          writeOnly: true
          description: Left out keeps the stored password; an empty string clears it.

    MTASTSPolicy:
      type: object
      required: [id, domain_id, mode, max_age, active]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        mode:
          type: string
          enum: [none, testing, enforce]
        mx_hosts:
          type: string
          description: Comma-separated MX host patterns
        max_age:
          type: integer
          description: Policy lifetime in seconds
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SetMTASTSPolicyRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [none, testing, enforce]
        mx_hosts:
          type: string
          description: Comma-separated MX host patterns
        max_age:
          type: integer
          minimum: 0
        active:
          type: boolean

    # ─────────────────────────────────────────────────────────────
    # Admin: TLS-RPT
    # ─────────────────────────────────────────────────────────────
    List-DMARCReport:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: '#/components/schemas/DMARCReport'
          type: array
        pagination:
          oneOf:
          - type: object
            additionalProperties: false
            required: [has_more]
            properties:
              cursor:
                type: string
              total:
                format: int64
                type: integer
              has_more:
                type: boolean
          - type: 'null'
      required:
      - data
      type: object
    DMARCReport:
      additionalProperties: false
      properties:
        domain_id:
          type: integer
        end_date:
          format: date-time
          type: string
        id:
          type: integer
        policy_published:
          $ref: '#/components/schemas/DMARCReceivedPolicy'
        received_at:
          format: date-time
          type: string
        records:
          items:
            $ref: '#/components/schemas/DMARCReceivedRecord'
          maxItems: 100
          minItems: 1
          type: array
        report_id:
          maxLength: 255
          type: string
        reporter:
          maxLength: 255
          type: string
        reporting_org:
          maxLength: 255
          type: string
        start_date:
          format: date-time
          type: string
      required:
      - id
      - domain_id
      - reporter
      - reporting_org
      - report_id
      - start_date
      - end_date
      - policy_published
      - records
      - received_at
      type: object
    DMARCReceivedPolicy:
      additionalProperties: false
      properties:
        adkim:
          maxLength: 1
          type: string
        aspf:
          maxLength: 1
          type: string
        discovery_method:
          maxLength: 32
          type: string
        domain:
          maxLength: 255
          type: string
        fo:
          maxLength: 32
          type: string
        np:
          maxLength: 10
          type: string
        p:
          enum:
          - none
          - quarantine
          - reject
          type: string
        pct:
          maximum: 100
          type:
          - integer
          - 'null'
        sp:
          maxLength: 10
          type: string
        testing:
          maxLength: 1
          type: string
      required:
      - domain
      - p
      type: object
    DMARCReceivedRecord:
      additionalProperties: false
      properties:
        auth_results:
          $ref: '#/components/schemas/DMARCReceivedAuthResults'
        identifiers:
          $ref: '#/components/schemas/DMARCReceivedIdentifiers'
        row:
          $ref: '#/components/schemas/DMARCReceivedRow'
      required:
      - row
      - identifiers
      - auth_results
      type: object
    DMARCReceivedAuthResults:
      additionalProperties: false
      properties:
        dkim:
          items:
            $ref: '#/components/schemas/DMARCReceivedDKIM'
          maxItems: 10
          type: array
        spf:
          items:
            $ref: '#/components/schemas/DMARCReceivedSPF'
          maxItems: 10
          type: array
      type: object
    DMARCReceivedDKIM:
      additionalProperties: false
      properties:
        domain:
          maxLength: 255
          type: string
        human_result:
          maxLength: 1024
          type: string
        result:
          maxLength: 32
          type: string
        selector:
          maxLength: 255
          type: string
      required:
      - domain
      - result
      type: object
    DMARCReceivedSPF:
      additionalProperties: false
      properties:
        domain:
          maxLength: 255
          type: string
        human_result:
          maxLength: 1024
          type: string
        result:
          maxLength: 32
          type: string
        scope:
          maxLength: 32
          type: string
      required:
      - domain
      - result
      type: object
    DMARCReceivedIdentifiers:
      additionalProperties: false
      properties:
        envelope_from:
          maxLength: 1024
          type: string
        envelope_to:
          maxLength: 1024
          type: string
        header_from:
          maxLength: 255
          type: string
      required:
      - header_from
      type: object
    DMARCReceivedRow:
      additionalProperties: false
      properties:
        count:
          format: int64
          maximum: 9007199254740991
          minimum: 1
          type: integer
        policy_evaluated:
          $ref: '#/components/schemas/DMARCReceivedEvaluation'
        source_ip:
          maxLength: 45
          type: string
      required:
      - source_ip
      - count
      - policy_evaluated
      type: object
    DMARCReceivedEvaluation:
      additionalProperties: false
      properties:
        disposition:
          enum:
          - none
          - pass
          - quarantine
          - reject
          type: string
        dkim:
          enum:
          - pass
          - fail
          type: string
        reasons:
          items:
            "$ref": "#/components/schemas/DMARCReceivedReason"
          maxItems: 10
          type: array
        spf:
          enum:
          - pass
          - fail
          type: string
      required:
      - disposition
      - dkim
      - spf
      type: object
    DMARCReceivedReason:
      additionalProperties: false
      properties:
        comment:
          maxLength: 1024
          type: string
        type:
          maxLength: 1024
          type: string
      required:
      - type
      type: object
    Data-DMARCReport:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/DMARCReport'
      required:
      - data
      type: object

    TLSReport:
      type: object
      required: [id, domain_id, reporting_org, start_date, end_date, policy_type, policy_domain, received_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        reporting_org:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        policy_type:
          type: string
          enum: [sts, tlsa, no-policy]
        policy_domain:
          type: string
        total_successful:
          type: integer
          format: int64
        total_failure:
          type: integer
          format: int64
        failure_details:
          description: Raw failure-details JSON from the report
          oneOf:
            - type: object
            - type: array
            - type: "null"
        raw_report:
          type: string
        received_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    TLSRPTReport:
      type: object
      description: Inbound TLS-RPT report (RFC 8460 §4)
      required: [organization-name, date-range, policies]
      properties:
        organization-name:
          type: string
          minLength: 1
        contact-info:
          type: string
        report-id:
          type: string
        date-range:
          type: object
          required: [start-datetime, end-datetime]
          properties:
            start-datetime:
              type: string
              format: date-time
            end-datetime:
              type: string
              format: date-time
        policies:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [policy]
            properties:
              policy:
                type: object
                required: [policy-domain]
                properties:
                  policy-type:
                    type: string
                  policy-string:
                    type: array
                    items:
                      type: string
                  policy-domain:
                    type: string
                    minLength: 1
                    format: hostname
                  mx-host:
                    type: array
                    items:
                      type: string
              summary:
                type: object
                properties:
                  total-successful-session-count:
                    type: integer
                    format: int64
                  total-failure-session-count:
                    type: integer
                    format: int64
              failure-details:
                type: array
                items:
                  type: object
                  additionalProperties: true

    # ─────────────────────────────────────────────────────────────
    # Admin: Observability (traces + analytics)
    # ─────────────────────────────────────────────────────────────
    TraceStageLog:
      type: object
      additionalProperties: false
      required: [filter, result]
      properties:
        filter:
          type: string
        result:
          type: string
        detail:
          type: string
        duration_ms:
          type: integer
          format: int64
    TraceStage:
      type: object
      additionalProperties: false
      required: [filter_name, filter_type, action, log, duration_ms]
      properties:
        filter_name:
          type: string
        filter_type:
          type: string
        action:
          type: string
        skipped:
          type: boolean
        skip_reason:
          type: string
        log:
          $ref: "#/components/schemas/TraceStageLog"
        duration_ms:
          type: integer
          format: int64
        error:
          type: string
    MessageTrace:
      type: object
      required: [id, direction, transport, pipeline_id, final_action, outcome, duration_ms, sampled, created_at]
      properties:
        id:
          type: integer
        message_id:
          type: [integer, "null"]
          description: Set only on the delivered/queued path; null otherwise
        rfc_message_id:
          type: string
          description: RFC 5322 Message-ID correlation key
        direction:
          type: string
          enum: [inbound, outbound]
        transport:
          type: string
          enum: ["", tls, plaintext]
          description: Empty when transport is not applicable
        mail_from:
          type: string
        rcpt_to:
          type: string
          description: First envelope recipient
        client_ip:
          type: string
        pipeline_id:
          type: integer
        final_action:
          type: string
          enum: [continue, reject, quarantine, discard, defer]
        outcome:
          type: string
          enum: [delivered, queued, rejected, quarantined, discarded, deferred]
        reason_code:
          type: string
          description: Bounded reason for a non-continue terminal; empty otherwise
        spam_score:
          type: [number, "null"]
        duration_ms:
          type: integer
          format: int64
        stages:
          description: Typed engine stage timeline; an empty list when none was stored
          type: array
          items:
            $ref: "#/components/schemas/TraceStage"
        sampled:
          type: boolean
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time

    PipelineFunnel:
      type: object
      properties:
        received:
          type: array
          items:
            type: object
            properties:
              transport:
                type: string
              count:
                type: number
        auth_verdicts:
          type: array
          items:
            type: object
            properties:
              mechanism:
                type: string
              result:
                type: string
              count:
                type: number
        stage_decisions:
          type: array
          items:
            type: object
            properties:
              filter:
                type: string
              action:
                type: string
              count:
                type: number
        terminal_outcomes:
          type: array
          items:
            type: object
            properties:
              direction:
                type: string
              outcome:
                type: string
              count:
                type: number
        top_reject_reasons:
          type: array
          items:
            type: object
            properties:
              reason_code:
                type: string
              count:
                type: number

    PipelineAnalyticsResponse:
      type: object
      required: [window, funnel]
      properties:
        window:
          type: object
          required: [since, until]
          properties:
            since:
              type: string
              format: date-time
            until:
              type: string
              format: date-time
            label:
              type: string
              description: Echoes the ?window value; empty when ?since was used
        funnel:
          $ref: "#/components/schemas/PipelineFunnel"
        live_totals:
          allOf:
            - $ref: "#/components/schemas/PipelineFunnel"
          description: >-
            Cumulative-since-process-start snapshot from the in-process registry
            (NOT windowed); absent if the registry could not be gathered.

    # ─────────────────────────────────────────────────────────────
    # Admin: Custom filters (update)
    # ─────────────────────────────────────────────────────────────
    UpdateCustomFilterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        filter_type:
          type: string
          enum: [action, transform]
        direction:
          type: string
          enum: [inbound, outbound, both]
        config:
          type: object
          description: Filter configuration (opaque JSON)
        enabled:
          type: boolean

    ImportMessageBody:
      additionalProperties: false
      properties:
        always_store:
          type: boolean
        flags:
          items:
            type: string
          type: array
        folder:
          type: string
        internal_date:
          format: date-time
          type: string
        match_submission:
          type: boolean
        raw_message:
          format: byte
          type: string
      required:
      - raw_message
      - internal_date
      type: object

    Data-ImportSession:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/ImportSession'
      required:
      - data
      type: object
    Data-ImportSessionSummary:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/ImportSessionSummary'
      required:
      - data
      type: object
    ImportFolderCounts:
      additionalProperties: false
      properties:
        bytes:
          format: int64
          type: integer
        deduplicated:
          format: int64
          type: integer
        imported:
          format: int64
          type: integer
        mbox_separator_stripped:
          format: int64
          type: integer
        refused:
          format: int64
          type: integer
      required:
      - imported
      - deduplicated
      - refused
      - bytes
      - mbox_separator_stripped
      type: object
    ImportSession:
      additionalProperties: false
      properties:
        account_id:
          type: integer
        client_name:
          type: string
        client_version:
          type: string
        id:
          type: string
        idle_timeout_seconds:
          type: integer
        started_at:
          format: date-time
          type: string
      required:
      - id
      - account_id
      - started_at
      - idle_timeout_seconds
      type: object
    ImportSessionSummary:
      additionalProperties: false
      properties:
        account_id:
          type: integer
        bytes:
          format: int64
          type: integer
        client_name:
          type: string
        client_version:
          type: string
        deduplicated:
          format: int64
          type: integer
        ended_at:
          format: date-time
          type: string
        folders:
          additionalProperties:
            $ref: '#/components/schemas/ImportFolderCounts'
          type: object
        id:
          type: string
        imported:
          format: int64
          type: integer
        mbox_separator_stripped:
          format: int64
          type: integer
        refused:
          format: int64
          type: integer
        started_at:
          format: date-time
          type: string
      required:
      - id
      - account_id
      - started_at
      - ended_at
      - imported
      - deduplicated
      - refused
      - bytes
      - mbox_separator_stripped
      - folders
      type: object
    OpenImportSessionBody:
      additionalProperties: false
      properties:
        client_name:
          maxLength: 255
          type: string
        client_version:
          maxLength: 255
          type: string
      type: object
    ImportMessageResult:
      additionalProperties: false
      properties:
        folder:
          type: string
        id:
          type: integer
        imported:
          type: boolean
        message_id:
          type: string
      required:
      - id
      - imported
      - message_id
      - folder
      type: object

    Data-ImportMessageResult:
      additionalProperties: false
      properties:
        data:
          "$ref": "#/components/schemas/ImportMessageResult"
      required:
      - data
      type: object
