  # ═══════════════════════════════════════════════════════════════
  # Vacation
  # ═══════════════════════════════════════════════════════════════
  /api/v1/accounts/{id}/vacation:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: getVacation
      tags: [Vacation]
      security:
        - CookieAuth: [mail:read]
        - BearerAuth: [mail:read]
        - APIKeyAuth: [mail:read]
