components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: restmail_access
      description: >
        httpOnly session cookie set by POST /api/v1/auth/login and
        /api/v1/auth/refresh. The browser attaches it automatically; JavaScript
        cannot read it. This is the transport used by the web frontends. State-
        changing requests (POST/PUT/PATCH/DELETE) additionally require the
        double-submit CSRF header (see the CSRFToken parameter).
    BasicAuth:
      type: http
      scheme: basic
      description: >
        A mailbox's address and one of its app passwords, as HTTP Basic
        (`curl -u 'address:rm_…'`). Checked on every request. Accepted only by
        the operations that list it; see "App password" above. Answers never
        carry WWW-Authenticate.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT access token as an Authorization: Bearer header — the transport for
        programmatic (non-browser) clients. The token is no longer returned in
        the login/refresh JSON body; obtain it from the restmail_access cookie in
        the login response's Set-Cookie header. Bearer requests carry no cookie
        and are exempt from the CSRF check.
    APIKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: rmk
      description: >
        A scoped API key (`rmk_…`) as an Authorization: Bearer header, made by
        createAPIKey. Checked on every request: refused once revoked or
        expired, and only ever allowed where both the key's permissions and
        its owner's live grants cover the capability at the target. Accepted
        only by the operations that list it; never for sign-in, passwords,
        2FA, credentials, API keys or the owner's own grants. A refused key is
        never retried as a session. Exempt from the CSRF check.

  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
      description: >
        Double-submit CSRF token. Required on state-changing requests
        (POST/PUT/PATCH/DELETE) that authenticate via the restmail_access cookie:
        echo the value of the readable restmail_csrf cookie (set at
        login/refresh). Rejected with 403 when missing or mismatched. Not
        required for Bearer-authenticated (cookie-less) requests.
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Account ID
      example: 1
    MessageId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Message ID
      example: 1
    DomainId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Domain ID
      example: 1
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Resource ID
      example: 1
    FolderName:
      name: folder
      in: path
      required: true
      schema:
        type: string
      description: Folder name (e.g. INBOX, Sent, Drafts, Trash)
      example: INBOX

  responses:
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

  schemas:
    Data-UnsubscribeOptions:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/UnsubscribeOptions'
      required:
      - data
      type: object
    UnsubscribeOptions:
      additionalProperties: false
      properties:
        links:
          items:
            type: string
          type: array
        mailto:
          items:
            $ref: '#/components/schemas/UnsubscribeMailtoOption'
          type: array
        one_click:
          examples:
          - https://news.example.com/unsubscribe?t=8f2c
          type: string
      required:
      - links
      - mailto
      type: object
    UnsubscribeMailtoOption:
      additionalProperties: false
      properties:
        body:
          type: string
        subject:
          examples:
          - unsubscribe
          type: string
        to:
          examples:
          - leave@news.example.com
          type: string
      required:
      - to
      - subject
      - body
      type: object
    Data-UnsubscribedOneClick:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/UnsubscribedOneClick'
      required:
      - data
      type: object
    UnsubscribedOneClick:
      additionalProperties: false
      properties:
        method:
          examples:
          - one_click
          type: string
        response_status:
          examples:
          - 200
          type: integer
        target:
          examples:
          - https://news.example.com/unsubscribe?t=8f2c
          type: string
      required:
      - method
      - target
      - response_status
      type: object
    unsubscribeMailtoBody:
      additionalProperties: false
      properties:
        from:
          type: string
        index:
          minimum: 0
          type: integer
      type: object
    Data-SendDiscarded:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/SendDiscarded'
      required:
      - data
      type: object
    SendDiscarded:
      additionalProperties: false
      properties:
        status:
          enum:
          - discarded
          type: string
      required:
      - status
      type: object
    Data-Message:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Message'
      required:
      - data
      type: object
    Data-ScheduledMessage:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/ScheduledMessage'
      required:
      - data
      type: object
    ScheduledMessage:
      additionalProperties: false
      properties:
        account_id:
          type: integer
        attempts:
          type: integer
        created_at:
          format: date-time
          type: string
        from:
          type: string
        id:
          type: integer
        last_error:
          type: string
        scheduled_at:
          format: date-time
          type: string
        sent_message_id:
          type:
          - integer
          - 'null'
        status:
          enum:
          - pending
          - sending
          - sent
          - failed
          - cancelled
          - held
          type: string
        subject:
          type: string
        to: {}
        updated_at:
          format: date-time
          type: string
      required:
      - id
      - account_id
      - from
      - to
      - subject
      - scheduled_at
      - status
      - attempts
      - created_at
      - updated_at
      type: object
    AwaitingThread:
      additionalProperties: false
      properties:
        awaiting_since:
          format: "date-time"
          type: "string"
        last_message:
          "$ref": "#/components/schemas/Message"
        thread_id:
          type: "string"
      required:
        - "thread_id"
        - "awaiting_since"
        - "last_message"
      type: "object"
    List-AwaitingThread:
      additionalProperties: false
      properties:
        data:
          items:
            "$ref": "#/components/schemas/AwaitingThread"
          type: "array"
        pagination:
