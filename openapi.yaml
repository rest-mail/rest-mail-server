  /api/v1/admin/pipelines/test:
    post:
      operationId: testPipeline
      tags: ["Admin: Pipelines"]
      security:
        - CookieAuth: [pipelines:write]
        - BearerAuth: [pipelines:write]
        - APIKeyAuth: [pipelines:write]
      summary: Test a pipeline against a sample email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestPipelineRequest"
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              valid:
                value:
                  pipeline_id: 1
                  email: {}
              missing:
                value:
                  pipeline_id: 2147483647
                  email: {}
              # JSON but not a request object: refused before any pipeline is
              # looked up.
              invalid_body:
                value: []
              # No email: refused before any pipeline is looked up.
              email_missing:
                value:
                  pipeline_id: 1
              pipeline_id_wrong_type:
                value: {pipeline_id: "1", email: {}}

      responses:
        "200":
          description: Pipeline execution result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ExecutionResult"
              examples:
                # The contract run's pipeline (header_validate alone) on the
                # empty email: it has no From and no Date. Durations are whole
                # milliseconds; this run takes less than one.
                valid:
                  value:
                    data:
                      final_action: reject
                      reject_message: "550 Invalid headers: missing From header, missing Date header"
                      steps:
                        - filter_name: header_validate
                          filter_type: action
                          action: reject
                          log:
                            filter: header_validate
                            result: reject
                            detail: missing From header; missing Date header
                          duration_ms: 0
                      duration_ms: 0
        '400':
          description: The body is not valid JSON or not the declared media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: {}
        "404":
          description: Pipeline not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing:
                  value:
                    error:
                      code: not_found
                      message: Pipeline not found
        '422':
          description: Request failed validation (validation_failed), with details.fields naming each failing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                email_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          email: required
                pipeline_id_wrong_type:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          pipeline_id: must be a non-negative integer
                invalid_body:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          body: the body is not a JSON object
        "429":
          description: Too many pipeline preview requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal lookup, stored configuration or filter execution failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

