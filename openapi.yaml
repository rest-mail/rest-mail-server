  /api/v1/admin/messages/{id}/trace:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    get:
      operationId: getMessageTrace
      tags: ["Admin: Observability"]
      security:
        - CookieAuth: [observability:read]
        - BearerAuth: [observability:read]
        - APIKeyAuth: [observability:read]
      summary: Get the pipeline trace for a delivered message
      description: >-
        Returns the trace joined on message_id, which is set only on the
        delivered/queued path. Non-delivered or unknown ids yield 404 (correlate
        those via rfc_message_id on the pipeline logs endpoint instead).
      # Links supply the successful lookup; the missing ID stays absent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          examples:
            found:
              value: 1
            missing:
              value: 2147483647
      responses:
        "200":
          description: Message trace
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MessageTrace"
        "404":
          description: No pipeline trace for this message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing:
                  value:
                    error:
                      code: not_found
                      message: No pipeline trace for this message

  # ═══════════════════════════════════════════════════════════════
  # Admin: Testing (non-production only; requires wildcard capability)
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/test/send:
    post:
      operationId: sendTestEmail
      tags: ["Admin: Testing"]
      security:
        - CookieAuth: ["*"]
        - BearerAuth: ["*"]
        - APIKeyAuth: ["*"]
      summary: Inject a test email directly into a recipient mailbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from:
                  type: string
                  format: email
                to:
                  type: string
                  format: email
                subject:
                  type: string
                body:
                  type: string
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              created:
                value:
                  from: postmaster@restmail.test
                  to: admin@restmail.test
                  subject: Test
                  body: A test message.
              non_object:
                value: []
              # No sender: refused before any mailbox is looked up. The
              # refusal names only the missing sender.
              from_missing:
                value:
                  to: admin@restmail.test
                  subject: Test
                  body: A test message.
      responses:
        "201":
          description: Test message created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      message_id:
                        type: integer
                      msg_id:
                        type: string
                      from:
                        type: string
                      to:
                        type: string
                      subject:
                        type: string
              examples:
                created:
                  value:
                    data:
                      message_id: 1
                      msg_id: "<0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d@restmail.test>"
                      from: postmaster@restmail.test
                      to: admin@restmail.test
                      subject: Test
        '400':
          description: The body is not valid JSON or not the declared media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: {}
        "403":
          description: Wildcard capability or cookie CSRF is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        '422':
          description: Request failed validation (validation_failed), with details.fields naming each failing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                from_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          from: required
                non_object:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          body: the body is not a JSON object
  /api/v1/admin/test/verify:
    get:
      operationId: verifyDelivery
      tags: ["Admin: Testing"]
      security:
        - CookieAuth: ["*"]
        - BearerAuth: ["*"]
        - APIKeyAuth: ["*"]
      summary: Poll for a delivered message matching the given criteria
      parameters:
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: email
          example: admin@restmail.test
        - name: subject
          in: query
          schema:
            type: string
        - name: message_id
          in: query
          schema:
            type: string
        - name: timeout
          in: query
          description: Go duration, capped at 30s
          schema:
            type: string
            default: 5s
      responses:
        "200":
          description: >-
            Verification result (found true/false). An address with no
