  /api/v1/accounts/{id}/api-keys:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: listAPIKeys
      tags: [Credentials]
      security:
        - CookieAuth: [mailbox:manage]
        - BearerAuth: [mailbox:manage]
      summary: List an account's API keys
      description: >
        The account's API keys that are not revoked, with their permissions;
        expired ones are included. Never a key, its secret or its hash; the
        answer is `Cache-Control: no-store`. `{id}` is the session's own
        account, or one it holds `mailbox:manage` on; any other is answered
        404. Needs a session from signing in with a password: an API key or
        an app password cannot list keys.
      responses:
        "200":
          description: The API keys
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createAPIKey
      tags: [Credentials]
      security:
        - CookieAuth: [mailbox:manage]
        - BearerAuth: [mailbox:manage]
      summary: Make an API key
      description: >
        Makes an API key for an automation and answers with it, the only time
        it is ever shown (`Cache-Control: no-store`); the server keeps only a
        SHA-256 of its secret. The key is sent as `Authorization: Bearer
        rmk_…` (see `APIKeyAuth`). It holds only the 1 to 64 `permissions`
        given, each a named capability (never `*`) at a scope; each must be
        within the current grants of both the session's account and the
        account the key belongs to (`403 forbidden` otherwise). Every request
        made with it is checked again against the owner's live grants, so a
        key never does more than its owner can at that moment. `{id}` is the
        session's own account or one it holds `mailbox:manage` on. Needs a
        session from signing in with a password and a second factor
        (`403 two_factor_required` otherwise, even for an account without
        2FA), and the session's own current password, entered again in
        `password`. A key cannot make or revoke keys, change passwords, 2FA
        or credentials, or change its owner's own grants. `expires_at`
        defaults to 90 days from now. Throttled like login, with the same
        budget. Recorded in the audit log as `api_keys.create`, with the
        name, id and public id; a refused attempt is recorded as denied. The
        password is never stored, recorded or answered with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password, permissions]
              properties:
                name:
                  type: string
                  minLength: 1
                  pattern: '\S'
                  maxLength: 100
                  example: Invoice robot
                password:
                  type: string
                  minLength: 1
                  format: password
                  writeOnly: true
                  description: The session's own current password, entered again.
                permissions:
                  type: array
                  minItems: 1
                  maxItems: 64
                  items:
                    $ref: "#/components/schemas/ClientSecretRequestedPermission"
                expires_at:
                  type: string
                  format: date-time
                  description: When it stops working; in the future. Defaults to 90 days from now.
            examples:
              created:
                value:
                  name: Invoice robot
                  password: current-password
                  permissions:
                    - {capability: "mail:read", scope: "mailbox:robot@example.com"}
              name_missing:
                value: {password: current-password, permissions: [{capability: "mail:read", scope: "mailbox:robot@example.com"}]}
              permissions_missing:
                value: {name: Invoice robot, password: current-password}
              permissions_empty:
                value: {name: Invoice robot, password: current-password, permissions: []}
              permissions_wrong_type:
                value: {name: Invoice robot, password: current-password, permissions: "mail:read"}
              permission_scope_missing:
                value: {name: Invoice robot, password: current-password, permissions: [{capability: "mail:read"}]}
              permission_capability_wrong_type:
                value: {name: Invoice robot, password: current-password, permissions: [{capability: 12345, scope: "mailbox:robot@example.com"}]}
              permission_unknown_field:
                value: {name: Invoice robot, password: current-password, permissions: [{capability: "mail:read", scope: "mailbox:robot@example.com", extra: 1}]}
              expires_at_malformed:
                value: {name: Invoice robot, password: current-password, permissions: [{capability: "mail:read", scope: "mailbox:robot@example.com"}], expires_at: not-a-date-time}
              expires_at_wrong_type:
                value: {name: Invoice robot, password: current-password, permissions: [{capability: "mail:read", scope: "mailbox:robot@example.com"}], expires_at: 12345}
              expires_at_past:
                value: {name: Invoice robot, password: current-password, permissions: [{capability: "mail:read", scope: "mailbox:robot@example.com"}], expires_at: "2000-01-01T00:00:00Z"}
              wildcard_capability:
                value: {name: Invoice robot, password: current-password, permissions: [{capability: "*", scope: "*"}]}
      responses:
        "201":
          description: Made; `token` is shown this once
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CreatedAPIKey"
              examples:
                created:
                  value:
                    data:
                      id: 2
                      name: Invoice robot
                      kind: api_key
                      public_id: 9Hm3yU1cNp5Q
                      created_at: "2026-01-01T00:00:00Z"
                      last_used_at: null
                      expires_at: "2026-04-01T00:00:00Z"
                      permissions:
                        - {capability: "mail:read", scope: "mailbox:robot@example.com"}
                      token: "rmk_9Hm3yU1cNp5Q_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          links:
            revokeAPIKey:
              operationId: revokeAPIKey
              parameters:
                id: '$request.path.id'
                credential_id: '$response.body#/data/id'
            updateAPIKey:
              operationId: updateAPIKey
              parameters:
                credential_id: '$response.body#/data/id'
                id: '$request.path.id'
        '400':
          description: The body is not valid JSON or not the declared media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          $ref: "#/components/responses/Unauthorized"
        '403':
          description: Requires a human 2FA sign-in (two_factor_required); sensitive changes require recent proof (recent_two_factor_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                two_factor_required:
                  value:
                    error:
                      code: two_factor_required
                      message: 'This action needs a session signed in with two-factor authentication: sign in again
                        with your code'
                recent_two_factor_required:
                  value:
                    error:
                      code: recent_two_factor_required
                      message: 'Sign in again with two-factor authentication: a recent second factor is required'
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            name missing, empty, longer than 100 characters or containing
            control characters; permissions empty, more than 64, `*` or
            malformed, or naming an unknown capability; or expires_at not in
            the future
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                name_missing:
                  value: {error: {code: validation_failed, message: Request body failed validation, details: {fields: {name: required}}}}
                permissions_missing:
                  value: {error: {code: validation_failed, message: Request body failed validation, details: {fields: {permissions: must contain between 1 and 64 scoped permissions}}}}
                permissions_empty:
                  value: {error: {code: validation_failed, message: Request body failed validation, details: {fields: {permissions: must contain between 1 and 64 scoped permissions}}}}
                permissions_wrong_type:
                  value: {error: {code: validation_failed, message: Request body failed validation, details: {fields: {permissions: must be an array}}}}
                permission_scope_missing:
                  value: {error: {code: validation_failed, message: Request body failed validation, details: {fields: {"permissions[0].scope": required}}}}
                permission_capability_wrong_type:
                  value: {error: {code: validation_failed, message: Request body failed validation, details: {fields: {"permissions[0].capability": must be a string}}}}
                permission_unknown_field:
                  value: {error: {code: validation_failed, message: Request body failed validation, details: {fields: {"permissions[0].extra": not allowed}}}}
                expires_at_malformed:
                  value: {error: {code: validation_failed, message: Request body failed validation, details: {fields: {expires_at: must be a date-time}}}}
                expires_at_wrong_type:
                  value: {error: {code: validation_failed, message: Request body failed validation, details: {fields: {expires_at: must be a date-time}}}}
                expires_at_past:
                  value: {error: {code: validation_failed, message: Request body failed validation, details: {fields: {expires_at: must be in the future}}}}
                wildcard_capability:
                  value: {error: {code: validation_failed, message: Request body failed validation, details: {fields: {permissions: each permission needs a named capability and a valid scope}}}}
        "429":
          description: Too many attempts from this client; shares login's budget

  /api/v1/accounts/{id}/api-keys/{credential_id}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - name: credential_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        example: 2
    patch:
      operationId: updateAPIKey
      tags: [Credentials]
      security:
        - CookieAuth: [mailbox:manage]
        - BearerAuth: [mailbox:manage]
      summary: Change what an API key may do, keeping its secret
      description: >
        Replaces the key's `permissions` with the 1 to 64 given. Its secret,
        name and expiry stay as they are, so nothing that uses it has to
        change, and the next request made with it runs with the new
        permissions. The rule is the one for making a key: each permission
        must be within the current grants of both the session's account and
        the account the key belongs to (`403 forbidden` otherwise), and it
        needs a session from signing in with a password and a second factor
        and the session's own current password, entered again in `password`.
        Throttled like login, with the same budget. Recorded in the audit log
        as `api_keys.update`, with the permissions before and after; a refused
        attempt is recorded as denied. The answer is `Cache-Control: no-store`
        and never carries the secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, permissions]
              properties:
                password:
                  type: string
                  minLength: 1
                  format: password
                  writeOnly: true
                  description: The session's own current password, entered again.
                permissions:
                  type: array
                  minItems: 1
                  maxItems: 64
                  items:
                    type: object
                    required: [capability, scope]
                    properties:
                      capability: {type: string, minLength: 1, example: "mail:send"}
                      scope: {type: string, minLength: 1, example: "mailbox:robot@example.com"}
      responses:
        "200":
          description: The key as it now is, without its secret
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, name, kind, public_id, created_at, last_used_at, expires_at, permissions]
                    properties:
                      id: {type: integer}
                      name: {type: string}
                      kind: {type: string}
                      public_id: {type: string}
                      created_at: {type: string, format: date-time}
                      last_used_at: {type: [string, "null"], format: date-time}
                      expires_at: {type: [string, "null"], format: date-time}
                      permissions:
                        type: array
                        items:
                          $ref: "#/components/schemas/ScopedPermission"
        "400":
          description: The body is not valid JSON or not the declared media type
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Without a recent two-factor sign-in, with the wrong current
            password, or asking for more than the grants allow
        "404":
          description: No such API key of this account, or already revoked
        "422":
          description: permissions empty, more than 64, `*`, malformed, or naming an unknown capability
        "429":
          description: Too many attempts from this client; shares login's budget
    delete:
      operationId: revokeAPIKey
      tags: [Credentials]
      security:
        - CookieAuth: [mailbox:manage]
        - BearerAuth: [mailbox:manage]
      summary: Revoke an API key
      description: >
        Revokes it: the next request made with it is refused. It stays in the
        table, revoked, for the audit trail, and leaves the list. Needs a
        session from signing in with a password and a second factor
        (`403 two_factor_required` otherwise). Recorded in the audit log as
        `api_keys.revoke`.
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        '403':
          description: Requires a human 2FA sign-in (two_factor_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                two_factor_required:
                  value:
                    error:
                      code: two_factor_required
                      message: 'This action needs a session signed in with two-factor authentication: sign in again
                        with your code'
        "404":
          description: No such API key of this account, or already revoked

  # ═══════════════════════════════════════════════════════════════
  # Push devices (#363)
  # ═══════════════════════════════════════════════════════════════
  /api/v1/devices:
    get:
      operationId: listPushDevices
      tags: [Push devices]
      summary: The push services the server can use, and this session's devices
      description: >
        Answers 404 when the server has no push credentials configured, which
        a client reads as "no push here". `platforms` lists the services this
        session can register a device with: empty for an administrator's
        session, which has no mailbox. A device's token is never returned.
        Device lookup follows request cancellation; dependency failures return 500.
      responses:
        "200":
          description: The services and the devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PushDevices"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Push is not configured on this server
    post:
      operationId: registerPushDevice
      tags: [Push devices]
      summary: Register this phone or browser with this session
      description: >
        A browser registers a Web Push subscription (`platform: webpush`, the
        endpoint as `token`, and its `keys`); each push is POSTed to the
        endpoint with a VAPID token (RFC 8292), encrypted to the browser
        (RFC 8291, aes128gcm), with the same payload as APNs, and a 404 or
        410 from the push service removes it.
        The session lookup and registration transaction follow request cancellation;
        dependency failures return 500.
        The device belongs to the session that registers it and is removed
        when the session ends: at logout, when it is revoked (a password
        change, a disabled mailbox), or when its refresh token expires. From
        then on new mail into the INBOX of any mailbox the session lists in
        `GET /api/v1/accounts` sends it a background push (APNs
        `content-available`, priority 5, an hour's expiry, at most one per
        device and account every 5 seconds) whose whole payload is
        `{"aps":{"content-available":1},"restmail":{"v":1,"device":"<id>","account":<id in GET /accounts>,"unread":<INBOX unread>}}`:
        never a sender, a subject, an address, a message id or any text. A
        device APNs says is gone (410, `BadDeviceToken`,
        `DeviceTokenNotForTopic`) is removed. Registering a token the session
        has already registered answers 200 with that device; the key is
        (session, token). Recorded in the audit log as `devices.register`,
        without the token. 404 when push is not configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPushDeviceRequest"
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386). Each refused
            # one differs from registered in one field, and is refused before
            # anything is looked up or stored.
            examples:
              registered:
                value:
                  platform: apns
                  token: 5c1d7e0f3a9b2c4d6e8f0a1b3c5d7e9f1a2b4c6d8e0f2a3b5c7d9e1f3a4b6c8d
                  environment: production
                  app_id: com.antimatterstudios.restmail
              # A platform this server does not push to.
              platform_unsupported:
                value:
                  platform: fcm
                  token: 5c1d7e0f3a9b2c4d6e8f0a1b3c5d7e9f1a2b4c6d8e0f2a3b5c7d9e1f3a4b6c8d
                  environment: production
                  app_id: com.antimatterstudios.restmail
              # Not lowercase hex.
              token_invalid:
                value:
                  platform: apns
                  token: not-an-apns-token
                  environment: production
                  app_id: com.antimatterstudios.restmail
              # Neither production nor sandbox.
              environment_invalid:
                value:
                  platform: apns
                  token: 5c1d7e0f3a9b2c4d6e8f0a1b3c5d7e9f1a2b4c6d8e0f2a3b5c7d9e1f3a4b6c8d
                  environment: staging
                  app_id: com.antimatterstudios.restmail
              # Another app's bundle id.
              app_id_mismatch:
                value:
                  platform: apns
                  token: 5c1d7e0f3a9b2c4d6e8f0a1b3c5d7e9f1a2b4c6d8e0f2a3b5c7d9e1f3a4b6c8d
                  environment: production
                  app_id: com.example.other
      responses:
        "200":
          description: The session had already registered this token
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PushDevice"
              # Named so it pairs with no request: it needs the token
              # registered before.
              examples:
                already_registered:
                  value:
                    data:
                      id: "12"
                      platform: apns
                      environment: production
                      created_at: "2026-01-01T00:00:00Z"
          links:
            removePushDevice:
              operationId: removePushDevice
              parameters:
                device_id: '$response.body#/data/id'
        "201":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PushDevice"
              examples:
                registered:
                  value:
                    data:
                      id: "12"
                      platform: apns
                      environment: production
                      created_at: "2026-01-01T00:00:00Z"
          links:
            removePushDevice:
              operationId: removePushDevice
              parameters:
                device_id: '$response.body#/data/id'
        '400':
          description: The body is not valid JSON or not the declared media type
        "422":
          description: >
            `validation_failed`, with `details.fields.platform` when the
            platform is not configured here or the session is an
            administrator's, which has no mailbox, and `fields.token`,
            `fields.environment`, `fields.app_id`, `fields.keys.p256dh`
            or `fields.keys.auth` for a bad value. Also
            `fields.token` when the session already has 10 devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                platform_unsupported:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          platform: not configured on this server
                token_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          token: "not an APNs device token: 64 or more lowercase hex digits"
                environment_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          environment: 'must be "production" or "sandbox"'
                app_id_mismatch:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          app_id: this server pushes to com.antimatterstudios.restmail only
        "401":
          description: Not signed in, or the session has ended (its access token outlived it)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Push is not configured on this server

