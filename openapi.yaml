  /api/v1/admin/pipelines/test:
    post:
      operationId: testPipeline
      tags: ["Admin: Pipelines"]
      security:
        - CookieAuth: [pipelines:write]
        - BearerAuth: [pipelines:write]
      summary: Test a pipeline against a sample email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestPipelineRequest"
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              valid:
                value:
                  pipeline_id: 1
                  email: {}
              # JSON but not a request object: refused before any pipeline is
              # looked up.
              invalid_body:
                value: []
              # No email: refused before any pipeline is looked up.
              email_missing:
                value:
                  pipeline_id: 1
      responses:
        "200":
          description: Pipeline execution result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ExecutionResult"
              examples:
                # The contract run's pipeline (header_validate alone) on the
                # empty email: it has no From and no Date. Durations are in
                # nanoseconds.
                valid:
                  value:
                    data:
                      final_action: reject
                      reject_message: "550 Invalid headers: missing From header, missing Date header"
                      steps:
                        - filter_name: header_validate
                          filter_type: action
                          action: reject
                          log:
                            filter: header_validate
                            result: reject
                            detail: missing From header; missing Date header
                          duration_ms: 4000
                      duration_ms: 12000
        "400":
          description: The body is not JSON (`bad_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                # Refused while the body is decoded, before any field is read
                # (#388).
                invalid_body:
                  value:
                    error:
                      code: bad_request
                      message: Invalid request body
        "422":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                email_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          email: required

  /api/v1/admin/pipelines/test-filter:
    post:
      operationId: testFilter
      tags: ["Admin: Pipelines"]
      security:
        - CookieAuth: [pipelines:write]
        - BearerAuth: [pipelines:write]
      summary: Test a single filter against a sample email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestFilterRequest"
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              valid:
                value:
                  filter_name: header_validate
                  config: {}
                  email:
                    envelope:
                      mail_from: someone@example.com
                      rcpt_to: [eve@restmail.test]
                    headers:
                      from: [{name: Someone, address: someone@example.com}]
                      to: [{address: eve@restmail.test}]
                      subject: A filter test
                      message-id: <filter-test@example.com>
                      date: "Sat, 17 Oct 2026 12:00:00 +0000"
                    body:
                      content_type: text/plain
                      content: Hello.
              # No filter name: refused before any filter is made.
              filter_name_missing:
                value:
                  config: {}
                  email:
                    envelope:
                      mail_from: someone@example.com
                      rcpt_to: [eve@restmail.test]
                    headers:
                      from: [{name: Someone, address: someone@example.com}]
                      to: [{address: eve@restmail.test}]
                      subject: A filter test
                      message-id: <filter-test@example.com>
                      date: "Sat, 17 Oct 2026 12:00:00 +0000"
                    body:
                      content_type: text/plain
                      content: Hello.
              # JSON but not a request object: refused before any filter is made.
              invalid_body:
                value: []
      responses:
        "200":
          description: Filter execution result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/FilterResult"
              examples:
                # header_validate's answer for an email with its From and Date.
                valid:
                  value:
                    data:
                      type: action
                      action: continue
                      log:
                        filter: header_validate
                        result: pass
                        detail: all headers valid
        "422":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                # The handler names both fields when either is missing.
                filter_name_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          filter_name: required
                          email: required
        "400":
          description: >-
            `bad_request` when the body does not decode as the request: empty,
            not JSON, an array, a string, a number or a boolean rather than an
            object, or a `filter_name` or `email` of the wrong JSON type. It is
            refused before the required fields are checked and before any
            filter is made; `{}` and a `null` body decode as empty ones and get
            a 422 instead. A body that decodes is also refused with a 400,
            `filter_error`, when the named filter cannot be made from its
            config or fails on the email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                # Refused while the body is decoded, before any field is read
                # (#388).
                invalid_body:
                  value:
                    error:
                      code: bad_request
                      message: Invalid request body

  /api/v1/admin/pipelines/logs:
    get:
      operationId: listPipelineLogs
      tags: ["Admin: Pipelines"]
      security:
        - CookieAuth: [pipelines:read]
        - BearerAuth: [pipelines:read]
      summary: List recent per-message pipeline traces
      description: >-
        Newest-first list of per-message pipeline traces. Each row is a
        MessageTrace (outcome, reason_code, transport, envelope, stage timeline,
        duration). The `action` filter matches the trace's final_action.
      parameters:
        - name: pipeline_id
          in: query
          schema:
            type: integer
        - name: direction
          in: query
          schema:
            type: string
            enum: [inbound, outbound]
        - name: action
          in: query
          description: Matches MessageTrace.final_action
          schema:
            type: string
            enum: [continue, reject, quarantine, discard, defer]
        - name: rfc_message_id
          in: query
          description: RFC 5322 Message-ID correlation key
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
            enum: [delivered, queued, rejected, quarantined, discarded, deferred]
        - name: reason_code
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "422":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Pipeline message traces
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MessageTrace"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Custom Filters
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/custom-filters:
    get:
      operationId: listCustomFilters
      tags: ["Admin: Custom Filters"]
      security:
        - CookieAuth: [pipelines:read]
        - BearerAuth: [pipelines:read]
      summary: List custom filters, optionally filtered by domain
      parameters:
        - name: domain_id
          in: query
          schema:
            type: integer
      responses:
        "422":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Custom filter list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomFilter"
    post:
      operationId: createCustomFilter
      tags: ["Admin: Custom Filters"]
      security:
        - CookieAuth: [pipelines:write]
        - BearerAuth: [pipelines:write]
      summary: Create a custom filter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomFilterRequest"
            # Pair each request only with the response bearing its name (#386).
            examples:
              created:
                value:
                  name: tag-invoices
                  description: Tags mail about invoices
                  filter_type: action
                  direction: inbound
                  config:
                    script: |
                      function filter(email) {
                        return { action: "continue" };
                      }
                  enabled: false
              filter_type_invalid:
                value:
                  name: tag-invoices
                  description: Tags mail about invoices
                  filter_type: invalid
                  direction: inbound
                  config:
                    script: |
                      function filter(email) {
                        return { action: "continue" };
                      }
                  enabled: false
      responses:
        "201":
          description: Custom filter created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CustomFilter"
              examples:
                created:
                  value:
                    data:
                      id: 1
                      domain_id: 1
                      name: tag-invoices
                      description: Tags mail about invoices
                      filter_type: action
                      direction: inbound
                      config:
                        script: |
                          function filter(email) {
                            return { action: "continue" };
                          }
                      enabled: false
                      created_at: "2026-01-01T00:00:00Z"
                      updated_at: "2026-01-01T00:00:00Z"
          links:
            getCustomFilter:
              operationId: getCustomFilter
              parameters:
                id: '$response.body#/data/id'
            updateCustomFilter:
              operationId: updateCustomFilter
              parameters:
                id: '$response.body#/data/id'
            testCustomFilter:
              operationId: testCustomFilter
              parameters:
                id: '$response.body#/data/id'
        "422":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                filter_type_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          filter_type: must be action or transform

  /api/v1/admin/custom-filters/validate:
    post:
      operationId: validateCustomFilter
      tags: ["Admin: Custom Filters"]
      security:
        - CookieAuth: [pipelines:write]
        - BearerAuth: [pipelines:write]
      summary: Syntax-check a JavaScript filter script via the sidecar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [script]
              properties:
                script:
                  type: string
                  minLength: 1
                  description: JavaScript filter source to validate
                email:
                  type: object
                  description: Optional sample email passed through to the sidecar
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              valid:
                value:
                  script: |
                    function filter(email) {
                      return { action: "continue" };
                    }
              # No script: refused before the sidecar is asked.
              script_missing:
                value: {}
              # Not an object at all: refused before the body is read for a
              # script.
              body_array:
                value: []
      responses:
        "200":
          description: >-
            Raw validation result proxied verbatim from the JS filter sidecar
            (shape determined by the sidecar).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
                # The sidecar's answer for a script that compiles, sent with no
                # sample email to dry-run it on.
                valid:
                  value:
                    valid: true
        "400":
          description: The body is not a JSON object, or a field has the wrong type (`bad_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                body_array:
                  value:
                    error:
                      code: bad_request
                      message: Invalid request body
        "422":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                script_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          script: required
        "503":
          description: >-
            JS filter sidecar unavailable, or it refused the API's token
            (JS_FILTER_TOKEN differs between the API and the sidecar)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/custom-filters/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getCustomFilter
      tags: ["Admin: Custom Filters"]
      security:
        - CookieAuth: [pipelines:read]
        - BearerAuth: [pipelines:read]
      summary: Get a custom filter by ID
      responses:
        "200":
          description: Custom filter details
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CustomFilter"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCustomFilter
      tags: ["Admin: Custom Filters"]
      security:
        - CookieAuth: [pipelines:write]
        - BearerAuth: [pipelines:write]
      summary: Update a custom filter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomFilterRequest"
            example:
              description: Tags mail about invoices and receipts
              config:
                script: |
                  function filter(email) {
                    return { action: "continue" };
                  }
              enabled: true
      responses:
        "200":
          description: Custom filter updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CustomFilter"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteCustomFilter
      tags: ["Admin: Custom Filters"]
      security:
        - CookieAuth: [pipelines:delete]
        - BearerAuth: [pipelines:delete]
      summary: Delete a custom filter
      responses:
        "200":
          description: Custom filter deleted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        example: deleted

  /api/v1/admin/custom-filters/{id}/test:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: testCustomFilter
      tags: ["Admin: Custom Filters"]
      security:
        - CookieAuth: [pipelines:write]
        - BearerAuth: [pipelines:write]
      summary: Run a stored custom filter's script against a sample email via the sidecar
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: object
                  description: >-
                    Optional sample email. When omitted a minimal built-in sample
                    is used.
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              # No email: the built-in sample is used.
              valid:
                value: {}
              # JSON but not a request object: refused before the filter is
              # looked up.
              invalid_body:
                value: []
      responses:
        "200":
          description: >-
            Raw execution result proxied verbatim from the JS filter sidecar
            (status and shape determined by the sidecar).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
                # The contract run's filter, which lets every email through.
                valid:
                  value:
                    result:
                      action: continue
                    logs: []
          links:
            deleteCustomFilter:
              operationId: deleteCustomFilter
              parameters:
                id: '$request.path.id'
        "400":
          description: >-
            The body is not JSON (`bad_request`), or the filter's config
            contains no script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                # Refused while the body is decoded, before the filter is
                # looked up.
                invalid_body:
                  value:
                    error:
                      code: bad_request
                      message: Invalid request body
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: >-
            JS filter sidecar unavailable, or it refused the API's token
            (JS_FILTER_TOKEN differs between the API and the sidecar)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

