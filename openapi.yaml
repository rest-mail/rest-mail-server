  # Credentials (app passwords)
  # ═══════════════════════════════════════════════════════════════
        '403':
          description: Requires a human 2FA sign-in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                two_factor_required:
