  /.well-known/autoconfig/mail/config-v1.1.xml:
    get:
      operationId: mozillaAutoconfigWellKnown
      tags: [System]
      summary: Mozilla/Thunderbird autoconfiguration (well-known path)
      security: []
      parameters:
        - name: emailaddress
          in: query
          required: true
          schema:
            type: string
            format: email
          example: admin@restmail.test
      responses:
        "200":
          description: Autoconfig XML document
          content:
            application/xml:
              schema:
                type: string
        "404":
          description: Domain not found

  /autodiscover/autodiscover.xml:
    post:
      operationId: microsoftAutodiscover
      tags: [System]
      summary: Microsoft Outlook autodiscover
      security: []
      requestBody:
        required: false
        content:
          application/xml:
            schema:
              type: string
            # Named on both sides so the malformed XML pairs only with 400.
            examples:
              valid:
                value: |
                  <?xml version="1.0" encoding="utf-8"?>
                  <Autodiscover xmlns="http://schemas.microsoft.com/exchange/autodiscover/outlook/requestschema/2006">
                    <Request>
                      <EMailAddress>eve@restmail.test</EMailAddress>
                      <AcceptableResponseSchema>http://schemas.microsoft.com/exchange/autodiscover/outlook/responseschema/2006a</AcceptableResponseSchema>
                    </Request>
                  </Autodiscover>
              malformed:
                value: "<Autodiscover><Request>"
      responses:
        "200":
          description: Autodiscover XML response
          content:
            application/xml:
              schema:
                type: string
              examples:
                valid:
                  summary: XML settings for the requested mailbox
        "400":
          description: >-
            No usable email address, refused before any domain is looked up. A
            body that is not Autodiscover XML falls back to the emailaddress
            query parameter: with neither, "invalid request". An Autodiscover
            request without an EMailAddress gets "email address required", and
            an address without an @ gets "invalid email address". Plain text,
            ending in a newline.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - "invalid request\n"
                  - "email address required\n"
                  - "invalid email address\n"
              examples:
                malformed:
                  value: "invalid request\n"

  /.well-known/mta-sts.txt:
    get:
      operationId: mtaStsPolicyFile
      tags: [System]
      summary: MTA-STS policy file (RFC 8461)
      description: Served to external MTAs. The domain is resolved from the Host header.
      security: []
      responses:
        "200":
          description: MTA-STS policy in text/plain
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Domain unknown or no active policy

  /.well-known/smtp-tlsrpt:
    post:
      operationId: receiveTlsReport
      tags: [System]
      summary: TLS-RPT report ingestion (RFC 8460)
      description: Receives JSON TLS-RPT reports from external MTAs. No auth by design.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TLSRPTReport"
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              stored:
                value:
                  organization-name: Example Reporter
                  contact-info: tlsrpt@reporter.example.com
                  report-id: 2026-10-17T00:00:00Z_restmail.test
                  date-range:
                    start-datetime: "2026-10-16T00:00:00Z"
                    end-datetime: "2026-10-16T23:59:59Z"
                  policies:
                    - policy:
                        policy-type: sts
                        policy-string: ["version: STSv1", "mode: testing", "mx: mail.restmail.test", "max_age: 86400"]
                        policy-domain: restmail.test
                        mx-host: [mail.restmail.test]
                      summary:
                        total-successful-session-count: 12
                        total-failure-session-count: 1
                      failure-details:
                        - result-type: certificate-expired
                          sending-mta-ip: 192.0.2.1
                          receiving-mx-hostname: mail.restmail.test
                          failed-session-count: 1
              # No organization-name: refused before anything is looked up or
              # stored.
              organization_missing:
                value:
                  contact-info: tlsrpt@reporter.example.com
                  report-id: 2026-10-17T00:00:00Z_restmail.test
                  date-range:
                    start-datetime: "2026-10-16T00:00:00Z"
                    end-datetime: "2026-10-16T23:59:59Z"
                  policies:
                    - policy:
                        policy-type: sts
                        policy-string: ["version: STSv1", "mode: testing", "mx: mail.restmail.test", "max_age: 86400"]
                        policy-domain: restmail.test
                        mx-host: [mail.restmail.test]
                      summary:
                        total-successful-session-count: 12
                        total-failure-session-count: 1
                      failure-details:
                        - result-type: certificate-expired
                          sending-mta-ip: 192.0.2.1
                          receiving-mx-hostname: mail.restmail.test
                          failed-session-count: 1
              # JSON, but not a report object: refused as it is decoded,
              # before any field is looked at.
              body_array:
                value: []
      responses:
        "201":
          description: Report stored
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      stored:
                        type: integer
                        description: Number of policy entries persisted
              examples:
                stored:
                  value:
                    data:
                      stored: 1
        "400":
          description: Malformed report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                body_array:
                  value:
                    error:
                      code: bad_request
                      message: Invalid TLS-RPT JSON
        "422":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                organization_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          organization-name: Required field

  /.well-known/acme-challenge/{token}:
    get:
      operationId: acmeChallenge
      tags: [System]
      summary: ACME HTTP-01 challenge response
      description: >-
        Registered only when ACME is enabled. Served to the ACME CA for domain
        validation. No auth by design.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          example: token
      responses:
        "200":
          description: Key authorization for the challenge token
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Unknown challenge token

  # ═══════════════════════════════════════════════════════════════
