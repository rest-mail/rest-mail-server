                value: {enabled: true, subject: "Out of office", body: "I will reply when I return."}
              body_array:
                value: []
              enabled_missing:
                value: {subject: "Out of office", body: "I will reply when I return."}
              subject_missing:
                value: {enabled: true, body: "I will reply when I return."}
              body_missing:
                value: {enabled: true, subject: "Out of office"}
              reply_missing:
                value: {enabled: true}
              dates_reversed:
                value:
                  enabled: true
                  subject: "Out of office"
                  body: "I will reply when I return."
                  start_date: "2030-01-02T00:00:00Z"
                  end_date: "2030-01-01T00:00:00Z"
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: Vacation config updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/VacationConfig"
              examples:
                configured:
                  value:
                    data: {enabled: true, subject: "Out of office", body: "I will reply when I return."}
        '400':
          description: The body is not valid JSON or not the declared media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: {}
        '422':
          description: Request failed validation (validation_failed), with details.fields naming each failing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                enabled_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          enabled: required
                subject_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          subject: required when enabled
                body_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          body: required when enabled
                reply_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          subject: required when enabled
                          body: required when enabled
                dates_reversed:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          end_date: must be after start_date
                body_array:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          body: the body is not a JSON object
    delete:
      operationId: disableVacation
      tags: [Vacation]
      security:
        - CookieAuth: [mail:write]
        - BearerAuth: [mail:write]
        - APIKeyAuth: [mail:write]
        - BasicAuth: [mail:write]
      summary: Disable vacation auto-reply
      description: Disables a stored vacation reply, including one already disabled. 404 not_found when the account has no stored vacation reply.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
          examples:
            missing: {value: 2}
      responses:
        "404":
          description: Account not found, inaccessible, or no stored vacation reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing:
                  value:
                    error:
                      code: not_found
                      message: Vacation reply not found
        "204":
          description: Vacation disabled

  # ═══════════════════════════════════════════════════════════════
  # Sieve
  # ═══════════════════════════════════════════════════════════════
  /api/v1/accounts/{id}/sieve:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: getSieveScript
      tags: [Sieve]
      security:
        - CookieAuth: [mail:read]
        - BearerAuth: [mail:read]
        - APIKeyAuth: [mail:read]
        - BasicAuth: [mail:read]
      summary: Get the Sieve filter script
      description: 404 not_found when the account has no stored Sieve script.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
          examples:
            defaults: {value: 2}
      responses:
        "200":
          description: Sieve script
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SieveScript"
          links:
            deleteSieveScript:
              operationId: deleteSieveScript
              parameters:
                id: '$request.path.id'
        "404":
          description: Account not found, inaccessible, or no stored Sieve script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                defaults:
                  value:
                    error:
                      code: not_found
                      message: Sieve script not found
    put:
      operationId: putSieveScript
      tags: [Sieve]
      security:
        - CookieAuth: [mail:write]
        - BearerAuth: [mail:write]
        - APIKeyAuth: [mail:write]
        - BasicAuth: [mail:write]
      summary: Create or replace the Sieve filter script
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutSieveRequest"
            examples:
              valid:
                value:
                  script: |
                    require ["fileinto"];
                    if header :contains "subject" "invoice" {
                      fileinto "Invoices";
                    }
                  active: true
              script_missing:
                value: {active: true}
              script_null:
                value: {script: null, active: true}
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        # 201 first: the run creates the script, then replaces it.
        "201":
          description: Sieve script created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SieveScript"
              examples:
                valid:
                  value: {}
          links:
            deleteSieveScript:
              operationId: deleteSieveScript
              parameters:
                id: '$request.path.id'
            getSieveScript:
              operationId: getSieveScript
              parameters:
                id: '$request.path.id'
        "200":
          description: Sieve script replaced
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SieveScript"
              examples:
                valid:
                  value: {}
          links:
            getSieveScript:
              operationId: getSieveScript
              parameters:
                id: '$request.path.id'
            deleteSieveScript:
              operationId: deleteSieveScript
              parameters:
                id: '$request.path.id'
        "422":
          description: The script field is missing or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                script_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields: {script: required}
                script_null:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields: {script: required}
    delete:
      operationId: deleteSieveScript
      tags: [Sieve]
      security:
        - CookieAuth: [mail:write]
        - BearerAuth: [mail:write]
        - APIKeyAuth: [mail:write]
        - BasicAuth: [mail:write]
      summary: Delete the Sieve filter script
      description: Deletes a stored script. 404 not_found when the account has no stored Sieve script.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
          examples:
            missing: {value: 2}
      responses:
        "404":
          description: Account not found, inaccessible, or no stored Sieve script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing:
                  value:
                    error:
                      code: not_found
                      message: Sieve script not found
        "200":
          description: Script deleted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        example: deleted

  /api/v1/accounts/{id}/sieve/validate:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      operationId: validateSieveScript
      tags: [Sieve]
      security:
        - CookieAuth: [mail:write]
        - BearerAuth: [mail:write]
        - APIKeyAuth: [mail:write]
        - BasicAuth: [mail:write]
      summary: Validate a Sieve script without saving
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [script]
              properties:
                script:
                  type: string
            examples:
              valid:
                value:
                  script: |
                    require ["fileinto"];
                    if header :contains "subject" "invoice" {
                      fileinto "Invoices";
                    }
              script_missing:
                value: {}
              script_null:
                value: {script: null}
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [valid]
                    properties:
                      valid:
                        type: boolean
                      message:
                        type: string
              examples:
                valid:
                  value:
                    data:
                      valid: true
                      message: Script is valid
        "422":
          description: The script field is missing or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                script_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields: {script: required}
                script_null:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields: {script: required}

  # ═══════════════════════════════════════════════════════════════
