  # ═══════════════════════════════════════════════════════════════
  # Inbound (Internal / Gateway)
  # ═══════════════════════════════════════════════════════════════
  /api/mailboxes:
    get:
      operationId: checkMailboxAddress
      tags: [Inbound]
      summary: Check if a mailbox address exists (used by SMTP gateway)
      description: >-
        Machine-to-machine recipient check. When internal mTLS is enabled this route
        is served ONLY on the dedicated internal listener (verified gateway client
        certificate required) and is absent from the public listener; when disabled
        it is unauthenticated on the public listener. Never accepts a user JWT.
      security: []
      x-internal-mtls: true
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Mailbox lookup result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MailboxCheck"

  /api/v1/messages/deliver:
    post:
      operationId: deliverMessage
      tags: [Inbound]
      summary: Deliver a message from the SMTP gateway
      description: >-
        Machine-to-machine inbound delivery. When internal mTLS is enabled this route
        is served ONLY on the dedicated internal listener (verified gateway client
        certificate required) and is absent from the public listener; when disabled
        it is unauthenticated on the public listener. Never accepts a user JWT.
      security: []
      x-internal-mtls: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliverMessageRequest"
      responses:
        "201":
          description: Message delivered
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ═══════════════════════════════════════════════════════════════
  # RESTMAIL Protocol
  # ═══════════════════════════════════════════════════════════════
  /restmail/capabilities:
    get:
      operationId: restmailCapabilities
      tags: [RESTMAIL]
      summary: Get RESTMAIL server capabilities
      security: []
      responses:
        "200":
          description: Server capabilities
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RestmailCapabilities"

  /restmail/mailboxes:
    get:
      operationId: restmailCheckMailbox
      tags: [RESTMAIL]
      summary: Check if a recipient mailbox exists
      security: []
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Mailbox check result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RestmailMailboxCheck"

  /restmail/messages:
    post:
      operationId: restmailDeliver
      tags: [RESTMAIL]
      summary: Deliver a message via RESTMAIL protocol
      description: >-
        Server-to-server delivery. Unauthenticated at the HTTP layer; the message's
        authenticity is verified out-of-band from its DKIM signature and the SPF
        result of the sending host.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestmailDeliverRequest"
      responses:
        "201":
          description: Delivery result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RestmailDeliverResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Domains
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/domains:
    get:
      operationId: listDomains
      tags: ["Admin: Domains"]
      x-required-capability: domains:read
      summary: List all domains
      responses:
        "200":
          description: Domain list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Domain"
    post:
      operationId: createDomain
      tags: ["Admin: Domains"]
      x-required-capability: domains:write
      summary: Create a new domain
      description: >-
        The domain is created but not live: `active` is false. Mail for a domain
        is only ever carried over TLS, so it goes live only once it has a
        certificate of its own, by a separate PATCH setting `active` to true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDomainRequest"
      responses:
        "201":
          description: Domain created, not yet live
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Domain"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/domains/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getDomain
      tags: ["Admin: Domains"]
      x-required-capability: domains:read
      summary: Get a domain by ID
      responses:
        "200":
          description: Domain details
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Domain"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateDomain
      tags: ["Admin: Domains"]
      x-required-capability: domains:write
      summary: Update a domain
      description: >-
        Setting `active` to true makes the domain live, and is refused with 409
        `certificate_required` unless the domain has a currently valid
        certificate: mail for it is only ever carried over TLS. Setting `active`
        to false takes it out of service and is always allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDomainRequest"
      responses:
        "200":
          description: Domain updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Domain"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The domain has no currently valid certificate, so it cannot go live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteDomain
      tags: ["Admin: Domains"]
      x-required-capability: domains:delete
      summary: Delete a domain
      responses:
        "204":
          description: Domain deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Mailboxes
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/mailboxes:
    get:
      operationId: listMailboxes
      tags: ["Admin: Mailboxes"]
      x-required-capability: mailboxes:read
      summary: List mailboxes, optionally filtered by domain
      parameters:
        - name: domain_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Mailbox list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Mailbox"

  /api/v1/admin/mailboxes/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getMailbox
      tags: ["Admin: Mailboxes"]
      x-required-capability: mailboxes:read
      summary: Get an account by ID
      responses:
        "200":
          description: Mailbox details
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Mailbox"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateMailbox
      tags: ["Admin: Mailboxes"]
      x-required-capability: mailboxes:write
      summary: Update an account
      description: |
        A new `password` (12 characters or more) replaces every password the
        account had and ends every session of it. It also revokes all the
        account's app passwords, in the transaction that sets it, recording
        each in the audit log as `credentials.revoke` with `reason`
        `password_changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMailboxRequest"
      responses:
        "200":
          description: Mailbox updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Mailbox"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteMailbox
      tags: ["Admin: Mailboxes"]
      x-required-capability: mailboxes:delete
      summary: Delete an account
      description: >
        Its credentials are revoked (kept, for the audit trail) and its
        sessions end. Every grant it held is removed under the grants rules
        (a session with 2FA, holding what it removes; the last superadmin
        cannot go), and every grant others held on it, so a new account at
        the same address inherits no owner. Each removal is recorded.
      responses:
        "204":
          description: Deleted
        "403":
          description: It holds grants and the session has no 2FA (`two_factor_required`), or holds less than they give (`grant_exceeds_held`)
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: It holds the last superadmin (`last_superadmin`)

