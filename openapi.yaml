            format: date-time
          description: Messages before this date
        - name: has_attachment
          in: query
          schema:
            type: boolean
          description: Only messages with attachments
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "422":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

  # ═══════════════════════════════════════════════════════════════
  # Attachments
  # ═══════════════════════════════════════════════════════════════
  /api/v1/attachments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Attachment ID
        examples:
          found:
            value: 1
    get:
      operationId: getAttachment
      parameters:
        - name: Range
          in: header
          required: false
          schema:
            type: string
          examples:
            range_single:
              value: bytes=0-0
            range_not_satisfiable:
              value: bytes=9223372036854775806-
        - name: If-Range
          in: header
          required: false
          schema:
            type: string
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
        - name: If-Modified-Since
          in: header
          required: false
          schema:
            type: string
        - name: If-Unmodified-Since
          in: header
          required: false
          schema:
            type: string
      tags: [Attachments]
      security:
        - CookieAuth: [mail:read]
        - BearerAuth: [mail:read]
        - APIKeyAuth: [mail:read]
        - BasicAuth: [mail:read]
      summary: Download an attachment
      description: Whole and single-range downloads are binary; multiple ranges use multipart/byteranges. Conditional requests may return bodyless 304 or 412, and invalid ranges return plain-text 416.
      responses:
        "200":
          description: >-
            The attachment's bytes, always as application/octet-stream; the
            type its sender gave it is listAttachments' content_type.
          headers:
            Content-Disposition:
              description: Download as an attachment, with a safely encoded filename.
              required: true
              schema:
                type: string
            Content-Length:
              description: The number of bytes in the complete attachment.
              required: true
              schema:
                type: integer
                format: int64
            Accept-Ranges:
              description: Byte ranges are supported.
              required: true
              schema:
                type: string
            ETag:
              description: Stored object entity tag when available.
              schema:
                type: string
            Last-Modified:
              description: Stored modification time as an HTTP date, when available.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
              examples:
                found:
                  summary: The seeded attachment bytes; the topology chooses the content.
        '206':
          description: A single binary range, or multipart ranges with a Content-Range on
            each part.
          headers:
            Content-Disposition:
              description: Safe attachment filename.
              schema:
                type: string
              required: true
            ETag:
              description: Stored object entity tag when available.
              schema:
                type: string
            Last-Modified:
              description: Stored modification time as an HTTP date, when available.
              schema:
                type: string
            Content-Length:
              description: Length of the partial or multipart response.
              schema:
                type: integer
                format: int64
              required: true
            Accept-Ranges:
              description: Byte ranges are supported.
              schema:
                type: string
              required: true
            Content-Range:
              description: Selected bytes and total length for a single range; multipart responses
                put this header on each part.
              schema:
                type: string
          content:
            application/octet-stream:
              examples:
                range_single:
                  summary: The first byte of the seeded attachment.
            multipart/byteranges: {}
        '304':
          description: The cached representation is current; no body.
          headers:
            Content-Disposition:
              description: Safe attachment filename.
              schema:
                type: string
              required: true
            ETag:
              description: Stored object entity tag when available.
              schema:
                type: string
            Last-Modified:
              description: Stored modification time as an HTTP date, when available.
              schema:
                type: string
        '412':
          description: An If-Match or If-Unmodified-Since precondition failed; no body.
          headers:
            Content-Disposition:
              description: Safe attachment filename.
              schema:
                type: string
              required: true
            ETag:
              description: Stored object entity tag when available.
              schema:
                type: string
            Last-Modified:
              description: Stored modification time as an HTTP date, when available.
              schema:
                type: string
            Content-Type:
              description: Attachment media type may remain on a bodyless precondition failure.
              schema:
                type: string
            Content-Length:
              description: Zero when emitted for a bodyless precondition failure.
              schema:
                type: integer
                format: int64
        '416':
          description: Malformed or non-overlapping range.
          headers:
            Content-Disposition:
              description: Safe attachment filename.
              schema:
                type: string
              required: true
            ETag:
              description: Stored object entity tag when available.
              schema:
                type: string
            Last-Modified:
              description: Stored modification time as an HTTP date, when available.
              schema:
                type: string
            Content-Range:
              description: bytes */length for a non-overlapping range; absent for malformed
                ranges.
              schema:
                type: string
            Content-Length:
              description: Error body byte length when emitted.
              schema:
                type: integer
                format: int64
          content:
            text/plain:
              schema:
                type: string
              examples:
                range_not_satisfiable:
                  value: "invalid range: failed to overlap\n"
        '500':
          description: A handler dependency failed.
          headers:
            Content-Disposition:
              description: Safe attachment filename if the failure occurs in the content writer.
              schema:
                type: string
            ETag:
              description: Stored object entity tag when available.
              schema:
                type: string
            Last-Modified:
              description: Stored modification time as an HTTP date, when available.
              schema:
                type: string
            Content-Length:
              description: Error body byte length when emitted.
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/messages/{id}/attachments:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    get:
      operationId: listAttachments
      tags: [Attachments]
      security:
        - CookieAuth: [mail:read]
        - BearerAuth: [mail:read]
        - APIKeyAuth: [mail:read]
        - BasicAuth: [mail:read]
      summary: List attachments for a message
      responses:
        "200":
          description: Attachment list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Attachment"

  # ═══════════════════════════════════════════════════════════════
  # Contacts
  # ═══════════════════════════════════════════════════════════════
  /api/v1/accounts/{id}/quiet-hours:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: getQuietHours
      tags: [Notifications]
      security:
        - CookieAuth: [mail:read]
        - BearerAuth: [mail:read]
        - APIKeyAuth: [mail:read]
        - BasicAuth: [mail:read]
      summary: Get the account's notification quiet hours
      description: Off by default. Daily local HH:MM start inclusive and end exclusive in an IANA time zone; start later than end crosses midnight. Mail delivery and reading are unaffected.
      responses:
        "200":
          description: Account notification quiet hours
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/QuietHoursSetting"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: setQuietHours
      tags: [Notifications]
      security:
        - CookieAuth: [mail:write]
        - BearerAuth: [mail:write]
        - APIKeyAuth: [mail:write]
        - BasicAuth: [mail:write]
      summary: Set the account's notification quiet hours
      description: Hold push notifications during quiet hours and send one account summary of arrival and unread counts when they end. No message content is sent. Enabled schedules require distinct HH:MM times and a valid IANA time zone. Skipped local times end at the first real instant outside the range; repeated local times are quiet whenever the local clock is inside the range.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetQuietHoursSetting"
      responses:
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Saved account notification quiet hours
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/QuietHoursSetting"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/accounts/{id}/contact-reply-time:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: getContactReplyTimeSetting
      tags: [Contacts]
      security:
        - CookieAuth: [mail:read]
        - BearerAuth: [mail:read]
        - APIKeyAuth: [mail:read]
        - BasicAuth: [mail:read]
      summary: Get the account's contact reply-time setting
      description: Off by default. Only this account's stored mail is used; no history is calculated or returned while disabled. Nothing is sent to contacts or external services.
      responses:
        "200":
          description: Account reply-time preference
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ContactReplyTimeSetting"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: setContactReplyTimeSetting
      tags: [Contacts]
      security:
        - CookieAuth: [mail:write]
        - BearerAuth: [mail:write]
        - APIKeyAuth: [mail:write]
        - BasicAuth: [mail:write]
      summary: Set the account's contact reply-time setting
      description: Opt in to local estimates in contact lists and suggestions. The median of at least three first replies matched by In-Reply-To (or the final References ID when absent) to this account's Sent messages addressed to that contact, using received_at timestamps. Drafts, deleted mail and nonpositive delays are ignored; each sent Message-ID counts once. No headers, outbound requests or tracking are added. This is not a signal from the contact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactReplyTimeSetting"
      responses:
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Saved account reply-time preference
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ContactReplyTimeSetting"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/accounts/{id}/contacts:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: listContacts
      tags: [Contacts]
      security:
        - CookieAuth: [mail:read]
        - BearerAuth: [mail:read]
        - APIKeyAuth: [mail:read]
        - BasicAuth: [mail:read]
      summary: List contacts for an account
      parameters:
        - name: trust_level
          in: query
          schema:
            type: string
            enum: [auto, trusted, blocked]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Contact list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [Contacts]
      security:
        - CookieAuth: [mail:write]
        - BearerAuth: [mail:write]
        - APIKeyAuth: [mail:write]
        - BasicAuth: [mail:write]
      summary: Create a new contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactRequest"
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386). Each refused
            # one has one field missing or wrong, and is refused before
            # anything is stored. Their address is not created's: the
            # createContact hook removes a contact an earlier request made
            # with the same address, and created's links still need it.
            examples:
              created:
                value:
                  email: someone@example.com
                  name: Someone
                  trust_level: trusted
              email_missing:
                value:
                  name: Someone
                  trust_level: trusted
              # A display name and address, not a bare address.
              email_invalid:
                value:
                  email: Refused <refused@example.com>
                  name: Someone
                  trust_level: trusted
              trust_level_invalid:
                value:
                  email: refused@example.com
                  name: Someone
                  trust_level: friend
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Contact"
              examples:
                created:
                  value:
                    data:
                      id: 1
                      mailbox_id: 1
                      email: someone@example.com
                      name: Someone
                      trust_level: trusted
                      source: manual
                      created_at: "2026-01-01T00:00:00Z"
                      updated_at: "2026-01-01T00:00:00Z"
          links:
            updateContact:
              operationId: updateContact
              parameters:
                id: '$request.path.id'
                cid: '$response.body#/data/id'
            deleteContact:
              operationId: deleteContact
              parameters:
                id: '$request.path.id'
                cid: '$response.body#/data/id'
        "422":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                email_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          email: required
                email_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          email: must be an email address
                trust_level_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          trust_level: "must be auto, trusted, or blocked"

  /api/v1/accounts/{id}/contacts/{cid}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - name: cid
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Contact ID
        example: 1
    patch:
      operationId: updateContact
      tags: [Contacts]
      security:
        - CookieAuth: [mail:write]
        - BearerAuth: [mail:write]
        - APIKeyAuth: [mail:write]
        - BasicAuth: [mail:write]
      summary: Update a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactRequest"
      responses:
        "200":
          description: Contact updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Contact"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteContact
      tags: [Contacts]
      security:
        - CookieAuth: [mail:write]
        - BearerAuth: [mail:write]
        - APIKeyAuth: [mail:write]
        - BasicAuth: [mail:write]
      summary: Delete a contact
      responses:
        "204":
          description: Contact deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/accounts/{id}/contacts/block:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      operationId: blockSender
      tags: [Contacts]
      security:
        - CookieAuth: [mail:write]
        - BearerAuth: [mail:write]
        - APIKeyAuth: [mail:write]
        - BasicAuth: [mail:write]
      summary: Block a sender
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
            example:
              email: spam@example.org
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        # 201 first: the run blocks a new sender, then the same one again.
        "201":
          description: Sender blocked, as a new contact
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Contact"
          links:
            deleteContact:
              operationId: deleteContact
              parameters:
                cid: '$response.body#/data/id'
                id: '$request.path.id'
            updateContact:
              operationId: updateContact
              parameters:
                cid: '$response.body#/data/id'
                id: '$request.path.id'
        "200":
          description: Sender blocked; the contact already existed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Contact"
          links:
            deleteContact:
              operationId: deleteContact
              parameters:
                cid: '$response.body#/data/id'
                id: '$request.path.id'
            updateContact:
              operationId: updateContact
              parameters:
                cid: '$response.body#/data/id'
                id: '$request.path.id'

  /api/v1/accounts/{id}/contacts/import:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      operationId: importContacts
      tags: [Contacts]
      security:
        - CookieAuth: [mail:write]
        - BearerAuth: [mail:write]
        - APIKeyAuth: [mail:write]
        - BasicAuth: [mail:write]
      summary: Bulk import contacts
      description: As many contacts as fit the API's request size limit. Every entry is checked first, and contacts the account already has are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportContactsRequest"
            examples:
              imported:
                value:
                  contacts:
                    - email: carol@example.org
                      name: Carol
              body_array:
                value: []
              contacts_missing:
                value: {}
              contacts_empty:
                value: {contacts: []}
              email_missing:
                value: {contacts: [{}]}
              email_invalid:
                value: {contacts: [{email: not-an-email}]}
              mixed_batch:
                value:
                  contacts:
                    - {email: valid-import@example.org, name: Must not be imported}
                    - {email: not-an-email}
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [imported, skipped]
                    properties:
                      imported:
                        type: integer
                      skipped:
                        type: integer
              examples:
                imported:
                  value: {data: {imported: 1, skipped: 0}}
        '400':
          description: The body is not valid JSON or not the declared media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: {}
        '422':
          description: Request failed validation (validation_failed), with details.fields naming each failing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                contacts_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          contacts: required
                contacts_empty:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          contacts: required
                email_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          contacts[0].email: required
                email_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          contacts[0].email: must be an email address
                mixed_batch:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          contacts[1].email: must be an email address
                body_array:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          body: the body is not a JSON object
  /api/v1/accounts/{id}/contacts/suggest:
    parameters:
      - $ref: "#/components/parameters/AccountId"
