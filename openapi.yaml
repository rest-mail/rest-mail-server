                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          to: at least one recipient required

  # ═══════════════════════════════════════════════════════════════
  # Admin: Domains
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/domains:
    get:
      operationId: listDomains
      tags: ["Admin: Domains"]
      security:
        - CookieAuth: [domains:read]
        - BearerAuth: [domains:read]
      summary: List all domains
      responses:
        "200":
          description: Domain list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Domain"
    post:
      operationId: createDomain
      tags: ["Admin: Domains"]
      security:
        - CookieAuth: [domains:write]
        - BearerAuth: [domains:write]
      summary: Create a new domain
      description: >-
        The domain is created but not live: `active` is false. Mail for a domain
        is only ever carried over TLS, so it goes live only once it has a
        certificate of its own, by a separate PATCH setting `active` to true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDomainRequest"
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              created:
                value:
                  name: example.org
                  server_type: restmail
              # JSON, but an array where the request is an object: refused
              # when it is read, before any field is looked at.
              body_array:
                value: []
              # No name: refused before anything is stored.
              name_missing:
                value: {}
              # The created request with a server type that is neither
              # traditional nor restmail: refused before anything is stored.
              server_type_invalid:
                value:
                  name: example.org
                  server_type: external
              # A sending policy that is not one: refused the same way.
              sending_policy_invalid:
                value:
                  name: example.org
                  server_type: restmail
                  sending_policy: newsletter
      responses:
        "201":
          description: Domain created, not yet live
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Domain"
              examples:
                created:
                  value:
                    data:
                      id: 1
                      name: example.org
                      server_type: restmail
                      active: false
                      default_quota_bytes: 0
                      sending_policy: ""
                      created_at: "2026-01-01T00:00:00Z"
                      updated_at: "2026-01-01T00:00:00Z"
          links:
            getDomain:
              operationId: getDomain
              parameters:
                id: '$response.body#/data/id'
            updateDomain:
              operationId: updateDomain
              parameters:
                id: '$response.body#/data/id'
            listAllowlist:
              operationId: listAllowlist
              parameters:
                id: '$response.body#/data/id'
            addToAllowlist:
              operationId: addToAllowlist
              parameters:
                id: '$response.body#/data/id'
            listBlocklist:
              operationId: listBlocklist
              parameters:
                id: '$response.body#/data/id'
            listSuppressions:
              operationId: listSuppressions
              parameters:
                id: '$response.body#/data/id'
            addToBlocklist:
              operationId: addToBlocklist
              parameters:
                id: '$response.body#/data/id'
            setDKIMKey:
              operationId: setDKIMKey
              parameters:
                id: '$response.body#/data/id'
            getDKIMRotation:
              operationId: getDKIMRotation
              parameters:
                id: '$response.body#/data/id'
            setDKIMRotation:
              operationId: setDKIMRotation
              parameters:
                id: '$response.body#/data/id'
            domainDNSCheck:
              operationId: domainDNSCheck
              parameters:
                id: '$response.body#/data/id'
            setDomainRelay:
              operationId: setDomainRelay
              parameters:
                id: '$response.body#/data/id'
            getDomainRelay:
              operationId: getDomainRelay
              parameters:
                id: '$response.body#/data/id'
            setMtaStsPolicy:
              operationId: setMtaStsPolicy
              parameters:
                id: '$response.body#/data/id'
        "400":
          description: >-
            The body is not a JSON object of the request's fields
            (`bad_request`), or the name is not a domain name (`invalid_domain`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                body_array:
                  value:
                    error:
                      code: bad_request
                      message: Invalid request body
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                name_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          name: required
                server_type_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          server_type: "must be 'traditional' or 'restmail'"
                sending_policy_invalid:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          sending_policy: must be 'transactional', 'bulk' or empty

  /api/v1/admin/domains/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getDomain
      tags: ["Admin: Domains"]
      security:
        - CookieAuth: [domains:read]
        - BearerAuth: [domains:read]
      summary: Get a domain by ID
      responses:
        "200":
          description: Domain details
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Domain"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateDomain
      tags: ["Admin: Domains"]
      security:
        - CookieAuth: [domains:write]
        - BearerAuth: [domains:write]
      summary: Update a domain
      description: >-
        Setting `active` to true makes the domain live, and is refused with 409
        `certificate_required` unless the domain has a currently valid
        certificate: mail for it is only ever carried over TLS. Setting `active`
        to false takes it out of service and is always allowed. Setting
        `sending_policy` to `""` clears it; any value other than
        `transactional`, `bulk` or `""` is refused with 422 `validation_failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDomainRequest"
      responses:
        "200":
          description: Domain updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Domain"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The domain has no currently valid certificate, so it cannot go live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteDomain
      tags: ["Admin: Domains"]
      security:
        - CookieAuth: [domains:delete]
        - BearerAuth: [domains:delete]
      summary: Delete a domain
      responses:
        "204":
          description: Domain deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Mailboxes
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/mailboxes:
    get:
      operationId: listMailboxes
      tags: ["Admin: Mailboxes"]
      security:
        - CookieAuth: [mailboxes:read]
        - BearerAuth: [mailboxes:read]
      summary: List mailboxes, optionally filtered by domain
      parameters:
        - name: domain_id
          in: query
          schema:
            type: integer
      responses:
        "422":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Mailbox list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Mailbox"

  /api/v1/admin/mailboxes/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getMailbox
      tags: ["Admin: Mailboxes"]
      security:
        - CookieAuth: [mailboxes:read]
        - BearerAuth: [mailboxes:read]
      summary: Get an account by ID
      responses:
        "200":
          description: Mailbox details
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Mailbox"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateMailbox
      tags: ["Admin: Mailboxes"]
      security:
        - CookieAuth: [mailboxes:write]
        - BearerAuth: [mailboxes:write]
      summary: Update an account
      description: |
        A new `password` (12 characters or more) replaces every password the
        account had and ends every session of it. It also revokes all the
        account's app passwords, in the transaction that sets it, recording
        each in the audit log as `credentials.revoke` with `reason`
        `password_changed`. `"active": false` ends every session of it too,
        so enabling it again brings none of them back; its app passwords
        stay, and work again once it is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMailboxRequest"
            example:
              display_name: Contract Test
              quota_bytes: 1073741824
              active: true
      responses:
        "200":
          description: Mailbox updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Mailbox"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The new password is shorter than 12 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
    delete:
      operationId: deleteMailbox
      tags: ["Admin: Mailboxes"]
      security:
        - CookieAuth: [mailboxes:delete]
        - BearerAuth: [mailboxes:delete]
      summary: Delete an account
      description: >
        Its credentials are revoked (kept, for the audit trail) and its
        sessions end. Every grant it held is removed under the grants rules
        (a session with 2FA, holding what it removes; the last superadmin
        cannot go), and every grant others held on it, so a new account at
        the same address inherits no owner. Each removal is recorded.
      responses:
        "204":
          description: Deleted
        "403":
          description: It holds grants and the session has no 2FA (`two_factor_required`), or holds less than they give (`grant_exceeds_held`)
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: It holds the last superadmin (`last_superadmin`)

  /api/v1/admin/mailboxes/{id}/sessions:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    delete:
      operationId: endMailboxSessions
      tags: ["Admin: Mailboxes"]
      security:
        - CookieAuth: [mailboxes:write]
        - BearerAuth: [mailboxes:write]
      summary: Sign an account out everywhere
      description: >
        Ends every session of the account: its refresh tokens are revoked and
        its credential epoch moves on, so every access token it was issued is
        refused at its next request, on the event stream and at refresh. Its
        passwords and app passwords stay: a mail client signed in with an app
        password keeps working, and is revoked on its own
        (`DELETE /api/v1/accounts/{id}/credentials/{credential_id}`).
      responses:
        "204":
          description: Every session of the account has ended
        "404":
          $ref: "#/components/responses/NotFound"

