      - $ref: "#/components/parameters/MessageId"
    delete:
      operationId: cancelScheduledMessage
      tags: [Messages]
      security:
        - CookieAuth: [mail:send]
        - BearerAuth: [mail:send]
        - BasicAuth: [mail:send]
      summary: Cancel a message that has not been sent yet
      description: >-
        Only a message still waiting can be called back. One already being
        sent is not in the list and cannot be cancelled.
      responses:
        "204":
          description: Cancelled
        "404":
          description: No waiting scheduled message with that id belongs to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

