        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkQueueRequest"
            examples:
              by_ids:
                value:
                  ids: [987654]
              # Not an object: refused before any entry is selected.
              invalid_body:
                value: []
              # Neither ids nor a filter: refused before any entry is selected.
              selection_missing:
                value: {}
      responses:
        "200":
          description: Bulk retry result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
