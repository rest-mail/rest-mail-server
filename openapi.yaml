  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/pipelines:
    get:
      operationId: listPipelines
      tags: ["Admin: Pipelines"]
      security:
        - CookieAuth: [pipelines:read]
        - BearerAuth: [pipelines:read]
      summary: List pipelines, optionally filtered by domain
      parameters:
        - name: domain_id
          in: query
          schema:
            type: integer
      responses:
        "422":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Pipeline list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Pipeline"
    post:
      operationId: createPipeline
      tags: ["Admin: Pipelines"]
      security:
        - CookieAuth: [pipelines:write]
        - BearerAuth: [pipelines:write]
      summary: Create a new pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePipelineRequest"
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              created:
                value:
                  domain_id: 1
                  direction: inbound
                  filters:
                    - name: header_validate
                      config: {}
              # No direction: refused before anything is stored.
              direction_missing:
                value:
                  domain_id: 1
                  filters:
                    - name: header_validate
                      config: {}
              # No filters: refused before anything is stored.
              filters_missing:
                value:
                  domain_id: 1
                  direction: inbound
              # An array, not an object: refused while the body is decoded,
              # before any field is read (#388).
              body_array:
                value: []
      responses:
        "201":
          description: Pipeline created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Pipeline"
              examples:
                created:
                  value:
                    data:
                      id: 1
                      domain_id: 1
                      direction: inbound
                      filters:
                        - name: header_validate
                          config: {}
                      active: true
                      created_at: "2026-01-01T00:00:00Z"
                      updated_at: "2026-01-01T00:00:00Z"
          links:
            updatePipeline:
              operationId: updatePipeline
              parameters:
                id: '$response.body#/data/id'
            deletePipeline:
              operationId: deletePipeline
              parameters:
                id: '$response.body#/data/id'
        "400":
          description: >-
            `bad_request` when the body does not decode as the request: not
            JSON, an array, a string, a number or a boolean rather than an
            object, or a field of the wrong JSON type. It is refused before any
            field is validated; a `null` body decodes as an empty one and gets
            the 422. Filters that pass validation are also refused with a 400:
            `invalid_sieve` for a Sieve script that does not install,
            `unsupported_filter` for a filter configured in a way it does not
            support.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                body_array:
                  value:
                    error:
                      code: bad_request
                      message: Invalid request body
        "422":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                direction_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          direction: must be 'inbound' or 'outbound'
                filters_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          filters: must be an array of filter objects

