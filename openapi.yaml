    post:
      operationId: createAccount
      tags: [Accounts]
      security:
        - CookieAuth: [accounts:write]
        - BearerAuth: [accounts:write]
        - APIKeyAuth: [accounts:write]
      summary: Create an account
      description: >
        The same for everyone. Needs `accounts:write` held at a scope covering
        the address's domain. The creator gets the `owner` grant on the new
        account (mail read, write, send, and `mailbox:manage`). With
        `password`, the account gets a password credential and can be signed
        in to; without one it has no credentials, and is reached only through
        its owners. The account, its credential, the grant and their audit
        entries (`accounts.create`, `grants.create`) commit together; a refused
        attempt is recorded too. A "sub account" is only this relationship: an
        account another holds the owner grant on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              created:
                value:
                  address: new-account@restmail.test
                  display_name: New Account
                  password: correct-horse-battery
              # No address: refused before anything is looked up or stored.
              address_missing:
                value:
                  display_name: New Account
                  password: correct-horse-battery
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Account"
              examples:
                created:
                  value:
                    data:
                      id: 2
                      address: new-account@restmail.test
                      display_name: New Account
                      is_primary: false
          links:
            getMailbox:
              operationId: getMailbox
              parameters:
                id: '$response.body#/data/id'
            updateMailbox:
              operationId: updateMailbox
              parameters:
                id: '$response.body#/data/id'
            deleteMailbox:
              operationId: deleteMailbox
              parameters:
                id: '$response.body#/data/id'
        "401":
          $ref: "#/components/responses/Unauthorized"
        '403':
          description: Requires a human 2FA sign-in (two_factor_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                two_factor_required:
                  value:
                    error:
                      code: two_factor_required
                      message: 'This action needs a session signed in with two-factor authentication: sign in again
                        with your code'
        "409":
          description: An account with this address exists, or the operator's owned-account limit has been reached (owned_account_limit).
        "422":
          description: Not an address, a password under 12 characters, a domain this server does not host, or a quota above the owner's ceiling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                address_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          address: required

  /api/v1/accounts/link:
    post:
      operationId: linkAccount
      tags: [Accounts]
      summary: Link an existing account by proving its password
      description: >
        Grants the session's account the `owner` role on an existing account,
        by proving one of its passwords — and a code from its authenticator, or
        one of its recovery codes, when it has one — the same proof as signing
        in to it. A refused proof is `403`, never `401`: the secrets are the
        other account's, and the session that sent them is still good, so a
        client must not renew it or send them again. A wrong password, an
        unknown address and an account with no password are the same
        `403 invalid_credentials`; an account with two-factor authentication
        answers `403 totp_required` without a code and `403 invalid_totp` for a
        wrong one. An account still in setup cannot be linked
        (`403 setup_required`). `display_name`, when the account has none,
        becomes its name. Throttled with login (a wrong guess spends the same
        budget), and audited (`accounts.link`, and the grant's
        `grants.create`). Unlinking is removing that grant:
        `DELETE /api/v1/accounts/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkAccountRequest"
            examples:
              linked:
                value:
                  address: eve@restmail.test
                  password: supplied-by-contract-hook
              address_missing:
                value:
                  password: supplied-by-contract-hook
              password_missing:
                value:
                  address: eve@restmail.test
              address_blank:
                value:
                  address: "   "
                  password: supplied-by-contract-hook
              password_empty:
                value:
                  address: eve@restmail.test
                  password: ""
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Account"
              examples:
                linked:
                  value:
                    data:
                      id: 2
                      address: eve@restmail.test
                      display_name: Eve
                      is_primary: false
          links:
            unlinkAccount:
              operationId: unlinkAccount
              parameters:
                id: '$response.body#/data/id'
            getAccount:
              operationId: getAccount
              parameters:
                id: '$response.body#/data/id'
        "401":
          description: The session itself is missing or has ended; never a refused link
        '403':
          description: Requires a human 2FA sign-in (two_factor_required); sensitive changes require recent proof (recent_two_factor_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                two_factor_required:
                  value:
                    error:
                      code: two_factor_required
                      message: 'This action needs a session signed in with two-factor authentication: sign in again
                        with your code'
                recent_two_factor_required:
                  value:
                    error:
                      code: recent_two_factor_required
                      message: 'Sign in again with two-factor authentication: a recent second factor is required'
        "409":
          description: Already linked, or the session's own account
        "422":
          description: Address or password missing or empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                address_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          address: required
                password_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          password: required
                address_blank:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          address: required
                password_empty:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          password: required
        "429":
          description: Too many attempts from this client

  /api/v1/accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: getAccount
      tags: [Accounts]
      security:
        - CookieAuth: [mail:read]
        - BearerAuth: [mail:read]
        - APIKeyAuth: [mail:read]
        - BasicAuth: [mail:read]
      summary: Get an account this one may read
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unlinkAccount
      tags: [Accounts]
      summary: Give up access to an account
      description: >
        Removes the session's own grants on the account (`grants.delete` for
        each, in one transaction): giving up access needs nothing more. Its
        own account cannot be unlinked (`409 own_account`). Account lookup and grant-removal
        failures return 500, not a missing link. The lookup and transaction follow request cancellation.
      responses:
        "204":
          description: Unlinked
        "404":
          description: The session holds no grant on it
        "409":
          description: The session's own account

  /api/v1/accounts/{id}/addresses:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: listAccountAddresses
      tags: [Accounts]
      security:
        - CookieAuth: [mail:read]
        - BearerAuth: [mail:read]
        - APIKeyAuth: [mail:read]
        - BasicAuth: [mail:read]
      summary: List the addresses an account receives at and may send from
      description: >
        `receives` is the account's own address, then every active alias on an
        active domain whose destination is this account; no other alias or
        destination is shown. `sends_as` is every mailbox address the account
        may put in From, each with the modes allowed (`from`: `on_behalf`
        false; `on_behalf`: `on_behalf` true), decided by the same check
        sendMessage makes, so the two cannot disagree. Asked by the account
        itself, it answers for the credential the request is made with; asked
        by someone else who may read the account, for the account's own
        sign-in. Uses the same `mail:read` authorization as getAccount; an
        account the caller may not read is 404.
      responses:
        "200":
          description: The account's receiving and sending addresses
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AccountAddresses"
        "403":
          description: The caller knows of the account but may not read it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Refused HTTP Basic credentials, throttled at login's rate
          headers:
            Retry-After:
              description: Seconds until a request may be made again
              required: true
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

