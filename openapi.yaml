      security: []
      parameters:
        - name: Host
          in: header
          required: false
          description: Authority naming mta-sts.<domain>, normally supplied by the request URL
          schema:
            type: string
      responses:
        "200":
          description: MTA-STS policy in text/plain
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Domain unknown or no active policy

  /.well-known/smtp-tlsrpt:
    post:
      operationId: receiveTlsReport
      tags: [System]
      summary: TLS-RPT report ingestion (RFC 8460)
      description: Receives JSON TLS-RPT reports from external MTAs. No auth by design.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TLSRPTReport"
            # Named, as are the responses they produce: a request pairs only
            # with the response example of the same name (#386).
            examples:
              stored:
                value:
                  organization-name: Example Reporter
                  contact-info: tlsrpt@reporter.example.com
                  report-id: 2026-10-17T00:00:00Z_restmail.test
                  date-range:
                    start-datetime: "2026-10-16T00:00:00Z"
                    end-datetime: "2026-10-16T23:59:59Z"
                  policies:
                    - policy:
                        policy-type: sts
                        policy-string: ["version: STSv1", "mode: testing", "mx: mail.restmail.test", "max_age: 86400"]
                        policy-domain: restmail.test
                        mx-host: [mail.restmail.test]
                      summary:
                        total-successful-session-count: 12
                        total-failure-session-count: 1
                      failure-details:
                        - result-type: certificate-expired
                          sending-mta-ip: 192.0.2.1
                          receiving-mx-hostname: mail.restmail.test
                          failed-session-count: 1
              # No organization-name: refused before anything is looked up or
              # stored.
              organization_missing:
                value:
                  contact-info: tlsrpt@reporter.example.com
                  report-id: 2026-10-17T00:00:00Z_restmail.test
                  date-range:
                    start-datetime: "2026-10-16T00:00:00Z"
                    end-datetime: "2026-10-16T23:59:59Z"
                  policies:
                    - policy:
                        policy-type: sts
                        policy-string: ["version: STSv1", "mode: testing", "mx: mail.restmail.test", "max_age: 86400"]
                        policy-domain: restmail.test
                        mx-host: [mail.restmail.test]
                      summary:
                        total-successful-session-count: 12
                        total-failure-session-count: 1
                      failure-details:
                        - result-type: certificate-expired
                          sending-mta-ip: 192.0.2.1
                          receiving-mx-hostname: mail.restmail.test
                          failed-session-count: 1
              # JSON, but not a report object: refused as it is decoded,
              # before any field is looked at.
              body_array:
                value: []
      responses:
        "201":
          description: Report stored
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      stored:
                        type: integer
                        description: Number of policy entries persisted
              examples:
                stored:
                  value:
                    data:
                      stored: 1
        '400':
          description: The body is not valid JSON or not the declared media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: {}
        '422':
          description: Request failed validation (validation_failed), with details.fields naming each failing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                organization_missing:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          organization-name: Required field
                body_array:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          body: the body is not a JSON object
