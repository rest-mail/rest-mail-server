  # ═══════════════════════════════════════════════════════════════
  # Drafts
  # ═══════════════════════════════════════════════════════════════
  /api/v1/messages/draft:
    post:
      operationId: saveDraft
      tags: [Drafts]
      security:
        - CookieAuth: [mail:write]
        - BearerAuth: [mail:write]
        - APIKeyAuth: [mail:write]
        - BasicAuth: [mail:write]
      summary: Save a new draft
      description: >
        All draft fields are optional. Without `from`, the draft is saved in
        the signed-in account's mailbox with an empty sender. When `from` is
        supplied, the caller needs mail:write on that mailbox.
        Sender lookup and storage follow request cancellation; dependency failures return 500 rather than forbidden.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftRequest"
            examples:
              with_sender:
                value:
                  from: admin@restmail.test
                  to: [admin@restmail.test]
                  subject: Draft
                  body_text: Not sent yet.
              empty:
                summary: Start an empty draft in the signed-in account
                value: {}
      responses:
        "201":
          description: Draft saved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Message"
          links:
            updateDraft:
              operationId: updateDraft
              parameters:
                id: '$response.body#/data/id'
        '400':
          description: The body is not valid JSON or not the declared media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: The caller may not write to the mailbox the draft is from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/messages/draft/{id}:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    put:
      operationId: updateDraft
      description: >-
        Update and reload commit together; a failed write/reload returns 500 and rolls back. An absent or no-longer-draft row is 404. Declared in_reply_to and references fields are persisted, with omitted/null fields unchanged. Lookup/access errors remain distinct from denial and follow request cancellation.
      tags: [Drafts]
      security:
        - CookieAuth: [mail:write]
        - BearerAuth: [mail:write]
        - APIKeyAuth: [mail:write]
        - BasicAuth: [mail:write]
      summary: Update an existing draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDraftRequest"
            example:
              from: admin@restmail.test
              to: [admin@restmail.test]
              subject: Draft, edited
              body_text: Ready to send.
      responses:
        "200":
          description: Draft updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Message"
          links:
            sendDraft:
              operationId: sendDraft
              parameters:
                id: '$response.body#/data/id'
        '400':
          description: The body is not valid JSON or not the declared media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: The draft is not the caller's, or the caller may not act as the new from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/messages/draft/{id}/send:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    post:
      operationId: sendDraft
      description: >-
        Draft lookup/access dependency failures return 500 and follow request cancellation. The broader send and post-send cleanup behavior is unchanged.
      tags: [Drafts]
      security:
        - CookieAuth: [mail:write, mail:send]
        - CookieAuth: [mail:write, mail:send_as]
        - CookieAuth: [mail:write, mail:send_on_behalf]
        - BearerAuth: [mail:write, mail:send]
        - BearerAuth: [mail:write, mail:send_as]
        - BearerAuth: [mail:write, mail:send_on_behalf]
        - APIKeyAuth: [mail:write, mail:send]
        - APIKeyAuth: [mail:write, mail:send_as]
        - APIKeyAuth: [mail:write, mail:send_on_behalf]
        - BasicAuth: [mail:write, mail:send]
        - BasicAuth: [mail:write, mail:send_as]
        - BasicAuth: [mail:write, mail:send_on_behalf]
      summary: Send a saved draft
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: [object, "null"]
              properties:
                on_behalf:
                  type: boolean
                  description: Use mail:send_on_behalf and identify the actor in Sender; otherwise use mail:send_as for another mailbox.
                list_unsubscribe:
                  type: [object, "null"]
                  properties:
                    mailto:
                      type: string
                    https:
                      type: string
      responses:
        '202':
          description: 'Retained: scheduled for later, or held by a send limit until human release'
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    additionalProperties: false
                    properties:
                      account_id:
                        type: integer
                      attempts:
                        type: integer
                      created_at:
                        format: date-time
                        type: string
                      from:
                        type: string
                      id:
                        type: integer
                      last_error:
                        type: string
                      scheduled_at:
                        format: date-time
                        type: string
                      sent_message_id:
                        type:
                        - integer
                        - 'null'
                      status:
                        enum:
                        - pending
                        - sending
                        - sent
                        - failed
                        - cancelled
                        - held
                        type: string
                      subject:
                        type: string
                      to: {}
                      updated_at:
                        format: date-time
                        type: string
                    required:
                    - id
                    - account_id
                    - from
                    - to
                    - subject
                    - scheduled_at
                    - status
                    - attempts
                    - created_at
                    - updated_at
                    type: object
                required:
                - data
                type: object
        "201":
          description: Draft sent
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Message"
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════════
  # Threads
  # ═══════════════════════════════════════════════════════════════
  "/api/v1/accounts/{id}/threads":
    get:
      summary: "List an account's threads in a state"
      description: "state=awaiting answers the threads whose last message came from this account, across folders, the most recent first. It is derived from the account's messages on every read, with no setting and no model: a draft, a scheduled send and a deleted or trashed message do not count, and a later message in the thread or a reply to the last one ends the wait. Any state other than awaiting is 422. A snoozed thread stays in this list with its deadline on last_message, because snoozing hides a thread from folder listings only."
      operationId: "listThreads"
      tags:
        - "Messages"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            minimum: 1
            type: "integer"
        - name: "state"
          in: "query"
          required: true
          schema:
            enum:
              - "awaiting"
            type: "string"
          example: "awaiting"
        - name: "limit"
          in: "query"
          description: "1 to 100; 50 otherwise"
          required: false
          schema:
            type: "integer"
        - name: "cursor"
          in: "query"
          description: "The cursor of the page before; one that does not decode starts from the newest"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/List-AwaitingThread"
        "401":
          description: "unauthorized, app_password_required or setup_required: a refused session or HTTP Basic credential"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "413":
          description: "request_too_large: the body is over the API's size cap"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "422":
          description: "Unprocessable Entity"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ValidationErrorResponse"
        "429":
          description: "rate_limited: refused API keys or HTTP Basic credentials, throttled at login's rate"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
          headers:
            Retry-After:
              description: "Seconds until a request may be made again"
              required: true
              schema:
                type: "integer"
        "500":
          description: "Internal Server Error"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "503":
          description: "unavailable: the credential or session check could not be made"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth:
            - "mail:read"
        - BearerAuth:
            - "mail:read"
        - APIKeyAuth:
            - "mail:read"
        - BasicAuth:
            - "mail:read"
  "/api/v1/accounts/{id}/threads/{threadID}/due":
    post:
      summary: Set or clear a thread's due date
      description: Stores an account-scoped user-set due date without changing message
        order or folders. Send an RFC 3339 due date-time, or null to clear both due
        and due_source. due_source must be user. Reads may also report rule or parsed,
        but nothing writes those yet. A parsed date is only a suggestion and never changes
        message order or folders; send its due with due_source user to accept it. Unknown
        threads and threads outside this account are 404.
      operationId: setThreadDue
      tags:
      - Messages
      parameters:
      - name: id
        in: path
        required: true
        schema:
          minimum: 1
          type: integer
        example: 1
      - name: threadID
        in: path
        required: true
        schema:
          type: string
        example: '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                due:
                  format: date-time
                  type:
                  - string
                  - 'null'
                due_source:
                  enum:
                  - user
                  type: string
              required:
              - due
              - due_source
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Data-ThreadDue"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: 'unauthorized, app_password_required or setup_required: a refused
            session or HTTP Basic credential'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '413':
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationErrorResponse"
        '429':
          description: 'rate_limited: refused API keys or HTTP Basic credentials, throttled
            at login''s rate'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
          headers:
            Retry-After:
              description: Seconds until a request may be made again
              required: true
              schema:
                type: integer
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '503':
          description: 'unavailable: the credential or session check could not be made'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
