          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
  /api/v1/accounts/{id}/messages/import:
    post:
      description: Stores original message octets, folder, supported system flags and
        required internal_date without delivery rules or push notifications. Requires mail:import on the destination,
        which every account is granted on its own mailbox by the importer role; an owner
        can revoke that grant, and the account is then refused with 403. A message whose Message-ID and exact
        octets are already in that account and folder is skipped without changing its flags
        or date; the same Message-ID with different octets is stored as another message.
        With always_store true no such check is made - a new message is stored with its own
        id, flags and date, and the one already there is left as it was. With match_submission true and folder
        Sent, a message whose Message-ID is on one authenticated SMTP submission saved in
        that account's Sent in the last 5 minutes is not stored, whatever always_store says,
        and the answer names the saved message with imported false. Messages without Message-ID use a
        deterministic SHA-256 import identity; the raw source remains unchanged. The one exception is a leading mbox From_ separator line (RFC 4155), which is dropped so the message starts at its first header, and counted as mbox_separator_stripped; any other header block that does not parse is refused. Every
        attempt the route can read is audited in a messages.import summary, never one entry
        per message of a session. With import_session (from createImportSession) it is counted
        in that session's summary, written once when the session closes; without it, it is
        written at once as a summary of its one message. A summary counts, per folder, messages
        imported (in the same transaction as the message), deduplicated (a copy matched to its
        submission included) and refused (stored
        nothing, including server failures), and the bytes imported. A request over the body
        limit, or one that cannot be read as this request, is refused before it is counted.
        An unknown, closed or other opener's import_session is refused as import_session_not_found. The decoded message is bounded by SMTP_MAX_MESSAGE_SIZE
        (10 MiB by default); the general API body limit may be stricter. Deleted state
        and up to 100 case-insensitive keywords of 1-255 ASCII bytes are preserved.
        Keywords must be RFC 3501 atoms without backslash. Deleted messages use
        IMAP deletion state, not API tombstones; EXPUNGE removes them.
      operationId: importMessage
      parameters:
      - example: 1
        in: path
        name: id
        required: true
        schema:
          minimum: 1
          type: integer
      - description: The import session this message belongs to, from createImportSession.
          Without it, the message is audited as an import of its own.
        in: query
        name: import_session
        required: false
        schema:
          pattern: ^$|^[0-9a-f]{32}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ImportMessageBody"
            # Named, as are the responses they produce. created goes to the
            # fixture admin's own INBOX; a rerun skips it as a duplicate, still 200.
            examples:
              created:
                value:
                  folder: INBOX
                  flags: ['\Seen']
                  internal_date: '2020-01-02T03:04:05Z'
                  raw_message: TWVzc2FnZS1JRDogPGhpc3RvcnlAZXhhbXBsZS50ZXN0Pg0KRnJvbTogT3JpZ2luYWwgPG9sZEBleGFtcGxlLnRlc3Q+DQpTdWJqZWN0OiBvcmlnaW5hbA0KDQpoaXN0b3J5DQo=
              body_array:
                value: []
              invalid_base64:
                value:
                  folder: INBOX
                  internal_date: '2020-01-02T03:04:05Z'
                  raw_message: '!not-base64!'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Data-ImportMessageResult"
              examples:
                created:
                  value:
                    data:
                      id: 41
                      imported: true
                      message_id: <history@example.test>
                      folder: INBOX
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: {}
          description: The body is not valid JSON or not the declared media type
        '401':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
          description: 'unauthorized: no token, a bad one, or a session that has ended'
        '403':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
          description: 'Refused before the handler runs: setup_required (the account has
            not finished setup), csrf_failed (a cookie session''s unsafe request without
            the CSRF header) or forbidden (the session lacks the capability)'
        '404':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
          description: Conflict
        '413':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
          description: Request Entity Too Large
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                invalid_base64:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          raw_message: must be a base64 string
                body_array:
                  value:
                    error:
                      code: validation_failed
                      message: Request body failed validation
                      details:
                        fields:
                          body: the body is not a JSON object
          description: Request failed validation (validation_failed), with details.fields naming each failing field
        '500':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
          description: Internal Server Error
        '503':
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
          description: 'unavailable: the session or grants check could not be made'
      security:
      - CookieAuth:
        - mail:import
      - BearerAuth:
        - mail:import
      - APIKeyAuth:
        - mail:import
      - BasicAuth:
        - mail:import
      summary: Store a message the account already has
      tags:
      - Messages

  /api/v1/accounts/{id}/messages/import-sessions:
    post:
      description: Opens an import of many messages into the account, so it is audited
        as one summary instead of one entry per message. Send the returned id as import_session
        with each importMessage call, then close it with closeImportSession. Requires
        mail:import on the account. A session with no import or close for idle_timeout_seconds
        (one hour) is closed by the server and its summary written. The IMAP gateway
        opens one at a connection's first APPEND or COPY and closes it at LOGOUT or
        disconnect, naming the client from its ID command.
      operationId: createImportSession
      parameters:
      - example: 1
        in: path
        name: id
        required: true
        schema:
          minimum: 1
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenImportSessionBody'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Data-ImportSession'
          description: Created
          links:
            closeImportSession:
              operationId: closeImportSession
              parameters:
                id: '$request.path.id'
                session: '$response.body#/data/id'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'unauthorized, app_password_required or setup_required: a refused
            session or HTTP Basic credential'
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Request Entity Too Large
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'rate_limited: refused API keys or HTTP Basic credentials, throttled
            at login''s rate'
          headers:
            Retry-After:
              description: Seconds until a request may be made again
              required: true
              schema:
                type: integer
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'unavailable: the credential or session check could not be made'
      security:
      - CookieAuth:
        - mail:import
      - BearerAuth:
        - mail:import
      - APIKeyAuth:
        - mail:import
      - BasicAuth:
        - mail:import
      summary: Open an import session
      tags:
      - Messages
  /api/v1/accounts/{id}/messages/import-sessions/{session}:
    delete:
      description: 'Closes the import session and writes its summary as one messages.import
        audit entry: account, client, start and end, and per folder the messages imported,
        deduplicated and refused with the bytes imported. The summary is returned. Only
        the account that opened the session may close it; a session that does not exist,
        has closed or belongs to another opener is not found.'
      operationId: closeImportSession
      parameters:
      - example: 1
        in: path
        name: id
        required: true
        schema:
          minimum: 1
          type: integer
      - example: 00112233445566778899aabbccddeeff
        in: path
        name: session
