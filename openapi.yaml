  /autodiscover/autodiscover.xml:
    post:
      operationId: microsoftAutodiscover
      tags: [System]
      summary: Microsoft Outlook autodiscover
      security: []
      parameters:
        - name: emailaddress
          in: query
          required: false
          description: The address to look up when the body is not Autodiscover XML.
          schema:
            type: string
            pattern: '^$|@[^@]*(\.[^@]*[^@\s]|[。．｡])[^@]*$'
      requestBody:
        required: false
        content:
          application/xml:
            schema:
              type: string
            # Named on both sides so the malformed XML pairs only with 400.
            examples:
              valid:
                value: |
                  <?xml version="1.0" encoding="utf-8"?>
                  <Autodiscover xmlns="http://schemas.microsoft.com/exchange/autodiscover/outlook/requestschema/2006">
                    <Request>
                      <EMailAddress>eve@restmail.test</EMailAddress>
                      <AcceptableResponseSchema>http://schemas.microsoft.com/exchange/autodiscover/outlook/responseschema/2006a</AcceptableResponseSchema>
                    </Request>
                  </Autodiscover>
              malformed:
                value: "<Autodiscover><Request>"
      responses:
        "200":
          description: Autodiscover XML response
          content:
            application/xml:
              schema:
                type: string
              examples:
                valid:
                  summary: XML settings for the requested mailbox
        '400':
          description: The body is not valid JSON or not the declared media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                malformed:
                  value:
                    error:
                      code: bad_request
                      message: invalid request
        "404":
          description: Domain not found
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: The mail host (GATEWAY_HOSTNAME) is not configured
          content:
            text/plain:
              schema:
                type: string

        '422':
          description: Request failed validation (validation_failed), with details.fields naming each failing field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /.well-known/mta-sts.txt:
