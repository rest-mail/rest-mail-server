# Prometheus alerting rules for REST Mail, the one copy (#1579):
#   * the compose stack's Prometheus loads this file (tasks/monitoring.yml
#     mounts it, monitoring/prometheus.yml lists it);
#   * the chart's PrometheusRule (templates/prometheusrule.yaml) reads it with
#     .Files.Get and carries every group except restmail-disk-node, which
#     only the compose stack's node-exporter can feed.
groups:
  - name: restmail-alerts
    rules:
      # Queue backlog is too large
      - alert: QueueBacklogHigh
        expr: restmail_queue_size > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queue backlog exceeds 1000 messages"
          description: "The outbound queue has {{ $value }} messages pending for more than 5 minutes."

      # Certificate approaching expiry
      - alert: CertificateExpiringSoon
        # 14 days, up from 7, as the deep review suggested (#1579): two weeks
        # leaves time to fix a renewal that keeps failing.
        expr: restmail_cert_expiry_days < 14
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "A certificate expires in {{ $value | humanize }} days"
          description: "The soonest-expiring certificate this server serves expires in less than 14 days (negative: already expired). The admin health endpoint names its domain. Renew now."

      # A domain served here has no usable certificate, so its handshakes are
      # refused. Mail for that domain is not being accepted.
      - alert: DomainCertificateMissing
        expr: increase(restmail_tls_cert_missing_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Handshakes refused: a domain served here has no usable certificate"
          description: "{{ $value }} handshakes in the last 10 minutes were refused because the domain asked for is served here but has no usable certificate (none stored, expired, or the stored pair will not load). Mail for it is being turned away. The gateway logs name the domain."

      # High authentication failure rate
      - alert: AuthFailureRateHigh
        expr: rate(restmail_auth_failures_total[5m]) * 300 > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High authentication failure rate on {{ $labels.protocol }}"
          description: "More than 100 authentication failures in the last 5 minutes on protocol {{ $labels.protocol }}. Possible brute-force attempt."

      # One address has taken many failed sign-ins (#1643). Sign-ins are slowed,
      # never refused, so this is the administrator's only prompt to look.
      - alert: SignInAccountUnderAttack
        expr: increase(restmail_signin_accounts_under_attack_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "An address is taking many failed sign-ins"
          description: "One address reached 20 recent failed sign-ins. Failures for it now wait up to 3 seconds; the correct password is not slowed. The API log event api_signin_account_under_attack gives the masked address, and the audit log's auth.sign_in entries give the sources."

      # So many failed sign-ins are waiting that more are answered with no delay.
      - alert: SignInDelayBoundReached
        expr: increase(restmail_signin_failures_unslowed_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Failed sign-ins are being answered without their delay"
          description: "{{ $value }} failed sign-ins in the last 10 minutes were answered at once because 256 were already waiting. Nobody is refused, but guessing is no longer slowed. Look for a large attack."

      # HTTP error rate above 5%
      - alert: HTTPErrorRateHigh
        expr: >
          sum(rate(restmail_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(restmail_http_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx error rate exceeds 5%"
          description: "The API server is returning server errors at a rate of {{ $value | humanizePercentage }}."

      # API response time too slow (p95 > 2s)
      - alert: APIResponseTimeSlow
        expr: >
          histogram_quantile(0.95, sum(rate(restmail_http_request_duration_seconds_bucket[5m])) by (le))
          > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p95 response time exceeds 2 seconds"
          description: "The 95th percentile API response time is {{ $value }}s, which is above the 2s threshold."

      # Queue error rate spike
      - alert: QueueErrorRateHigh
        expr: rate(restmail_queue_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queue processing error rate is elevated"
          description: "Queue errors are occurring at {{ $value }} per second."

      # No messages processed (possible queue worker failure). It reads the
      # rows due now, not the whole queue: rows waiting for a later retry
      # (after a remote outage the backoff runs for hours) leave the workers
      # correctly idle, and must not page anyone (#1630).
      - alert: QueueWorkerStalled
        expr: >
          rate(restmail_queue_processed_total[15m]) == 0
          and
          restmail_queue_due > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Queue workers appear stalled"
          description: "No messages have been processed in the last 15 minutes although {{ $value }} queued messages are due for an attempt now. Messages waiting for a later retry are not counted."

      # The oldest message still waiting to leave is old: mail is backing up,
      # however deep the queue is (#1579). Deferred mail is retried for up to
      # five days (models.QueueLifetime), so one message to a dead domain keeps
      # this firing; tune 6h to the delay you accept.
      - alert: QueueOldestMessageOld
        expr: restmail_queue_oldest_age_seconds > 6 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The oldest queued message is {{ $value | humanizeDuration }} old"
          description: "A pending or deferred outbound message has waited more than 6 hours. Check the queue in the admin API for the destinations that are deferring."

      # A process could not reach the database (#1579): connections refused,
      # dropped or timed out, not queries the database answered with an error.
      - alert: DatabaseConnectionErrors
        expr: increase(restmail_db_connection_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} cannot reach the database"
          description: "{{ $value | humanize }} database operations in the last 5 minutes failed because the database could not be reached. Check the Postgres server, its network and its connection limit."

      # Every pool connection is in use and callers queue for one (#1579).
      - alert: DatabasePoolSaturated
        expr: >
          restmail_db_pool_in_use_connections / restmail_db_pool_max_open_connections > 0.9
          and restmail_db_pool_max_open_connections > 0
          and rate(restmail_db_pool_wait_count_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} database pool is nearly exhausted"
          description: "More than 90% of the pool's connections are in use and callers are waiting for one. Raise DB_MAX_OPEN_CONNS (within Postgres max_connections) or find the slow queries."

      # A pipeline filter errors on more than 5% of the messages it sees
      # (#1579). An error is the filter failing, not its verdict on the mail.
      - alert: PipelineFilterErrorRateHigh
        expr: >
          sum by (filter) (rate(restmail_pipeline_stage_decisions_total{action="error"}[10m]))
          /
          sum by (filter) (rate(restmail_pipeline_stage_decisions_total[10m]))
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline filter {{ $labels.filter }} is erroring"
          description: "{{ $value | humanizePercentage }} of filter {{ $labels.filter }}'s steps in the last 10 minutes ended in an error. Its service may be down; the gateway logs name the cause."

      # No SMTP connection admitted for an hour (#1579): the listener, the
      # load balancer or DNS in front of it may be broken. A server nobody
      # sends to will fire this too; raise the window or silence it there.
      - alert: SMTPConnectionsStopped
        expr: sum by (job) (increase(restmail_connections_accepted_total{protocol="smtp"}[1h])) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No SMTP connections in the last hour"
          description: "The SMTP gateway has admitted no connection for an hour. Check the listener, the load balancer, the MX records and the firewall."

      # The same for IMAP: mail clients poll or IDLE, so an hour without a
      # connection usually means they cannot reach the gateway.
      - alert: IMAPConnectionsStopped
        expr: sum by (job) (increase(restmail_connections_accepted_total{protocol="imap"}[1h])) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No IMAP connections in the last hour"
          description: "The IMAP gateway has admitted no connection for an hour. Check the listener, the load balancer and the firewall."

      # DNSBL (issue #148): only when the operator has enabled the monitor.
      # Reputation: a blocklist's last answer listed one of our sending IPs.
      - alert: DNSBLSendingIPListed
        expr: restmail_dnsbl_listed == 1
        labels:
          severity: critical
        annotations:
          summary: "Sending IP {{ $labels.ip }} is listed by {{ $labels.provider }}"
          description: "The last answer from DNSBL provider {{ $labels.provider }} listed {{ $labels.ip }}. Mail sent from it may be refused. The API log line 'dnsbl: sending IP listed' carries the codes and reason."

      # Operational, not reputation: a blocklist is not answering. The listing
      # value is left as it was, so a listing is never cleared by errors.
      - alert: DNSBLProviderNotAnswering
        expr: sum by (provider) (increase(restmail_dnsbl_checks_total{status=~"provider_error|indeterminate"}[3h])) > 0 and sum by (provider) (increase(restmail_dnsbl_checks_total{status=~"listed|not_listed"}[3h])) == 0
        labels:
          severity: warning
        annotations:
          summary: "DNSBL provider {{ $labels.provider }} has not answered for 3 hours"
          description: "Every check against {{ $labels.provider }} in the last 3 hours failed (provider_error or indeterminate). The listing state for it is stale, not clean. Check the zone, its answer codes and the resolver."

      # The last real answer for an IP and provider is old: the listing value
      # is stale. Tune 6h to a few times the configured interval.
      - alert: DNSBLAnswerStale
        expr: time() - restmail_dnsbl_last_answer_timestamp_seconds > 6 * 3600
        labels:
          severity: warning
        annotations:
          summary: "No DNSBL answer for {{ $labels.ip }} from {{ $labels.provider }} in 6 hours"
          description: "restmail_dnsbl_listed for this pair reflects an answer more than 6 hours old."

  # Disk space on the volumes REST Mail writes (#1579): the database, the
  # attachments (the API's volume and Garage's) and the certificates. A full
  # database volume stops every write, so mail is refused; a full attachment
  # volume fails every message with a file.
  #
  # Thresholds are a share of the volume, not a fixed number of GB, because the
  # same rule covers a few-MB certificate volume, the chart's 20Gi database and
  # its 50Gi Garage volume. 80% used (warning, for 30m) leaves room to grow the
  # volume during working hours; 90% (critical, for 5m) leaves about 2Gi on the
  # default database volume, little more than Postgres needs for a VACUUM or a
  # burst of WAL, so act now.
  #
  # Two sources, one group of two alerts each:
  #   * restmail-disk-node, compose stack only: node-exporter
  #     (tasks/monitoring.yml) mounts each volume read-only under
  #     /volumes/<name>, scraped as job "node". The chart's PrometheusRule
  #     leaves this group out;
  #   * restmail-disk-pvc, Kubernetes: kubelet's volume stats for the chart's
  #     PVCs (<release>-postgres-data, <release>-api-attachments and Garage's
  #     data-<release>-garage-N). Only when the cluster's Prometheus scrapes
  #     kubelet, as kube-prometheus-stack does.
  - name: restmail-disk-node
    rules:
      - alert: DiskSpaceLow
        expr: >
          node_filesystem_avail_bytes{job="node", mountpoint=~"/volumes/.+"}
          / node_filesystem_size_bytes{job="node", mountpoint=~"/volumes/.+"} < 0.20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Volume {{ $labels.mountpoint }} is over 80% full"
          description: "Only {{ $value | humanizePercentage }} of the filesystem holding {{ $labels.mountpoint }} is free. Free space or grow the volume before it fills."
      - alert: DiskSpaceCritical
        expr: >
          node_filesystem_avail_bytes{job="node", mountpoint=~"/volumes/.+"}
          / node_filesystem_size_bytes{job="node", mountpoint=~"/volumes/.+"} < 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Volume {{ $labels.mountpoint }} is over 90% full"
          description: "Only {{ $value | humanizePercentage }} of the filesystem holding {{ $labels.mountpoint }} is free. When it fills, writes to it fail: the database refuses mail, attachments cannot be stored. Act now."

  - name: restmail-disk-pvc
    rules:
      - alert: PVCSpaceLow
        expr: >
          kubelet_volume_stats_available_bytes{persistentvolumeclaim=~".+-(postgres-data|api-attachments)|data-.+-garage-[0-9]+"}
          / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".+-(postgres-data|api-attachments)|data-.+-garage-[0-9]+"} < 0.20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is over 80% full"
          description: "Only {{ $value | humanizePercentage }} of the volume is free. Grow the PVC (its storage class must allow expansion) or free space before it fills."
      - alert: PVCSpaceCritical
        expr: >
          kubelet_volume_stats_available_bytes{persistentvolumeclaim=~".+-(postgres-data|api-attachments)|data-.+-garage-[0-9]+"}
          / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".+-(postgres-data|api-attachments)|data-.+-garage-[0-9]+"} < 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is over 90% full"
          description: "Only {{ $value | humanizePercentage }} of the volume is free. When it fills, writes to it fail: the database refuses mail, attachments cannot be stored. Act now."

  # DKIM key age and rotation (moved here from docs/dkim-rotation-alerts.md,
  # #1579). They match the same domain, scrape job and instance, so several
  # API replicas do not cause a many-to-many match.
  - name: restmail-dkim
    rules:
      - alert: DKIMKeyOverdue
        expr: restmail_dkim_key_age_seconds > on(domain, job, instance) group_left() (restmail_dkim_rotation_interval_seconds + 2 * 24 * 60 * 60)
        labels:
          severity: warning
        annotations:
          summary: "DKIM key for {{ $labels.domain }} is overdue"
          description: "The current key exceeds its configured rotation interval plus two days. Check the rotation status and DNS records."
      - alert: DKIMPublicationStuck
        expr: (time() - restmail_dkim_rotation_step_started_seconds > 24 * 60 * 60) and on(domain, job, instance) (restmail_dkim_rotation_state{state="awaiting_publication"} == 1)
        labels:
          severity: warning
        annotations:
          summary: "DKIM publication for {{ $labels.domain }} is stuck"
          description: "The staged record has not resolved for more than 24 hours. Publish the TXT record reported by the rotation status endpoint."
