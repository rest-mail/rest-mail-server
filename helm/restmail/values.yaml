# Default values for restmail (production shape).
#
# These defaults assume:
#   * Real cluster DNS — peer services resolve via in-cluster DNS, no
#     dnsmasq sidecar or testbed DNS server.
#   * A TLS Secret populated by an external operator (cert-manager,
#     external-secrets, manual upload). The chart references it by name.
#   * External Secrets for DB credentials and API keys (not embedded).
#   * Cloud LoadBalancer support for SMTP/IMAP/POP3 mail ports.
#
# For local kind/k3s development against rest-mail/testbed see values-dev.yaml.

# ── Global ────────────────────────────────────────────────────────────────
global:
  # Image registry (override per-image with .image.repository if needed).
  imageRegistry: ghcr.io/rest-mail
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

# ── Mail server identity ──────────────────────────────────────────────────
# Defaults are placeholders — override at install time. The defaults are
# deliberately neutral example.com values so `helm template` renders without
# arguments, but a real install MUST set both to the cluster's real FQDN.
mailserver:
  # Public FQDN the SMTP/IMAP/POP3 gateways announce (HELO, banners).
  hostname: mail.example.com
  # Primary mail domain served.
  domain: example.com

# ── DNS / networking ──────────────────────────────────────────────────────
networking:
  # Use cluster DNS by default. Override to "None" + dnsConfig for testbed.
  dnsPolicy: ClusterFirst
  dnsConfig: {}
  # Optional additional pod-level DNS search/options injected into every pod.
  # For testbed-mode usage see values-dev.yaml.

# ── TLS ───────────────────────────────────────────────────────────────────
tls:
  # Name of an existing Kubernetes Secret of type kubernetes.io/tls.
  # Each gateway pod mounts its tls.crt and tls.key at /certs/, and nothing
  # else from it. The API mounts only its ca.crt, if it has one, to trust peers
  # that certificate's CA issued.
  # Expected keys: tls.crt, tls.key.
  secretName: restmail-tls
  # Mount path inside the pod.
  mountPath: /certs
  # Filename the gateways read for cert/key. The chart maps the Secret's
  # tls.crt/tls.key to these names so existing env vars keep working.
  certFilename: tls.crt
  keyFilename: tls.key

# ── PostgreSQL (mail3) ────────────────────────────────────────────────────
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  # Serve TLS from the mounted certificate so the API/gateways can connect with
  # a secure DB_SSLMODE (see the `db` block). Enabled by default so the chart is
  # deployable in production with encryption on by construction. Turn this off
  # ONLY if you also set db.sslMode=disable + db.allowInsecure=true (acknowledge
  # an in-cluster cleartext link) or point at an external TLS-capable database.
  tls:
    enabled: true
    # Certificate source. Empty reuses the shared tls.secretName; the postgres
    # server certificate needs a SAN covering the in-cluster Service DNS name if
    # clients use verify-full.
    secretName: ""
    mountPath: /certs
    certFilename: tls.crt
    keyFilename: tls.key
  # Empty: the chart makes the credentials itself, keeps them across upgrades,
  # and keeps them when uninstalled (templates/postgres-secret.yaml) — nothing to
  # prepare. Or name a Secret you manage, with keys POSTGRES_USER,
  # POSTGRES_PASSWORD and POSTGRES_DB. Tools that render without a cluster
  # (Argo CD, `helm template`) cannot keep generated values, so need this.
  existingSecret: ""
  # Only when the chart makes the Secret. Empty: user and database "restmail",
  # and a generated password. An external database (enabled: false) needs its
  # password here or in existingSecret.
  auth:
    username: ""
    password: ""
    database: ""
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    storageClass: ""
    size: 20Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# ── Database transport (DB_SSLMODE / DB_ALLOW_INSECURE) ────────────────────
# The API and every gateway open a Postgres connection. In production the boot
# validator refuses a cleartext DB link unless it is either encrypted (a secure
# sslMode) or explicitly acknowledged. These knobs drive that decision.
db:
  # libpq sslmode used in the DSN. Secure modes (require / verify-ca /
  # verify-full) encrypt DB traffic and are the production default; they require
  # the server to serve TLS (bundled Postgres does when postgres.tls.enabled).
  # verify-full additionally checks the server certificate hostname.
  sslMode: require
  # Acknowledge a cleartext DB link (sslMode disable/allow/prefer) as an
  # already-secured/private segment. Only meaningful with an insecure sslMode;
  # leave false whenever sslMode is a secure mode.
  allowInsecure: false

# ── Internal mTLS (gateways ⇄ API machine channel) ─────────────────────────
# The API's gateway-facing routes — GET /api/mailboxes (recipient-existence
# oracle) and POST /api/v1/messages/deliver (inbound delivery trusting a
# caller-supplied client_ip/helo) — are machine-to-machine, not user-facing.
# With mTLS enabled the API serves them ONLY on a mutually authenticated TLS
# listener (never the public API port), and the gateways present a client
# certificate to reach it. This is the secure-by-construction default. Disabling
# it makes the API refuse to boot in production unless api.internalRoutesAllowPublic
# acknowledges an out-of-band network trust boundary (NetworkPolicy/firewall).
internalMtls:
  enabled: true
  # Port of the API's dedicated internal mTLS listener (separate from api.port).
  port: 8443
  # In-pod mount path for the CA + certificate material.
  mountPath: /etc/restmail/internal-mtls
  # Bring your own trust material (e.g. cert-manager) via a Secret with keys
  # ca.crt, server.crt, server.key, client.crt, client.key. Empty → the chart
  # mints a self-signed internal CA and server/client certs on first install and
  # reuses them across upgrades. The CA's private key is never stored: it exists
  # only while the chart renders, so nothing in the cluster can sign another
  # certificate the API would accept. Each pod mounts the CA certificate and its
  # own keypair only (the API the server's, the gateways the client's), and
  # never a key your Secret may also hold.
  existingSecret: ""

# ── REST API ──────────────────────────────────────────────────────────────
api:
  replicaCount: 1
  image:
    repository: ghcr.io/rest-mail/api
    tag: ""        # falls back to .Chart.AppVersion when empty
    pullPolicy: ""
  # Empty: the chart makes JWT_SECRET, MASTER_KEY and JS_FILTER_TOKEN itself,
  # keeps them across upgrades, and keeps them when uninstalled
  # (templates/api-secret.yaml) — nothing to prepare. MASTER_KEY encrypts
  # private keys at rest, so it must never change. Or name a Secret you manage,
  # with keys JWT_SECRET, MASTER_KEY and JS_FILTER_TOKEN (any random string of
  # 16 characters or more: the API and the JS filter sidecar both read it), and
  # optionally BOOTSTRAP_ADMIN_PASSWORD. Tools that render without a cluster
  # (Argo CD, `helm template`) cannot keep generated values, so need this.
  existingSecret: ""
  # Only when the chart makes the Secret. Empty: generated once, then kept.
  jwtSecret: ""
  masterKey: ""
  # REQUIRED. The first admin's password, and the only way into a server nobody
  # has signed in to yet. The chart will not invent one: whoever installs has
  # somewhere to keep a secret and a chart does not, so a generated password
  # would be one nobody could retrieve. Make one with `chore install:password`,
  # or `openssl rand -base64 24`. 16 characters or more.
  #
  # Whoever signs in with it must immediately choose their own password and
  # enroll an authenticator, after which it stops working. It also expires 72
  # hours after it is first applied, so an install nobody finishes does not sit
  # on the internet with a live admin credential. Changing it before the admin
  # has chosen a password replaces it and starts the 72 hours again; after,
  # changing it does nothing.
  bootstrapAdminPassword: ""
  # Or, instead of the password, a bcrypt hash of it (`restmail password-hash`).
  # A deploy tool can hold that as plain config — committed, readable by anyone
  # who reads the repository — and nobody can sign in with it: the password is
  # shown only to whoever installs. Everything above holds for it the same way.
  bootstrapAdminPasswordHash: ""
  # The first admin's name.
  bootstrapAdminUsername: admin
  port: 8080
  environment: production
  logLevel: info
  # The API process never terminates TLS itself — a front proxy/ingress does.
  # In production the boot validator refuses to serve auth traffic in cleartext
  # unless this acknowledges that a TLS-terminating reverse proxy fronts it.
  # Keep true and ensure an ingress/proxy is in place (see api.ingress).
  tlsTerminatedByProxy: true
  # Only consulted when internalMtls.enabled=false. Acknowledges that an
  # out-of-band network trust boundary (a NetworkPolicy or firewall restricting
  # the API port to the gateways) protects the gateway-facing internal routes,
  # so the API may serve them unauthenticated on the public listener. Without
  # either mTLS or this acknowledgement, the API refuses to boot in production.
  internalRoutesAllowPublic: false
  # Public keys of the server's owners, one per line in authorized_keys format
  # (e.g. the contents of ~/.ssh/id_ed25519.pub). Whoever holds a matching
  # private key can let an admin back in (`restmail reset-admin`) from anywhere
  # the API is reachable, when every other way in is lost. Public keys, so not
  # secret. Empty: that is possible only with `chore password:reset`, or
  # `restmail-api mint-token` on the server itself.
  ownerKeys: ""
  # Public keys, in the same format, that may only read which version the
  # server runs, its commit, and when it was built and started
  # (`restmail status --key`): how a deploy is confirmed from outside. They can
  # do nothing else; owner keys can read it too. Not secret.
  statusKeys: ""
  # Push notifications to the REST Mail iPhone app. Off by default. When on, the
  # server tells a signed-in phone that mail has reached an inbox, with the
  # account and its unread count and nothing of the mail: the app fetches that
  # from the server itself, so none of it passes through Apple.
  push:
    apns:
      enabled: false
      # The APNs auth key (.p8) comes from a Secret you make; it never goes in
      # these values. For example:
      #   kubectl create secret generic restmail-apns \
      #     --from-file=AuthKey.p8=AuthKey_ABC123DEFG.p8
      existingSecret: ""
      # The key in that Secret the .p8 is under.
      secretKey: AuthKey.p8
      # Shown with the key in the Apple Developer portal (Keys). Not secret.
      keyId: ""
      # The developer team the key belongs to (Membership details). Not secret.
      teamId: ""
      # The app's bundle id. One key serves App Store, TestFlight and Xcode
      # builds alike.
      topic: com.antimatterstudios.restmail
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    path: /api
    tls:
      enabled: false
      secretName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  attachments:
    persistence:
      enabled: true
      storageClass: ""
      size: 20Gi
      accessMode: ReadWriteOnce

# ── JS filter sidecar ─────────────────────────────────────────────────────
# Runs the javascript filters' scripts for the API, each in its own QuickJS
# WebAssembly sandbox. It runs one only for a request with JS_FILTER_TOKEN,
# from the API Secret, and the NetworkPolicy lets only the API reach it.
jsFilter:
  replicaCount: 1
  image:
    repository: ghcr.io/rest-mail/js-filter
    tag: ""
    pullPolicy: ""
  port: 3100
  service:
    type: ClusterIP
    port: 3100
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── SMTP gateway ──────────────────────────────────────────────────────────
smtpGateway:
  # The gateway serves mail to the outside world on privileged ports, which a
  # cluster can only give it through a LoadBalancer that actually has an address
  # to hand out. Turn it off to run the REST API alone — on bare metal without a
  # load balancer the Service would sit pending forever, and nothing would say
  # why. The API is a complete product without the protocol gateways; they are
  # how traditional clients reach it, not how it works.
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/rest-mail/smtp-gateway
    tag: ""
    pullPolicy: ""
  # Client access is implicit TLS only: submission is 465, and there is no 587.
  # 25 is for other mail servers. It always offers STARTTLS and never AUTH, and
  # takes mail from a server that will not upgrade (RFC 3207 §4), recording it
  # as unencrypted (#292).
  ports:
    inbound: 25
    submissionTLS: 465
  # What the gateway listens on inside the pod. The Service maps the public
  # ports above onto these, so the gateway runs as an ordinary user with no
  # capability at all: binding below 1024 would need NET_BIND_SERVICE.
  containerPorts:
    inbound: 10025
    submissionTLS: 10465
  queueWorkers: 4
  # Max accepted SMTP message size in bytes (drives both the EHLO SIZE
  # advertisement and DATA enforcement). Empty = server default (10 MiB).
  # Must be positive when set; the gateway refuses to start on 0/negative.
  maxMessageSize: ""
  # Anti-slowloris message-transfer policy, enforced only while a message
  # body is being transferred (DATA/BDAT). Empty = server defaults.
  # minTransferRate: average rate floor in bytes/sec after the grace period
  # (default 16384); quote "0" (string, not int) to disable the floor.
  # transferGracePeriod: seconds of no enforcement at transfer start
  # (default 60). transferStallTimeout: seconds of zero bytes before the
  # connection is dropped (default 300).
  minTransferRate: ""
  transferGracePeriod: ""
  transferStallTimeout: ""
  logLevel: info
  environment: production
  service:
    type: LoadBalancer
    annotations: {}
    externalTrafficPolicy: Local
    # loadBalancerIP: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# ── IMAP gateway ──────────────────────────────────────────────────────────
imapGateway:
  # See smtpGateway.enabled. Off means no IMAP clients, not a degraded API.
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/rest-mail/imap-gateway
    tag: ""
    pullPolicy: ""
  # Implicit TLS only; there is no 143.
  ports:
    tls: 993
  # Listened on inside the pod; the Service maps 993 onto it. See smtpGateway.
  containerPorts:
    tls: 10993
  logLevel: info
  environment: production
  service:
    type: LoadBalancer
    annotations: {}
    externalTrafficPolicy: Local
    # loadBalancerIP: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# ── POP3 gateway ──────────────────────────────────────────────────────────
pop3Gateway:
  # See smtpGateway.enabled. Off means no POP3 clients, not a degraded API.
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/rest-mail/pop3-gateway
    tag: ""
    pullPolicy: ""
  # Implicit TLS only; there is no 110.
  ports:
    tls: 995
  # Listened on inside the pod; the Service maps 995 onto it. See smtpGateway.
  containerPorts:
    tls: 10995
  logLevel: info
  environment: production
  service:
    type: LoadBalancer
    annotations: {}
    externalTrafficPolicy: Local
    # loadBalancerIP: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# ── Web apps: webmail and the admin webmail ───────────────────────────────
# Each is served at the root of a host of its own, and that host's Ingress
# also sends /api to the API: the apps sign in with SameSite=Strict cookies and
# their CSP allows connect-src 'self' only, so the API has to be on the app's
# own origin. There is no CORS to configure. A cookie belongs to the host that
# set it, so signing in on one app does not sign you in on the other.
#
# The host defaults to webmail.<mailserver.domain> / admin.<mailserver.domain>.
# Turning an app off removes its Deployment, Service, Ingress and
# NetworkPolicy. The image tag follows appVersion, like every other image.
webmail:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/rest-mail/webmail
    tag: ""        # falls back to .Chart.AppVersion when empty
    pullPolicy: ""
  service:
    type: ClusterIP
    port: 8080
  ingress:
    className: ""
    annotations: {}
    # Empty: webmail.<mailserver.domain>.
    host: ""
    tls:
      enabled: false
      # Empty: <release>-webmail-tls.
      secretName: ""
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 64Mi

admin:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/rest-mail/admin
    tag: ""        # falls back to .Chart.AppVersion when empty
    pullPolicy: ""
  service:
    type: ClusterIP
    port: 8080
  ingress:
    className: ""
    # Also where a source-address restriction goes, in your ingress
    # controller's own terms (a Traefik ipAllowList middleware, ingress-nginx's
    # whitelist-source-range). The chart has no controller-neutral way to say
    # it, and the API stays reachable on its own host either way.
    annotations: {}
    # Empty: admin.<mailserver.domain>.
    host: ""
    tls:
      enabled: false
      # Empty: <release>-admin-tls.
      secretName: ""
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 64Mi

# ── Pod-level extras (security, scheduling) ───────────────────────────────
# Every workload already gets a hardened per-component securityContext by
# default (runAsNonRoot, seccompProfile RuntimeDefault, all capabilities
# dropped, read-only rootfs where feasible). The protocol gateways run as uid
# 10001 with no capability at all: they listen on unprivileged ports, and their
# Services map the public mail ports onto them. The maps below are deep-merged
# ON TOP of those defaults (values here win), so set a field only to override
# the baseline cluster-wide.
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

# ── NetworkPolicy ─────────────────────────────────────────────────────────
# Default-deny ingress+egress for all chart pods, with least-privilege allow
# rules (DNS, API<->DB, gateway<->API/DB, public mail/API ingress, SMTP
# outbound delivery). Requires a NetworkPolicy-enforcing CNI. Set enabled=false
# on clusters whose CNI does not enforce policy.
networkPolicy:
  enabled: true

# ── Service account ───────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
  annotations: {}
  # No workload talks to the Kubernetes API, so the projected token is never
  # mounted (set on the ServiceAccount and every pod spec).
  automountServiceAccountToken: false
