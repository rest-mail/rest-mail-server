# Default values for restmail (production shape).
#
# These defaults assume:
#   * Real cluster DNS — peer services resolve via in-cluster DNS, no
#     dnsmasq sidecar or testbed DNS server.
#   * A TLS Secret populated by an external operator (cert-manager,
#     external-secrets, manual upload). The chart references it by name.
#   * External Secrets for DB credentials and API keys (not embedded).
#   * Cloud LoadBalancer support for SMTP/IMAP/POP3 mail ports.
#
# For local kind/k3s development against rest-mail/testbed see values-dev.yaml.

# ── Global ────────────────────────────────────────────────────────────────
global:
  # Image registry (override per-image with .image.repository if needed).
  imageRegistry: ghcr.io/rest-mail
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

# ── Mail server identity ──────────────────────────────────────────────────
# Defaults are placeholders — override at install time. The defaults are
# deliberately neutral example.com values so `helm template` renders without
# arguments, but a real install MUST set both to the cluster's real FQDN.
mailserver:
  # Public FQDN the SMTP/IMAP/POP3 gateways announce (HELO, banners).
  hostname: mail.example.com
  # Primary mail domain served.
  domain: example.com

# ── DNS / networking ──────────────────────────────────────────────────────
networking:
  # Use cluster DNS by default. Override to "None" + dnsConfig for testbed.
  dnsPolicy: ClusterFirst
  dnsConfig: {}
  # Optional additional pod-level DNS search/options injected into every pod.
  # For testbed-mode usage see values-dev.yaml.

# ── TLS ───────────────────────────────────────────────────────────────────
tls:
  # Name of an existing Kubernetes Secret of type kubernetes.io/tls.
  # Mounted at /certs/ in every gateway pod.
  # Expected keys: tls.crt, tls.key.
  secretName: restmail-tls
  # Mount path inside the pod.
  mountPath: /certs
  # Filename the gateways read for cert/key. The chart maps the Secret's
  # tls.crt/tls.key to these names so existing env vars keep working.
  certFilename: tls.crt
  keyFilename: tls.key

# ── PostgreSQL (mail3) ────────────────────────────────────────────────────
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  # Serve TLS from the mounted certificate so the API/gateways can connect with
  # a secure DB_SSLMODE (see the `db` block). Enabled by default so the chart is
  # deployable in production with encryption on by construction. Turn this off
  # ONLY if you also set db.sslMode=disable + db.allowInsecure=true (acknowledge
  # an in-cluster cleartext link) or point at an external TLS-capable database.
  tls:
    enabled: true
    # Certificate source. Empty reuses the shared tls.secretName; the postgres
    # server certificate needs a SAN covering the in-cluster Service DNS name if
    # clients use verify-full.
    secretName: ""
    mountPath: /certs
    certFilename: tls.crt
    keyFilename: tls.key
  # Reference an existing secret with keys: POSTGRES_PASSWORD, POSTGRES_USER,
  # POSTGRES_DB. Setting this disables embedded credentials below.
  existingSecret: restmail-postgres
  auth:
    username: ""
    password: ""
    database: ""
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    storageClass: ""
    size: 20Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# ── Database transport (DB_SSLMODE / DB_ALLOW_INSECURE) ────────────────────
# The API and every gateway open a Postgres connection. In production the boot
# validator refuses a cleartext DB link unless it is either encrypted (a secure
# sslMode) or explicitly acknowledged. These knobs drive that decision.
db:
  # libpq sslmode used in the DSN. Secure modes (require / verify-ca /
  # verify-full) encrypt DB traffic and are the production default; they require
  # the server to serve TLS (bundled Postgres does when postgres.tls.enabled).
  # verify-full additionally checks the server certificate hostname.
  sslMode: require
  # Acknowledge a cleartext DB link (sslMode disable/allow/prefer) as an
  # already-secured/private segment. Only meaningful with an insecure sslMode;
  # leave false whenever sslMode is a secure mode.
  allowInsecure: false

# ── Internal mTLS (gateways ⇄ API machine channel) ─────────────────────────
# The API's gateway-facing routes — GET /api/mailboxes (recipient-existence
# oracle) and POST /api/v1/messages/deliver (inbound delivery trusting a
# caller-supplied client_ip/helo) — are machine-to-machine, not user-facing.
# With mTLS enabled the API serves them ONLY on a mutually authenticated TLS
# listener (never the public API port), and the gateways present a client
# certificate to reach it. This is the secure-by-construction default. Disabling
# it makes the API refuse to boot in production unless api.internalRoutesAllowPublic
# acknowledges an out-of-band network trust boundary (NetworkPolicy/firewall).
internalMtls:
  enabled: true
  # Port of the API's dedicated internal mTLS listener (separate from api.port).
  port: 8443
  # In-pod mount path for the CA + certificate material.
  mountPath: /etc/restmail/internal-mtls
  # Bring your own trust material (e.g. cert-manager) via a Secret with keys
  # ca.crt, server.crt, server.key, client.crt, client.key. Empty → the chart
  # mints a self-signed internal CA and server/client certs on first install and
  # reuses them across upgrades.
  existingSecret: ""

# ── REST API ──────────────────────────────────────────────────────────────
api:
  replicaCount: 1
  image:
    repository: ghcr.io/rest-mail/api
    tag: ""        # falls back to .Chart.AppVersion when empty
    pullPolicy: ""
  # Reference an existing secret with keys: JWT_SECRET, MASTER_KEY, DB_PASS.
  existingSecret: restmail-api
  # Used only when existingSecret is unset (development / values-dev.yaml).
  jwtSecret: ""
  masterKey: ""
  port: 8080
  environment: production
  logLevel: info
  # The API process never terminates TLS itself — a front proxy/ingress does.
  # In production the boot validator refuses to serve auth traffic in cleartext
  # unless this acknowledges that a TLS-terminating reverse proxy fronts it.
  # Keep true and ensure an ingress/proxy is in place (see api.ingress).
  tlsTerminatedByProxy: true
  # Only consulted when internalMtls.enabled=false. Acknowledges that an
  # out-of-band network trust boundary (a NetworkPolicy or firewall restricting
  # the API port to the gateways) protects the gateway-facing internal routes,
  # so the API may serve them unauthenticated on the public listener. Without
  # either mTLS or this acknowledgement, the API refuses to boot in production.
  internalRoutesAllowPublic: false
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    path: /api
    tls:
      enabled: false
      secretName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  attachments:
    persistence:
      enabled: true
      storageClass: ""
      size: 20Gi
      accessMode: ReadWriteOnce

# ── JS filter sidecar ─────────────────────────────────────────────────────
jsFilter:
  replicaCount: 1
  image:
    repository: ghcr.io/rest-mail/js-filter
    tag: ""
    pullPolicy: ""
  port: 3100
  service:
    type: ClusterIP
    port: 3100
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── SMTP gateway ──────────────────────────────────────────────────────────
smtpGateway:
  replicaCount: 1
  image:
    repository: ghcr.io/rest-mail/smtp-gateway
    tag: ""
    pullPolicy: ""
  ports:
    inbound: 25
    submission: 587
    submissionTLS: 465
  queueWorkers: 4
  # Max accepted SMTP message size in bytes (drives both the EHLO SIZE
  # advertisement and DATA enforcement). Empty = server default (10 MiB).
  # Must be positive when set; the gateway refuses to start on 0/negative.
  maxMessageSize: ""
  # Anti-slowloris message-transfer policy, enforced only while a message
  # body is being transferred (DATA/BDAT). Empty = server defaults.
  # minTransferRate: average rate floor in bytes/sec after the grace period
  # (default 16384); quote "0" (string, not int) to disable the floor.
  # transferGracePeriod: seconds of no enforcement at transfer start
  # (default 60). transferStallTimeout: seconds of zero bytes before the
  # connection is dropped (default 300).
  minTransferRate: ""
  transferGracePeriod: ""
  transferStallTimeout: ""
  logLevel: info
  environment: production
  service:
    type: LoadBalancer
    annotations: {}
    externalTrafficPolicy: Local
    # loadBalancerIP: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# ── IMAP gateway ──────────────────────────────────────────────────────────
imapGateway:
  replicaCount: 1
  image:
    repository: ghcr.io/rest-mail/imap-gateway
    tag: ""
    pullPolicy: ""
  ports:
    plain: 143
    tls: 993
  logLevel: info
  environment: production
  service:
    type: LoadBalancer
    annotations: {}
    externalTrafficPolicy: Local
    # loadBalancerIP: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# ── POP3 gateway ──────────────────────────────────────────────────────────
pop3Gateway:
  replicaCount: 1
  image:
    repository: ghcr.io/rest-mail/pop3-gateway
    tag: ""
    pullPolicy: ""
  ports:
    plain: 110
    tls: 995
  logLevel: info
  environment: production
  service:
    type: LoadBalancer
    annotations: {}
    externalTrafficPolicy: Local
    # loadBalancerIP: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# ── Pod-level extras (security, scheduling) ───────────────────────────────
# Every workload already gets a hardened per-component securityContext by
# default (runAsNonRoot where the image supports it, seccompProfile
# RuntimeDefault, all capabilities dropped, read-only rootfs where feasible).
# The protocol gateways keep a root UID with only NET_BIND_SERVICE added,
# because their images bind privileged ports (<1024) and carry no file
# capabilities. The maps below are deep-merged ON TOP of those defaults (values
# here win), so set a field only to override the baseline cluster-wide.
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

# ── NetworkPolicy ─────────────────────────────────────────────────────────
# Default-deny ingress+egress for all chart pods, with least-privilege allow
# rules (DNS, API<->DB, gateway<->API/DB, public mail/API ingress, SMTP
# outbound delivery). Requires a NetworkPolicy-enforcing CNI. Set enabled=false
# on clusters whose CNI does not enforce policy.
networkPolicy:
  enabled: true

# ── Service account ───────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
  annotations: {}
  # No workload talks to the Kubernetes API, so the projected token is never
  # mounted (set on the ServiceAccount and every pod spec).
  automountServiceAccountToken: false
