apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "restmail.componentName" (list . "api") }}
  labels:
    {{- include "restmail.componentLabels" (list . "api") | nindent 4 }}
data:
  API_PORT: {{ .Values.api.port | quote }}
  ENVIRONMENT: {{ .Values.api.environment | quote }}
  LOG_LEVEL: {{ .Values.api.logLevel | quote }}
  # The API never terminates TLS itself; a front proxy/ingress does. In
  # production the boot validator refuses to serve cleartext auth traffic unless
  # this acknowledgement is set. Keep a TLS-terminating reverse proxy in front.
  API_TLS_TERMINATED_BY_PROXY: {{ .Values.api.tlsTerminatedByProxy | quote }}
  {{- if and (not .Values.internalMtls.enabled) .Values.api.internalRoutesAllowPublic }}
  # Internal mTLS is disabled; the operator acknowledges an out-of-band network
  # trust boundary protects the gateway-facing routes on the public listener.
  INTERNAL_ROUTES_ALLOW_PUBLIC: "true"
  {{- end }}
  {{- if not (kindIs "invalid" .Values.api.setupLinkBase) }}
  # Where the link a fresh install prints points. Empty involves no site at
  # all: the link is then restmail://setup, which only the app can open.
  RESTMAIL_SETUP_LINK_BASE: {{ .Values.api.setupLinkBase | quote }}
  {{- end }}
  {{- with .Values.api.ownerKeys }}
  # Public keys of whoever owns this server, in authorized_keys format. Holding
  # a matching private key is what lets `restmail setup` claim a fresh install
  # and `restmail reset-admin` let an admin back in, over the public API.
  RESTMAIL_OWNER_KEYS: {{ . | quote }}
  {{- end }}
