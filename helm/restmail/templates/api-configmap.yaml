apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "restmail.componentName" (list . "api") }}
  labels:
    {{- include "restmail.componentLabels" (list . "api") | nindent 4 }}
data:
  TLSRPT_REPORT_ADDRESS: {{ .Values.api.tlsReportAddress | quote }}
  RESTMAIL_AUDIT_ANCHOR_EMAIL_ENABLED: {{ .Values.api.auditAnchorEmail.enabled | quote }}
  RESTMAIL_AUDIT_ANCHOR_EMAIL_TO: {{ .Values.api.auditAnchorEmail.to | quote }}
  RESTMAIL_AUDIT_ANCHOR_HTTPS_URL: {{ .Values.api.auditAnchorHTTPS.url | quote }}
  {{- if .Values.api.auditAnchorS3.bucket }}
  RESTMAIL_AUDIT_ANCHOR_S3_BUCKET: {{ .Values.api.auditAnchorS3.bucket | quote }}
  RESTMAIL_AUDIT_ANCHOR_S3_ENDPOINT: {{ .Values.api.auditAnchorS3.endpoint | quote }}
  RESTMAIL_AUDIT_ANCHOR_S3_REGION: {{ .Values.api.auditAnchorS3.region | quote }}
  RESTMAIL_AUDIT_ANCHOR_S3_PREFIX: {{ .Values.api.auditAnchorS3.prefix | quote }}
  RESTMAIL_AUDIT_ANCHOR_S3_FORCE_PATH_STYLE: {{ .Values.api.auditAnchorS3.forcePathStyle | quote }}
  {{- end }}
  API_PORT: {{ .Values.api.port | quote }}
  RESTMAIL_RECOVERY_EMAIL_BASE_URL: {{ .Values.api.recoveryEmailBaseURL | default "" | quote }}
  # Public HTTPS delivery host advertised by /.well-known/restmail (#291).
  GATEWAY_HOSTNAME: {{ .Values.mailserver.hostname | quote }}
  ENVIRONMENT: {{ .Values.api.environment | quote }}
  LOG_LEVEL: {{ .Values.api.logLevel | quote }}
  MAX_OWNED_ACCOUNTS: {{ .Values.api.maxOwnedAccounts | default 0 | quote }}
  ATTACHMENT_STORAGE_TYPE: {{ .Values.api.attachments.storageType | quote }}
  {{- if eq .Values.api.attachments.storageType "s3" }}
  ATTACHMENT_S3_ENDPOINT: {{ include "restmail.attachments.endpoint" . | quote }}
  ATTACHMENT_S3_REGION: {{ include "restmail.attachments.region" . | quote }}
  ATTACHMENT_S3_BUCKET: {{ include "restmail.attachments.bucket" . | quote }}
  ATTACHMENT_S3_PREFIX: {{ .Values.api.attachments.s3.prefix | quote }}
  ATTACHMENT_S3_FORCE_PATH_STYLE: {{ .Values.api.attachments.s3.forcePathStyle | quote }}
  {{- end }}
  # The API never terminates TLS itself; a front proxy/ingress does. In
  # production the boot validator refuses to serve cleartext auth traffic unless
  # this acknowledgement is set. Keep a TLS-terminating reverse proxy in front.
  API_TLS_TERMINATED_BY_PROXY: {{ .Values.api.tlsTerminatedByProxy | quote }}
  {{- if and (not .Values.internalMtls.enabled) .Values.api.internalRoutesAllowPublic }}
  # Internal mTLS is disabled; the operator acknowledges an out-of-band network
  # trust boundary protects the gateway-facing routes on the public listener.
  INTERNAL_ROUTES_ALLOW_PUBLIC: "true"
  {{- end }}
  {{- with .Values.api.ownerKeys }}
  # Trusted initial public keys, imported into PostgreSQL only while its owner
  # registry is empty. Recovery reads the database, not this ConfigMap.
  RESTMAIL_OWNER_KEYS: {{ . | quote }}
  {{- end }}
  {{- with .Values.api.statusKeys }}
  # Public keys that may only read what the server runs (`restmail status
  # --key`), in the same format.
  RESTMAIL_STATUS_KEYS: {{ . | quote }}
  {{- end }}
  {{- with .Values.api.push.apns }}
  {{- if .enabled }}
  # Push notifications through APNs. The key file is mounted from the Secret
  # api.push.apns.existingSecret names (templates/api-deployment.yaml).
  RESTMAIL_APNS_KEY_FILE: "/etc/restmail/apns/AuthKey.p8"
  RESTMAIL_APNS_KEY_ID: {{ .keyId | quote }}
  RESTMAIL_APNS_TEAM_ID: {{ .teamId | quote }}
  RESTMAIL_APNS_TOPIC: {{ .topic | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.api.push.webpush }}
  {{- if .enabled }}
  # Web Push to browsers. The VAPID key is mounted from the Secret
  # api.push.webpush.existingSecret names (templates/api-deployment.yaml).
  RESTMAIL_WEBPUSH_VAPID_KEY_FILE: "/etc/restmail/vapid/vapid.pem"
  RESTMAIL_WEBPUSH_VAPID_SUBJECT: {{ required "api.push.webpush.subject is required (mailto: or https:)" .subject | quote }}
  {{- end }}
  {{- end }}
