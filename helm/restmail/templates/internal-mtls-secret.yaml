{{- if and .Values.internalMtls.enabled (not .Values.internalMtls.existingSecret) }}
{{- /*
Internal mTLS trust material for the gateway<->API machine channel. The chart
generates a self-signed internal CA and, from it, a server certificate (mounted
on the API, SANs covering the API Service DNS names so the gateways' hostname
verification passes) and a client certificate (mounted on the three gateways).

The CA's private key is not in the Secret: genCA's key lives only while the
chart renders, signs the two certificates and is gone. No pod, and nobody who
can read the Secret, can sign another certificate the API would accept. The
cost is that renewing either certificate means a new CA: delete the Secret and
upgrade, and every pod picks up the new set when it restarts.

lookup reuses the existing Secret on upgrade: regenerating the CA every
`helm upgrade` would break the running trust domain until every pod restarted.
On first install (or `helm template` with no cluster) lookup returns empty and a
fresh CA/certs are minted. Operators who prefer to manage certs externally
(e.g. cert-manager) set internalMtls.existingSecret and this template is skipped.
*/ -}}
{{- $secretName := include "restmail.internalMtls.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $data := dict }}
{{- if $existing }}
{{- $data = $existing.data }}
{{- else }}
{{- $api := include "restmail.componentName" (list . "api") }}
{{- $ns := .Release.Namespace }}
{{- $altNames := list $api (printf "%s.%s" $api $ns) (printf "%s.%s.svc" $api $ns) (printf "%s.%s.svc.cluster.local" $api $ns) }}
{{- $ca := genCA "restmail-internal-ca" 3650 }}
{{- $server := genSignedCert $api (list) $altNames 3650 $ca }}
{{- $client := genSignedCert "restmail-gateway" (list) (list) 3650 $ca }}
{{- $data = dict "ca.crt" ($ca.Cert | b64enc) "server.crt" ($server.Cert | b64enc) "server.key" ($server.Key | b64enc) "client.crt" ($client.Cert | b64enc) "client.key" ($client.Key | b64enc) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "restmail.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ index $data "ca.crt" }}
  server.crt: {{ index $data "server.crt" }}
  server.key: {{ index $data "server.key" }}
  client.crt: {{ index $data "client.crt" }}
  client.key: {{ index $data "client.key" }}
{{- end }}
