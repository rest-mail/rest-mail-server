{{- /*
Garage's keys and config. Each value comes from the Secret an earlier install left
(lookup), else is generated, so an upgrade never changes them. Kept on uninstall,
because the objects on its volume are only reachable with them. Tools that render
without a cluster can't look the old values up, as with the Postgres Secret.
*/ -}}
{{- if .Values.garage.enabled }}
{{- $name := include "restmail.componentName" (list . "garage") }}
{{- $kept := dict }}
{{- range $key, $value := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $_ := set $kept $key ($value | b64dec) }}
{{- end }}
{{- $rpc := get $kept "RPC_SECRET" | default (randAlphaNum 64 | sha256sum) }}
{{- $admin := get $kept "ADMIN_TOKEN" | default (randAlphaNum 64 | sha256sum) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "restmail.componentLabels" (list . "garage") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  RPC_SECRET: {{ $rpc | quote }}
  ADMIN_TOKEN: {{ $admin | quote }}
  ACCESS_KEY_ID: {{ get $kept "ACCESS_KEY_ID" | default (printf "GK%s" (randAlphaNum 64 | sha256sum | trunc 24)) | quote }}
  SECRET_ACCESS_KEY: {{ get $kept "SECRET_ACCESS_KEY" | default (randAlphaNum 64 | sha256sum) | quote }}
  garage.toml: |
    metadata_dir = "/data/meta"
    data_dir = "/data/objects"
    db_engine = "lmdb"
    replication_factor = 1
    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"
    rpc_secret = "{{ $rpc }}"
    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    [admin]
    api_bind_addr = "[::]:3903"
    admin_token = "{{ $admin }}"
{{- end }}
