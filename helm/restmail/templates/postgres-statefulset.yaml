{{- if .Values.postgres.enabled -}}
{{- include "restmail.validate" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "restmail.componentName" (list . "postgres") }}
  labels:
    {{- include "restmail.componentLabels" (list . "postgres") | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "restmail.componentName" (list . "postgres") }}
  selector:
    matchLabels:
      {{- include "restmail.componentSelectorLabels" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "restmail.componentSelectorLabels" (list . "postgres") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "restmail.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- include "restmail.dnsSpec" . | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "restmail.podSecurityContext" (list . "postgres") | nindent 8 }}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "restmail.containerSecurityContext" (list . "postgres") | nindent 12 }}
          {{- if .Values.postgres.tls.enabled }}
          # Serve TLS so the API/gateways can connect with a secure DB_SSLMODE
          # (require / verify-*). The key is mounted root-owned mode 0640 and the
          # pod's fsGroup (70, the alpine postgres gid, set in the pod
          # securityContext) grants the postgres user group-read — the posture
          # Postgres accepts for a root-owned key.
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file={{ .Values.postgres.tls.mountPath }}/{{ .Values.postgres.tls.certFilename }}
            - -c
            - ssl_key_file={{ .Values.postgres.tls.mountPath }}/{{ .Values.postgres.tls.keyFilename }}
          {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "restmail.postgres.secretName" . }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "restmail.postgres.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "restmail.postgres.secretName" . }}
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            {{- if .Values.postgres.tls.enabled }}
            - name: tls
              mountPath: {{ .Values.postgres.tls.mountPath }}
              readOnly: true
            {{- end }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "restmail.componentName" (list . "postgres-data") }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.postgres.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ default .Values.tls.secretName .Values.postgres.tls.secretName }}
            # Root-owned 0640: no world access, group-readable by the fsGroup
            # (postgres gid 70). Postgres refuses a key with any world bits.
            defaultMode: 0640
            items:
              - key: tls.crt
                path: {{ .Values.postgres.tls.certFilename }}
              - key: tls.key
                path: {{ .Values.postgres.tls.keyFilename }}
        {{- end }}
{{- end }}
