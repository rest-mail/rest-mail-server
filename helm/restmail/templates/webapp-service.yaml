{{- range $app := list "webmail" "admin" }}
{{- $v := index $.Values $app }}
{{- if $v.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "restmail.componentName" (list $ $app) }}
  labels:
    {{- include "restmail.componentLabels" (list $ $app) | nindent 4 }}
spec:
  type: {{ $v.service.type }}
  selector:
    {{- include "restmail.componentSelectorLabels" (list $ $app) | nindent 4 }}
  ports:
    - name: http
      port: {{ $v.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
