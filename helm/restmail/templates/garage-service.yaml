{{- if .Values.garage.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "restmail.componentName" (list . "garage") }}
  labels:
    {{- include "restmail.componentLabels" (list . "garage") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 3900
      targetPort: s3
      protocol: TCP
    - name: admin
      port: 3903
      targetPort: admin
      protocol: TCP
  selector:
    {{- include "restmail.componentSelectorLabels" (list . "garage") | nindent 4 }}
{{- end }}
