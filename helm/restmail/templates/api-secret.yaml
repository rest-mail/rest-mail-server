{{- /*
The API's secrets. With api.existingSecret set, that Secret is used and this
renders nothing. Otherwise the chart owns it, so an install needs no secrets
prepared beforehand:

- JWT_SECRET and MASTER_KEY come from values when given, else from the Secret
  an earlier install left (lookup), else they are generated. An upgrade
  therefore never changes them.
- MASTER_KEY encrypts private keys at rest, and a new one leaves every stored
  key unreadable. The Secret is kept when the release is uninstalled
  (resource-policy: keep), so reinstalling under the same name finds it again.
- JS_FILTER_TOKEN is what the API authenticates to the JS filter sidecar with
  (#160). Both pods read it from here. Generated once, like JWT_SECRET, and
  kept; an install from before it existed gets one on its next upgrade.
- BOOTSTRAP_ADMIN_PASSWORD is required. It creates the first admin at startup,
  and is the only way into a server nobody has signed in to yet. The chart
  does not invent one: whoever installs has somewhere to keep a secret and the
  chart does not, and a password nobody can retrieve is worse than none.
  BOOTSTRAP_ADMIN_PASSWORD_HASH, a bcrypt hash of it, does instead: a deploy
  tool can hold that as plain config, and nobody can sign in with it.

`helm template`, and GitOps tools that render without a cluster (Argo CD),
cannot look anything up, so they would generate fresh values on every render.
Give those api.existingSecret instead.
*/ -}}
{{- if not .Values.api.existingSecret }}
{{- $name := include "restmail.componentName" (list . "api") }}
{{- $kept := dict }}
{{- range $key, $value := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $_ := set $kept $key ($value | b64dec) }}
{{- end }}
{{- $password := .Values.api.bootstrapAdminPassword }}
{{- $hash := .Values.api.bootstrapAdminPasswordHash | trim }}
{{- if and $password $hash }}
{{- fail "set api.bootstrapAdminPassword or api.bootstrapAdminPasswordHash, not both" }}
{{- end }}
{{- if not (or $password $hash) }}
{{- $password = get $kept "BOOTSTRAP_ADMIN_PASSWORD" }}
{{- $hash = get $kept "BOOTSTRAP_ADMIN_PASSWORD_HASH" }}
{{- end }}
{{- if not (or $password $hash) }}
{{- fail "api.bootstrapAdminPassword is required: without it the server has no admin and nobody can sign in. Make one with `chore install:password`, or `openssl rand -base64 24`, and keep it — it is the only way in until you have signed in once. (Or give its bcrypt hash, api.bootstrapAdminPasswordHash: `restmail password-hash`.)" }}
{{- end }}
{{- if and $password (lt (len $password) 16) }}
{{- fail "api.bootstrapAdminPassword must be at least 16 characters" }}
{{- end }}
{{- if and $hash (not (regexMatch "^(\\{BLF-CRYPT\\})?\\$2[aby]\\$[0-9]{2}\\$[./A-Za-z0-9]{53}$" $hash)) }}
{{- fail "api.bootstrapAdminPasswordHash must be a bcrypt hash, as `restmail password-hash` makes" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "restmail.componentLabels" (list . "api") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.api.jwtSecret | default (get $kept "JWT_SECRET") | default (randAlphaNum 64) | quote }}
  MASTER_KEY: {{ .Values.api.masterKey | default (get $kept "MASTER_KEY") | default (randAlphaNum 64) | quote }}
  JS_FILTER_TOKEN: {{ get $kept "JS_FILTER_TOKEN" | default (randAlphaNum 64) | quote }}
  {{- if $hash }}
  BOOTSTRAP_ADMIN_PASSWORD_HASH: {{ $hash | quote }}
  {{- else }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ $password | quote }}
  {{- end }}
{{- end }}
