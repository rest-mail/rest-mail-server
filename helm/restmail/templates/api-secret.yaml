{{- /*
The API's secrets. With api.existingSecret set, that Secret is used and this
renders nothing. Otherwise the chart owns it, so an install needs no secrets
prepared beforehand:

- JWT_SECRET and MASTER_KEY come from values when given, else from the Secret
  an earlier install left (lookup), else they are generated. An upgrade
  therefore never changes them.
- MASTER_KEY encrypts private keys at rest, and a new one leaves every stored
  key unreadable. The Secret is kept when the release is uninstalled
  (resource-policy: keep), so reinstalling under the same name finds it again.
- BOOTSTRAP_ADMIN_PASSWORD is set only when api.bootstrapAdminPassword is.
  Supplying one creates the first admin at startup, which turns the printed
  setup code off: it is for installs whose tool can hand the password back,
  such as a Pulumi output.

`helm template`, and GitOps tools that render without a cluster (Argo CD),
cannot look anything up, so they would generate fresh values on every render.
Give those api.existingSecret instead.
*/ -}}
{{- if not .Values.api.existingSecret }}
{{- $name := include "restmail.componentName" (list . "api") }}
{{- $kept := dict }}
{{- range $key, $value := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $_ := set $kept $key ($value | b64dec) }}
{{- end }}
{{- $bootstrap := .Values.api.bootstrapAdminPassword | default (get $kept "BOOTSTRAP_ADMIN_PASSWORD") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "restmail.componentLabels" (list . "api") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.api.jwtSecret | default (get $kept "JWT_SECRET") | default (randAlphaNum 64) | quote }}
  MASTER_KEY: {{ .Values.api.masterKey | default (get $kept "MASTER_KEY") | default (randAlphaNum 64) | quote }}
  {{- with $bootstrap }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
