{{- if .Values.smtpGateway.enabled -}}
{{- $kind := include "restmail.gatewayWorkloadKind" (list .Values.smtpGateway "smtpGateway") -}}
apiVersion: apps/v1
kind: {{ $kind }}
metadata:
  name: {{ include "restmail.componentName" (list . "smtp-gateway") }}
  labels:
    {{- include "restmail.componentLabels" (list . "smtp-gateway") | nindent 4 }}
spec:
  {{- if eq $kind "Deployment" }}
  replicas: {{ .Values.smtpGateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "restmail.componentSelectorLabels" (list . "smtp-gateway") | nindent 6 }}
  template:
    metadata:
      {{- if .Values.smtp.dane.enabled }}
      annotations:
        checksum/dane-config: {{ include (print $.Template.BasePath "/smtp-dane-configmap.yaml") . | sha256sum }}
      {{- end }}
      labels:
        {{- include "restmail.componentSelectorLabels" (list . "smtp-gateway") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "restmail.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      hostname: {{ .Values.mailserver.hostname | replace "." "-" | trunc 63 | trimSuffix "-" }}
      {{- include "restmail.dnsSpec" . | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "restmail.podSecurityContext" (list . "smtp-gateway") | nindent 8 }}
      containers:
        - name: smtp-gateway
          image: "{{ .Values.smtpGateway.image.repository }}:{{ include "restmail.imageTag" (list . .Values.smtpGateway.image.tag) }}"
          imagePullPolicy: {{ include "restmail.imagePullPolicy" (list . .Values.smtpGateway.image.pullPolicy) }}
          securityContext:
            {{- include "restmail.containerSecurityContext" (list . "smtp-gateway") | nindent 12 }}
          ports:
            - name: smtp
              containerPort: {{ .Values.smtpGateway.containerPorts.inbound }}
              protocol: TCP
            - name: submissions
              containerPort: {{ .Values.smtpGateway.containerPorts.submissionTLS }}
              protocol: TCP
          env:
            - name: GATEWAY_HOSTNAME
              value: {{ .Values.mailserver.hostname | quote }}
            - name: API_BASE_URL
              value: {{ include "restmail.api.url" . | quote }}
            - name: SMTP_PORT_INBOUND
              value: {{ .Values.smtpGateway.containerPorts.inbound | quote }}
            - name: SMTP_PORT_SUBMISSION_TLS
              value: {{ .Values.smtpGateway.containerPorts.submissionTLS | quote }}
            {{- with .Values.smtpGateway.maxMessageSize }}
            - name: SMTP_MAX_MESSAGE_SIZE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.smtpGateway.minTransferRate }}
            - name: SMTP_MIN_TRANSFER_RATE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.smtpGateway.transferGracePeriod }}
            - name: SMTP_TRANSFER_GRACE_PERIOD
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.smtpGateway.transferStallTimeout }}
            - name: SMTP_TRANSFER_STALL_TIMEOUT
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.smtp.dane.enabled }}
            - name: DANE_RESOLVER
              value: "127.0.0.1:5353"
            {{- end }}
            - name: QUEUE_WORKERS
              value: {{ .Values.smtpGateway.queueWorkers | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.smtpGateway.logLevel | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.smtpGateway.environment | quote }}
            {{- include "restmail.apiCredsEnv" . | nindent 12 }}
            {{- include "restmail.dbEnv" . | nindent 12 }}
            {{- include "restmail.tlsEnv" . | nindent 12 }}
            {{- if .Values.internalMtls.enabled }}
            {{- include "restmail.internalMtls.clientEnv" . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: tls
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
            {{- if .Values.internalMtls.enabled }}
            {{- include "restmail.internalMtls.volumeMount" . | nindent 12 }}
            {{- end }}
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: smtp
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: smtp
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.smtpGateway.resources | nindent 12 }}
        {{- if .Values.smtp.dane.enabled }}
        - name: dane-resolver
          image: "{{ .Values.smtp.dane.image.repository }}:{{ .Values.smtp.dane.image.tag }}{{ with .Values.smtp.dane.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.smtp.dane.image.pullPolicy }}
          command: ["/usr/sbin/unbound"]
          args: ["-d", "-c", "/etc/restmail-dane/unbound.conf"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 102
            allowPrivilegeEscalation: false
            # Unbound maintains its bundled RFC5011 root trust anchor here.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: dane-config
              mountPath: /etc/restmail-dane
              readOnly: true
          readinessProbe:
            exec:
              command: ["/usr/bin/drill-hc", "-p", "5353", "@127.0.0.1", "health.dane.invalid.", "A"]
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["/usr/bin/drill-hc", "-p", "5353", "@127.0.0.1", "health.dane.invalid.", "A"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.smtp.dane.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
            items:
              - key: tls.crt
                path: {{ .Values.tls.certFilename }}
              - key: tls.key
                path: {{ .Values.tls.keyFilename }}
        {{- if .Values.internalMtls.enabled }}
        {{- include "restmail.internalMtls.volume" (list . "client") | nindent 8 }}
        {{- end }}
        {{- if .Values.smtp.dane.enabled }}
        - name: dane-config
          configMap:
            name: {{ include "restmail.componentName" (list . "smtp-dane") }}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
