{{- if .Values.api.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "restmail.componentName" (list . "api") }}
  labels:
    {{- include "restmail.componentLabels" (list . "api") | nindent 4 }}
  {{- with .Values.api.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.api.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.api.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.api.ingress.host | quote }}
        {{- range .Values.api.mtaSts.hosts }}
        - {{ . | quote }}
        {{- end }}
        {{- range .Values.api.mailDiscovery.domains }}
        - {{ printf "autoconfig.%s" . | quote }}
        - {{ printf "autodiscover.%s" . | quote }}
        {{- end }}
      secretName: {{ default (printf "%s-ingress-tls" (include "restmail.fullname" .)) .Values.api.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.api.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.api.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "restmail.componentName" (list $ "api") }}
                port:
                  number: {{ $.Values.api.service.port }}
          {{- /*
          The documents other mail servers fetch from this host at its root, whatever
          api.ingress.path is: RESTMAIL discovery, which a peer asks the MX host for
          (https://<MX>/.well-known/restmail?domain=...), and TLS-RPT reports posted to
          the rua the domain's _smtp._tls record names (RFC 8460 §3). Then the RESTMAIL
          protocol itself, which discovery names as https://<mail host>/restmail: a peer
          delivers to /restmail/messages there.
          */}}
          {{- range list "/.well-known/restmail" "/.well-known/smtp-tlsrpt" }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: {{ include "restmail.componentName" (list $ "api") }}
                port:
                  number: {{ $.Values.api.service.port }}
          {{- end }}
          - path: /restmail
            pathType: Prefix
            backend:
              service:
                name: {{ include "restmail.componentName" (list $ "api") }}
                port:
                  number: {{ $.Values.api.service.port }}
    {{- range .Values.api.mtaSts.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /.well-known/mta-sts.txt
            pathType: Exact
            backend:
              service:
                name: {{ include "restmail.componentName" (list $ "api") }}
                port:
                  number: {{ $.Values.api.service.port }}
    {{- end }}
    {{- /*
    Where mail apps look for a hosted domain's settings (#1706): Thunderbird and others
    GET /mail/config-v1.1.xml on autoconfig.<domain>, Outlook POSTs
    /autodiscover/autodiscover.xml on autodiscover.<domain>. Each name routes only its
    own document; the API reads the domain from the Host header.
    */}}
    {{- range $domain := .Values.api.mailDiscovery.domains }}
    {{- range list (list "autoconfig" "/mail/config-v1.1.xml") (list "autodiscover" "/autodiscover/autodiscover.xml") }}
    - host: {{ printf "%s.%s" (index . 0) $domain | quote }}
      http:
        paths:
          - path: {{ index . 1 }}
            pathType: Exact
            backend:
              service:
                name: {{ include "restmail.componentName" (list $ "api") }}
                port:
                  number: {{ $.Values.api.service.port }}
    {{- end }}
    {{- end }}
{{- end }}
