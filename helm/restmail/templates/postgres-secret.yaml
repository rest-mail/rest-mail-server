{{- /*
The database credentials. With postgres.existingSecret set, that Secret is
used and this renders nothing. Otherwise the chart owns it:

- For the embedded Postgres, each value comes from postgres.auth.* when given,
  else from the Secret an earlier install left (lookup), else a default: user
  and database "restmail", and a generated password. An upgrade never changes
  them, which matters because the database on its volume only knows the
  password it was created with. Kept on uninstall for the same reason.
- An external database (postgres.enabled: false) has a password the chart
  cannot know, so one must be given: postgres.existingSecret, or
  postgres.auth.password.

As with the API's Secret, tools that render without a cluster cannot look
the old values up: give them postgres.existingSecret.
*/ -}}
{{- if not .Values.postgres.existingSecret }}
{{- $name := include "restmail.componentName" (list . "postgres") }}
{{- $kept := dict }}
{{- range $key, $value := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $_ := set $kept $key ($value | b64dec) }}
{{- end }}
{{- $password := .Values.postgres.auth.password | default (get $kept "POSTGRES_PASSWORD") }}
{{- if and (not $password) (not .Values.postgres.enabled) }}
{{- fail "postgres.enabled is false, so the database is external and the chart cannot know its password: set postgres.existingSecret, or postgres.auth.password" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "restmail.componentLabels" (list . "postgres") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | default (get $kept "POSTGRES_USER") | default "restmail" | quote }}
  POSTGRES_PASSWORD: {{ $password | default (randAlphaNum 32) | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | default (get $kept "POSTGRES_DB") | default "restmail" | quote }}
{{- end }}
