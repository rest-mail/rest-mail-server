{{- include "restmail.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "restmail.componentName" (list . "api") }}
  labels:
    {{- include "restmail.componentLabels" (list . "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  {{- with .Values.api.attachments.persistence }}
  {{- if and .enabled (eq .accessMode "ReadWriteOnce") }}
  # The attachments volume can be mounted by one node at a time. A rolling
  # update starts the new pod before stopping the old one, and a new pod on
  # another node then waits forever to attach a volume the old one still holds,
  # until the deploy times out. Recreate stops the old pod first: a brief gap
  # in service instead of an upgrade that can never finish.
  strategy:
    type: Recreate
  {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "restmail.componentSelectorLabels" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "restmail.componentSelectorLabels" (list . "api") | nindent 8 }}
      annotations:
        # Force redeploy when ConfigMap or Secret content changes.
        checksum/configmap: {{ include (print $.Template.BasePath "/api-configmap.yaml") . | sha256sum }}
        {{- if not .Values.api.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/api-secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "restmail.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- include "restmail.dnsSpec" . | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "restmail.podSecurityContext" (list . "api") | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ include "restmail.imageTag" (list . .Values.api.image.tag) }}"
          imagePullPolicy: {{ include "restmail.imagePullPolicy" (list . .Values.api.image.pullPolicy) }}
          securityContext:
            {{- include "restmail.containerSecurityContext" (list . "api") | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
            {{- if .Values.internalMtls.enabled }}
            - name: internal-mtls
              containerPort: {{ .Values.internalMtls.port }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "restmail.componentName" (list . "api") }}
          env:
            {{- include "restmail.dbEnv" . | nindent 12 }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "restmail.api.secretName" . }}
                  key: JWT_SECRET
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "restmail.api.secretName" . }}
                  key: MASTER_KEY
            # The first account of a fresh install, admin@ the mail domain,
            # made only while no admin exists, holding superadmin, and made to
            # set a new password and enroll 2FA at first sign-in. Optional: a
            # Secret without the password key means no bootstrap account.
            - name: RESTMAIL_BOOTSTRAP_ADMIN_ADDRESS
              value: {{ printf "admin@%s" .Values.mailserver.domain | quote }}
            - name: RESTMAIL_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "restmail.api.secretName" . }}
                  key: BOOTSTRAP_ADMIN_PASSWORD
                  optional: true
            # Or a bcrypt hash of it; the Secret holds one or the other.
            - name: RESTMAIL_BOOTSTRAP_ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ include "restmail.api.secretName" . }}
                  key: BOOTSTRAP_ADMIN_PASSWORD_HASH
                  optional: true
            {{- if .Values.internalMtls.enabled }}
            {{- include "restmail.internalMtls.serverEnv" . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: tls
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
            {{- if .Values.internalMtls.enabled }}
            {{- include "restmail.internalMtls.volumeMount" . | nindent 12 }}
            {{- end }}
            {{- if .Values.api.attachments.persistence.enabled }}
            - name: attachments
              mountPath: /attachments
            {{- end }}
            {{- if .Values.api.push.apns.enabled }}
            - name: apns-key
              mountPath: /etc/restmail/apns
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- if .Values.internalMtls.enabled }}
        {{- include "restmail.internalMtls.volume" (list . "server") | nindent 8 }}
        {{- end }}
        {{- if .Values.api.attachments.persistence.enabled }}
        - name: attachments
          persistentVolumeClaim:
            claimName: {{ include "restmail.componentName" (list . "api-attachments") }}
        {{- end }}
        {{- with .Values.api.push.apns }}
        {{- if .enabled }}
        # The APNs auth key, from a Secret the chart never makes.
        - name: apns-key
          secret:
            secretName: {{ .existingSecret }}
            items:
              - key: {{ .secretKey }}
                path: AuthKey.p8
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
