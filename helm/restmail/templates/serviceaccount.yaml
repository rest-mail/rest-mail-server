{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "restmail.serviceAccountName" . }}
  labels:
    {{- include "restmail.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No workload in this chart talks to the Kubernetes API, so the projected token
# is never needed. Pod specs also set this explicitly (defence in depth).
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
