{{- if and (eq .Values.api.attachments.storageType "s3") (not .Values.api.attachments.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "restmail.componentName" (list . "api-attachments-s3") }}
  labels:
    {{- include "restmail.componentLabels" (list . "api") | nindent 4 }}
type: Opaque
stringData:
  ACCESS_KEY_ID: {{ .Values.api.attachments.s3.accessKeyId | quote }}
  SECRET_ACCESS_KEY: {{ .Values.api.attachments.s3.secretAccessKey | quote }}
{{- end }}
