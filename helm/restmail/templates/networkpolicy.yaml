{{- if .Values.networkPolicy.enabled }}
{{- /*
Default-deny baseline plus least-privilege allow rules. NetworkPolicies are
additive: the first policy denies all ingress and egress for every chart pod,
and each policy below re-opens exactly the paths a component needs. DNS egress
is granted chart-wide so name resolution never breaks.

Requires a CNI that enforces NetworkPolicy (Calico, Cilium, Weave, etc.).
Disable with networkPolicy.enabled=false on clusters without one.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "restmail.fullname" . }}-default-deny
  labels:
    {{- include "restmail.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "restmail.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "restmail.fullname" . }}-allow-dns
  labels:
    {{- include "restmail.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "restmail.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "restmail.componentName" (list . "postgres") }}
  labels:
    {{- include "restmail.componentLabels" (list . "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "restmail.componentSelectorLabels" (list . "postgres") | nindent 6 }}
  policyTypes:
    - Ingress
  # Only the API and the three protocol gateways open DB connections.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "api") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "smtp-gateway") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "imap-gateway") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "pop3-gateway") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "restmail.componentName" (list . "api") }}
  labels:
    {{- include "restmail.componentLabels" (list . "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "restmail.componentSelectorLabels" (list . "api") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Public REST surface: reached by the ingress controller (arbitrary
    # namespace) and by the gateways. Allow ingress to the HTTP port from any
    # source; authn/authz is enforced by the application.
    - ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
  egress:
    {{- if .Values.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "postgres") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.service.port }}
    {{- end }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "js-filter") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.jsFilter.port }}
    # Outbound HTTPS/HTTP for ACME issuance and any remote fetches.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "restmail.componentName" (list . "js-filter") }}
  labels:
    {{- include "restmail.componentLabels" (list . "js-filter") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "restmail.componentSelectorLabels" (list . "js-filter") | nindent 6 }}
  policyTypes:
    - Ingress
  # The sandboxed filter runner is called only by the API.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.jsFilter.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "restmail.componentName" (list . "smtp-gateway") }}
  labels:
    {{- include "restmail.componentLabels" (list . "smtp-gateway") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "restmail.componentSelectorLabels" (list . "smtp-gateway") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Public mail listeners: inbound 25, submission 587, implicit-TLS 465.
    - ports:
        - protocol: TCP
          port: {{ .Values.smtpGateway.ports.inbound }}
        - protocol: TCP
          port: {{ .Values.smtpGateway.ports.submission }}
        - protocol: TCP
          port: {{ .Values.smtpGateway.ports.submissionTLS }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
    {{- if .Values.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "postgres") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.service.port }}
    {{- end }}
    # Outbound delivery to remote MX (25) and smart hosts (465/587), plus
    # MTA-STS policy fetches over HTTPS (443).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 25
        - protocol: TCP
          port: 465
        - protocol: TCP
          port: 587
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "restmail.componentName" (list . "imap-gateway") }}
  labels:
    {{- include "restmail.componentLabels" (list . "imap-gateway") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "restmail.componentSelectorLabels" (list . "imap-gateway") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Public mail access: 143 (STARTTLS) and 993 (implicit TLS).
    - ports:
        - protocol: TCP
          port: {{ .Values.imapGateway.ports.plain }}
        - protocol: TCP
          port: {{ .Values.imapGateway.ports.tls }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
    {{- if .Values.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "postgres") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.service.port }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "restmail.componentName" (list . "pop3-gateway") }}
  labels:
    {{- include "restmail.componentLabels" (list . "pop3-gateway") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "restmail.componentSelectorLabels" (list . "pop3-gateway") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Public mail access: 110 (STLS) and 995 (implicit TLS).
    - ports:
        - protocol: TCP
          port: {{ .Values.pop3Gateway.ports.plain }}
        - protocol: TCP
          port: {{ .Values.pop3Gateway.ports.tls }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
    {{- if .Values.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "postgres") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.service.port }}
    {{- end }}
{{- end }}
