{{- if .Values.networkPolicy.enabled }}
{{- /*
Default-deny baseline plus least-privilege allow rules. NetworkPolicies are
additive: the first policy denies all ingress and egress for every chart pod,
and each policy below re-opens exactly the paths a component needs. DNS egress
is granted chart-wide so name resolution never breaks.

Requires a CNI that enforces NetworkPolicy (Calico, Cilium, Weave, etc.).
Disable with networkPolicy.enabled=false on clusters without one.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "restmail.fullname" . }}-default-deny
  labels:
    {{- include "restmail.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "restmail.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "restmail.fullname" . }}-allow-dns
  labels:
    {{- include "restmail.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "restmail.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "restmail.componentName" (list . "postgres") }}
  labels:
    {{- include "restmail.componentLabels" (list . "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "restmail.componentSelectorLabels" (list . "postgres") | nindent 6 }}
  policyTypes:
    - Ingress
  # Only the API and the three protocol gateways open DB connections.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "api") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "smtp-gateway") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "imap-gateway") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "pop3-gateway") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "restmail.componentName" (list . "api") }}
  labels:
    {{- include "restmail.componentLabels" (list . "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "restmail.componentSelectorLabels" (list . "api") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Public REST surface: reached by the ingress controller (arbitrary
    # namespace) and by the gateways. Allow ingress to the HTTP port from any
    # source; authn/authz is enforced by the application.
    - ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
    {{- if .Values.internalMtls.enabled }}
    # Internal mTLS listener: the gateway-facing machine routes are served here
    # under RequireAndVerifyClientCert, and only the three protocol gateways
    # dial it. Restrict this port to those pods (defence in depth atop mTLS).
    - from:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "smtp-gateway") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "imap-gateway") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "pop3-gateway") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.internalMtls.port }}
    {{- end }}
  egress:
    {{- if .Values.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "postgres") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.service.port }}
    {{- end }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "js-filter") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.jsFilter.port }}
    # Outbound HTTPS/HTTP for ACME issuance and any remote fetches.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "restmail.componentName" (list . "js-filter") }}
  labels:
    {{- include "restmail.componentLabels" (list . "js-filter") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "restmail.componentSelectorLabels" (list . "js-filter") | nindent 6 }}
  policyTypes:
    - Ingress
  # The filter runner is called only by the API, which also authenticates
  # with JS_FILTER_TOKEN (#160). No egress is opened: beyond DNS, the default
  # deny holds, so a script's fetch reaches nothing in or out of the cluster.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.jsFilter.port }}
{{- if .Values.smtpGateway.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "restmail.componentName" (list . "smtp-gateway") }}
  labels:
    {{- include "restmail.componentLabels" (list . "smtp-gateway") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "restmail.componentSelectorLabels" (list . "smtp-gateway") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Public mail listeners: inbound 25 and implicit-TLS submission 465. A
    # policy sees the port the pod listens on, which the Service maps them to.
    - ports:
        - protocol: TCP
          port: {{ .Values.smtpGateway.containerPorts.inbound }}
        - protocol: TCP
          port: {{ .Values.smtpGateway.containerPorts.submissionTLS }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
        {{- if .Values.internalMtls.enabled }}
        - protocol: TCP
          port: {{ .Values.internalMtls.port }}
        {{- end }}
    {{- if .Values.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "postgres") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.service.port }}
    {{- end }}
    # Outbound delivery to remote MX (25) and smart hosts (465/587), plus
    # MTA-STS policy fetches over HTTPS (443).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 25
        - protocol: TCP
          port: 465
        - protocol: TCP
          port: 587
        - protocol: TCP
          port: 443
{{- end }}
{{- if .Values.imapGateway.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "restmail.componentName" (list . "imap-gateway") }}
  labels:
    {{- include "restmail.componentLabels" (list . "imap-gateway") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "restmail.componentSelectorLabels" (list . "imap-gateway") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Public mail access: 993, implicit TLS, on the port the pod listens on.
    - ports:
        - protocol: TCP
          port: {{ .Values.imapGateway.containerPorts.tls }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
        {{- if .Values.internalMtls.enabled }}
        - protocol: TCP
          port: {{ .Values.internalMtls.port }}
        {{- end }}
    {{- if .Values.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "postgres") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.service.port }}
    {{- end }}
{{- end }}
{{- if .Values.pop3Gateway.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "restmail.componentName" (list . "pop3-gateway") }}
  labels:
    {{- include "restmail.componentLabels" (list . "pop3-gateway") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "restmail.componentSelectorLabels" (list . "pop3-gateway") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Public mail access: 995, implicit TLS, on the port the pod listens on.
    - ports:
        - protocol: TCP
          port: {{ .Values.pop3Gateway.containerPorts.tls }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
        {{- if .Values.internalMtls.enabled }}
        - protocol: TCP
          port: {{ .Values.internalMtls.port }}
        {{- end }}
    {{- if .Values.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "restmail.componentSelectorLabels" (list . "postgres") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.service.port }}
    {{- end }}
{{- end }}
{{- range $app := list "webmail" "admin" }}
{{- if (index $.Values $app).enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "restmail.componentName" (list $ $app) }}
  labels:
    {{- include "restmail.componentLabels" (list $ $app) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "restmail.componentSelectorLabels" (list $ $app) | nindent 6 }}
  policyTypes:
    - Ingress
  # Static files, to the ingress controller in whatever namespace it runs. The
  # app itself talks to nothing: the browser reaches the API through the
  # Ingress, so egress stays denied (DNS aside).
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
{{- end }}
{{- end }}
{{- end }}
