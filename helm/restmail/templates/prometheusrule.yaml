{{- if .Values.metrics.prometheusRule.enabled }}
{{- /*
The rules are not written here: files/alerting-rules.yml is the one copy, also
loaded by the compose stack's Prometheus (#1579). Every group goes in except
restmail-disk-node, whose node-exporter series only the compose stack scrapes.
.Files.Get does not run the file through the template engine, so the
{{ $labels.x }} annotations reach Prometheus as written.
*/}}
{{- $file := .Files.Get "files/alerting-rules.yml" | fromYaml }}
{{- if or (hasKey $file "Error") (not $file.groups) }}
{{- fail (printf "files/alerting-rules.yml: no rule groups (%v)" (get $file "Error")) }}
{{- end }}
{{- $groups := list }}
{{- range $file.groups }}
{{- if ne .name "restmail-disk-node" }}
{{- $groups = append $groups . }}
{{- end }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "restmail.fullname" . }}
  labels:
    {{- include "restmail.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- toYaml $groups | nindent 4 }}
{{- end }}
