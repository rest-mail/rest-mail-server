name: CI

on:
  push:
    branches: [main]
  # Every stack layer tests its complete head, including the layers below it.
  # No `edited`: every edit starts a run, and from then on GitHub says the required `CI`
  # is expected, whatever an older run on that head reported (#1876). A retarget to main
  # dispatches this workflow from ci-retarget.yml instead.
  # No `labeled` or `unlabeled`: claim labels must not cancel CI (#1593).
  # The labels the contract gate reads re-run that gate from ci-labels.yml instead.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The Vertrag bump (bump-vertrag.yml) dispatches CI for its branch: a pull request it
  # opens with the workflow's own token starts no checks by itself.
  workflow_dispatch:
    inputs:
      pull-request:
        description: The pull request this run stands in for, which runs the contract gate
        type: string
        default: ""
      base-sha:
        description: The tip of that pull request's base when the run was dispatched
        type: string
        default: ""
  # The merge queue on main (#825) tests each group of pull requests on top of main
  # before merging it, and waits for every required check to report on that group.
  merge_group:

# A pull request's run for an older push or an older base answers nothing: GitHub
# judges the required check by the newest run, so that one supersedes it. Each run
# on main or by dispatch has a group of its own, so every merged commit keeps its result.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

# A merge moves main to the commit the merge queue just tested, so a push by the queue
# would run all of this a second time on the same SHA, about 65 job minutes per merge
# (#1896). Each job's `if` skips that case, and `seed-caches` keeps what those runs used
# to leave behind. Any other push to main runs everything, and so does a dispatch: to
# test main again, use `gh workflow run ci.yml`. Re-running a queue push's run skips again.

permissions:
  contents: read

jobs:
  preflight:
    name: 'Preflight: branch is up to date'
    if: github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runners: ${{ steps.runners.outputs.runners || '{}' }}
    steps:
      - name: Checkout the pull request head, not GitHub's merge commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Require the current base tip in the pull request head
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Preflight: $EVENT_NAME needs no pull request ancestry check."
            exit 0
          fi
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          base_sha=$(git rev-parse "refs/remotes/origin/${BASE_REF}")
          if git merge-base --is-ancestor "$base_sha" "$HEAD_SHA"; then
            echo "Preflight: head $HEAD_SHA contains $BASE_REF ($base_sha)."
            exit 0
          fi
          message="Preflight: this branch (head $HEAD_SHA) is not up to date with $BASE_REF ($base_sha). You cannot push a branch that is not up to date with origin/$BASE_REF ($base_sha). Rebase it onto origin/$BASE_REF first, then push again. Nothing else in this pipeline runs until you do. Run: git fetch origin $BASE_REF && git rebase origin/$BASE_REF"
          echo "::error::$message" >&2
          echo "$message" >&2
          exit 1

      - name: Pick runners (antimatter-vps runners while free, else GitHub's)
        id: runners
        # runner-gate.antimatter-studios.com answers once per job: an antimatter-vps runner
        # while one is free and every identity on this run is christhomas, otherwise
        # ubuntu-24.04, the Ubuntu those runners run; any error is ubuntu-24.04 too.
        # Its /status page shows the pool.
        # JOBS has one entry per gated job, and one per matrix leg or reusable-workflow call:
        # the gate is asked for the job id before any ".", and the whole entry keys the answer.
        # It is the last step of its job, so it asks only once the run is known to go on.
        env:
          ORG: ${{ github.repository_owner }}
          ACTOR: ${{ github.triggering_actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SENDER: ${{ github.event.sender.login }}
          GH_ACTOR: ${{ github.actor }}
          JOBS: >-
            ${{ github.event_name == 'push' && 'seed-caches' || '' }}
            ${{ github.event_name == 'pull_request' && 'contract-diff' || '' }}
            test-api.1 test-api.2 test-api.3 test-api.4
            test-handlers.1 test-handlers.2 test-handlers.3 test-handlers.4
            test test-contract lint js-filter first-start
            webapp-images.webmail webapp-images.admin
            constellation contract-tooling attachments-s3 helm webmail admin guide
        run: |
          set -euo pipefail
          ours=true
          for who in "$ACTOR" "$GH_ACTOR" "$SENDER" "$AUTHOR"; do
            [ -z "$who" ] || [ "$who" = christhomas ] || ours=false
          done
          pick() {
            $ours || { echo ubuntu-24.04; return; }
            r=$(curl -fsS --max-time 10 --get https://runner-gate.antimatter-studios.com/pick \
                  --data-urlencode "org=$ORG" --data-urlencode prefer=antimatter-vps-linux-x64 \
                  --data-urlencode fallback=ubuntu-24.04 --data-urlencode "actor=$ACTOR" --data-urlencode "author=$AUTHOR" \
                  --data-urlencode "run=${{ github.run_id }}" --data-urlencode "attempt=${{ github.run_attempt }}" \
                  --data-urlencode "job=$1") || r=ubuntu-24.04
            case "$r" in antimatter-vps-linux-x64|ubuntu-24.04) echo "$r" ;; *) echo ubuntu-24.04 ;; esac
          }
          runners='{}'
          for entry in $JOBS; do
            runners=$(jq -c --arg j "$entry" --arg r "$(pick "${entry%%.*}")" '. + {($j): $r}' <<<"$runners")
          done
          echo "$runners" | jq . | tee -a "$GITHUB_STEP_SUMMARY"
          echo "runners=$runners" >> "$GITHUB_OUTPUT"

  seed-caches:
    needs: preflight
    name: Keep main's build caches warm
    # A cache made on main is the one every branch can read, and the runs above no longer
    # write them on a merge. Mostly this finds nothing to do, and takes about a minute.
    if: github.event_name == 'push'
    runs-on: ${{ fromJSON(needs.preflight.outputs.runners || '{}')['seed-caches'] || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Fill the module and build cache for a new go.sum
        if: steps.go.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          go mod download
          go build ./...

      - name: Set up cgo
        uses: ./.github/actions/setup-cgo

      # The race detector's builds have a cache of their own, because they are large and
      # only Test and the internal/api shards use them. The week in the key refreshes it
      # as the code moves. A compile cache cannot change a result: Go looks entries up by
      # the hash of their inputs, and -count=1 keeps test results out of it.
      - name: Name this week's race build cache
        id: race
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Is it already there?
        id: race-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-race
          key: go-race-${{ runner.os }}-go1.26.10-${{ hashFiles('go.sum') }}-${{ steps.race.outputs.week }}
          lookup-only: true

      # -exec true builds each test binary and runs none of them, so this needs no database.
      # The two commands are the two builds Test and the shards ask for: with coverage, and
      # without it to list internal/api's tests.
      - name: Build the race detector's test binaries
        if: steps.race-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export GOCACHE="$HOME/.cache/go-race"
          go test -race -count=1 -run '^$' -exec true -coverprofile="$RUNNER_TEMP/seed.out" ./internal/... ./cmd/... ./tests/contract/browser_sessions
          go test -race -count=1 -run '^$' -exec true ./internal/api/

      - name: Save the race build cache
        if: steps.race-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-race
          key: go-race-${{ runner.os }}-go1.26.10-${{ hashFiles('go.sum') }}-${{ steps.race.outputs.week }}

      # The action saves its own cache for a key that turns over weekly. The queue tested
      # this commit, so this is for the cache and not for the verdict.
      - name: Cache golangci-lint's pinned archive
        uses: ./.github/actions/cache-pinned-tool
        with:
          tool: golangci-lint

      - name: Install golangci-lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci/install-golangci-lint "$RUNNER_TEMP/bin"

      - name: Cache oasdiff's pinned archive
        uses: ./.github/actions/cache-pinned-tool
        with:
          tool: oasdiff

      - name: Warm oasdiff's pinned archive on main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/oasdiff_pin.py install "$RUNNER_TEMP/bin"

      - name: Cache Vertrag's pinned archive
        uses: ./.github/actions/cache-pinned-tool
        with:
          tool: vertrag

      - name: Warm Vertrag's pinned archive on main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/vertrag_pin.py install "$RUNNER_TEMP/bin"

      - name: Refresh golangci-lint's cache
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          install-mode: none
          args: --timeout=5m
          verify: false

  contract-diff:
    needs: preflight
    name: API contract changes
    if: github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    runs-on: ${{ fromJSON(needs.preflight.outputs.runners || '{}')['contract-diff'] || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The history that says where this PR branched from its base.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Set up the GitHub CLI
        uses: ./.github/actions/setup-gh

      # The comparison starts at the merge base, not the base tip: a head that has
      # not seen a newer base commit did not remove what that commit added (#1752).
      # This is inline because a PR's run takes this workflow from the merged ref but
      # scripts from its own head, which on a stale branch would not have a new one.
      # checkout fetches every branch. The base tip can be on none of them: a rerun
      # keeps its event, and a stack's parent branch may have been force-pushed since.
      - name: Find where the PR branched from its base
        id: branch-point
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base-sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --quiet --no-tags origin "$BASE_SHA"
          merge_base=$(git merge-base --all "$BASE_SHA" "$HEAD_SHA" || true)
          case "$merge_base" in
            "" | *$'\n'*)
              echo "::error::$HEAD_SHA has no single merge base with $BASE_SHA: rebase it on its base" >&2
              exit 1
              ;;
          esac
          behind=$(git rev-list --count "$merge_base..$BASE_SHA")
          mkdir -p "$RUNNER_TEMP/contract-diff"
          printf '{"comparison": "merge-base", "base_tip": "%s", "merge_base": "%s", "head": "%s", "base_commits_since_merge_base": %s}\n' \
            "$BASE_SHA" "$merge_base" "$HEAD_SHA" "$behind" > "$RUNNER_TEMP/contract-diff/comparison.json"
          {
            echo "Compared merge base \`$merge_base\` with PR head \`$HEAD_SHA\`."
            echo "Commits on base tip \`$BASE_SHA\` since the merge base: $behind."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          echo "sha=$merge_base" >> "$GITHUB_OUTPUT"

      # The verdict must not be something the PR can edit, so it runs copies from the
      # base (#1760). Base tip, not merge base: this workflow comes from the merged ref,
      # so the arguments below belong to these copies on every branch however stale,
      # and branching from an old commit picks no older rules. The tests below still
      # prove the PR's own copies. Each runs before the head's code does.
      - name: Take the verdict scripts from the base tip
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE: ${{ steps.branch-point.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/contract-gate"
          for script in contract_diff.py oasdiff_pin.py; do
            git show "$BASE_SHA:scripts/$script" > "$RUNNER_TEMP/contract-gate/$script" || {
              echo "::error::$BASE_SHA has no scripts/$script, and the verdict never uses the PR's own copy" >&2
              exit 1
            }
          done
          for path in .github/actions/cache-pinned-tool/action.yml scripts/ci/tool_cache.py scripts/ci/github_release.py; do
            mkdir -p "$(dirname "$path")"
            git show "$BASE_SHA:$path" > "$path" || {
              echo "::error::$BASE_SHA has no $path, and cache support never uses the PR's own copy" >&2
              exit 1
            }
          done
          changed=$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA" -- scripts/contract_diff.py scripts/oasdiff_pin.py)
          {
            echo "The verdict uses the scripts at base tip \`$BASE_SHA\`."
            for path in $changed; do
              echo "This PR changes \`$path\`. The tests prove that copy, but it does not judge this PR."
            done
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout the comparison base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.branch-point.outputs.sha }}
          path: .cache/contract-diff-base
          persist-credentials: false

      - name: Set up Go for both generated descriptions
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Cache the verdict comparator's pinned archive
        uses: ./.github/actions/cache-pinned-tool
        with:
          tool: oasdiff
          scripts: ${{ runner.temp }}/contract-gate

      - name: Install the comparator the verdict uses
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/tool_cache.py install-base-oasdiff "$RUNNER_TEMP/contract-gate/oasdiff_pin.py" "$RUNNER_TEMP/contract-gate/bin"

      # A PR that moves the pin is tested with the version it asks for.
      - name: Cache the PR comparator's pinned archive
        uses: ./.github/actions/cache-pinned-tool
        with:
          tool: oasdiff

      - name: Install the comparator the PR's tests use
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/tool_cache.py install-base-oasdiff scripts/oasdiff_pin.py "$RUNNER_TEMP/bin"

      - name: Prove classification and label gates with the real comparator
        env:
          OASDIFF: ${{ runner.temp }}/bin/oasdiff
        run: python3 -m unittest discover -s scripts/tests -p test_contract_diff.py -v

      - name: Generate the base and head descriptions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/contract-diff"
          (
            cd .cache/contract-diff-base
            RESTMAIL_OPENAPI_OUTPUT="$RUNNER_TEMP/contract-diff/base.json" \
              go test -mod=readonly ./internal/api/ -run '^TestTheGeneratedDescriptionIsServed$' -count=1
          )
          RESTMAIL_OPENAPI_OUTPUT="$RUNNER_TEMP/contract-diff/head.json" \
            go test -mod=readonly ./internal/api/ -run '^TestTheGeneratedDescriptionIsServed$' -count=1

      # The labels are read now, not from the event: ci-labels.yml re-runs this job
      # when a deliberate-change label is added or removed, and a re-run keeps the
      # event of the run it repeats.
      # A PR cannot change these arguments and the script together: see
      # "Contract changes in pull requests" in tests/contract/README.md.
      - name: Report contract changes and require deliberate labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pull-request }}
        run: |
          set -euo pipefail
          labels=()
          while IFS= read -r label; do
            [ -n "$label" ] && labels+=(--label "$label")
          done < <(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          python3 "$RUNNER_TEMP/contract-gate/contract_diff.py" \
            "$RUNNER_TEMP/contract-diff/base.json" "$RUNNER_TEMP/contract-diff/head.json" \
            --oasdiff "$RUNNER_TEMP/contract-gate/bin/oasdiff" "${labels[@]}" \
            --output "$RUNNER_TEMP/contract-diff"

      - name: Publish the comparison and generated descriptions
        if: always()
        # Only people read this, so losing it must not fail the job.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-contract-changes
          path: ${{ runner.temp }}/contract-diff
          retention-days: 7
          if-no-files-found: warn

  constellation:
    needs: preflight
    name: Check constellation inventory
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    runs-on: ${{ fromJSON(needs.preflight.outputs.runners || '{}')['constellation'] || 'ubuntu-24.04' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Check constellation inventory
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  contract-tooling:
    needs: preflight
    name: Test contract tooling
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    runs-on: ${{ fromJSON(needs.preflight.outputs.runners || '{}')['contract-tooling'] || 'ubuntu-24.04' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Test contract tooling
        run: |
          python3 -m unittest discover -s tests/contract -p 'test_*.py'

  lint:
    needs: preflight
    name: Lint
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    runs-on: ${{ fromJSON(needs.preflight.outputs.runners || '{}')['lint'] || 'ubuntu-24.04' }}
    outputs:
      runners: ${{ steps.runners.outputs.runners || '{}' }}
      go_imap_changed: ${{ steps.go-imap.outputs.go_imap_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Test load tooling
        run: python3 -m unittest discover -s tests/load -p 'test_*.py'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Run go vet
        run: go vet ./...

      # The action's own download fails the job on a short GitHub 504 (#1942).
      - name: Cache golangci-lint's pinned archive
        uses: ./.github/actions/cache-pinned-tool
        with:
          tool: golangci-lint

      - name: Install golangci-lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci/install-golangci-lint "$RUNNER_TEMP/bin"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # v2.1.6 is built with Go 1.24 and refuses to lint a module that
          # targets go 1.26.10 (go.mod). Pin a build made with Go >= 1.26.
          version: v2.11.4
          # Installed by the step above, which keeps trying for longer.
          install-mode: none
          args: --timeout=5m
          # `config verify` downloads its JSON schema from golangci-lint.run
          # and fails the job when that fetch times out (#508, #521). The
          # run itself still rejects an invalid config.
          verify: false

      # The vendored go-imap is a module of its own, so the steps above do not reach
      # it, and GitHub runs only the workflows at a repository's root. Its gates live
      # here and in the Test job, and run when it can have changed (#1925).
      - name: Decide whether the vendored IMAP module's gates run
        id: go-imap
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: scripts/ci/go-imap-changed

      - name: Check the IMAP coverage gate's fixtures
        if: steps.go-imap.outputs.go_imap_changed != 'false'
        working-directory: third_party/go-imap
        run: python3 -B -m unittest discover -s .github/tests -v

      - name: Run go vet on the IMAP module
        if: steps.go-imap.outputs.go_imap_changed != 'false'
        working-directory: third_party/go-imap
        run: go vet ./...

      # --no-config: the module's lint has no config of its own, and golangci-lint
      # would otherwise take the server's from a parent directory, with its exclusions.
      - name: Run golangci-lint on the IMAP module
        if: steps.go-imap.outputs.go_imap_changed != 'false'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          install-mode: none
          working-directory: third_party/go-imap
          args: --timeout=5m --no-config
          verify: false

      - name: Pick runners (antimatter-vps runners while free, else GitHub's)
        id: runners
        # runner-gate.antimatter-studios.com answers once per job: an antimatter-vps runner
        # while one is free and every identity on this run is christhomas, otherwise
        # ubuntu-24.04, the Ubuntu those runners run; any error is ubuntu-24.04 too.
        # Its /status page shows the pool.
        # JOBS has one entry per gated job, and one per matrix leg or reusable-workflow call:
        # the gate is asked for the job id before any ".", and the whole entry keys the answer.
        # It is the last step of its job, so it asks only once the run is known to go on.
        # Test IMAP module waits for this job, so it picks here: Preflight's answer would
        # be minutes old, past the gate's 120 s reservation, by the time that job starts.
        env:
          ORG: ${{ github.repository_owner }}
          ACTOR: ${{ github.triggering_actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SENDER: ${{ github.event.sender.login }}
          GH_ACTOR: ${{ github.actor }}
          JOBS: test-imap
        run: |
          set -euo pipefail
          ours=true
          for who in "$ACTOR" "$GH_ACTOR" "$SENDER" "$AUTHOR"; do
            [ -z "$who" ] || [ "$who" = christhomas ] || ours=false
          done
          pick() {
            $ours || { echo ubuntu-24.04; return; }
            r=$(curl -fsS --max-time 10 --get https://runner-gate.antimatter-studios.com/pick \
                  --data-urlencode "org=$ORG" --data-urlencode prefer=antimatter-vps-linux-x64 \
                  --data-urlencode fallback=ubuntu-24.04 --data-urlencode "actor=$ACTOR" --data-urlencode "author=$AUTHOR" \
                  --data-urlencode "run=${{ github.run_id }}" --data-urlencode "attempt=${{ github.run_attempt }}" \
                  --data-urlencode "job=$1") || r=ubuntu-24.04
            case "$r" in antimatter-vps-linux-x64|ubuntu-24.04) echo "$r" ;; *) echo ubuntu-24.04 ;; esac
          }
          runners='{}'
          for entry in $JOBS; do
            runners=$(jq -c --arg j "$entry" --arg r "$(pick "${entry%%.*}")" '. + {($j): $r}' <<<"$runners")
          done
          echo "$runners" | jq . | tee -a "$GITHUB_STEP_SUMMARY"
          echo "runners=$runners" >> "$GITHUB_OUTPUT"

  test:
    needs: preflight
    name: Test
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    runs-on: ${{ fromJSON(needs.preflight.outputs.runners || '{}')['test'] || 'ubuntu-24.04' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: restmail_test
          POSTGRES_USER: restmail
          POSTGRES_PASSWORD: restmail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restmail"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Set up cgo
        uses: ./.github/actions/setup-cgo

      # The race jobs share their build cache. Set it after setup-go,
      # so that its own cache keeps its own path. seed-caches writes this one, on main.
      - name: Restore the race build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-race
          key: go-race-${{ runner.os }}-go1.26.10-${{ hashFiles('go.sum') }}-none
          restore-keys: |
            go-race-${{ runner.os }}-go1.26.10-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-go1.26.10-

      - name: Use the race build cache
        run: echo "GOCACHE=$HOME/.cache/go-race" >> "$GITHUB_ENV"

      - name: Download dependencies
        run: go mod download

      # A services container takes no command, so the library the chart's
      # Postgres preloads is set here and the server restarted: the slow
      # statement view's tests (#1629) prove its answers against it.
      - name: Preload pg_stat_statements in the test database
        run: |
          set -euo pipefail
          id="${{ job.services.postgres.id }}"
          restart_postgres() {
            docker restart "$id"
            for _ in $(seq 1 30); do
              docker exec "$id" pg_isready -h 127.0.0.1 -U restmail -d restmail_test -q && return 0
              sleep 1
            done
            echo "Postgres did not come back after the restart" >&2
            return 1
          }
          docker exec "$id" psql -U restmail -d restmail_test -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          restart_postgres
          docker exec "$id" psql -U restmail -d restmail_test -c "ALTER SYSTEM SET pg_stat_statements.max = 100000"
          restart_postgres

      # -timeout is per package, and the race detector slows these packages
      # several times over: internal/api/handlers once ran past go test's
      # default 10 minutes. 20 leaves headroom while a hung test still fails.
      # internal/api and internal/api/handlers run in their own shards (#1307, #1979).
      # Each package's binary runs through testdb-exec, in a database of its
      # own: packages run side by side, and in one shared database their
      # migrations and audit-log appends deadlocked one another.
      - name: Run unit tests with race detector
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proofs"
          go build -o "$RUNNER_TEMP/testdb-exec" ./tools/testdb-exec
          packages=$(go list ./internal/... | grep -vxF -e github.com/rest-mail/rest-mail-server/internal/api -e github.com/rest-mail/rest-mail-server/internal/api/handlers)
          # shellcheck disable=SC2086 # one package per word
          go test -race -count=1 -timeout=20m -exec "$RUNNER_TEMP/testdb-exec" -coverprofile=coverage-rest.out $packages ./cmd/... ./tests/contract/browser_sessions
        env:
          ENVIRONMENT: test
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: restmail_test
          DB_USER: restmail
          DB_PASS: restmail
          # The in-process example tests write the pairs they proved here (#1237).
          RESTMAIL_EXAMPLE_PROOFS: ${{ runner.temp }}/proofs/example-proofs-rest.json
          # Full random inputs for the import route's spool tests (#1437).
          RESTMAIL_IMPORT_LONG_PROOF: "1"

      # Today only internal/api writes proofs; the report reads whatever is here.
      # Test report needs these uploads, and upload-artifact gives up on a dropped
      # connection at its first ECONNRESET (#1896), so each gets a second try. If that
      # fails too, the job fails. overwrite replaces an artifact that did finalize.
      - name: Upload example proofs
        id: upload-proofs
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-proofs-rest
          path: ${{ runner.temp }}/proofs
          retention-days: 1
          if-no-files-found: ignore
          overwrite: true

      - name: Upload example proofs (second try)
        if: steps.upload-proofs.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-proofs-rest
          path: ${{ runner.temp }}/proofs
          retention-days: 1
          if-no-files-found: ignore
          overwrite: true

      - name: Upload coverage
        id: upload-coverage
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-part-rest
          path: coverage-rest.out
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Upload coverage (second try)
        if: steps.upload-coverage.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-part-rest
          path: coverage-rest.out
          retention-days: 1
          if-no-files-found: error
          overwrite: true

