name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.10"
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          # v2.1.6 is built with Go 1.24 and refuses to lint a module that
          # targets go 1.25.0 (go.mod). Pin a build made with Go >= 1.25.
          version: v2.11.4
          args: --timeout=5m

      # The documented install command for instantmailcheck was wrong in four
      # places at once, and stayed wrong because nothing reads the docs. Homebrew
      # distributes pre-compiled binaries as casks, and `brew install` without
      # `--cask` does not resolve one — so the published instruction simply fails.
      #
      # Deliberately a step in this job rather than a job of its own, so it is
      # covered by the required status check already configured.
      - name: Documented Homebrew commands name the right kind of package
        run: |
          set -euo pipefail

          # antimatter-studios/tap ships BOTH kinds, so this cannot be a blanket
          # rule about `--cask`. These are its casks; a cask needs the flag or the
          # command resolves nothing:
          casks="ddt diskcutter dotman tacli instantmailcheck"
          #
          # chore, qemu, trove-cli and virtiofsd are formulae there, and are
          # correctly installed WITHOUT the flag. Do not "fix" those. If one of
          # them is ever converted to a cask, add it to the list above — the
          # direction of travel is formula to cask for anything shipping a
          # pre-compiled binary.

          fail=0
          for c in $casks; do
            # Matches only the form missing the flag: with `--cask` present, the
            # tap path no longer follows `install` directly. Anchoring on the tap
            # path also keeps this from matching the pattern written here.
            hits=$(grep -rnE "brew install +antimatter-studios/tap/${c}\b" \
                     --include='*.md' --include='*.yml' --include='*.yaml' . || true)
            if [ -n "$hits" ]; then
              echo "$hits" >&2
              echo "::error::$c is a cask in antimatter-studios/tap; the lines above omit --cask, so the command resolves nothing" >&2
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "documented Homebrew commands name the right kind of package"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: restmail_test
          POSTGRES_USER: restmail
          POSTGRES_PASSWORD: restmail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restmail"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.10"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests with race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./internal/...
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: restmail_test
          DB_USER: restmail
          DB_PASS: restmail

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        target:
          - cmd/api
          - cmd/smtp-gateway
          - cmd/imap-gateway
          - cmd/pop3-gateway
          - cmd/console
          - cmd/certgen
          - cmd/migrate
          - cmd/seed
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.10"
          cache: true

      - name: Build ${{ matrix.target }}
        run: CGO_ENABLED=0 go build ./${{ matrix.target }}

  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.2

      - name: Lint and render (render-test.sh)
        run: helm/restmail/tests/render-test.sh

  webmail:
    name: Webmail Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webmail
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # corepack ships with the runner's preinstalled Node and activates the
      # pnpm version pinned in package.json, so no extra action needs pinning.
      # It must run BEFORE setup-node, which needs pnpm on PATH to resolve its
      # dependency cache.
      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The supported range lives in the app's package.json (engines.node);
          # setup-node reads it, so CI cannot drift from what the app declares.
          # engine-strict in .npmrc then fails the install if it ever does.
          #
          # No `cache: pnpm`: its post-job save fails the job when the store path it
          # resolved from the repository root does not exist, which took down builds
          # that had already passed. Installing two small apps is cheap.
          node-version-file: webmail/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build

  admin:
    name: Admin Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # corepack ships with the runner's preinstalled Node and activates the
      # pnpm version pinned in package.json, so no extra action needs pinning.
      # It must run BEFORE setup-node, which needs pnpm on PATH to resolve its
      # dependency cache.
      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The supported range lives in the app's package.json (engines.node);
          # setup-node reads it, so CI cannot drift from what the app declares.
          # engine-strict in .npmrc then fails the install if it ever does.
          #
          # No `cache: pnpm`: its post-job save fails the job when the store path it
          # resolved from the repository root does not exist, which took down builds
          # that had already passed. Installing two small apps is cheap.
          node-version-file: admin/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

  # The gate — the one context worth requiring on main, mirroring what e2e.yml
  # already does with `E2E (full topology)`.
  #
  # Branch protection requires checks BY NAME, so requiring the jobs above means
  # every job name is load-bearing: renaming one, splitting one into a matrix, or
  # letting one skip leaves a required check that never reports, which reads as
  # "expected — waiting for status to be reported" forever. Admins are not exempt,
  # and there is no failure to click. It has already happened here once, when
  # `Build` became `Build (cmd/api)` and friends.
  #
  # This job always runs and fails only if a job that actually ran did not
  # succeed, so a skipped job is not a block. Requiring it — and nothing else
  # from this workflow — makes the 13 job names above free to change.
  ci:
    name: CI
    needs: [lint, test, build, helm, webmail, admin]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        env:
          RESULTS: |
            lint=${{ needs.lint.result }}
            test=${{ needs.test.result }}
            build=${{ needs.build.result }}
            helm=${{ needs.helm.result }}
            webmail=${{ needs.webmail.result }}
            admin=${{ needs.admin.result }}
        run: |
          set -euo pipefail
          # `needs.build.result` covers the whole matrix: it is `success` only
          # when every target built.
          fail=0
          while IFS='=' read -r job result; do
            [ -n "$job" ] || continue
            printf '  %-8s %s\n' "$job" "$result"
            case "$result" in
              success | skipped) ;;
              *) fail=1 ;;
            esac
          done <<< "$RESULTS"
          if [ "$fail" = 1 ]; then
            echo "::error::a job did not succeed" >&2
            exit 1
          fi
          echo "  all jobs that ran passed"
