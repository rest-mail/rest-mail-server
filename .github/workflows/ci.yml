name: CI
run-name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref.from == '' && 'CI (ignored edit)' || '' }}

on:
  push:
    branches: [main]
  # Stack layers report skipped gates until retargeted to main (#1775).
  # Only base-changing edits run jobs; other edits have their own concurrency group
  # and non-required gate name, so they cannot replace or cancel a real verdict.
  # No `labeled` or `unlabeled`: claim labels must not cancel CI (#1593).
  # The labels the contract gate reads re-run that gate from ci-labels.yml instead.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # The Vertrag bump (bump-vertrag.yml) dispatches CI for its branch: a pull request it
  # opens with the workflow's own token starts no checks by itself.
  workflow_dispatch:
  # The merge queue on main (#825) tests each group of pull requests on top of main
  # before merging it, and waits for every required check to report on that group.
  merge_group:

# A pull request's run for an older push or an older base answers nothing: GitHub
# judges the required check by the newest run, so that one supersedes it. Each run
# on main or by dispatch has a group of its own, so every merged commit keeps its result.
concurrency:
  group: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '') && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

# A merge moves main to the commit the merge queue just tested, so a push by the queue
# would run all of this a second time on the same SHA, about 65 job minutes per merge
# (#1896). Each job's `if` skips that case, and `seed-caches` keeps what those runs used
# to leave behind. Any other push to main runs everything, and so does a dispatch: to
# test main again, use `gh workflow run ci.yml`. Re-running a queue push's run skips again.

permissions:
  contents: read

jobs:
  seed-caches:
    name: Keep main's build caches warm
    # A cache made on main is the one every branch can read, and the runs above no longer
    # write them on a merge. Mostly this finds nothing to do, and takes about a minute.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Fill the module and build cache for a new go.sum
        if: steps.go.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          go mod download
          go build ./...

      # The race detector's builds have a cache of their own, because they are large and
      # only Test and the internal/api shards use them. The week in the key refreshes it
      # as the code moves. A compile cache cannot change a result: Go looks entries up by
      # the hash of their inputs, and -count=1 keeps test results out of it.
      - name: Name this week's race build cache
        id: race
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Is it already there?
        id: race-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-race
          key: go-race-${{ runner.os }}-go1.26.10-${{ hashFiles('go.sum') }}-${{ steps.race.outputs.week }}
          lookup-only: true

      # -exec true builds each test binary and runs none of them, so this needs no database.
      # The two commands are the two builds Test and the shards ask for: with coverage, and
      # without it to list internal/api's tests.
      - name: Build the race detector's test binaries
        if: steps.race-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export GOCACHE="$HOME/.cache/go-race"
          go test -race -count=1 -run '^$' -exec true -coverprofile="$RUNNER_TEMP/seed.out" ./internal/... ./cmd/... ./tests/contract/browser_sessions
          go test -race -count=1 -run '^$' -exec true ./internal/api/

      - name: Save the race build cache
        if: steps.race-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-race
          key: go-race-${{ runner.os }}-go1.26.10-${{ hashFiles('go.sum') }}-${{ steps.race.outputs.week }}

      # The action saves its own cache for a key that turns over weekly. The queue tested
      # this commit, so this is for the cache and not for the verdict.
      - name: Refresh golangci-lint's cache
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          args: --timeout=5m
          verify: false

  contract-diff:
    name: API contract changes
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout the comparison base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .cache/contract-diff-base
          persist-credentials: false

      - name: Set up Go for both generated descriptions
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Install the pinned OpenAPI 3.1 comparator
        run: python3 scripts/oasdiff_pin.py install "$RUNNER_TEMP/bin"

      - name: Prove classification and label gates with the real comparator
        env:
          OASDIFF: ${{ runner.temp }}/bin/oasdiff
        run: python3 -m unittest discover -s scripts/tests -p test_contract_diff.py -v

      - name: Generate the base and head descriptions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/contract-diff"
          (
            cd .cache/contract-diff-base
            RESTMAIL_OPENAPI_OUTPUT="$RUNNER_TEMP/contract-diff/base.json" \
              go test -mod=readonly ./internal/api/ -run '^TestTheGeneratedDescriptionIsServed$' -count=1
          )
          RESTMAIL_OPENAPI_OUTPUT="$RUNNER_TEMP/contract-diff/head.json" \
            go test -mod=readonly ./internal/api/ -run '^TestTheGeneratedDescriptionIsServed$' -count=1

      # The labels are read now, not from the event: ci-labels.yml re-runs this job
      # when a deliberate-change label is added or removed, and a re-run keeps the
      # event of the run it repeats.
      - name: Report contract changes and require deliberate labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels=()
          while IFS= read -r label; do
            [ -n "$label" ] && labels+=(--label "$label")
          done < <(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          python3 scripts/contract_diff.py \
            "$RUNNER_TEMP/contract-diff/base.json" "$RUNNER_TEMP/contract-diff/head.json" \
            --oasdiff "$RUNNER_TEMP/bin/oasdiff" "${labels[@]}" \
            --output "$RUNNER_TEMP/contract-diff"

      - name: Publish the comparison and generated descriptions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-contract-changes
          path: ${{ runner.temp }}/contract-diff
          retention-days: 7
          if-no-files-found: warn

  lint:
    name: Lint
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.base_ref == 'main' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check constellation inventory
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Test contract tooling
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -m unittest discover -s tests/contract -p 'test_*.py'

      - name: Test load tooling
        run: python3 -m unittest discover -s tests/load -p 'test_*.py'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # v2.1.6 is built with Go 1.24 and refuses to lint a module that
          # targets go 1.26.10 (go.mod). Pin a build made with Go >= 1.26.
          version: v2.11.4
          args: --timeout=5m
          # `config verify` downloads its JSON schema from golangci-lint.run
          # and fails the job when that fetch times out (#508, #521). The
          # run itself still rejects an invalid config.
          verify: false

  test:
    name: Test
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.base_ref == 'main' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '')))
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: restmail_test
          POSTGRES_USER: restmail
          POSTGRES_PASSWORD: restmail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restmail"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      # Only this job and its neighbour use the race detector's builds. Set after setup-go,
      # so that its own cache keeps its own path. seed-caches writes this one, on main.
      - name: Restore the race build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-race
          key: go-race-${{ runner.os }}-go1.26.10-${{ hashFiles('go.sum') }}-none
          restore-keys: |
            go-race-${{ runner.os }}-go1.26.10-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-go1.26.10-

      - name: Use the race build cache
        run: echo "GOCACHE=$HOME/.cache/go-race" >> "$GITHUB_ENV"

      - name: Download dependencies
        run: go mod download

      # -timeout is per package, and the race detector slows these packages
      # several times over: internal/api/handlers once ran past go test's
      # default 10 minutes. 20 leaves headroom while a hung test still fails.
      # internal/api alone came close to 20 minutes, so its shards run it (#1307).
      # Each package's binary runs through testdb-exec, in a database of its
      # own: packages run side by side, and in one shared database their
      # migrations and audit-log appends deadlocked one another.
      - name: Run unit tests with race detector
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proofs"
          go build -o "$RUNNER_TEMP/testdb-exec" ./tools/testdb-exec
          packages=$(go list ./internal/... | grep -vxF github.com/rest-mail/rest-mail-server/internal/api)
          # shellcheck disable=SC2086 # one package per word
          go test -race -count=1 -timeout=20m -exec "$RUNNER_TEMP/testdb-exec" -coverprofile=coverage-rest.out $packages ./cmd/... ./tests/contract/browser_sessions
        env:
          ENVIRONMENT: test
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: restmail_test
          DB_USER: restmail
          DB_PASS: restmail
          # The in-process example tests write the pairs they proved here (#1237).
          RESTMAIL_EXAMPLE_PROOFS: ${{ runner.temp }}/proofs/example-proofs-rest.json
          # Full random inputs for the import route's spool tests (#1437).
          RESTMAIL_IMPORT_LONG_PROOF: "1"

      # third_party/go-imap is a module of its own: its own go.mod and go.sum, and nothing
      # from this repository. So its result can only change with those files or with the
      # Go version named in this workflow, and 4.5 minutes of tests can wait for that (#1896).
      # In the queue the base is the commit this group sits on, which is main or a group
      # ahead of it, and the ruleset's ALLGREEN needs that group green as well. The push to
      # main and a dispatch have no base, so they always run it, as does anything unclear.
      - name: Has the local IMAP module changed?
        id: imap-module
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: scripts/ci/paths-changed "$BASE_SHA" third_party/go-imap .github/workflows/ci.yml scripts/ci/paths-changed

      - name: Test the local IMAP compatibility module
        if: steps.imap-module.outputs.changed != 'false'
        working-directory: third_party/go-imap
        run: go test -race -count=1 -timeout=10m ./...

      - name: Test contract fixtures against an empty database
        run: |
          set -euo pipefail
          docker exec "${{ job.services.postgres.id }}" createdb -U restmail restmail_contract_fixture_ci
          go test -race -count=1 -timeout=20m -v ./tests/contract/fixtures ./tests/contract/fixtureplan
        env:
          ENVIRONMENT: test
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: restmail_contract_fixture_ci
          DB_USER: restmail
          DB_PASS: restmail

      # The contract fault switch (#654): the API builds with every fault in
      # tests/contract/faults.yml, and each one changes its route's answer. The
      # run above holds the catalogue to the switches without the tags.
      - name: Test the contract fault switch
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          tags="$(python3 -B tests/contract/faults.py tags)"
          go vet -tags "$tags" ./cmd/api ./internal/faultinject
          go test -race -count=1 -tags "$tags" ./internal/faultinject

      # Today only internal/api writes proofs; the report reads whatever is here.
      - name: Upload example proofs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-proofs-rest
          path: ${{ runner.temp }}/proofs
          retention-days: 1
          if-no-files-found: ignore
          overwrite: true

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-part-rest
          path: coverage-rest.out
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  test-api:
    name: Test internal/api (${{ matrix.shard }} of 4)
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.base_ref == 'main' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '')))
    # internal/api is the slowest package by far: nearly 1000 s under the race
    # detector, most of it in PostgreSQL fixtures, against a 20 minute limit per
    # package (#1307). Each shard runs every fourth of its top-level tests, by
    # name, against a database of its own, beside the Test job.
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: restmail_test
          POSTGRES_USER: restmail
          POSTGRES_PASSWORD: restmail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restmail"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      # Only this job and its neighbour use the race detector's builds. Set after setup-go,
      # so that its own cache keeps its own path. seed-caches writes this one, on main.
      - name: Restore the race build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-race
          key: go-race-${{ runner.os }}-go1.26.10-${{ hashFiles('go.sum') }}-none
          restore-keys: |
            go-race-${{ runner.os }}-go1.26.10-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-go1.26.10-

      - name: Use the race build cache
        run: echo "GOCACHE=$HOME/.cache/go-race" >> "$GITHUB_ENV"

      - name: Download dependencies
        run: go mod download

      # Every shard lists the same tests and takes those whose position in the
      # sorted list falls to it, so together the shards run each test once.
      - name: Choose this shard's tests
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: "4"
        run: |
          set -euo pipefail
          go test -race -list '.*' ./internal/api/ | grep -E '^(Test|Example|Fuzz)' | sort > "$RUNNER_TEMP/tests"
          awk -v n="$SHARDS" -v i="$SHARD" '(NR - 1) % n == i - 1' "$RUNNER_TEMP/tests" > "$RUNNER_TEMP/shard-tests"
          if [ ! -s "$RUNNER_TEMP/shard-tests" ]; then
            echo "::error::shard $SHARD of $SHARDS has no tests" >&2
            exit 1
          fi
          echo "shard $SHARD of $SHARDS runs $(wc -l < "$RUNNER_TEMP/shard-tests") of $(wc -l < "$RUNNER_TEMP/tests") tests"
          echo "RUN_PATTERN=^($(paste -sd '|' "$RUNNER_TEMP/shard-tests"))\$" >> "$GITHUB_ENV"

      - name: Run internal/api tests with race detector
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proofs"
          go test -race -count=1 -timeout=20m -coverprofile=coverage-api-${{ matrix.shard }}.out -run "$RUN_PATTERN" ./internal/api/
        env:
          ENVIRONMENT: test
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: restmail_test
          DB_USER: restmail
          DB_PASS: restmail
          RESTMAIL_EXAMPLE_PROOFS: ${{ runner.temp }}/proofs/example-proofs-api-${{ matrix.shard }}.json

      # TestMain writes the file whenever the variable is set, so a missing file is an error.
      - name: Upload example proofs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-proofs-api-${{ matrix.shard }}
          path: ${{ runner.temp }}/proofs
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-part-api-${{ matrix.shard }}
          path: coverage-api-${{ matrix.shard }}.out
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  test-report:
    name: Test report
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.base_ref == 'main' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '')))
    # Joins what the Test job and the internal/api shards wrote: the example
    # proofs, judged as one set, and the coverage, as one profile.
    runs-on: ubuntu-latest
    needs: [test, test-api]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download example proofs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: example-proofs-*
          path: ${{ runner.temp }}/proofs
          merge-multiple: true

      # A pair that needs setup (requires) is not sent by the gate's live run, so a
      # runner must prove it; this fails on any that no in-process test did (#1237).
      # The exception is what a live runner selects: this job cannot see that result,
      # so it leaves those pairs to e2e.yml's union, which the merge queue requires.
      - name: Every example that needs setup is proven
        run: |
          set -euo pipefail
          shopt -s nullglob
          proofs=("$RUNNER_TEMP"/proofs/*.json)
          if [ "${#proofs[@]}" -lt 4 ]; then
            echo "::error::expected example proofs from all 4 internal/api shards, found ${#proofs[@]} files" >&2
            exit 1
          fi
          python3 scripts/example_proofs.py --defer-live openapi-example.json "${proofs[@]}"

      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-part-*
          path: ${{ runner.temp }}/coverage
          merge-multiple: true

      # go tool cover adds up the counts of a block that appears in more than one
      # profile, so one mode line and every profile's blocks make the whole.
      - name: Merge coverage
        run: |
          set -euo pipefail
          profiles=("$RUNNER_TEMP"/coverage/*.out)
          modes=$(head -qn1 "${profiles[@]}" | sort -u)
          if [ "$(printf '%s\n' "$modes" | wc -l)" != 1 ]; then
            echo "::error::coverage profiles disagree on the mode: $modes" >&2
            exit 1
          fi
          { echo "$modes"; tail -qn +2 "${profiles[@]}"; } > coverage.out
          echo "merged ${#profiles[@]} profiles, $(wc -l < coverage.out) lines"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  attachments-s3:
    name: Garage attachment storage
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.base_ref == 'main' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true
      - name: Verify private attachments against Garage
        run: python3 scripts/garage-attachment-test.py

  build:
    name: Build
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.base_ref == 'main' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '')))
    runs-on: ubuntu-latest
    needs: [test, test-api]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      # A cold build cache can still need modules unused by the test job.
      # Retry downloads after transient proxy errors before compiling once.
      - name: Download build dependencies
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            echo "::warning::Dependency download attempt ${attempt}/3 failed"
          done
          echo "::error::Dependency downloads failed after three attempts"
          exit 1

      # One job, so the seven commands share their compiles and one runner (#1896). -o
      # with a directory links every one of them, as building each alone did.
      - name: Build every command
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/commands/" ./cmd/api ./cmd/smtp-gateway ./cmd/imap-gateway ./cmd/pop3-gateway ./cmd/console ./cmd/migrate ./cmd/seed

  helm:
    name: Helm Chart
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.base_ref == 'main' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.2

      - name: Lint and render (render-test.sh)
        run: helm/restmail/tests/render-test.sh

      - name: Exercise the optional DANE resolver image
        run: bash helm/restmail/tests/dane-resolver-test.sh

  webmail:
    name: Webmail Build
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.base_ref == 'main' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '')))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webmail
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # corepack ships with the runner's preinstalled Node and activates the
      # pnpm version pinned in package.json, so no extra action needs pinning.
      # It must run BEFORE setup-node, which needs pnpm on PATH to resolve its
      # dependency cache.
      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The supported range lives in the app's package.json (engines.node);
          # setup-node reads it, so CI cannot drift from what the app declares.
          # engine-strict in .npmrc then fails the install if it ever does.
          #
          # No `cache: pnpm`: its post-job save fails the job when the store path it
          # resolved from the repository root does not exist, which took down builds
          # that had already passed. Installing two small apps is cheap.
          node-version-file: webmail/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Go for the served API description
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Generate types from this revision's served description
        env:
          RESTMAIL_OPENAPI_OUTPUT: ${{ runner.temp }}/openapi.json
          RESTMAIL_OPENAPI_SOURCE: ${{ runner.temp }}/openapi.json
        run: |
          (cd .. && go test ./internal/api/ -run '^TestTheGeneratedDescriptionIsServed$' -count=1)
          pnpm run generate-types

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  admin:
    name: Admin Build
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.base_ref == 'main' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '')))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # corepack ships with the runner's preinstalled Node and activates the
      # pnpm version pinned in package.json, so no extra action needs pinning.
      # It must run BEFORE setup-node, which needs pnpm on PATH to resolve its
      # dependency cache.
      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The supported range lives in the app's package.json (engines.node);
          # setup-node reads it, so CI cannot drift from what the app declares.
          # engine-strict in .npmrc then fails the install if it ever does.
          #
          # No `cache: pnpm`: its post-job save fails the job when the store path it
          # resolved from the repository root does not exist, which took down builds
          # that had already passed. Installing two small apps is cheap.
          node-version-file: admin/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Go for the served API description
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Generate types from this revision's served description
        env:
          RESTMAIL_OPENAPI_OUTPUT: ${{ runner.temp }}/openapi.json
          RESTMAIL_OPENAPI_SOURCE: ${{ runner.temp }}/openapi.json
        run: |
          (cd .. && go test ./internal/api/ -run '^TestTheGeneratedDescriptionIsServed$' -count=1)
          pnpm run generate-types

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

  # The gate — the one context worth requiring on main, mirroring what e2e.yml
  # already does with `E2E (full topology)`.
  #
  # Branch protection requires checks BY NAME, so requiring the jobs above means
  # every job name is load-bearing: renaming one, splitting one into a matrix, or
  # letting one skip leaves a required check that never reports, which reads as
  # "expected — waiting for status to be reported" forever. Admins are not exempt,
  # and there is no failure to click. It has already happened here once, when
  # `Build` became `Build (cmd/api)` and friends.
  #
  # This job always runs and fails only if a job that actually ran did not
  # succeed, so a skipped job is not a block. Requiring it — and nothing else
  # from this workflow — makes the job names above free to change.
  js-filter:
    name: JS Filter
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.base_ref == 'main' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '')))
    # The sidecar that runs javascript filters: its own tests (the sandbox
    # escapes of #160 among them), then the API's filter against it, end to end.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/js-filter-sidecar
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Retry transient image pull failures
        run: echo "$GITHUB_WORKSPACE/scripts/ci/docker-retry" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The image's Node (Dockerfile: node:22-alpine).
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: The sidecar against its description (Vertrag)
        # js-filter-sidecar.json is generated from the API client's own types
        # (TestSidecarDescriptionIsCommitted); here the running sidecar is held to
        # it and to its example pairs, the token check included (#677). The body
        # cap is small so the too_large examples are refused with 413.
        env:
          JS_FILTER_TOKEN: ci-sidecar-token-0123456789
          JS_FILTER_MAX_BODY_BYTES: "2048"
          PORT: "3100"
        run: |
          set -euo pipefail
          python3 ../../scripts/vertrag_pin.py install "$RUNNER_TEMP/bin"
          node server.js > "$RUNNER_TEMP/sidecar.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3100/health >/dev/null 2>&1 && break
            sleep 1
          done
          "$RUNNER_TEMP/bin/vertrag" run --config vertrag.yml --phases examples

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: The API's javascript filter against the sidecar
        working-directory: .
        run: |
          set -euo pipefail
          go test -count=1 -v -run 'TestJSFilter' ./internal/pipeline/filters/ | tee "$RUNNER_TEMP/jsfilter.log"
          # The end-to-end test skips without node or npm ci; here it must run.
          if grep -q -- '--- SKIP: TestJSFilter_RealSidecar' "$RUNNER_TEMP/jsfilter.log"; then
            echo "::error::TestJSFilter_RealSidecar was skipped" >&2
            exit 1
          fi

      - name: The sidecar's private network in Docker (#122)
        working-directory: .
        env:
          RESTMAIL_JS_FILTER_LIVE: "1"
          JS_FILTER_LIVE_IMAGE: rest-mail-js-filter:live-ci
        run: |
          set -euo pipefail
          docker build -t "$JS_FILTER_LIVE_IMAGE" projects/js-filter-sidecar
          python3 -m unittest discover -s scripts/tests -p test_js_filter_network_live.py -v 2>&1 | tee "$RUNNER_TEMP/jsfilter-live.log"
          # The opt-in test skips without the variable; here it must run.
          if grep -q 'skipped' "$RUNNER_TEMP/jsfilter-live.log"; then
            echo "::error::the live js-filter network test was skipped" >&2
            exit 1
          fi

  first-start:
    name: First start
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.base_ref == 'main' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '')))
    # Proves, against the real image, the path a fresh install takes: the
    # first admin signs in with the bootstrap password the installer chose and
    # is forced to choose their own and enroll 2FA, a domain and a mailbox get
    # built, and the restmail CLI hands the server over with reset-admin, over
    # the public API with an owner key (no platform assumed) -- after which
    # nothing the first holder had works, an unexpired access token included.
    # tests/first-start/agent-e2e.sh.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Retry transient image pull failures
        run: echo "$GITHUB_WORKSPACE/scripts/ci/docker-retry" >> "$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Tools
        run: sudo apt-get install -y --no-install-recommends oathtool

      - name: Build the CLI and the API image
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/restmail" ./cmd/console
          # A version stamped in, so the run can check it reaches the binary.
          docker build --target prod --build-arg VERSION=0.0.0-first-start -t restmail-api:first-start .

      - name: Sign in with the bootstrap password, build, hand over
        env:
          RESTMAIL: ${{ runner.temp }}/restmail
          IMAGE: restmail-api:first-start
          EXPECT_VERSION: 0.0.0-first-start
        run: tests/first-start/agent-e2e.sh

  webapp-images:
    name: Web app image (${{ matrix.app }})
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.base_ref == 'main' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '')))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [webmail, admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Retry transient image pull failures
        run: echo "$GITHUB_WORKSPACE/scripts/ci/docker-retry" >> "$GITHUB_PATH"

      - name: Build and serve with the chart's security settings
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          docker build --target prod -t "restmail-$APP:smoke" "$APP"
          container=$(docker run -d --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 101:101 \
            --tmpfs /etc/nginx/conf.d:rw,uid=101,gid=101 \
            --tmpfs /tmp:rw,uid=101,gid=101 \
            -e NGINX_BASE_PATH=/ -p 127.0.0.1::8080 "restmail-$APP:smoke")
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          origin="http://$(docker port "$container" 8080/tcp)"
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            -D "$RUNNER_TEMP/headers" "$origin/" -o "$RUNNER_TEMP/index.html"
          grep -q '<base href="/">' "$RUNNER_TEMP/index.html"
          grep -qi "connect-src 'self'" "$RUNNER_TEMP/headers"
          curl --fail --silent --show-error "$origin/login" -o "$RUNNER_TEMP/deep.html"
          cmp "$RUNNER_TEMP/index.html" "$RUNNER_TEMP/deep.html"
          asset=$(grep -oE 'src="[^"]+\.js"' "$RUNNER_TEMP/index.html" | head -1 | cut -d '"' -f2)
          test -n "$asset"
          curl --fail --silent --show-error -D "$RUNNER_TEMP/asset-headers" \
            "$origin/${asset#/}" -o "$RUNNER_TEMP/bundle.js"
          grep -Eqi '^content-type:[[:space:]]*(application|text)/(javascript|ecmascript)' "$RUNNER_TEMP/asset-headers"
          test -s "$RUNNER_TEMP/bundle.js"

      - name: Dev server on a read-only root filesystem
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          docker build --target dev -t "restmail-$APP:dev-smoke" "$APP"
          container=$(docker run -d --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 512 --memory 1g --cpus 1.5 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777 \
            -v "$PWD/$APP:/app" -v /app/node_modules \
            -e VITE_BASE_PATH=/ -p 127.0.0.1::3000 "restmail-$APP:dev-smoke")
          trap 'docker logs "$container"; docker rm -fv "$container" >/dev/null; rm -f "$APP/src/hardening-smoke.ts"' EXIT
          origin="http://$(docker port "$container" 3000/tcp)"
          # docker-proxy accepts the connection and then resets it until Vite
          # listens, so retry every error, not only refused connections.
          curl --fail --silent --show-error --retry 60 --retry-all-errors --retry-delay 1 \
            "$origin/" -o "$RUNNER_TEMP/dev-index.html"
          grep -q '/@vite/client' "$RUNNER_TEMP/dev-index.html"
          curl --fail --silent --show-error "$origin/src/main.tsx" -o "$RUNNER_TEMP/dev-main.js"
          test -s "$RUNNER_TEMP/dev-main.js"
          # A real source transform exercises Vite/esbuild and writable caches;
          # a second request must see source edits through the bind mount.
          printf 'export const marker = "readonly-first";\n' > "$APP/src/hardening-smoke.ts"
          curl --fail --silent --show-error "$origin/src/hardening-smoke.ts" | grep -q readonly-first
          printf 'export const marker = "readonly-edited";\n' > "$APP/src/hardening-smoke.ts"
          curl --fail --silent --show-error "$origin/src/hardening-smoke.ts?hardening=edited" | grep -q readonly-edited
          docker exec "$container" sh -ec 'touch /tmp/scratch; touch /app/node_modules/.scratch; rm /app/node_modules/.scratch'
          if docker exec "$container" touch /rootfs-write-must-fail; then
            echo "::error::dev root filesystem is writable" >&2
            exit 1
          fi

  guide:
    name: Email, explained
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.base_ref == 'main' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '')))
    # The guide is checked where it is written, so a broken link, an unsourced
    # chapter or a diagram Archify refuses fails the pull request that broke it
    # (docs/design/email-explained-website.md). Outside links change on other
    # sites' schedules, so scheduled.yml checks those daily.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/email-explained
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: scripts/email-explained/package.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch Archify, at the commit package.json pins
        run: echo "ARCHIFY=$(node fetch-archify.mjs "$RUNNER_TEMP/archify")" >> "$GITHUB_ENV"

      - name: Test the checks and the bundler
        run: npm test

      - name: Check the guide
        run: node check.mjs --archify "$ARCHIFY"

      - name: Build the bundle the website renders
        run: node bundle.mjs --archify "$ARCHIFY" --out "$RUNNER_TEMP/email-explained"

  ci:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref.from == '' && 'CI (ignored edit)' || 'CI' }}
    needs: [seed-caches, contract-diff, lint, test, test-api, test-report, attachments-s3, build, helm, webmail, admin, js-filter, first-start, webapp-images, guide]
    if: always() && (github.event_name != 'pull_request' || (github.base_ref == 'main' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '')))
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        env:
          RESULTS: |
            seed-caches=${{ needs.seed-caches.result }}
            contract-diff=${{ needs.contract-diff.result }}
            lint=${{ needs.lint.result }}
            test=${{ needs.test.result }}
            test-api=${{ needs.test-api.result }}
            test-report=${{ needs.test-report.result }}
            attachments-s3=${{ needs.attachments-s3.result }}
            build=${{ needs.build.result }}
            helm=${{ needs.helm.result }}
            webmail=${{ needs.webmail.result }}
            admin=${{ needs.admin.result }}
            js-filter=${{ needs.js-filter.result }}
            first-start=${{ needs.first-start.result }}
            webapp-images=${{ needs.webapp-images.result }}
            guide=${{ needs.guide.result }}
        run: |
          set -euo pipefail
          # `needs.test-api.result` covers the whole matrix: it is `success` only
          # when every shard passed.
          fail=0
          while IFS='=' read -r job result; do
            [ -n "$job" ] || continue
            printf '  %-12s %s\n' "$job" "$result"
            case "$result" in
              success | skipped) ;;
              *) fail=1 ;;
            esac
          done <<< "$RESULTS"
          if [ "$fail" = 1 ]; then
            echo "::error::a job did not succeed" >&2
            exit 1
          fi
          echo "  all jobs that ran passed"
