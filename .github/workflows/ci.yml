  test-imap:
    name: Test IMAP module
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    runs-on: ${{ fromJSON(needs.lint.outputs.runners || '{}')['test-imap'] || 'ubuntu-24.04' }}
    needs: [preflight, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Set up cgo
        uses: ./.github/actions/setup-cgo

      # The race jobs share their build cache. Set it after setup-go,
      # so that its own cache keeps its own path. seed-caches writes this one, on main.
      - name: Restore the race build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-race
          key: go-race-${{ runner.os }}-go1.26.10-${{ hashFiles('go.sum') }}-none
          restore-keys: |
            go-race-${{ runner.os }}-go1.26.10-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-go1.26.10-

      - name: Use the race build cache
        run: echo "GOCACHE=$HOME/.cache/go-race" >> "$GITHUB_ENV"

      - name: Download dependencies
        run: go mod download

      # The module's tests take 4.5 minutes, and its result moves only with its own files or
      # the Go version named here (#1896), so they run with the gates below, under -race and
      # with coverage. The Lint job decides, and a missing answer runs them.
      # A signed 32-bit int cannot hold every valid IMAP sequence endpoint. Run the
      # actual wire proofs on 386; amd64-only tests hide this bug.
      - name: Check the IMAP module's 32-bit sequence dispatch
        if: needs.lint.outputs.go_imap_changed != 'false'
        working-directory: third_party/go-imap
        env:
          GOARCH: "386"
          CGO_ENABLED: "0"
        run: go test -count=1 -run '^(TestParseSequenceSet.*|TestResolveSeqNum.*|TestWideSequenceDispatch|TestSearchValidSequenceSet)$' ./pkg/imap/internal/wire ./pkg/imap/rfctest

      - name: Validate the IMAP module's RFC checklist
        if: needs.lint.outputs.go_imap_changed != 'false'
        working-directory: third_party/go-imap
        run: go run ./internal/checklist pkg/imap/rfctest

      # The wire proofs in pkg/imap/rfctest exercise the public library from a separate
      # package. Instrument all packages so those proofs count too.
      - name: Test the local IMAP compatibility module with coverage
        if: needs.lint.outputs.go_imap_changed != 'false'
        working-directory: third_party/go-imap
        run: go test -race -count=1 -timeout=10m -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Require at least 95% statement coverage
        if: needs.lint.outputs.go_imap_changed != 'false'
        working-directory: third_party/go-imap
        shell: bash
        run: |
          set -euo pipefail
          go tool cover -func=coverage.out | tee coverage.txt | python3 -B .github/scripts/check_coverage.py

      - name: Upload IMAP coverage evidence
        if: ${{ !cancelled() && needs.lint.outputs.go_imap_changed != 'false' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-imap-statement-coverage
          path: |
            third_party/go-imap/coverage.out
            third_party/go-imap/coverage.txt
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

