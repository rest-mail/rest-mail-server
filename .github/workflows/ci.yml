name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.10"
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          # v2.1.6 is built with Go 1.24 and refuses to lint a module that
          # targets go 1.25.0 (go.mod). Pin a build made with Go >= 1.25.
          version: v2.11.4
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: restmail_test
          POSTGRES_USER: restmail
          POSTGRES_PASSWORD: restmail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restmail"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.10"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests with race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./internal/...
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: restmail_test
          DB_USER: restmail
          DB_PASS: restmail

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        target:
          - cmd/api
          - cmd/smtp-gateway
          - cmd/imap-gateway
          - cmd/pop3-gateway
          - cmd/console
          - cmd/certgen
          - cmd/migrate
          - cmd/seed
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.10"
          cache: true

      - name: Build ${{ matrix.target }}
        run: CGO_ENABLED=0 go build ./${{ matrix.target }}

  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.2

      - name: Lint and render (render-test.sh)
        run: helm/restmail/tests/render-test.sh

  webmail:
    name: Webmail Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webmail
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: webmail/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  admin:
    name: Admin Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # admin is on Vite 7 / React 19, which require Node ^20.19 || >=22.12
          # (unlike webmail's Vite 5, which still runs on Node 18).
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  # The gate — the one context worth requiring on main, mirroring what e2e.yml
  # already does with `E2E (full topology)`.
  #
  # Branch protection requires checks BY NAME, so requiring the jobs above means
  # every job name is load-bearing: renaming one, splitting one into a matrix, or
  # letting one skip leaves a required check that never reports, which reads as
  # "expected — waiting for status to be reported" forever. Admins are not exempt,
  # and there is no failure to click. It has already happened here once, when
  # `Build` became `Build (cmd/api)` and friends.
  #
  # This job always runs and fails only if a job that actually ran did not
  # succeed, so a skipped job is not a block. Requiring it — and nothing else
  # from this workflow — makes the 13 job names above free to change.
  ci:
    name: CI
    needs: [lint, test, build, helm, webmail, admin]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        env:
          RESULTS: |
            lint=${{ needs.lint.result }}
            test=${{ needs.test.result }}
            build=${{ needs.build.result }}
            helm=${{ needs.helm.result }}
            webmail=${{ needs.webmail.result }}
            admin=${{ needs.admin.result }}
        run: |
          set -euo pipefail
          # `needs.build.result` covers the whole matrix: it is `success` only
          # when every target built.
          fail=0
          while IFS='=' read -r job result; do
            [ -n "$job" ] || continue
            printf '  %-8s %s\n' "$job" "$result"
            case "$result" in
              success | skipped) ;;
              *) fail=1 ;;
            esac
          done <<< "$RESULTS"
          if [ "$fail" = 1 ]; then
            echo "::error::a job did not succeed" >&2
            exit 1
          fi
          echo "  all jobs that ran passed"
