          path: ${{ runner.temp }}/proofs
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Upload example proofs (second try)
        if: steps.upload-proofs.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-proofs-api-${{ matrix.shard }}
          path: ${{ runner.temp }}/proofs
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Upload coverage
        id: upload-coverage
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-part-api-${{ matrix.shard }}
          path: coverage-api-${{ matrix.shard }}.out
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Upload coverage (second try)
        if: steps.upload-coverage.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-part-api-${{ matrix.shard }}
          path: coverage-api-${{ matrix.shard }}.out
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  test-report:
    name: Test report
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    # Joins what Test and both API matrices wrote: the example
    # proofs, judged as one set, and the coverage, as one profile.
    # Waits for every test job, which end minutes apart: no job before it can pick
    # within the gate's 120 s reservation, so it stays on GitHub's runners.
    runs-on: ubuntu-latest
    needs: [preflight, test, test-api, test-handlers, test-contract, test-imap]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Download example proofs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: example-proofs-*
          path: ${{ runner.temp }}/proofs
          merge-multiple: true

      # A pair that needs setup (requires) is not sent by the gate's live run, so a
      # runner must prove it; this fails on any that no in-process test did (#1237).
      # The exception is what a live runner selects: this job cannot see that result,
      # so it leaves those pairs to e2e.yml's union, which the merge queue requires.
      - name: Every example that needs setup is proven
        run: |
          set -euo pipefail
          shopt -s nullglob
          proofs=("$RUNNER_TEMP"/proofs/*.json)
          for shard in 1 2 3 4; do
            if [ ! -s "$RUNNER_TEMP/proofs/example-proofs-api-$shard.json" ]; then
              echo "::error::missing example proofs from internal/api shard $shard" >&2
              exit 1
            fi
          done
          python3 scripts/example_proofs.py --defer-live openapi-example.json "${proofs[@]}"

      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-part-*
          path: ${{ runner.temp }}/coverage
          merge-multiple: true

      # go tool cover adds up the counts of a block that appears in more than one
      # profile, so one mode line and every profile's blocks make the whole.
      - name: Merge coverage
        run: |
          set -euo pipefail
          for profile in rest api-{1..4} handlers-{1..4}; do
            if [ ! -s "$RUNNER_TEMP/coverage/coverage-$profile.out" ]; then
              echo "::error::missing coverage profile: $profile" >&2
              exit 1
            fi
          done
          profiles=("$RUNNER_TEMP"/coverage/*.out)
          modes=$(head -qn1 "${profiles[@]}" | sort -u)
          if [ "$(printf '%s\n' "$modes" | wc -l)" != 1 ]; then
            echo "::error::coverage profiles disagree on the mode: $modes" >&2
            exit 1
          fi
          { echo "$modes"; tail -qn +2 "${profiles[@]}"; } > coverage.out
          echo "merged ${#profiles[@]} profiles, $(wc -l < coverage.out) lines"

      - name: Upload coverage report
        # Only people read this, so losing it must not fail the job.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  attachments-s3:
    needs: preflight
    name: Garage attachment storage
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    runs-on: ${{ fromJSON(needs.preflight.outputs.runners || '{}')['attachments-s3'] || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true
      - name: Verify private attachments against Garage
        run: python3 scripts/garage-attachment-test.py

  build:
    name: Build
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    # Waits for every test job, which end minutes apart: no job before it can pick
    # within the gate's 120 s reservation, so it stays on GitHub's runners.
    runs-on: ubuntu-latest
    needs: [preflight, test, test-api, test-handlers, test-contract, test-imap]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      # A cold build cache can still need modules unused by the test job.
      # Retry downloads after transient proxy errors before compiling once.
      - name: Download build dependencies
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            echo "::warning::Dependency download attempt ${attempt}/3 failed"
          done
          echo "::error::Dependency downloads failed after three attempts"
          exit 1

      # One job, so the seven commands share their compiles and one runner (#1896). -o
      # with a directory links every one of them, as building each alone did.
      - name: Build every command
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/commands/" ./cmd/api ./cmd/smtp-gateway ./cmd/imap-gateway ./cmd/pop3-gateway ./cmd/console ./cmd/migrate ./cmd/seed

  helm:
    needs: preflight
    name: Helm Chart
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    runs-on: ${{ fromJSON(needs.preflight.outputs.runners || '{}')['helm'] || 'ubuntu-24.04' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: ./.github/actions/setup-python

      # helm.yml refuses a version already published, which is too late to say so.
      - name: Refuse a chart change without a new version
        if: github.event_name != 'push'
        run: python3 scripts/check_chart_bump.py --base HEAD^1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.2

      - name: Set up yq
        run: bash scripts/ci/install-yq "$RUNNER_TEMP/bin"

      - name: Lint and render (render-test.sh)
        run: helm/restmail/tests/render-test.sh

      - name: Exercise the optional DANE resolver image
        run: bash helm/restmail/tests/dane-resolver-test.sh

  webmail:
    needs: preflight
    name: Webmail Build
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    runs-on: ${{ fromJSON(needs.preflight.outputs.runners || '{}')['webmail'] || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: webmail
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No `cache: pnpm`: its post-job save fails the job when the store path it
          # resolved from the repository root does not exist, which took down builds
          # that had already passed. Installing two small apps is cheap.
          node-version-file: webmail/package.json

      - name: Enable pnpm
        run: |
          npm install --global corepack@0.34.7
          corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Go for the served API description
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Generate types from this revision's served description
        env:
          RESTMAIL_OPENAPI_OUTPUT: ${{ runner.temp }}/openapi.json
          RESTMAIL_OPENAPI_SOURCE: ${{ runner.temp }}/openapi.json
        run: |
          (cd .. && go test ./internal/api/ -run '^TestTheGeneratedDescriptionIsServed$' -count=1)
          pnpm run generate-types

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  admin:
    needs: preflight
    name: Admin Build
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    runs-on: ${{ fromJSON(needs.preflight.outputs.runners || '{}')['admin'] || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No `cache: pnpm`: its post-job save fails the job when the store path it
          # resolved from the repository root does not exist, which took down builds
          # that had already passed. Installing two small apps is cheap.
          node-version-file: admin/package.json

      - name: Enable pnpm
        run: |
          npm install --global corepack@0.34.7
          corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Go for the served API description
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Generate types from this revision's served description
        env:
          RESTMAIL_OPENAPI_OUTPUT: ${{ runner.temp }}/openapi.json
          RESTMAIL_OPENAPI_SOURCE: ${{ runner.temp }}/openapi.json
        run: |
          (cd .. && go test ./internal/api/ -run '^TestTheGeneratedDescriptionIsServed$' -count=1)
          pnpm run generate-types

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

  # The gate — the one context worth requiring on main, mirroring what e2e.yml
  # already does with `E2E (full topology)`.
  #
  # Branch protection requires checks BY NAME, so requiring the jobs above means
  # every job name is load-bearing: renaming one, splitting one into a matrix, or
  # letting one skip leaves a required check that never reports, which reads as
  # "expected — waiting for status to be reported" forever. Admins are not exempt,
  # and there is no failure to click. It has already happened here once, when
  # `Build` became `Build (cmd/api)` and friends.
  #
  # This job always runs and fails only if a job that actually ran did not
  # succeed, so a skipped job is not a block. Requiring it — and nothing else
  # from this workflow — makes the job names above free to change.
  js-filter:
    needs: preflight
    name: JS Filter
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    # The sidecar that runs javascript filters: its own tests (the sandbox
    # escapes of #160 among them), then the API's filter against it, end to end.
    runs-on: ${{ fromJSON(needs.preflight.outputs.runners || '{}')['js-filter'] || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: projects/js-filter-sidecar
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Retry transient image pull failures
        run: echo "$GITHUB_WORKSPACE/scripts/ci/docker-retry" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The image's Node (Dockerfile: node:22-alpine).
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Cache Vertrag's pinned archive
        uses: ./.github/actions/cache-pinned-tool
        with:
          tool: vertrag

      - name: Install vertrag (pinned + checksum-verified)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ../../scripts/vertrag_pin.py install "$RUNNER_TEMP/bin"

      - name: The sidecar against its description (Vertrag)
        # js-filter-sidecar.json is generated from the API client's own types
        # (TestSidecarDescriptionIsCommitted); here the running sidecar is held to
        # it and to its example pairs, the token check included (#677). The body
        # cap is small so the too_large examples are refused with 413.
        env:
          JS_FILTER_TOKEN: ci-sidecar-token-0123456789
          JS_FILTER_MAX_BODY_BYTES: "2048"
          PORT: "3100"
        run: |
          set -euo pipefail
          node server.js > "$RUNNER_TEMP/sidecar.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3100/health >/dev/null 2>&1 && break
            sleep 1
          done
          "$RUNNER_TEMP/bin/vertrag" run --config vertrag.yml --phases examples

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: The API's javascript filter against the sidecar
        working-directory: .
        run: |
          set -euo pipefail
          go test -count=1 -v -run 'TestJSFilter' ./internal/pipeline/filters/ | tee "$RUNNER_TEMP/jsfilter.log"
          # The end-to-end test skips without node or npm ci; here it must run.
          if grep -q -- '--- SKIP: TestJSFilter_RealSidecar' "$RUNNER_TEMP/jsfilter.log"; then
            echo "::error::TestJSFilter_RealSidecar was skipped" >&2
            exit 1
          fi

      - name: The sidecar's private network in Docker (#122)
        working-directory: .
        env:
          RESTMAIL_JS_FILTER_LIVE: "1"
          JS_FILTER_LIVE_IMAGE: rest-mail-js-filter:live-ci
        run: |
          set -euo pipefail
          docker build -t "$JS_FILTER_LIVE_IMAGE" projects/js-filter-sidecar
          python3 -m unittest discover -s scripts/tests -p test_js_filter_network_live.py -v 2>&1 | tee "$RUNNER_TEMP/jsfilter-live.log"
          # The opt-in test skips without the variable; here it must run.
          if grep -q 'skipped' "$RUNNER_TEMP/jsfilter-live.log"; then
            echo "::error::the live js-filter network test was skipped" >&2
            exit 1
          fi

  first-start:
    needs: preflight
    name: First start
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    # Proves, against the real image, the path a fresh install takes: the
    # first admin signs in with the bootstrap password the installer chose and
    # is forced to choose their own and enroll 2FA, a domain and a mailbox get
    # built, and the restmail CLI hands the server over with reset-admin, over
    # the public API with an owner key (no platform assumed) -- after which
    # nothing the first holder had works, an unexpired access token included.
    # tests/first-start/agent-e2e.sh.
    runs-on: ${{ fromJSON(needs.preflight.outputs.runners || '{}')['first-start'] || 'ubuntu-24.04' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Retry transient image pull failures
        run: echo "$GITHUB_WORKSPACE/scripts/ci/docker-retry" >> "$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Tools
        run: python3 scripts/ci/install_oathtool.py "$RUNNER_TEMP/oathtool"

      - name: Build the CLI and the API image
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/restmail" ./cmd/console
          # A version stamped in, so the run can check it reaches the binary.
          docker build --target prod --build-arg VERSION=0.0.0-first-start -t restmail-api:first-start .

      - name: Sign in with the bootstrap password, build, hand over
        env:
          RESTMAIL: ${{ runner.temp }}/restmail
          IMAGE: restmail-api:first-start
          EXPECT_VERSION: 0.0.0-first-start
        run: tests/first-start/agent-e2e.sh

  webapp-images:
    needs: preflight
    name: Web app image (${{ matrix.app }})
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    runs-on: ${{ fromJSON(needs.preflight.outputs.runners || '{}')[format('webapp-images.{0}', matrix.app)] || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        app: [webmail, admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Retry transient image pull failures
        run: echo "$GITHUB_WORKSPACE/scripts/ci/docker-retry" >> "$GITHUB_PATH"

      - name: Build and serve with the chart's security settings
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          docker build --target prod -t "restmail-$APP:smoke" "$APP"
          owner=$("$GITHUB_WORKSPACE/tasks/tmpfs-owner.sh" 101)
          container=$(docker run -d --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 101:101 \
            --tmpfs "/etc/nginx/conf.d:rw,$owner" \
            --tmpfs "/tmp:rw,$owner" \
            -e NGINX_BASE_PATH=/ -p 127.0.0.1::8080 "restmail-$APP:smoke")
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          origin="http://$(docker port "$container" 8080/tcp)"
          # The published port answers before nginx listens: docker-proxy accepts the
          # connection and resets it. Ask nginx itself from inside the container, so
          # that a reset from any request below is a fault and none of them retries.
          ready=
          for _ in $(seq 1 30); do
            if docker exec "$container" wget -q -O /dev/null http://127.0.0.1:8080/; then
              ready=1
              break
            fi
            sleep 1
          done
          test -n "$ready"
          curl --fail --silent --show-error \
            -D "$RUNNER_TEMP/headers" "$origin/" -o "$RUNNER_TEMP/index.html"
          grep -q '<base href="/">' "$RUNNER_TEMP/index.html"
          grep -qi "connect-src 'self'" "$RUNNER_TEMP/headers"
          curl --fail --silent --show-error "$origin/login" -o "$RUNNER_TEMP/deep.html"
          cmp "$RUNNER_TEMP/index.html" "$RUNNER_TEMP/deep.html"
          asset=$(grep -oE 'src="[^"]+\.js"' "$RUNNER_TEMP/index.html" | head -1 | cut -d '"' -f2)
          test -n "$asset"
          curl --fail --silent --show-error -D "$RUNNER_TEMP/asset-headers" \
            "$origin/${asset#/}" -o "$RUNNER_TEMP/bundle.js"
          grep -Eqi '^content-type:[[:space:]]*(application|text)/(javascript|ecmascript)' "$RUNNER_TEMP/asset-headers"
          test -s "$RUNNER_TEMP/bundle.js"

      - name: Dev server on a read-only root filesystem
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          docker build --target dev -t "restmail-$APP:dev-smoke" "$APP"
          container=$(docker run -d --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 512 --memory 1g --cpus 1.5 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777 \
            -v "$PWD/$APP:/app" -v /app/node_modules \
            -e VITE_BASE_PATH=/ -p 127.0.0.1::3000 "restmail-$APP:dev-smoke")
          trap 'docker logs "$container"; docker rm -fv "$container" >/dev/null; rm -f "$APP/src/hardening-smoke.ts"' EXIT
          origin="http://$(docker port "$container" 3000/tcp)"
          # docker-proxy accepts the connection and then resets it until Vite
          # listens, so retry every error, not only refused connections.
          curl --fail --silent --show-error --retry 60 --retry-all-errors --retry-delay 1 \
            "$origin/" -o "$RUNNER_TEMP/dev-index.html"
          grep -q '/@vite/client' "$RUNNER_TEMP/dev-index.html"
          curl --fail --silent --show-error "$origin/src/main.tsx" -o "$RUNNER_TEMP/dev-main.js"
          test -s "$RUNNER_TEMP/dev-main.js"
          # A real source transform exercises Vite/esbuild and writable caches;
          # a second request must see source edits through the bind mount.
          printf 'export const marker = "readonly-first";\n' > "$APP/src/hardening-smoke.ts"
          curl --fail --silent --show-error "$origin/src/hardening-smoke.ts" | grep -q readonly-first
          printf 'export const marker = "readonly-edited";\n' > "$APP/src/hardening-smoke.ts"
          curl --fail --silent --show-error "$origin/src/hardening-smoke.ts?hardening=edited" | grep -q readonly-edited
          docker exec "$container" sh -ec 'touch /tmp/scratch; touch /app/node_modules/.scratch; rm /app/node_modules/.scratch'
          if docker exec "$container" touch /rootfs-write-must-fail; then
            echo "::error::dev root filesystem is writable" >&2
            exit 1
          fi

  guide:
    needs: preflight
    name: Email, explained
    if: (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]') && (github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    # The guide is checked where it is written, so a broken link, an unsourced
    # chapter or a diagram Archify refuses fails the pull request that broke it
    # (docs/design/email-explained-website.md). Outside links change on other
    # sites' schedules, so scheduled.yml checks those daily.
    runs-on: ${{ fromJSON(needs.preflight.outputs.runners || '{}')['guide'] || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: scripts/email-explained
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: scripts/email-explained/package.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch Archify, at the commit package.json pins
        run: echo "ARCHIFY=$(node fetch-archify.mjs "$RUNNER_TEMP/archify")" >> "$GITHUB_ENV"

      - name: Test the checks and the bundler
        run: npm test

      - name: Check the guide
        run: node check.mjs --archify "$ARCHIFY"

      - name: Build the bundle the website renders
        run: node bundle.mjs --archify "$ARCHIFY" --out "$RUNNER_TEMP/email-explained"

  ci:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref.from == '' && 'CI (ignored edit)' || 'CI' }}
    needs: [preflight, seed-caches, contract-diff, lint, constellation, contract-tooling, test, test-api, test-handlers, test-contract, test-imap, test-report, attachments-s3, build, helm, webmail, admin, js-filter, first-start, webapp-images, guide]
    if: always() && (github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        env:
          RESULTS: |
            preflight=${{ needs.preflight.result }}
            seed-caches=${{ needs.seed-caches.result }}
            contract-diff=${{ needs.contract-diff.result }}
            lint=${{ needs.lint.result }}
            constellation=${{ needs.constellation.result }}
            contract-tooling=${{ needs.contract-tooling.result }}
            test=${{ needs.test.result }}
            test-api=${{ needs.test-api.result }}
            test-handlers=${{ needs.test-handlers.result }}
            test-contract=${{ needs.test-contract.result }}
            test-imap=${{ needs.test-imap.result }}
            test-report=${{ needs.test-report.result }}
            attachments-s3=${{ needs.attachments-s3.result }}
            build=${{ needs.build.result }}
            helm=${{ needs.helm.result }}
            webmail=${{ needs.webmail.result }}
            admin=${{ needs.admin.result }}
            js-filter=${{ needs.js-filter.result }}
            first-start=${{ needs.first-start.result }}
            webapp-images=${{ needs.webapp-images.result }}
            guide=${{ needs.guide.result }}
        run: |
          set -euo pipefail
          # `needs.test-api.result` covers the whole matrix: it is `success` only
          # when every shard passed.
          fail=0
          while IFS='=' read -r job result; do
            [ -n "$job" ] || continue
            printf '  %-12s %s\n' "$job" "$result"
            case "$result" in
              success | skipped) ;;
              *) fail=1 ;;
            esac
          done <<< "$RESULTS"
          if [ "$fail" = 1 ]; then
            echo "::error::a job did not succeed" >&2
            exit 1
          fi
          echo "  all jobs that ran passed"
