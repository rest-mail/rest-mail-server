name: CI

on:
  push:
    branches: [main]
  # Stack layers target parent branches; every PR must receive the same gates.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  # The Vertrag bump (bump-vertrag.yml) dispatches CI for its branch: a pull request it
  # opens with the workflow's own token starts no checks by itself.
  workflow_dispatch:

# A pull request's run for an older push or an older base answers nothing: GitHub
# judges the required check by the newest run, so that one supersedes it. Each run
# on main or by dispatch has a group of its own, so every merged commit keeps its result.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-diff:
    name: API contract changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout the comparison base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .cache/contract-diff-base
          persist-credentials: false

      - name: Set up Go for both generated descriptions
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.10"
          cache: true

      - name: Install the pinned OpenAPI 3.1 comparator
        run: python3 scripts/oasdiff_pin.py install "$RUNNER_TEMP/bin"

      - name: Prove classification and label gates with the real comparator
        env:
          OASDIFF: ${{ runner.temp }}/bin/oasdiff
        run: python3 -m unittest discover -s scripts/tests -p test_contract_diff.py -v

      - name: Generate the base and head descriptions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/contract-diff"
          (
            cd .cache/contract-diff-base
            RESTMAIL_OPENAPI_OUTPUT="$RUNNER_TEMP/contract-diff/base.json" \
              go test -mod=readonly ./internal/api/ -run '^TestTheGeneratedDescriptionIsServed$' -count=1
          )
          RESTMAIL_OPENAPI_OUTPUT="$RUNNER_TEMP/contract-diff/head.json" \
            go test -mod=readonly ./internal/api/ -run '^TestTheGeneratedDescriptionIsServed$' -count=1

      - name: Report contract changes and require deliberate labels
        run: |
          python3 scripts/contract_diff.py \
            "$RUNNER_TEMP/contract-diff/base.json" "$RUNNER_TEMP/contract-diff/head.json" \
            --oasdiff "$RUNNER_TEMP/bin/oasdiff" --event "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/contract-diff"

      - name: Publish the comparison and generated descriptions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-contract-changes
          path: ${{ runner.temp }}/contract-diff
          retention-days: 7
          if-no-files-found: warn

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check constellation inventory
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Test contract tooling
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -m unittest discover -s tests/contract -p 'test_*.py'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.10"
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # v2.1.6 is built with Go 1.24 and refuses to lint a module that
          # targets go 1.25.0 (go.mod). Pin a build made with Go >= 1.25.
          version: v2.11.4
          args: --timeout=5m
          # `config verify` downloads its JSON schema from golangci-lint.run
          # and fails the job when that fetch times out (#508, #521). The
          # run itself still rejects an invalid config.
          verify: false

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: restmail_test
          POSTGRES_USER: restmail
          POSTGRES_PASSWORD: restmail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restmail"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.10"
          cache: true

      - name: Download dependencies
        run: go mod download

      # -timeout is per package, and the race detector slows these packages
      # several times over: internal/api/handlers once ran past go test's
      # default 10 minutes. 20 leaves headroom while a hung test still fails.
      - name: Run unit tests with race detector
        run: go test -race -count=1 -timeout=20m -coverprofile=coverage.out ./internal/... ./tests/contract/fixtureplan
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: restmail_test
          DB_USER: restmail
          DB_PASS: restmail

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  attachments-s3:
    name: Garage attachment storage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.10"
          cache: true
      - name: Verify private attachments against Garage
        run: python3 scripts/garage-attachment-test.py

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        target:
          - cmd/api
          - cmd/smtp-gateway
          - cmd/imap-gateway
          - cmd/pop3-gateway
          - cmd/console
          - cmd/migrate
          - cmd/seed
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.10"
          cache: true

      # A cold build cache can still need modules unused by the test job.
      # Retry downloads after transient proxy errors before compiling once.
      - name: Download build dependencies
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            echo "::warning::Dependency download attempt ${attempt}/3 failed"
          done
          echo "::error::Dependency downloads failed after three attempts"
          exit 1

      - name: Build ${{ matrix.target }}
        run: CGO_ENABLED=0 go build ./${{ matrix.target }}

  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.2

      - name: Lint and render (render-test.sh)
        run: helm/restmail/tests/render-test.sh

  webmail:
    name: Webmail Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webmail
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # corepack ships with the runner's preinstalled Node and activates the
      # pnpm version pinned in package.json, so no extra action needs pinning.
      # It must run BEFORE setup-node, which needs pnpm on PATH to resolve its
      # dependency cache.
      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The supported range lives in the app's package.json (engines.node);
          # setup-node reads it, so CI cannot drift from what the app declares.
          # engine-strict in .npmrc then fails the install if it ever does.
          #
          # No `cache: pnpm`: its post-job save fails the job when the store path it
          # resolved from the repository root does not exist, which took down builds
          # that had already passed. Installing two small apps is cheap.
          node-version-file: webmail/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Go for the served API description
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.10"
          cache: true

      - name: Generate types from this revision's served description
        env:
          RESTMAIL_OPENAPI_OUTPUT: ${{ runner.temp }}/openapi.json
          RESTMAIL_OPENAPI_SOURCE: ${{ runner.temp }}/openapi.json
        run: |
          (cd .. && go test ./internal/api/ -run '^TestTheGeneratedDescriptionIsServed$' -count=1)
          pnpm run generate-types

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  admin:
    name: Admin Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # corepack ships with the runner's preinstalled Node and activates the
      # pnpm version pinned in package.json, so no extra action needs pinning.
      # It must run BEFORE setup-node, which needs pnpm on PATH to resolve its
      # dependency cache.
      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The supported range lives in the app's package.json (engines.node);
          # setup-node reads it, so CI cannot drift from what the app declares.
          # engine-strict in .npmrc then fails the install if it ever does.
          #
          # No `cache: pnpm`: its post-job save fails the job when the store path it
          # resolved from the repository root does not exist, which took down builds
          # that had already passed. Installing two small apps is cheap.
          node-version-file: admin/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Go for the served API description
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.10"
          cache: true

      - name: Generate types from this revision's served description
        env:
          RESTMAIL_OPENAPI_OUTPUT: ${{ runner.temp }}/openapi.json
          RESTMAIL_OPENAPI_SOURCE: ${{ runner.temp }}/openapi.json
        run: |
          (cd .. && go test ./internal/api/ -run '^TestTheGeneratedDescriptionIsServed$' -count=1)
          pnpm run generate-types

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

  # The gate — the one context worth requiring on main, mirroring what e2e.yml
  # already does with `E2E (full topology)`.
  #
  # Branch protection requires checks BY NAME, so requiring the jobs above means
  # every job name is load-bearing: renaming one, splitting one into a matrix, or
  # letting one skip leaves a required check that never reports, which reads as
  # "expected — waiting for status to be reported" forever. Admins are not exempt,
  # and there is no failure to click. It has already happened here once, when
  # `Build` became `Build (cmd/api)` and friends.
  #
  # This job always runs and fails only if a job that actually ran did not
  # succeed, so a skipped job is not a block. Requiring it — and nothing else
  # from this workflow — makes the 13 job names above free to change.
  js-filter:
    name: JS Filter
    # The sidecar that runs javascript filters: its own tests (the sandbox
    # escapes of #160 among them), then the API's filter against it, end to end.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/js-filter-sidecar
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The image's Node (Dockerfile: node:22-alpine).
          node-version: "22"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: The sidecar against its description (Vertrag)
        # js-filter-sidecar.json is generated from the API client's own types
        # (TestSidecarDescriptionIsCommitted); here the running sidecar is held to
        # it and to its example pairs, the token check included (#677). The body
        # cap is small so the too_large examples are refused with 413.
        env:
          JS_FILTER_TOKEN: ci-sidecar-token-0123456789
          JS_FILTER_MAX_BODY_BYTES: "2048"
          PORT: "3100"
        run: |
          set -euo pipefail
          python3 ../../scripts/vertrag_pin.py install "$RUNNER_TEMP/bin"
          node server.js > "$RUNNER_TEMP/sidecar.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3100/health >/dev/null 2>&1 && break
            sleep 1
          done
          "$RUNNER_TEMP/bin/vertrag" run --config vertrag.yml --phases examples

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.10"
          cache: true

      - name: The API's javascript filter against the sidecar
        working-directory: .
        run: |
          set -euo pipefail
          go test -count=1 -v -run 'TestJSFilter' ./internal/pipeline/filters/ | tee "$RUNNER_TEMP/jsfilter.log"
          # The end-to-end test skips without node or npm ci; here it must run.
          if grep -q -- '--- SKIP: TestJSFilter_RealSidecar' "$RUNNER_TEMP/jsfilter.log"; then
            echo "::error::TestJSFilter_RealSidecar was skipped" >&2
            exit 1
          fi

  first-start:
    name: First start
    # Proves, against the real image, the path a fresh install takes: the
    # first admin signs in with the bootstrap password the installer chose and
    # is forced to choose their own and enroll 2FA, a domain and a mailbox get
    # built, and the restmail CLI hands the server over with reset-admin, over
    # the public API with an owner key (no platform assumed) -- after which
    # nothing the first holder had works, an unexpired access token included.
    # tests/first-start/agent-e2e.sh.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.10"
          cache: true

      - name: Tools
        run: sudo apt-get install -y --no-install-recommends oathtool

      - name: Build the CLI and the API image
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/restmail" ./cmd/console
          # A version stamped in, so the run can check it reaches the binary.
          docker build --target prod --build-arg VERSION=0.0.0-first-start -t restmail-api:first-start .

      - name: Sign in with the bootstrap password, build, hand over
        env:
          RESTMAIL: ${{ runner.temp }}/restmail
          IMAGE: restmail-api:first-start
          EXPECT_VERSION: 0.0.0-first-start
        run: tests/first-start/agent-e2e.sh

  webapp-images:
    name: Web app image (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [webmail, admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and serve with the chart's security settings
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          docker build --target prod -t "restmail-$APP:smoke" "$APP"
          container=$(docker run -d --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 101:101 \
            --tmpfs /etc/nginx/conf.d:rw,uid=101,gid=101 \
            --tmpfs /tmp:rw,uid=101,gid=101 \
            -e NGINX_BASE_PATH=/ -p 127.0.0.1::8080 "restmail-$APP:smoke")
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          origin="http://$(docker port "$container" 8080/tcp)"
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            -D "$RUNNER_TEMP/headers" "$origin/" -o "$RUNNER_TEMP/index.html"
          grep -q '<base href="/">' "$RUNNER_TEMP/index.html"
          grep -qi "connect-src 'self'" "$RUNNER_TEMP/headers"
          curl --fail --silent --show-error "$origin/login" -o "$RUNNER_TEMP/deep.html"
          cmp "$RUNNER_TEMP/index.html" "$RUNNER_TEMP/deep.html"
          asset=$(grep -oE 'src="[^"]+\.js"' "$RUNNER_TEMP/index.html" | head -1 | cut -d '"' -f2)
          test -n "$asset"
          curl --fail --silent --show-error -D "$RUNNER_TEMP/asset-headers" \
            "$origin/${asset#/}" -o "$RUNNER_TEMP/bundle.js"
          grep -Eqi '^content-type:[[:space:]]*(application|text)/(javascript|ecmascript)' "$RUNNER_TEMP/asset-headers"
          test -s "$RUNNER_TEMP/bundle.js"

      - name: Dev server on a read-only root filesystem
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          docker build --target dev -t "restmail-$APP:dev-smoke" "$APP"
          container=$(docker run -d --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 512 --memory 1g --cpus 1.5 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777 \
            -v "$PWD/$APP:/app" -v /app/node_modules \
            -e VITE_BASE_PATH=/ -p 127.0.0.1::3000 "restmail-$APP:dev-smoke")
          trap 'docker logs "$container"; docker rm -fv "$container" >/dev/null; rm -f "$APP/src/hardening-smoke.ts"' EXIT
          origin="http://$(docker port "$container" 3000/tcp)"
          # docker-proxy accepts the connection and then resets it until Vite
          # listens, so retry every error, not only refused connections.
          curl --fail --silent --show-error --retry 60 --retry-all-errors --retry-delay 1 \
            "$origin/" -o "$RUNNER_TEMP/dev-index.html"
          grep -q '/@vite/client' "$RUNNER_TEMP/dev-index.html"
          curl --fail --silent --show-error "$origin/src/main.tsx" -o "$RUNNER_TEMP/dev-main.js"
          test -s "$RUNNER_TEMP/dev-main.js"
          # A real source transform exercises Vite/esbuild and writable caches;
          # a second request must see source edits through the bind mount.
          printf 'export const marker = "readonly-first";\n' > "$APP/src/hardening-smoke.ts"
          curl --fail --silent --show-error "$origin/src/hardening-smoke.ts" | grep -q readonly-first
          printf 'export const marker = "readonly-edited";\n' > "$APP/src/hardening-smoke.ts"
          curl --fail --silent --show-error "$origin/src/hardening-smoke.ts?hardening=edited" | grep -q readonly-edited
          docker exec "$container" sh -ec 'touch /tmp/scratch; touch /app/node_modules/.scratch; rm /app/node_modules/.scratch'
          if docker exec "$container" touch /rootfs-write-must-fail; then
            echo "::error::dev root filesystem is writable" >&2
            exit 1
          fi

  ci:
    name: CI
    needs: [contract-diff, lint, test, attachments-s3, build, helm, webmail, admin, js-filter, first-start, webapp-images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        env:
          RESULTS: |
            contract-diff=${{ needs.contract-diff.result }}
            lint=${{ needs.lint.result }}
            test=${{ needs.test.result }}
            attachments-s3=${{ needs.attachments-s3.result }}
            build=${{ needs.build.result }}
            helm=${{ needs.helm.result }}
            webmail=${{ needs.webmail.result }}
            admin=${{ needs.admin.result }}
            js-filter=${{ needs.js-filter.result }}
            first-start=${{ needs.first-start.result }}
            webapp-images=${{ needs.webapp-images.result }}
        run: |
          set -euo pipefail
          # `needs.build.result` covers the whole matrix: it is `success` only
          # when every target built.
          fail=0
          while IFS='=' read -r job result; do
            [ -n "$job" ] || continue
            printf '  %-12s %s\n' "$job" "$result"
            case "$result" in
              success | skipped) ;;
              *) fail=1 ;;
            esac
          done <<< "$RESULTS"
          if [ "$fail" = 1 ]; then
            echo "::error::a job did not succeed" >&2
            exit 1
          fi
          echo "  all jobs that ran passed"
