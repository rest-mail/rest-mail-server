name: Scheduled Checks

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  tidy-check:
    needs: dependency-review
    name: go mod tidy Check
    runs-on: ${{ fromJSON(needs.dependency-review.outputs.runners)['tidy-check'] || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          if [ -n "$(git diff --name-only)" ]; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' and commit the changes."
            git diff
            exit 1
          fi
          echo "go.mod and go.sum are tidy."

  security-audit:
    needs: dependency-review
    name: Security Audit
    runs-on: ${{ fromJSON(needs.dependency-review.outputs.runners)['security-audit'] || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Install govulncheck
        # The newest release may need a newer Go than this module uses, so let it
        # fetch its own: without this the install fails and nothing is scanned.
        env:
          GOTOOLCHAIN: auto
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  frontend-audit:
    needs: dependency-review
    name: Frontend Dependency Audit
    runs-on: ${{ fromJSON(needs.dependency-review.outputs.runners)[format('frontend-audit.{0}', matrix.app)] || 'ubuntu-latest' }}
    strategy:
      # Report both frontends every run; one failing app must not mask the other.
      fail-fast: false
      matrix:
        app: [webmail, admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ matrix.app }}/package.json

      # What the images and CI install is pnpm-lock.yaml, so that is what is audited.
      - name: Enable pnpm
        run: |
          npm install --global corepack@0.34.7
          corepack enable pnpm

      - name: Audit ${{ matrix.app }} dependencies
        working-directory: ${{ matrix.app }}
        # Fail the scheduled run on a high/critical advisory so dependency CVEs
        # surface instead of going unnoticed.
        run: pnpm audit --audit-level=high

  dependency-review:
    name: Dependency Review
    # Picks the runners for the other jobs, so it runs on GitHub's (bootstrap).
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.runners.outputs.runners || '{}' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Check for outdated dependencies
        run: |
          echo "=== Direct dependencies ==="
          go list -m -u all 2>/dev/null | grep '\[' || echo "All dependencies are up to date."

      - name: Pick runners (antimatter-vps runners while free, else GitHub's)
        id: runners
        # runner-gate.antimatter-studios.com answers once per job: an antimatter-vps runner
        # while one is free and every identity on this run is christhomas, otherwise
        # ubuntu-latest; any error is ubuntu-latest too. Its /status page shows the pool.
        # JOBS has one entry per gated job, and one per matrix leg or reusable-workflow call:
        # the gate is asked for the job id before any ".", and the whole entry keys the answer.
        # It is the last step of its job, so it asks only once the run is known to go on.
        # Dependency Review is the cheapest job here and cannot fail, so it picks for the rest.
        env:
          ORG: ${{ github.repository_owner }}
          ACTOR: ${{ github.triggering_actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SENDER: ${{ github.event.sender.login }}
          GH_ACTOR: ${{ github.actor }}
          JOBS: >-
            tidy-check security-audit frontend-audit.webmail frontend-audit.admin
            go-imap-fuzz guide-links
        run: |
          set -euo pipefail
          ours=true
          for who in "$ACTOR" "$GH_ACTOR" "$SENDER" "$AUTHOR"; do
            [ -z "$who" ] || [ "$who" = christhomas ] || ours=false
          done
          pick() {
            $ours || { echo ubuntu-latest; return; }
            r=$(curl -fsS --max-time 10 --get https://runner-gate.antimatter-studios.com/pick \
                  --data-urlencode "org=$ORG" --data-urlencode prefer=antimatter-vps-linux-x64 \
                  --data-urlencode fallback=ubuntu-latest --data-urlencode "actor=$ACTOR" --data-urlencode "author=$AUTHOR" \
                  --data-urlencode "run=${{ github.run_id }}" --data-urlencode "attempt=${{ github.run_attempt }}" \
                  --data-urlencode "job=$1") || r=ubuntu-latest
            case "$r" in antimatter-vps-linux-x64|ubuntu-latest) echo "$r" ;; *) echo ubuntu-latest ;; esac
          }
          runners='{}'
          for entry in $JOBS; do
            runners=$(jq -c --arg j "$entry" --arg r "$(pick "${entry%%.*}")" '. + {($j): $r}' <<<"$runners")
          done
          echo "$runners" | jq . | tee -a "$GITHUB_STEP_SUMMARY"
          echo "runners=$runners" >> "$GITHUB_OUTPUT"

  go-imap-fuzz:
    needs: dependency-review
    name: Vendored go-imap fuzzing
    # Every fuzz target in third_party/go-imap (#1925); go test on a pull request runs
    # only their seed inputs. A failure opens an issue (or updates the one that is
    # open) and keeps the failing inputs as an artifact; the issue closes itself once
    # a whole run passes. Nine targets, at most ten minutes each.
    runs-on: ${{ fromJSON(needs.dependency-review.outputs.runners)['go-imap-fuzz'] || 'ubuntu-latest' }}
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "Vendored go-imap: nightly fuzzing found a failure"
      FUZZTIME: 500000x
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the GitHub CLI
        uses: ./.github/actions/setup-gh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Fuzz every target
        id: fuzz
        working-directory: third_party/go-imap
        env:
          FUZZ_LOG_DIR: ${{ runner.temp }}/go-imap-fuzz
        run: ../../scripts/ci/go-imap-fuzz

      - name: Keep the logs and failing inputs
        if: failure() && steps.fuzz.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-imap-fuzz-findings
          path: |
            ${{ runner.temp }}/go-imap-fuzz
            third_party/go-imap/pkg/**/testdata/fuzz/**
          retention-days: 30
          if-no-files-found: warn

      - name: Open or update the issue
        if: failure() && steps.fuzz.outcome == 'failure'
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/go-imap-fuzz"
          {
            echo "The nightly fuzzing of \`third_party/go-imap\` failed. Each failing input is in the \`go-imap-fuzz-findings\` artifact of [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID), at the package's \`testdata/fuzz/<target>\`: commit it there to keep it as a seed, and fix the cause. This issue closes itself once a whole run passes."
            if [ ! -s "$logs/failed.txt" ]; then
              echo
              echo "No target recorded a failure, so the run failed before or between them: read the run's log."
            fi
            while read -r target package; do
              echo
              echo "**$target** in \`$package\`:"
              echo
              echo '```'
              tail -n 25 "$logs/$target.log" 2>/dev/null || echo "no log"
              echo '```'
            done < "$logs/failed.txt"
          } > "$RUNNER_TEMP/issue.md"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label bug --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label bug --body-file "$RUNNER_TEMP/issue.md"
          fi

      - name: Close the issue once every target passes
        if: success()
        run: |
          set -euo pipefail
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label bug --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Every fuzz target passes again ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))."
          fi

  guide-links:
    needs: dependency-review
    name: Email, explained outside links
    # Every outside link in docs/email-explained, and every anchor in one, still
    # answers. A broken one opens an issue listing them (or updates the one that
    # is open), and the issue closes itself once they all answer again.
    runs-on: ${{ fromJSON(needs.dependency-review.outputs.runners)['guide-links'] || 'ubuntu-latest' }}
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "Email, explained: outside links that no longer answer"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the GitHub CLI
        uses: ./.github/actions/setup-gh

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: scripts/email-explained/package.json

      - name: Install dependencies
        working-directory: scripts/email-explained
        run: npm ci

      - name: Check every outside link
        id: links
        working-directory: scripts/email-explained
        run: |
          set -o pipefail
          node check.mjs --external | tee "$RUNNER_TEMP/links.txt"

      - name: Open or update the issue
        if: failure() && steps.links.outcome == 'failure'
        run: |
          set -euo pipefail
          {
            echo "The daily check of [Email, explained]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/email-explained/README.md) found outside links that no longer answer, or anchors no longer on their page. Fix or replace each one; this issue closes itself once they all answer."
            echo
            echo '```'
            grep -E '^(broken|refused)' "$RUNNER_TEMP/links.txt" || true
            echo '```'
            echo
            echo "From [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } > "$RUNNER_TEMP/issue.md"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label documentation --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label documentation --body-file "$RUNNER_TEMP/issue.md"
          fi

      - name: Close the issue once every link answers
        if: success()
        run: |
          set -euo pipefail
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label documentation --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Every outside link answers again ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))."
          fi
