name: Contract faults

# Nightly, proof that the contract run catches faults (#654): the E2E topology
# comes up and passes its stages as usual, then the API is rebuilt with each
# fault in tests/contract/faults.yml (Go build tags, so a normal build holds no
# fault code), and the phase each fault names must turn red on its operation.
# A fault that stops being caught fails this run; faults.md in the run's
# e2e-container-logs artifact says which. Adding a fault: tests/contract/README.md.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: contract-faults
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  faults:
    name: Contract tests (faults)
    uses: ./.github/workflows/e2e-suite.yml
    with:
      contract-phases: faults
