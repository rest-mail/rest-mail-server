name: Release CLI

# Releases `restmail`, the command-line tool, on a SemVer tag (v1.2.3): a
# GitHub Release with binaries for macOS and Linux, and a build-provenance
# attestation for each archive. The build itself is .goreleaser.yaml.
#
# It pushes to no Homebrew tap. antimatter-studios/homebrew-tap pulls instead:
# a person runs its sync, which reads these public releases, checks each
# archive's own sha256 and its attestation, and writes a branch for a person
# to open and merge. Nothing here can change what `brew install` gives
# anybody, which is the point. A pull request that
# touches the CLI or its release runs a snapshot build instead, which builds
# everything and publishes nothing, so a broken release config fails there
# rather than on the day of a release.
#
# The same v* tag releases the server images (docker.yml). The release names
# its tags explicitly rather than leaving GoReleaser to take the newest tag of
# any kind, so a tag that is not a release can never be mistaken for one.

on:
  push:
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - cmd/console/**
      - internal/console/**
      - .goreleaser.yaml
      - .github/workflows/release-cli.yml
      - scripts/ci/install-goreleaser

permissions:
  contents: read

jobs:
  preflight:
    name: 'Preflight: branch is up to date'
    if: github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    runs-on: antimatter-vps-linux-x64
    timeout-minutes: 5
    steps:
      - name: Checkout the pull request head, not GitHub's merge commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Require the current base tip in the pull request head
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Preflight: $EVENT_NAME needs no pull request ancestry check."
            exit 0
          fi
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          base_sha=$(git rev-parse "refs/remotes/origin/${BASE_REF}")
          if git merge-base --is-ancestor "$base_sha" "$HEAD_SHA"; then
            echo "Preflight: head $HEAD_SHA contains $BASE_REF ($base_sha)."
            exit 0
          fi
          message="Preflight: this branch (head $HEAD_SHA) is not up to date with $BASE_REF ($base_sha). You cannot push a branch that is not up to date with origin/$BASE_REF ($base_sha). Rebase it onto origin/$BASE_REF first, then push again. Nothing else in this pipeline runs until you do. Run: git fetch origin $BASE_REF && git rebase origin/$BASE_REF"
          echo "::error::$message" >&2
          echo "$message" >&2
          exit 1

  release:
    needs: preflight
    name: Release the restmail CLI
    if: github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    runs-on: antimatter-vps-linux-x64
    permissions:
      contents: write # creates the GitHub Release
      id-token: write # signs the build-provenance attestation
      attestations: write # records it against this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser reads tags and history for the version and changelog.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Install GoReleaser (pinned, checksummed, download retried)
        # Only the download is tried again, for longer than goreleaser-action
        # tried: a GitHub 504 outlasted it on 2026-11-09 (run 42582420200). The
        # script never runs goreleaser, so a build that fails is never mistaken
        # for a download that failed, and the two steps below run it once.
        run: scripts/ci/install-goreleaser "$RUNNER_TEMP/bin"

      - name: Name the tags this release spans
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          current="${GITHUB_REF_NAME}"
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -vxF "$current" | head -1 || true)
          echo "GORELEASER_CURRENT_TAG=$current" >> "$GITHUB_ENV"
          [ -n "$previous" ] && echo "GORELEASER_PREVIOUS_TAG=$previous" >> "$GITHUB_ENV"
          echo "releasing $current (changelog since ${previous:-the beginning})"

      - name: Release
        if: github.event_name == 'push'
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest what was built
        # Signs a provenance statement naming this workflow, this commit and
        # the digest of every artifact, so whoever installs one can check it
        # was built here and not substituted since:
        #   gh attestation verify <file> --repo rest-mail/rest-mail-server
        # antimatter-studios/homebrew-tap refuses to take a release without
        # one, which is how it knows a tarball it is about to put behind
        # `brew install` came from this repository.
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Snapshot build (nothing published)
        if: github.event_name == 'pull_request'
        run: goreleaser release --snapshot --clean
        env:
          GORELEASER_CURRENT_TAG: v0.0.0
