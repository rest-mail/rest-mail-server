name: Release CLI

# Releases `restmail`, the command-line tool, on a SemVer tag (v1.2.3): a
# GitHub Release with binaries for macOS and Linux, and a build-provenance
# attestation for each archive. The build itself is .goreleaser.yaml.
#
# It pushes to no Homebrew tap. antimatter-studios/homebrew-tap pulls instead:
# a person runs its sync, which reads these public releases, checks each
# archive's own sha256 and its attestation, and writes a branch for a person
# to open and merge. Nothing here can change what `brew install` gives
# anybody, which is the point. A pull request that
# touches the CLI or its release runs a snapshot build instead, which builds
# everything and publishes nothing, so a broken release config fails there
# rather than on the day of a release.
#
# The same v* tag releases the server images (docker.yml). The release names
# its tags explicitly rather than leaving GoReleaser to take the newest tag of
# any kind, so a tag that is not a release can never be mistaken for one.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - cmd/console/**
      - internal/console/**
      - .goreleaser.yaml
      - .github/workflows/release-cli.yml

permissions:
  contents: read

jobs:
  release:
    name: Release the restmail CLI
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub Release
      id-token: write # signs the build-provenance attestation
      attestations: write # records it against this repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # GoReleaser reads tags and history for the version and changelog.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.10"
          cache: true

      - name: Name the tags this release spans
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          current="${GITHUB_REF_NAME}"
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -vxF "$current" | head -1 || true)
          echo "GORELEASER_CURRENT_TAG=$current" >> "$GITHUB_ENV"
          [ -n "$previous" ] && echo "GORELEASER_PREVIOUS_TAG=$previous" >> "$GITHUB_ENV"
          echo "releasing $current (changelog since ${previous:-the beginning})"

      - name: Release
        if: github.event_name == 'push'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest what was built
        # Signs a provenance statement naming this workflow, this commit and
        # the digest of every artifact, so whoever installs one can check it
        # was built here and not substituted since:
        #   gh attestation verify <file> --repo rest-mail/rest-mail-server
        # antimatter-studios/homebrew-tap refuses to take a release without
        # one, which is how it knows a tarball it is about to put behind
        # `brew install` came from this repository.
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Snapshot build (nothing published)
        if: github.event_name == 'pull_request'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --snapshot --clean
        env:
          GORELEASER_CURRENT_TAG: v0.0.0
