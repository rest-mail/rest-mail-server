name: Auto-merge

# Every pull request into main is set to squash-merge itself once the checks
# that protect main have passed (CI, which includes the first-start run, and
# E2E (full topology)). This only asks for the merge; branch protection decides
# when, so nothing merges on red.
#
# Branch protection also wants a pull request up to date with main before it
# merges. When one merges, every other armed pull request falls behind and
# would sit waiting for someone to press "Update branch", so on each push to
# main this does that for them, and their checks run again on the result.
#
# Both are done with a personal access token rather than this workflow's own
# GITHUB_TOKEN, because GitHub starts no workflow run for an event that
# GITHUB_TOKEN caused: armed that way, a merge into main would start no
# release, and an updated branch no checks. PIPELINE_RESTMAIL_TOKEN must hold
# Contents, Pull requests and Workflows (read and write) on this repository.
# A fine-grained token expires; when it does, nothing auto-merges and nothing
# names a credential as the cause, so look here first.
on:
  pull_request:
    # `edited` covers a stacked pull request retargeted to main after the one
    # beneath it merges.
    types: [opened, reopened, synchronize, ready_for_review, edited]
  push:
    branches: [main]

# Nothing here uses GITHUB_TOKEN, so it is given nothing.
permissions: {}

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  arm:
    name: Arm auto-merge
    # This repository's own branches, into main, and never a draft. A pull
    # request from a fork is never given the token, so it could not arm it
    # anyway; saying so here makes it a skip rather than an authentication
    # error someone has to read a log to understand.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --auto --squash --delete-branch "$PR"
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_RESTMAIL_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}

  catch-up:
    name: Bring armed pull requests up to date
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Update every armed pull request that main has moved past
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_RESTMAIL_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # GitHub works out which pull requests main has just moved past a few
          # seconds after the push; until then they read UNKNOWN, not BEHIND.
          sleep 30
          prs=$(gh pr list --repo "$REPO" --base main --state open \
            --json number,isDraft,autoMergeRequest,mergeStateStatus \
            --jq '.[] | select(.autoMergeRequest != null and (.isDraft | not) and .mergeStateStatus == "BEHIND") | .number')
          if [ -z "$prs" ]; then
            echo "nothing behind"
            exit 0
          fi
          for pr in $prs; do
            # One that conflicts cannot be updated this way; it waits for a person.
            if gh pr update-branch "$pr" --repo "$REPO"; then
              echo "updated #$pr"
            else
              echo "::warning::#$pr could not be brought up to date (a conflict?)"
            fi
          done
