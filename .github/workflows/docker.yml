name: Docker Build & Push

on:
  push:
    branches: [main]
    # CalVer product-image releases (YYYY.MM.DD[.N]). The CalVer tag is what the
    # Helm chart's appVersion pins, so a release = pushing that git tag. SemVer
    # v* tags release the restmail CLI instead (release-cli.yml).
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # One image per component under the owner namespace: ghcr.io/<owner>/<component>
  # (e.g. ghcr.io/rest-mail/api). This must match the image repositories the Helm
  # chart pulls (helm/restmail/values.yaml).
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    # Build the images on main (continuous dev images) and on a CalVer release
    # tag. A SemVer v* tag releases only the CLI (release-cli.yml) and does not
    # reach this workflow; the guard stays so it never builds images if it did.
    if: >-
      github.ref == 'refs/heads/main' ||
      (startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile
            context: .
          - image: smtp-gateway
            dockerfile: projects/smtp-gateway/Dockerfile
            context: .
          - image: imap-gateway
            dockerfile: projects/imap-gateway/Dockerfile
            context: .
          - image: pop3-gateway
            dockerfile: projects/pop3-gateway/Dockerfile
            context: .
          - image: js-filter
            dockerfile: projects/js-filter-sidecar/Dockerfile
            context: projects/js-filter-sidecar
          - image: webmail
            dockerfile: webmail/Dockerfile
            context: ./webmail
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          # event=tag emits the git tag verbatim, preserving a CalVer tag's leading
          # zeros (2026.04.28) that type=semver would strip to 2026.4.28 and so no
          # longer match the chart's appVersion. Branch pushes tag the dev image
          # (main); every push also carries the commit sha; :latest tracks main.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
