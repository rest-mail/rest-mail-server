name: Docker Build & Push

on:
  push:
    branches: [main]
    # A release is one SemVer tag (v1.2.3) for everything built from that
    # commit: these images here, the restmail CLI in release-cli.yml, and the
    # chart's appVersion. See docs/ecosystem/CONVENTIONS.md.
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # One image per component under the owner namespace: ghcr.io/<owner>/<component>
  # (e.g. ghcr.io/rest-mail/api). This must match the image repositories the Helm
  # chart pulls (helm/restmail/values.yaml).
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    # On main (continuous dev images) and on a release tag.
    if: >-
      github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile
            context: .
          - image: smtp-gateway
            dockerfile: projects/smtp-gateway/Dockerfile
            context: .
          - image: imap-gateway
            dockerfile: projects/imap-gateway/Dockerfile
            context: .
          - image: pop3-gateway
            dockerfile: projects/pop3-gateway/Dockerfile
            context: .
          - image: js-filter
            dockerfile: projects/js-filter-sidecar/Dockerfile
            context: projects/js-filter-sidecar
          - image: webmail
            dockerfile: webmail/Dockerfile
            context: ./webmail
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          # A release tag v1.2.3 becomes image tag 1.2.3, which is what the
          # chart's appVersion names. Branch pushes tag the dev image (main);
          # every push also carries the commit sha; :latest tracks main.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
