name: Docker Build & Push

on:
  push:
    branches: [main]
    # A release is one SemVer tag (v1.2.3) for everything built from that
    # commit: these images here, the restmail CLI in release-cli.yml, and the
    # chart's appVersion. See docs/ecosystem/CONVENTIONS.md.
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # One image per component under the owner namespace: ghcr.io/<owner>/<component>
  # (e.g. ghcr.io/rest-mail/api). This must match the image repositories the Helm
  # chart pulls (helm/restmail/values.yaml).
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    # On main (continuous dev images) and on a release tag.
    if: >-
      github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile
            context: .
          - image: smtp-gateway
            dockerfile: projects/smtp-gateway/Dockerfile
            context: .
          - image: imap-gateway
            dockerfile: projects/imap-gateway/Dockerfile
            context: .
          - image: pop3-gateway
            dockerfile: projects/pop3-gateway/Dockerfile
            context: .
          - image: js-filter
            dockerfile: projects/js-filter-sidecar/Dockerfile
            context: projects/js-filter-sidecar
          - image: webmail
            dockerfile: webmail/Dockerfile
            context: ./webmail
          - image: admin
            dockerfile: admin/Dockerfile
            context: ./admin
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          # A release tag v1.2.3 becomes image tag 1.2.3, which is what the
          # chart's appVersion names. Branch pushes tag the dev image (main);
          # every push also carries the commit sha; :latest tracks main.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # What the binary reports about itself (internal/version). Without
          # these every image said "dev": the Dockerfile's ARG defaults to it,
          # and the build has no .git to read a commit from. A v* tag gives
          # its version (0.3.0), a branch its name (main).
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
