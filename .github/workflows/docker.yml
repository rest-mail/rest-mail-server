name: Docker Build & Push

on:
  push:
    branches: [main]
    # A release is one SemVer tag (v1.2.3) for everything built from that
    # commit: these images here, the restmail CLI in release-cli.yml, and the
    # chart's appVersion. See docs/ecosystem/CONVENTIONS.md.
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  # The image scan uploads its SARIF to code scanning (main only).
  security-events: write

env:
  REGISTRY: ghcr.io
  # One image per component under the owner namespace: ghcr.io/<owner>/<component>
  # (e.g. ghcr.io/rest-mail/api). This must match the image repositories the Helm
  # chart pulls (helm/restmail/values.yaml).
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    # The slowest job in the last 29 successful runs took 12.6 minutes. Without a
    # bound a hung build holds a runner from the merge queue for six hours (#1847).
    timeout-minutes: 30
    # On main (continuous dev images) and on a release tag.
    if: >-
      github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      # Each image reports its own scan: without this the first failure cancels
      # the others and hides their findings (#1947). The job still fails.
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile
            context: .
          - image: smtp-gateway
            dockerfile: projects/smtp-gateway/Dockerfile
            context: .
          - image: imap-gateway
            dockerfile: projects/imap-gateway/Dockerfile
            context: .
          - image: pop3-gateway
            dockerfile: projects/pop3-gateway/Dockerfile
            context: .
          - image: js-filter
            dockerfile: projects/js-filter-sidecar/Dockerfile
            context: projects/js-filter-sidecar
          - image: webmail
            dockerfile: webmail/Dockerfile
            context: ./webmail
          - image: admin
            dockerfile: admin/Dockerfile
            context: ./admin
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build-push-action runs `docker buildx build`, so a registry 502 on a FROM
      # retries here, as it does in the jobs that call docker themselves (#1942).
      - name: Retry transient image pull failures
        run: echo "$GITHUB_WORKSPACE/scripts/ci/docker-retry" >> "$GITHUB_PATH"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          # A release tag v1.2.3 becomes image tag 1.2.3, which is what the
          # chart's appVersion names. Branch pushes tag the dev image (main);
          # every push also carries the commit sha; :latest tracks main.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ !startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.tags || '' }}
          outputs: ${{ startsWith(github.ref, 'refs/tags/v') && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.IMAGE_PREFIX, matrix.image) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          # What the binary reports about itself (internal/version). Without
          # these every image said "dev": the Dockerfile's ARG defaults to it,
          # and the build has no .git to read a commit from. A v* tag gives
          # its version (0.3.0), a branch its name (main).
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          # A release image carries its SBOM (SPDX) and full build provenance
          # as attestations in the image index, so they travel with the image
          # and anyone can read them from the registry:
          #   docker buildx imagetools inspect <image>:<version> --format '{{ json .SBOM }}'
          # Dev images from main keep the default (minimal provenance, no SBOM).
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') }}
          provenance: ${{ startsWith(github.ref, 'refs/tags/v') && 'mode=max' || '' }}

      - name: Record the built registry digest
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/release-digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/release-digests/$IMAGE.digest"

      - name: Upload the built registry digest
        id: upload-digest
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-digest-${{ github.run_attempt }}-${{ matrix.image }}
          path: ${{ runner.temp }}/release-digests/${{ matrix.image }}.digest
          if-no-files-found: error
          overwrite: true

      - name: Upload the built registry digest (second try)
        if: steps.upload-digest.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-digest-${{ github.run_attempt }}-${{ matrix.image }}
          path: ${{ runner.temp }}/release-digests/${{ matrix.image }}.digest
          if-no-files-found: error
          overwrite: true

      # Scan exactly what was pushed: the image by digest, once per platform.
      # Every finding is reported (code scanning on main, the job summary
      # always); a CRITICAL or HIGH vulnerability that has a fix fails the job.
      # Exceptions go in .trivyignore, each with a reason and an issue link.
      - name: Scan image (report all findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          # Named, not left to the action's default: scripts/image_scan.py runs
          # this same version locally.
          version: v0.70.0
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          trivyignores: .trivyignore
          exit-code: "0"

      - name: Upload scan to code scanning
        if: github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-image-${{ matrix.image }}

      - name: Scan image for fixable CRITICAL/HIGH (linux/amd64)
        id: gate-amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          skip-setup-trivy: true
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy-${{ matrix.image }}-amd64.txt
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Scan image for fixable CRITICAL/HIGH (linux/arm64)
        id: gate-arm64
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          skip-setup-trivy: true
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy-${{ matrix.image }}-arm64.txt
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Write scan results to the job summary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          AMD64: ${{ steps.gate-amd64.outcome }}
          ARM64: ${{ steps.gate-arm64.outcome }}
        run: |
          {
            echo "## Image scan: ${IMAGE}"
            echo
            echo "Digest \`${DIGEST}\`. Fixable CRITICAL/HIGH fail the job; all findings are in code scanning (main)."
            for arch in amd64 arm64; do
              outcome=AMD64; [ "$arch" = arm64 ] && outcome=ARM64
              echo
              echo "### linux/${arch}: ${!outcome}"
              f="trivy-${IMAGE}-${arch}.txt"
              if [ -s "$f" ]; then
                echo '```text'
                cat "$f"
                echo '```'
              else
                echo "No fixable CRITICAL or HIGH vulnerabilities."
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          # Also in the log, where the job's failure points.
          cat trivy-"${IMAGE}"-*.txt 2>/dev/null || true

  release-evidence:
    name: Release image evidence
    needs: build-and-push
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the same-attempt build digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-digest-${{ github.run_attempt }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-digests

      - name: Collect scans and CycloneDX SBOMs from the built images
        id: collect
        timeout-minutes: 12
        run: |
          project="restmail-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/release_evidence.py collect --platform linux/amd64 \
            --directory "$RUNNER_TEMP/release-evidence" --registry-prefix "$IMAGE_PREFIX" \
            --registry-digests "$RUNNER_TEMP/release-digests" --tag-prefix "$project/" \
            --label "restmail-release-evidence=$project"

      - name: Probe TLS renewal and the fresh-start baseline
        if: ${{ !cancelled() && steps.collect.outcome != 'skipped' }}
        timeout-minutes: 10
        run: |
          python3 scripts/release_fresh_start.py --directory "$RUNNER_TEMP/release-evidence" \
            --project "restmail-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Tear down release evidence resources
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: |
          label="label=restmail-release-evidence=restmail-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          status=0
          docker ps -aq --filter "$label" | xargs -r docker rm -fv || status=1
          docker network ls -q --filter "$label" | xargs -r docker network rm || status=1
          docker volume ls -q --filter "$label" | xargs -r docker volume rm || status=1
          exit "$status"

      - name: Upload the release image receipt
        id: upload-receipt
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: error
          overwrite: true

      - name: Upload the release image receipt (second try)
        if: always() && steps.upload-receipt.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: error
          overwrite: true

  promote-release-images:
    name: Promote release images
    needs: [build-and-push, release-evidence]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the same-attempt build digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-digest-${{ github.run_attempt }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-digests

      - name: Download the same-attempt release image receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-image-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence

      - name: Gate and promote release images
        env:
          RELEASE_DIGESTS: ${{ runner.temp }}/release-digests
          RELEASE_EVIDENCE: ${{ runner.temp }}/release-evidence
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          tag=${GITHUB_REF_NAME#v}
          tag=${tag%%+*}
          images=()
          for file in "$RELEASE_DIGESTS"/*.digest; do
            name=$(basename "$file" .digest)
            images+=(--image "$name=$(cat "$file")")
          done
          python3 scripts/release_gate.py --evidence-directory "$RELEASE_EVIDENCE" --commit "$GITHUB_SHA" "${images[@]}"
          for ((index=1; index<${#images[@]}; index+=2)); do
            name=${images[index]%%=*}
            digest=${images[index]#*=}
            docker buildx imagetools create --tag "$IMAGE_PREFIX/$name:$tag" "$IMAGE_PREFIX/$name@$digest"
          done
