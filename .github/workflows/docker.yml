name: Docker Build & Push

on:
  push:
    branches: [main]
    # A release is one SemVer tag (v1.2.3) for everything built from that
    # commit: these images here, the restmail CLI in release-cli.yml, and the
    # chart's appVersion. See docs/ecosystem/CONVENTIONS.md.
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  # The image scan uploads its SARIF to code scanning (main only).
  security-events: write

env:
  REGISTRY: ghcr.io
  # One image per component under the owner namespace: ghcr.io/<owner>/<component>
  # (e.g. ghcr.io/rest-mail/api). This must match the image repositories the Helm
  # chart pulls (helm/restmail/values.yaml).
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    # The slowest job in the last 29 successful runs took 12.6 minutes. Without a
    # bound a hung build holds a runner from the merge queue for six hours (#1847).
    timeout-minutes: 30
    # On main (continuous dev images) and on a release tag.
    if: >-
      github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      # Each image reports its own scan: without this the first failure cancels
      # the others and hides their findings (#1947). The job still fails.
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile
            context: .
          - image: smtp-gateway
            dockerfile: projects/smtp-gateway/Dockerfile
            context: .
          - image: imap-gateway
            dockerfile: projects/imap-gateway/Dockerfile
            context: .
          - image: pop3-gateway
            dockerfile: projects/pop3-gateway/Dockerfile
            context: .
          - image: js-filter
            dockerfile: projects/js-filter-sidecar/Dockerfile
            context: projects/js-filter-sidecar
          - image: webmail
            dockerfile: webmail/Dockerfile
            context: ./webmail
          - image: admin
            dockerfile: admin/Dockerfile
            context: ./admin
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build-push-action runs `docker buildx build`, so a registry 502 on a FROM
      # retries here, as it does in the jobs that call docker themselves (#1942).
      - name: Retry transient image pull failures
        run: echo "$GITHUB_WORKSPACE/scripts/ci/docker-retry" >> "$GITHUB_PATH"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          # A release tag v1.2.3 becomes image tag 1.2.3, which is what the
          # chart's appVersion names. Branch pushes tag the dev image (main);
          # every push also carries the commit sha; :latest tracks main.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # What the binary reports about itself (internal/version). Without
          # these every image said "dev": the Dockerfile's ARG defaults to it,
          # and the build has no .git to read a commit from. A v* tag gives
          # its version (0.3.0), a branch its name (main).
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          # A release image carries its SBOM (SPDX) and full build provenance
          # as attestations in the image index, so they travel with the image
          # and anyone can read them from the registry:
          #   docker buildx imagetools inspect <image>:<version> --format '{{ json .SBOM }}'
          # Dev images from main keep the default (minimal provenance, no SBOM).
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') }}
          provenance: ${{ startsWith(github.ref, 'refs/tags/v') && 'mode=max' || '' }}

      # Scan exactly what was pushed: the image by digest, once per platform.
      # Every finding is reported (code scanning on main, the job summary
      # always); a CRITICAL or HIGH vulnerability that has a fix fails the job.
      # Exceptions go in .trivyignore, each with a reason and an issue link.
      - name: Scan image (report all findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          # Named, not left to the action's default: scripts/image_scan.py runs
          # this same version locally.
          version: v0.70.0
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          trivyignores: .trivyignore
          exit-code: "0"

      - name: Upload scan to code scanning
        if: github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-image-${{ matrix.image }}

      - name: Scan image for fixable CRITICAL/HIGH (linux/amd64)
        id: gate-amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          skip-setup-trivy: true
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy-${{ matrix.image }}-amd64.txt
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Scan image for fixable CRITICAL/HIGH (linux/arm64)
        id: gate-arm64
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          skip-setup-trivy: true
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy-${{ matrix.image }}-arm64.txt
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Write scan results to the job summary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          AMD64: ${{ steps.gate-amd64.outcome }}
          ARM64: ${{ steps.gate-arm64.outcome }}
        run: |
          {
            echo "## Image scan: ${IMAGE}"
            echo
            echo "Digest \`${DIGEST}\`. Fixable CRITICAL/HIGH fail the job; all findings are in code scanning (main)."
            for arch in amd64 arm64; do
              outcome=AMD64; [ "$arch" = arm64 ] && outcome=ARM64
              echo
              echo "### linux/${arch}: ${!outcome}"
              f="trivy-${IMAGE}-${arch}.txt"
              if [ -s "$f" ]; then
                echo '```text'
                cat "$f"
                echo '```'
              else
                echo "No fixable CRITICAL or HIGH vulnerabilities."
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          # Also in the log, where the job's failure points.
          cat trivy-"${IMAGE}"-*.txt 2>/dev/null || true
