name: E2E suite

# The full end-to-end topology and everything run against it, with the JavaScript
# filter isolation proof in a job beside it, as a reusable workflow: e2e.yml runs
# it on every code change (its gate is the required
# check `E2E (full topology)`), contract-fuzz.yml runs it nightly with the
# contract tests' fuzz phase instead of their gating phases, and
# contract-faults.yml runs it nightly with the fault run (#654) instead.
on:
  workflow_call:
    inputs:
      contract-phases:
        description: >-
          "gate" runs the examples and coverage gates; "pairs" runs the independent
          example-pair shards; "reports" runs authorization
          and ownership reports; "live" runs independent live proofs; "fuzz" runs the fuzz phase, reports what it
          finds as an artifact, and fails nothing; "faults" builds the API
          with each fault in tests/contract/faults.yml and fails unless the
          phase each one names turns red.
        type: string
        default: gate
      description-mode:
        description: Read the generated JSON from its exact saved bytes or live URL
        type: string
        default: saved

permissions:
  contents: read
  packages: read

jobs:
  suite:
    name: topology
    runs-on: ubuntu-latest
    # The suite took 52 minutes before the live proofs, which may take up to 25.
    timeout-minutes: 85
    env:
      # Flip "stack not reachable" preconditions (no admin token, gateway not
      # dialable, …) from t.Skip into t.Fatal inside the suite — see
      # tests/e2e/suite_test.go. A half-up topology must go RED, never green by
      # skipping every stage. Forwarded into the test container by `test:e2e`.
      E2E_REQUIRE_STACK: "1"
      # The dev containers keep their Go build cache in a volume for this run, instead of
      # on a tmpfs lost at every restart. The API alone restarts four times, at about
      # 70 s of compiling each, and each isolation instance recompiles everything (#1896).
      # tasks/dev-gocache.sh. The binaries are the same: the cache is keyed by their inputs.
      RESTMAIL_DEV_GOCACHE_VOLUME: rest-mail-dev-gocache
      RESTMAIL_CONTRACT_LIMITS_RAISED: ${{ (inputs.contract-phases == 'gate' || inputs.contract-phases == 'pairs' || inputs.contract-phases == 'reports' || inputs.contract-phases == 'live') && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Retry transient image pull failures
        run: echo "$GITHUB_WORKSPACE/scripts/ci/docker-retry" >> "$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Install chore (the newest release, attested)
        # The repo is driven by chores.yml, whose tasks declare `args:`. go-task
        # parses the file but ignores those declarations, so a task that takes a
        # parameter silently runs with its default — CI has to use the same runner
        # as a developer's machine or it is testing something else.
        #
        # So it installs what a developer would: the newest release. chores.yml
        # names the oldest chore that can read it (chore_min_version), and CI
        # refuses to run below that floor rather than fail on an unknown field.
        #
        # Do NOT pipe-execute an install script from the network — that is an
        # arbitrary-code-execution supply-chain surface. The tarball must match
        # its release's checksums.txt, and its build attestation must show that
        # chore's own release pipeline built it, before it is installed.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo antimatter-studios/chore --json tagName --jq .tagName)"
          version="${tag#v}"
          min="$(awk '$1 == "chore_min_version:" { print $2 }' chores.yml)"
          test -n "$min" || { echo "::error::chores.yml has no chore_min_version" >&2; exit 1; }
          if [ "$(printf '%s\n%s\n' "$min" "$version" | sort -V | head -n1)" != "$min" ]; then
            echo "::error::the newest chore is $version; chores.yml needs at least $min" >&2
            exit 1
          fi
          tmp="$(mktemp -d)"
          asset="chore-${version}-linux-x86_64.tar.gz"
          gh release download "$tag" --repo antimatter-studios/chore \
            --pattern "$asset" --pattern checksums.txt --dir "$tmp"
          (cd "$tmp" && awk -v a="$asset" '$2 == a' checksums.txt | sha256sum --check --strict -)
          gh attestation verify "$tmp/$asset" --repo antimatter-studios/chore
          tar -xzf "$tmp/$asset" -C "$tmp" chore
          sudo install -m 0755 "$tmp/chore" /usr/local/bin/chore
          rm -rf "$tmp"
          echo "chores.yml needs chore $min or newer"
          chore --version

      - name: Populate Go module cache
        # For the `go run` steps on the runner itself. The golang containers of
        # `test:e2e` and `instance:mtls:issue` use a volume of their own instead
        # (scripts/source_volume.py).
        run: go mod download

      - name: Route git@github over HTTPS
        # testbed:init / mailserver:init clone via `git@github.com:`. The hosted
        # runner has no SSH key, so rewrite those URLs to anonymous HTTPS — the
        # rest-mail substrate repos are public.
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Clone testbed + reference-mailserver substrate (pinned)
        # The `testbed` include must resolve before `chore e2e:up` is parsed.
        #
        # The same init tasks a person runs (#1751): each checks out the commit
        # pinned in scripts/substrate-pins.yml, so an upstream force-push or a
        # compromised default branch cannot silently change what CI executes,
        # and a missing pin fails loudly. On this native-Linux runner
        # mailserver:init also runs reference-mailserver's dkim:provision chmod
        # in a container. The preflight prints the server and substrate commits
        # and fails when a clone is not at its pin. Bump the pins in that file.
        run: |
          set -euo pipefail
          chore testbed:init
          chore mailserver:init
          python3 -B scripts/substrate_pins.py preflight

      - name: Bring up e2e topology
        env:
          # The gate reports the API code its contract phases ran (#655); see
          # the cover build in tasks/api.yml. Nothing fails on the report.
          API_COVER: ${{ (inputs.contract-phases == 'gate' || inputs.contract-phases == 'reports') && 'true' || 'false' }}
        run: chore e2e:up

      - name: Run e2e stages
        if: inputs.contract-phases != 'live' && inputs.contract-phases != 'pairs'
        run: |
          set -o pipefail
          chore test:e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Assert stages executed (guard against silent skips)
        if: inputs.contract-phases != 'live' && inputs.contract-phases != 'pairs'
        # Belt-and-suspenders on top of E2E_REQUIRE_STACK: a green e2e must mean
        # the stages actually RAN. Fail if any top-level stage skipped, or if
        # fewer than all 14 stages reached PASS.
        run: |
          log="$RUNNER_TEMP/e2e.log"
          skipped=$(grep -cE -- '--- SKIP: TestStages/Stage[0-9]+_[A-Za-z]+ \(' "$log" || true)
          passed=$(grep -cE -- '--- PASS: TestStages/Stage[0-9]+_[A-Za-z]+ \(' "$log" || true)
          echo "stage-level results — PASS: $passed  SKIP: $skipped"
          if [ "$skipped" -ne 0 ]; then
            echo "::error::an e2e stage was SKIPPED — the stack was not fully exercised"
            grep -E -- '--- SKIP: TestStages/Stage' "$log" || true
            exit 1
          fi
          if [ "$passed" -lt 14 ]; then
            echo "::error::expected all 14 e2e stages to PASS, only $passed did"
            exit 1
          fi
          echo "all 14 e2e stages executed and passed"

      - name: Copy a mailbox into REST Mail with imapsync
        # What an operator cutting over from Dovecot reaches for (#734): folders,
        # counts, subjects and flags survive, and a second copy adds nothing. A
        # skip proves nothing, so it fails the step.
        if: inputs.contract-phases == 'gate'
        env:
          RESTMAIL_LIVE_IMAPSYNC: "1"
        run: |
          set -o pipefail
          python3 -m unittest scripts/tests/test_imapsync_live.py -v 2>&1 | tee "$RUNNER_TEMP/imapsync.log"
          if grep -q 'skipped' "$RUNNER_TEMP/imapsync.log"; then
            echo "::error::the imapsync test was skipped"
            exit 1
          fi

      - name: Cache Vertrag's pinned archive
        uses: ./.github/actions/cache-pinned-tool
        with:
          tool: vertrag

      - name: Install vertrag (pinned + checksum-verified)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # The contract tester (#376), as its released binary rather than a Go
        # dependency: vertrag needs Go 1.26 and this module is on 1.25. Verified
        # the same way as chore above, never piped from the network.
        run: |
          set -euo pipefail
          selected="$(python3 -B scripts/vertrag_pin.py ensure .cache/bin)"
          echo "$(dirname "$selected")" >> "$GITHUB_PATH"
          "$selected" version

      - name: Prepare stable contract queue state for fuzz
        if: inputs.contract-phases == 'fuzz'
        run: chore test:contract-fixtures

      - name: Contract example pairs (four shards)
        if: inputs.contract-phases == 'pairs'
        env:
          DB_HOST: 10.99.0.43
        run: chore contract:pairs

      - name: Contract tests (examples, coverage and secret scan)
        # The same command a person runs (#627), against the topology whose
        # stages just passed. The independent example-pair boundary checks run
        # in their own topology beside this job. Every phase uses the generated
        # description; openapi.yaml remains the independent oracle for the
        # contract diff.
        id: contract
        if: inputs.contract-phases == 'gate'
        env:
          CONTRACT_ENDPOINT: http://10.99.0.20:8080
          CONTRACT_LOGS: ${{ runner.temp }}
          CONTRACT_DESCRIPTION_MODE: ${{ inputs.description-mode }}
          CONTRACT_REPORTS: "false"
          # TestDraftLifecycleExamplesWithVertrag makes its scratch databases on
          # this server, the topology's own, and skips without it.
          DB_HOST: 10.99.0.43
        run: chore contract:topology

      - name: Contract authorization and ownership (report only)
        if: inputs.contract-phases == 'reports'
        continue-on-error: true
        env:
          CONTRACT_ENDPOINT: http://10.99.0.20:8080
          CONTRACT_LOGS: ${{ runner.temp }}
          CONTRACT_DESCRIPTION_MODE: ${{ inputs.description-mode }}
        run: chore contract:reports

      - name: API code coverage of the contract run (report)
        if: always() && (inputs.contract-phases == 'gate' || inputs.contract-phases == 'reports')
        continue-on-error: true
        run: |
          if [ -f .cache/contract/api-coverage/summary.md ]; then
            cat .cache/contract/api-coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare independent live-proof principals
        if: inputs.contract-phases == 'live'
        env:
          CONTRACT_ENDPOINT: http://10.99.0.20:8080
        run: |
          chore test:e2e -- -run '^TestContractPrincipals$'
          chore test:contract-fixtures

      - name: Contract live proofs (anonymous, over-cap and real principals; report only)
        # Real exchanges on an independent topology with fresh principals (#1237).
        # Its proofs still join the required union, not its process exit status.
        if: inputs.contract-phases == 'live'
        continue-on-error: true
        timeout-minutes: 25
        env:
          CONTRACT_ENDPOINT: http://10.99.0.20:8080
          CONTRACT_LIVE_PROOFS: ${{ runner.temp }}/live-proofs
        run: chore test:contract-live-proofs

      # The proof union needs this upload, and upload-artifact gives up on a dropped
      # connection at its first ECONNRESET (#1896), so it gets a second try. If that
      # fails too, the job fails. overwrite replaces an artifact that did finalize.
      - name: Upload the live proofs
        id: upload-live-proofs
        if: always() && inputs.contract-phases == 'live'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-example-proofs
          # A runner stopped by the timeout leaves its temporary configuration behind,
          # with the session it was sending.
          path: |
            ${{ runner.temp }}/live-proofs
            !${{ runner.temp }}/live-proofs/**/vertrag.yml
          retention-days: 1
          # The union counts a missing result for nothing, and says so.
          if-no-files-found: warn
          overwrite: true

      - name: Upload the live proofs (second try)
        if: always() && inputs.contract-phases == 'live' && steps.upload-live-proofs.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-example-proofs
          path: |
            ${{ runner.temp }}/live-proofs
            !${{ runner.temp }}/live-proofs/**/vertrag.yml
          retention-days: 1
          if-no-files-found: warn
          overwrite: true

      - name: Limits suite
        # Every limit the API declares, spent on a restarted API so its buckets
        # are the suite's own (#660). A gate.
        if: inputs.contract-phases == 'gate'
        run: |
          set -o pipefail
          chore test:limits 2>&1 | tee "$RUNNER_TEMP/limits.log"

      - name: Contract own-data run (each exchange after a reset and seed)
        # Last: each exchange resets the data, which clears every principal and
        # fixture the steps above use; resetTestData and restoreTestSnapshot
        # are sent here like any other (#1334, #1385). A gate, as the contract
        # step is.
        if: inputs.contract-phases == 'gate'
        env:
          CONTRACT_ENDPOINT: http://10.99.0.20:8080
          CONTRACT_LOGS: ${{ runner.temp }}
          CONTRACT_DESCRIPTION_MODE: ${{ inputs.description-mode }}
        run: chore test:contract-own-data

      - name: Contract tests (fuzz)
        # Values drawn from each schema, with shrinking and a replayable seed
        # (in the log). Exploratory, so it reports and never fails the run:
        # findings exit 2, and its report is uploaded with the logs below.
        if: inputs.contract-phases == 'fuzz'
        env:
          CONTRACT_LOGS: ${{ runner.temp }}
          CONTRACT_DESCRIPTION_MODE: ${{ inputs.description-mode }}
        run: tests/contract/run.sh fuzz

      - name: Contract faults (each fault must turn its phase red)
        # The API rebuilt with each fault in tests/contract/faults.yml, and the
        # phase the fault names run narrowed to its operation, first on the
        # normal API (green) and then on the faulted one (red). Fails if any
        # fault is not caught; faults.md says which (#654).
        if: inputs.contract-phases == 'faults'
        env:
          CONTRACT_LOGS: ${{ runner.temp }}
          CONTRACT_DESCRIPTION_MODE: ${{ inputs.description-mode }}
        run: chore contract:faults

      - name: Collect container logs
        if: always()
        run: |
          out="$RUNNER_TEMP/e2e-logs"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/e2e.log" "$out/e2e-test-output.log" 2>/dev/null || true
          cp "$RUNNER_TEMP/limits.log" "$out/limits-test-output.log" 2>/dev/null || true
          cp "$RUNNER_TEMP"/contract*.log "$out/" 2>/dev/null || true
          cp .cache/contract/openapi.json .cache/contract/examples.json .cache/contract/coverage.json .cache/contract/authorization.json .cache/contract/ownership.json .cache/contract/ownership-domains.json .cache/contract/ownership-mailboxes.json .cache/contract/ownership-messages.json .cache/contract/fuzz.json "$out/" 2>/dev/null || true
          cp .cache/contract/*.xml .cache/contract/*.html .cache/contract/*.md "$out/" 2>/dev/null || true
          cp -R .cache/contract/api-coverage "$out/" 2>/dev/null || true
          docker ps -a > "$out/docker-ps.txt" 2>&1 || true
          docker network inspect testbed_mailnet > "$out/network.txt" 2>&1 || true
          for c in $(docker ps -aq); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "$out/container-$name.log" 2>&1 || true
          done

      - name: Upload container logs
        if: always() && inputs.contract-phases != 'reports' && inputs.contract-phases != 'live' && inputs.contract-phases != 'pairs'
        # People read this, and the contract tiers' issue job reads it if it
        # arrives, so losing it must not fail the job.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-container-logs
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 7
          if-no-files-found: warn

      - name: Upload example-pair logs
        if: always() && inputs.contract-phases == 'pairs'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-contract-pairs-logs
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 7
          if-no-files-found: warn

      - name: Upload authorization and ownership reports
        if: always() && inputs.contract-phases == 'reports'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-logs
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 7
          if-no-files-found: warn

      - name: Upload live runner logs
        if: always() && inputs.contract-phases == 'live'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-live-logs
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 7
          if-no-files-found: warn

      - name: Tear down e2e topology
        if: always()
        run: chore e2e:down

  js-filter-isolation:
    # The sandbox's own security proof, in a job of its own (#1979): it needs the
    # testbed and the two instances it starts, not the topology above, and it
    # shares no runner, container or data with it. It fails the suite as the
    # topology job does, so the required `E2E (full topology)` check waits for it.
    name: JS filter isolation
    if: inputs.contract-phases == 'gate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESTMAIL_SKIP_FRONTENDS: "true"
      RESTMAIL_DEV_GOCACHE_VOLUME: rest-mail-dev-gocache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Retry transient image pull failures
        run: echo "$GITHUB_WORKSPACE/scripts/ci/docker-retry" >> "$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Install chore (the newest release, attested)
        # The repo is driven by chores.yml, whose tasks declare `args:`. go-task
        # parses the file but ignores those declarations, so a task that takes a
        # parameter silently runs with its default — CI has to use the same runner
        # as a developer's machine or it is testing something else.
        #
        # So it installs what a developer would: the newest release. chores.yml
        # names the oldest chore that can read it (chore_min_version), and CI
        # refuses to run below that floor rather than fail on an unknown field.
        #
        # Do NOT pipe-execute an install script from the network — that is an
        # arbitrary-code-execution supply-chain surface. The tarball must match
        # its release's checksums.txt, and its build attestation must show that
        # chore's own release pipeline built it, before it is installed.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo antimatter-studios/chore --json tagName --jq .tagName)"
          version="${tag#v}"
          min="$(awk '$1 == "chore_min_version:" { print $2 }' chores.yml)"
          test -n "$min" || { echo "::error::chores.yml has no chore_min_version" >&2; exit 1; }
          if [ "$(printf '%s\n%s\n' "$min" "$version" | sort -V | head -n1)" != "$min" ]; then
            echo "::error::the newest chore is $version; chores.yml needs at least $min" >&2
            exit 1
          fi
          tmp="$(mktemp -d)"
          asset="chore-${version}-linux-x86_64.tar.gz"
          gh release download "$tag" --repo antimatter-studios/chore \
            --pattern "$asset" --pattern checksums.txt --dir "$tmp"
          (cd "$tmp" && awk -v a="$asset" '$2 == a' checksums.txt | sha256sum --check --strict -)
          gh attestation verify "$tmp/$asset" --repo antimatter-studios/chore
          tar -xzf "$tmp/$asset" -C "$tmp" chore
          sudo install -m 0755 "$tmp/chore" /usr/local/bin/chore
          rm -rf "$tmp"
          echo "chores.yml needs chore $min or newer"
          chore --version

      - name: Populate Go module cache
        # For the `go run` steps on the runner itself. The golang containers of
        # `test:e2e` and `instance:mtls:issue` use a volume of their own instead
        # (scripts/source_volume.py).
        run: go mod download

      - name: Route git@github over HTTPS
        # testbed:init / mailserver:init clone via `git@github.com:`. The hosted
        # runner has no SSH key, so rewrite those URLs to anonymous HTTPS — the
        # rest-mail substrate repos are public.
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Clone testbed + reference-mailserver substrate (pinned)
        run: |
          set -euo pipefail
          chore testbed:init
          chore mailserver:init
          python3 -B scripts/substrate_pins.py preflight

      - name: Bring up the testbed
        run: chore testbed:up

      - name: JavaScript filter isolation, between two real instances
        # The real Go API, started and stopped by the instance commands, beside a
        # second instance on the same testbed: authenticated filter calls, no
        # egress, no reach into mailnet or the other instance, and testbed DNS
        # from the API (#122). A skip here proves nothing, so it fails the step.
        env:
          RESTMAIL_LIVE_JS_FILTER_CONFIGS: isolation-a.test isolation-b.test
        run: |
          set -o pipefail
          for domain in isolation-a.test isolation-b.test; do
            chore config:scaffold DOMAIN="$domain"
            # A scaffolded instance has internal mTLS on, and fails closed without
            # its certificates.
            CONFIG="$domain" chore instance:certs:issue
            CONFIG="$domain" chore instance:mtls:issue
            CONFIG="$domain" chore instance:dns:register
          done
          python3 -m unittest scripts/tests/test_js_filter_isolation_live.py -v 2>&1 | tee "$RUNNER_TEMP/jsfilter-isolation.log"
          if grep -q 'skipped' "$RUNNER_TEMP/jsfilter-isolation.log"; then
            echo "::error::the isolation test was skipped"
            exit 1
          fi

      - name: Collect container logs
        if: always()
        run: |
          out="$RUNNER_TEMP/js-filter-isolation-logs"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/jsfilter-isolation.log" "$out/" 2>/dev/null || true
          docker ps -a > "$out/docker-ps.txt" 2>&1 || true
          for c in $(docker ps -aq); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "$out/container-$name.log" 2>&1 || true
          done

      - name: Upload container logs
        if: always()
        # Only people read this, so losing it must not fail the job.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-filter-isolation-logs
          path: ${{ runner.temp }}/js-filter-isolation-logs
          retention-days: 7
          if-no-files-found: warn
