name: E2E suite

# The full end-to-end topology and everything run against it, as a reusable
# workflow: e2e.yml runs it on every code change (its gate is the required
# check `E2E (full topology)`), and contract-fuzz.yml runs it nightly with the
# contract tests' fuzz phase instead of their gating phases.
on:
  workflow_call:
    inputs:
      contract-phases:
        description: >-
          "gate" runs the examples and coverage gates, then the authorization
          matrix report-only; "fuzz" runs the fuzz phase, reports what it
          finds as an artifact, and fails nothing.
        type: string
        default: gate

permissions:
  contents: read
  packages: read

jobs:
  suite:
    name: topology
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Flip "stack not reachable" preconditions (no admin token, gateway not
      # dialable, …) from t.Skip into t.Fatal inside the suite — see
      # tests/e2e/suite_test.go. A half-up topology must go RED, never green by
      # skipping every stage. Forwarded into the test container by `test:e2e`.
      E2E_REQUIRE_STACK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.10"
          cache: true

      - name: Install chore (the newest release, attested)
        # The repo is driven by chores.yml, whose tasks declare `args:`. go-task
        # parses the file but ignores those declarations, so a task that takes a
        # parameter silently runs with its default — CI has to use the same runner
        # as a developer's machine or it is testing something else.
        #
        # So it installs what a developer would: the newest release. chores.yml
        # names the oldest chore that can read it (chore_min_version), and CI
        # refuses to run below that floor rather than fail on an unknown field.
        #
        # Do NOT pipe-execute an install script from the network — that is an
        # arbitrary-code-execution supply-chain surface. The tarball must match
        # its release's checksums.txt, and its build attestation must show that
        # chore's own release pipeline built it, before it is installed.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo antimatter-studios/chore --json tagName --jq .tagName)"
          version="${tag#v}"
          min="$(awk '$1 == "chore_min_version:" { print $2 }' chores.yml)"
          test -n "$min" || { echo "::error::chores.yml has no chore_min_version" >&2; exit 1; }
          if [ "$(printf '%s\n%s\n' "$min" "$version" | sort -V | head -n1)" != "$min" ]; then
            echo "::error::the newest chore is $version; chores.yml needs at least $min" >&2
            exit 1
          fi
          tmp="$(mktemp -d)"
          asset="chore-${version}-linux-x86_64.tar.gz"
          gh release download "$tag" --repo antimatter-studios/chore \
            --pattern "$asset" --pattern checksums.txt --dir "$tmp"
          (cd "$tmp" && awk -v a="$asset" '$2 == a' checksums.txt | sha256sum --check --strict -)
          gh attestation verify "$tmp/$asset" --repo antimatter-studios/chore
          tar -xzf "$tmp/$asset" -C "$tmp" chore
          sudo install -m 0755 "$tmp/chore" /usr/local/bin/chore
          rm -rf "$tmp"
          echo "chores.yml needs chore $min or newer"
          chore --version

      - name: Populate Go module cache
        # `test:e2e` and `instance:mtls:issue` mount the host GOMODCACHE
        # read-only into a golang container; it must be complete up front or
        # those `go` invocations fail trying to write to a read-only cache.
        run: go mod download

      - name: Route git@github over HTTPS
        # testbed:init / mailserver:init clone via `git@github.com:`. The hosted
        # runner has no SSH key, so rewrite those URLs to anonymous HTTPS — the
        # rest-mail substrate repos are public.
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Clone testbed + reference-mailserver substrate (pinned)
        # The `testbed` include must resolve before `chore e2e:up` is parsed;
        # reference-mailserver is also cloned by e2e:up, pre-cloning is harmless.
        #
        # The init tasks clone each repo's DEFAULT BRANCH (no ref). Pin the
        # checkout to a known-good commit so an e2e run is reproducible and
        # tamper-evident: an upstream force-push or a compromised default branch
        # cannot silently change what CI executes — a missing/rewritten pin fails
        # the step loudly instead. Bump these SHAs deliberately when adopting
        # upstream substrate changes.
        env:
          TESTBED_REF: 398d29cd40eb1a8553d710dc25491c2a4b727a37              # rest-mail/testbed @ master
          REFERENCE_MAILSERVER_REF: 4f6f8e0fb61d6aac9a3adffa38f05c55be27e25d  # rest-mail/reference-mailserver @ master
        run: |
          set -euo pipefail
          chore testbed:init
          chore mailserver:init
          git -C .workspace/testbed fetch --quiet origin "$TESTBED_REF" || true
          git -C .workspace/testbed checkout --quiet "$TESTBED_REF"
          git -C .workspace/reference-mailserver fetch --quiet origin "$REFERENCE_MAILSERVER_REF" || true
          git -C .workspace/reference-mailserver checkout --quiet "$REFERENCE_MAILSERVER_REF"
          echo "testbed pinned @ $(git -C .workspace/testbed rev-parse --short HEAD)"
          echo "reference-mailserver pinned @ $(git -C .workspace/reference-mailserver rev-parse --short HEAD)"

      - name: Patch reference dkim:provision for native-Linux Docker
        # reference-mailserver's dkim:provision generates the DKIM key as
        # container-root, then runs `chmod 644` on it FROM THE HOST. On Docker
        # Desktop bind-mount files are host-user-owned so that works; on native
        # Linux (this runner) the file is root-owned and the non-root runner
        # can't chmod it ("Operation not permitted"). Run that chmod inside a
        # container instead — the same idiom the task already uses two lines
        # below for the fragment copy. (Follow-up: fix this upstream in
        # rest-mail/reference-mailserver so it's portable off Docker Desktop.)
        run: |
          # Whichever name that project ships: it is migrating from Taskfile.yml to
          # chores.yml, and this must not break on either side of that.
          f=""
          for c in chores.yml Taskfile.yml; do
            [ -f ".workspace/reference-mailserver/$c" ] && f=".workspace/reference-mailserver/$c" && break
          done
          if [ -z "$f" ]; then
            echo "::error::no chores.yml or Taskfile.yml in reference-mailserver" >&2
            exit 1
          fi
          perl -pi -e 's{chmod 644 "\$KEYDIR/\$DOMAIN\.\$SEL\.key"}{docker run --rm -v "\$(pwd)/\$KEYDIR:/keys" alpine:3.20 chmod 644 "/keys/\$DOMAIN.\$SEL.key"}g' "$f"
          if grep -qF 'chmod 644 "$KEYDIR/$DOMAIN.$SEL.key"' "$f"; then
            echo "::error::dkim:provision chmod patch did not apply — upstream reference-mailserver task file changed"
            exit 1
          fi
          echo "patched host chmod -> containerized chmod:"
          grep -nF 'alpine:3.20 chmod 644' "$f"

      - name: Bring up e2e topology
        run: chore e2e:up

      - name: Run e2e stages
        run: |
          set -o pipefail
          chore test:e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Assert stages executed (guard against silent skips)
        # Belt-and-suspenders on top of E2E_REQUIRE_STACK: a green e2e must mean
        # the stages actually RAN. Fail if any top-level stage skipped, or if
        # fewer than all 14 stages reached PASS.
        run: |
          log="$RUNNER_TEMP/e2e.log"
          skipped=$(grep -cE -- '--- SKIP: TestStages/Stage[0-9]+_[A-Za-z]+ \(' "$log" || true)
          passed=$(grep -cE -- '--- PASS: TestStages/Stage[0-9]+_[A-Za-z]+ \(' "$log" || true)
          echo "stage-level results — PASS: $passed  SKIP: $skipped"
          if [ "$skipped" -ne 0 ]; then
            echo "::error::an e2e stage was SKIPPED — the stack was not fully exercised"
            grep -E -- '--- SKIP: TestStages/Stage' "$log" || true
            exit 1
          fi
          if [ "$passed" -lt 14 ]; then
            echo "::error::expected all 14 e2e stages to PASS, only $passed did"
            exit 1
          fi
          echo "all 14 e2e stages executed and passed"

      - name: Install vertrag (pinned + checksum-verified)
        # The contract tester (#376), as its released binary rather than a Go
        # dependency: vertrag needs Go 1.26 and this module is on 1.25. Verified
        # the same way as chore above, never piped from the network.
        env:
          VERTRAG_VERSION: 0.31.3
          # sha256 of vertrag-${VERTRAG_VERSION}-linux-x86_64.tar.gz, from that
          # release's checksums.txt. Bump both together when upgrading.
          VERTRAG_SHA256: 96740dd3c07cd21860d6ee4085b536f47666ba2aee652cdf415132a3bad5ca01
        run: |
          set -euo pipefail
          selected="$(python3 -B scripts/vertrag_pin.py ensure .cache/bin)"
          echo "$(dirname "$selected")" >> "$GITHUB_PATH"
          "$selected" version

      - name: Registered example-pair boundary checks
        if: inputs.contract-phases == 'gate'
        # About 25 minutes of Vertrag exchanges in one process: the script builds
        # the test binary once and runs the registered tests in parallel shards.
        env:
          RESTMAIL_VERTRAG_BINARY: ${{ github.workspace }}/.cache/bin/vertrag
        run: tests/contract/example_pairs.sh -run '^(TestPublicJSONExamplesWithVertrag|TestAuthenticatedReadExamplesWithVertrag|TestAuthenticatedReadBatchWithVertrag|TestPaginatedReadExamplesWithVertrag|TestAnalyticsExamplesWithVertrag|TestMozillaExamplesWithVertrag|TestAutodiscoverExamplesWithVertrag|TestDomainPolicyReadExamplesWithVertrag|TestDomainPolicyGetExamplesWithVertrag|TestDomainPolicyWriteExamplesWithVertrag|TestDomainPolicyDeleteExamplesWithVertrag|TestSenderRuleCreateExamplesWithVertrag|TestMtaStsPolicyFileExamplesWithVertrag|TestMailboxLookupExamplesWithVertrag|TestDomainAliasReadExamplesWithVertrag|TestAdminResourceReadExamplesWithVertrag|TestPublicDiscoveryExamplesWithVertrag|TestQueueTraceReadExamplesWithVertrag|TestAccountReadExamplesWithVertrag|TestAccountCredentialListExamplesWithVertrag|TestPersonalDataReadExamplesWithVertrag|TestFolderQuarantineReadExamplesWithVertrag|TestMailResourceReadExamplesWithVertrag|TestMessageCollectionReadExamplesWithVertrag|TestMessageSourceReadExamplesWithVertrag|TestAttachmentDownloadExamplesWithVertrag|TestAdminVerificationExamplesWithVertrag|TestBulkQueueCompleteExamplesWithVertrag|TestQueueEntryActionExamplesWithVertrag|TestAdminResourceDeleteExamplesWithVertrag|TestBanRemovalExamplesWithVertrag|TestScopedAdminRemovalExamplesWithVertrag|TestMailRemovalExamplesWithVertrag|TestPersonalRemovalExamplesWithVertrag|TestDeviceRemovalExamplesWithVertrag|TestCredentialRevocationExamplesWithVertrag|TestSieveMutationExamplesWithVertrag|TestSieveInstallationExamplesWithVertrag|TestVacationMutationExamplesWithVertrag|TestFolderMutationExamplesWithVertrag|TestContactMutationExamplesWithVertrag|TestContactImportSuggestExamplesWithVertrag|TestAliasMutationExamplesWithVertrag|TestCustomFilterMutationExamplesWithVertrag|TestCustomFilterValidationExamplesWithVertrag|TestBanCreationExamplesWithVertrag|TestDomainMutationExamplesWithVertrag|TestMailboxSessionEndingExamplesWithVertrag|TestInvitationExamplesWithVertrag|TestMessageImportExamplesWithVertrag|TestForwardAttachmentsExamplesWithVertrag|TestDomainCleanupExamplesWithVertrag)$' -count=1 -v

      - name: Prepare stable contract queue state for fuzz
        if: inputs.contract-phases == 'fuzz'
        run: chore test:contract-fixtures

      - name: Contract tests (examples, coverage, secret scan and authorization report)
        # The same command a person runs (#627), against the topology whose
        # stages just passed. Fetch the generated description; openapi.yaml
        # remains the independent oracle used by the fast contract diff.
        id: contract
        if: inputs.contract-phases == 'gate'
        env:
          CONTRACT_ENDPOINT: http://10.99.0.20:8080
          CONTRACT_LOGS: ${{ runner.temp }}
        run: chore contract

      - name: Contract tests (fuzz)
        # Values drawn from each schema, with shrinking and a replayable seed
        # (in the log). Exploratory, so it reports and never fails the run:
        # findings exit 2, and its report is uploaded with the logs below.
        if: inputs.contract-phases == 'fuzz'
        env:
          CONTRACT_LOGS: ${{ runner.temp }}
        run: tests/contract/run.sh fuzz

      - name: Collect container logs
        if: always()
        run: |
          out="$RUNNER_TEMP/e2e-logs"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/e2e.log" "$out/e2e-test-output.log" 2>/dev/null || true
          cp "$RUNNER_TEMP"/contract*.log "$out/" 2>/dev/null || true
          cp .cache/contract/openapi.json .cache/contract/examples.json .cache/contract/coverage.json .cache/contract/authorization.json .cache/contract/fuzz.json "$out/" 2>/dev/null || true
          cp .cache/contract/*.xml .cache/contract/*.html .cache/contract/*.md "$out/" 2>/dev/null || true
          docker ps -a > "$out/docker-ps.txt" 2>&1 || true
          docker network inspect testbed_mailnet > "$out/network.txt" 2>&1 || true
          for c in $(docker ps -aq); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" > "$out/container-$name.log" 2>&1 || true
          done

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-container-logs
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 7
          if-no-files-found: warn

      - name: Tear down e2e topology
        if: always()
        run: chore e2e:down
