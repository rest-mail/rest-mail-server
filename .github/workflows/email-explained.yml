name: Email, explained

# Publishes the guide (docs/email-explained) for rest-mail.com whenever main
# changes it: bundle.mjs builds it into the content bundle the website renders,
# and it is pushed as ghcr.io/rest-mail/email-explained:<version>. The website
# checks for a newer version on its own schedule, takes it, tests it and
# releases itself, so a merged chapter goes live with nobody copying it across
# (docs/design/email-explained-website.md). CI has already checked the guide
# before it could merge (ci.yml, "Email, explained").
#
# The version is <format>.0.<commits on main>: SemVer, rising with every
# publish, and its major is the bundle's format, which the website checks.
#
# A pull request that touches the same files builds the image without pushing
# it, so a broken build is found before it merges, not after.

on:
  push:
    branches: [main]
    paths:
      - "docs/email-explained/**"
      - "scripts/email-explained/bundle.mjs"
      - "scripts/email-explained/Dockerfile"
      - "scripts/email-explained/package.json"
      - "scripts/email-explained/package-lock.json"
      - ".github/workflows/email-explained.yml"
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "docs/email-explained/**"
      - "scripts/email-explained/bundle.mjs"
      - "scripts/email-explained/Dockerfile"
      - "scripts/email-explained/package.json"
      - "scripts/email-explained/package-lock.json"
      - ".github/workflows/email-explained.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One publish at a time, the newest last.
concurrency:
  group: ${{ github.event_name == 'pull_request' && (github.base_ref != 'main' || (github.event.action == 'edited' && github.event.changes.base.ref.from == '')) && format('email-explained-ignored-{0}', github.run_id) || 'email-explained-publish' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rest-mail/email-explained

jobs:
  preflight:
    name: 'Preflight: branch is up to date'
    if: github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    runs-on: antimatter-vps-linux-x64
    timeout-minutes: 5
    steps:
      - name: Checkout the pull request head, not GitHub's merge commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Require the current base tip in the pull request head
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Preflight: $EVENT_NAME needs no pull request ancestry check."
            exit 0
          fi
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          base_sha=$(git rev-parse "refs/remotes/origin/${BASE_REF}")
          if git merge-base --is-ancestor "$base_sha" "$HEAD_SHA"; then
            echo "Preflight: head $HEAD_SHA contains $BASE_REF ($base_sha)."
            exit 0
          fi
          message="Preflight: this branch (head $HEAD_SHA) is not up to date with $BASE_REF ($base_sha). You cannot push a branch that is not up to date with origin/$BASE_REF ($base_sha). Rebase it onto origin/$BASE_REF first, then push again. Nothing else in this pipeline runs until you do. Run: git fetch origin $BASE_REF && git rebase origin/$BASE_REF"
          echo "::error::$message" >&2
          echo "$message" >&2
          exit 1

  publish:
    needs: preflight
    name: Publish the guide's bundle
    if: github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    # This job needs Docker; the rootless private runner has no daemon.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/email-explained
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version counts the commits on main.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: scripts/email-explained/package.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch Archify, at the commit package.json pins
        run: echo "ARCHIFY=$(node fetch-archify.mjs "$RUNNER_TEMP/archify")" >> "$GITHUB_ENV"

      - name: Work out the version
        run: |
          set -euo pipefail
          format=$(node --input-type=module -e 'import { FORMAT } from "./bundle.mjs"; console.log(FORMAT)')
          echo "VERSION=$format.0.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Build the bundle
        run: node bundle.mjs --archify "$ARCHIFY" --out "$RUNNER_TEMP/bundle" --version "$VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the bundle
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/bundle
          file: scripts/email-explained/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.title=Email, explained
            org.opencontainers.image.description=The content bundle rest-mail.com renders the guide from
            org.opencontainers.image.licenses=MIT
          # One plain manifest with one layer, so a reader needs only the
          # registry's HTTP API: no attestations, no platforms to choose.
          provenance: false
          sbom: false

      - name: Check anyone can fetch it
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:rest-mail/email-explained:pull" | jq -r .token)
          if ! curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/rest-mail/email-explained/manifests/$VERSION"; then
            echo "::error::$IMAGE:$VERSION was pushed but cannot be fetched without credentials. Make the email-explained package public (organisation packages, Package settings), as the other rest-mail packages are." >&2
            exit 1
          fi
          echo "$IMAGE:$VERSION is published and public"
