name: Load

# One load run against the e2e topology (#1583), started by hand: SMTP in
# (past the greylist, with what the greylist costs as its own figure),
# SMTP out (submissions accepted, and what the queue then delivered to a sink set
# up as the recipient domain's MX), held IMAP connections and API requests, at the
# targets given, for the duration given. The results
# (results.json, results.txt, the raw generator output, the gateway's and API's
# logs and a count of the mail from the database) are uploaded as an
# artifact; compare two with `chore load:compare -- a/results.json b/results.json`.
#
# A hosted runner carries the topology AND the generators on 4 vCPUs, so what it
# measures is that runner. It shows a regression between two commits; the
# capacity of one install needs a run on real hardware (tests/load/README.md).
#
# The set-up steps are e2e-suite.yml's, pins included: bump them together.
on:
  workflow_dispatch:
    inputs:
      smtp_in_rate:
        description: Inbound messages per second (0 leaves it out)
        default: "100"
      smtp_in_greylist_rate:
        description: Inbound messages per second the greylist defers (0 leaves it out)
        default: "10"
      smtp_out_rate:
        description: Outbound submissions per second (0 leaves it out)
        default: "50"
      imap_conns:
        description: Concurrent IMAP connections held (0 leaves it out)
        default: "1000"
      api_rate:
        description: API requests per second (0 leaves it out)
        default: "100"
      duration:
        description: Seconds each load runs
        default: "60"
      delivery_drain:
        description: Seconds after the last submission to wait for delivery
        default: "300"

concurrency:
  group: load
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  load:
    name: Load run
    # This job needs Docker; the rootless private runner has no daemon.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git describe in the results names the version tested.
          fetch-depth: 0

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Retry transient image pull failures
        run: echo "$GITHUB_WORKSPACE/scripts/ci/docker-retry" >> "$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: true

      - name: Install chore (the newest release, attested)
        # The repo is driven by chores.yml, whose tasks declare `args:`. go-task
        # parses the file but ignores those declarations, so a task that takes a
        # parameter silently runs with its default — CI has to use the same runner
        # as a developer's machine or it is testing something else.
        #
        # So it installs what a developer would: the newest release. chores.yml
        # names the oldest chore that can read it (chore_min_version), and CI
        # refuses to run below that floor rather than fail on an unknown field.
        #
        # Do NOT pipe-execute an install script from the network — that is an
        # arbitrary-code-execution supply-chain surface. The tarball must match
        # its release's checksums.txt, and its build attestation must show that
        # chore's own release pipeline built it, before it is installed.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo antimatter-studios/chore --json tagName --jq .tagName)"
          version="${tag#v}"
          min="$(awk '$1 == "chore_min_version:" { print $2 }' chores.yml)"
          test -n "$min" || { echo "::error::chores.yml has no chore_min_version" >&2; exit 1; }
          if [ "$(printf '%s\n%s\n' "$min" "$version" | sort -V | head -n1)" != "$min" ]; then
            echo "::error::the newest chore is $version; chores.yml needs at least $min" >&2
            exit 1
          fi
          tmp="$(mktemp -d)"
          asset="chore-${version}-linux-x86_64.tar.gz"
          gh release download "$tag" --repo antimatter-studios/chore \
            --pattern "$asset" --pattern checksums.txt --dir "$tmp"
          (cd "$tmp" && awk -v a="$asset" '$2 == a' checksums.txt | sha256sum --check --strict -)
          gh attestation verify "$tmp/$asset" --repo antimatter-studios/chore
          tar -xzf "$tmp/$asset" -C "$tmp" chore
          sudo install -m 0755 "$tmp/chore" /usr/local/bin/chore
          rm -rf "$tmp"
          echo "chores.yml needs chore $min or newer"
          chore --version

      - name: Populate Go module cache
        run: go mod download

      - name: Route git@github over HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Clone testbed + reference-mailserver substrate (pinned)
        # The `testbed` include must resolve before `chore e2e:up` is parsed.
        #
        # The same init tasks a person runs (#1751): each checks out the commit
        # pinned in scripts/substrate-pins.yml, and on this native-Linux runner
        # mailserver:init also runs reference-mailserver's dkim:provision chmod in
        # a container. The preflight fails when a clone is not at its pin.
        run: |
          set -euo pipefail
          chore testbed:init
          chore mailserver:init
          python3 -B scripts/substrate_pins.py preflight

      - name: Bring up e2e topology
        # The limits one load generator cannot pass, off on this testbed only:
        # tests/load/README.md says which and why.
        env:
          RESTMAIL_LOAD_LIMITS_OFF: "true"
        run: chore e2e:up

      - name: Load run
        # Inputs reach the runner through the environment, never the script text.
        env:
          LOAD_SMTP_IN_RATE: ${{ inputs.smtp_in_rate }}
          LOAD_SMTP_IN_GREYLIST_RATE: ${{ inputs.smtp_in_greylist_rate }}
          LOAD_SMTP_OUT_RATE: ${{ inputs.smtp_out_rate }}
          LOAD_IMAP_CONNS: ${{ inputs.imap_conns }}
          LOAD_API_RATE: ${{ inputs.api_rate }}
          LOAD_DURATION: ${{ inputs.duration }}
          LOAD_DELIVERY_DRAIN: ${{ inputs.delivery_drain }}
          LOAD_OUT: ${{ runner.temp }}/load
        run: chore test:load

      - name: Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/load/results.txt" ]; then
            { echo '```'; cat "$RUNNER_TEMP/load/results.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        # Only people read this, so losing it must not fail the job.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-results
          path: |
            ${{ runner.temp }}/load/results.json
            ${{ runner.temp }}/load/results.txt
            ${{ runner.temp }}/load/raw/*.json
            ${{ runner.temp }}/load/raw/*.log
          retention-days: 90
          if-no-files-found: warn

      - name: Tear down e2e topology
        if: always()
        run: chore e2e:down
