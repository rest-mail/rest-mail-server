name: Contract fuzz

# Nightly and on every v* tag, the contract tests' fuzz phase (#376, #626):
# vertrag draws values from every schema in the description the API generates,
# shrinks what fails to its smallest input, and prints the seed that replays it.
# Exploratory rather than deterministic, so it blocks nothing: it runs the E2E
# topology on its own schedule, and its report (fuzz.xml, with the log) is the
# run's e2e-container-logs artifact.
#
# One rolling issue (label contract-fuzz) holds a row and replay seed per finding.
# A failure adds or refreshes its row; a finished run that passes that transaction
# removes it. An empty tier closes (scripts/contract_tier_issues.py).
on:
  schedule:
    - cron: "30 3 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

# By ref, so a nightly run cannot cancel a release tag's.
concurrency:
  group: contract-fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  fuzz:
    name: Contract tests (fuzz)
    uses: ./.github/workflows/e2e-suite.yml
    with:
      contract-phases: fuzz

  # Its own job, so only this one can write issues: the suite builds and runs the
  # images with a read-only token.
  finding-issues:
    name: Finding issues
    needs: fuzz
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One at a time across refs, so two runs cannot both open the same finding.
    concurrency:
      group: contract-fuzz-issues
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Missing when the suite failed before it collected anything; the script
      # then files the run itself as not finished.
      - name: Download the suite's reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-container-logs
          path: e2e-container-logs

      - name: Open, update or close the finding issues
        env:
          SUITE_RESULT: ${{ needs.fuzz.result }}
        run: python3 -B scripts/contract_tier_issues.py --tier fuzz --result "$SUITE_RESULT" --reports e2e-container-logs
