name: Pulumi component

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - packages/pulumi/**
      - tasks/install.yml
      - tasks/lifecycle/pulumi*
      - scripts/tests/test_pulumi_install.py
      - .github/workflows/pulumi.yml
  push:
    branches: [main]
    paths:
      - packages/pulumi/**
      - tasks/install.yml
      - tasks/lifecycle/pulumi*
      - scripts/tests/test_pulumi_install.py
      - .github/workflows/pulumi.yml
  merge_group:

permissions:
  contents: read

jobs:
  preflight:
    name: 'Preflight: branch is up to date'
    if: github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runners: ${{ steps.runners.outputs.runners || '{}' }}
    steps:
      - name: Checkout the pull request head, not GitHub's merge commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Require the current base tip in the pull request head
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Preflight: $EVENT_NAME needs no pull request ancestry check."
            exit 0
          fi
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          base_sha=$(git rev-parse "refs/remotes/origin/${BASE_REF}")
          if git merge-base --is-ancestor "$base_sha" "$HEAD_SHA"; then
            echo "Preflight: head $HEAD_SHA contains $BASE_REF ($base_sha)."
            exit 0
          fi
          message="Preflight: this branch (head $HEAD_SHA) is not up to date with $BASE_REF ($base_sha). You cannot push a branch that is not up to date with origin/$BASE_REF ($base_sha). Rebase it onto origin/$BASE_REF first, then push again. Nothing else in this pipeline runs until you do. Run: git fetch origin $BASE_REF && git rebase origin/$BASE_REF"
          echo "::error::$message" >&2
          echo "$message" >&2
          exit 1

      - name: Pick runners (antimatter-vps runners while free, else GitHub's)
        id: runners
        # runner-gate.antimatter-studios.com answers once per job: an antimatter-vps runner
        # while one is free and every identity on this run is christhomas, otherwise
        # ubuntu-latest; any error is ubuntu-latest too. Its /status page shows the pool.
        # JOBS has one entry per gated job, and one per matrix leg or reusable-workflow call:
        # the gate is asked for the job id before any ".", and the whole entry keys the answer.
        # It is the last step of its job, so it asks only once the run is known to go on.
        env:
          ORG: ${{ github.repository_owner }}
          ACTOR: ${{ github.triggering_actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SENDER: ${{ github.event.sender.login }}
          GH_ACTOR: ${{ github.actor }}
          JOBS: component
        run: |
          set -euo pipefail
          ours=true
          for who in "$ACTOR" "$GH_ACTOR" "$SENDER" "$AUTHOR"; do
            [ -z "$who" ] || [ "$who" = christhomas ] || ours=false
          done
          pick() {
            $ours || { echo ubuntu-latest; return; }
            r=$(curl -fsS --max-time 10 --get https://runner-gate.antimatter-studios.com/pick \
                  --data-urlencode "org=$ORG" --data-urlencode prefer=antimatter-vps-linux-x64 \
                  --data-urlencode fallback=ubuntu-latest --data-urlencode "actor=$ACTOR" --data-urlencode "author=$AUTHOR" \
                  --data-urlencode "run=${{ github.run_id }}" --data-urlencode "attempt=${{ github.run_attempt }}" \
                  --data-urlencode "job=$1") || r=ubuntu-latest
            case "$r" in antimatter-vps-linux-x64|ubuntu-latest) echo "$r" ;; *) echo ubuntu-latest ;; esac
          }
          runners='{}'
          for entry in $JOBS; do
            runners=$(jq -c --arg j "$entry" --arg r "$(pick "${entry%%.*}")" '. + {($j): $r}' <<<"$runners")
          done
          echo "$runners" | jq . | tee -a "$GITHUB_STEP_SUMMARY"
          echo "runners=$runners" >> "$GITHUB_OUTPUT"

  component:
    needs: preflight
    name: Pulumi package and secret boundaries
    if: github.event_name != 'pull_request' || (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    runs-on: ${{ fromJSON(needs.preflight.outputs.runners)['component'] || 'ubuntu-latest' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/pulumi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: ./.github/actions/setup-python
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/pulumi/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Check local installer and secret handling without deploying
        working-directory: .
        run: python3 -B -m unittest discover -s scripts/tests -p test_pulumi_install.py -v
      - run: npm pack --dry-run
