name: Pulumi component

on:
  pull_request:
    paths:
      - packages/pulumi/**
      - tasks/install.yml
      - tasks/lifecycle/pulumi*
      - scripts/tests/test_pulumi_install.py
      - .github/workflows/pulumi.yml
  push:
    branches: [main]
    paths:
      - packages/pulumi/**
      - tasks/install.yml
      - tasks/lifecycle/pulumi*
      - scripts/tests/test_pulumi_install.py
      - .github/workflows/pulumi.yml
  merge_group:

permissions:
  contents: read

jobs:
  component:
    name: Pulumi package and secret boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/pulumi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/pulumi/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Check local installer and secret handling without deploying
        working-directory: .
        run: python3 -B -m unittest discover -s scripts/tests -p test_pulumi_install.py -v
      - run: npm pack --dry-run
