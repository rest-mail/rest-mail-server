name: API gap issues

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/api-gaps.yml
      - internal/api/**
      - scripts/api_gaps.py
      - scripts/tests/test_api_gaps.py
      - tests/contract/api-areas.json

# Reconciliation must finish, including close/reopen and parent linking. A newer
# push queues behind it and checks out current main, rather than cancelling it.
concurrency:
  group: api-gap-issues-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.10"
          cache: true

      - name: Verify the issue synchronization without forge writes
        run: python3 -B -m unittest discover -s scripts/tests -p test_api_gaps.py -v

      - name: Report all registered operations, including push and test routes
        env:
          RESTMAIL_API_GAP_REPORT: ${{ runner.temp }}/api-gap-report.json
        run: go test -mod=readonly ./internal/api/ -run '^TestAPIGapReport$' -count=1

      - name: Keep operation issues and clean-area proposals in step
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_RESTMAIL_TOKEN || github.token }}
        run: python3 -B scripts/api_gaps.py "$RUNNER_TEMP/api-gap-report.json" --repo "$GITHUB_REPOSITORY" --apply

      - name: Validate operation ownership without forge writes
        if: github.event_name == 'pull_request'
        run: python3 -B scripts/api_gaps.py "$RUNNER_TEMP/api-gap-report.json"

      - name: Publish the complete generator report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-gap-report
          path: ${{ runner.temp }}/api-gap-report.json
          retention-days: 14
          if-no-files-found: warn
