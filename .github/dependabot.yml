# Actions are pinned to commit SHAs. Dependabot proposes SHA updates as pull
# requests so new releases can be reviewed and checked by CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The contract's generator (#628): each go-oapifly release is a bump PR the same day.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: "github.com/antimatter-studios/*"
