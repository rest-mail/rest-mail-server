# The contract tests (#376): vertrag (github.com/antimatter-studios/vertrag)
# sends every request the generated description documents to a running API and checks each
# answer against what the spec promises: status, headers and body schema.
#
# CI runs it in the E2E (full topology) job, against the topology that job has
# already brought up, signed in as the fixture admin (cmd/seed). See
# tests/contract/README.md for how to run it, what is excluded and why, and how
# the "operations exercised" gate is computed.

spec: ./.cache/contract/openapi.json
endpoint: http://10.99.0.20:8080

# Hooks supply fixture credentials and generated keys, and select documented
# examples where vertrag cannot pair parameters. Resource links come from the spec.
hookfiles: ./tests/contract/entrypoint.py
language: python
# Fixture setup can invoke the cached Go helper (bounded to 20 seconds), or
# wait up to 60 seconds for the send budget before retrying. Include time for
# admin login and both API requests in the hook deadline (ms).
hooks-worker-timeout: 120000

auth:
  login:
    path: /api/v1/auth/login
    # The fixture admin, a test fixture like every password in cmd/seed.
    body: {email: admin@restmail.test, password: "admin123!@", client: native}
    # Every body field is classified once: the password is redacted in every
    # report; the address and client are shown, so a report says who signed in.
    secrets: [password]
    public: [email, client]
  header: 'Authorization: Bearer {$response.body#/data/access_token}'
  # Sent with no credential: each authenticated operation's documented 401, and
  # the two operations that take a credential other than the session's (the
  # hooks give them theirs).
  except:
    - '/api/v1/auth/logout > Log out — revoke the session and clear the auth cookies > 204'
    - '/api/v1/auth/2fa > Read your authenticator status > 401 > application/json'
    - '/api/v1/auth/2fa/enroll > Start an authenticator enrollment > 401 > application/json'
    - '/api/v1/auth/recovery-email > Read your registered recovery email > 401 > application/json'
    - '/api/v1/auth/protocol-sign-in > Sign a mail client in (protocol gateways) > 200 > application/json'
    - '/api/v1/auth/protocol-sign-in > Sign a mail client in (protocol gateways) > 400 > application/json'
    - '/api/v1/auth/protocol-sign-in > Sign a mail client in (protocol gateways) > 401 > application/json'
    - '/api/v1/auth/protocol-sign-in > Sign a mail client in (protocol gateways) > 422 > application/json'
    - '/api/v1/accounts > List the accounts this one reaches > 401 > application/json'
    - '/api/v1/accounts/{id}/events > Server-Sent Events stream for real-time updates > 401 > application/json'
    - '/api/v1/accounts > Create an account > 401 > application/json'
    - '/api/v1/accounts/link > Link an existing account by proving its password > 401 > application/json'
    - '/api/v1/accounts/{id}/credentials > List an account''s app passwords > 401 > application/json'
    - '/api/v1/accounts/{id}/credentials > Make an app password > 401 > application/json'
    - '/api/v1/accounts/{id}/credentials/{credential_id} > Revoke an app password > 401 > application/json'
    - '/api/v1/admin/audit > Read the audit log, newest first > 401 > application/json'
    - '/api/v1/admin/audit/verify > Check the audit log''s hash chain > 401 > application/json'
    - '/api/v1/admin/test/snapshot > Capture the current database state as JSON > 401 > application/json'
    - '/api/v1/admin/grants > List grants, oldest first > 401 > application/json'
    - '/api/v1/admin/grants/mine > The caller''s own grants > 401 > application/json'
    - '/api/v1/admin/server-capabilities > The server capability ceiling > 401 > application/json'
    - '/api/v1/admin/domains/{id}/dns > Live DNS record check (MX, SPF, DMARC, DKIM, MTA-STS, TLS-RPT) for a domain > 401 > application/json'
    - '/api/v1/admin/mailboxes/{id}/invitation > Invite an account to choose its first password > 401 > application/json'
    - '/api/v1/accounts/{id}/messages/import > Import one historical message > 401 > application/json'

checks:
  # Validate every declared response header value against its schema (#674).
  header-schema: true
  # The "no credentials" principal, for every operation: each authenticated
  # request is sent again without its credential, and one that is answered
  # anyway is a failure.
  ignored-auth: true

# Operations never sent, in any phase. Each one's reason is beside it under
# surface.exclude below, which takes the same operations out of the surface
# the run is held to; tests/contract/gate.py checks the two lists agree.
# Push and ACME are off in this topology, so their routes are absent from the
# generated description and must not be named as exclusions. Internal mTLS is
# off too, so the gateways' machine routes (checkMailboxAddress,
# deliverMessage) are served on the public listener and sent like any other.
exclude-operation-id:
  - resetTestData
  - restoreTestSnapshot

# Documented responses the examples phase cannot provoke yet, by pattern. A
# transaction is named "<path> > <summary> > <status>[ > <type>]". Each pattern
# names one operation's documented statuses that no example proves (#1334):
# give a status an example, with x-requires and an in-process proof if it needs
# setup, and take it off here and out of tests/contract/status-baseline.txt.
exclude-matching:
  # getAttachment: bodyless 304/412 cannot carry a named media-type example,
  # and its 500's media-type transactions are built from the conditional
  # headers' examples, which a healthy server answers 304 or 412. Its
  # surface.exclude entries give the reasons; #1166 tracks the rest.
  # getAttachment
  - '^/api/v1/attachments/\{id\} > .* > (304|412|500)( >|$)'
  # listClientSecrets
  - '^/api/v1/accounts/\{id\}/client-secrets > List an account''s client secrets > 404( >|$)'
  # createClientSecret
  - '^/api/v1/accounts/\{id\}/client-secrets > Make a scoped OAuth client secret > (404|429)( >|$)'
  # updateServerCapabilities
  - '^/api/v1/admin/server-capabilities > Replace the server capability ceiling > 429( >|$)'
  # getServerCapabilities
  - '^/api/v1/admin/server-capabilities > The server capability ceiling > 429( >|$)'
  # requestRecoveryEmail
  - '^/api/v1/auth/recover/email > Request a password recovery link > 503( >|$)'
  # registerRecoveryEmail
  - '^/api/v1/auth/recovery-email > Register an external recovery email before lockout > 503( >|$)'
  # recoveryEmailLink
  - '^/api/v1/auth/recovery-email/link > Open a private recovery email link > 500( >|$)'

# Each documented response has one example (#1236). One that says, in
# x-requires, that proving it needs a principal, a body, a spent limit or a
# dependency fault this healthy topology cannot set up is not sent; it is
# listed as unproven here, and its in-process *WithVertrag suite proves it.
provides: {}
unproven: .cache/contract/unproven.json

# The pairs' path and query values are the in-process fixtures' ids, not the
# topology's: a sequenced run's links fill them instead (vertrag named-values).
named-values: illustrate

# What the run is held to (vertrag's surface gate, #376): every operation in
# the spec, counted only when every documented transaction of it was sent in
# the examples phase and passed, none failed, none skipped, none answered 5xx.
# A shortfall exits 3. Taken out of the count, each with its reason: the
# operations never sent (exclude-operation-id above), and the documented
# statuses exclude-matching keeps back, which must stay in step with it. The
# statuses no example proves yet are listed by operation in
# tests/contract/status-baseline.txt, which run.sh adds here and holds to only
# shrink (tests/contract/status_baseline.py, #1334).
surface:
  count: passed
  require: 100
  exclude:
    - operation: getAttachment
      status: "304"
      reason: "Bodyless responses cannot carry named media-type examples. The required TestAttachmentDownloadExamplesWithVertrag suite sends If-None-Match through the real handler/storage client; full topology coverage remains in #1166."
    - operation: getAttachment
      status: "412"
      reason: "Bodyless responses cannot carry named media-type examples. The required TestAttachmentDownloadExamplesWithVertrag suite sends If-Match through the real handler/storage client; full topology coverage remains in #1166."
    - operation: getAttachment
      status: "500"
      reason: "A healthy topology cannot provoke database/storage/seek faults. The required attachment example suite covers dependency refusals, and TestAttachmentConditionalResponsesDescribeTheWire covers seek errors; topology fault injection remains in #1166."
    - operation: resetTestData
      reason: "Wipes the data the rest of the run depends on: sent last, by the teardown phase (tests/contract/teardown.py)."
    - operation: restoreTestSnapshot
      reason: "Wipes the data the rest of the run depends on: sent last, by the teardown phase (tests/contract/teardown.py)."
    - operation: recoveryEmailLink
      status: "500"
      reason: "The page is static; only a failed response write answers 500, which needs fault injection (#1166)."

# The HAR records the traffic for the secret scan (tests/contract/secret_scan.py, #673).
reporter: [cli, junit, har]
output: ["", .cache/contract/examples.xml, .cache/contract/examples.har]
