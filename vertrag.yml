# The contract tests (#376): vertrag (github.com/antimatter-studios/vertrag)
# sends every request the generated description documents to a running API and checks each
# answer against what the spec promises: status, headers and body schema.
#
# CI runs it in the E2E (full topology) job, against the topology that job has
# already brought up, signed in as the fixture admin (cmd/seed). See
# tests/contract/README.md for how to run it, what is excluded and why, and how
# the "operations exercised" gate is computed.

spec: ./.cache/contract/openapi.json
endpoint: http://10.99.0.20:8080

# Hooks supply fixture credentials and generated keys, and select documented
# examples where vertrag cannot pair parameters. Resource links come from the spec.
hookfiles: ./tests/contract/entrypoint.py
language: python
# Fixture setup can invoke the cached Go helper (bounded to 20 seconds), or
# wait up to 60 seconds for the send budget before retrying. Include time for
# admin login and both API requests in the hook deadline (ms).
hooks-worker-timeout: 120000

auth:
  login:
    path: /api/v1/auth/login
    # The fixture admin, a test fixture like every password in cmd/seed.
    body: {email: admin@restmail.test, password: "admin123!@", client: native}
    # Every body field is classified once: the password is redacted in every
    # report; the address and client are shown, so a report says who signed in.
    secrets: [password]
    public: [email, client]
  header: 'Authorization: Bearer {$response.body#/data/access_token}'
  # Sent with no credential: each authenticated operation's documented 401, and
  # the two operations that take a credential other than the session's (the
  # hooks give them theirs).
  except:
    - '/api/v1/auth/logout > Log out — revoke the session and clear the auth cookies > 204'
    - '/api/v1/auth/2fa > Read your authenticator status > 401 > application/json'
    - '/api/v1/auth/2fa/enroll > Start an authenticator enrollment > 401 > application/json'
    - '/api/v1/auth/recovery-email > Read your registered recovery email > 401 > application/json'
    - '/api/v1/auth/protocol-sign-in > Sign a mail client in (protocol gateways) > 200 > application/json'
    - '/api/v1/auth/protocol-sign-in > Sign a mail client in (protocol gateways) > 400 > application/json'
    - '/api/v1/auth/protocol-sign-in > Sign a mail client in (protocol gateways) > 401 > application/json'
    - '/api/v1/auth/protocol-sign-in > Sign a mail client in (protocol gateways) > 422 > application/json'
    - '/api/v1/accounts > List the accounts this one reaches > 401 > application/json'
    - '/api/v1/accounts/{id}/events > Server-Sent Events stream for real-time updates > 401 > application/json'
    - '/api/v1/accounts > Create an account > 401 > application/json'
    - '/api/v1/accounts/link > Link an existing account by proving its password > 401 > application/json'
    - '/api/v1/accounts/{id}/credentials > List an account''s app passwords > 401 > application/json'
    - '/api/v1/accounts/{id}/credentials > Make an app password > 401 > application/json'
    - '/api/v1/accounts/{id}/credentials/{credential_id} > Revoke an app password > 401 > application/json'
    - '/api/v1/admin/audit > Read the audit log, newest first > 401 > application/json'
    - '/api/v1/admin/audit/verify > Check the audit log''s hash chain > 401 > application/json'
    - '/api/v1/admin/test/snapshot > Capture the current database state as JSON > 401 > application/json'
    - '/api/v1/admin/grants > List grants, oldest first > 401 > application/json'
    - '/api/v1/admin/grants/mine > The caller''s own grants > 401 > application/json'
    - '/api/v1/admin/server-capabilities > The server capability ceiling > 401 > application/json'
    - '/api/v1/admin/domains/{id}/dns > Live DNS record check (MX, SPF, DMARC, DKIM, MTA-STS, TLS-RPT) for a domain > 401 > application/json'
    - '/api/v1/admin/mailboxes/{id}/invitation > Invite an account to choose its first password > 401 > application/json'
    - '/api/v1/accounts/{id}/messages/import > Import one historical message > 401 > application/json'

checks:
  # Validate every declared response header value against its schema (#674).
  header-schema: true
  # The "no credentials" principal, for every operation: each authenticated
  # request is sent again without its credential, and one that is answered
  # anyway is a failure.
  ignored-auth: true

# Operations never sent, in any phase. Each one's reason is beside it under
# surface.exclude below, which takes the same operations out of the surface
# the run is held to; tests/contract/gate.py checks the two lists agree.
# Push and ACME are off in this topology, so their routes are absent from the
# generated description and must not be named as exclusions.
exclude-operation-id:
  - checkMailboxAddress
  - deliverMessage
  - resetTestData
  - restoreTestSnapshot

# Documented responses the examples phase cannot provoke yet, by pattern. A
# transaction is named "<title> > <path> > <summary> > <status>[ > <type>]".
exclude-matching:
  # The topology sends whole, single-range, multi-range and unsatisfiable
  # downloads with named parameter examples. Bodyless 304/412 cannot carry a
  # named media-type example. The 500's pair requires a database fault, but the
  # run still builds its media-type transactions from the conditional request
  # headers' examples, which a healthy server answers 304 or 412. The mandatory
  # TestAttachmentDownloadExamplesWithVertrag suite exercises conditional
  # requests and dependency refusals through the real handler and storage client;
  # TestAttachmentConditionalResponsesDescribeTheWire covers multipart/seek faults.
  # #1166 tracks the remaining full-topology conditional and fault matrix.
  - '^/api/v1/attachments/\{id\} > .* > (304|412|500)( >|$)'
  # A refusal for a missing capability needs a principal without it: vertrag's
  # authorization phase, not the admin's run.
  - '> 403( >|$)'
  # Each needs a request of its own that provokes it (a named request example
  # paired with a named response example), which the spec does not have yet:
  # #386. The 400s and 422s are excluded by path rather than everywhere, so the
  # operations whose refusals have their pair are sent: login, createDomain,
  # createAlias, createPipeline, createBan, createCustomFilter,
  # validateCustomFilter, sendTestEmail, createAccount, restmailDeliver,
  # bulkDeleteQueue, bulkRetryQueue, bulkBounceQueue, addToAllowlist,
  # addToBlocklist, testFilter, testPipeline, testCustomFilter,
  # receiveTlsReport, createCertificate, protocolSignIn, createFolder,
  # createContact, sendMessage, microsoftAutodiscover, setDomainRelay,
  # setDKIMRotation, createAppPassword, linkAccount, setVacation, importContacts,
  # updateMailbox, probeServices, setMtaStsPolicy, updateAlias, updateDomain,
  # updatePipeline, updateCustomFilter, putSieveScript, validateSieveScript
  # and setDKIMKey.
  # Coverage probes built from a refused request are refused too;
  # tests/contract/gate.py does not judge those (tests/contract/README.md).
  # Each operation paired next comes off these patterns the same way. A path in
  # a segment none of them names is sent.
  # #672: parsed JSON examples exercise 422; malformed-body refusals
  # need their own raw request setup before this topology can send them.
  - '^/\.well\-known/smtp\-tlsrpt > .* > 400( >|$)'
  - '^/api/v1/accounts > .* > 400( >|$)'
  - '^/api/v1/accounts/\{id\}/contacts > .* > 400( >|$)'
  - '^/api/v1/accounts/\{id\}/contacts/import > .* > 400( >|$)'
  - '^/api/v1/accounts/\{id\}/credentials > .* > 400( >|$)'
  - '^/api/v1/accounts/\{id\}/folders > .* > 400( >|$)'
  - '^/api/v1/accounts/\{id\}/messages/import > .* > 400( >|$)'
  - '^/api/v1/accounts/\{id\}/sieve > .* > 400( >|$)'
  - '^/api/v1/accounts/\{id\}/sieve/validate > .* > 400( >|$)'
  - '^/api/v1/accounts/\{id\}/vacation > .* > 400( >|$)'
  - '^/api/v1/accounts/link > .* > 400( >|$)'
  - '^/api/v1/admin/aliases > .* > 400( >|$)'
  - '^/api/v1/admin/aliases/\{id\} > .* > 400( >|$)'
  - '^/api/v1/admin/bans > .* > 400( >|$)'
  - '^/api/v1/admin/certificates > .* > 400( >|$)'
  - '^/api/v1/admin/custom\-filters > .* > 400( >|$)'
  - '^/api/v1/admin/custom\-filters/\{id\} > .* > 400( >|$)'
  - '^/api/v1/admin/custom\-filters/\{id\}/test > .* > 400( >|$)'
  - '^/api/v1/admin/custom\-filters/validate > .* > 400( >|$)'
  - '^/api/v1/admin/dkim/\{id\} > .* > 400( >|$)'
  - '^/api/v1/admin/dkim/\{id\}/rotation > .* > 400( >|$)'
  - '^/api/v1/admin/domains > .* > 400( >|$)'
  - '^/api/v1/admin/domains/\{id\} > .* > 400( >|$)'
  - '^/api/v1/admin/domains/\{id\}/allowlist > .* > 400( >|$)'
  - '^/api/v1/admin/domains/\{id\}/blocklist > .* > 400( >|$)'
  - '^/api/v1/admin/domains/\{id\}/mta\-sts > .* > 400( >|$)'
  - '^/api/v1/admin/domains/\{id\}/relay > .* > 400( >|$)'
  - '^/api/v1/admin/mailboxes/\{id\} > .* > 400( >|$)'
  - '^/api/v1/admin/pipelines > .* > 400( >|$)'
  - '^/api/v1/admin/pipelines/\{id\} > .* > 400( >|$)'
  - '^/api/v1/admin/pipelines/test > .* > 400( >|$)'
  - '^/api/v1/admin/pipelines/test\-filter > .* > 400( >|$)'
  - '^/api/v1/admin/queue/bulk\-bounce > .* > 400( >|$)'
  - '^/api/v1/admin/queue/bulk\-delete > .* > 400( >|$)'
  - '^/api/v1/admin/queue/bulk\-retry > .* > 400( >|$)'
  - '^/api/v1/admin/test/probe > .* > 400( >|$)'
  - '^/api/v1/admin/test/send > .* > 400( >|$)'
  - '^/api/v1/auth/invitation > .* > 400( >|$)'
  - '^/api/v1/auth/login > .* > 400( >|$)'
  - '^/api/v1/auth/protocol\-sign\-in > .* > 400( >|$)'
  - '^/api/v1/messages/send > .* > 400( >|$)'
  - '^/autodiscover/autodiscover\.xml > .* > 422( >|$)'
  - '^/restmail/messages > .* > 400( >|$)'
  - '> 409( >|$)'
  # Reads, updates, deletes and pipeline previews have named missing IDs.
  # test_gate.py pins the complete enabled set.
  # All other documented 404s still need a request that provokes them.
  - '^/(api/v1/(auth|accounts|devices|messages|attachments)|restmail|mail|autodiscover|\.well-known)(/| >).* > 404( >|$)'
  # Autoconfig's 400 (no email domain in the address or the host name) needs a
  # request to a host that is not autoconfig.<domain>, which the run cannot make.
  - '^/(mail|\.well-known/autoconfig)(/| >).* > (400|422)( >|$)'
  - '^/api/v1/admin/(bans|grants|test)(/| >).* > 404( >|$)'
  - '^/api/v1/admin/queue/\{id\} > Delete a queue entry > 404( >|$)'
  - '^/api/v1/admin/queue/\{id\}/(retry|bounce) > .* > 404( >|$)'
  - '^/api/v1/admin/dkim/\{id\} > .* > 404( >|$)'
  - '^/api/v1/admin/dkim/\{id\}/rotation > Set .* > 404( >|$)'
  - '^/api/v1/admin/mailboxes/\{id\}/sessions > .* > 404( >|$)'
  - '^/api/v1/admin/custom-filters(/\{id\}/test| >).* > 404( >|$)'
  - '^/api/v1/admin/aliases > .* > 404( >|$)'
  - '^/api/v1/admin/domains/\{id\}/(allowlist|blocklist|suppressions)(/| >).* > 404( >|$)'
  - '^/api/v1/admin/domains/\{id\}/(mta-sts|relay) > (Create|Set|Delete).* > 404( >|$)'
  - '^/api/v1/admin/certificates/\{id\} > Delete a certificate > 404( >|$)'
  # Recovery email's four POST routes also lack named refusal pairs (#386).
  - '^/api/v1/auth/(logout|refresh|reset|recover(/email(/redeem)?)?|recovery-email(/verify)?|owner/[a-z]+|2fa/[a-z]+|password) > .* > (400|422)( >|$)'
  # The client-secret exchange lacks a named malformed-request pair (#386).
  - '^/api/v1/oauth/token > .* > 400( >|$)'
  - '^/api/v1/devices(/| >).* > (400|422)( >|$)'
  - '^/api/v1/messages/(\{id\}|draft|deliver)(/| >).* > (400|422)( >|$)'
  - '^/api/v1/accounts/link > .* > 400( >|$)'
  - '^/api/v1/accounts/\{id\} > .* > (400|422)( >|$)'
  - '^/api/v1/accounts/\{id\}/(threads|quota|search|quarantine|events|calendar-events)(/| >).* > (400|422)( >|$)'
  # Sieve's missing/null script 422s have named request/response pairs.
  - '^/api/v1/accounts/\{id\}/sieve(/| >).* > 400( >|$)'
  - '^/api/v1/accounts/\{id\}/credentials/.* > (400|422)( >|$)'
  # Client-secret creation and path validation lack named refusal pairs (#386).
  - '^/api/v1/accounts/\{id\}/client-secrets(/\{credential_id\})? > .* > (400|422)( >|$)'
  - '^/api/v1/accounts/\{id\}/folders/.* > (400|422)( >|$)'
  - '^/api/v1/accounts/\{id\}/contacts/(\{cid\}|block|suggest)(/| >).* > (400|422)( >|$)'
  - '^/api/v1/accounts/\{id\}/contacts > List contacts for an account > (400|422)( >|$)'
  - '^/api/v1/accounts > List the accounts this one reaches > (400|422)( >|$)'
  - '^/api/v1/admin/(audit|grants|server-capabilities|tls-reports)(/| >).* > (400|422)( >|$)'
  - '^/api/v1/admin/dkim/\{id\}/rotation > Read .* > (400|422)( >|$)'
  - '^/api/v1/admin/mailboxes > .* > (400|422)( >|$)'
  - '^/api/v1/admin/mailboxes/\{id\}/invitation > .* > 422( >|$)'
  - '^/api/v1/admin/queue > .* > (400|422)( >|$)'
  - '^/api/v1/admin/queue/(stats|\{id\})(/| >).* > (400|422)( >|$)'
  - '^/api/v1/admin/aliases/.* > 400( >|$)'
  - '^/api/v1/admin/pipelines/\{id\} > .* > 400( >|$)'
  - '^/api/v1/admin/pipelines/(logs|analytics)(/| >).* > (400|422)( >|$)'
  - '^/api/v1/admin/domains/\{id\} > .* > 400( >|$)'
  - '^/api/v1/admin/domains/\{id\}/(dns|suppressions)(/| >).* > (400|422)( >|$)'
  - '^/api/v1/admin/domains/\{id\}/relay > Get .* > (400|422)( >|$)'
  - '^/api/v1/admin/domains/\{id\}/(allowlist|blocklist)/.* > (400|422)( >|$)'
  - '^/api/v1/admin/domains/\{id\}/(allowlist|blocklist) > List .* > (400|422)( >|$)'
  - '^/api/v1/admin/custom-filters/\{id\} > .* > 400( >|$)'
  - '^/api/v1/admin/(aliases|custom-filters|pipelines) > List [a-z ]+, optionally filtered by domain > (400|422)( >|$)'
  - '^/api/v1/admin/bans > List IP bans > (400|422)( >|$)'
  - '^/api/v1/admin/logs/delivery > .* > (400|422)( >|$)'
  - '^/api/v1/admin/test/verify > .* > (400|422)( >|$)'
  - '^/\.well-known/(restmail|autoconfig|mta-sts\.txt|acme-challenge)(/| >).* > (400|422)( >|$)'
  - '^/restmail/(capabilities|mailboxes) > .* > (400|422)( >|$)'
  # A 401 for a wrong credential on an operation that takes none (#386).
  - '^/api/v1/auth/(reset|owner/[a-z]+) > .* > 401( >|$)'
  # Rate limits and an unavailable sidecar: not reachable in a contract run.
  - '> (429|503)( >|$)'
  # The send example sends immediately. The scheduled branch needs a request
  # carrying scheduled_at, which the examples phase does not have; the handler
  # and DB tests cover it. Only the 202 is held back, so the ordinary send is
  # still judged.
  - '^/api/v1/messages/send > .* > 202( >|$)'
  # A healthy fixture cannot produce the custom-filter sidecar's timeout, and
  # its 408 has no pair that requires a fault. Its transport regression tests
  # cover it; #1166 tracks topology fault injection. This never ignores a 5xx
  # answering a normal transaction.
  - '^/api/v1/admin/custom-filters/\{id\}/test > .* > 408( >|$)'
  # A healthy fixture sends no recovery email read or link page over the body
  # cap and meets no failed database or response write, and these statuses
  # have no pair that requires one.
  - '^/api/v1/auth/recovery-email(/link)? > .* > (413|500)( >|$)'
  # Nor a server capability ceiling read over the body cap or meeting a failed
  # database.
  - '^/api/v1/admin/server-capabilities > The server capability ceiling > (413|500)( >|$)'

# Each documented response has one example (#1236). One that says, in
# x-requires, that proving it needs a principal, a body, a spent limit or a
# dependency fault this healthy topology cannot set up is not sent; it is
# listed as unproven here, and its in-process *WithVertrag suite proves it.
provides: {}
unproven: .cache/contract/unproven.json

# The pairs' path and query values are the in-process fixtures' ids, not the
# topology's: a sequenced run's links fill them instead (vertrag named-values).
named-values: illustrate

# What the run is held to (vertrag's surface gate, #376): every operation in
# the spec, counted only when every documented transaction of it was sent in
# the examples phase and passed, none failed, none skipped, none answered 5xx.
# A shortfall exits 3. Taken out of the count, each with its reason: the
# operations never sent (exclude-operation-id above), and the documented
# statuses exclude-matching keeps back, which must stay in step with it.
surface:
  count: passed
  require: 100
  exclude:
    - operation: getAttachment
      status: "304"
      reason: "Bodyless responses cannot carry named media-type examples. The required TestAttachmentDownloadExamplesWithVertrag suite sends If-None-Match through the real handler/storage client; full topology coverage remains in #1166."
    - operation: getAttachment
      status: "412"
      reason: "Bodyless responses cannot carry named media-type examples. The required TestAttachmentDownloadExamplesWithVertrag suite sends If-Match through the real handler/storage client; full topology coverage remains in #1166."
    - operation: getAttachment
      status: "500"
      reason: "A healthy topology cannot provoke database/storage/seek faults. The required attachment example suite covers dependency refusals, and TestAttachmentConditionalResponsesDescribeTheWire covers seek errors; topology fault injection remains in #1166."
    - operation: checkMailboxAddress
      reason: "Served only on the internal mTLS listener, which the E2E topology turns on; the public listener vertrag reaches does not have it."
    - operation: deliverMessage
      reason: "Served only on the internal mTLS listener, which the E2E topology turns on; the public listener vertrag reaches does not have it."
    - operation: resetTestData
      reason: "Wipes the data the rest of the run depends on: sent last, by the teardown phase (tests/contract/teardown.py)."
    - operation: restoreTestSnapshot
      reason: "Wipes the data the rest of the run depends on: sent last, by the teardown phase (tests/contract/teardown.py)."
    - operation: sendMessage
      status: "202"
      reason: "The contract's send example sends immediately; a scheduled request is not part of the examples phase. The scheduled branch is covered by the handler and DB tests, and the ordinary send is still counted."
    - status: "403"
      reason: "a refusal for a missing capability needs a principal without it: the authorization phase, not the admin's run"
    - status: "400"
      reason: "needs a request of its own that provokes it (#386)"
    - status: "404"
      reason: "needs a request of its own that provokes it (#386)"
    - status: "409"
      reason: "needs a request of its own that provokes it (#386)"
    - status: "422"
      reason: "needs a request of its own that provokes it (#386)"
    - status: "429"
      reason: "a rate limit: not reachable in a contract run"
    - status: "503"
      reason: "an unavailable sidecar: not reachable in a contract run"
    - operation: testCustomFilter
      status: "408"
      reason: "A sidecar timeout needs a controlled dependency (#1166); transport regression tests cover it."
    - operation: getRecoveryEmail
      status: "413"
      reason: "The router's body cap answers before the handler, and the read is a GET the run sends without a body (#1166)."
    - operation: getRecoveryEmail
      status: "500"
      reason: "A failed recovery method read needs a fault-injected database (#1166)."
    - operation: recoveryEmailLink
      status: "413"
      reason: "The router's body cap answers before the handler, and the link page is a GET the run sends without a body (#1166)."
    - operation: recoveryEmailLink
      status: "500"
      reason: "The page is static; only a failed response write answers 500, which needs fault injection (#1166)."
    - operation: getServerCapabilities
      status: "413"
      reason: "The router's body cap answers before the handler, and the read is a GET the run sends without a body (#1166)."
    - operation: getServerCapabilities
      status: "500"
      reason: "A failed superadmin or ceiling read needs a fault-injected database (#1166)."

# The HAR records the traffic for the secret scan (tests/contract/secret_scan.py, #673).
reporter: [cli, junit, har]
output: ["", .cache/contract/examples.xml, .cache/contract/examples.har]
