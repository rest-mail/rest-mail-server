  # ═══════════════════════════════════════════════════════════════
  # Inbound (Internal / Gateway)
  # ═══════════════════════════════════════════════════════════════
  /api/mailboxes:
    get:
      operationId: checkMailboxAddress
      tags: [Inbound]
      summary: Check if a mailbox address exists (used by SMTP gateway)
      description: >-
        Machine-to-machine recipient check. When internal mTLS is enabled this route
        is served ONLY on the dedicated internal listener (verified gateway client
        certificate required) and is absent from the public listener; when disabled
        it is unauthenticated on the public listener. Never accepts a user JWT.
      security: []
      x-internal-mtls: true
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Mailbox lookup result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MailboxCheck"

  /api/v1/messages/deliver:
    post:
      operationId: deliverMessage
      tags: [Inbound]
      summary: Deliver a message from the SMTP gateway
      description: >-
        Machine-to-machine inbound delivery. When internal mTLS is enabled this route
        is served ONLY on the dedicated internal listener (verified gateway client
        certificate required) and is absent from the public listener; when disabled
        it is unauthenticated on the public listener. Never accepts a user JWT.
      security: []
      x-internal-mtls: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliverMessageRequest"
      responses:
        "201":
          description: Message delivered
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ═══════════════════════════════════════════════════════════════
  # RESTMAIL Protocol
  # ═══════════════════════════════════════════════════════════════
  /restmail/capabilities:
    get:
      operationId: restmailCapabilities
      tags: [RESTMAIL]
      summary: Get RESTMAIL server capabilities
      security: []
      responses:
        "200":
          description: Server capabilities
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RestmailCapabilities"

  /restmail/mailboxes:
    get:
      operationId: restmailCheckMailbox
      tags: [RESTMAIL]
      summary: Check if a recipient mailbox exists
      security: []
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Mailbox check result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RestmailMailboxCheck"

  /restmail/messages:
    post:
      operationId: restmailDeliver
      tags: [RESTMAIL]
      summary: Deliver a message via RESTMAIL protocol
      description: >-
        Server-to-server delivery. Unauthenticated at the HTTP layer; the message's
        authenticity is verified out-of-band from its DKIM signature and the SPF
        result of the sending host.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestmailDeliverRequest"
      responses:
        "201":
          description: Delivery result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RestmailDeliverResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

