  /api/v1/admin/pipelines/logs:
    get:
      operationId: listPipelineLogs
      tags: ["Admin: Pipelines"]
      x-required-capability: pipelines:read
      summary: List recent per-message pipeline traces
      description: >-
        Newest-first list of per-message pipeline traces. The read source moved from
        the legacy pipeline_logs table to message_traces, so each row is the richer
        MessageTrace shape (outcome, reason_code, transport, envelope, stage timeline,
        duration). The `action` filter matches the trace's final_action.
      parameters:
        - name: pipeline_id
          in: query
          schema:
            type: integer
        - name: direction
          in: query
          schema:
            type: string
            enum: [inbound, outbound]
        - name: action
          in: query
          description: Matches MessageTrace.final_action
          schema:
            type: string
            enum: [continue, reject, quarantine, discard, defer]
        - name: rfc_message_id
          in: query
          description: RFC 5322 Message-ID correlation key
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
            enum: [delivered, queued, rejected, quarantined, discarded, deferred]
        - name: reason_code
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Pipeline message traces
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MessageTrace"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

