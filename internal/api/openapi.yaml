      responses:
        "200":
          description: Custom filter updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CustomFilter"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCustomFilter
      tags: ["Admin: Custom Filters"]
      x-required-capability: pipelines:delete
      summary: Delete a custom filter
      responses:
        "200":
          description: Custom filter deleted
          content:
            application/json:
              schema:
                type: object
