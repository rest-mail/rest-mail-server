  /api:
    get:
      operationId: apiRoot
      tags: [System]
      summary: API discovery — name, version and key links
      security: []
      responses:
        "200":
          description: API metadata
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                        example: restmail
                      version:
                        type: string
                      commit:
                        type: string
                      build_date:
                        type: string
                      links:
                        type: object
                        additionalProperties:
                          type: string

  /api/docs:
    get:
      operationId: swaggerUI
      tags: [System]
      summary: Swagger UI documentation page
      security: []
      responses:
        "200":
          description: HTML Swagger UI page
          content:
            text/html:
              schema:
                type: string

  /api/docs/openapi.yaml:
    get:
      operationId: openapiSpec
      tags: [System]
      summary: This OpenAPI specification document
      security: []
      responses:
        "200":
          description: The raw OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string

  /metrics:
    get:
      operationId: prometheusMetrics
      tags: [System]
      summary: Prometheus metrics exposition
      security: []
      responses:
        "200":
          description: Metrics in Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string

  /mail/config-v1.1.xml:
    get:
      operationId: mozillaAutoconfig
      tags: [System]
      summary: Mozilla/Thunderbird autoconfiguration
      security: []
      parameters:
        - name: emailaddress
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Autoconfig XML document
          content:
            application/xml:
              schema:
                type: string
        "404":
          description: Domain not found

  /.well-known/autoconfig/mail/config-v1.1.xml:
    get:
      operationId: mozillaAutoconfigWellKnown
      tags: [System]
      summary: Mozilla/Thunderbird autoconfiguration (well-known path)
      security: []
      parameters:
        - name: emailaddress
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Autoconfig XML document
          content:
            application/xml:
              schema:
                type: string
        "404":
          description: Domain not found

  /autodiscover/autodiscover.xml:
    post:
      operationId: microsoftAutodiscover
      tags: [System]
      summary: Microsoft Outlook autodiscover
      security: []
      requestBody:
        required: false
        content:
          application/xml:
            schema:
              type: string
      responses:
        "200":
          description: Autodiscover XML response
          content:
            application/xml:
              schema:
                type: string

  /.well-known/mta-sts.txt:
    get:
      operationId: mtaStsPolicyFile
      tags: [System]
      summary: MTA-STS policy file (RFC 8461)
      description: Served to external MTAs. The domain is resolved from the Host header.
      security: []
      responses:
        "200":
          description: MTA-STS policy in text/plain
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Domain unknown or no active policy

  /.well-known/smtp-tlsrpt:
    post:
      operationId: receiveTlsReport
      tags: [System]
      summary: TLS-RPT report ingestion (RFC 8460)
      description: >-
        Receives JSON TLS-RPT reports from external MTAs. No auth by design, so
        it is bounded to prevent storage write-amplification: the request body is
        size-capped, the number of policy entries per report is capped, the route
        is rate-limited per client IP, and only reports whose policy-domain is a
        domain this server hosts are stored (others are dropped).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TLSRPTReport"
      responses:
        "201":
          description: Report stored
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      stored:
                        type: integer
                        description: Number of policy entries persisted
        "400":
          description: Malformed report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Report body exceeds the size cap, or carries more policy entries than allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Rate limit exceeded for the client IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /.well-known/acme-challenge/{token}:
    get:
      operationId: acmeChallenge
      tags: [System]
      summary: ACME HTTP-01 challenge response
      description: >-
        Registered only when ACME is enabled. Served to the ACME CA for domain
        validation. No auth by design.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Key authorization for the challenge token
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Unknown challenge token

  # ═══════════════════════════════════════════════════════════════
  # Calendar (JWT)
  # ═══════════════════════════════════════════════════════════════
  /api/v1/messages/{id}/calendar-reply:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    post:
      operationId: respondToCalendar
      tags: [Calendar]
      summary: Send an iMIP reply to a calendar invitation in a message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response, from]
              properties:
                response:
                  type: string
                  enum: [ACCEPTED, DECLINED, TENTATIVE]
                from:
                  type: string
                  format: email
                  description: Sender address for the reply; must belong to the caller
      responses:
        "200":
          description: Reply sent
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: sent
                      response:
                        type: string
                        example: ACCEPTED
        "400":
          description: Message has no calendar event, or invalid response value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller does not own the message or the from address
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/accounts/{id}/calendar-events:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: listCalendarEvents
      tags: [Calendar]
      summary: List calendar events (grouped by UID, latest version) for the mailbox
      responses:
        "200":
          description: Calendar event summaries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CalendarEventSummary"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Stats
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/stats:
    get:
      operationId: getDashboardStats
      tags: ["Admin: Stats"]
      summary: Dashboard statistics
      description: Visible to any admin role; requires no specific capability.
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DashboardStats"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Users & Roles
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/admin-users:
    get:
      operationId: listAdminUsers
      tags: ["Admin: Users & Roles"]
      x-required-capability: users:read
      summary: List admin users
      responses:
        "200":
          description: Admin users
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUser"
    post:
      operationId: createAdminUser
      tags: ["Admin: Users & Roles"]
      x-required-capability: users:write
      summary: Create an admin user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminUserRequest"
      responses:
        "201":
          description: Admin user created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdminUser"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/admin-users/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getAdminUser
      tags: ["Admin: Users & Roles"]
      x-required-capability: users:read
      summary: Get an admin user by ID
      responses:
        "200":
          description: Admin user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdminUser"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateAdminUser
      tags: ["Admin: Users & Roles"]
      x-required-capability: users:write
      summary: Update an admin user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserRequest"
      responses:
        "200":
          description: Update acknowledgement
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Admin user updated successfully
    delete:
      operationId: deleteAdminUser
      tags: ["Admin: Users & Roles"]
      x-required-capability: users:delete
      summary: Delete an admin user
      responses:
        "204":
          description: Admin user deleted

  /api/v1/admin/roles:
    get:
      operationId: listRoles
      tags: ["Admin: Users & Roles"]
      x-required-capability: users:read
      summary: List roles
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"

  /api/v1/admin/capabilities:
    get:
      operationId: listCapabilities
      tags: ["Admin: Users & Roles"]
      x-required-capability: users:read
      summary: List capabilities
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Capability"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Domains — DNS check
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/domains/{id}/dns:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: domainDNSCheck
      tags: ["Admin: Domains"]
      x-required-capability: domains:read
      summary: Live DNS record check (MX, SPF, DMARC, DKIM, MTA-STS) for a domain
      responses:
        "200":
          description: DNS check result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DNSCheckResult"
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════════
  # Admin: MTA-STS
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/domains/{id}/mta-sts:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getMtaStsPolicy
      tags: ["Admin: MTA-STS"]
      x-required-capability: domains:read
      summary: Get the MTA-STS policy for a domain
      responses:
        "200":
          description: MTA-STS policy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MTASTSPolicy"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: setMtaStsPolicy
      tags: ["Admin: MTA-STS"]
      x-required-capability: domains:write
      summary: Create or update the MTA-STS policy for a domain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMTASTSPolicyRequest"
      responses:
        "200":
          description: Policy updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MTASTSPolicy"
        "201":
          description: Policy created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MTASTSPolicy"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteMtaStsPolicy
      tags: ["Admin: MTA-STS"]
      x-required-capability: domains:write
      summary: Delete the MTA-STS policy for a domain
      responses:
        "204":
          description: Policy deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════════
  # Admin: TLS Reports
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/tls-reports:
    get:
      operationId: listTlsReports
      tags: ["Admin: TLS Reports"]
      x-required-capability: domains:read
      summary: List received TLS-RPT reports
      parameters:
        - name: domain_id
          in: query
          schema:
            type: integer
        - name: policy_type
          in: query
          schema:
            type: string
            enum: [sts, tlsa, no-policy]
        - name: reporting_org
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: TLS-RPT reports
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TLSReport"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Observability (PR5)
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/pipelines/analytics:
    get:
      operationId: getPipelineAnalytics
      tags: ["Admin: Observability"]
      x-required-capability: observability:read
      summary: Windowed message-lifecycle funnel from pipeline_rollups
      parameters:
        - name: window
          in: query
          description: Look-back as a Go duration (e.g. 24h). Ignored when `since` is given.
          schema:
            type: string
            default: 24h
        - name: since
          in: query
          description: RFC3339 lower bound; takes precedence over `window`.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Pipeline analytics funnel
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PipelineAnalyticsResponse"

  /api/v1/admin/messages/{id}/trace:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    get:
      operationId: getMessageTrace
      tags: ["Admin: Observability"]
      x-required-capability: observability:read
      summary: Get the pipeline trace for a delivered message
      description: >-
        Returns the trace joined on message_id, which is set only on the
        delivered/queued path. Non-delivered or unknown ids yield 404 (correlate
        those via rfc_message_id on the pipeline logs endpoint instead).
      responses:
        "200":
          description: Message trace
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MessageTrace"
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════════════
  # Admin: Testing (non-production only; admin role, no capability)
  # ═══════════════════════════════════════════════════════════════
  /api/v1/admin/test/send:
    post:
      operationId: sendTestEmail
      tags: ["Admin: Testing"]
      summary: Inject a test email directly into a recipient mailbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from:
                  type: string
                  format: email
                to:
                  type: string
                  format: email
                subject:
                  type: string
                body:
                  type: string
      responses:
        "201":
          description: Test message created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      message_id:
                        type: integer
                      msg_id:
                        type: string
                      from:
                        type: string
                      to:
                        type: string
                      subject:
                        type: string
        "403":
          description: Disabled in production
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/test/verify:
    get:
      operationId: verifyDelivery
      tags: ["Admin: Testing"]
      summary: Poll for a delivered message matching the given criteria
      parameters:
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: email
        - name: subject
          in: query
          schema:
            type: string
        - name: message_id
          in: query
          schema:
            type: string
        - name: timeout
          in: query
          description: Go duration, capped at 30s
          schema:
            type: string
            default: 5s
      responses:
        "200":
          description: Verification result (found true/false)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: true
                    properties:
                      found:
                        type: boolean
        "403":
          description: Disabled in production
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/test/probe:
    post:
      operationId: probeServices
      tags: ["Admin: Testing"]
      summary: Probe connectivity to SMTP/IMAP/POP3/DNS/DB
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                services:
                  type: array
                  items:
                    type: string
                    enum: [smtp, smtp_submission, imap, pop3, dns, db]
                host:
                  type: string
                timeout:
                  type: string
      responses:
        "200":
          description: Per-service probe results
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties: true
        "403":
          description: Disabled in production

  /api/v1/admin/test/reset:
    post:
      operationId: resetTestData
      tags: ["Admin: Testing"]
      summary: Wipe all data and re-seed default test data
      responses:
        "200":
          description: Reset complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "403":
          description: Disabled in production

  /api/v1/admin/test/seed:
    post:
      operationId: seedTestData
      tags: ["Admin: Testing"]
      summary: Seed default test domains, mailboxes, aliases and accounts
      responses:
        "200":
          description: Seed complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "403":
          description: Disabled in production

  /api/v1/admin/test/snapshot:
    post:
      operationId: snapshotTestData
      tags: ["Admin: Testing"]
      summary: Capture the current database state as JSON
      responses:
        "200":
          description: Snapshot payload (restore via /snapshot/restore)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "403":
          description: Disabled in production

  /api/v1/admin/test/snapshot/restore:
    post:
      operationId: restoreTestSnapshot
      tags: ["Admin: Testing"]
      summary: Restore database state from a previously captured snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: A snapshot payload previously returned by /snapshot
      responses:
        "200":
          description: Restore complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          description: Malformed snapshot data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Disabled in production

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /api/v1/auth/login

  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Account ID
    MessageId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Message ID
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Resource ID
    FolderName:
      name: folder
      in: path
      required: true
      schema:
        type: string
      description: Folder name (e.g. INBOX, Sent, Drafts, Trash)

  responses:
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

  schemas:
    # ─────────────────────────────────────────────────────────────
    # Common / Wrapper schemas
    # ─────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: not_found
            message:
              type: string
              example: Resource not found
            details:
              type: object

    ValidationErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: validation_failed
            message:
              type: string
              example: Request body failed validation
            details:
              type: object
              properties:
                fields:
                  type: object
                  additionalProperties:
                    type: string

    Pagination:
      type: object
      properties:
        cursor:
          type: string
          description: Opaque cursor for the next page
        has_more:
          type: boolean
        total:
          type: integer
          format: int64

    # ─────────────────────────────────────────────────────────────
    # Health
    # ─────────────────────────────────────────────────────────────
    HealthStatus:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          example: healthy
        db:
          type: string
          example: connected

    # ─────────────────────────────────────────────────────────────
    # Auth
    # ─────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [access_token, expires_in, user]
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          description: Token lifetime in seconds
        user:
          type: object
          required: [id, email, display_name]
          properties:
            id:
              type: integer
            email:
              type: string
              format: email
            display_name:
              type: string

    RefreshResponse:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token:
          type: string
        expires_in:
          type: integer

    # ─────────────────────────────────────────────────────────────
    # Account
    # ─────────────────────────────────────────────────────────────
    Account:
      type: object
      required: [id, mailbox_id, address, display_name, is_primary]
      properties:
        id:
          type: integer
        mailbox_id:
          type: integer
        address:
          type: string
          format: email
        display_name:
          type: string
        is_primary:
          type: boolean

    LinkAccountRequest:
      type: object
      required: [address, password]
      properties:
        address:
          type: string
          format: email
        password:
          type: string
          format: password
        display_name:
          type: string

    TestConnectionRequest:
      type: object
      required: [address, password]
      properties:
        address:
          type: string
          format: email
        password:
          type: string
          format: password

    TestConnectionResponse:
      type: object
      required: [status, address, display_name]
      properties:
        status:
          type: string
          example: ok
        address:
          type: string
          format: email
        display_name:
          type: string

    # ─────────────────────────────────────────────────────────────
    # Folder
    # ─────────────────────────────────────────────────────────────
    Folder:
      type: object
      required: [name, total, unread]
      properties:
        name:
          type: string
        total:
          type: integer
        unread:
          type: integer

    FolderName:
      type: object
      required: [name]
      properties:
        name:
          type: string

    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    RenameFolderRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    # ─────────────────────────────────────────────────────────────
    # Message
    # ─────────────────────────────────────────────────────────────
    Message:
      type: object
      required: [id, mailbox_id, folder, sender, subject, is_read, is_flagged, is_starred, is_draft, is_deleted, received_at, created_at, updated_at]
      properties:
        id:
          type: integer
        mailbox_id:
          type: integer
        folder:
          type: string
        message_id:
          type: string
          description: RFC 2822 Message-ID header
        in_reply_to:
          type: string
        references:
          type: string
        thread_id:
          type: string
        sender:
          type: string
        sender_name:
          type: string
        recipients_to:
          description: JSON array of recipient objects
          oneOf:
            - type: array
              items:
                type: object
                properties:
                  address:
                    type: string
                  name:
                    type: string
            - type: "null"
        recipients_cc:
          description: JSON array of CC recipient objects
          oneOf:
            - type: array
              items:
                type: object
                properties:
                  address:
                    type: string
                  name:
                    type: string
            - type: "null"
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
        headers:
          description: Raw email headers as JSON
          oneOf:
            - type: object
            - type: "null"
        size_bytes:
          type: integer
        raw_size:
          type: integer
          description: >-
            Exact octet count of the stored raw RFC 2822 message (the size a
            protocol client receives when the raw form is served verbatim,
            e.g. IMAP RFC822.SIZE / POP3 LIST). 0 when the server holds no
            stored raw form; consumers should fall back to size_bytes.
        has_attachments:
          type: boolean
        is_read:
          type: boolean
        is_flagged:
          type: boolean
        is_starred:
          type: boolean
        is_draft:
          type: boolean
        is_deleted:
          type: boolean
        received_at:
          type: string
          format: date-time
        date_header:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateMessageRequest:
      type: object
      properties:
        is_read:
          type: boolean
        is_flagged:
          type: boolean
        is_starred:
          type: boolean
        folder:
          type: string

    SendMessageRequest:
      type: object
      required: [from, to, subject]
      properties:
        from:
          type: string
          format: email
        to:
          type: array
          items:
            type: string
            format: email
        cc:
          type: array
          items:
            type: string
            format: email
        bcc:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
        in_reply_to:
          type: string

    ForwardMessageRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: email
        to:
          type: array
          items:
            type: string
            format: email
        body_text:
          type: string

    # ─────────────────────────────────────────────────────────────
    # Draft
    # ─────────────────────────────────────────────────────────────
    DraftRequest:
      type: object
      required: [from]
      properties:
        from:
          type: string
          format: email
        to:
          type: array
          items:
            type: string
            format: email
        cc:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
        in_reply_to:
          type: string
        references:
          type: string

    UpdateDraftRequest:
      type: object
      properties:
        from:
          type: string
          format: email
        to:
          type: array
          items:
            type: string
            format: email
        cc:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string

    # ─────────────────────────────────────────────────────────────
    # Quota
    # ─────────────────────────────────────────────────────────────
    QuotaInfo:
      type: object
      required: [quota_bytes, quota_used_bytes, message_count, percent_used]
      properties:
        quota_bytes:
          type: integer
          format: int64
        quota_used_bytes:
          type: integer
          format: int64
        message_count:
          type: integer
        percent_used:
          type: number
          format: float

    # ─────────────────────────────────────────────────────────────
    # Attachment
    # ─────────────────────────────────────────────────────────────
    Attachment:
      type: object
      required: [id, message_id, filename, content_type, size_bytes, storage_type, storage_ref, checksum, created_at]
      properties:
        id:
          type: integer
        message_id:
          type: integer
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        storage_type:
          type: string
          enum: [filesystem, s3]
        storage_ref:
          type: string
        checksum:
          type: string
          description: SHA-256 hex digest
        created_at:
          type: string
          format: date-time

    # ─────────────────────────────────────────────────────────────
    # Contact
    # ─────────────────────────────────────────────────────────────
    Contact:
      type: object
      required: [id, mailbox_id, email, name, trust_level, source, created_at, updated_at]
      properties:
        id:
          type: integer
        mailbox_id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        trust_level:
          type: string
          enum: [auto, trusted, blocked]
        source:
          type: string
          enum: [sent, manual, import]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateContactRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        trust_level:
          type: string
          enum: [auto, trusted, blocked]

    UpdateContactRequest:
      type: object
      properties:
        name:
          type: string
        trust_level:
          type: string
          enum: [auto, trusted, blocked]

    ImportContactsRequest:
      type: object
      required: [contacts]
      properties:
        contacts:
          type: array
          items:
            type: object
            required: [email]
            properties:
              email:
                type: string
                format: email
              name:
                type: string

    # ─────────────────────────────────────────────────────────────
    # Vacation
    # ─────────────────────────────────────────────────────────────
    VacationConfig:
      type: object
      required: [enabled, subject, body]
      properties:
        enabled:
          type: boolean
        subject:
          type: string
        body:
          type: string
        start_date:
          type: [string, "null"]
          format: date-time
        end_date:
          type: [string, "null"]
          format: date-time

    # ─────────────────────────────────────────────────────────────
    # Sieve
    # ─────────────────────────────────────────────────────────────
    SieveScript:
      type: object
      required: [id, mailbox_id, script, active, created_at, updated_at]
      properties:
        id:
          type: integer
        mailbox_id:
          type: integer
        script:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PutSieveRequest:
      type: object
      required: [script]
      properties:
        script:
          type: string
        active:
          type: boolean

    # ─────────────────────────────────────────────────────────────
    # Quarantine
    # ─────────────────────────────────────────────────────────────
    Quarantine:
      type: object
      required: [id, mailbox_id, sender, subject, body_preview, quarantine_reason, received_at, expires_at, released]
      properties:
        id:
          type: integer
        mailbox_id:
          type: integer
        sender:
          type: string
        subject:
          type: string
        body_preview:
          type: string
        spam_score:
          type: [number, "null"]
          format: float
        quarantine_reason:
          type: string
        received_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        released:
          type: boolean

    # ─────────────────────────────────────────────────────────────
    # Inbound / Gateway
    # ─────────────────────────────────────────────────────────────
    MailboxCheck:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
        mailbox_id:
          type: integer
        address:
          type: string
          format: email

    DeliverMessageRequest:
      type: object
      required: [address, sender]
      properties:
        address:
          type: string
          format: email
          description: Recipient address
        sender:
          type: string
          format: email
        sender_name:
          type: string
        recipients_to:
          type: array
          items:
            type: string
            format: email
        recipients_cc:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
        message_id:
          type: string
        in_reply_to:
          type: string
        references:
          type: string
        raw_message:
          type: string
          description: Full RFC 2822 raw message
        client_ip:
          type: string
        helo_name:
          type: string

    # ─────────────────────────────────────────────────────────────
    # RESTMAIL Protocol
    # ─────────────────────────────────────────────────────────────
    RestmailCapabilities:
      type: object
      required: [protocol, version, features]
      properties:
        protocol:
          type: string
          example: RESTMAIL
        version:
          type: string
          example: "1.0"
        features:
          type: array
          items:
            type: string

    RestmailMailboxCheck:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
        address:
          type: string
          format: email

    RestmailDeliverRequest:
      type: object
      required: [to]
      properties:
        from:
          type: string
          format: email
        to:
          type: array
          items:
            type: string
            format: email
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
        message_id:
          type: string
        in_reply_to:
          type: string
        references:
          type: string
        headers:
          type: object
          description: Raw headers as JSON
        raw_message:
          type: string
          description: Full RFC 2822 raw message
        sender:
          type: string
          format: email
          description: Alias for 'from'
        recipients:
          type: array
          items:
            type: string
            format: email
          description: Alias for 'to'

    RestmailDeliverResponse:
      type: object
      required: [delivered, failed]
      properties:
        delivered:
          type: array
          items:
            type: string
            format: email
        failed:
          type: array
          items:
            type: string
            format: email

    # ─────────────────────────────────────────────────────────────
    # Domain
    # ─────────────────────────────────────────────────────────────
    Domain:
      type: object
      required: [id, name, server_type, active, default_quota_bytes, created_at, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        server_type:
          type: string
          enum: [traditional, restmail]
        active:
          type: boolean
        default_quota_bytes:
          type: integer
          format: int64
        dkim_selector:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateDomainRequest:
      type: object
      required: [name, server_type]
      properties:
        name:
          type: string
        server_type:
          type: string
          enum: [traditional, restmail]
        default_quota_bytes:
          type: integer
          format: int64

    UpdateDomainRequest:
      type: object
      properties:
        active:
          type: boolean
        default_quota_bytes:
          type: integer
          format: int64

    # ─────────────────────────────────────────────────────────────
    # Mailbox
    # ─────────────────────────────────────────────────────────────
    Mailbox:
      type: object
      required: [id, domain_id, local_part, address, display_name, quota_bytes, quota_used_bytes, active, created_at, updated_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        local_part:
          type: string
        address:
          type: string
          format: email
        display_name:
          type: string
        quota_bytes:
          type: integer
          format: int64
        quota_used_bytes:
          type: integer
          format: int64
        active:
          type: boolean
        last_login_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateMailboxRequest:
      type: object
      required: [address, password]
      properties:
        address:
          type: string
          format: email
        password:
          type: string
          format: password
        display_name:
          type: string
        quota_bytes:
          type: integer
          format: int64

    UpdateMailboxRequest:
      type: object
      properties:
        password:
          type: string
          format: password
        display_name:
          type: string
        quota_bytes:
          type: integer
          format: int64
        active:
          type: boolean

    # ─────────────────────────────────────────────────────────────
    # Alias
    # ─────────────────────────────────────────────────────────────
    Alias:
      type: object
      required: [id, domain_id, source_address, destination_address, active, created_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        source_address:
          type: string
          format: email
        destination_address:
          type: string
          format: email
        active:
          type: boolean
        created_at:
          type: string
          format: date-time

    CreateAliasRequest:
      type: object
      required: [source_address, destination_address]
      properties:
        source_address:
          type: string
          format: email
        destination_address:
          type: string
          format: email

    UpdateAliasRequest:
      type: object
      properties:
        destination_address:
          type: string
          format: email
        active:
          type: boolean

    # ─────────────────────────────────────────────────────────────
    # WebmailAccount
    # ─────────────────────────────────────────────────────────────
    WebmailAccount:
      type: object
      required: [id, primary_mailbox_id, is_admin, created_at, updated_at]
      properties:
        id:
          type: integer
        primary_mailbox_id:
          type: integer
        is_admin:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ─────────────────────────────────────────────────────────────
    # Pipeline
    # ─────────────────────────────────────────────────────────────
    Pipeline:
      type: object
      required: [id, domain_id, direction, filters, active, created_at, updated_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        direction:
          type: string
          enum: [inbound, outbound]
        filters:
          description: Ordered array of filter configurations
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              config:
                type: object
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreatePipelineRequest:
      type: object
      required: [domain_id, direction, filters]
      properties:
        domain_id:
          type: integer
        direction:
          type: string
          enum: [inbound, outbound]
        filters:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              config:
                type: object
        active:
          type: boolean
          default: true

    UpdatePipelineRequest:
      type: object
      properties:
        filters:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              config:
                type: object
        active:
          type: boolean

    TestPipelineRequest:
      type: object
      required: [pipeline_id, email]
      properties:
        pipeline_id:
          type: integer
        email:
          type: object
          description: Sample email JSON for testing

    TestFilterRequest:
      type: object
      required: [filter_name, config, email]
      properties:
        filter_name:
          type: string
        config:
          type: object
        email:
          type: object
          description: Sample email JSON for testing

    ExecutionResult:
      type: object
      required: [final_action, steps, duration_ms]
      properties:
        final_action:
          type: string
          enum: [continue, reject, quarantine, discard]
        steps:
          type: array
          items:
            type: object
        duration_ms:
          type: integer
          format: int64
        final_email:
          type: object
          description: The email after all transformations

    FilterResult:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [continue, reject, quarantine, discard]
        email:
          type: object
          description: The email after filter transformation
        metadata:
          type: object

    # ─────────────────────────────────────────────────────────────
    # Custom Filter
    # ─────────────────────────────────────────────────────────────
    CustomFilter:
      type: object
      required: [id, domain_id, name, filter_type, direction, config, enabled, created_at, updated_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        name:
          type: string
        description:
          type: string
        filter_type:
          type: string
          enum: [action, transform]
        direction:
          type: string
          enum: [inbound, outbound, both]
        config:
          type: object
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateCustomFilterRequest:
      type: object
      required: [domain_id, name, filter_type, direction, config]
      properties:
        domain_id:
          type: integer
        name:
          type: string
        description:
          type: string
        filter_type:
          type: string
          enum: [action, transform]
        direction:
          type: string
          enum: [inbound, outbound, both]
        config:
          type: object
        enabled:
          type: boolean
          default: true

    # ─────────────────────────────────────────────────────────────
    # Outbound Queue
    # ─────────────────────────────────────────────────────────────
    OutboundQueue:
      type: object
      required: [id, sender, recipient, domain, status, attempts, next_attempt, max_retries, created_at, expires_at]
      properties:
        id:
          type: integer
        message_id:
          type: [integer, "null"]
        sender:
          type: string
        recipient:
          type: string
        domain:
          type: string
        status:
          type: string
          enum: [pending, delivering, deferred, delivered, bounced, expired]
        attempts:
          type: integer
        last_attempt:
          type: [string, "null"]
          format: date-time
        next_attempt:
          type: string
          format: date-time
        last_error:
          type: string
        last_error_code:
          type: integer
        max_retries:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    QueueStats:
      type: object
      required: [pending, deferred, delivered, bounced, total]
      properties:
        pending:
          type: integer
        deferred:
          type: integer
        delivered:
          type: integer
        bounced:
          type: integer
        total:
          type: integer

    BulkQueueRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
        filter:
          type: object
          description: Filter criteria to select entries (alternative to ids)
          properties:
            status:
              type: string
            domain:
              type: string
            sender:
              type: string
            recipient:
              type: string

    BulkQueueResponse:
      type: object
      required: [affected]
      properties:
        affected:
          type: integer

    # ─────────────────────────────────────────────────────────────
    # Sender Rules
    # ─────────────────────────────────────────────────────────────
    DomainSenderRule:
      type: object
      required: [id, domain_id, pattern, list_type, created_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        pattern:
          type: string
          description: Email address or @domain pattern
        list_type:
          type: string
          enum: [allow, block]
        reason:
          type: string
        created_by:
          type: [integer, "null"]
        created_at:
          type: string
          format: date-time

    CreateSenderRuleRequest:
      type: object
      required: [pattern]
      properties:
        pattern:
          type: string
          description: "Email address (spam@evil.com) or domain pattern (@evil.com)"
        reason:
          type: string

    # ─────────────────────────────────────────────────────────────
    # DKIM
    # ─────────────────────────────────────────────────────────────
    DKIMEntry:
      type: object
      required: [domain_id, domain, selector, has_key]
      properties:
        domain_id:
          type: integer
        domain:
          type: string
        selector:
          type: string
        has_key:
          type: boolean

    SetDKIMKeyRequest:
      type: object
      required: [selector, private_key]
      properties:
        selector:
          type: string
        private_key:
          type: string
          description: PEM-encoded RSA private key

    # ─────────────────────────────────────────────────────────────
    # Certificate
    # ─────────────────────────────────────────────────────────────
    Certificate:
      type: object
      required: [id, domain_id, issuer, not_before, not_after, auto_renew, created_at, updated_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        issuer:
          type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        auto_renew:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CertificateDetail:
      allOf:
        - $ref: "#/components/schemas/Certificate"
        - type: object
          required: [cert_pem]
          properties:
            cert_pem:
              type: string
              description: PEM-encoded certificate

    CreateCertificateRequest:
      type: object
      required: [domain_id, cert_pem, key_pem]
      properties:
        domain_id:
          type: integer
        cert_pem:
          type: string
          description: PEM-encoded certificate
        key_pem:
          type: string
          description: PEM-encoded private key
        auto_renew:
          type: boolean

    # ─────────────────────────────────────────────────────────────
    # Ban
    # ─────────────────────────────────────────────────────────────
    Ban:
      type: object
      required: [id, ip, reason, protocol, created_by, created_at]
      properties:
        id:
          type: integer
        ip:
          type: string
        reason:
          type: string
        protocol:
          type: string
          enum: [smtp, imap, pop3, all]
        created_by:
          type: string
        expires_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateBanRequest:
      type: object
      required: [ip, protocol, created_by]
      properties:
        ip:
          type: string
        reason:
          type: string
        protocol:
          type: string
          enum: [smtp, imap, pop3, all]
        duration:
          type: string
          description: Duration string (e.g. "24h", "7d"), omit for permanent
        created_by:
          type: string

    # ─────────────────────────────────────────────────────────────
    # Activity Log
    # ─────────────────────────────────────────────────────────────
    ActivityLog:
      type: object
      required: [id, actor, action, resource_type, created_at]
      properties:
        id:
          type: integer
        actor:
          type: string
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: [integer, "null"]
        detail:
          type: string
        metadata:
          type: [object, "null"]
        ip:
          type: string
        created_at:
          type: string
          format: date-time

    # ─────────────────────────────────────────────────────────────
    # Generic helpers
    # ─────────────────────────────────────────────────────────────
    StatusResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              example: reset_complete

    # ─────────────────────────────────────────────────────────────
    # Calendar
    # ─────────────────────────────────────────────────────────────
    CalendarEventSummary:
      type: object
      required: [uid, method, status, summary, sequence, is_cancelled, versions]
      properties:
        uid:
          type: string
        method:
          type: string
          description: iCalendar METHOD (REQUEST, REPLY, CANCEL, ...)
        status:
          type: string
        summary:
          type: string
        sequence:
          type: integer
        is_cancelled:
          type: boolean
        message_id:
          type: [integer, "null"]
        versions:
          type: integer
          description: Number of stored versions for this UID

    # ─────────────────────────────────────────────────────────────
    # Admin: Dashboard stats
    # ─────────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [domainCount, mailboxCount, queueStats, messageVolume, recentActivity, inboundTransportSecurity]
      properties:
        domainCount:
          type: integer
        mailboxCount:
          type: integer
        queueStats:
          type: object
          required: [pending, processing, failed]
          properties:
            pending:
              type: integer
            processing:
              type: integer
            failed:
              type: integer
        messageVolume:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                example: Jul 23
              count:
                type: integer
        recentActivity:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
              description:
                type: string
              timestamp:
                type: string
                format: date-time
        inboundTransportSecurity:
          type: object
          properties:
            totalInboundMX:
              type: integer
            overTLS:
              type: integer
            plaintext:
              type: integer
            tlsPercent:
              type: number
            plaintextPercent:
              type: number
            plaintextAuthPass:
              type: integer
            plaintextAuthFail:
              type: integer

    # ─────────────────────────────────────────────────────────────
    # Admin: Users, roles, capabilities
    # ─────────────────────────────────────────────────────────────
    AdminUser:
      type: object
      required: [id, username, active, password_change_required, created_at, updated_at]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: [string, "null"]
        active:
          type: boolean
        password_change_required:
          type: boolean
        last_password_change:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    Role:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        system_role:
          type: boolean

    Capability:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
          example: domains:read
        description:
          type: string
        resource:
          type: string
          example: domains
        action:
          type: string
          example: read

    CreateAdminUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        email:
          type: [string, "null"]
        password:
          type: string
        role_ids:
          type: array
          items:
            type: integer

    UpdateAdminUserRequest:
      type: object
      properties:
        email:
          type: [string, "null"]
        password:
          type: string
        active:
          type: boolean
        password_change_required:
          type: boolean
        role_ids:
          type: array
          items:
            type: integer

    # ─────────────────────────────────────────────────────────────
    # Admin: DNS check
    # ─────────────────────────────────────────────────────────────
    DNSCheckResult:
      type: object
      required: [domain, records, summary]
      properties:
        domain:
          type: string
        summary:
          type: string
          example: 4/5 records verified
        records:
          type: array
          items:
            type: object
            required: [type, name, status]
            properties:
              type:
                type: string
                example: MX
              name:
                type: string
              status:
                type: string
                enum: [ok, missing, error]
              value:
                type: string
              message:
                type: string

    # ─────────────────────────────────────────────────────────────
    # Admin: MTA-STS
    # ─────────────────────────────────────────────────────────────
    MTASTSPolicy:
      type: object
      required: [id, domain_id, mode, max_age, active]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        mode:
          type: string
          enum: [none, testing, enforce]
        mx_hosts:
          type: string
          description: Comma-separated MX host patterns
        max_age:
          type: integer
          description: Policy lifetime in seconds
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SetMTASTSPolicyRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [none, testing, enforce]
        mx_hosts:
          type: string
          description: Comma-separated MX host patterns
        max_age:
          type: integer
          minimum: 0
        active:
          type: boolean

    # ─────────────────────────────────────────────────────────────
    # Admin: TLS-RPT
    # ─────────────────────────────────────────────────────────────
    TLSReport:
      type: object
      required: [id, domain_id, reporting_org, start_date, end_date, policy_type, policy_domain, received_at]
      properties:
        id:
          type: integer
        domain_id:
          type: integer
        reporting_org:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        policy_type:
          type: string
          enum: [sts, tlsa, no-policy]
        policy_domain:
          type: string
        total_successful:
          type: integer
          format: int64
        total_failure:
          type: integer
          format: int64
        failure_details:
          description: Raw failure-details JSON from the report
          oneOf:
            - type: object
            - type: array
            - type: "null"
        raw_report:
          type: string
        received_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    TLSRPTReport:
      type: object
      description: Inbound TLS-RPT report (RFC 8460 §4)
      required: [organization-name, date-range, policies]
      properties:
        organization-name:
          type: string
        contact-info:
          type: string
        report-id:
          type: string
        date-range:
          type: object
          required: [start-datetime, end-datetime]
          properties:
            start-datetime:
              type: string
              format: date-time
            end-datetime:
              type: string
              format: date-time
        policies:
          type: array
          items:
            type: object
            properties:
              policy:
                type: object
                properties:
                  policy-type:
                    type: string
                  policy-string:
                    type: array
                    items:
                      type: string
                  policy-domain:
                    type: string
                  mx-host:
                    type: array
                    items:
                      type: string
              summary:
                type: object
                properties:
                  total-successful-session-count:
                    type: integer
                    format: int64
                  total-failure-session-count:
                    type: integer
                    format: int64
              failure-details:
                type: array
                items:
                  type: object
                  additionalProperties: true

    # ─────────────────────────────────────────────────────────────
    # Admin: Observability (traces + analytics)
    # ─────────────────────────────────────────────────────────────
    MessageTrace:
      type: object
      required: [id, direction, transport, pipeline_id, final_action, outcome, duration_ms, sampled, created_at]
      properties:
        id:
          type: integer
        message_id:
          type: [integer, "null"]
          description: Set only on the delivered/queued path; null otherwise
        rfc_message_id:
          type: string
          description: RFC 5322 Message-ID correlation key
        direction:
          type: string
          enum: [inbound, outbound]
        transport:
          type: string
          enum: ["", tls, plaintext]
          description: Empty when transport is not applicable
        mail_from:
          type: string
        rcpt_to:
          type: string
          description: First envelope recipient
        client_ip:
          type: string
        pipeline_id:
          type: integer
        final_action:
          type: string
          enum: [continue, reject, quarantine, discard, defer]
        outcome:
          type: string
          enum: [delivered, queued, rejected, quarantined, discarded, deferred]
        reason_code:
          type: string
          description: Bounded reason for a non-continue terminal; empty otherwise
        spam_score:
          type: [number, "null"]
        duration_ms:
          type: integer
          format: int64
        stages:
          description: Serialized []StepResult timeline
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: "null"
        sampled:
          type: boolean
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time

    PipelineFunnel:
      type: object
      properties:
        received:
          type: array
          items:
            type: object
            properties:
              transport:
                type: string
              count:
                type: number
        auth_verdicts:
          type: array
          items:
            type: object
            properties:
              mechanism:
                type: string
              result:
                type: string
              count:
                type: number
        stage_decisions:
          type: array
          items:
            type: object
            properties:
              filter:
                type: string
              action:
                type: string
              count:
                type: number
        terminal_outcomes:
          type: array
          items:
            type: object
            properties:
              direction:
                type: string
              outcome:
                type: string
              count:
                type: number
        top_reject_reasons:
          type: array
          items:
            type: object
            properties:
              reason_code:
                type: string
              count:
                type: number

    PipelineAnalyticsResponse:
      type: object
      required: [window, funnel]
      properties:
        window:
          type: object
          required: [since, until]
          properties:
            since:
              type: string
              format: date-time
            until:
              type: string
              format: date-time
            label:
              type: string
              description: Echoes the ?window value; empty when ?since was used
        funnel:
          $ref: "#/components/schemas/PipelineFunnel"
        live_totals:
          allOf:
            - $ref: "#/components/schemas/PipelineFunnel"
          description: >-
            Cumulative-since-process-start snapshot from the in-process registry
            (NOT windowed); absent if the registry could not be gathered.

    # ─────────────────────────────────────────────────────────────
    # Admin: Custom filters (update)
    # ─────────────────────────────────────────────────────────────
    UpdateCustomFilterRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        filter_type:
          type: string
        direction:
          type: string
          enum: [inbound, outbound]
        config:
          type: object
          description: Filter configuration (opaque JSON)
        enabled:
          type: boolean
