# Logical mail instance: mail4.test (generated by `task instance:scaffold`).
# Edit freely, then re-run `task instance:render INSTANCE=mail4.test`.

# ── envelope: logical, implementation-agnostic ──────────────────────────
domain:     mail4.test
hostname:   mail4.test
proxy_host: mail4.localhost

# ── substrate placement (testbed) ───────────────────────────────────────
project:        rest-mail-mail4
network:        testbed_mailnet
certs_volume:   testbed_certs
testbed_dns_ip: 10.99.0.10
dns_provider:   testbed-dnsmasq
cert_provider:  testbed-certgen

# ── image source ────────────────────────────────────────────────────────
registry:  ghcr.io/rest-mail
image_tag: dev

# ── runtime ─────────────────────────────────────────────────────────────
log_level:    debug
environment:  development
mailnet_only: true    # secondary instance — reachable on the mailnet only, no
                      # host-port publishing, so it can run beside the primary
internal_mtls: true   # secure-by-default for NEW instances: gateways authenticate
                      # to the API over mutual TLS. `task instance:new` provisions
                      # the certs (instance:mtls:issue) automatically. A bare binary
                      # stays off (compiled-in INTERNAL_MTLS_ENABLED=false), so
                      # non-provisioned/upgraded deployments are unaffected.

db:
  name: restmail
  user: restmail

# ── additional served domains (optional) ────────────────────────────────
# This instance serves the primary `domain` above. To serve MORE domains from
# the same stack, declare them here — each gets its own DB row, DKIM
# selector/key, and DNS records provisioned at instance-up (`task instance:new`).
# The primary is NOT repeated here. Uncomment and edit:
#
# domains:
#   - name: example.test
#     server_type: restmail      # or: traditional
#     dkim: { selector: default, bits: 2048 }

# ── public TLS (optional) ───────────────────────────────────────────────
# The serving cert is issued by `task instance:certs:issue` per `cert_provider` above.
# It automatically covers every served domain's mail hostname; add MORE SANs
# (autoconfig, mta-sts, a vanity host) with extra_hostnames. cert_provider:
#   testbed-certgen  (default) issue via the testbed reference-certgen
#   manual                     drop <hostname>.{crt,key} into the certs volume yourself
#   letsencrypt / acme         declare acme: below (ACME client not yet implemented)
# Uncomment and edit:
#
# tls:
#   extra_hostnames: [autoconfig.mail4.test, mta-sts.mail4.test]
#   acme:
#     enabled: true
#     email:   hostmaster@mail4.test
#     staging: true              # flip to false for production issuance

# ── binding: components on the substrate (IPs allocated at scaffold time) ─
components:
  - { name: postgres, ip: 10.99.0.50 }
  - name: api
    ip: 10.99.0.51
    port: 8080
  - name: smtp-gateway
    ip: 10.99.0.52
    ports: { inbound: 25, submission: 587, submission_tls: 465 }
  - name: imap-gateway
    ip: 10.99.0.53
    ports: { plain: 143, tls: 993 }
  - name: pop3-gateway
    ip: 10.99.0.54
    ports: { plain: 110, tls: 995 }
  - { name: js-filter, ip: 10.99.0.55 }
  - { name: webmail,   ip: 10.99.0.56 }
  - { name: admin,     ip: 10.99.0.57 }
