groups:
  - name: restmail-alerts
    rules:
      # Queue backlog is too large
      - alert: QueueBacklogHigh
        expr: restmail_queue_size > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queue backlog exceeds 1000 messages"
          description: "The outbound queue has {{ $value }} messages pending for more than 5 minutes."

      # Certificate approaching expiry
      - alert: CertificateExpiringSoon
        expr: restmail_cert_expiry_days < 7
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Certificate for {{ $labels.domain }} expires in {{ $value }} days"
          description: "The TLS certificate for domain {{ $labels.domain }} will expire in less than 7 days. Renew immediately."

      # A domain served here has no usable certificate, so its handshakes are
      # refused. Mail for that domain is not being accepted.
      - alert: DomainCertificateMissing
        expr: increase(restmail_tls_cert_missing_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Handshakes refused: a domain served here has no usable certificate"
          description: "{{ $value }} handshakes in the last 10 minutes were refused because the domain asked for is served here but has no usable certificate (none stored, expired, or the stored pair will not load). Mail for it is being turned away. The gateway logs name the domain."

      # High authentication failure rate
      - alert: AuthFailureRateHigh
        expr: rate(restmail_auth_failures_total[5m]) * 300 > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High authentication failure rate on {{ $labels.protocol }}"
          description: "More than 100 authentication failures in the last 5 minutes on protocol {{ $labels.protocol }}. Possible brute-force attempt."

      # HTTP error rate above 5%
      - alert: HTTPErrorRateHigh
        expr: >
          sum(rate(restmail_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(restmail_http_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx error rate exceeds 5%"
          description: "The API server is returning server errors at a rate of {{ $value | humanizePercentage }}."

      # API response time too slow (p95 > 2s)
      - alert: APIResponseTimeSlow
        expr: >
          histogram_quantile(0.95, sum(rate(restmail_http_request_duration_seconds_bucket[5m])) by (le))
          > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p95 response time exceeds 2 seconds"
          description: "The 95th percentile API response time is {{ $value }}s, which is above the 2s threshold."

      # Queue error rate spike
      - alert: QueueErrorRateHigh
        expr: rate(restmail_queue_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queue processing error rate is elevated"
          description: "Queue errors are occurring at {{ $value }} per second."

      # No messages processed (possible queue worker failure)
      - alert: QueueWorkerStalled
        expr: >
          rate(restmail_queue_processed_total[15m]) == 0
          and
          restmail_queue_size > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Queue workers appear stalled"
          description: "No messages have been processed in the last 15 minutes despite {{ $value }} messages in the queue."

      # DNSBL (issue #148): only when the operator has enabled the monitor.
      # Reputation: a blocklist's last answer listed one of our sending IPs.
      - alert: DNSBLSendingIPListed
        expr: restmail_dnsbl_listed == 1
        labels:
          severity: critical
        annotations:
          summary: "Sending IP {{ $labels.ip }} is listed by {{ $labels.provider }}"
          description: "The last answer from DNSBL provider {{ $labels.provider }} listed {{ $labels.ip }}. Mail sent from it may be refused. The API log line 'dnsbl: sending IP listed' carries the codes and reason."

      # Operational, not reputation: a blocklist is not answering. The listing
      # value is left as it was, so a listing is never cleared by errors.
      - alert: DNSBLProviderNotAnswering
        expr: sum by (provider) (increase(restmail_dnsbl_checks_total{status=~"provider_error|indeterminate"}[3h])) > 0 and sum by (provider) (increase(restmail_dnsbl_checks_total{status=~"listed|not_listed"}[3h])) == 0
        labels:
          severity: warning
        annotations:
          summary: "DNSBL provider {{ $labels.provider }} has not answered for 3 hours"
          description: "Every check against {{ $labels.provider }} in the last 3 hours failed (provider_error or indeterminate). The listing state for it is stale, not clean. Check the zone, its answer codes and the resolver."

      # The last real answer for an IP and provider is old: the listing value
      # is stale. Tune 6h to a few times the configured interval.
      - alert: DNSBLAnswerStale
        expr: time() - restmail_dnsbl_last_answer_timestamp_seconds > 6 * 3600
        labels:
          severity: warning
        annotations:
          summary: "No DNSBL answer for {{ $labels.ip }} from {{ $labels.provider }} in 6 hours"
          description: "restmail_dnsbl_listed for this pair reflects an answer more than 6 hours old."
