server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (applied to every response) ─────────────────────
    # Same-origin SPA: it loads only its own bundle and talks only to the
    # same-origin API. #257 moved auth to same-origin httpOnly cookies, so
    # connect-src 'self' covers every fetch/XHR. Scripts stay strict ('self', no
    # unsafe-inline/unsafe-eval); 'unsafe-inline' is granted for styles only,
    # which React inline style attributes and recharts' runtime-injected styles
    # require and which cannot be nonced. Fonts are self-hosted (font-src
    # 'self'). The admin UI embeds no frames.
    #
    # These sit at server level and are inherited by the locations below, which
    # is only safe because NO location sets add_header — a single add_header in a
    # location drops every inherited one for that location. Cache-Control lives
    # here for that reason, rather than in the SPA location where it used to be.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control "no-cache" always;

    # Serve the SPA under the configured base path.
    # __BASE_PATH__ is replaced at container start by docker-entrypoint.sh.
    # ^~ prevents regex locations from overriding this prefix match.
    # alias strips the location prefix when resolving files, so
    # /admin/assets/x.js resolves to /usr/share/nginx/html/assets/x.js.
    location ^~ __BASE_PATH__ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ __BASE_PATH__index.html;
    }

    # Redirect base path without trailing slash to add it
    location = __BASE_PATH_NOSLASH__ {
        return 301 __BASE_PATH__;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
