server {
    listen 80;

    location /admin {
        alias /usr/share/nginx/html/admin;
        try_files $uri $uri/ /admin/index.html;

        add_header Cache-Control "no-cache" always;

        # ── Security headers ─────────────────────────────────────────────
        # Same-origin SPA: it loads only its own bundle and talks only to the
        # same-origin API. #257 moved auth to same-origin httpOnly cookies, so
        # connect-src 'self' covers every fetch/XHR. Scripts stay strict
        # ('self', no unsafe-inline/unsafe-eval); 'unsafe-inline' is granted for
        # styles only, which React inline style attributes and recharts'
        # runtime-injected styles require and which cannot be nonced. Fonts are
        # self-hosted (font-src 'self'). The admin UI embeds no frames.
        # NOTE: all headers live in this location block because add_header in a
        # location drops server-level add_header inheritance for that location.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }
}
