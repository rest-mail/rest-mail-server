# Releases `restmail`, the command-line tool for running a rest-mail server,
# on every SemVer tag (v1.2.3): binaries for macOS and Linux on Intel and ARM,
# and a GitHub Release with checksums and a build-provenance attestation.
#
# It publishes to no Homebrew tap. antimatter-studios/homebrew-tap PULLS:
# a person runs its sync, which reads this project's public releases, computes
# each asset's own sha256 and checks the attestation, then writes a branch for
# a person to open and merge. So no token here can change what `brew install`
# gives anybody, which is the point — a pipeline that could push a formula is
# a pipeline that could push a hacked binary.
#
#   brew install antimatter-studios/tap/restmail
#
# The same tag releases the server images (docker.yml): one version for
# everything built from a commit, so the CLI and the server it talks to cannot
# drift. Pull requests touching it run a snapshot build
# (.github/workflows/release-cli.yml), so a broken config fails there, not at
# tag time.
version: 2
project_name: restmail

builds:
  - id: restmail
    main: ./cmd/console
    binary: restmail
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# Linux packages, so a server's own host installs the CLI the way it installs
# anything else: `sudo dpkg -i restmail_<version>_linux_arm64.deb`, or rpm.
nfpms:
  - id: restmail
    package_name: restmail
    ids: [restmail]
    formats: [deb, rpm]
    vendor: rest-mail
    homepage: https://github.com/rest-mail/rest-mail-server
    maintainer: rest-mail <noreply@rest-mail.com>
    description: Command-line tool for running a rest-mail server (restmail setup, restmail reset-admin).
    license: MIT
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    bindir: /usr/bin

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    include:
      - "(?i)(cli|console|restmail setup|reset-admin)"

release:
  github:
    owner: rest-mail
    name: rest-mail-server
  name_template: "restmail {{ .Version }}"

