version: "3"

# rest-mail/tasks/imap-gateway — Taskfile fragment
#
# Drives the IMAP gateway container via plain `docker run` (no compose).
# Included by the main Taskfile under namespace `imap-gateway`.
#
# Joins the testbed's mailnet network at a static IP, uses the testbed's
# dnsmasq for DNS, and mounts a volume of its own holding only its
# certificates (stage-certs.sh). It runs as uid 10001.
# In dev mode (default) the source tree is bind-mounted for air hot reload.
#
# The 993 (imaps) port is published via docker-proxy labels rather than a
# host -p mapping; only 143 is exposed directly on the host.
#
# Output is friendly by default. Re-run with VERBOSE=1 to see the raw
# docker / shell output (e.g. VERBOSE=1 chore imap-gateway:up).

silent: true

vars:
  IMAP_GATEWAY_PROJECT: '{{.IMAP_GATEWAY_PROJECT | default "rest-mail"}}'
  IMAP_GATEWAY_NETWORK: '{{.IMAP_GATEWAY_NETWORK | default "testbed_mailnet"}}'
  # Where certificates are issued: the testbed's volume, which also holds its CA
  # key, and the internal mTLS volume, which holds the internal CA's. The gateway
  # mounts neither (#193); `up` copies what it needs into IMAP_GATEWAY_OWN_CERTS_VOLUME.
  IMAP_GATEWAY_CERTS_VOLUME: '{{.IMAP_GATEWAY_CERTS_VOLUME | default "testbed_certs"}}'
  IMAP_GATEWAY_INTERNAL_MTLS_VOLUME: '{{.IMAP_GATEWAY_INTERNAL_MTLS_VOLUME | default "rest-mail-internal-mtls"}}'
  IMAP_GATEWAY_DNS_IP: '{{.IMAP_GATEWAY_DNS_IP | default "10.99.0.10"}}'
  IMAP_GATEWAY_IP: '{{.IMAP_GATEWAY_IP | default "10.99.0.15"}}'
  IMAP_GATEWAY_RESTMAIL_HOSTNAME: '{{.IMAP_GATEWAY_RESTMAIL_HOSTNAME | default "restmail.test"}}'
  IMAP_GATEWAY_MODE: '{{.IMAP_GATEWAY_MODE | default "dev"}}'
  IMAP_GATEWAY_IMAGE_TAG: '{{.IMAP_GATEWAY_IMAGE_TAG | default "dev"}}'
  IMAP_GATEWAY_REGISTRY: '{{.IMAP_GATEWAY_REGISTRY | default "ghcr.io/rest-mail"}}'
  IMAP_GATEWAY_IMAGE: '{{.IMAP_GATEWAY_REGISTRY}}/imap-gateway:{{.IMAP_GATEWAY_IMAGE_TAG}}'
  IMAP_GATEWAY_CONTAINER_NAME: '{{.IMAP_GATEWAY_PROJECT}}-imap-gateway'
  IMAP_GATEWAY_LOGS_VOLUME: '{{.IMAP_GATEWAY_PROJECT}}-gateway-logs'
  IMAP_GATEWAY_OWN_CERTS_VOLUME: '{{.IMAP_GATEWAY_CONTAINER_NAME}}-certs'
  IMAP_GATEWAY_API_BASE_URL: '{{.IMAP_GATEWAY_API_BASE_URL | default (printf "http://%s-api:8080" .IMAP_GATEWAY_PROJECT)}}'
  IMAP_GATEWAY_DB_HOST: '{{.IMAP_GATEWAY_DB_HOST | default (printf "%s-postgres" .IMAP_GATEWAY_PROJECT)}}'
  IMAP_GATEWAY_DB_PORT: '{{.IMAP_GATEWAY_DB_PORT | default "5432"}}'
  IMAP_GATEWAY_DB_NAME: '{{.IMAP_GATEWAY_DB_NAME | default "restmail"}}'
  IMAP_GATEWAY_DB_USER: '{{.IMAP_GATEWAY_DB_USER | default "restmail"}}'
  IMAP_GATEWAY_DB_PASS: '{{.IMAP_GATEWAY_DB_PASS | default "restmail"}}'
  IMAP_GATEWAY_TLS_CERT_PATH: '{{.IMAP_GATEWAY_TLS_CERT_PATH | default "/certs/restmail.test.crt"}}'
  IMAP_GATEWAY_TLS_KEY_PATH: '{{.IMAP_GATEWAY_TLS_KEY_PATH | default "/certs/restmail.test.key"}}'
  IMAP_GATEWAY_TLS_PORT: '{{.IMAP_GATEWAY_TLS_PORT | default "993"}}'
  IMAP_GATEWAY_LOG_LEVEL: '{{.IMAP_GATEWAY_LOG_LEVEL | default "debug"}}'
  IMAP_GATEWAY_ENVIRONMENT: '{{.IMAP_GATEWAY_ENVIRONMENT | default "development"}}'
  IMAP_GATEWAY_MAILNET_ONLY: '{{.IMAP_GATEWAY_MAILNET_ONLY | default "false"}}'
  IMAP_GATEWAY_PROXY_HOST: '{{.IMAP_GATEWAY_PROXY_HOST | default "restmail.localhost"}}'
  # Internal mTLS (gateway → API). Off by default; when "true" the gateway
  # presents /certs/internal-client.* on the two machine routes and sends them
  # to IMAP_GATEWAY_API_INTERNAL_BASE_URL (the API's https internal listener);
  # all other routes keep using IMAP_GATEWAY_API_BASE_URL (public).
  IMAP_GATEWAY_INTERNAL_MTLS: '{{.IMAP_GATEWAY_INTERNAL_MTLS | default "false"}}'
  IMAP_GATEWAY_API_INTERNAL_BASE_URL: '{{.IMAP_GATEWAY_API_INTERNAL_BASE_URL | default ""}}'

tasks:

  # ════════════════════════════════════════════════════════
  # build / up / down / restart
  # ════════════════════════════════════════════════════════

  build:
    desc: Build the imap-gateway image (target controlled by MODE — dev|prod)
    cmds:
      - |
        echo "  building {{.IMAP_GATEWAY_IMAGE}} (target={{.IMAP_GATEWAY_MODE}})"
        docker build -t {{.IMAP_GATEWAY_IMAGE}} --target {{.IMAP_GATEWAY_MODE}} -f projects/imap-gateway/Dockerfile . >$OUTPUT 2>&1

  up:
    desc: Start (or recreate) the imap-gateway container
    deps: [build]
    cmds:
      - |
        if docker volume inspect {{.IMAP_GATEWAY_LOGS_VOLUME}} >/dev/null 2>&1; then
          [ -n "$VERBOSE" ] && echo "  volume {{.IMAP_GATEWAY_LOGS_VOLUME}} already exists" || true
        else
          echo "  creating volume {{.IMAP_GATEWAY_LOGS_VOLUME}}"
          docker volume create {{.IMAP_GATEWAY_LOGS_VOLUME}} >$OUTPUT 2>&1
        fi
      - |
        echo "  starting imap-gateway ({{.IMAP_GATEWAY_CONTAINER_NAME}} @ {{.IMAP_GATEWAY_IP}}, mode={{.IMAP_GATEWAY_MODE}})"
        DEV_FLAGS=""
        # Air executes /app/tmp binaries; Go needs executable build/temp space.
        # Keep GOPATH (including sumdb state) and caches in bounded /tmp. Use
        # the image's preloaded modules as a read-only proxy before the network.
        if [ "{{.IMAP_GATEWAY_MODE}}" = "dev" ]; then
          DEV_FLAGS="--read-only -v $(pwd):/app \
            --tmpfs /app/tmp:rw,exec,nosuid,nodev,size=128m,mode=0700,uid=10001,gid=10001 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=1g,mode=1777 \
            -e GOPATH=/tmp/go -e GOMODCACHE=/tmp/go/pkg/mod \
            -e GOCACHE=/tmp/go-build-cache \
            -e GOPROXY=file:///go/pkg/mod/cache/download,https://proxy.golang.org,direct"
        fi
        docker rm -f {{.IMAP_GATEWAY_CONTAINER_NAME}} >$OUTPUT 2>&1 || true
        # mailnet_only secondary instances skip host-port publishing.
        # Nothing to publish: 993 reaches the host through the reverse proxy (see the
        # docker-proxy.imaps.* labels below), and there is no cleartext 143 any more.
        PUBLISH=""
        PROXY=""
        # Container hardening (OSI-17, #193): runs as uid 10001, the image's user,
        # with no privilege escalation and every Linux capability dropped, plus
        # pid/mem/cpu ceilings. It binds 993 without NET_BIND_SERVICE because
        # the sysctl below lets any user bind any port in the container's own
        # network namespace (Docker's default too; said here so it is not assumed).
        # Dev uses a read-only rootfs; Air and Go write only to bounded tmpfs
        # mounts (in addition to the existing source and data mounts).
        HARDENING="--security-opt no-new-privileges:true \
          --user 10001:10001 --cap-drop ALL \
          --sysctl net.ipv4.ip_unprivileged_port_start=0 \
          --pids-limit 512 --memory 1g --cpus 1.5"
        # Its certificates: its own keypair, the testbed CA certificate to trust
        # peers with and, with internal mTLS on, the internal CA certificate and the
        # gateways' client keypair. Copied into a volume of its own, owned by the
        # user it runs as, so it never mounts a CA key (#193).
        INTERNAL=""
        if [ "{{.IMAP_GATEWAY_INTERNAL_MTLS}}" = "true" ]; then
          INTERNAL="{{.IMAP_GATEWAY_INTERNAL_MTLS_VOLUME}}:internal-ca.crt,internal-client.crt,internal-client.key"
        fi
        "{{.TASKFILE_DIR}}/stage-certs.sh" {{.IMAP_GATEWAY_OWN_CERTS_VOLUME}} 10001:10001 \
          "{{.IMAP_GATEWAY_CERTS_VOLUME}}:$(basename {{.IMAP_GATEWAY_TLS_CERT_PATH}}),$(basename {{.IMAP_GATEWAY_TLS_KEY_PATH}}),ca.crt?" \
          $INTERNAL || exit 1
        # DB_PASS goes through a 0600 env-file rather than an -e flag, so it
        # never sits on the `docker run` command line (host process list, shell
        # history, CI logs). Removed once docker has read it.
        mkdir -p {{.ROOT_DIR}}/.cache
        SECRETS_ENV="{{.ROOT_DIR}}/.cache/{{.IMAP_GATEWAY_CONTAINER_NAME}}.secrets.env"
        trap 'rm -f "$SECRETS_ENV"' EXIT
        rm -f "$SECRETS_ENV"
        # Create empty, chmod 0600, THEN write the secret (Task's shell lacks umask).
        : > "$SECRETS_ENV"
        chmod 600 "$SECRETS_ENV"
        printf 'DB_PASS=%s\n' "{{.IMAP_GATEWAY_DB_PASS}}" > "$SECRETS_ENV"
        docker run -d --name {{.IMAP_GATEWAY_CONTAINER_NAME}} \
          $HARDENING \
          --hostname {{.IMAP_GATEWAY_RESTMAIL_HOSTNAME}} \
          --restart unless-stopped \
          --network {{.IMAP_GATEWAY_NETWORK}} \
          --ip {{.IMAP_GATEWAY_IP}} \
          --dns {{.IMAP_GATEWAY_DNS_IP}} \
          $PUBLISH $PROXY \
          -l docker-proxy.imaps.proto=tcp \
          -l docker-proxy.imaps.port={{.IMAP_GATEWAY_TLS_PORT}} \
          -l docker-proxy.imaps.host={{.IMAP_GATEWAY_PROXY_HOST}} \
          -l docker-proxy.imaps.ssl=true \
          -e GATEWAY_HOSTNAME={{.IMAP_GATEWAY_RESTMAIL_HOSTNAME}} \
          -e API_BASE_URL={{.IMAP_GATEWAY_API_BASE_URL}} \
          -e DB_HOST={{.IMAP_GATEWAY_DB_HOST}} \
          -e DB_PORT={{.IMAP_GATEWAY_DB_PORT}} \
          -e DB_NAME={{.IMAP_GATEWAY_DB_NAME}} \
          -e DB_USER={{.IMAP_GATEWAY_DB_USER}} \
          --env-file "$SECRETS_ENV" \
          -e TLS_CERT_PATH={{.IMAP_GATEWAY_TLS_CERT_PATH}} \
          -e TLS_KEY_PATH={{.IMAP_GATEWAY_TLS_KEY_PATH}} \
          -e IMAP_TLS_PORT={{.IMAP_GATEWAY_TLS_PORT}} \
          -e LOG_LEVEL={{.IMAP_GATEWAY_LOG_LEVEL}} \
          -e ENVIRONMENT={{.IMAP_GATEWAY_ENVIRONMENT}} \
          -e INTERNAL_MTLS_ENABLED={{.IMAP_GATEWAY_INTERNAL_MTLS}} \
          -e API_INTERNAL_BASE_URL={{.IMAP_GATEWAY_API_INTERNAL_BASE_URL}} \
          -e INTERNAL_MTLS_CA_CERT=/certs/internal-ca.crt \
          -e INTERNAL_MTLS_CLIENT_CERT=/certs/internal-client.crt \
          -e INTERNAL_MTLS_CLIENT_KEY=/certs/internal-client.key \
          -v {{.IMAP_GATEWAY_OWN_CERTS_VOLUME}}:/certs:ro \
          -v {{.IMAP_GATEWAY_LOGS_VOLUME}}:/var/log/restmail \
          $DEV_FLAGS \
          --health-cmd 'nc -z localhost {{.IMAP_GATEWAY_TLS_PORT}}' \
          --health-interval 10s \
          --health-timeout 5s \
          --health-retries 3 \
          {{.IMAP_GATEWAY_IMAGE}} >$OUTPUT 2>&1

  down:
    desc: Stop and remove the imap-gateway container (no-op if not running)
    cmds:
      - |
        if docker ps -aq --filter "name=^/{{.IMAP_GATEWAY_CONTAINER_NAME}}$" | grep -q .; then
          echo "  stopping {{.IMAP_GATEWAY_CONTAINER_NAME}}"
          docker rm -f {{.IMAP_GATEWAY_CONTAINER_NAME}} >$OUTPUT 2>&1
        else
          echo "  {{.IMAP_GATEWAY_CONTAINER_NAME}} not running"
        fi

  restart:
    desc: Recreate the imap-gateway container
    cmds:
      - task: down
      - task: up

  # ════════════════════════════════════════════════════════
  # Diagnostics
  # ════════════════════════════════════════════════════════

  logs:
    desc: Tail imap-gateway logs
    cmds:
      - docker logs -f --tail=100 {{.IMAP_GATEWAY_CONTAINER_NAME}}
