version: "3"

# rest-mail/tasks/monitoring — Taskfile
#
# Drives prometheus + grafana + postgres-exporter + node-exporter via plain
# `docker run` (no compose). Included by the main Taskfile under namespace
# `monitoring`.
#
# All four containers join the testbed's mailnet network at static IPs
# so they can scrape peers (and each other) by name. Prometheus and
# Grafana keep state in named volumes so containers can be recreated
# without losing data.
#
# Bind mounts use $(pwd) — paths are relative to the project root via
# the include `dir:` configured in the main Taskfile.
#
# Output is friendly by default. Re-run with VERBOSE=1 to see the raw
# docker / shell output (e.g. VERBOSE=1 chore monitoring:up).

silent: true

vars:
  MONITORING_PROJECT: '{{.MONITORING_PROJECT | default "rest-mail"}}'
  MONITORING_NETWORK: '{{.MONITORING_NETWORK | default "testbed_mailnet"}}'
  MONITORING_REGISTRY: '{{.MONITORING_REGISTRY | default "ghcr.io/rest-mail"}}'

  # prometheus
  PROMETHEUS_UPSTREAM_IMAGE: '{{.PROMETHEUS_UPSTREAM_IMAGE | default "prom/prometheus:v2.51.0"}}'
  PROMETHEUS_IMAGE: '{{.MONITORING_REGISTRY}}/prometheus:v2.51.0'
  PROMETHEUS_IP: '{{.PROMETHEUS_IP | default "10.99.0.30"}}'
  PROMETHEUS_PORT: '{{.PROMETHEUS_PORT | default "9090"}}'
  PROMETHEUS_DNS: '{{.PROMETHEUS_DNS | default "10.99.0.3"}}'
  PROMETHEUS_NAME: '{{.MONITORING_PROJECT}}-prometheus'
  PROMETHEUS_DATA_VOLUME: '{{.MONITORING_PROJECT}}-prometheus-data'

  # grafana
  GRAFANA_UPSTREAM_IMAGE: '{{.GRAFANA_UPSTREAM_IMAGE | default "grafana/grafana:10.4.1"}}'
  GRAFANA_IMAGE: '{{.MONITORING_REGISTRY}}/grafana:10.4.1'
  GRAFANA_IP: '{{.GRAFANA_IP | default "10.99.0.31"}}'
  GRAFANA_PORT: '{{.GRAFANA_PORT | default "3001"}}'
  GRAFANA_ADMIN_USER: '{{.GRAFANA_ADMIN_USER | default "admin"}}'
  # No hardcoded default: a Grafana admin password MUST be supplied via
  # GRAFANA_ADMIN_PASSWORD. grafana:up refuses to start without it (guard below),
  # so the stack can never come up on well-known credentials.
  GRAFANA_ADMIN_PASSWORD: '{{.GRAFANA_ADMIN_PASSWORD | default ""}}'
  GRAFANA_NAME: '{{.MONITORING_PROJECT}}-grafana'
  GRAFANA_DATA_VOLUME: '{{.MONITORING_PROJECT}}-grafana-data'

  # postgres-exporter
  POSTGRES_EXPORTER_UPSTREAM_IMAGE: '{{.POSTGRES_EXPORTER_UPSTREAM_IMAGE | default "prometheuscommunity/postgres-exporter:v0.15.0"}}'
  POSTGRES_EXPORTER_IMAGE: '{{.MONITORING_REGISTRY}}/postgres-exporter:v0.15.0'
  POSTGRES_EXPORTER_IP: '{{.POSTGRES_EXPORTER_IP | default "10.99.0.32"}}'
  POSTGRES_EXPORTER_NAME: '{{.MONITORING_PROJECT}}-postgres-exporter'
  MONITORING_DB_HOST: '{{.MONITORING_DB_HOST | default (printf "%s-postgres" (.MONITORING_PROJECT | default "rest-mail"))}}'
  MONITORING_DB_NAME: '{{.MONITORING_DB_NAME | default "restmail"}}'
  MONITORING_DB_USER: '{{.MONITORING_DB_USER | default "restmail"}}'
  MONITORING_DB_PASS: '{{.MONITORING_DB_PASS | default "restmail"}}'

  # node-exporter: free space on the volumes REST Mail writes (#1579). Pinned
  # by digest (the multi-arch index of v1.10.2).
  NODE_EXPORTER_UPSTREAM_IMAGE: '{{.NODE_EXPORTER_UPSTREAM_IMAGE | default "prom/node-exporter:v1.10.2@sha256:3ac34ce007accad95afed72149e0d2b927b7e42fd1c866149b945b84737c62c3"}}'
  NODE_EXPORTER_IMAGE: '{{.MONITORING_REGISTRY}}/node-exporter:v1.10.2'
  NODE_EXPORTER_IP: '{{.NODE_EXPORTER_IP | default "10.99.0.33"}}'
  NODE_EXPORTER_NAME: '{{.MONITORING_PROJECT}}-node-exporter'
  # The volumes it measures, named as tasks/postgres.yml, tasks/api.yml and
  # tasks/garage.yml create them under the same project.
  NODE_EXPORTER_DB_VOLUME: '{{.NODE_EXPORTER_DB_VOLUME | default (printf "%s-postgres-data" .MONITORING_PROJECT)}}'
  NODE_EXPORTER_ATTACHMENTS_VOLUME: '{{.NODE_EXPORTER_ATTACHMENTS_VOLUME | default (printf "%s-attachments" .MONITORING_PROJECT)}}'
  NODE_EXPORTER_GARAGE_VOLUME: '{{.NODE_EXPORTER_GARAGE_VOLUME | default (printf "%s-garage-data" .MONITORING_PROJECT)}}'
  NODE_EXPORTER_CERTS_VOLUME: '{{.NODE_EXPORTER_CERTS_VOLUME | default (printf "%s-api-certs" .MONITORING_PROJECT)}}'

tasks:

  # ════════════════════════════════════════════════════════
  # Aggregate
  # ════════════════════════════════════════════════════════

  up:
    desc: Bring up the monitoring stack (prometheus + grafana + postgres-exporter + node-exporter)
    cmds:
      - task: prometheus:up
      - task: grafana:up
      - task: postgres-exporter:up
      - task: node-exporter:up
      - |
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  monitoring stack ready"
        echo ""
        echo "  Prometheus       →  http://prometheus:9090  ({{.PROMETHEUS_IP}}, mailnet-internal — not published to host)"
        echo "  Grafana          →  http://localhost:{{.GRAFANA_PORT}}  ({{.GRAFANA_IP}})"
        echo "                      user: {{.GRAFANA_ADMIN_USER}}  pass: (as set via GRAFANA_ADMIN_PASSWORD)"
        echo "  postgres-exporter→  {{.POSTGRES_EXPORTER_IP}}  (scraped by prometheus)"
        echo "  node-exporter    →  {{.NODE_EXPORTER_IP}}  (volume free space, scraped by prometheus)"
        echo ""
        echo "  chore monitoring:logs        list per-service log commands"
        echo "  chore monitoring:down        stop all four containers"
        echo "  chore monitoring:restart     down + up"
        echo "  VERBOSE=1 chore …            raw docker output"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  down:
    desc: Stop and remove all monitoring containers (preserves data volumes)
    cmds:
      - task: node-exporter:down
      - task: postgres-exporter:down
      - task: grafana:down
      - task: prometheus:down

  restart:
    desc: Recreate the full monitoring stack
    cmds:
      - task: down
      - task: up

  logs:
    desc: Show available per-service log commands (docker can't tail multiple containers natively)
    cmds:
      - |
        echo "  docker can't tail multiple containers natively. Pick one:"
        echo ""
        echo "    chore monitoring:prometheus:logs"
        echo "    chore monitoring:grafana:logs"
        echo "    chore monitoring:postgres-exporter:logs"
        echo "    chore monitoring:node-exporter:logs"
        echo ""
        echo "  or run them in parallel in separate shells."

  ps:
    desc: Show monitoring container status
    cmds:
      - docker ps -a --filter "name={{.PROMETHEUS_NAME}}" --filter "name={{.GRAFANA_NAME}}" --filter "name={{.POSTGRES_EXPORTER_NAME}}" --filter "name={{.NODE_EXPORTER_NAME}}"

  # ════════════════════════════════════════════════════════
  # prometheus
  # ════════════════════════════════════════════════════════

  prometheus:up:
    desc: Start (or recreate) the prometheus container
    cmds:
      - |
        if docker volume inspect {{.PROMETHEUS_DATA_VOLUME}} >/dev/null 2>&1; then
          [ -n "$VERBOSE" ] && echo "  volume {{.PROMETHEUS_DATA_VOLUME}} already exists" || true
        else
          echo "  creating volume {{.PROMETHEUS_DATA_VOLUME}}"
          docker volume create --label "$RESTMAIL_LABEL" --label rest-mail.data=true {{.PROMETHEUS_DATA_VOLUME}} >$OUTPUT 2>&1
        fi
      - |
        if ! docker image inspect {{.PROMETHEUS_IMAGE}} >/dev/null 2>&1; then
          echo "  pulling {{.PROMETHEUS_UPSTREAM_IMAGE}} and tagging as {{.PROMETHEUS_IMAGE}}"
          docker pull {{.PROMETHEUS_UPSTREAM_IMAGE}} >$OUTPUT 2>&1
          docker tag {{.PROMETHEUS_UPSTREAM_IMAGE}} {{.PROMETHEUS_IMAGE}}
        fi
      - |
        echo "  starting prometheus ({{.PROMETHEUS_NAME}} @ {{.PROMETHEUS_IP}})"
        docker rm -f {{.PROMETHEUS_NAME}} >$OUTPUT 2>&1 || true
        # Prometheus is reachable ONLY on the mailnet (static IP + the DNS name
        # `prometheus`), which is how Grafana scrapes it. It is deliberately NOT
        # published to the host: an unauthenticated :9090 is both a metrics
        # data-disclosure surface and, with the lifecycle/admin APIs, a remote
        # control surface.
        #   * no `-p …:9090`               — not bound on any host interface
        #   * --web.enable-lifecycle OFF   — no remote POST /-/reload or /-/quit
        #                                    (off by default; never enabled here)
        #   * admin API stays off (default) — no remote TSDB delete/snapshot
        docker run -d --label "$RESTMAIL_LABEL" --name {{.PROMETHEUS_NAME}} \
          --restart unless-stopped \
          --network {{.MONITORING_NETWORK}} \
          --ip {{.PROMETHEUS_IP}} \
          --dns {{.PROMETHEUS_DNS}} \
          -v "$(pwd)/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
          -v "$(pwd)/monitoring/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro" \
          -v {{.PROMETHEUS_DATA_VOLUME}}:/prometheus \
          {{.PROMETHEUS_IMAGE}} \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.retention.time=30d >$OUTPUT 2>&1

  prometheus:down:
    desc: Stop and remove the prometheus container (preserves the data volume)
    cmds:
      - |
        if docker ps -aq --filter "name=^/{{.PROMETHEUS_NAME}}$" | grep -q .; then
          echo "  stopping {{.PROMETHEUS_NAME}}"
          docker rm -f {{.PROMETHEUS_NAME}} >$OUTPUT 2>&1
        else
          echo "  {{.PROMETHEUS_NAME}} not running"
        fi

  prometheus:logs:
    desc: Tail prometheus logs
    cmds:
      - docker logs -f --tail=100 {{.PROMETHEUS_NAME}}

  # ════════════════════════════════════════════════════════
  # grafana
  # ════════════════════════════════════════════════════════

  grafana:up:
    desc: Start (or recreate) the grafana container
    cmds:
      - |
        if docker volume inspect {{.GRAFANA_DATA_VOLUME}} >/dev/null 2>&1; then
          [ -n "$VERBOSE" ] && echo "  volume {{.GRAFANA_DATA_VOLUME}} already exists" || true
        else
          echo "  creating volume {{.GRAFANA_DATA_VOLUME}}"
          docker volume create --label "$RESTMAIL_LABEL" --label rest-mail.data=true {{.GRAFANA_DATA_VOLUME}} >$OUTPUT 2>&1
        fi
      - |
        if ! docker image inspect {{.GRAFANA_IMAGE}} >/dev/null 2>&1; then
          echo "  pulling {{.GRAFANA_UPSTREAM_IMAGE}} and tagging as {{.GRAFANA_IMAGE}}"
          docker pull {{.GRAFANA_UPSTREAM_IMAGE}} >$OUTPUT 2>&1
          docker tag {{.GRAFANA_UPSTREAM_IMAGE}} {{.GRAFANA_IMAGE}}
        fi
      - |
        if [ -z "{{.GRAFANA_ADMIN_PASSWORD}}" ]; then
          echo "  ERROR: GRAFANA_ADMIN_PASSWORD is required (no default)." >&2
          echo "         Grafana will not start on well-known credentials." >&2
          echo "         Set it, e.g.  GRAFANA_ADMIN_PASSWORD=... chore monitoring:up" >&2
          exit 1
        fi
        echo "  starting grafana ({{.GRAFANA_NAME}} @ {{.GRAFANA_IP}})"
        docker rm -f {{.GRAFANA_NAME}} >$OUTPUT 2>&1 || true
        # The admin password goes through a 0600 env-file rather than an -e flag,
        # so it never sits on the `docker run` command line (host process list,
        # shell history, CI logs). Removed once docker has read it.
        mkdir -p {{.ROOT_DIR}}/.cache
        SECRETS_ENV="{{.ROOT_DIR}}/.cache/{{.GRAFANA_NAME}}.secrets.env"
        trap 'rm -f "$SECRETS_ENV"' EXIT
        rm -f "$SECRETS_ENV"
        # Create empty, chmod 0600, THEN write the secret (Task's shell lacks umask).
        : > "$SECRETS_ENV"
        chmod 600 "$SECRETS_ENV"
        printf 'GF_SECURITY_ADMIN_PASSWORD=%s\n' "{{.GRAFANA_ADMIN_PASSWORD}}" > "$SECRETS_ENV"
        docker run -d --label "$RESTMAIL_LABEL" --name {{.GRAFANA_NAME}} \
          --restart unless-stopped \
          --network {{.MONITORING_NETWORK}} \
          --ip {{.GRAFANA_IP}} \
          -p {{.GRAFANA_PORT}}:3000 \
          -e GF_SECURITY_ADMIN_USER={{.GRAFANA_ADMIN_USER}} \
          --env-file "$SECRETS_ENV" \
          -e GF_USERS_ALLOW_SIGN_UP=false \
          -v "$(pwd)/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro" \
          -v "$(pwd)/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro" \
          -v {{.GRAFANA_DATA_VOLUME}}:/var/lib/grafana \
          {{.GRAFANA_IMAGE}} >$OUTPUT 2>&1

  grafana:down:
    desc: Stop and remove the grafana container (preserves the data volume)
    cmds:
      - |
        if docker ps -aq --filter "name=^/{{.GRAFANA_NAME}}$" | grep -q .; then
          echo "  stopping {{.GRAFANA_NAME}}"
          docker rm -f {{.GRAFANA_NAME}} >$OUTPUT 2>&1
        else
          echo "  {{.GRAFANA_NAME}} not running"
        fi

  grafana:logs:
    desc: Tail grafana logs
    cmds:
      - docker logs -f --tail=100 {{.GRAFANA_NAME}}

  # ════════════════════════════════════════════════════════
  # postgres-exporter
  # ════════════════════════════════════════════════════════

  postgres-exporter:up:
    desc: Start (or recreate) the postgres-exporter container
    cmds:
      - |
        if ! docker image inspect {{.POSTGRES_EXPORTER_IMAGE}} >/dev/null 2>&1; then
          echo "  pulling {{.POSTGRES_EXPORTER_UPSTREAM_IMAGE}} and tagging as {{.POSTGRES_EXPORTER_IMAGE}}"
          docker pull {{.POSTGRES_EXPORTER_UPSTREAM_IMAGE}} >$OUTPUT 2>&1
          docker tag {{.POSTGRES_EXPORTER_UPSTREAM_IMAGE}} {{.POSTGRES_EXPORTER_IMAGE}}
        fi
      - |
        echo "  starting postgres-exporter ({{.POSTGRES_EXPORTER_NAME}} @ {{.POSTGRES_EXPORTER_IP}})"
        docker rm -f {{.POSTGRES_EXPORTER_NAME}} >$OUTPUT 2>&1 || true
        # DATA_SOURCE_NAME embeds the DB password, so it goes through a 0600
        # env-file rather than an -e flag — never on the `docker run` command
        # line (host process list, shell history, CI logs). Removed after read.
        mkdir -p {{.ROOT_DIR}}/.cache
        SECRETS_ENV="{{.ROOT_DIR}}/.cache/{{.POSTGRES_EXPORTER_NAME}}.secrets.env"
        trap 'rm -f "$SECRETS_ENV"' EXIT
        rm -f "$SECRETS_ENV"
        # Create empty, chmod 0600, THEN write the secret (Task's shell lacks umask).
        : > "$SECRETS_ENV"
        chmod 600 "$SECRETS_ENV"
        printf 'DATA_SOURCE_NAME=postgresql://%s:%s@%s:5432/%s?sslmode=disable\n' \
          "{{.MONITORING_DB_USER}}" "{{.MONITORING_DB_PASS}}" "{{.MONITORING_DB_HOST}}" "{{.MONITORING_DB_NAME}}" > "$SECRETS_ENV"
        docker run -d --label "$RESTMAIL_LABEL" --name {{.POSTGRES_EXPORTER_NAME}} \
          --restart unless-stopped \
          --network {{.MONITORING_NETWORK}} \
          --ip {{.POSTGRES_EXPORTER_IP}} \
          --env-file "$SECRETS_ENV" \
          {{.POSTGRES_EXPORTER_IMAGE}} >$OUTPUT 2>&1

  postgres-exporter:down:
    desc: Stop and remove the postgres-exporter container
    cmds:
      - |
        if docker ps -aq --filter "name=^/{{.POSTGRES_EXPORTER_NAME}}$" | grep -q .; then
          echo "  stopping {{.POSTGRES_EXPORTER_NAME}}"
          docker rm -f {{.POSTGRES_EXPORTER_NAME}} >$OUTPUT 2>&1
        else
          echo "  {{.POSTGRES_EXPORTER_NAME}} not running"
        fi

  postgres-exporter:logs:
    desc: Tail postgres-exporter logs
    cmds:
      - docker logs -f --tail=100 {{.POSTGRES_EXPORTER_NAME}}

  # ════════════════════════════════════════════════════════
  # node-exporter
  # ════════════════════════════════════════════════════════

  node-exporter:up:
    desc: Start (or recreate) node-exporter, which reports free space on the database, attachment and certificate volumes
    cmds:
      - |
        if ! docker image inspect {{.NODE_EXPORTER_IMAGE}} >/dev/null 2>&1; then
          echo "  pulling {{.NODE_EXPORTER_UPSTREAM_IMAGE}} and tagging as {{.NODE_EXPORTER_IMAGE}}"
          docker pull {{.NODE_EXPORTER_UPSTREAM_IMAGE}} >$OUTPUT 2>&1
          docker tag {{.NODE_EXPORTER_UPSTREAM_IMAGE}} {{.NODE_EXPORTER_IMAGE}}
        fi
      - |
        echo "  starting node-exporter ({{.NODE_EXPORTER_NAME}} @ {{.NODE_EXPORTER_IP}})"
        docker rm -f {{.NODE_EXPORTER_NAME}} >$OUTPUT 2>&1 || true
        # Each volume is mounted read-only under /volumes/<name>. The
        # filesystem collector reads the container's own mount table, so every
        # mount shows up as node_filesystem_*{mountpoint="/volumes/<name>"}
        # with the size and free space of the filesystem holding that volume.
        # Read-only mounts report node_filesystem_readonly=1; the alerts do not
        # filter on it. Only the filesystem collector runs: the others would
        # describe this container, not the host. A volume not created yet is
        # skipped, so the exporter still starts with part of the stack down.
        MOUNTS=""
        for pair in \
          "{{.NODE_EXPORTER_DB_VOLUME}}:postgres-data" \
          "{{.NODE_EXPORTER_ATTACHMENTS_VOLUME}}:attachments" \
          "{{.NODE_EXPORTER_GARAGE_VOLUME}}:garage-data" \
          "{{.NODE_EXPORTER_CERTS_VOLUME}}:certs"; do
          vol="${pair%%:*}"; name="${pair##*:}"
          if docker volume inspect "$vol" >/dev/null 2>&1; then
            MOUNTS="$MOUNTS -v $vol:/volumes/$name:ro"
          else
            echo "  volume $vol not found, /volumes/$name not measured"
          fi
        done
        docker run -d --name {{.NODE_EXPORTER_NAME}} \
          --restart unless-stopped \
          --network {{.MONITORING_NETWORK}} \
          --ip {{.NODE_EXPORTER_IP}} \
          --network-alias node-exporter \
          --read-only \
          --cap-drop ALL \
          --security-opt no-new-privileges \
          $MOUNTS \
          {{.NODE_EXPORTER_IMAGE}} \
          --collector.disable-defaults \
          --collector.filesystem \
          --collector.filesystem.mount-points-exclude='^/(dev|proc|sys|etc)($|/)' >$OUTPUT 2>&1

  node-exporter:down:
    desc: Stop and remove the node-exporter container
    cmds:
      - |
        if docker ps -aq --filter "name=^/{{.NODE_EXPORTER_NAME}}$" | grep -q .; then
          echo "  stopping {{.NODE_EXPORTER_NAME}}"
          docker rm -f {{.NODE_EXPORTER_NAME}} >$OUTPUT 2>&1
        else
          echo "  {{.NODE_EXPORTER_NAME}} not running"
        fi

  node-exporter:logs:
    desc: Tail node-exporter logs
    cmds:
      - docker logs -f --tail=100 {{.NODE_EXPORTER_NAME}}
