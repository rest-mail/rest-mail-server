version: "3"

# rest-mail/tasks/smtp-gateway — Taskfile
#
# Drives the SMTP gateway container (mail3.test) via plain `docker run`
# (no compose). Included by the main Taskfile under namespace `smtp-gateway`.
#
# Joins the testbed's mailnet network at a static IP so peers can reach it
# by name. TLS certs are mounted read-only from the shared testbed certs
# volume; logs live in a named volume so the container can be recreated
# without losing them.
#
# MODE=dev (default) builds the `dev` Dockerfile target (air hot reload)
# and bind-mounts the project root into /app. MODE=prod builds the prod
# target with no bind mounts.
#
# Output is friendly by default. Re-run with VERBOSE=1 to see the raw
# docker / shell output (e.g. VERBOSE=1 task smtp-gateway:up).

silent: true

vars:
  SMTP_GATEWAY_PROJECT: '{{.SMTP_GATEWAY_PROJECT | default "rest-mail"}}'
  SMTP_GATEWAY_NETWORK: '{{.SMTP_GATEWAY_NETWORK | default "testbed_mailnet"}}'
  SMTP_GATEWAY_CERTS_VOLUME: '{{.SMTP_GATEWAY_CERTS_VOLUME | default "testbed_certs"}}'
  SMTP_GATEWAY_DNS_IP: '{{.SMTP_GATEWAY_DNS_IP | default "10.99.0.10"}}'
  SMTP_GATEWAY_IP: '{{.SMTP_GATEWAY_IP | default "10.99.0.13"}}'
  SMTP_GATEWAY_MAIL3_HOSTNAME: '{{.SMTP_GATEWAY_MAIL3_HOSTNAME | default "mail3.test"}}'
  SMTP_GATEWAY_MODE: '{{.SMTP_GATEWAY_MODE | default "dev"}}'
  SMTP_GATEWAY_IMAGE_TAG: '{{.SMTP_GATEWAY_IMAGE_TAG | default "dev"}}'
  SMTP_GATEWAY_REGISTRY: '{{.SMTP_GATEWAY_REGISTRY | default "ghcr.io/rest-mail"}}'
  SMTP_GATEWAY_IMAGE: '{{.SMTP_GATEWAY_REGISTRY}}/smtp-gateway:{{.SMTP_GATEWAY_IMAGE_TAG}}'
  SMTP_GATEWAY_CONTAINER_NAME: '{{.SMTP_GATEWAY_PROJECT}}-smtp-gateway'
  SMTP_GATEWAY_LOGS_VOLUME: '{{.SMTP_GATEWAY_PROJECT}}-gateway-logs'
  SMTP_GATEWAY_API_BASE_URL: '{{.SMTP_GATEWAY_API_BASE_URL | default "http://10.99.0.20:8080"}}'
  SMTP_GATEWAY_DB_HOST: '{{.SMTP_GATEWAY_DB_HOST | default "10.99.0.43"}}'
  SMTP_GATEWAY_DB_PORT: '{{.SMTP_GATEWAY_DB_PORT | default "5432"}}'
  SMTP_GATEWAY_DB_NAME: '{{.SMTP_GATEWAY_DB_NAME | default "restmail"}}'
  SMTP_GATEWAY_DB_USER: '{{.SMTP_GATEWAY_DB_USER | default "restmail"}}'
  SMTP_GATEWAY_DB_PASS: '{{.SMTP_GATEWAY_DB_PASS | default "restmail"}}'
  # Decrypts at-rest DKIM private keys so the queue worker can DKIM-sign
  # SMTP-submitted outbound mail (#171). Default matches the API's default so a
  # standalone `task smtp-gateway:up` shares the same key the API used to encrypt.
  SMTP_GATEWAY_MASTER_KEY: '{{.SMTP_GATEWAY_MASTER_KEY | default "dev-master-key-change-in-production"}}'
  SMTP_GATEWAY_TLS_CERT_PATH: '{{.SMTP_GATEWAY_TLS_CERT_PATH | default "/certs/mail3.test.crt"}}'
  SMTP_GATEWAY_TLS_KEY_PATH: '{{.SMTP_GATEWAY_TLS_KEY_PATH | default "/certs/mail3.test.key"}}'
  # Max accepted SMTP message size in bytes. Empty = server default (10 MiB).
  SMTP_GATEWAY_MAX_MESSAGE_SIZE: '{{.SMTP_GATEWAY_MAX_MESSAGE_SIZE | default ""}}'
  # Anti-slowloris message-transfer policy. Empty = server defaults
  # (16384 bytes/sec floor, 60s grace, 300s stall). Rate floor 0 disables
  # the floor (stall timeout still applies).
  SMTP_GATEWAY_MIN_TRANSFER_RATE: '{{.SMTP_GATEWAY_MIN_TRANSFER_RATE | default ""}}'
  SMTP_GATEWAY_TRANSFER_GRACE_PERIOD: '{{.SMTP_GATEWAY_TRANSFER_GRACE_PERIOD | default ""}}'
  SMTP_GATEWAY_TRANSFER_STALL_TIMEOUT: '{{.SMTP_GATEWAY_TRANSFER_STALL_TIMEOUT | default ""}}'
  SMTP_GATEWAY_PORT_INBOUND: '{{.SMTP_GATEWAY_PORT_INBOUND | default "25"}}'
  SMTP_GATEWAY_PORT_SUBMISSION: '{{.SMTP_GATEWAY_PORT_SUBMISSION | default "587"}}'
  SMTP_GATEWAY_PORT_SUBMISSION_TLS: '{{.SMTP_GATEWAY_PORT_SUBMISSION_TLS | default "465"}}'
  SMTP_GATEWAY_QUEUE_WORKERS: '{{.SMTP_GATEWAY_QUEUE_WORKERS | default "4"}}'
  # Outbound delivery-queue poll cadence + MTA-STS enforcement. Empty = server
  # defaults (5s poll, MTA-STS enforced). Set via the manifest `smtp:` block.
  SMTP_GATEWAY_QUEUE_POLL_INTERVAL: '{{.SMTP_GATEWAY_QUEUE_POLL_INTERVAL | default ""}}'
  SMTP_GATEWAY_MTASTS_ENFORCE: '{{.SMTP_GATEWAY_MTASTS_ENFORCE | default ""}}'
  SMTP_GATEWAY_LOG_LEVEL: '{{.SMTP_GATEWAY_LOG_LEVEL | default "debug"}}'
  SMTP_GATEWAY_ENVIRONMENT: '{{.SMTP_GATEWAY_ENVIRONMENT | default "development"}}'
  SMTP_GATEWAY_MAILNET_ONLY: '{{.SMTP_GATEWAY_MAILNET_ONLY | default "false"}}'
  # Internal mTLS (gateway → API). Off by default; when "true" the gateway
  # presents /certs/internal-client.* on the two machine routes and sends them
  # to SMTP_GATEWAY_API_INTERNAL_BASE_URL (the API's https internal listener);
  # all other routes keep using SMTP_GATEWAY_API_BASE_URL (public).
  SMTP_GATEWAY_INTERNAL_MTLS: '{{.SMTP_GATEWAY_INTERNAL_MTLS | default "false"}}'
  SMTP_GATEWAY_API_INTERNAL_BASE_URL: '{{.SMTP_GATEWAY_API_INTERNAL_BASE_URL | default ""}}'

tasks:

  # ════════════════════════════════════════════════════════
  # build
  # ════════════════════════════════════════════════════════

  build:
    desc: Build the smtp-gateway image (target controlled by MODE=dev|prod)
    cmds:
      - |
        echo "  building {{.SMTP_GATEWAY_IMAGE}} (target: {{.SMTP_GATEWAY_MODE}})"
        docker build \
          -t {{.SMTP_GATEWAY_IMAGE}} \
          --target {{.SMTP_GATEWAY_MODE}} \
          -f projects/smtp-gateway/Dockerfile \
          . >$OUTPUT 2>&1

  # ════════════════════════════════════════════════════════
  # up / down / restart
  # ════════════════════════════════════════════════════════

  up:
    desc: Start smtp-gateway (builds image; creates logs volume if missing; recreates container)
    deps: [build]
    cmds:
      - |
        if docker volume inspect {{.SMTP_GATEWAY_LOGS_VOLUME}} >/dev/null 2>&1; then
          [ -n "$VERBOSE" ] && echo "  volume {{.SMTP_GATEWAY_LOGS_VOLUME}} already exists" || true
        else
          echo "  creating volume {{.SMTP_GATEWAY_LOGS_VOLUME}}"
          docker volume create {{.SMTP_GATEWAY_LOGS_VOLUME}} >$OUTPUT 2>&1
        fi
      - |
        echo "  starting smtp-gateway ({{.SMTP_GATEWAY_CONTAINER_NAME}} @ {{.SMTP_GATEWAY_IP}}, mode: {{.SMTP_GATEWAY_MODE}})"

        # Build the dev-only bind-mount fragment when MODE=dev
        if [ "{{.SMTP_GATEWAY_MODE}}" = "dev" ]; then
          DEV_MOUNTS="-v $(pwd):/app -v /app/tmp"
        else
          DEV_MOUNTS=""
        fi

        docker rm -f {{.SMTP_GATEWAY_CONTAINER_NAME}} >$OUTPUT 2>&1 || true
        # mailnet_only secondary instances skip host-port publishing so they
        # can run beside the primary (reachable on the mailnet like the refs).
        PUBLISH="-p {{.SMTP_GATEWAY_PORT_INBOUND}}:{{.SMTP_GATEWAY_PORT_INBOUND}} -p {{.SMTP_GATEWAY_PORT_SUBMISSION}}:{{.SMTP_GATEWAY_PORT_SUBMISSION}} -p {{.SMTP_GATEWAY_PORT_SUBMISSION_TLS}}:{{.SMTP_GATEWAY_PORT_SUBMISSION_TLS}}"
        [ "{{.SMTP_GATEWAY_MAILNET_ONLY}}" = "true" ] && PUBLISH=""
        # Testbed dnsmasq as the ONLY resolver (see tasks/api.yml for rationale):
        # outbound MX lookups must see the simulated internet, not Docker's
        # embedded DNS. Peer services are addressed by static mailnet IPs.
        mkdir -p {{.ROOT_DIR}}/.cache
        printf 'nameserver %s\n' "{{.SMTP_GATEWAY_DNS_IP}}" > {{.ROOT_DIR}}/.cache/testbed-resolv.conf
        # Container hardening (OSI-17): no privilege escalation, drop ALL Linux
        # capabilities then add back only NET_BIND_SERVICE (binds the privileged
        # SMTP ports 25/465/587), plus pid/mem/cpu ceilings. Rootfs stays
        # writable: dev mode compiles via `air` into the bind-mounted /app and
        # the entrypoint runs update-ca-certificates (read-only is a prod-image
        # follow-up); log volume is separate.
        HARDENING="--security-opt no-new-privileges:true \
          --cap-drop ALL --cap-add NET_BIND_SERVICE \
          --pids-limit 512 --memory 1g --cpus 1.5"
        # Secrets (DB_PASS/MASTER_KEY) go through a 0600 env-file rather than -e
        # flags, so they never sit on the `docker run` command line (host process
        # list, shell history, CI logs). MASTER_KEY decrypts at-rest DKIM keys so
        # the queue worker can DKIM-sign SMTP-submitted outbound mail (#171).
        # Removed once docker has read it.
        mkdir -p {{.ROOT_DIR}}/.cache
        SECRETS_ENV="{{.ROOT_DIR}}/.cache/{{.SMTP_GATEWAY_CONTAINER_NAME}}.secrets.env"
        trap 'rm -f "$SECRETS_ENV"' EXIT
        rm -f "$SECRETS_ENV"
        ( umask 077; {
            printf 'DB_PASS=%s\n'    "{{.SMTP_GATEWAY_DB_PASS}}"
            printf 'MASTER_KEY=%s\n' "{{.SMTP_GATEWAY_MASTER_KEY}}"
          } > "$SECRETS_ENV" )
        chmod 600 "$SECRETS_ENV"
        docker run -d --name {{.SMTP_GATEWAY_CONTAINER_NAME}} \
          $HARDENING \
          --hostname {{.SMTP_GATEWAY_MAIL3_HOSTNAME}} \
          --restart unless-stopped \
          --network {{.SMTP_GATEWAY_NETWORK}} \
          --ip {{.SMTP_GATEWAY_IP}} \
          -v {{.ROOT_DIR}}/.cache/testbed-resolv.conf:/etc/resolv.conf:ro \
          $PUBLISH \
          -v {{.SMTP_GATEWAY_CERTS_VOLUME}}:/certs:ro \
          -v {{.SMTP_GATEWAY_LOGS_VOLUME}}:/var/log/restmail \
          $DEV_MOUNTS \
          --health-cmd 'nc -z localhost {{.SMTP_GATEWAY_PORT_INBOUND}} || exit 1' \
          --health-interval 10s \
          --health-timeout 5s \
          --health-retries 3 \
          -e GATEWAY_HOSTNAME={{.SMTP_GATEWAY_MAIL3_HOSTNAME}} \
          -e API_BASE_URL={{.SMTP_GATEWAY_API_BASE_URL}} \
          -e DB_HOST={{.SMTP_GATEWAY_DB_HOST}} \
          -e DB_PORT={{.SMTP_GATEWAY_DB_PORT}} \
          -e DB_NAME={{.SMTP_GATEWAY_DB_NAME}} \
          -e DB_USER={{.SMTP_GATEWAY_DB_USER}} \
          --env-file "$SECRETS_ENV" \
          -e TLS_CERT_PATH={{.SMTP_GATEWAY_TLS_CERT_PATH}} \
          -e TLS_KEY_PATH={{.SMTP_GATEWAY_TLS_KEY_PATH}} \
          -e SMTP_MAX_MESSAGE_SIZE={{.SMTP_GATEWAY_MAX_MESSAGE_SIZE}} \
          -e SMTP_MIN_TRANSFER_RATE={{.SMTP_GATEWAY_MIN_TRANSFER_RATE}} \
          -e SMTP_TRANSFER_GRACE_PERIOD={{.SMTP_GATEWAY_TRANSFER_GRACE_PERIOD}} \
          -e SMTP_TRANSFER_STALL_TIMEOUT={{.SMTP_GATEWAY_TRANSFER_STALL_TIMEOUT}} \
          -e SMTP_PORT_INBOUND={{.SMTP_GATEWAY_PORT_INBOUND}} \
          -e SMTP_PORT_SUBMISSION={{.SMTP_GATEWAY_PORT_SUBMISSION}} \
          -e SMTP_PORT_SUBMISSION_TLS={{.SMTP_GATEWAY_PORT_SUBMISSION_TLS}} \
          -e QUEUE_WORKERS={{.SMTP_GATEWAY_QUEUE_WORKERS}} \
          -e QUEUE_POLL_INTERVAL={{.SMTP_GATEWAY_QUEUE_POLL_INTERVAL}} \
          -e MTASTS_ENFORCE={{.SMTP_GATEWAY_MTASTS_ENFORCE}} \
          -e LOG_LEVEL={{.SMTP_GATEWAY_LOG_LEVEL}} \
          -e ENVIRONMENT={{.SMTP_GATEWAY_ENVIRONMENT}} \
          -e INTERNAL_MTLS_ENABLED={{.SMTP_GATEWAY_INTERNAL_MTLS}} \
          -e API_INTERNAL_BASE_URL={{.SMTP_GATEWAY_API_INTERNAL_BASE_URL}} \
          -e INTERNAL_MTLS_CA_CERT=/certs/internal-ca.crt \
          -e INTERNAL_MTLS_CLIENT_CERT=/certs/internal-client.crt \
          -e INTERNAL_MTLS_CLIENT_KEY=/certs/internal-client.key \
          {{.SMTP_GATEWAY_IMAGE}} >$OUTPUT 2>&1

  down:
    desc: Stop and remove smtp-gateway (preserves the logs volume)
    cmds:
      - |
        if docker ps -aq --filter "name=^/{{.SMTP_GATEWAY_CONTAINER_NAME}}$" | grep -q .; then
          echo "  stopping {{.SMTP_GATEWAY_CONTAINER_NAME}}"
          docker rm -f {{.SMTP_GATEWAY_CONTAINER_NAME}} >$OUTPUT 2>&1
        else
          echo "  {{.SMTP_GATEWAY_CONTAINER_NAME}} not running"
        fi

  restart:
    desc: Recreate the smtp-gateway container
    cmds:
      - task: down
      - task: up

  # ════════════════════════════════════════════════════════
  # Diagnostics
  # ════════════════════════════════════════════════════════

  logs:
    desc: Tail smtp-gateway logs
    cmds:
      - docker logs -f --tail=100 {{.SMTP_GATEWAY_CONTAINER_NAME}}
