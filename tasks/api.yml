version: "3"

# rest-mail/tasks/api — Taskfile
#
# Drives the REST API container via plain `docker run` (no compose).
# Included by the main Taskfile under namespace `api`.
#
# Joins the testbed's mailnet network at a static IP so peers can reach it
# by name. Resolves DB / SMTP peers via the testbed dnsmasq. Two build
# targets are supported via MODE: `dev` (air hot-reload, repo bind-mounted
# at /app) and `prod` (statically built binary).
#
# Output is friendly by default. Re-run with VERBOSE=1 to see the raw
# docker / shell output (e.g. VERBOSE=1 chore api:up).

silent: true

vars:
  API_PROJECT: '{{.API_PROJECT | default "rest-mail"}}'
  API_NETWORK: '{{.API_NETWORK | default "testbed_mailnet"}}'
  API_CERTS_VOLUME: '{{.API_CERTS_VOLUME | default "testbed_certs"}}'
  API_DNS_IP: '{{.API_DNS_IP | default "10.99.0.10"}}'
  API_IP: '{{.API_IP | default "10.99.0.20"}}'
  API_PORT: '{{.API_PORT | default "8080"}}'
  API_MODE: '{{.API_MODE | default "dev"}}'
  API_IMAGE_TAG: '{{.API_IMAGE_TAG | default "dev"}}'
  API_REGISTRY: '{{.API_REGISTRY | default "ghcr.io/rest-mail"}}'
  API_IMAGE: '{{.API_REGISTRY}}/api:{{.API_IMAGE_TAG}}'
  API_CONTAINER_NAME: '{{.API_PROJECT}}-api'
  API_ATTACHMENTS_VOLUME: '{{.API_PROJECT}}-attachments'
  API_DB_HOST: '{{.API_DB_HOST | default "10.99.0.43"}}'
  API_DB_PORT: '{{.API_DB_PORT | default "5432"}}'
  API_DB_NAME: '{{.API_DB_NAME | default "restmail"}}'
  API_DB_USER: '{{.API_DB_USER | default "restmail"}}'
  API_DB_PASS: '{{.API_DB_PASS | default "restmail"}}'
  API_JWT_SECRET: '{{.API_JWT_SECRET | default "dev-secret-change-in-production"}}'
  API_MASTER_KEY: '{{.API_MASTER_KEY | default "dev-master-key-change-in-production"}}'
  API_LOG_LEVEL: '{{.API_LOG_LEVEL | default "debug"}}'
  API_ENVIRONMENT: '{{.API_ENVIRONMENT | default "development"}}'
  API_MAILNET_ONLY: '{{.API_MAILNET_ONLY | default "false"}}'
  API_PROXY_HOST: '{{.API_PROXY_HOST | default "restmail.localhost"}}'
  # Internal mTLS (gateway → API). Off by default; when "true" the API serves
  # the gateway-facing routes on API_INTERNAL_MTLS_PORT requiring a client cert
  # from the internal CA. Certs are provisioned into the certs volume by
  # `chore instance:mtls:issue` at the fixed /certs/internal-* paths.
  API_INTERNAL_MTLS: '{{.API_INTERNAL_MTLS | default "false"}}'
  API_INTERNAL_MTLS_PORT: '{{.API_INTERNAL_MTLS_PORT | default "8443"}}'

tasks:

  # ════════════════════════════════════════════════════════
  # build
  # ════════════════════════════════════════════════════════

  build:
    desc: Build the api image (target controlled by MODE — dev or prod)
    cmds:
      - |
        echo "  building {{.API_IMAGE}} (target={{.API_MODE}})"
        docker build -t {{.API_IMAGE}} --target {{.API_MODE}} -f Dockerfile . >$OUTPUT 2>&1

  # ════════════════════════════════════════════════════════
  # up / down / restart
  # ════════════════════════════════════════════════════════

  up:
    desc: Start the api container (creates attachments volume if missing; recreates container)
    deps: [build]
    cmds:
      - |
        if docker volume inspect {{.API_ATTACHMENTS_VOLUME}} >/dev/null 2>&1; then
          [ -n "$VERBOSE" ] && echo "  volume {{.API_ATTACHMENTS_VOLUME}} already exists" || true
        else
          echo "  creating volume {{.API_ATTACHMENTS_VOLUME}}"
          docker volume create {{.API_ATTACHMENTS_VOLUME}} >$OUTPUT 2>&1
        fi
      - |
        echo "  starting api ({{.API_CONTAINER_NAME}} @ {{.API_IP}}, mode={{.API_MODE}})"
        if [ "{{.API_MODE}}" = "dev" ]; then
          DEV_MOUNTS="-v $(pwd):/app -v /app/tmp"
        else
          DEV_MOUNTS=""
        fi
        docker rm -f {{.API_CONTAINER_NAME}} >$OUTPUT 2>&1 || true
        # The testbed dnsmasq must be the ONLY resolver (mounted resolv.conf, not
        # --dns): Docker's embedded DNS answers ahead of the --dns upstream for
        # names matching container hostnames — A-only, no MX/TXT/PTR — corrupting
        # the simulated internet the SPF/DKIM/DMARC/MTA-STS checks depend on.
        # Peer services (DB, api) are therefore addressed by static mailnet IPs.
        mkdir -p {{.ROOT_DIR}}/.cache
        printf 'nameserver %s\n' "{{.API_DNS_IP}}" > {{.ROOT_DIR}}/.cache/testbed-resolv.conf
        # The API is NOT published on a host port. It is an HTTP service with a
        # reverse-proxy route (docker-proxy.api.* below), so it is reached at
        # restmail.localhost/api — publishing it as well put it on 0.0.0.0:8080,
        # which is the whole LAN, not just this machine. The mail protocols still
        # publish, because SMTP/IMAP/POP3 are not HTTP and the proxy cannot carry
        # them; a mail client has no other way in.
        #
        # From the host: use the proxy route. From inside a container: the mailnet
        # IP, which is what the gateways already use. To poke it without either,
        # `docker exec rest-mail-api wget -qO- localhost:8080/api/health`.
        PUBLISH=""
        # Container hardening (OSI-17): no privilege escalation, drop ALL Linux
        # capabilities (the API binds the unprivileged :8080/:8443, so needs
        # none), plus pid/mem/cpu ceilings. Rootfs is left writable: dev mode
        # hot-reloads via `air` (compiles into the bind-mounted /app) and the
        # entrypoint runs update-ca-certificates — read-only rootfs is a
        # prod-image follow-up (see PR notes).
        HARDENING="--security-opt no-new-privileges:true \
          --cap-drop ALL \
          --pids-limit 1024 --memory 2g --cpus 2"
        # Secrets (DB_PASS/JWT_SECRET/MASTER_KEY) are handed to the container via
        # a 0600 env-file rather than -e flags, so they never sit on the
        # `docker run` command line (host process list, shell history, CI logs)
        # or on disk world-readably. The file is removed once docker has read it.
        SECRETS_ENV="{{.ROOT_DIR}}/.cache/{{.API_CONTAINER_NAME}}.secrets.env"
        trap 'rm -f "$SECRETS_ENV"' EXIT
        rm -f "$SECRETS_ENV"
        # Create empty, chmod 0600, THEN write the secrets (Task's shell lacks umask).
        : > "$SECRETS_ENV"
        chmod 600 "$SECRETS_ENV"
        printf 'DB_PASS=%s\n'    "{{.API_DB_PASS}}"    >  "$SECRETS_ENV"
        printf 'JWT_SECRET=%s\n' "{{.API_JWT_SECRET}}" >> "$SECRETS_ENV"
        printf 'MASTER_KEY=%s\n' "{{.API_MASTER_KEY}}" >> "$SECRETS_ENV"
        docker run -d --name {{.API_CONTAINER_NAME}} \
          $HARDENING \
          --restart unless-stopped \
          --network {{.API_NETWORK}} \
          --ip {{.API_IP}} \
          -v {{.ROOT_DIR}}/.cache/testbed-resolv.conf:/etc/resolv.conf:ro \
          $PUBLISH \
          -v {{.API_CERTS_VOLUME}}:/certs:ro \
          -v {{.API_ATTACHMENTS_VOLUME}}:/attachments \
          $DEV_MOUNTS \
          -l docker-proxy.api.host={{.API_PROXY_HOST}} \
          -l docker-proxy.api.port={{.API_PORT}} \
          -l docker-proxy.api.path=/api \
          -e DB_HOST={{.API_DB_HOST}} \
          -e DB_PORT={{.API_DB_PORT}} \
          -e DB_NAME={{.API_DB_NAME}} \
          -e DB_USER={{.API_DB_USER}} \
          -e API_PORT={{.API_PORT}} \
          --env-file "$SECRETS_ENV" \
          -e ENVIRONMENT={{.API_ENVIRONMENT}} \
          -e LOG_LEVEL={{.API_LOG_LEVEL}} \
          -e INTERNAL_MTLS_ENABLED={{.API_INTERNAL_MTLS}} \
          -e INTERNAL_MTLS_PORT={{.API_INTERNAL_MTLS_PORT}} \
          -e INTERNAL_MTLS_CA_CERT=/certs/internal-ca.crt \
          -e INTERNAL_MTLS_SERVER_CERT=/certs/internal-server.crt \
          -e INTERNAL_MTLS_SERVER_KEY=/certs/internal-server.key \
          {{.API_IMAGE}} >$OUTPUT 2>&1

  down:
    desc: Stop and remove the api container (preserves the attachments volume)
    cmds:
      - |
        if docker ps -aq --filter "name=^/{{.API_CONTAINER_NAME}}$" | grep -q .; then
          echo "  stopping {{.API_CONTAINER_NAME}}"
          docker rm -f {{.API_CONTAINER_NAME}} >$OUTPUT 2>&1
        else
          echo "  {{.API_CONTAINER_NAME}} not running"
        fi

  restart:
    desc: Recreate the api container
    cmds:
      - task: down
      - task: up

  # ════════════════════════════════════════════════════════
  # Diagnostics
  # ════════════════════════════════════════════════════════

  logs:
    desc: Tail api logs
    cmds:
      - docker logs -f --tail=100 {{.API_CONTAINER_NAME}}
