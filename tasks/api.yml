version: "3"

# rest-mail/tasks/api — Taskfile
#
# Drives the REST API container via plain `docker run` (no compose).
# Included by the main Taskfile under namespace `api`.
#
# Joins the testbed's mailnet network at a static IP so peers can reach it
# by name. Resolves DB / SMTP peers via the testbed dnsmasq. Two build
# targets are supported via MODE: `dev` (air hot-reload, repo bind-mounted
# at /app) and `prod` (statically built binary).
#
# Output is friendly by default. Re-run with VERBOSE=1 to see the raw
# docker / shell output (e.g. VERBOSE=1 chore api:up).

silent: true

vars:
  API_PROJECT: '{{.API_PROJECT | default "rest-mail"}}'
  API_NETWORK: '{{.API_NETWORK | default "testbed_mailnet"}}'
  # Where certificates are issued: the testbed's volume, which also holds its CA
  # key, and the internal mTLS volume, which holds the internal CA's. The API
  # mounts neither (#193); `up` copies what it needs into API_OWN_CERTS_VOLUME.
  API_CERTS_VOLUME: '{{.API_CERTS_VOLUME | default "testbed_certs"}}'
  API_INTERNAL_MTLS_VOLUME: '{{.API_INTERNAL_MTLS_VOLUME | default "rest-mail-internal-mtls"}}'
  API_DNS_IP: '{{.API_DNS_IP | default "10.99.0.10"}}'
  API_IP: '{{.API_IP | default "10.99.0.20"}}'
  API_PORT: '{{.API_PORT | default "8080"}}'
  API_RESTMAIL_HOSTNAME: '{{.API_RESTMAIL_HOSTNAME | default "restmail.test"}}'
  API_MODE: '{{.API_MODE | default "dev"}}'
  API_IMAGE_TAG: '{{.API_IMAGE_TAG | default "dev"}}'
  API_REGISTRY: '{{.API_REGISTRY | default "ghcr.io/rest-mail"}}'
  API_IMAGE: '{{.API_REGISTRY}}/api:{{.API_IMAGE_TAG}}'
  API_CONTAINER_NAME: '{{.API_PROJECT}}-api'
  API_ATTACHMENTS_VOLUME: '{{.API_PROJECT}}-attachments'
  API_OWN_CERTS_VOLUME: '{{.API_CONTAINER_NAME}}-certs'
  API_DB_HOST: '{{.API_DB_HOST | default "10.99.0.43"}}'
  # Attachments live in the instance's Garage (tasks/garage.yml), with its dev key.
  API_GARAGE_ENDPOINT: '{{.API_GARAGE_ENDPOINT | default "http://10.99.0.44:3900"}}'
  API_GARAGE_BUCKET: '{{.API_GARAGE_BUCKET | default "restmail"}}'
  API_GARAGE_ACCESS_KEY: '{{.API_GARAGE_ACCESS_KEY | default "GK0123456789abcdef01234567"}}'
  API_GARAGE_SECRET_KEY: '{{.API_GARAGE_SECRET_KEY | default "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"}}'
  API_DB_PORT: '{{.API_DB_PORT | default "5432"}}'
  API_DB_NAME: '{{.API_DB_NAME | default "restmail"}}'
  API_DB_USER: '{{.API_DB_USER | default "restmail"}}'
  API_DB_PASS: '{{.API_DB_PASS | default "restmail"}}'
  API_JWT_SECRET: '{{.API_JWT_SECRET | default "dev-secret-change-in-production"}}'
  API_MASTER_KEY: '{{.API_MASTER_KEY | default "dev-master-key-change-in-production"}}'
  API_JS_FILTER_TOKEN: '{{.API_JS_FILTER_TOKEN | default "dev-js-filter-token-change-in-production"}}'
  # The testbed keeps every message's trace, not a sample, so a test can read
  # the trace of any message it sent.
  API_TRACE_SAMPLE_RATE: '{{.API_TRACE_SAMPLE_RATE | default "1"}}'
  API_LOG_LEVEL: '{{.API_LOG_LEVEL | default "debug"}}'
  API_ENVIRONMENT: '{{.API_ENVIRONMENT | default "development"}}'
  API_MAILNET_ONLY: '{{.API_MAILNET_ONLY | default "false"}}'
  API_PROXY_HOST: '{{.API_PROXY_HOST | default "restmail.localhost"}}'
  # Recovery links point at the HTTPS origin users reach the API through; the
  # API refuses email recovery without one.
  API_RECOVERY_EMAIL_BASE_URL: '{{.API_RECOVERY_EMAIL_BASE_URL | default (printf "https://%s" .API_PROXY_HOST)}}'
  # Internal mTLS (gateway → API). Off by default; when "true" the API serves
  # the gateway-facing routes on API_INTERNAL_MTLS_PORT requiring a client cert
  # from the internal CA. `chore instance:mtls:issue` issues them into
  # API_INTERNAL_MTLS_VOLUME; `up` copies the API's to /certs/internal-*.
  API_INTERNAL_MTLS: '{{.API_INTERNAL_MTLS | default "false"}}'
  API_INTERNAL_MTLS_PORT: '{{.API_INTERNAL_MTLS_PORT | default "8443"}}'
  # Go build tags for the dev image's build, empty for a normal one. Only the
  # contract fault run sets them (faultinject,fault_<name>: tests/contract/faults.yml).
  API_BUILD_TAGS: '{{.API_BUILD_TAGS | default ""}}'
  # Go coverage of the running API (#655), for the test topology only. When
  # "true" (dev mode only), the container builds ./cmd/api with `go build
  # -cover` and runs it directly instead of through air, so `docker stop` is a
  # SIGTERM to the API itself and its counters reach API_COVER_VOLUME, mounted
  # as GOCOVERDIR. It is a command override on the dev image: the Dockerfile and
  # the release images are untouched. `coverage:reset` and `coverage:report`
  # below collect it; `chore contract` calls both.
  API_COVER: '{{.API_COVER | default "false"}}'
  API_COVER_VOLUME: '{{.API_CONTAINER_NAME}}-gocover'

tasks:

  # ════════════════════════════════════════════════════════
  # build
  # ════════════════════════════════════════════════════════

  build:
    desc: Build the api image (target controlled by MODE — dev or prod)
    cmds:
      - |
        echo "  building {{.API_IMAGE}} (target={{.API_MODE}})"
        docker build -t {{.API_IMAGE}} --target {{.API_MODE}} -f Dockerfile . >$OUTPUT 2>&1
      - sh "{{.TASKFILE_DIR}}/docker-hygiene.sh" cap-build-cache

  # ════════════════════════════════════════════════════════
  # up / down / restart
  # ════════════════════════════════════════════════════════

  up:
    desc: Start the api container (creates attachments volume if missing; recreates container)
    deps: [build]
    cmds:
      - |
        if docker volume inspect {{.API_ATTACHMENTS_VOLUME}} >/dev/null 2>&1; then
          [ -n "$VERBOSE" ] && echo "  volume {{.API_ATTACHMENTS_VOLUME}} already exists" || true
        else
          echo "  creating volume {{.API_ATTACHMENTS_VOLUME}}"
          docker volume create --label "$RESTMAIL_LABEL" --label rest-mail.data=true {{.API_ATTACHMENTS_VOLUME}} >$OUTPUT 2>&1
        fi
      - |
        echo "  starting api ({{.API_CONTAINER_NAME}} @ {{.API_IP}}, mode={{.API_MODE}}, cover={{.API_COVER}})"
        # Air executes /app/tmp binaries; Go needs executable build/temp space.
        # Keep GOPATH (including sumdb state) and caches in bounded /tmp. Use
        # the image's preloaded modules as a read-only proxy before the network.
        if [ "{{.API_MODE}}" = "dev" ]; then
          DEV_FLAGS="--read-only -v $(pwd):/app \
            --tmpfs /app/tmp:rw,exec,nosuid,nodev,size=128m,mode=0700,uid=0,gid=0 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=1g,mode=1777 \
            -e GOPATH=/tmp/go -e GOMODCACHE=/tmp/go/pkg/mod \
            -e GOCACHE=/tmp/go-build-cache \
            -e GOPROXY=file:///go/pkg/mod/cache/download,https://proxy.golang.org,direct"
          if [ -n "${RESTMAIL_DEV_GOCACHE_VOLUME:-}" ]; then
            DEV_FLAGS="$DEV_FLAGS $("{{.TASKFILE_DIR}}/dev-gocache.sh" 0)"
          fi
          # Air's go build reads GOFLAGS, so the tags reach the binary it runs.
          if [ -n "{{.API_BUILD_TAGS}}" ]; then
            echo "  building the api with tags {{.API_BUILD_TAGS}}"
            DEV_FLAGS="$DEV_FLAGS -e GOFLAGS=-tags={{.API_BUILD_TAGS}}"
          fi
        else
          DEV_FLAGS=""
          if [ -n "{{.API_BUILD_TAGS}}" ]; then
            echo "ERROR: API_BUILD_TAGS needs mode=dev; the prod image is built without them" >&2
            exit 1
          fi
        fi
        # A cover build starts with an empty counter volume, so a report holds
        # only what this container ran. "$@" is the command after the image:
        # empty keeps the image's own (air), set replaces it.
        COVER_FLAGS=""
        set --
        if [ "{{.API_COVER}}" = "true" ]; then
          if [ "{{.API_MODE}}" != "dev" ]; then
            echo "ERROR: API_COVER=true needs API_MODE=dev: it builds the API from the mounted source" >&2
            exit 1
          fi
          docker volume create --label "$RESTMAIL_LABEL" {{.API_COVER_VOLUME}} >$OUTPUT 2>&1 || exit 1
          docker run --rm --label "$RESTMAIL_LABEL" -v {{.API_COVER_VOLUME}}:/gocover alpine:3.20 \
            find /gocover -mindepth 1 -delete >$OUTPUT 2>&1 || exit 1
          COVER_FLAGS="-v {{.API_COVER_VOLUME}}:/gocover -e GOCOVERDIR=/gocover"
          set -- sh -c 'go build -cover -o /app/tmp/api ./cmd/api && exec /app/tmp/api'
        fi
        docker rm -f {{.API_CONTAINER_NAME}} >$OUTPUT 2>&1 || true
        # The testbed dnsmasq must be the ONLY resolver (mounted resolv.conf, not
        # --dns): Docker's embedded DNS answers ahead of the --dns upstream for
        # names matching container hostnames — A-only, no MX/TXT/PTR — corrupting
        # the simulated internet the SPF/DKIM/DMARC/MTA-STS checks depend on.
        # Peer services (DB, api) are therefore addressed by static mailnet IPs.
        mkdir -p {{.ROOT_DIR}}/.cache
        printf 'nameserver %s\n' "{{.API_DNS_IP}}" > {{.ROOT_DIR}}/.cache/testbed-resolv.conf
        # The API is NOT published on a host port. It is an HTTP service with a
        # reverse-proxy route (docker-proxy.api.* below), so it is reached at
        # restmail.localhost/api — publishing it as well put it on 0.0.0.0:8080,
        # which is the whole LAN, not just this machine. The mail protocols still
        # publish, because SMTP/IMAP/POP3 are not HTTP and the proxy cannot carry
        # them; a mail client has no other way in.
        #
        # From the host: use the proxy route. From inside a container: the mailnet
        # IP, which is what the gateways already use. To poke it without either,
        # `docker exec rest-mail-api wget -qO- localhost:8080/api/health`.
        PUBLISH=""
        # Container hardening (OSI-17): no privilege escalation, drop ALL Linux
        # capabilities (the API binds the unprivileged :8080/:8443, so needs
        # none), plus pid/mem/cpu ceilings. Dev uses a read-only rootfs with
        # bounded tmpfs mounts for Air and Go; prod retains its CA entrypoint.
        HARDENING="--security-opt no-new-privileges:true \
          --cap-drop ALL \
          --pids-limit 1024 --memory 2g --cpus 2"
        # Its certificates: the testbed CA certificate to trust peers with and,
        # with internal mTLS on, the internal CA certificate and the API's server
        # keypair. Copied into a volume of its own, owned by the user it runs as
        # (root in the dev image, 10001 in the prod one), so it never mounts a CA
        # key (#193).
        INTERNAL=""
        if [ "{{.API_INTERNAL_MTLS}}" = "true" ]; then
          INTERNAL="{{.API_INTERNAL_MTLS_VOLUME}}:internal-ca.crt,internal-server.crt,internal-server.key"
        fi
        OWNER=0:0
        if [ "{{.API_MODE}}" = "prod" ]; then OWNER=10001:10001; fi
        "{{.TASKFILE_DIR}}/stage-certs.sh" {{.API_OWN_CERTS_VOLUME}} "$OWNER" \
          "{{.API_CERTS_VOLUME}}:ca.crt?" $INTERNAL || exit 1
        # Secrets (DB_PASS/JWT_SECRET/MASTER_KEY/JS_FILTER_TOKEN) are handed to
        # the container via a 0600 env-file rather than -e flags, so they never sit on the
        # `docker run` command line (host process list, shell history, CI logs)
        # or on disk world-readably. The file is removed once docker has read it.
        SECRETS_ENV="{{.ROOT_DIR}}/.cache/{{.API_CONTAINER_NAME}}.secrets.env"
        trap 'rm -f "$SECRETS_ENV"' EXIT
        rm -f "$SECRETS_ENV"
        # Create empty, chmod 0600, THEN write the secrets (Task's shell lacks umask).
        : > "$SECRETS_ENV"
        chmod 600 "$SECRETS_ENV"
        printf 'DB_PASS=%s\n'    "{{.API_DB_PASS}}"    >  "$SECRETS_ENV"
        printf 'JWT_SECRET=%s\n' "{{.API_JWT_SECRET}}" >> "$SECRETS_ENV"
        printf 'MASTER_KEY=%s\n' "{{.API_MASTER_KEY}}" >> "$SECRETS_ENV"
        printf 'JS_FILTER_TOKEN=%s\n' "{{.API_JS_FILTER_TOKEN}}" >> "$SECRETS_ENV"
        printf 'ATTACHMENT_S3_ACCESS_KEY_ID=%s\n' "{{.API_GARAGE_ACCESS_KEY}}" >> "$SECRETS_ENV"
        printf 'ATTACHMENT_S3_SECRET_ACCESS_KEY=%s\n' "{{.API_GARAGE_SECRET_KEY}}" >> "$SECRETS_ENV"
        # Resolve only the sidecar through Docker inspection, leaving the
        # mounted testbed resolver authoritative for every DNS query. Connect
        # both networks before starting the API to avoid a sidecar startup race.
        JS_FILTER_IP=$(sh "{{.TASKFILE_DIR}}/js-filter-network.sh" address "{{.API_PROJECT}}") || exit 1
        docker create --name {{.API_CONTAINER_NAME}} --label "$RESTMAIL_LABEL" \
          $HARDENING \
          --restart unless-stopped \
          --network {{.API_NETWORK}} \
          --ip {{.API_IP}} \
          -v {{.ROOT_DIR}}/.cache/testbed-resolv.conf:/etc/resolv.conf:ro \
          $PUBLISH \
          -v {{.API_OWN_CERTS_VOLUME}}:/certs:ro \
          -v {{.API_ATTACHMENTS_VOLUME}}:/attachments \
          $DEV_FLAGS \
          $COVER_FLAGS \
          -l docker-proxy.api.host={{.API_PROXY_HOST}} \
          -l docker-proxy.api.port={{.API_PORT}} \
          -l docker-proxy.api.path=/api \
          -e ATTACHMENT_STORAGE_TYPE=s3 \
          -e ATTACHMENT_S3_ENDPOINT={{.API_GARAGE_ENDPOINT}} \
          -e ATTACHMENT_S3_REGION=garage \
          -e ATTACHMENT_S3_BUCKET={{.API_GARAGE_BUCKET}} \
          -e DB_HOST={{.API_DB_HOST}} \
          -e DB_PORT={{.API_DB_PORT}} \
          -e DB_NAME={{.API_DB_NAME}} \
          -e DB_USER={{.API_DB_USER}} \
          -e API_PORT={{.API_PORT}} \
          -e GATEWAY_HOSTNAME={{.API_RESTMAIL_HOSTNAME}} \
          -e RESTMAIL_RECOVERY_EMAIL_BASE_URL={{.API_RECOVERY_EMAIL_BASE_URL}} \
          -e JS_FILTER_URL="http://$JS_FILTER_IP:3100" \
          -e TRACE_SAMPLE_RATE={{.API_TRACE_SAMPLE_RATE}} \
          --env-file "$SECRETS_ENV" \
          -e ENVIRONMENT={{.API_ENVIRONMENT}} \
          -e LOG_LEVEL={{.API_LOG_LEVEL}} \
          -e INTERNAL_MTLS_ENABLED={{.API_INTERNAL_MTLS}} \
          -e INTERNAL_MTLS_PORT={{.API_INTERNAL_MTLS_PORT}} \
          -e INTERNAL_MTLS_CA_CERT=/certs/internal-ca.crt \
          -e INTERNAL_MTLS_SERVER_CERT=/certs/internal-server.crt \
          -e INTERNAL_MTLS_SERVER_KEY=/certs/internal-server.key \
          {{.API_IMAGE}} "$@" >$OUTPUT 2>&1 || exit 1
        docker network connect "{{.API_PROJECT}}-js-filter-net" {{.API_CONTAINER_NAME}} >$OUTPUT 2>&1 || exit 1
        docker start {{.API_CONTAINER_NAME}} >$OUTPUT 2>&1

  down:
    desc: Stop and remove the api container (preserves the attachments volume)
    cmds:
      - |
        if docker ps -aq --filter "name=^/{{.API_CONTAINER_NAME}}$" | grep -q .; then
          echo "  stopping {{.API_CONTAINER_NAME}}"
          docker rm -f {{.API_CONTAINER_NAME}} >$OUTPUT 2>&1
        else
          echo "  {{.API_CONTAINER_NAME}} not running"
        fi

  restart:
    desc: Recreate the api container
    cmds:
      - task: down
      - task: up

  # ════════════════════════════════════════════════════════
  # Coverage of a cover-built API (API_COVER, #655)
  # ════════════════════════════════════════════════════════
  # Both detect a cover build from the container's GOCOVERDIR and do nothing
  # without one, so `chore contract` can call them against any topology. A Go
  # program writes its counters only when it exits cleanly, so both stop the API
  # with a SIGTERM (`docker stop`) and start it again.

  coverage:reset:
    desc: 'Restart a cover-built API with empty coverage counters, so a report holds only what runs after it'
    cmds:
      - |
        if ! docker inspect -f '{{`{{range .Config.Env}}{{println .}}{{end}}`}}' {{.API_CONTAINER_NAME}} 2>/dev/null | grep -q '^GOCOVERDIR='; then
          echo "  {{.API_CONTAINER_NAME}} is not a cover build; no coverage to reset"
          exit 0
        fi
        echo "  restarting {{.API_CONTAINER_NAME}} with empty coverage counters"
        docker stop -t 60 {{.API_CONTAINER_NAME}} >$OUTPUT 2>&1 || exit 1
        docker run --rm --label "$RESTMAIL_LABEL" -v {{.API_COVER_VOLUME}}:/gocover alpine:3.20 \
          find /gocover -mindepth 1 -delete >$OUTPUT 2>&1 || exit 1
        docker start {{.API_CONTAINER_NAME}} >$OUTPUT 2>&1 || exit 1
        # It rebuilds before it listens: its build cache is on a tmpfs.
        i=0
        until docker exec {{.API_CONTAINER_NAME}} wget -q -O /dev/null "http://localhost:{{.API_PORT}}/api/health" >/dev/null 2>&1; do
          i=$((i+1))
          if [ $i -ge 180 ]; then
            echo "ERROR: {{.API_CONTAINER_NAME}} did not become healthy within 180s" >&2
            exit 1
          fi
          sleep 1
        done
        echo "  api healthy"

  coverage:report:
    desc: 'Stop a cover-built API so it writes its counters, merge them into .cache/contract/api-coverage, and start it again'
    cmds:
      - |
        if ! docker inspect -f '{{`{{range .Config.Env}}{{println .}}{{end}}`}}' {{.API_CONTAINER_NAME}} 2>/dev/null | grep -q '^GOCOVERDIR='; then
          echo "  {{.API_CONTAINER_NAME}} is not a cover build; no coverage to report"
          exit 0
        fi
        out="{{.ROOT_DIR}}/.cache/contract/api-coverage"
        rm -rf "$out"
        mkdir -p "$out"
        image=$(docker inspect -f '{{`{{.Image}}`}}' {{.API_CONTAINER_NAME}}) || exit 1
        echo "  stopping {{.API_CONTAINER_NAME}} so it writes its coverage counters"
        docker stop -t 60 {{.API_CONTAINER_NAME}} >$OUTPUT 2>&1 || exit 1
        # The Go that wrote the counters reads them: the container's own image,
        # as the invoking user so the files it writes are theirs.
        merged=0
        docker run --rm --label "$RESTMAIL_LABEL" --network none --user "$(id -u):$(id -g)" \
          -e HOME=/tmp -e GOCACHE=/tmp/go-build-cache -w /tmp \
          -v {{.API_COVER_VOLUME}}:/gocover:ro -v "$out":/out \
          "$image" \
          sh -c 'go tool covdata textfmt -i=/gocover -o=/out/api-coverage.out && go tool covdata percent -i=/gocover > /out/packages.txt' \
          || merged=$?
        echo "  starting {{.API_CONTAINER_NAME}} again"
        docker start {{.API_CONTAINER_NAME}} >$OUTPUT 2>&1 || exit 1
        i=0
        until docker exec {{.API_CONTAINER_NAME}} wget -q -O /dev/null "http://localhost:{{.API_PORT}}/api/health" >/dev/null 2>&1; do
          i=$((i+1))
          if [ $i -ge 180 ]; then
            echo "ERROR: {{.API_CONTAINER_NAME}} did not become healthy within 180s" >&2
            exit 1
          fi
          sleep 1
        done
        echo "  api healthy"
        if [ "$merged" -ne 0 ]; then
          echo "ERROR: the coverage counters could not be merged; with no counter files, the API did not exit cleanly" >&2
          exit 1
        fi
        # The total counts each block of the merged profile once: its statements,
        # and whether any run reached it.
        total=$(awk 'NR > 1 { n[$1] = $2; if ($3 > 0) hit[$1] = 1 }
          END {
            for (b in n) { all += n[b]; if (b in hit) run += n[b] }
            if (all > 0) printf "%.1f%% (%d of %d statements)", 100 * run / all, run, all
            else printf "no statements"
          }' "$out/api-coverage.out")
        module=$(awk '$1 == "module" { print $2 }' "{{.ROOT_DIR}}/go.mod")
        {
          echo "## API code coverage of the contract run"
          echo
          echo "The API's statements that ran while the contract phases sent their requests: **$total**."
          echo "Measured by a \`go build -cover\` API in the E2E topology. A report: nothing fails on it."
          echo
          echo "| Package | Statements run |"
          echo "| --- | ---: |"
          awk -v prefix="$module/" '$2 == "coverage:" {
              pkg = $1; sub("^" prefix, "", pkg)
              pct = ($3 ~ /%$/) ? $3 : "no statements"
              printf "| `%s` | %s |\n", pkg, pct
            }' "$out/packages.txt" | sort
        } > "$out/summary.md"
        cat "$out/summary.md"

  # ════════════════════════════════════════════════════════
  # Diagnostics
  # ════════════════════════════════════════════════════════

  logs:
    desc: Tail api logs
    cmds:
      - docker logs -f --tail=100 {{.API_CONTAINER_NAME}}
