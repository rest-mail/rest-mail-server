version: "3"

# rest-mail/tasks/webmail — Taskfile
#
# Drives the webmail frontend container via plain `docker run` (no compose).
# Included by the main Taskfile under namespace `webmail`.
#
# Joins the testbed's mailnet network at a static IP. Two build targets are
# supported via MODE: `dev` (Vite HMR on port 3000, repo bind-mounted at /app)
# and `prod` (unprivileged nginx serving the built bundle on port 8080). No host port
# mapping in either mode — traffic is routed via docker-proxy labels.
#
# Output is friendly by default. Re-run with VERBOSE=1 to see the raw
# docker / shell output (e.g. VERBOSE=1 task webmail:up).

silent: true

vars:
  WEBMAIL_PROJECT: '{{.WEBMAIL_PROJECT | default "rest-mail"}}'
  WEBMAIL_NETWORK: '{{.WEBMAIL_NETWORK | default "testbed_mailnet"}}'
  WEBMAIL_IP: '{{.WEBMAIL_IP | default "10.99.0.21"}}'
  WEBMAIL_MODE: '{{.WEBMAIL_MODE | default "dev"}}'
  WEBMAIL_IMAGE_TAG: '{{.WEBMAIL_IMAGE_TAG | default "dev"}}'
  WEBMAIL_REGISTRY: '{{.WEBMAIL_REGISTRY | default "ghcr.io/rest-mail"}}'
  WEBMAIL_IMAGE: '{{.WEBMAIL_REGISTRY}}/webmail:{{.WEBMAIL_IMAGE_TAG}}'
  WEBMAIL_CONTAINER_NAME: '{{.WEBMAIL_PROJECT}}-webmail'
  WEBMAIL_BUILD_CONTEXT: '{{.WEBMAIL_BUILD_CONTEXT | default "./webmail"}}'
  WEBMAIL_BASE_PATH: '{{.WEBMAIL_BASE_PATH | default "/webmail"}}'
  WEBMAIL_API_URL: '{{.WEBMAIL_API_URL | default "http://restmail.localhost/api/v1"}}'
  WEBMAIL_PROXY_HOST: '{{.WEBMAIL_PROXY_HOST | default "restmail.localhost"}}'
  WEBMAIL_DEV_PORT: '3000'
  WEBMAIL_PROD_PORT: '8080'
  # Named (not anonymous) volume for /app/node_modules in MODE=dev, so a
  # throwaway installer container can populate it before the app container
  # starts. Docker seeds it from the image on first use, and it persists after
  # that, which keeps `pnpm install` incremental.
  WEBMAIL_MODULES_VOLUME: '{{.WEBMAIL_PROJECT}}-webmail-node-modules'

tasks:

  # ════════════════════════════════════════════════════════
  # build
  # ════════════════════════════════════════════════════════

  build:
    desc: Build the webmail image (target controlled by MODE — dev or prod)
    cmds:
      - |
        echo "  building {{.WEBMAIL_IMAGE}} (target={{.WEBMAIL_MODE}})"
        if [ "{{.WEBMAIL_MODE}}" = "prod" ]; then
          docker build -t {{.WEBMAIL_IMAGE}} --target prod --build-arg NGINX_BASE_PATH={{.WEBMAIL_BASE_PATH}} {{.WEBMAIL_BUILD_CONTEXT}} >$OUTPUT 2>&1
        else
          docker build -t {{.WEBMAIL_IMAGE}} --target dev {{.WEBMAIL_BUILD_CONTEXT}} >$OUTPUT 2>&1
        fi

  # ════════════════════════════════════════════════════════
  # up / down / restart
  # ════════════════════════════════════════════════════════

  deps:
    desc: 'Install webmail node_modules from the frozen lockfile, in a throwaway container (MODE=dev only)'
    cmds:
      - |
        # A container runs what its image contains and installs nothing at
        # startup — the dev image's CMD is Vite and nothing else.
        #
        # MODE=dev bind-mounts the host tree at /app, so the mounted
        # pnpm-lock.yaml can move ahead of the modules volume (a merged
        # dependency change, a branch switch). Vite then fails to resolve the new
        # import while the container keeps serving happily — how the missing
        # @fontsource/* deps from #262 stayed invisible.
        #
        # The install therefore runs in a THROWAWAY container that mounts the
        # same volume and runs nothing else. Installing into the running app
        # container instead does not work: pnpm purges node_modules first, which
        # kills Vite, the restart policy restarts the container, and that
        # SIGKILLs the install half-done.
        #
        # --frozen-lockfile installs exactly what is pinned and fails rather than
        # resolving anything new. CI=true keeps the purge non-interactive.
        if [ "{{.WEBMAIL_MODE}}" != "dev" ]; then
          echo "  webmail is MODE={{.WEBMAIL_MODE}} — the image already contains its modules"
          exit 0
        fi
        echo "  installing webmail node_modules from pnpm-lock.yaml"
        docker run --rm \
          -v "$(pwd)/webmail:/app" \
          -v {{.WEBMAIL_MODULES_VOLUME}}:/app/node_modules \
          -w /app \
          -e CI=true \
          --entrypoint pnpm \
          {{.WEBMAIL_IMAGE}} install --frozen-lockfile >$OUTPUT 2>&1

  up:
    desc: Start the webmail container (recreates if already present)
    deps: [build]
    cmds:
      - |
        echo "  starting webmail ({{.WEBMAIL_CONTAINER_NAME}} @ {{.WEBMAIL_IP}}, mode={{.WEBMAIL_MODE}})"
        docker rm -f {{.WEBMAIL_CONTAINER_NAME}} >$OUTPUT 2>&1 || true
      # Modules are brought in line with the lockfile while nothing is running,
      # so the app container only ever starts against a complete tree.
      - task: deps
      - |
        # Container hardening (OSI-17): no privilege escalation, drop ALL Linux
        # capabilities — nothing here binds a privileged port, since prod runs
        # the unprivileged nginx image on :8080 as uid 101 and the dev Vite
        # server listens on :3000 — plus pid/mem/cpu ceilings. Serves static
        # assets only, no secrets in env.
        HARDENING="--security-opt no-new-privileges:true \
          --cap-drop ALL \
          --pids-limit 512 --memory 1g --cpus 1.5"
        if [ "{{.WEBMAIL_MODE}}" = "prod" ]; then
          docker run -d --name {{.WEBMAIL_CONTAINER_NAME}} \
            $HARDENING \
            --restart unless-stopped \
            --network {{.WEBMAIL_NETWORK}} \
            --ip {{.WEBMAIL_IP}} \
            -e NGINX_BASE_PATH={{.WEBMAIL_BASE_PATH}} \
            -e VITE_API_URL={{.WEBMAIL_API_URL}} \
            -l docker-proxy.webmail.host={{.WEBMAIL_PROXY_HOST}} \
            -l docker-proxy.webmail.port={{.WEBMAIL_PROD_PORT}} \
            -l docker-proxy.webmail.path={{.WEBMAIL_BASE_PATH}} \
            {{.WEBMAIL_IMAGE}} >$OUTPUT 2>&1
        else
          docker run -d --name {{.WEBMAIL_CONTAINER_NAME}} \
            $HARDENING \
            --restart unless-stopped \
            --network {{.WEBMAIL_NETWORK}} \
            --ip {{.WEBMAIL_IP}} \
            -v "$(pwd)/webmail:/app" \
            -v {{.WEBMAIL_MODULES_VOLUME}}:/app/node_modules \
            -e VITE_BASE_PATH={{.WEBMAIL_BASE_PATH}} \
            -e VITE_API_URL={{.WEBMAIL_API_URL}} \
            -l docker-proxy.webmail.host={{.WEBMAIL_PROXY_HOST}} \
            -l docker-proxy.webmail.port={{.WEBMAIL_DEV_PORT}} \
            -l docker-proxy.webmail.path={{.WEBMAIL_BASE_PATH}} \
            -l docker-proxy.webmail.websocket=true \
            {{.WEBMAIL_IMAGE}} >$OUTPUT 2>&1
        fi

  down:
    desc: Stop and remove the webmail container
    cmds:
      - |
        if docker ps -aq --filter "name=^/{{.WEBMAIL_CONTAINER_NAME}}$" | grep -q .; then
          echo "  stopping {{.WEBMAIL_CONTAINER_NAME}}"
          docker rm -f {{.WEBMAIL_CONTAINER_NAME}} >$OUTPUT 2>&1
        else
          echo "  {{.WEBMAIL_CONTAINER_NAME}} not running"
        fi

  restart:
    desc: Recreate the webmail container
    cmds:
      - task: down
      - task: up

  # ════════════════════════════════════════════════════════
  # Diagnostics
  # ════════════════════════════════════════════════════════

  logs:
    desc: Tail webmail logs
    cmds:
      - docker logs -f --tail=100 {{.WEBMAIL_CONTAINER_NAME}}
