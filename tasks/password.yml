version: "3"

# Two acts that answer the same need at different times:
#
#   password:new     makes a string. There is no server yet, so it resets
#                    nothing; it is the one generator guaranteed to satisfy the
#                    server's rules — long enough, and made of characters that
#                    survive a shell. For handing to whoever installs later, or
#                    to a pipeline's secrets.
#   password:reset   acts on a running server: a new password for an admin who
#                    has lost theirs, shown once, and the account back in setup.
#                    Not an emailed link — on a mail server that is circular —
#                    but a pod in the namespace, needing no mail, DNS or
#                    certificate, and not even the API running.

silent: true

vars:
  CONTEXT:
    sh: kubectl config current-context 2>/dev/null || echo '(no current context)'

tasks:
  new:
    dotenv: []
    desc: "Make an admin password for an install that does not exist yet, and show it once"
    cmds:
      - |
        . '{{.TASKFILE_DIR}}/lifecycle/lib.sh'
        pw=$(new_password)
        cat <<EOF

          $pw

        Give it to whoever installs, or to a pipeline's secrets, and pass it as
        --password "\$THAT_VARIABLE" — never as text on a command line.

          gh secret set RESTMAIL_ADMIN_PASSWORD     (paste it when asked)

        EOF

  reset:
    dotenv: []
    interactive: true
    desc: "Give an account a new password, shown once — for when theirs is lost or expired"
    args:
      - name: address
        desc: whose (default admin@ the release's mail domain)
      - name: name
        desc: the Helm release name (default restmail)
      - name: namespace
        desc: the namespace (default rest-mail)
    vars:
      ADDRESS: ""
      NAME: restmail
      NAMESPACE: rest-mail
    preconditions:
      - sh: command -v helm >/dev/null && command -v kubectl >/dev/null && command -v jq >/dev/null
        msg: "This needs helm, kubectl and jq"
    confirm:
      text: 'Reset "{{if .ADDRESS}}{{.ADDRESS}}{{else}}admin@ the mail domain{{end}}" on rest-mail "{{.NAME}}" in {{.NAMESPACE}}, on "{{.CONTEXT}}"? Their password and authenticator stop working and every session they have ends.'
    cmds:
      - cmd: '"{{.TASKFILE_DIR}}/lifecycle/recover.sh" password'
        silent: true
