version: "3"

# rest-mail/tasks/js-filter — Taskfile fragment
#
# Drives the js-filter sidecar container via plain `docker run`.
# Included by the main Taskfile under namespace `js-filter`.
#
# Paths inside this file are relative to the file's own dir; when included
# from the project root (`dir: ../`) `BUILD_CONTEXT` resolves correctly.
#
# Output is friendly by default. Re-run with VERBOSE=1 to see the raw
# docker / shell output (e.g. VERBOSE=1 task js-filter:up).

silent: true

vars:
  JS_FILTER_PROJECT: '{{.JS_FILTER_PROJECT | default "rest-mail"}}'
  JS_FILTER_NETWORK: '{{.JS_FILTER_NETWORK | default "testbed_mailnet"}}'
  JS_FILTER_IP: '{{.JS_FILTER_IP | default "10.99.0.22"}}'
  JS_FILTER_IMAGE_TAG: '{{.JS_FILTER_IMAGE_TAG | default "dev"}}'
  JS_FILTER_CONTAINER_NAME: '{{.JS_FILTER_PROJECT}}-js-filter'
  JS_FILTER_REGISTRY: '{{.JS_FILTER_REGISTRY | default "ghcr.io/rest-mail"}}'
  JS_FILTER_IMAGE: '{{.JS_FILTER_REGISTRY}}/js-filter:{{.JS_FILTER_IMAGE_TAG}}'
  JS_FILTER_BUILD_CONTEXT: '{{.JS_FILTER_BUILD_CONTEXT | default "./projects/js-filter-sidecar"}}'

tasks:

  # ════════════════════════════════════════════════════════
  # build / up / down / restart
  # ════════════════════════════════════════════════════════

  build:
    desc: Build the js-filter sidecar image
    cmds:
      - |
        echo "  building {{.JS_FILTER_IMAGE}} from {{.JS_FILTER_BUILD_CONTEXT}}"
        docker build -t {{.JS_FILTER_IMAGE}} {{.JS_FILTER_BUILD_CONTEXT}} >$OUTPUT 2>&1

  up:
    desc: Start (or recreate) the js-filter sidecar container
    deps: [build]
    cmds:
      - |
        echo "  starting js-filter ({{.JS_FILTER_CONTAINER_NAME}} @ {{.JS_FILTER_IP}})"
        docker rm -f {{.JS_FILTER_CONTAINER_NAME}} >$OUTPUT 2>&1 || true
        # ── OSI-6: contain the admin-authored JS mail-filter runner ──────────
        # This container executes trusted-admin-authored filter scripts in a
        # Node `vm` sandbox, so it gets the strictest profile in the stack:
        #   * no-new-privileges + drop ALL capabilities (binds the unprivileged
        #     :3100, needs none) — no way to gain privilege from a filter.
        #   * read-only root filesystem with a small noexec/nosuid tmpfs for the
        #     only writable path a filter could need (/tmp scratch).
        #   * tight pid/mem/cpu ceilings to bound a runaway or abusive filter
        #     (the Node heap is already capped at 64 MiB via --max-old-space-size).
        #   * runs as the non-root `jsfilter` user baked into the image.
        # No secrets: this container is started with NO -e flags — it never sees
        # DB creds, JWT_SECRET, MASTER_KEY, or API tokens.
        # Egress: this container carries no outbound dependency of its own (it
        # only *receives* /execute + /validate calls from the API). Filter
        # scripts can only fetch() hosts explicitly allow-listed by the app, and
        # NO allow-list is configured here (JS_FILTER_ALLOWED_HOSTS unset), so
        # outbound HTTP is default-denied at the application layer. A dedicated
        # `internal: true` network is the intended container-level backstop but
        # is not adoptable from this repo alone: the API resolves the sidecar as
        # `http://js-filter:3100` via the testbed dnsmasq to a fixed mailnet IP
        # and bypasses Docker's embedded DNS, so the sidecar must stay on the
        # mailnet at {{.JS_FILTER_IP}} to remain reachable. Moving it behind an
        # internal network requires a testbed dnsmasq/addressing change — see PR
        # notes (OSI-6 follow-up).
        HARDENING="--security-opt no-new-privileges:true \
          --cap-drop ALL \
          --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m \
          --pids-limit 64 --memory 256m --cpus 0.5"
        docker run -d --name {{.JS_FILTER_CONTAINER_NAME}} \
          $HARDENING \
          --restart unless-stopped \
          --network {{.JS_FILTER_NETWORK}} \
          --ip {{.JS_FILTER_IP}} \
          --health-cmd 'nc -z localhost 3100 || exit 1' \
          --health-interval 10s \
          --health-timeout 5s \
          --health-retries 3 \
          {{.JS_FILTER_IMAGE}} >$OUTPUT 2>&1

  down:
    desc: Stop and remove the js-filter sidecar container (no-op if not running)
    cmds:
      - |
        if docker ps -aq --filter "name=^/{{.JS_FILTER_CONTAINER_NAME}}$" | grep -q .; then
          echo "  stopping {{.JS_FILTER_CONTAINER_NAME}}"
          docker rm -f {{.JS_FILTER_CONTAINER_NAME}} >$OUTPUT 2>&1
        else
          echo "  {{.JS_FILTER_CONTAINER_NAME}} not running"
        fi

  restart:
    desc: Recreate the js-filter sidecar container
    cmds:
      - task: down
      - task: up

  # ════════════════════════════════════════════════════════
  # Diagnostics
  # ════════════════════════════════════════════════════════

  logs:
    desc: Tail js-filter sidecar logs
    cmds:
      - docker logs -f --tail=100 {{.JS_FILTER_CONTAINER_NAME}}
