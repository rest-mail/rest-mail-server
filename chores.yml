version: "3"

# silent: true hides the `task: [name] cmd` prelude. Use `chore -v` on the
# CLI to bring the prelude back when debugging. Each tasks/*.yml include
# also sets silent: true on its own scope.
silent: true

# OUTPUT redirects raw command stdout. Default is /dev/null (quiet); set
# VERBOSE=1 to send raw output to stdout instead. Defined here at the
# top level via env: with sh:, which propagates as a shell env var to
# every task in this file AND every task in the included tasks/*.yml
# files. Per-cmd usage: `docker build … >$OUTPUT 2>&1` — no per-block
# `[ -n "${VERBOSE}" ] && OUTPUT=…` boilerplate needed.
env:
  COMPOSE_PROJECT_NAME: rest-mail
  OUTPUT:
    sh: '[ -n "$VERBOSE" ] && echo /dev/stdout || echo /dev/null'
  # Per-user toggles live in .env.local (gitignored). `chore project:toggle
  # <key>=<value>` writes/updates a key there; the line below sources it
  # if present so individual toggles propagate as env vars / template vars.
  # Add a new sh: line per toggle as the surface grows.
  WEBSITE_MODE:
    sh: '[ -f .env.local ] && (. ./.env.local; echo "${WEBSITE_MODE:-prod}") || echo prod'

# ════════════════════════════════════════════════════════
# Centralized vars — single source of truth for ports, IPs, hostnames,
# credentials, and image tags. Per-service Taskfiles in tasks/ inherit
# these via the `includes:` block below. Future: derive testbed DNS
# zone records from these values to simulate a real mail server zone.
# ════════════════════════════════════════════════════════
vars:
  GO_MODULE: github.com/restmail/restmail

  # Which config to drive. A CONFIG is a runnable definition living at
  # config/<CONFIG>/ (manifest.yml, config.env, secrets.env); `chore config:render`
  # regenerates config.env from the manifest. An *instance* is what exists once
  # you run one — containers — so the runtime verbs are `chore instance:up|down`
  # and the definition verbs are `chore config:render|check|scaffold`.
  # The RESTMAIL_*/RESTMAIL_* values + secrets load via dotenv (below).
  #
  # INSTANCE= and INSTANCE_DIR= are still accepted as aliases for the previous
  # names, so anything you already type keeps working.
  CONFIG: '{{.CONFIG | default .NAME | default .INSTANCE | default "restmail.test"}}'
  # One authoritative layout: EVERY config — scaffolded or testbed-owned —
  # resolves under config/<CONFIG>/. The product ships no committed config. The
  # primary test config (restmail.test) is seeded by `chore testbed:init`, which
  # COPIES the testbed's configs/restmail fixture in — it is never linked, so
  # nothing the stack reads at runtime lives inside a dev clone
  # (`chore project:check:runtime` enforces that). The copy is gitignored.
  # Override CONFIG_DIR to point anywhere relative to the repo root.
  CONFIG_DIR: '{{if .CONFIG_DIR}}{{.CONFIG_DIR}}{{else if .INSTANCE_DIR}}{{.INSTANCE_DIR}}{{else}}config/{{.CONFIG}}{{end}}'

  # Adjacent testbed services that are NOT part of the mail instance proper,
  # so they stay here rather than in the instance manifest: the marketing
  # website (a decomposed clone-on-demand subproject) and the monitoring
  # include. The RESTMAIL_WEBSITE_/MONITORING_ prefixes avoid collision with
  # subproject include vars — chore flattens all included vars into one shared
  # namespace at invocation time.
  RESTMAIL_WEBSITE_IP: 10.99.0.26
  MONITORING_PROMETHEUS_IP: 10.99.0.30
  MONITORING_GRAFANA_IP: 10.99.0.31
  MONITORING_POSTGRES_EXPORTER_IP: 10.99.0.32

# Per-instance config + secrets, loaded from the rendered manifest instead of
# hardcoded vars. config.env is generated by `chore config:render` and
# committed; secrets.env is gitignored — a fresh clone without it is fine, since
# Task skips absent dotenv files and the *_DB_PASS/*_SECRET include mappings
# fall back to dev defaults.
dotenv:
  - '{{.CONFIG_DIR}}/config.env'
  - '{{.CONFIG_DIR}}/secrets.env'

# ════════════════════════════════════════════════════════
# Includes
#
# Subproject Taskfiles are pulled in so all their operational tasks (up,
# down, smoke, dig, ...) flow through automatically. `optional: true`
# lets a fresh checkout work before *:init has run; tasks under that
# namespace become available once the directory exists.
#
# Each tasks/<service>.yml is included with vars passed from the
# centralized vars block above so values stay in one place.
# ════════════════════════════════════════════════════════
includes:
  # ── Local services (this repo) ──────────────────────────
  # Subproject includes (testbed, mailserver:*) come AFTER these. Task
  # processes includes in document order and each include's vars block
  # bleeds into the resolution context for subsequent includes — so any
  # include that references {{.RESTMAIL_PROJECT}} etc. must come before the
  # subproject includes that override those names.
  postgres:
    taskfile: ./tasks/postgres.yml
    vars:
      POSTGRES_PROJECT: '{{.RESTMAIL_PROJECT}}'
      POSTGRES_NETWORK: '{{.RESTMAIL_NETWORK}}'
      POSTGRES_IP: '{{.RESTMAIL_POSTGRES_IP}}'
      POSTGRES_DB_NAME: '{{.RESTMAIL_DB_NAME}}'
      POSTGRES_DB_USER: '{{.RESTMAIL_DB_USER}}'
      POSTGRES_DB_PASS: '{{.RESTMAIL_DB_PASS | default "restmail"}}'

  js-filter:
    taskfile: ./tasks/js-filter.yml
    vars:
      JS_FILTER_PROJECT: '{{.RESTMAIL_PROJECT}}'
      JS_FILTER_NETWORK: '{{.RESTMAIL_NETWORK}}'
      JS_FILTER_IP: '{{.RESTMAIL_JS_FILTER_IP}}'
      JS_FILTER_IMAGE_TAG: '{{.RESTMAIL_IMAGE_TAG}}'
      JS_FILTER_REGISTRY: '{{.RESTMAIL_REGISTRY}}'

  api:
    taskfile: ./tasks/api.yml
    vars:
      API_PROJECT: '{{.RESTMAIL_PROJECT}}'
      API_NETWORK: '{{.RESTMAIL_NETWORK}}'
      API_CERTS_VOLUME: '{{.RESTMAIL_CERTS_VOLUME}}'
      API_DNS_IP: '{{.RESTMAIL_TESTBED_DNS_IP}}'
      API_IP: '{{.RESTMAIL_API_IP}}'
      API_PORT: '{{.RESTMAIL_API_PORT}}'
      API_MODE: dev
      API_IMAGE_TAG: '{{.RESTMAIL_IMAGE_TAG}}'
      API_REGISTRY: '{{.RESTMAIL_REGISTRY}}'
      API_DB_HOST: '{{.RESTMAIL_POSTGRES_IP}}'
      API_DB_NAME: '{{.RESTMAIL_DB_NAME}}'
      API_DB_USER: '{{.RESTMAIL_DB_USER}}'
      API_DB_PASS: '{{.RESTMAIL_DB_PASS | default "restmail"}}'
      API_JWT_SECRET: '{{.RESTMAIL_JWT_SECRET | default "dev-secret-change-in-production"}}'
      API_MASTER_KEY: '{{.RESTMAIL_MASTER_KEY | default "dev-master-key-change-in-production"}}'
      API_LOG_LEVEL: '{{.RESTMAIL_LOG_LEVEL}}'
      API_ENVIRONMENT: '{{.RESTMAIL_ENVIRONMENT}}'
      API_MAILNET_ONLY: '{{.RESTMAIL_MAILNET_ONLY}}'
      # Internal mTLS: driven by the per-instance RESTMAIL_INTERNAL_MTLS switch
      # (manifest `internal_mtls: true`). Defaults off — unchanged behavior.
      API_INTERNAL_MTLS: '{{.RESTMAIL_INTERNAL_MTLS | default "false"}}'
      API_INTERNAL_MTLS_PORT: '{{.RESTMAIL_INTERNAL_MTLS_PORT | default "8443"}}'

  smtp-gateway:
    taskfile: ./tasks/smtp-gateway.yml
    vars:
      SMTP_GATEWAY_PROJECT: '{{.RESTMAIL_PROJECT}}'
      SMTP_GATEWAY_NETWORK: '{{.RESTMAIL_NETWORK}}'
      SMTP_GATEWAY_CERTS_VOLUME: '{{.RESTMAIL_CERTS_VOLUME}}'
      SMTP_GATEWAY_DNS_IP: '{{.RESTMAIL_TESTBED_DNS_IP}}'
      SMTP_GATEWAY_IP: '{{.RESTMAIL_SMTP_IP}}'
      SMTP_GATEWAY_RESTMAIL_HOSTNAME: '{{.RESTMAIL_HOSTNAME}}'
      SMTP_GATEWAY_MODE: dev
      SMTP_GATEWAY_IMAGE_TAG: '{{.RESTMAIL_IMAGE_TAG}}'
      SMTP_GATEWAY_REGISTRY: '{{.RESTMAIL_REGISTRY}}'
      SMTP_GATEWAY_DB_HOST: '{{.RESTMAIL_POSTGRES_IP}}'
      # API_BASE_URL always targets the PUBLIC listener (token/credential + user
      # routes). With internal mTLS on, only the two machine routes use the
      # separate API_INTERNAL_BASE_URL (the https internal listener).
      SMTP_GATEWAY_API_BASE_URL: 'http://{{.RESTMAIL_API_IP}}:{{.RESTMAIL_API_PORT}}'
      SMTP_GATEWAY_INTERNAL_MTLS: '{{.RESTMAIL_INTERNAL_MTLS | default "false"}}'
      SMTP_GATEWAY_API_INTERNAL_BASE_URL: '{{if eq (.RESTMAIL_INTERNAL_MTLS | default "false") "true"}}https://{{.RESTMAIL_API_IP}}:{{.RESTMAIL_INTERNAL_MTLS_PORT | default "8443"}}{{end}}'
      SMTP_GATEWAY_TLS_CERT_PATH: '/certs/{{.RESTMAIL_HOSTNAME}}.crt'
      SMTP_GATEWAY_TLS_KEY_PATH: '/certs/{{.RESTMAIL_HOSTNAME}}.key'
      SMTP_GATEWAY_DB_NAME: '{{.RESTMAIL_DB_NAME}}'
      SMTP_GATEWAY_DB_USER: '{{.RESTMAIL_DB_USER}}'
      SMTP_GATEWAY_DB_PASS: '{{.RESTMAIL_DB_PASS | default "restmail"}}'
      # Same source and default as API_MASTER_KEY above, so the gateway worker
      # decrypts the same at-rest DKIM keys the API encrypted and can DKIM-sign
      # SMTP-submitted outbound mail (#171). They can never diverge.
      SMTP_GATEWAY_MASTER_KEY: '{{.RESTMAIL_MASTER_KEY | default "dev-master-key-change-in-production"}}'
      SMTP_GATEWAY_PORT_INBOUND: '{{.RESTMAIL_SMTP_PORT_INBOUND}}'
      SMTP_GATEWAY_PORT_SUBMISSION_TLS: '{{.RESTMAIL_SMTP_PORT_SUBMISSION_TLS}}'
      SMTP_GATEWAY_LOG_LEVEL: '{{.RESTMAIL_LOG_LEVEL}}'
      SMTP_GATEWAY_ENVIRONMENT: '{{.RESTMAIL_ENVIRONMENT}}'
      SMTP_GATEWAY_MAILNET_ONLY: '{{.RESTMAIL_MAILNET_ONLY}}'
      # SMTP/queue policy knobs (manifest `smtp:` block). Each is optional:
      # unset in the manifest → the RESTMAIL_SMTP_* var is absent → this renders
      # empty → the catalog `| default` + config.go fallback apply, so instances
      # without an `smtp:` block behave exactly as before.
      SMTP_GATEWAY_MAX_MESSAGE_SIZE: '{{.RESTMAIL_SMTP_MAX_MESSAGE_SIZE | default ""}}'
      SMTP_GATEWAY_MIN_TRANSFER_RATE: '{{.RESTMAIL_SMTP_MIN_TRANSFER_RATE | default ""}}'
      SMTP_GATEWAY_TRANSFER_GRACE_PERIOD: '{{.RESTMAIL_SMTP_TRANSFER_GRACE_PERIOD | default ""}}'
      SMTP_GATEWAY_TRANSFER_STALL_TIMEOUT: '{{.RESTMAIL_SMTP_TRANSFER_STALL_TIMEOUT | default ""}}'
      SMTP_GATEWAY_QUEUE_WORKERS: '{{.RESTMAIL_SMTP_QUEUE_WORKERS | default ""}}'
      SMTP_GATEWAY_QUEUE_POLL_INTERVAL: '{{.RESTMAIL_SMTP_QUEUE_POLL_INTERVAL | default ""}}'
      SMTP_GATEWAY_MTASTS_ENFORCE: '{{.RESTMAIL_SMTP_MTASTS_ENFORCE | default ""}}'

  imap-gateway:
    taskfile: ./tasks/imap-gateway.yml
    vars:
      IMAP_GATEWAY_PROJECT: '{{.RESTMAIL_PROJECT}}'
      IMAP_GATEWAY_NETWORK: '{{.RESTMAIL_NETWORK}}'
      IMAP_GATEWAY_CERTS_VOLUME: '{{.RESTMAIL_CERTS_VOLUME}}'
      IMAP_GATEWAY_DNS_IP: '{{.RESTMAIL_TESTBED_DNS_IP}}'
      IMAP_GATEWAY_IP: '{{.RESTMAIL_IMAP_IP}}'
      IMAP_GATEWAY_RESTMAIL_HOSTNAME: '{{.RESTMAIL_HOSTNAME}}'
      IMAP_GATEWAY_MODE: dev
      IMAP_GATEWAY_IMAGE_TAG: '{{.RESTMAIL_IMAGE_TAG}}'
      IMAP_GATEWAY_REGISTRY: '{{.RESTMAIL_REGISTRY}}'
      IMAP_GATEWAY_DB_HOST: '{{.RESTMAIL_POSTGRES_IP}}'
      # Public listener for token/user routes; machine routes use the internal one.
      IMAP_GATEWAY_API_BASE_URL: 'http://{{.RESTMAIL_API_IP}}:{{.RESTMAIL_API_PORT}}'
      IMAP_GATEWAY_INTERNAL_MTLS: '{{.RESTMAIL_INTERNAL_MTLS | default "false"}}'
      IMAP_GATEWAY_API_INTERNAL_BASE_URL: '{{if eq (.RESTMAIL_INTERNAL_MTLS | default "false") "true"}}https://{{.RESTMAIL_API_IP}}:{{.RESTMAIL_INTERNAL_MTLS_PORT | default "8443"}}{{end}}'
      IMAP_GATEWAY_TLS_CERT_PATH: '/certs/{{.RESTMAIL_HOSTNAME}}.crt'
      IMAP_GATEWAY_TLS_KEY_PATH: '/certs/{{.RESTMAIL_HOSTNAME}}.key'
      IMAP_GATEWAY_DB_NAME: '{{.RESTMAIL_DB_NAME}}'
      IMAP_GATEWAY_DB_USER: '{{.RESTMAIL_DB_USER}}'
      IMAP_GATEWAY_DB_PASS: '{{.RESTMAIL_DB_PASS | default "restmail"}}'
      IMAP_GATEWAY_TLS_PORT: '{{.RESTMAIL_IMAP_TLS_PORT}}'
      IMAP_GATEWAY_LOG_LEVEL: '{{.RESTMAIL_LOG_LEVEL}}'
      IMAP_GATEWAY_ENVIRONMENT: '{{.RESTMAIL_ENVIRONMENT}}'
      IMAP_GATEWAY_MAILNET_ONLY: '{{.RESTMAIL_MAILNET_ONLY}}'
      IMAP_GATEWAY_PROXY_HOST: '{{.RESTMAIL_PROXY_HOST}}'

  pop3-gateway:
    taskfile: ./tasks/pop3-gateway.yml
    vars:
      POP3_GATEWAY_PROJECT: '{{.RESTMAIL_PROJECT}}'
      POP3_GATEWAY_NETWORK: '{{.RESTMAIL_NETWORK}}'
      POP3_GATEWAY_CERTS_VOLUME: '{{.RESTMAIL_CERTS_VOLUME}}'
      POP3_GATEWAY_DNS_IP: '{{.RESTMAIL_TESTBED_DNS_IP}}'
      POP3_GATEWAY_IP: '{{.RESTMAIL_POP3_IP}}'
      POP3_GATEWAY_RESTMAIL_HOSTNAME: '{{.RESTMAIL_HOSTNAME}}'
      POP3_GATEWAY_MODE: dev
      POP3_GATEWAY_IMAGE_TAG: '{{.RESTMAIL_IMAGE_TAG}}'
      POP3_GATEWAY_REGISTRY: '{{.RESTMAIL_REGISTRY}}'
      POP3_GATEWAY_DB_HOST: '{{.RESTMAIL_POSTGRES_IP}}'
      # Public listener for token/user routes; machine routes use the internal one.
      POP3_GATEWAY_API_BASE_URL: 'http://{{.RESTMAIL_API_IP}}:{{.RESTMAIL_API_PORT}}'
      POP3_GATEWAY_INTERNAL_MTLS: '{{.RESTMAIL_INTERNAL_MTLS | default "false"}}'
      POP3_GATEWAY_API_INTERNAL_BASE_URL: '{{if eq (.RESTMAIL_INTERNAL_MTLS | default "false") "true"}}https://{{.RESTMAIL_API_IP}}:{{.RESTMAIL_INTERNAL_MTLS_PORT | default "8443"}}{{end}}'
      POP3_GATEWAY_TLS_CERT_PATH: '/certs/{{.RESTMAIL_HOSTNAME}}.crt'
      POP3_GATEWAY_TLS_KEY_PATH: '/certs/{{.RESTMAIL_HOSTNAME}}.key'
      POP3_GATEWAY_DB_NAME: '{{.RESTMAIL_DB_NAME}}'
      POP3_GATEWAY_DB_USER: '{{.RESTMAIL_DB_USER}}'
      POP3_GATEWAY_DB_PASS: '{{.RESTMAIL_DB_PASS | default "restmail"}}'
      POP3_TLS_PORT: '{{.RESTMAIL_POP3_TLS_PORT}}'
      POP3_GATEWAY_LOG_LEVEL: '{{.RESTMAIL_LOG_LEVEL}}'
      POP3_GATEWAY_ENVIRONMENT: '{{.RESTMAIL_ENVIRONMENT}}'
      POP3_GATEWAY_MAILNET_ONLY: '{{.RESTMAIL_MAILNET_ONLY}}'

  webmail:
    taskfile: ./tasks/webmail.yml
    vars:
      WEBMAIL_PROJECT: '{{.RESTMAIL_PROJECT}}'
      WEBMAIL_NETWORK: '{{.RESTMAIL_NETWORK}}'
      WEBMAIL_IP: '{{.RESTMAIL_WEBMAIL_IP}}'
      # Overridable so prod can be exercised locally (WEBMAIL_MODE=prod chore …);
      # dev is what the stack runs by default.
      WEBMAIL_MODE: '{{.WEBMAIL_MODE | default "dev"}}'
      WEBMAIL_IMAGE_TAG: '{{.RESTMAIL_IMAGE_TAG}}'
      WEBMAIL_REGISTRY: '{{.RESTMAIL_REGISTRY}}'
      WEBMAIL_PROXY_HOST: '{{.RESTMAIL_PROXY_HOST}}'

  admin:
    taskfile: ./tasks/admin.yml
    vars:
      ADMIN_PROJECT: '{{.RESTMAIL_PROJECT}}'
      ADMIN_NETWORK: '{{.RESTMAIL_NETWORK}}'
      ADMIN_IP: '{{.RESTMAIL_ADMIN_IP}}'
      # Overridable so prod can be exercised locally (ADMIN_MODE=prod chore …);
      # dev is what the stack runs by default.
      ADMIN_MODE: '{{.ADMIN_MODE | default "dev"}}'
      ADMIN_IMAGE_TAG: '{{.RESTMAIL_IMAGE_TAG}}'
      ADMIN_REGISTRY: '{{.RESTMAIL_REGISTRY}}'
      ADMIN_PROXY_HOST: '{{.RESTMAIL_PROXY_HOST}}'

  # The marketing website lives in its own repo (rest-mail/website) and is
  # not strictly part of the rest-mail technology stack — it's pulled in
  # here only so it can sit on mailnet alongside the real services. Like
  # testbed and reference-mailserver, it's an `optional: true` clone-on-
  # demand subproject (`chore website:init` to bootstrap), so its tasks
  # only resolve once the dir exists.
  website:
    # The DIRECTORY, not a filename: chore resolves chores.yml or Taskfile.yml
    # itself, so this works whether or not that peer has been renamed yet. Naming
    # the file pinned us to one side of a rename we do not control.
    dir: .workspace/website
    optional: true
    vars:
      PROJECT: '{{.RESTMAIL_PROJECT}}'
      NETWORK: '{{.RESTMAIL_NETWORK}}'
      IP: '{{.RESTMAIL_WEBSITE_IP}}'
      MODE: '{{.WEBSITE_MODE | default "prod"}}'
      REGISTRY: '{{.RESTMAIL_REGISTRY}}'
      IMAGE_TAG: latest
      PROXY_HOST: '{{.RESTMAIL_PROXY_HOST}}'

  monitoring:
    taskfile: ./tasks/monitoring.yml
    vars:
      MONITORING_PROJECT: '{{.RESTMAIL_PROJECT}}'
      MONITORING_NETWORK: '{{.RESTMAIL_NETWORK}}'
      PROMETHEUS_IP: '{{.MONITORING_PROMETHEUS_IP}}'
      GRAFANA_IP: '{{.MONITORING_GRAFANA_IP}}'
      POSTGRES_EXPORTER_IP: '{{.MONITORING_POSTGRES_EXPORTER_IP}}'

  # ── Subprojects (must come last) ────────────────────────
  # Each of these sets PROJECT/IMAGE_TAG to its own value and Task bleeds
  # those into later includes' var resolution. Putting them last keeps
  # the local-service includes above resolving against the parent
  # vars block (PROJECT=rest-mail, IMAGE_TAG=dev).
  testbed:
    # The DIRECTORY, not a filename: chore resolves chores.yml or Taskfile.yml
    # itself, so this works whether or not that peer has been renamed yet. Naming
    # the file pinned us to one side of a rename we do not control.
    dir: .workspace/testbed
    optional: true
    vars:
      PROJECT: testbed
      IMAGE_TAG: 2026.04.28

  # NOTE: the reference mail servers are deliberately NOT included here.
  # Including .workspace/reference-mailserver/Taskfile.yml flattens its vars
  # into this file's shared namespace, where they collide with ours — most
  # dangerously, the reference postgres resolved its container name to
  # "rest-mail-postgres" and a `mailserver:mailN:down` would docker-rm the
  # PRODUCT's database. Drive the reference composer directly instead:
  #   "${CHORE_BIN:-chore}" -C .workspace/reference-mailserver up CONFIG=mail1
  # (mail2 needs its per-instance IP/hostname overrides — see e2e:up).

tasks:

  # ════════════════════════════════════════════════════════
  # Build (Go binaries — used for local development without Docker)
  # ════════════════════════════════════════════════════════

  build:
    desc: Build all Go binaries
    deps: [build:api, build:smtp-gateway, build:imap-gateway, build:pop3-gateway, build:console, build:certgen, build:migrate, build:seed]

  build:api:
    desc: Build the REST API server
    cmds:
      - go build -o build/api/api ./cmd/api
    sources:
      - cmd/api/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - build/api/api

  build:gateways:
    desc: Build all three protocol gateways
    deps: [build:smtp-gateway, build:imap-gateway, build:pop3-gateway]

  build:smtp-gateway:
    desc: Build the SMTP protocol gateway
    cmds:
      - go build -o build/gateways/smtp-gateway ./cmd/smtp-gateway
    sources:
      - cmd/smtp-gateway/**/*.go
      - internal/gateway/smtp/**/*.go
      - internal/gateway/apiclient/**/*.go
      - internal/gateway/queue/**/*.go
      - internal/db/**/*.go
      - go.mod
      - go.sum
    generates:
      - build/gateways/smtp-gateway

  build:imap-gateway:
    desc: Build the IMAP protocol gateway
    cmds:
      - go build -o build/gateways/imap-gateway ./cmd/imap-gateway
    sources:
      - cmd/imap-gateway/**/*.go
      - internal/gateway/imap/**/*.go
      - internal/gateway/apiclient/**/*.go
      - go.mod
      - go.sum
    generates:
      - build/gateways/imap-gateway

  build:pop3-gateway:
    desc: Build the POP3 protocol gateway
    cmds:
      - go build -o build/gateways/pop3-gateway ./cmd/pop3-gateway
    sources:
      - cmd/pop3-gateway/**/*.go
      - internal/gateway/pop3/**/*.go
      - internal/gateway/apiclient/**/*.go
      - go.mod
      - go.sum
    generates:
      - build/gateways/pop3-gateway

  build:website:
    desc: Build the website server binary
    cmds:
      - go build -o build/tools/website ./cmd/website
    sources:
      - cmd/website/**/*.go
      - go.mod
      - go.sum
    generates:
      - build/tools/website

  build:console:
    desc: Build the console admin tool (auto-detects OS/arch)
    vars:
      HOST_OS:
        sh: go env GOHOSTOS
      HOST_ARCH:
        sh: go env GOHOSTARCH
    cmds:
      - GOOS={{.HOST_OS}} GOARCH={{.HOST_ARCH}} go build -o build/console/console-{{.HOST_OS}}-{{.HOST_ARCH}} ./cmd/console
      - echo "Built build/console/console-{{.HOST_OS}}-{{.HOST_ARCH}}"
    sources:
      - cmd/console/**/*.go
      - internal/console/**/*.go
      - go.mod
      - go.sum

  build:console:darwin-arm64:
    desc: Cross-compile console for macOS Apple Silicon
    env:
      GOOS: darwin
      GOARCH: arm64
    cmds:
      - go build -o build/console/console-darwin-arm64 ./cmd/console

  build:console:darwin-amd64:
    desc: Cross-compile console for macOS Intel
    env:
      GOOS: darwin
      GOARCH: amd64
    cmds:
      - go build -o build/console/console-darwin-amd64 ./cmd/console

  build:console:linux-arm64:
    desc: Cross-compile console for Linux arm64
    env:
      GOOS: linux
      GOARCH: arm64
    cmds:
      - go build -o build/console/console-linux-arm64 ./cmd/console

  build:console:all:
    desc: Build console for all platforms
    deps: [build:console:darwin-arm64, build:console:darwin-amd64, build:console:linux-arm64, build:console]

  build:tools:
    desc: Build all tool binaries (certgen, migrate, seed, website)
    deps: [build:certgen, build:migrate, build:seed, build:website]

  build:certgen:
    desc: Build the certificate generator
    cmds:
      - go build -o build/tools/certgen ./cmd/certgen
    sources:
      - cmd/certgen/**/*.go
      - go.mod
      - go.sum
    generates:
      - build/tools/certgen

  build:migrate:
    desc: Build the migration runner
    cmds:
      - go build -o build/tools/migrate ./cmd/migrate
    sources:
      - cmd/migrate/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - build/tools/migrate

  build:seed:
    desc: Build the test data seeder
    cmds:
      - go build -o build/tools/seed ./cmd/seed
    sources:
      - cmd/seed/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - build/tools/seed

  # instantmailcheck moved to its own repo:
  #   https://github.com/rest-mail/instantmailcheck
  # Install via Homebrew (macOS only — Homebrew installs casks only there):
  #   brew install --cask antimatter-studios/tap/instantmailcheck
  # Or via Go:
  #   go install github.com/rest-mail/instantmailcheck@latest

  # ════════════════════════════════════════════════════════
  # Test
  # ════════════════════════════════════════════════════════

  test:
    desc: Run unit tests
    cmds:
      - go test -race -count=1 ./internal/...

  test:unit:
    desc: Run unit tests (alias for test)
    cmds:
      - go test -race -count=1 ./internal/...

  test:verbose:
    desc: Run unit tests with verbose output
    cmds:
      - go test -race -count=1 -v ./internal/...

  test:coverage:
    desc: Run unit tests with coverage report
    cmds:
      - go test -race -count=1 -coverprofile=coverage.out ./internal/...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report written to coverage.html"

  test:e2e:
    desc: 'Run e2e tests against an already-running topology (use `chore e2e` to also bring it up + tear down)'
    cmds:
      # The suite must run ON the simulated internet: the host can neither
      # route to mailnet IPs (Docker Desktop) nor resolve *.test. Run it in a
      # golang container attached to the mailnet with the testbed dnsmasq as
      # its only resolver — the suite is then just another internet user.
      # The host Go module cache is mounted read-only to avoid re-downloading.
      - |
        mkdir -p {{.ROOT_DIR}}/.cache
        printf 'nameserver %s\n' "{{.RESTMAIL_TESTBED_DNS_IP | default "10.99.0.10"}}" > {{.ROOT_DIR}}/.cache/testbed-resolv.conf
        docker run --rm \
          --network {{.RESTMAIL_NETWORK | default "testbed_mailnet"}} \
          -v {{.ROOT_DIR}}/.cache/testbed-resolv.conf:/etc/resolv.conf:ro \
          -v {{.ROOT_DIR}}:/src -w /src \
          -v "$(go env GOMODCACHE):/go/pkg/mod:ro" \
          -v rest-mail-e2e-gocache:/root/.cache/go-build \
          -e GOFLAGS=-buildvcs=false \
          -e E2E_REQUIRE_STACK \
          golang:1.25 \
          go test -race -count=1 -v -timeout 8m ./tests/e2e/...

  e2e:
    desc: 'Full e2e run: bring up the topology, run the tests, tear it down'
    cmds:
      - task: e2e:up
      - defer: { task: e2e:down }
      - task: test:e2e

  e2e:up:
    desc: 'Bring up the e2e topology: testbed + reference mail1/mail2 + restmail.test'
    cmds:
      - task: testbed:up
      - task: mailserver:init
      - task: mailserver:certs:issue
      # Reference servers are driven DIRECTLY (not via includes — see the note
      # above `tasks:` about the var-flatten hazard). mail1 uses the reference
      # repo's defaults; mail2 supplies its per-instance identity + IPs.
      - '"${CHORE_BIN:-chore}" -C .workspace/reference-mailserver up CONFIG=mail1'
      - >-
        "${CHORE_BIN:-chore}" -C .workspace/reference-mailserver up CONFIG=mail2
        HOSTNAME=mail2.test
        POSTGRES_IP=10.99.0.42 POSTFIX_IP=10.99.0.12 DOVECOT_IP=10.99.0.112
        RSPAMD_IP=10.99.0.23 FAIL2BAN_IP=10.99.0.24
      # Provision DKIM signing for the reference servers so they sign outbound
      # mail — restmail then verifies it (dkim=pass) over the simulated internet.
      - task: mailserver:wait
        vars: {CONFIG: mail1}
      - task: mailserver:wait
        vars: {CONFIG: mail2}
      - '"${CHORE_BIN:-chore}" -C .workspace/reference-mailserver dkim:provision CONFIG=mail1'
      - '"${CHORE_BIN:-chore}" -C .workspace/reference-mailserver dkim:provision CONFIG=mail2 HOSTNAME=mail2.test'
      # restmail.test (the rest-mail instance) — config is testbed-owned.
      - task: instance:certs:issue
        vars: {CONFIG: restmail.test}
      # Provision the internal-mTLS material (dedicated CA + API server + gateway
      # client cert), then bring the stack up WITH internal mTLS ON so the e2e
      # gate exercises the real gateway→API handshake. The restmail.test manifest
      # is testbed-owned (external to this repo), so its `internal_mtls: true` is
      # forced here as a call var on the task reference (call vars beat dotenv) —
      # the testbed's configs/restmail/manifest.yml should carry it too, for parity.
      - task: instance:mtls:issue
        vars: {CONFIG: restmail.test}
      - task: instance:dns:register
        vars: {CONFIG: restmail.test}
      - task: instance:up
        vars: {CONFIG: restmail.test, RESTMAIL_INTERNAL_MTLS: 'true'}
      - task: instance:dkim
        vars: {CONFIG: restmail.test}
      # Fail the bring-up loudly if a domain's provisioned DKIM selector has
      # drifted from what the manifest declares (#150), rather than silently
      # signing/publishing under the wrong selector.
      - task: instance:dkim:check
        vars: {CONFIG: restmail.test}

  e2e:down:
    desc: 'Tear down the e2e topology (preserves data volumes)'
    cmds:
      - task: instance:down
        vars: {CONFIG: restmail.test}
      - '"${CHORE_BIN:-chore}" -C .workspace/reference-mailserver down CONFIG=mail1'
      - '"${CHORE_BIN:-chore}" -C .workspace/reference-mailserver down CONFIG=mail2'

  test:all:
    desc: Run all tests (unit + e2e)
    cmds:
      - task: test:unit
      - task: test:e2e

  # ════════════════════════════════════════════════════════
  # Code quality
  # ════════════════════════════════════════════════════════

  fmt:
    desc: Format Go source code
    cmds:
      - gofmt -w -s .

  vet:
    desc: Run go vet on all packages
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  tidy:
    desc: Tidy and verify Go module dependencies
    cmds:
      - go mod tidy
      - go mod verify

  # ════════════════════════════════════════════════════════
  # restmail product stack
  #
  # `restmail:up` brings up the full restmail.test product stack
  # — postgres, js-filter, api, three protocol gateways, webmail,
  # admin, website. Each individual service is included from
  # tasks/<service>.yml under its own namespace, so `chore <svc>:up`,
  # `chore <svc>:down`, `chore <svc>:logs` etc. are also available.
  # ════════════════════════════════════════════════════════

  restmail:up:
    desc: 'Alias for `chore instance:up` (CONFIG defaults to restmail.test)'
    cmds:
      - task: instance:up

  restmail:down:
    desc: 'Alias for `chore instance:down`'
    cmds:
      - task: instance:down

  restmail:restart:
    desc: Stop + recreate the full restmail stack (rebuilds images)
    cmds:
      - task: restmail:down
      - task: restmail:up

  restmail:logs:
    desc: 'Alias for `chore status` — service names there are the prefixes for <svc>:logs'
    cmds:
      - task: status

  dev:
    desc: Alias for restmail:up (legacy name)
    deps: [restmail:up]

  gateways:wait:
    desc: Wait until the SMTP/IMAP/POP3 gateways answer their protocol greeting
    # instance:up starts the gateways and returns; only the API had a readiness wait,
    # so e2e raced them and Stage 1 failed intermittently with
    # "dial tcp 10.99.0.13:25: connect: connection refused".
    #
    # Three things this has to get right, each learned by getting it wrong:
    #
    #  - Probe the container's MAILNET address, from inside the network — the path
    #    every consumer uses. The published host port is not a readiness signal:
    #    docker's userland proxy binds it when the container starts, so a host-side
    #    connect succeeds before the process inside has bound at all.
    #  - Read the GREETING, not just a TCP accept. A connection can be accepted while
    #    the service is still starting; Stage 1 passed on a bare connect and the very
    #    next read timed out.
    #  - Allow for a compile. In dev mode these containers run `air`, which builds the
    #    binary inside the container before anything listens, so a cold cache takes
    #    well over the 30s this task first allowed.
    vars:
      WAIT_SECONDS: '{{.WAIT_SECONDS | default "180"}}'
    cmds:
      - |
        probe='
          # No globbing: the IMAP greeting to match starts with `*`, and splitting an
          # unquoted $spec expands it against the working directory — so `expect`
          # became a filename and never matched, while `220` for SMTP passed. That
          # looked exactly like Dovecot failing to greet for 180s.
          set -f
          fail=0
          # IMAP and POP3 are implicit TLS now, so their greeting only arrives after a
          # handshake — `nc` would wait forever for one. The handshake is itself a
          # readiness signal a bare connect is not: only a serving process completes it.
          #
          # The image ships openssl rather than installing it. `apk add` was tried and
          # hangs: this container runs ON THE MAILNET, whose only resolver is the testbed
          # dnsmasq, so the Alpine mirrors do not resolve and the probe stalls until the
          # task is killed. Pulling an image is unaffected — the docker daemon does that
          # on the host network, not this one.
          # The greeting to match is set per protocol rather than carried in the spec:
          # the IMAP one contains a space, and the specs are split on whitespace.
          for spec in "smtp {{.RESTMAIL_SMTP_IP}} {{.RESTMAIL_SMTP_PORT_INBOUND}} plain" \
                      "imap {{.RESTMAIL_IMAP_IP}} {{.RESTMAIL_IMAP_TLS_PORT}} tls" \
                      "pop3 {{.RESTMAIL_POP3_IP}} {{.RESTMAIL_POP3_TLS_PORT}} tls"; do
            set -- $spec; name=$1; ip=$2; port=$3; mode=$4
            case $name in
              smtp) expect="220" ;;
              imap) expect="* OK" ;;
              pop3) expect="+OK" ;;
            esac
            [ -n "$ip" ] && [ -n "$port" ] || continue
            ready=""; i=0
            while [ $i -lt {{.WAIT_SECONDS}} ]; do
              # Feed the connection from a sleep rather than /dev/null: busybox nc
              # exits as soon as stdin EOFs, often BEFORE the greeting arrives. With
              # </dev/null this reported Dovecot as never greeting for 180s while it
              # was answering immediately — and postfix slipped through only because
              # it greets fast enough to win the race.
              if [ "$mode" = tls ]; then
                # 8 seconds, and the match is not anchored. Two reasons, both measured:
                #
                #  - the greeting arrives several seconds after the handshake, so a 2s
                #    window returned nothing at all;
                #  - openssl'"'"'s session dump ends WITHOUT a trailing newline, so the
                #    greeting is appended to its last line — the captured text really is
                #    "    Start Time: 1785322466* OK [CAPABILITY ...". Anchoring at the
                #    start of a line therefore never matches.
                #
                # -quiet would remove the noise, but it implies -ign_eof: the client then
                # ignores the EOF, has to be killed, and its unflushed stdout is lost.
                # No certificate verification either — the testbed issues from its own CA,
                # and what is awaited is the service answering, not the chain.
                line=$( (sleep 8) | openssl s_client -connect "$ip:$port" 2>/dev/null \
                          | grep -m1 -F "$expect")
              else
                line=$( (sleep 2) | nc -w4 "$ip" "$port" 2>/dev/null | head -1)
              fi
              case "$line" in
                *"$expect"*) ready=1; break ;;
              esac
              sleep 1; i=$((i+1))
            done
            if [ -n "$ready" ]; then
              echo "  $name ready on $ip:$port"
            else
              echo "ERROR: $name never greeted on $ip:$port within {{.WAIT_SECONDS}}s" >&2
              fail=1
            fi
          done
          exit $fail'
        docker run --rm --network {{.RESTMAIL_NETWORK}} --entrypoint sh alpine/openssl -c "$probe"

  mailserver:wait:
    desc: 'Wait until a reference server answers SMTP and IMAP: chore mailserver:wait mail1'
    # The reference servers have the same problem and no wait of their own: e2e
    # brought them up and immediately read IMAP, which timed out mid-handshake while
    # Dovecot was still starting — Stage 1 had "passed" on a bare TCP connect.
    dotenv: []
    args:
      - {name: config, desc: 'which reference server, e.g. mail1'}
    cmds:
      - |
        ref="${CONFIG%%.*}"
        probe='
          # No globbing: the IMAP greeting to match starts with `*`, and splitting an
          # unquoted $spec expands it against the working directory — so `expect`
          # became a filename and never matched, while `220` for SMTP passed. That
          # looked exactly like Dovecot failing to greet for 180s.
          set -f
          fail=0
          for spec in "smtp mailref-'"$ref"'-postfix 25 220" \
                      "imap mailref-'"$ref"'-dovecot 143 *"; do
            set -- $spec; name=$1; host=$2; port=$3; expect=$4
            ready=""; i=0
            while [ $i -lt 180 ]; do
              # See gateways:wait — </dev/null makes nc exit before the greeting.
              line=$( (sleep 2) | nc -w4 "$host" "$port" 2>/dev/null | head -1)
              case "$line" in
                "$expect"*) ready=1; break ;;
              esac
              sleep 1; i=$((i+1))
            done
            if [ -n "$ready" ]; then
              echo "  '"$ref"' $name ready"
            else
              echo "ERROR: '"$ref"' $name never greeted on $host:$port within 180s" >&2
              fail=1
            fi
          done
          exit $fail'
        docker run --rm --network testbed_mailnet alpine:3.20 sh -c "$probe"

  health:wait:
    desc: Wait for the API to answer its health endpoint (up to 60s)
    # Probed on the mailnet, from inside the network — the same path the gateways
    # use. It used to curl localhost:8080 from the host, which only worked because
    # the API published a host port; that publishing is gone (an HTTP service with a
    # proxy route has no business on 0.0.0.0), and probing through the proxy instead
    # would make this depend on ddt running, which CI does not have.
    cmds:
      - |
        probe='
          i=0
          while [ $i -lt 60 ]; do
            if wget -q -O /dev/null "http://{{.RESTMAIL_API_IP}}:{{.RESTMAIL_API_PORT}}/api/health"; then
              echo "  api healthy"
              exit 0
            fi
            sleep 1; i=$((i+1))
          done
          echo "ERROR: api did not become healthy within 60s" >&2
          exit 1'
        docker run --rm --network {{.RESTMAIL_NETWORK}} alpine:3.20 sh -c "$probe"

  ps:
    desc: Show all running rest-mail-* containers (raw docker ps view)
    cmds:
      - docker ps -a --filter "name=^/{{.RESTMAIL_PROJECT}}-"

  status:
    desc: 'Fleet view: every instance, reference server, the testbed and orphans. Narrow with --name <instance>.'
    # The discovery and the table live in internal/fleet, which knows how to find
    # every config, the reference stacks, the testbed and containers belonging to no
    # config — the same questions a batch verb asks. This used to be 193 lines of
    # shell here, padding columns by byte width, so any name outside ASCII drifted.
    args:
      - {name: name, desc: 'one instance, e.g. mail1.test (default: the whole fleet)'}
    vars:
      NAME: ''
      ONLY: '{{.NAME | default .ONLY | default ""}}'
    cmds:
      - go run ./cmd/instance status {{.ONLY}}
  db:migrate:
    desc: Run database migrations for the instance (executed inside the api container)
    cmds:
      - docker exec {{.RESTMAIL_PROJECT}}-api go run ./cmd/migrate

  db:seed:
    desc: Seed the selected CONFIG's database with test data (fixture users under its domain)
    cmds:
      # SEED_SERVED_DOMAINS carries the manifest `domains:` list (rendered to
      # RESTMAIL_SEED_SERVED_DOMAINS as name:server_type,...) so cmd/seed creates a
      # DB row per ADDITIONAL served domain. Passed only when the instance
      # declares extra domains — single-domain instances seed exactly as before.
      - |
        docker exec -e SEED_DOMAIN={{.RESTMAIL_HOSTNAME}} \
          {{if .RESTMAIL_SEED_SERVED_DOMAINS}}-e SEED_SERVED_DOMAINS="{{.RESTMAIL_SEED_SERVED_DOMAINS}}" \
          {{end}}{{.RESTMAIL_PROJECT}}-api go run ./cmd/seed

  db:reset:
    desc: Drop the postgres data volume, recreate, then seed (destructive)
    cmds:
      - task: postgres:reset
      - task: db:seed

  db:psql:
    desc: Open a psql shell to the instance database
    cmds:
      - task: postgres:psql

  # ════════════════════════════════════════════════════════
  # Project toggles (.env.local)
  #
  # Per-user mode flags written to .env.local (gitignored). The top-level
  # env: block sources .env.local so any KEY=VALUE there propagates to
  # tasks as both env vars and template vars.
  #
  # Usage:
  #   task project:toggle -- website=dev   # set WEBSITE_MODE=dev
  #   task project:toggle -- website=prod  # revert
  #   task project:status                  # show current toggles
  # ════════════════════════════════════════════════════════

  project:toggle:
    desc: 'Set a service toggle in .env.local (e.g. chore project:toggle -- website=dev)'
    cmds:
      - |
        set -e
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "usage: chore project:toggle -- <service>=<mode>" >&2
          echo "example: chore project:toggle -- website=dev" >&2
          exit 2
        fi
        file=.env.local
        touch "$file"
        for pair in {{.CLI_ARGS}}; do
          case "$pair" in
            *=*) ;;
            *) echo "invalid toggle '$pair' (expected key=value)" >&2; exit 2 ;;
          esac
          name=${pair%%=*}
          value=${pair#*=}
          # Map shorthand service name to the env var the task layer reads.
          case "$name" in
            website) key=WEBSITE_MODE ;;
            *) echo "unknown toggle '$name' (known: website)" >&2; exit 2 ;;
          esac
          if grep -q "^${key}=" "$file"; then
            sed -i.bak "s|^${key}=.*|${key}=${value}|" "$file" && rm -f "$file.bak"
          else
            printf '%s=%s\n' "$key" "$value" >> "$file"
          fi
          echo "  set ${key}=${value} in ${file}"
        done

  project:status:
    desc: 'Alias for `chore status` (toggles + service state are shown there)'
    cmds:
      - task: status

  project:check:runtime:
    desc: 'Fail if anything the running stack reads resolves into .workspace/ (dev clones feed builds, never runs)'
    cmds:
      - |
        # .workspace/ is for cloning siblings you intend to modify, push, and
        # build images from. A clone is mutable by design — branch-switched,
        # rebased, cleaned — so the moment a running container reads from one,
        # bring-up stops being reproducible and `git clean` becomes destructive.
        # This task is the enforcement: it fails on any rest-mail runtime input
        # that resolves under .workspace/.
        ws="{{.ROOT_DIR}}/.workspace"
        fail=0

        # 1. config dirs must be real directories of real files, not links out.
        echo "  config dirs:"
        found=0
        for d in config/*/; do
          [ -e "${d%/}" ] || continue
          found=1
          name=$(basename "$d")
          if [ -L "${d%/}" ]; then
            echo "    ✗ ${name} is a symlink → $(readlink "${d%/}")"
            fail=1
          else
            # A link on any file inside counts too (e.g. only config.env linked).
            links=$(find "${d%/}" -maxdepth 1 -type l 2>/dev/null || true)
            if [ -n "$links" ]; then
              echo "    ✗ ${name} contains symlinks:"; echo "$links" | sed 's/^/        /'
              fail=1
            else
              echo "    ✓ ${name} (real files)"
            fi
          fi
        done
        [ "$found" = 0 ] && echo "    · none present (chore testbed:init, or chore config:scaffold DOMAIN=…)"

        # 2. the config.env actually loaded must live outside .workspace/.
        cfg="{{.CONFIG_DIR}}/config.env"
        echo "  dotenv source:"
        if [ -f "$cfg" ]; then
          real=$(cd "$(dirname "$cfg")" && pwd -P)/$(basename "$cfg")
          case "$real" in
            "$ws"/*) echo "    ✗ $cfg resolves into .workspace/ ($real)"; fail=1 ;;
            *)       echo "    ✓ $cfg" ;;
          esac
        else
          echo "    · $cfg not present (nothing loaded; every RESTMAIL_*/RESTMAIL_* is a default)"
        fi

        # 3. no running rest-mail container may bind-mount a dev clone.
        echo "  container mounts:"
        mfail=0
        # Peer prefixes are excluded here and reported below — mailref-<cfg>-postgres
        # would otherwise match the -postgres suffix and be enforced as ours.
        for c in $(docker ps --format '{{`{{.Names}}`}}' 2>/dev/null | grep -vE '^(mailref-|testbed-)' | grep -E -- '-(api|postgres|js-filter|smtp-gateway|imap-gateway|pop3-gateway|webmail|admin|website)$' || true); do
          srcs=$(docker inspect "$c" --format '{{`{{range .Mounts}}{{println .Source}}{{end}}`}}' 2>/dev/null | grep -F "/.workspace/" || true)
          if [ -n "$srcs" ]; then
            echo "    ✗ ${c} mounts a dev clone:"; echo "$srcs" | sed 's/^/        /'
            mfail=1; fail=1
          fi
        done
        [ "$mfail" = 0 ] && echo "    ✓ no rest-mail container reads .workspace/"

        # Peer stacks are reported, not enforced: their configs live in their own
        # repos, so fixing this needs a config bundle shipped alongside their
        # images — tracked upstream, not here.
        peers=$(docker ps --format '{{`{{.Names}}`}}' 2>/dev/null | grep -E '^mailref-' || true)
        for c in $peers; do
          srcs=$(docker inspect "$c" --format '{{`{{range .Mounts}}{{println .Source}}{{end}}`}}' 2>/dev/null | grep -F "/.workspace/" || true)
          [ -n "$srcs" ] && echo "    ⚠ ${c} mounts a dev clone (reference-mailserver, upstream issue)"
        done

        echo ""
        if [ "$fail" = 0 ]; then
          echo "  runtime is clone-free."
        else
          echo "  FAIL: a runtime input resolves into .workspace/ — re-run chore testbed:init," >&2
          echo "        or copy the config into config/<domain>/ yourself." >&2
          exit 1
        fi

  project:check:
    desc: 'Probe whether the local network environment is ready to serve proxy URLs'
    cmds:
      - |
        host="{{.RESTMAIL_PROXY_HOST}}"
        ok=1
        echo "  proxy host: $host"
        echo ""

        if command -v ddt >/dev/null 2>&1; then
          ver=$(ddt --version 2>/dev/null | head -1)
          echo "  ✓ ddt installed     ($ver)"
        else
          echo "  ✗ ddt not installed (see 'chore project:proxy:help' for both ddt + manual paths)"
          ok=0
        fi

        # Anything listening on :80? (docker-proxy / ddt-proxy / your own)
        if curl --connect-timeout 1 -s -o /dev/null -w '%{http_code}' "http://127.0.0.1/" 2>/dev/null | grep -qE '^[1-5][0-9][0-9]$'; then
          echo "  ✓ proxy on :80      (something is responding)"
        else
          echo "  ✗ proxy on :80      (no response — start ddt: 'ddt start')"
          ok=0
        fi

        # Resolve the proxy hostname and route through it.
        code=$(curl --connect-timeout 1 -s -o /dev/null -w '%{http_code}' "http://${host}/" 2>/dev/null || echo 000)
        if [ "$code" != "000" ]; then
          echo "  ✓ ${host} routes  (HTTP $code from /)"
        else
          echo "  ✗ ${host} unreachable  (DNS or proxy missing — see 'chore project:proxy:help')"
          ok=0
        fi

        echo ""
        if [ "$ok" = 1 ]; then
          echo "  ready — http://${host}/api should work"
        else
          echo "  not ready — run 'chore project:proxy:help' for setup options"
          exit 1
        fi

  project:proxy:help:
    desc: 'Show how to set up the local proxy + DNS (ddt or manual)'
    cmds:
      - |
        host="{{.RESTMAIL_PROXY_HOST}}"
        cat <<EOF

          The rest-mail stack puts \`docker-proxy.<name>.host=${host}\` labels
          on every container. A reverse proxy on :80 reads those labels and
          routes requests by Host + path. Two ways to run that proxy:

          ┌─ Option A — docker-dev-tools (recommended) ──────────────────┐

            \`ddt\` provides the IP alias, DNS, and reverse proxy as a
            single integrated stack. Install once, then it's stateless.

              brew install antimatter-studios/tap/ddt
              ddt install     # interactive: IP alias + DNS + services
              ddt start       # bring up dns + proxy

            Verify:
              ddt status
              task project:check

            ddt registers \`*.localhost\` with your system resolver and
            adds 10.254.254.254 to lo0 so containers can reach back to
            host services with a stable, caller-independent IP.

          ┌─ Option B — bring your own ──────────────────────────────────┐

            If you don't want ddt, you're on your own. The stack needs
            three things on the host: \`*.localhost\` resolution, a
            stable IP that's reachable from inside containers, and a
            reverse proxy on :80 that routes to our containers.

            How you provide those is your call — Traefik, nginx-proxy,
            Caddy, hand-written nginx, hosts-file edits, whatever fits
            your setup. You'll need to translate the
            docker-proxy.<name>.{host,port,path} labels we apply into
            whatever your proxy expects.

            We don't document a recipe for this path because there's
            no single right answer, and reproducing ddt's pieces by
            hand is strictly worse than just running ddt.

          After either path, 'chore project:check' should pass and
          http://${host}/api will route to the api container.

        EOF

  # ════════════════════════════════════════════════════════
  # Subproject bootstrap (clone-only)
  #
  # rest-mail/testbed and rest-mail/reference-mailserver are cloned into
  # .workspace/* (gitignored). Both repos' Taskfiles are pulled in via
  # the `includes:` block at the top of this file, so all their
  # operational tasks (up, down, smoke, dig, ...) flow through
  # automatically once cloned. The clone steps live here because the
  # include can't bootstrap itself — first-run is `chore testbed:init`
  # and `chore mailserver:init`.
  # ════════════════════════════════════════════════════════

  testbed:init:
    desc: First-run only — clone rest-mail/testbed and seed config/restmail.test from its fixture config
    # This task CREATES config/<domain>/config.env, so it cannot require one to already
    # exist. Without the opt-out chore refuses to start on a fresh checkout — the one
    # situation the task is for. Locally it always passed, because the files were there.
    dotenv: []
    cmds:
      # Clone the testbed if absent (idempotent — safe to re-run) …
      - mkdir -p .workspace config
      - test -d .workspace/testbed/.git || git clone git@github.com:rest-mail/testbed.git .workspace/testbed
      # … then COPY its restmail.test fixture into the authoritative
      # config/<domain>/ layout, where CONFIG=restmail.test resolves
      # config/restmail.test/config.env for the dotenv load.
      #
      # Copy, never link: .workspace/ holds dev clones you branch, rebase and
      # push from, so nothing under it may be a runtime input — otherwise a
      # checkout in a clone silently changes how the stack boots, and a
      # `git clean` in one takes your instance config with it. Seeding is a
      # setup-time read of the clone; running the stack never touches it.
      # Verify with `chore project:check:runtime`.
      - |
        src=.workspace/testbed/configs/restmail
        dst=config/restmail.test
        # Older layouts made dst a symlink into src — replace it with real files.
        if [ -L "$dst" ]; then
          echo "  replacing legacy symlink $dst with a copy of the fixture"
          rm "$dst"
        fi
        mkdir -p "$dst"
        for f in manifest.yml config.env secrets.env dns.env dkim.conf; do
          [ -f "$src/$f" ] || continue
          if [ -e "$dst/$f" ]; then
            echo "  keeping your $dst/$f"
          else
            cp -p "$src/$f" "$dst/$f"
            echo "  seeded $dst/$f"
          fi
        done
        echo "  seeded from the testbed fixture"
      # Render config.env from the manifest rather than trusting the copied one.
      #
      # The fixture is a snapshot in another repository, pinned, and it can predate
      # this schema — its config.env still carries MAIL3_ names, so a stack booted
      # straight from it comes up with an empty RESTMAIL_HOSTNAME and certgen dies
      # with "CERTGEN_DOMAINS is required". The manifest is the source of truth and
      # config.env is generated, so generate it.
      - go run ./cmd/instance render config/restmail.test/manifest.yml
      - |
        echo "  config/restmail.test is yours now — edit manifest.yml, then chore config:render"

  mailserver:init:
    desc: First-run only — clone rest-mail/reference-mailserver into .workspace/reference-mailserver
    status:
      - test -d .workspace/reference-mailserver/.git
    cmds:
      - mkdir -p .workspace
      - git clone git@github.com:rest-mail/reference-mailserver.git .workspace/reference-mailserver

  mailserver:certs:issue:
    desc: Issue TLS certs for the reference mail1/mail2 servers into the shared testbed certs volume
    vars:
      CERTS_VOLUME: '{{.RESTMAIL_CERTS_VOLUME | default "testbed_certs"}}'
      CERTGEN_IMAGE: '{{.CERTGEN_IMAGE | default "ghcr.io/rest-mail/reference-certgen"}}'
      CERTGEN_TAG: '{{.CERTGEN_TAG | default "2026.04.28"}}'
    cmds:
      # Idempotent + CA-preserving: certgen reuses the existing CA and skips
      # domains whose certs are already present. The reference dovecot/postfix
      # crash-loop without /certs/mailN.test.{crt,key}, so this must run
      # before their first bring-up.
      - |
        docker run --rm \
          -v "{{.CERTS_VOLUME}}:/certs" \
          -e CERTGEN_DOMAINS="mail1.test mail2.test" \
          {{.CERTGEN_IMAGE}}:{{.CERTGEN_TAG}}

  website:init:
    desc: First-run only — clone rest-mail/website into .workspace/website
    status:
      - test -d .workspace/website/.git
    cmds:
      - mkdir -p .workspace
      - git clone git@github.com:rest-mail/website.git .workspace/website

  # ════════════════════════════════════════════════════════
  # Instances
  #
  # Each config lives in config/<CONFIG>/manifest.yml (the source
  # of truth). `instance:render` regenerates the config.env that the top-level
  # dotenv loads; `instance:check` fails if it has drifted. Drive another
  # config with CONFIG=<domain>.
  # ════════════════════════════════════════════════════════

  config:render:
    desc: 'Render config/<CONFIG>/manifest.yml → config.env (run after editing a manifest)'
    cmds:
      - go run ./cmd/instance render {{.CONFIG_DIR}}/manifest.yml

  config:check:
    desc: 'Fail if config/<CONFIG>/config.env has drifted from its manifest'
    cmds:
      - go run ./cmd/instance render -check {{.CONFIG_DIR}}/manifest.yml

  config:scaffold:
    desc: 'Create a new config (allocates IPs + secrets): chore config:scaffold DOMAIN=mail4.test'
    cmds:
      - |
        if [ -z "{{.DOMAIN}}" ]; then
          echo "usage: chore config:scaffold DOMAIN=<domain>" >&2
          exit 2
        fi
        go run ./cmd/instance scaffold {{.DOMAIN}}

  # Previous names for the three definition-time verbs, kept so existing muscle
  # memory and scripts keep working. Authoring a definition is a config: verb;
  # instance: is reserved for the running stack (up/down/restart/logs).
  instance:render:
    desc: 'Deprecated alias for `chore config:render`'
    cmds: [{ task: config:render }]

  instance:check:
    desc: 'Deprecated alias for `chore config:check`'
    cmds: [{ task: config:check }]

  instance:scaffold:
    desc: 'Deprecated alias for `chore config:scaffold`'
    cmds:
      - task: config:scaffold
        vars: { DOMAIN: '{{.DOMAIN}}' }

  instance:certs:issue:
    desc: "Issue/validate CONFIG's serving cert into the certs volume (provider = cert_provider: testbed-certgen | manual | acme)"
    vars:
      CERTS_VOLUME: '{{.RESTMAIL_CERTS_VOLUME | default "testbed_certs"}}'
      CERTGEN_IMAGE: '{{.CERTGEN_IMAGE | default "ghcr.io/rest-mail/reference-certgen"}}'
      CERTGEN_TAG: '{{.CERTGEN_TAG | default "2026.04.28"}}'
      # cert_provider selects the branch below. Rendered as RESTMAIL_CERT_PROVIDER
      # only when NON-default, so an absent var means the testbed default —
      # byte-identical to before.
      CERT_PROVIDER: '{{.RESTMAIL_CERT_PROVIDER | default "testbed-certgen"}}'
      # The COMPLETE SAN list one instance cert must cover: served hostnames ∪
      # tls.extra_hostnames (render.go CertSANHostnames → RESTMAIL_TLS_CERT_SANS).
      # Single-domain instances with no extras render no line, so this falls back
      # to RESTMAIL_HOSTNAME — the exact single-name value issued before, keeping the
      # e2e testbed path unchanged. This resolves #99's deferred multi-name SAN
      # derivation: the full list is now built and passed to the issuer.
      CERT_SANS: '{{.RESTMAIL_TLS_CERT_SANS | default .RESTMAIL_HOSTNAME}}'
    cmds:
      - |
        case "{{.CERT_PROVIDER}}" in
          testbed-certgen)
            # Default (testbed): reference-certgen issues one cert covering
            # CERT_SANS. For a single-domain instance that is a single hostname
            # (byte-identical to before); for multi-domain / extra_hostnames it is
            # the full comma-separated SAN list. Idempotent + CA-preserving.
            docker run --rm \
              -v "{{.CERTS_VOLUME}}:/certs" \
              -e CERTGEN_DOMAINS="{{.CERT_SANS}}" \
              {{.CERTGEN_IMAGE}}:{{.CERTGEN_TAG}}
            ;;
          manual)
            # The deployer drops the serving cert/key into the certs volume out of
            # band; we ONLY validate presence and never issue. SNICertLoader serves
            # <hostname>.{crt,key} by SNI and falls back to the primary cert for any
            # name it lacks a per-name file for — so a single multi-SAN cert named
            # after the primary hostname is sufficient (it must list every SAN).
            docker run --rm -v "{{.CERTS_VOLUME}}:/certs:ro" alpine:3 sh -euc '
              sans=$(echo "$1" | tr "," " "); set -- $sans; primary="$1"; shift
              if [ ! -f "/certs/${primary}.crt" ] || [ ! -f "/certs/${primary}.key" ]; then
                echo "cert_provider=manual: MISSING /certs/${primary}.{crt,key} — drop the serving cert+key (covering SANs: ${sans}) into volume {{.CERTS_VOLUME}}" >&2
                exit 1
              fi
              echo "cert_provider=manual: ok — ${primary}.{crt,key} present (fallback + primary SNI cert)"
              for h in "$@"; do
                if [ -f "/certs/${h}.crt" ] && [ -f "/certs/${h}.key" ]; then
                  echo "  ok: per-name ${h}.{crt,key} present"
                else
                  echo "  note: no per-name ${h}.{crt,key} — SNI for ${h} uses the ${primary} fallback, which must list ${h} as a SAN"
                fi
              done
            ' _ "{{.CERT_SANS}}"
            ;;
          acme|letsencrypt|letsencrypt-http01|letsencrypt-dns01)
            echo "cert_provider={{.CERT_PROVIDER}}: ACME/Let's Encrypt issuance is not yet implemented (PR5 wires the tls.acme: manifest fields through; the ACME client is a later PR)." >&2
            echo "  Use cert_provider: manual (drop cert/key into the certs volume) or testbed-certgen (the testbed reference CA) for now." >&2
            echo "  Declared SAN set: {{.CERT_SANS}}" >&2
            exit 2
            ;;
          *)
            echo "cert_provider={{.CERT_PROVIDER}}: unknown provider (want testbed-certgen | manual | acme)." >&2
            exit 2
            ;;
        esac

  instance:mtls:issue:
    desc: "Provision internal-mTLS certs for CONFIG into the certs volume (source = tls.internal.ca_source: testbed-certgen | manual)"
    vars:
      CERTS_VOLUME: '{{.RESTMAIL_CERTS_VOLUME | default "testbed_certs"}}'
      # tls.internal.ca_source (render.go → RESTMAIL_INTERNAL_CA_SOURCE) selects
      # the provisioning branch. Rendered only when NON-default, so an absent var
      # means the testbed default — byte-identical to before.
      CA_SOURCE: '{{.RESTMAIL_INTERNAL_CA_SOURCE | default "testbed-certgen"}}'
    cmds:
      - |
        case "{{.CA_SOURCE}}" in
          testbed-certgen)
            # Default (testbed): mint a DEDICATED internal CA + an API server cert
            # (SANs cover the api container IP + localhost + the instance hostname)
            # + a gateway client cert into /certs, using the in-repo certgen (built
            # inside a golang container so it is arch-correct for the volume).
            # Idempotent: an existing internal CA is reused and leaves already
            # present are skipped, so it is safe to re-run and safe to run even when
            # the instance has not enabled internal mTLS (the certs simply go unused).
            docker run --rm \
              -v "{{.CERTS_VOLUME}}:/certs" \
              -v "{{.ROOT_DIR}}:/src" -w /src \
              -v "$(go env GOMODCACHE):/go/pkg/mod:ro" \
              -v rest-mail-e2e-gocache:/root/.cache/go-build \
              -e GOFLAGS=-buildvcs=false \
              golang:1.25 \
              go run ./cmd/certgen --internal-mtls --out /certs \
                --server-ip 127.0.0.1,{{.RESTMAIL_API_IP}} \
                --server-dns api,localhost,{{.RESTMAIL_HOSTNAME}}
            ;;
          manual)
            # The deployer provisions the internal trust domain out of band (their
            # own CA/PKI) and drops the material into the certs volume; we ONLY
            # validate presence and never issue. The five files are the internal CA
            # + the API server keypair + the gateway client keypair, at the fixed
            # /certs/internal-* paths the api/gateway task env vars point at
            # (INTERNAL_MTLS_CA_CERT / _SERVER_* / _CLIENT_*).
            docker run --rm -v "{{.CERTS_VOLUME}}:/certs:ro" alpine:3 sh -euc '
              missing=0
              for f in internal-ca.crt internal-server.crt internal-server.key internal-client.crt internal-client.key; do
                if [ ! -f "/certs/$f" ]; then
                  echo "ca_source=manual: MISSING /certs/$f — drop the internal CA + server/client cert material into volume {{.CERTS_VOLUME}}" >&2
                  missing=1
                fi
              done
              [ "$missing" = 0 ] || exit 1
              echo "ca_source=manual: ok — internal CA + server + client material present"
            '
            ;;
          *)
            echo "ca_source={{.CA_SOURCE}}: unknown internal-CA source (want testbed-certgen | manual)." >&2
            exit 2
            ;;
        esac

  instance:dns:register:
    desc: "Publish <CONFIG>'s DNS to the testbed dnsmasq (requires the testbed running)"
    vars:
      FRAG_VOL: '{{.DNSMASQ_FRAGMENTS_VOLUME | default "testbed_dnsmasq_fragments"}}'
      DNSMASQ_CONTAINER: '{{.DNSMASQ_CONTAINER | default "testbed-dnsmasq"}}'
      DNSMASQ_IMAGE: '{{.DNSMASQ_IMAGE | default "ghcr.io/rest-mail/reference-dnsmasq"}}'
      DNSMASQ_TAG: '{{.DNSMASQ_TAG | default "2026.04.28"}}'
    cmds:
      # Reuses reference-dnsmasq's render-fragment with rest-mail's split-gateway
      # template. restmail.test is currently also declared statically in the testbed
      # repo's zones.conf; scaffolded instances rely on this dynamic path.
      - go run ./cmd/instance dns-env -o {{.CONFIG_DIR}}/dns.env {{.CONFIG_DIR}}/manifest.yml
      - |
        docker run --rm \
          -v "{{.FRAG_VOL}}:/dst" \
          -v "$(pwd)/{{.CONFIG_DIR}}/dns.env:/env:ro" \
          -v "$(pwd)/projects/dnsmasq/fragment.tmpl:/tmpl:ro" \
          {{.DNSMASQ_IMAGE}}:{{.DNSMASQ_TAG}} \
          render-fragment --name {{.CONFIG}} --project {{.RESTMAIL_PROJECT}}
      - |
        if docker ps -aq --filter "name=^/{{.DNSMASQ_CONTAINER}}$" | grep -q .; then
          docker restart {{.DNSMASQ_CONTAINER}} >/dev/null && echo "  reloaded {{.DNSMASQ_CONTAINER}}"
        else
          echo "  note: {{.DNSMASQ_CONTAINER}} not running — fragment written, applies when the testbed dnsmasq starts"
        fi
      # Additional served domains (manifest `domains:` list): one dnsmasq
      # fragment each, over the SAME instance gateways (only the
      # hostname/MX/MTA-STS differ). Guarded on RESTMAIL_SERVED_HOSTNAMES, so this
      # is a no-op for single-domain instances — their registration is unchanged.
      - |
        {{if .RESTMAIL_SERVED_HOSTNAMES}}
        set -e
        # Each iteration reuses the gitignored dns.env (rendered → consumed by
        # the fragment render immediately) so no new repo-tracked artifact is
        # introduced; the per-domain identity lives in the fragment --name.
        go run ./cmd/instance domains -additional {{.CONFIG_DIR}}/manifest.yml |
        while IFS= read -r line; do
          name=$(printf '%s' "$line" | cut -f1)
          [ -n "$name" ] || continue
          slug=$(echo "$name" | cut -d. -f1)
          go run ./cmd/instance dns-env -domain "$name" -o "{{.CONFIG_DIR}}/dns.env" {{.CONFIG_DIR}}/manifest.yml
          docker run --rm \
            -v "{{.FRAG_VOL}}:/dst" \
            -v "$(pwd)/{{.CONFIG_DIR}}/dns.env:/env:ro" \
            -v "$(pwd)/projects/dnsmasq/fragment.tmpl:/tmpl:ro" \
            {{.DNSMASQ_IMAGE}}:{{.DNSMASQ_TAG}} \
            render-fragment --name "{{.CONFIG}}-$slug" --project {{.RESTMAIL_PROJECT}}
          echo "  registered DNS for served domain $name"
        done
        if docker ps -aq --filter "name=^/{{.DNSMASQ_CONTAINER}}$" | grep -q .; then
          docker restart {{.DNSMASQ_CONTAINER}} >/dev/null && echo "  reloaded {{.DNSMASQ_CONTAINER}} (served domains)"
        fi
        {{end}}

  instance:dns:unregister:
    desc: "Remove <CONFIG>'s DNS fragment from the testbed dnsmasq"
    vars:
      FRAG_VOL: '{{.DNSMASQ_FRAGMENTS_VOLUME | default "testbed_dnsmasq_fragments"}}'
      DNSMASQ_CONTAINER: '{{.DNSMASQ_CONTAINER | default "testbed-dnsmasq"}}'
      DNSMASQ_IMAGE: '{{.DNSMASQ_IMAGE | default "ghcr.io/rest-mail/reference-dnsmasq"}}'
      DNSMASQ_TAG: '{{.DNSMASQ_TAG | default "2026.04.28"}}'
    cmds:
      - |
        docker run --rm -v "{{.FRAG_VOL}}:/dst" \
          {{.DNSMASQ_IMAGE}}:{{.DNSMASQ_TAG}} remove-fragment --name {{.CONFIG}}
      - |
        if docker ps -aq --filter "name=^/{{.DNSMASQ_CONTAINER}}$" | grep -q .; then
          docker restart {{.DNSMASQ_CONTAINER}} >/dev/null && echo "  reloaded {{.DNSMASQ_CONTAINER}}"
        fi

  instance:dkim:
    desc: "Provision DKIM for CONFIG (keygen + install via admin API + publish DNS); needs the stack up"
    vars:
      FRAG_VOL: '{{.DNSMASQ_FRAGMENTS_VOLUME | default "testbed_dnsmasq_fragments"}}'
      DNSMASQ_CONTAINER: '{{.DNSMASQ_CONTAINER | default "testbed-dnsmasq"}}'
      ADMIN_USER: '{{.ADMIN_USER | default "admin"}}'
      ADMIN_PASS: '{{.ADMIN_PASS | default "admin123!@"}}'
    cmds:
      - |
        set -e
        # Provision inside the api container (API at localhost:8080 — works for
        # mailnet-only instances). The txt-record line is the last stdout line;
        # redirect it to a host file (the repo is Docker-shared), then copy that
        # into the fragments volume and reload. Avoids docker-stdin/quoted-env,
        # which Task's embedded shell doesn't pass through cleanly.
        # --selector/-bits come from the manifest `dkim:` block (rendered as
        # RESTMAIL_DKIM_SELECTOR/RESTMAIL_DKIM_BITS). Each flag is passed only when set,
        # so an unset knob falls through to dkim-provision's own default
        # (selector "default", 2048 bits). The DKIM PRIVATE KEY is never in the
        # manifest — dkim-provision generates it and installs it via the admin
        # API here at runtime.
        docker exec {{.RESTMAIL_PROJECT}}-api \
          go run ./cmd/instance dkim-provision \
            --domain {{.RESTMAIL_HOSTNAME}} \
            --admin-user "{{.ADMIN_USER}}" --admin-pass "{{.ADMIN_PASS}}" \
            {{if .RESTMAIL_DKIM_SELECTOR}}--selector {{.RESTMAIL_DKIM_SELECTOR}}{{end}} \
            {{if .RESTMAIL_DKIM_BITS}}-bits {{.RESTMAIL_DKIM_BITS}}{{end}} \
          2>/dev/null | tail -1 > "{{.CONFIG_DIR}}/dkim.conf"
        docker run --rm \
          -v "{{.ROOT_DIR}}/{{.CONFIG_DIR}}:/src:ro" \
          -v "{{.FRAG_VOL}}:/dst" \
          alpine:3.20 cp /src/dkim.conf /dst/11-{{.CONFIG}}-dkim.conf
        docker restart {{.DNSMASQ_CONTAINER}} >/dev/null
        echo "  DKIM provisioned + published for {{.RESTMAIL_HOSTNAME}}"
      # Additional served domains (manifest `domains:` list): provision DKIM per
      # domain. Selector/bits come from each domains: entry (via
      # `instance domains -additional`); an empty field falls through to
      # dkim-provision's own default (selector "default", 2048 bits), exactly
      # like the primary above. Each domain must already have a DB row (db:seed
      # created it from SEED_SERVED_DOMAINS). Guarded on RESTMAIL_SERVED_HOSTNAMES,
      # so single-domain instances are a no-op — their DKIM path is unchanged.
      - |
        {{if .RESTMAIL_SERVED_HOSTNAMES}}
        set -e
        # Each iteration reuses the gitignored dkim.conf (rendered → consumed →
        # copied to a per-domain fragment name in the volume) so no new
        # repo-tracked artifact is introduced; the per-domain identity lives in
        # the dnsmasq fragment filename (11-<instance>-<slug>-dkim.conf).
        go run ./cmd/instance domains -additional {{.CONFIG_DIR}}/manifest.yml |
        while IFS= read -r line; do
          name=$(printf '%s' "$line" | cut -f1)
          [ -n "$name" ] || continue
          sel=$(printf '%s' "$line" | cut -f3)
          bits=$(printf '%s' "$line" | cut -f4)
          slug=$(echo "$name" | cut -d. -f1)
          docker exec {{.RESTMAIL_PROJECT}}-api \
            go run ./cmd/instance dkim-provision \
              --domain "$name" \
              --admin-user "{{.ADMIN_USER}}" --admin-pass "{{.ADMIN_PASS}}" \
              ${sel:+--selector "$sel"} ${bits:+-bits "$bits"} \
            2>/dev/null | tail -1 > "{{.CONFIG_DIR}}/dkim.conf"
          docker run --rm \
            -v "{{.ROOT_DIR}}/{{.CONFIG_DIR}}:/src:ro" \
            -v "{{.FRAG_VOL}}:/dst" \
            alpine:3.20 cp "/src/dkim.conf" "/dst/11-{{.CONFIG}}-$slug-dkim.conf"
          echo "  DKIM provisioned + published for $name"
        done
        docker restart {{.DNSMASQ_CONTAINER}} >/dev/null
        {{end}}

  instance:dkim:check:
    desc: "Assert the DB DKIM selector for each served domain matches CONFIG's manifest (drift detection); needs the stack up"
    vars:
      ADMIN_USER: '{{.ADMIN_USER | default "admin"}}'
      ADMIN_PASS: '{{.ADMIN_PASS | default "admin123!@"}}'
    cmds:
      # Run inside the api container so the API is reachable at localhost:8080
      # (works for mailnet-only instances) and the manifest is on the shared repo
      # mount. Exits non-zero — failing the task — on any selector drift.
      - |
        docker exec {{.RESTMAIL_PROJECT}}-api \
          go run ./cmd/instance dkim-check \
            --admin-user "{{.ADMIN_USER}}" --admin-pass "{{.ADMIN_PASS}}" \
            {{.CONFIG_DIR}}/manifest.yml

  # ── Bring-up (instance-generic; restmail:* are back-compat aliases) ──

  instance:up:
    desc: 'Bring up an instance: --type rest-mail|reference --name <domain>'
    # The dispatcher itself reads no config — it only decides which backend runs,
    # and the backend it picks loads (or declines) the environment on its own. Left
    # inheriting, `chore instance:up --type reference --name mail1.test` would fail
    # on a missing config/mail1.test/config.env before it could hand off.
    dotenv: []
    # type is an ARGUMENT, exactly like config — an instance's nature is not a
    # property recorded in its manifest, it is what you asked to launch. `name` is
    # an alias for `config`, so `--name mail1.test`, `--config mail1.test`,
    # `CONFIG=mail1.test` and a bare first word all mean the same thing.
    args:
      - {name: config, desc: 'which instance (a domain), default restmail.test'}
      - {name: type, desc: 'rest-mail (this repo) or reference (Postfix/Dovecot peer)'}
      - {name: name, desc: 'alias for config'}
    vars:
      TYPE: rest-mail
      NAME: ''
    cmds:
      # One verb, two backends. Adding a third means adding one task, not another
      # flag to read here.
      - task: 'instance:up:{{.TYPE | default "rest-mail"}}'

  instance:up:rest-mail:
    desc: "Bring up a rest-mail instance (this repo's Go stack) — see instance:up"
    deps: [instance:require]
    args: [config, name]
    vars:
      NAME: ''
    cmds:
      - task: postgres:up
      - |
        echo "  waiting for postgres to become healthy..."
        for i in $(seq 1 30); do
          status=$(docker inspect -f '{{`{{.State.Health.Status}}`}}' {{.RESTMAIL_PROJECT}}-postgres 2>/dev/null || echo "starting")
          if [ "$status" = "healthy" ]; then
            echo "  postgres healthy"
            break
          fi
          sleep 1
        done
      - task: js-filter:up
      - task: api:up
      - task: health:wait
      - task: db:seed
      - task: smtp-gateway:up
      - task: imap-gateway:up
      - task: pop3-gateway:up
      - task: gateways:wait
      - task: webmail:up
      - task: admin:up
      - task: status

  # A reference instance is a traditional Postfix/Dovecot server, and its stack is
  # defined in rest-mail/reference-mailserver. This repo does NOT reimplement it:
  # it drives that project's own tasks, so there is one source of truth for what a
  # reference server is and no chance of the two drifting.
  #
  # CHORE_BIN is the runner currently executing, not whatever `chore` happens to be
  # first on PATH — otherwise testing a local build silently delegates to the
  # installed one.
  #
  # The peer project names its instances by the first label of the domain
  # (mail1.test → CONFIG=mail1), which is what ${CONFIG%%.*} strips to.
  instance:up:reference:
    # No dotenv: a reference instance's environment belongs to the peer repo, which
    # owns configs/mail1. This repo's root file requires config/<CONFIG>/config.env,
    # which is right for every task that operates on a rest-mail config and wrong
    # for one whose job is to hand off.
    dotenv: []
    desc: 'Bring up a reference (Postfix/Dovecot) instance — see instance:up'
    args: [config, name]
    vars:
      NAME: ''
    deps: [mailserver:require]
    cmds:
      - |
        ref="${CONFIG%%.*}"
        echo "  reference instance {{.CONFIG}} → reference-mailserver CONFIG=$ref"
        "${CHORE_BIN:-chore}" -C .workspace/reference-mailserver up CONFIG="$ref"

  instance:down:reference:
    # No dotenv: a reference instance's environment belongs to the peer repo, which
    # owns configs/mail1. This repo's root file requires config/<CONFIG>/config.env,
    # which is right for every task that operates on a rest-mail config and wrong
    # for one whose job is to hand off.
    dotenv: []
    desc: 'Stop a reference instance, keeping its volumes — see instance:down'
    args: [config, name]
    vars:
      NAME: ''
    deps: [mailserver:require]
    cmds:
      - |
        ref="${CONFIG%%.*}"
        "${CHORE_BIN:-chore}" -C .workspace/reference-mailserver down CONFIG="$ref"

  instance:require:
    desc: 'Fail if CONFIG names no config dir, rather than acting on the default'
    internal: true
    dotenv: []
    cmds:
      - |
        if [ ! -d "config/{{.CONFIG}}" ]; then
          echo "ERROR: no config/{{.CONFIG}} — refusing to fall back to a default." >&2
          echo "  rest-mail instances:  chore config:scaffold {{.CONFIG}}" >&2
          echo "  reference servers:    chore instance:up --type reference --name {{.CONFIG}}" >&2
          exit 1
        fi

  mailserver:require:
    desc: 'Fail with instructions if the reference-mailserver clone is missing'
    internal: true
    dotenv: []   # a clone check needs no config's environment
    cmds:
      - |
        if [ ! -f .workspace/reference-mailserver/chores.yml ]; then
          echo "ERROR: .workspace/reference-mailserver is not cloned." >&2
          echo "  run: chore mailserver:init" >&2
          exit 1
        fi

  instance:down:
    desc: 'Stop an instance: --type rest-mail|reference --name <domain>'
    # The dispatcher itself reads no config — it only decides which backend runs,
    # and the backend it picks loads (or declines) the environment on its own. Left
    # inheriting, `chore instance:up --type reference --name mail1.test` would fail
    # on a missing config/mail1.test/config.env before it could hand off.
    dotenv: []
    args:
      - {name: config, desc: 'which instance (a domain), default restmail.test'}
      - {name: type, desc: 'rest-mail or reference'}
      - {name: name, desc: 'alias for config'}
    vars:
      TYPE: rest-mail
      NAME: ''
    cmds:
      # The resolved values are passed EXPLICITLY. A positional argument binds to
      # the task you named, not to the tasks it calls, so without this the backend
      # re-defaults: `chore instance:down mail1` stopped the DEFAULT stack instead
      # of anything called mail1, reporting success while acting on the wrong one.
      - task: 'instance:down:{{.TYPE | default "rest-mail"}}'
        vars:
          CONFIG: '{{.CONFIG}}'
          NAME: '{{.CONFIG}}'

  instance:down:rest-mail:
    desc: "Stop a rest-mail instance's stack (preserves data volumes)"
    deps: [instance:require]
    args: [config, name]
    vars:
      NAME: ''
    cmds:
      - task: admin:down
      - task: webmail:down
      - task: pop3-gateway:down
      - task: imap-gateway:down
      - task: smtp-gateway:down
      - task: api:down
      - task: js-filter:down
      - task: postgres:down

  instance:restart:
    desc: "Stop + recreate CONFIG's stack"
    args: [config]
    cmds:
      - task: instance:down
      - task: instance:up

  instance:logs:
    desc: 'Alias for `chore status`'
    cmds:
      - task: status

  instance:new:
    desc: 'Spin up a new instance end-to-end (scaffold → cert → mTLS → DNS → up → DKIM): chore instance:new DOMAIN=mail4.test'
    cmds:
      - |
        if [ -z "{{.DOMAIN}}" ]; then
          echo "usage: chore instance:new DOMAIN=<domain>" >&2
          exit 2
        fi
      - task: config:scaffold
        vars: { DOMAIN: '{{.DOMAIN}}' }
      # Re-invoke with CONFIG set so the freshly-scaffolded config.env loads.
      - CONFIG={{.DOMAIN}} chore instance:certs:issue
      # Internal mTLS is secure-by-default for NEW instances (scaffold sets
      # internal_mtls: true → RESTMAIL_INTERNAL_MTLS=true), so ALWAYS provision the
      # dedicated CA + API server + gateway client certs before bring-up. Without
      # this the api would fail closed (enabled-but-uncertified). Idempotent.
      - CONFIG={{.DOMAIN}} chore instance:mtls:issue
      - CONFIG={{.DOMAIN}} chore instance:dns:register
      - CONFIG={{.DOMAIN}} chore instance:up
      - CONFIG={{.DOMAIN}} chore instance:dkim
      - |
        cat <<BANNER

          {{.DOMAIN}} is up — scaffolded, cert issued, DNS + DKIM published, seeded, running.
          Reachable on the mailnet; secondary instances are mailnet-only.

            Tear down:  CONFIG={{.DOMAIN}} chore instance:down

        BANNER

  # ════════════════════════════════════════════════════════
  # Utilities
  # ════════════════════════════════════════════════════════

  run:console:
    desc: Run the console admin tool inside the api container
    cmds:
      - docker exec -it -e RESTMAIL_ADMIN_USERNAME=${RESTMAIL_ADMIN_USERNAME:-admin} -e RESTMAIL_ADMIN_PASSWORD=${RESTMAIL_ADMIN_PASSWORD:-admin123!@} {{.RESTMAIL_PROJECT}}-api go run ./cmd/console --api http://localhost:{{.RESTMAIL_API_PORT}}

  setup:
    desc: Install dependencies, build all binaries, verify toolchain
    cmds:
      - echo "Checking Go..."
      - go version
      - echo "Downloading Go modules..."
      - go mod download
      - echo "Installing webmail dependencies..."
      - cd webmail && npm ci
      - echo "Verifying build..."
      - go build ./...
      - echo "Setup complete."

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf build/
      - rm -f coverage.out coverage.html

  purge:
    desc: Remove all rest-mail-* containers (does not touch volumes — use restmail:down + postgres:reset for data)
    cmds:
      - |
        ids=$(docker ps -aq --filter "name=^/{{.RESTMAIL_PROJECT}}-")
        if [ -n "$ids" ]; then
          docker rm -f $ids
        else
          echo "no rest-mail containers to remove"
        fi
